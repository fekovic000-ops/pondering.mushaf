var NBH={"0":[{"t":"قل: أعوذ بكلمات الله التامة من شر ما خلق وذرأ وبرأ، ومن شر ما ينزل من السماء ومن شر ما يعرج فيها، ومن شر فتن الليل والنهار، ومن شر كل طارق يطرق إلا طارقًا يطرق بخير يا رحمن","s":"رواه أحمد عن عبد الرحمن التميمي","v":1,"p":28,"d":1},{"t":"فإذا سألتم الله فسلوه الفردوس، فإنه أوسط الجنة وأعلى الجنة، وفوقه عرش الرحمن","s":"","v":1,"p":30,"d":1},{"t":"أولياء الله الذين إذا رؤوا ذُكر الله","s":"أخرجه ابن المبارك في الزهد والنسائي في الكبرى من حديث ابن عباس","v":1,"p":36,"d":1},{"t":"إن الله يؤتي الدنيا من يحب ومن لا يحب، ولا يؤتي الإيمان إلا من أحب","s":"أخرجه أحمد في مسنده من حديث ابن مسعود","v":1,"p":38,"d":1},{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك؟ قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة ورحيمهما، تعطيهما من تشاء وتمنع منهما من تشاء، ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"إن أحب أسمائكم إلى الله عبد الله وعبد الرحمن","s":"","v":1,"p":48,"d":1},{"t":"إن أخنع اسم عند الله رجل تسمى ملك الأملاك، لا مالك إلا الله","s":"متفق عليه عن أبي هريرة","v":1,"p":82,"d":1},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء","s":"","v":1,"p":83,"d":1},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله، قد مضى القلم بما هو كائن، فلو جهد الناس أن ينفعوك بما لم يقضه الله لك لم يقدروا عليه، ولو جهد الناس أن يضروك بما لم يكتبه الله عليك لم يقدروا عليه، فإن استطعت أن تعمل بالصبر مع اليقين فافعل، فإن لم تستطع فاصبر، فإن في الصبر على ما تكره خيرًا كثيرًا، واعلم أن النصر مع الصبر، وأن الفرج مع الكرب، وأن مع العسر يسرًا","s":"أخرجه الحاكم في المستدرك من حديث ابن عباس","v":1,"p":86,"d":1},{"t":"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد","s":"رواه البخاري ومسلم عن المغيرة بن شعبة","v":1,"p":97,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم، من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"فضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي من حديث أبي سعيد","v":1,"p":115,"d":1},{"t":"قال الله عز وجل: أنا عند ظن عبدي بي، وأنا معه حيث يذكرني، والله لله أفرح بتوبة عبده من أحدكم يجد ضالته بالفلاة، ومن تقرب إليّ شبرًا تقربت إليه ذراعًا، ومن تقرب إليّ ذراعًا تقربت إليه باعًا، وإذا أقبل إليّ يمشي أقبلت إليه أهرول","s":"","v":1,"p":138,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس... أنت رب المستضعفين وأنت ربي، إلى من تكلني؟ إلى بعيد يتجهمني أم إلى عدو ملّكته أمري؟ إن لم يكن بك غضب عليّ فلا أبالي، غير أن عافيتك أوسع لي","s":"أخرجه الطبراني في المعجم الكبير من حديث عبد الله بن جعفر","v":1,"p":166,"d":1},{"t":"إن الله قال: من عادى لي وليًا فقد آذنته بالحرب، وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه، وما يزال عبدي يتقرب إليّ بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده التي يبطش بها، ورجله التي يمشي بها، ولئن سألني لأعطينه، ولئن استعاذني لأعيذنه، وما ترددت عن شيء أنا فاعله ترددي عن نفس المؤمن، يكره الموت وأنا أكره مساءته","s":"صحيح البخاري","v":1,"p":170,"d":1},{"t":"لا إله إلا الله الواحد القهار، رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"اللهم اهدني فيمن هديت، وعافني فيمن عافيت","s":"","v":1,"p":180,"d":1},{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":1},{"t":"اللهم اهدِ قومي فإنهم لا يعلمون","s":"البيهقي في شعب الإيمان عن عبد الله بن عبيد","v":1,"p":209,"d":1},{"t":"إن الله تعالى تجاوز لأمتي ما وسوست به صدورها ما لم تعمل به أو تتكلم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن أبي هريرة","v":1,"p":249,"d":1},{"t":"لو لم يكن لكم ذنوب يغفرها الله لكم لجاء الله بقوم لهم ذنوب يغفرها لهم","s":"","v":1,"p":250,"d":1},{"t":"اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت","s":"أخرجه أبو داود عن بريدة بن الخصيب","v":1,"p":255,"d":1},{"t":"إن فيك خصلتين يحبهما الله ورسوله: الحلم والأناة","s":"","v":1,"p":269,"d":1},{"t":"ليس أحد أحب إليه المدح من الله، من أجل ذلك مدح نفسه، وليس أحد أغير من الله، من أجل ذلك حرّم الفواحش","s":"رواه مسلم من حديث عبد الله بن مسعود","v":1,"p":277,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"اللهم لك الحمد أنت قيّم السماوات والأرض ومن فيهن، ولك الحمد لك ملك السماوات والأرض ومن فيهن، ولك الحمد أنت نور السماوات والأرض ومن فيهن...","s":"أخرجه البخاري","v":1,"p":313,"d":1},{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم، ثم قال: اللهم اغفر لي، أو دعا، استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"وفضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي عن أبي سعيد وقال: حسن غريب","v":1,"p":320,"d":1},{"t":"إن الله كريم يحب الكرم، ويحب معالي الأخلاق ويكره سفسافها","s":"أخرجه الحاكم عن سهل بن سعد الساعدي","v":1,"p":326,"d":1},{"t":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله العظيم، سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"عجبت لأمر المؤمن، إن أمره كله خير، إن أصابه ما يحب حمد الله وكان له خير، وإن أصابه ما يكره فصبر كان له خير","s":"أخرجه أحمد في مسنده","v":1,"p":350,"d":1},{"t":"من لم يشكر الناس لم يشكر الله","s":"رواه الإمام أحمد والترمذي من حديث أبي هريرة","v":1,"p":379,"d":1},{"t":"والله في عون العبد ما كان العبد في عون أخيه","s":"رواه مسلم من حديث أبي هريرة","v":1,"p":383,"d":1},{"t":"كيف أنعم وقد التقم صاحب القرن القرن واستمع الإذن متى يؤمر بالنفخ فينفخ؟ فكأن ذلك ثقل على أصحاب رسول الله ﷺ، فقال لهم: قولوا: حسبنا الله ونعم الوكيل، على الله توكلنا","s":"الترمذي عن أبي سعيد الخدري","v":1,"p":388,"d":1},{"t":"لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير، تغدو خماصًا وتروح بطانًا","s":"","v":1,"p":393,"d":1},{"t":"اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت","s":"أخرجه الحاكم عن أنس بن مالك","v":1,"p":400,"d":1},{"t":"إن الله يلوم على العجز","s":"أخرجه أبو داود عن عوف بن مالك","v":1,"p":401,"d":1},{"t":"يا أبا بكر، ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":1},{"t":"علمنا رسول الله ﷺ خطبة الحاجة: إن الحمد لله نستعينه ونستغفره، ونعوذ به من شرور أنفسنا، من يهده الله فلا مضل له، ومن يضلل فلا هادي له، وأشهد أن لا إله إلا الله وأشهد أن محمدًا عبده ورسوله، ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾","s":"أخرجه أبو داود والترمذي والنسائي عن عبد الله بن مسعود","v":1,"p":404,"d":1},{"t":"فقال رجل: وما تزكية النفس؟ فقال: أن يعلم أن الله عز وجل معه حيث كان","s":"البيهقي في السنن","v":1,"p":405,"d":1},{"t":"إذا صلى أحدكم فليلبس ثوبيه، فإن الله أحق من تزين له","s":"","v":1,"p":412,"d":1},{"t":"ألا أنبئكم بأكبر الكبائر؟ - ثلاثًا - قلنا: بلى يا رسول الله، قال: الإشراك بالله، وعقوق الوالدين","s":"","v":1,"p":436,"d":1},{"t":"سلوا الله العفو والعافية واليقين في الآخرة والأولى","s":"أخرجه أحمد في مسنده","v":1,"p":463,"d":1},{"t":"اللهم اجعل رزق آل محمد قوتًا","s":"متفق عليه من حديث أبي هريرة","v":1,"p":479,"d":1},{"t":"اللهم من أحبني فاجعل رزقه قوتًا","s":"أخرجه البخاري ومسلم والترمذي عن أبي هريرة","v":1,"p":479,"d":1},{"t":"من أطعمه الله طعامًا فليقل: اللهم بارك لنا فيه","s":"","v":1,"p":480,"d":1},{"t":"زادك الله حرصًا ولا تعد","s":"أخرجه البخاري من حديث أبي بكرة","v":2,"p":15,"d":1},{"t":"اللهم أنت الله لا إله إلا أنت، أنت الغني ونحن الفقراء","s":"","v":2,"p":24,"d":1},{"t":"قال الله عز وجل: أنفق أنفق عليك، وقال: يد الله ملأى لا تغيضها نفقة، سحاء الليل والنهار، أرأيتم ما أنفق منذ خلق السماء والأرض؟ فإنه لم يغض ما في يده، وكان عرشه على الماء، وبيده الميزان يخفض ويرفع","s":"متفق عليه عن أبي هريرة","v":2,"p":27,"d":1},{"t":"اللهم احفظني بالإسلام قائمًا، واحفظني بالإسلام قاعدًا، واحفظني بالإسلام راقدًا، ولا تشمت بي عدوًا ولا حاسدًا، اللهم إني أسألك من كل خير خزائنه بيدك، وأعوذ بك من كل شر خزائنه بيدك","s":"أخرجه ابن حبان والحاكم وصححه","v":2,"p":73,"d":1},{"t":"سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق في المساجد، ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه، ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله، ورجل تصدق فأخفى حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خاليًا ففاضت عيناه","s":"متفق عليه عن أبي هريرة","v":2,"p":80,"d":1},{"t":"سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون، اللهم إنا نسألك في سفرنا هذا البر والتقوى ومن العمل ما ترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده، اللهم أنت الصاحب في السفر والخليفة في الأهل والمال","s":"رواه أبو داود في السنن","v":2,"p":83,"d":1},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":1},{"t":"احفظ الله يحفظك","s":"أخرجه الترمذي عن عبد الله بن عباس","v":2,"p":93,"d":1},{"t":"وبعث الله عز وجل الريح على المشركين فكفى الله المؤمنين القتال وكان الله قويًا عزيزًا","s":"رواه أحمد عن عائشة","v":2,"p":95,"d":1},{"t":"إن الله جميل يحب الجمال","s":"أخرجه مسلم وأبو داود والترمذي عن عبد الله بن مسعود","v":2,"p":112,"d":1},{"t":"... ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة...","s":"صحيح البخاري من حديث عبد الله بن عمر","v":2,"p":121,"d":1},{"t":"والله ما الدنيا في الآخرة إلا مثل ما يجعل أحدكم إصبعه هذه في اليم، فلينظر بم ترجع","s":"رواه أحمد والطبراني من حديث المستورد بن شداد","v":2,"p":123,"d":1},{"t":"أوتروا يا أهل القرآن، فإن الله وتر يحب الوتر","s":"رواه مسلم والترمذي","v":2,"p":144,"d":1},{"t":"والذي نفسي بيده لقد سأل الله باسمه الأعظم الذي إذا دعي به أجاب، وإذا سئل به أعطى","s":"رواه الترمذي وغيره","v":2,"p":144,"d":1},{"t":"لقد دعا الله باسمه الأعظم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"","v":2,"p":150,"d":1},{"t":"عجبت لها، فتحت لها أبواب السماء، قال ابن عمر: فما تركتهن منذ سمعت رسول الله ﷺ يقول ذلك","s":"صحيح مسلم","v":2,"p":168,"d":1},{"t":"إن الله يحب معالي الأمور وأشرافها، ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":2,"p":187,"d":1},{"t":"اللهم اقسم لنا من خشيتك ما يحول بيننا وبين معاصيك، ومن طاعتك ما تبلغنا به جنتك، ومن اليقين ما تهون به علينا مصيبات الدنيا، ومتعنا بأسماعنا وأبصارنا وقوتنا ما أحييتنا، واجعله الوارث منا، واجعل ثأرنا على من ظلمنا، وانصرنا على من عادانا، ولا تجعل مصيبتنا في ديننا، ولا تجعل الدنيا أكبر همنا ولا مبلغ علمنا","s":"","v":2,"p":203,"d":1},{"t":"إن الرجل ليعمل - وإن المرأة لتعمل - بطاعة الله ستين عامًا، ثم يحضرهما الموت فيضاران في الوصية، فتجب لهما النار","s":"أخرجه أبو داود والترمذي عن أبي هريرة","v":2,"p":204,"d":1},{"t":"أفضل الإيمان أن تعلم أن الله معك حيثما كنت","s":"","v":2,"p":226,"d":1},{"t":"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك...","s":"صحيح البخاري","v":2,"p":231,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم آخرته كفاه الله هم دنياه","s":"","v":2,"p":279,"d":1},{"t":"اللهم اجعل خير عمري آخره، واجعل خواتيم عملي رضوانك، واجعل خير أيامي يوم ألقاك","s":"أخرجه الطبراني في الأوسط من حديث أنس","v":2,"p":281,"d":1},{"t":"قال الله: أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر","s":"صحيح البخاري","v":2,"p":293,"d":1},{"t":"إن الله حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه الترمذي من حديث سلمان الفارسي","v":2,"p":313,"d":1},{"t":"ما من رجل يدعو الله بدعاء إلا استجيب له، فإما أن يعجل له في الدنيا، وإما أن يدخر له في الآخرة، وإما أن يكفر عنه من ذنوبه بقدر ما دعا، ما لم يدع بإثم أو قطيعة رحم أو يستعجل. قالوا: يا رسول الله وكيف يستعجل؟ قال: يقول: دعوت ربي فلم يستجب لي","s":"متفق عليه عن أبي هريرة","v":2,"p":321,"d":1},{"t":"القلوب أوعية، وبعضها أوعى من بعض، فإذا سألتم الله عز وجل أيها الناس فاسألوه وأنتم موقنون بالإجابة، فإن الله لا يستجيب لعبد دعاه عن ظهر قلب غافل","s":"أخرجه الإمام أحمد عن عبد الله بن عمرو","v":2,"p":321,"d":1},{"t":"اللهم إني أعوذ بك من العجز والكسل والبخل والهرم وعذاب القبر، اللهم آتِ نفسي تقواها، وزكها أنت خير من زكاها، أنت وليها ومولاها، اللهم إني أعوذ بك من علم لا ينفع، ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها","s":"أخرجه مسلم والترمذي والنسائي عن زيد بن أرقم","v":2,"p":321,"d":1},{"t":"اللهم إنك عفو تحب العفو فاعف عني","s":"رواه أحمد وابن ماجه والترمذي وصححه","v":2,"p":341,"d":1},{"t":"إن آل أبي ليسوا بأوليائي، إنما وليي الله وصالح المؤمنين، ولكن لهم رحم أبلها ببلالها","s":"أخرجه أبو داود والترمذي عن أبي سعيد الخدري","v":2,"p":344,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله هم دنياه، ومن تشعبت به الهموم في أحوال الدنيا لم يبال الله في أي أوديتها هلك","s":"رواه الديلمي في الفردوس من حديث أنس","v":2,"p":370,"d":1},{"t":"اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك","s":"رواه مسلم من حديث ابن عمر","v":2,"p":384,"d":1},{"t":"إذا اشتكيت فضع يدك حيث تشتكي ثم قل: بسم الله، أعوذ بعزة الله وقدرته من شر ما أجد من وجعي هذا، ثم ارفع يدك، ثم أعد ذلك وترًا","s":"رواه الترمذي والحاكم من حديث أنس بن مالك","v":2,"p":390,"d":1},{"t":"رب أشعث مدفوع بالأبواب لو أقسم على الله لأبره","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":396,"d":1},{"t":"عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقًا، وإياكم والكذب، فإن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار، وما يزال العبد يكذب ويتحرى الكذب حتى يكتب عند الله كذابًا","s":"متفق عليه من حديث عبد الله بن مسعود","v":2,"p":398,"d":1},{"t":"يا أيها الناس! إن الله قد أذهب عنكم عبية الجاهلية وتعاظمها بآبائها، فالناس رجلان: برّ تقي كريم على الله، وفاجر شقي هين على الله، والناس بنو آدم، وآدم من تراب","s":"","v":2,"p":402,"d":1},{"t":"لقد رفعوا إليّ في الجنة فيما يرى النائم على سرر من ذهب، فرأيت في سرير عبد الله بن رواحة ازورارًا عن سريري صاحبيه، فقلت: بم هذا؟ فقيل لي: مضيا وتردد عبد الله بن رواحة بعض التردد ثم مضى","s":"رواه الطبراني ورجاله ثقات من حديث عبد الله بن الزبير","v":2,"p":404,"d":1},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب","s":"","v":2,"p":422,"d":1},{"t":"فلا تقل: لو أني فعلت لكان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن لو تفتح عمل الشيطان","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":423,"d":1},{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"كان الله ولم يكن شيء غيره","s":"","v":2,"p":435,"d":1},{"t":"كان الله ولم يكن شيء غيره، وكان عرشه على الماء، وكتب في الذكر كل شيء، وخلق السماوات والأرض","s":"رواه البخاري","v":2,"p":436,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"وجهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له وبذلك أمرت وأنا من المسلمين، اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك...","s":"أخرجه مسلم وأبو داود والترمذي والنسائي","v":2,"p":476,"d":1},{"t":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":3,"p":7,"d":1},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"إنما أهلك الذين قبلكم أنهم كانوا إذا سرق فيهم الشريف تركوه، وإذا سرق فيهم الضعيف أقاموا عليه الحد، وايم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن عائشة أم المؤمنين","v":3,"p":13,"d":1},{"t":"إن السلام اسم من أسماء الله تعالى فأفشوه بينكم","s":"أخرجه الطبراني عن أبي هريرة","v":3,"p":21,"d":1},{"t":"إن الله عز وجل يقول يوم القيامة: يا ابن آدم مرضت فلم تعدني، قال: يا رب كيف أعودك وأنت رب العالمين؟ قال: أما علمت أن عبدي فلانًا مرض فلم تعده، أما علمت أنك لو عدته لوجدتني عنده...","s":"صحيح مسلم","v":3,"p":53,"d":1},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا... يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها، فمن وجد خيرًا فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه","s":"أخرجه مسلم والترمذي","v":3,"p":54,"d":1},{"t":"أتدرون ما الإيمان بالله وحده؟ قالوا: الله ورسوله أعلم، قال: شهادة أن لا إله إلا الله وأن محمدًا رسول الله","s":"","v":3,"p":55,"d":1},{"t":"اللهم أنت الصاحب في السفر والخليفة في الأهل","s":"","v":3,"p":65,"d":1},{"t":"اللهم اصحبنا في سفرنا، واخلفنا في أهلنا، اللهم إني أعوذ بك من وعثاء السفر وكآبة المنقلب","s":"","v":3,"p":65,"d":1},{"t":"إن الله يحب كل قلب حزين","s":"رواه الطبراني والحاكم عن أبي الدرداء","v":3,"p":93,"d":1},{"t":"قال الله عز وجل: الكبرياء ردائي والعظمة إزاري","s":"","v":3,"p":104,"d":1},{"t":"وإن الله أوحى إليّ أن تواضعوا حتى لا يفخر أحد على أحد ولا يبغي أحد على أحد","s":"صحيح مسلم من حديث عياض بن حمار","v":3,"p":112,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله سائر همومه","s":"","v":3,"p":117,"d":1},{"t":"إن لكل داء دواء، فإذا أصيب دواء الداء برأ بإذن الله","s":"أخرجه مسلم عن جابر بن عبد الله","v":3,"p":134,"d":1},{"t":"اللهم كما حسنت خلقي فحسن خلقي","s":"رواه البيهقي في الدعوات الكبير","v":3,"p":140,"d":1},{"t":"اللهم لا عيش إلا عيش الآخرة","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":3,"p":145,"d":1},{"t":"إن الله خلق آدم على صورته","s":"","v":3,"p":147,"d":1},{"t":"اللهم لك سجدت وبك آمنت ولك أسلمت، سجد وجهي للذي خلقه وصوره وشق سمعه وبصره، تبارك الله أحسن الخالقين","s":"أخرجه النسائي عن جابر بن عبد الله","v":3,"p":149,"d":1},{"t":"يا رسول الله! كيف يحشر أهل النار على وجوههم؟ قال: إن الذي أمشاهم على أقدامهم قادر أن يمشيهم على وجوههم","s":"أحمد عن أنس بن مالك","v":3,"p":151,"d":1},{"t":"إن الله لا يقدس أمة لا يأخذ الضعيف حقه من القوي","s":"أخرجه الحاكم عن أبي سفيان بن الحارث بن عبد المطلب","v":3,"p":160,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك؟ قال: قل: لا إله إلا الله الحليم الكريم، لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":1},{"t":"أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1},{"t":"إنك ستأتي قومًا أهل كتاب، فإذا جئتهم فادعهم إلى أن يشهدوا أن لا إله إلا الله وأن محمدًا رسول الله، فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم خمس صلوات في كل يوم وليلة، فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم صدقة تؤخذ من أغنيائهم فترد على فقرائهم","s":"أخرجه البخاري","v":3,"p":168,"d":1},{"t":"ليس أحد أصبر على أذى سمعه من الله تعالى، إنهم ليدعون له ولدًا وإنه ليعافيهم ويرزقهم","s":"متفق عليه من حديث أبي موسى الأشعري","v":3,"p":171,"d":1},{"t":"أحبوا الله لما يغذوكم به من نعمه، وأحبوني لحب الله، وأحبوا أهل بيتي لحبي","s":"رواه الترمذي من حديث ابن عباس","v":3,"p":216,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي","s":"رواه مسلم عن أبي هريرة","v":3,"p":243,"d":1},{"t":"إن الله يحب معالي الأمور وأشرافها ويكره سفسافها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":293,"d":1},{"t":"إن الله وملائكته يصلون على الصف المقدم، والمؤذن يغفر له مدى صوته ويصدقه من سمعه من رطب ويابس، وله مثل أجر من صلى معه","s":"أخرجه النسائي عن البراء بن عازب","v":3,"p":294,"d":1},{"t":"اللهم ربنا لك الحمد، أنت قيّم السماوات والأرض ومن فيهن","s":"","v":3,"p":307,"d":1},{"t":"فمن لم يأت الدعوة فقد عصى الله ورسوله","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":312,"d":1},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":3,"p":315,"d":1},{"t":"رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله وما أنت أعلم به مني، اللهم اغفر لي خطاياي وعمدي وجهلي وهزلي وكل ذلك عندي، اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"صحيح البخاري من حديث أبي موسى الأشعري","v":3,"p":318,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق، وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"ما مست يد رسول الله ﷺ يد امرأة قط","s":"أخرجه مسلم عن عائشة","v":3,"p":332,"d":1},{"t":"اللهم لك الحمد كله، اللهم لا قابض لما بسطت ولا باسط لما قبضت، ولا هادي لمن أضللت ولا مضل لمن هديت، ولا معطي لما منعت ولا مانع لما أعطيت، ولا مقرب لما باعدت ولا مباعد لما قربت، اللهم إني أسألك من بركتك ورحمتك وفضلك ورزقك","s":"أخرجه أبو داود عن أبي بن كعب","v":3,"p":348,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"من سره أن يبسط الله له في رزقه، وأن ينسأ له في أثره فليصل رحمه","s":"أخرجه البخاري والترمذي عن أبي هريرة","v":3,"p":351,"d":1},{"t":"هل تدرون ماذا قال ربكم؟ قالوا: الله ورسوله أعلم، قال: أصبح من عبادي مؤمن بي وكافر، فأما من قال: مطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب، وأما من قال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب","s":"أخرجه البخاري ومسلم عن زيد بن خالد الجهني","v":3,"p":356,"d":1},{"t":"إن الله يلوم على العجز، ولكن عليك بالكيس، فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":1},{"t":"ثلاثة حق على الله عونهم: المجاهد في سبيل الله، والمكاتب الذي يريد الأداء، والناكح الذي يريد العفاف","s":"أخرجه الترمذي والنسائي عن أبي هريرة","v":3,"p":363,"d":1},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء، ثم خلق السماوات والأرض، وكتب في الذكر كل شيء","s":"أخرجه البخاري والترمذي عن عمران بن حصين","v":3,"p":389,"d":1},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله","s":"أخرجه الحاكم في المستدرك","v":3,"p":392,"d":1},{"t":"اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب، وما زويت عني مما أحب فاجعله فراغًا لي فيما تحب","s":"أخرجه الترمذي عن عبد الله بن يزيد الخطمي","v":3,"p":478,"d":1},{"t":"اللهم فاطر السماوات والأرض، عالم الغيب والشهادة، أنت تحكم بين عبادك فيما كانوا فيه يختلفون","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن عائشة","v":3,"p":480,"d":1},{"t":"كان النبي ﷺ إذا قام من الليل يتهجد قال: اللهم لك الحمد، أنت نور السماوات والأرض ومن فيهن، ولك الحمد، اللهم بك آمنت ولك أسلمت وعليك توكلت وإليك أنبت وبك خاصمت وإليك حاكمت، فاغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"أخرجه مسلم وابن خزيمة","v":3,"p":481,"d":1},{"t":"اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"استحيوا من الله حق الحياء","s":"","v":4,"p":98,"d":1},{"t":"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك","s":"متفق عليه من حديث أبي هريرة","v":4,"p":99,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر","s":"رواه مسلم من حديث أبي هريرة","v":4,"p":153,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي","s":"","v":4,"p":169,"d":1},{"t":"اتقوا الله وأصلحوا ذات بينكم، فإن الله تعالى يصلح بين المسلمين","s":"أخرجه الحاكم في المستدرك","v":4,"p":198,"d":1},{"t":"فاتقوا الله واعدلوا بين أولادكم","s":"","v":4,"p":199,"d":1},{"t":"واتق دعوة المظلوم، فإنها ليس بينها وبين الله حجاب","s":"صحيح البخاري من حديث ابن عباس","v":4,"p":206,"d":1},{"t":"اللهم قني عذابك يوم تبعث عبادك","s":"رواه أحمد والترمذي والنسائي من حديث البراء بن عازب","v":4,"p":225,"d":1},{"t":"قال الله: أنفق يا ابن آدم أنفق عليك","s":"أخرجه البخاري","v":4,"p":299,"d":1},{"t":"أرحم أمتي بأمتي أبو بكر، وأشدهم في أمر الله عمر، وأصدقهم حياءً عثمان، وأقرؤهم لكتاب الله أبيّ بن كعب، وأفرضهم زيد بن ثابت، وأعلمهم بالحلال والحرام معاذ بن جبل، ألا وإن لكل أمة أمينًا، وإن أمين هذه الأمة أبو عبيدة بن الجراح","s":"رواه الترمذي","v":4,"p":366,"d":1},{"t":"أتدرون ما المفلس؟ قالوا: المفلس فينا من لا درهم له ولا متاع. قال: إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أُخذ من خطاياهم فطُرحت عليه ثم طُرح في النار","s":"","v":1,"p":241,"d":0},{"t":"من لم يدع قول الزور والعمل به فليس لله حاجة في أن يدع طعامه وشرابه","s":"أخرجه البخاري وأبو داود والترمذي وابن ماجه عن أبي هريرة","v":1,"p":242,"d":0}],"1":[{"t":"قل: أعوذ بكلمات الله التامة من شر ما خلق وذرأ وبرأ، ومن شر ما ينزل من السماء ومن شر ما يعرج فيها، ومن شر فتن الليل والنهار، ومن شر كل طارق يطرق إلا طارقًا يطرق بخير يا رحمن","s":"رواه أحمد عن عبد الرحمن التميمي","v":1,"p":28,"d":1},{"t":"أنا الرحمن، خلقت الرحم وشققت لها اسمًا من اسمي، فمن وصلها وصلته ومن قطعها قطعته","s":"البيهقي عن عبد الرحمن بن عوف","v":1,"p":28,"d":1},{"t":"فإذا سألتم الله فسلوه الفردوس، فإنه أوسط الجنة وأعلى الجنة، وفوقه عرش الرحمن","s":"","v":1,"p":30,"d":1},{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك؟ قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة ورحيمهما، تعطيهما من تشاء وتمنع منهما من تشاء، ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"الراحمون يرحمهم الرحمن، ارحموا أهل الأرض يرحمكم من في السماء","s":"","v":1,"p":48,"d":1},{"t":"إن أحب أسمائكم إلى الله عبد الله وعبد الرحمن","s":"","v":1,"p":48,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله العظيم، سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"إن قلوب بني آدم كلها بين إصبعين من أصابع الرحمن كقلب واحد يصرفه حيث يشاء","s":"مسلم والمسند","v":3,"p":76,"d":1},{"t":"أولياء الله الذين إذا رؤوا ذُكر الله","s":"أخرجه ابن المبارك في الزهد والنسائي في الكبرى من حديث ابن عباس","v":1,"p":36,"d":0},{"t":"إن الله يؤتي الدنيا من يحب ومن لا يحب، ولا يؤتي الإيمان إلا من أحب","s":"أخرجه أحمد في مسنده من حديث ابن مسعود","v":1,"p":38,"d":0},{"t":"عجب ربنا من قوم يقادون إلى الجنة بالسلاسل","s":"رواه أحمد والبخاري وأبو داود عن أبي هريرة","v":1,"p":41,"d":0},{"t":"إذا كان أمراؤكم خياركم، وأغنياؤكم سمحاءكم، وأموركم شورى بينكم، فظهر الأرض خير لكم من بطنها، وإذا كان أمراؤكم شراركم، وأغنياؤكم بخلاءكم، وأموركم إلى نسائكم، فبطن الأرض خير لكم من ظهرها","s":"","v":1,"p":46,"d":0}],"2":[{"t":"رب اغفر لي وتب عليّ إنك أنت التواب الرحيم","s":"","v":1,"p":137,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1}],"3":[{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك؟ قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة ورحيمهما، تعطيهما من تشاء وتمنع منهما من تشاء، ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"سبحان الملك القدوس","s":"أخرجه أبو داود والنسائي وابن ماجه وابن حبان عن أبي بن كعب","v":3,"p":5,"d":1},{"t":"اطلبوا الحوائج بعزة الأنفس، فإن الأمور تجري بالمقادير","s":"أخرجه ابن عساكر عن عبد الله بن بسر","v":2,"p":430,"d":0},{"t":"إن لله تسعة وتسعين اسمًا من أحصاها دخل الجنة","s":"رواه البخاري من حديث أبي هريرة","v":2,"p":475,"d":0},{"t":"وجهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له وبذلك أمرت وأنا من المسلمين، اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك...","s":"أخرجه مسلم وأبو داود والترمذي والنسائي","v":2,"p":476,"d":0},{"t":"ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب","s":"","v":2,"p":492,"d":0},{"t":"ولئن سألني لأعطينه ولئن استعاذني لأعيذنه","s":"","v":2,"p":493,"d":0}],"4":[{"t":"سبحان الملك القدوس","s":"أخرجه أبو داود والنسائي وابن ماجه وابن حبان عن أبي بن كعب","v":3,"p":5,"d":1},{"t":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":3,"p":7,"d":0},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":0},{"t":"إنما أهلك الذين قبلكم أنهم كانوا إذا سرق فيهم الشريف تركوه، وإذا سرق فيهم الضعيف أقاموا عليه الحد، وايم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن عائشة أم المؤمنين","v":3,"p":13,"d":0},{"t":"أيها الناس إياكم وشرك السرائر","s":"","v":3,"p":14,"d":0},{"t":"إن الرجل ليحرم الرزق بالذنب يصيبه","s":"رواه الإمام أحمد في مسنده من حديث ثوبان","v":3,"p":19,"d":0}],"5":[{"t":"إن السلام اسم من أسماء الله تعالى فأفشوه بينكم","s":"أخرجه الطبراني عن أبي هريرة","v":3,"p":21,"d":1},{"t":"اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"إن هذه القلوب تصدأ كما يصدأ الحديد... قيل: وما جلاؤها؟ قال: كثرة ذكر الموت وتلاوة القرآن","s":"","v":3,"p":33,"d":0},{"t":"أما في ثلاثة مواطن فلا يذكر أحد أحدًا: عند الميزان حتى يعلم أيخف ميزانه أو يثقل","s":"","v":3,"p":37,"d":0},{"t":"المسلم من سلم المسلمون من لسانه ويده","s":"أخرجه البخاري عن عبد الله بن عمرو","v":3,"p":39,"d":0}],"6":[{"t":"إن الله عز وجل يقول يوم القيامة: يا ابن آدم مرضت فلم تعدني، قال: يا رب كيف أعودك وأنت رب العالمين؟ قال: أما علمت أن عبدي فلانًا مرض فلم تعده، أما علمت أنك لو عدته لوجدتني عنده...","s":"صحيح مسلم","v":3,"p":53,"d":0},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا... يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها، فمن وجد خيرًا فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه","s":"أخرجه مسلم والترمذي","v":3,"p":54,"d":0},{"t":"أتدرون ما الإيمان بالله وحده؟ قالوا: الله ورسوله أعلم، قال: شهادة أن لا إله إلا الله وأن محمدًا رسول الله","s":"","v":3,"p":55,"d":0},{"t":"يؤذيني ابن آدم، يسب الدهر وأنا الدهر، بيدي الأمر، أقلب الليل والنهار","s":"","v":3,"p":57,"d":0},{"t":"المسلم من سلم المسلمون من لسانه ويده، والمؤمن من أمنه الناس على دمائهم وأموالهم","s":"","v":3,"p":58,"d":0}],"7":[{"t":"اللهم أنت الصاحب في السفر والخليفة في الأهل","s":"","v":3,"p":65,"d":0},{"t":"اللهم اصحبنا في سفرنا، واخلفنا في أهلنا، اللهم إني أعوذ بك من وعثاء السفر وكآبة المنقلب","s":"","v":3,"p":65,"d":0},{"t":"لله أرحم بعباده من هذه بولدها","s":"متفق عليه من حديث عمر بن الخطاب","v":3,"p":66,"d":0},{"t":"يا أبا بكر، ما ظنك باثنين الله ثالثهما","s":"متفق عليه من حديث أبي بكر الصديق","v":3,"p":76,"d":0},{"t":"إن قلوب بني آدم كلها بين إصبعين من أصابع الرحمن كقلب واحد يصرفه حيث يشاء","s":"مسلم والمسند","v":3,"p":76,"d":0}],"8":[{"t":"لا إله إلا الله الواحد القهار، رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال، فأقول: يا رب أصحابي، فيقول: إنك لا تدري ما أحدثوا بعدك، فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"اللهم اهدني فيمن هديت، وعافني فيمن عافيت","s":"","v":1,"p":180,"d":0},{"t":"لا ينبغي للمؤمن أن يذل نفسه، قالوا: وكيف يذل نفسه؟ قال: يتعرض من البلاء لما لا يطيق","s":"الترمذي من حديث حذيفة بن اليمان","v":1,"p":181,"d":0},{"t":"ابتغوا الحوائج بعزة الأنفس، فإن الأمور تجري بالمقادير","s":"أخرجه ابن عساكر عن عبد الله بن بسر","v":1,"p":181,"d":0},{"t":"البيّعان بالخيار ما لم يتفرقا، فإن صدقا وبيّنا بورك لهما في بيعهما، وإن كتما وكذبا فعسى أن يربحا ربحًا ويُمحق بركة بيعهما","s":"رواه الشيخان من حديث حكيم بن حزام","v":1,"p":193,"d":0},{"t":"من ابتغى أمرًا بمعصية كان أبعد مما رجا وأقرب مما اتقى","s":"","v":1,"p":193,"d":0}],"9":[{"t":"بئس العبد عبد تخيل واختال ونسي الكبير المتعال، بئس العبد عبد تجبر واعتدى ونسي الجبار الأعلى، بئس العبد عبد سها ولها ونسي المقابر والبلى، بئس العبد عبد عتا وطغى ونسي المبتدأ والمنتهى","s":"رواه الترمذي عن أسماء بنت عميس الخثعمية","v":3,"p":93,"d":1},{"t":"أنا الجبار، أنا المتكبر","s":"","v":3,"p":101,"d":1},{"t":"سبحان ذي الجبروت والملكوت والكبرياء والعظمة","s":"أخرجه أبو داود والنسائي عن عوف بن مالك","v":3,"p":91,"d":0},{"t":"الكبرياء ردائي والعظمة إزاري، فمن نازعني واحدًا منهما قذفته في النار","s":"أخرجه مسلم وأبو داود عن أبي سعيد الخدري وأبي هريرة","v":3,"p":91,"d":0},{"t":"إن الله يحب كل قلب حزين","s":"رواه الطبراني والحاكم عن أبي الدرداء","v":3,"p":93,"d":0}],"10":[{"t":"أنا الجبار، أنا المتكبر","s":"","v":3,"p":101,"d":1},{"t":"إن لله تسعة وتسعين اسمًا، مائة إلا واحدًا، من أحصاها دخل الجنة","s":"متفق عليه من حديث أبي هريرة","v":3,"p":101,"d":0},{"t":"الكبرياء ردائي، فمن نازعني ردائي قصمته","s":"أخرجه الحاكم في المستدرك من حديث أبي هريرة","v":3,"p":104,"d":0},{"t":"قال الله عز وجل: الكبرياء ردائي والعظمة إزاري","s":"","v":3,"p":104,"d":0},{"t":"وإن الله أوحى إليّ أن تواضعوا حتى لا يفخر أحد على أحد و
