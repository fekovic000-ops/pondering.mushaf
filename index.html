<script type="application/json" id="dd">[[1,1,"بِسْمِ ٱللَّهِ","أَيْ: أَبْتَدِئُ قِرَاءَتِي مُسْتَعِينًا بِاسْمِ اللهِ."],[1,1,"ٱلرَّحْمَٰنِ","الَّذِي وَسِعَتْ رَحْمَتُهُ جَمِيعَ الْخَلْقِ."],[1,1,"ٱلرَّحِيمِ","الَّذِي يَرْحَمُ الْمُؤْمِنِينَ."],[1,2,"رَبِّ","الرَّبُّ: الْمُرَبِّي لِخَلْقِهِ بِنِعَمِهِ."],[1,2,"ٱلْعَٰلَمِينَ","كُلُّ مَنْ سِوَى اللهِ تَعَالَى."],[1,4,"يَوْمِ ٱلدِّينِ","يَوْمُ الْجَزَاءِ وَالْحِسَابِ."],[1,5,"إِيَّاكَ نَعْبُدُ","لَا نَعْبُدُ إِلَّا أَنْتَ."],[1,5,"وَإِيَّاكَ نَسْتَعِينُ","لَا نَسْتَعِينُ فِي قَضَاءِ حَوَائِجِنَا إِلَّا بِكَ."],[1,6,"ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ","الطَّرِيقَ الَّذِي لَا عِوَجَ فِيهِ؛ وَهُوَ الْإِسْلَامُ."],[1,7,"غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ","الْيَهُودِ، وَمَنْ شَابَهَهُمْ فِي تَرْكِ الْعَمَلِ بِالْعِلْمِ."],[1,7,"ٱلضَّآلِّينَ","النَّصَارَى، وَمَنْ شَابَهَهُمْ فِي الْعَمَلِ بِغَيْرِ عِلْمٍ."],[2,1,"الٓمٓ","هَذَا الْقُرْآنُ مُؤَلَّفٌ مِنْ هَذِهِ الْحُرُوفِ، وَلَا يَسْتَطِيعُونَ الْإِتْيَانَ بِمِثْلِهِ."],[2,2,"لِّلْمُتَّقِينَ","مَنْ جَعَلُوا بَيْنَهُمْ وَبَيْنَ عَذَابِ اللهِ وِقَايَةً بِفِعْلِ الْأَوَامِرِ وَتَرْكِ النَّوَاهِي."],[2,7,"خَتَمَ ٱللَّهُ","طَبَعَ اللهُ."],[2,7,"غِشَٰوَةٌ","غِطَاءٌ."],[2,10,"مَّرَضٌ","شَكٌّ، وَنِفَاقٌ."],[2,15,"وَيَمُدُّهُمْ","يَزِيدُهُمْ، وَيُمْهِلُهُمْ."],[2,15,"يَعْمَهُونَ","يَتَحَيَّرُونَ، وَيَعْمَوْنَ عَنِ الرُّشْدِ."],[2,18,"بُكْمٌ","لَا يَنْطِقُونَ بِالْحَقِّ."],[2,19,"كَصَيِّبٍ","كَمَطَرٍ شَدِيدٍ."],[2,22,"أَندَادًا","نُظَرَاءَ، وَأَمْثَالًا."],[2,23,"رَيْبٍ","شَكٍّ."],[2,25,"مُتَشَٰبِهًا","فِي اللَّوْنِ، وَالْمَنْظَرِ، لَا فِي الطَّعْمِ."],[2,29,"ٱسْتَوَىٰٓ","قَصَدَ."],[2,30,"خَلِيفَةً","أَقْوَامًا يَخْلُفُ بَعْضُهُمْ بَعْضًا."],[2,30,"وَيَسْفِكُ","يُرِيقُ."],[2,30,"وَنُقَدِّسُ لَكَ","نُمَجِّدُكَ، وَنُطَهِّرُ ذِكْرَكَ عَمَّا لَا يَلِيقُ."],[2,35,"رَغَدًا","تَمَتُّعًا هَنِيئًا وَاسِعًا."],[2,36,"فَأَزَلَّهُمَا","أَوْقَعَهُمَا فِي الْخَطِيئَةِ."],[2,40,"فَٱرْهَبُونِ","خَافُونِ."],[2,42,"وَلَا تَلْبِسُوا۟","لَا تَخْلِطُوا."],[2,46,"يَظُنُّونَ","يُوقِنُونَ."],[2,48,"عَدْلٌ","فِدْيَةٌ."],[2,49,"يَسُومُونَكُمْ","يُذِيقُونَكُمْ."],[2,49,"بَلَآءٌ","اخْتِبَارٌ أَوْ نِعْمَةٌ."],[2,50,"فَرَقْنَا","فَصَلْنَا."],[2,53,"وَٱلْفُرْقَانَ","الَّذِي يَفْصِلُ بَيْنَ الْحَقِّ وَالْبَاطِلِ؛ وَهُوَ التَّوْرَاةُ."],[2,54,"بَارِئِكُمْ","خَالِقِكُمْ."],[2,55,"ٱلصَّٰعِقَةُ","نَارٌ مِنَ السَّمَاءِ."],[2,57,"وَظَلَّلْنَا","جَعَلْنَاهُ ظِلًّا مِنْ حَرِّ الشَّمْسِ."],[2,57,"ٱلْغَمَامَ","السَّحَابُ."],[2,57,"ٱلْمَنَّ","شَيْئًا يُشْبِهُ الصَّمْغَ كَالْعَسَلِ."],[2,57,"وَٱلسَّلْوَىٰ","طَيْرًا يُشْبِهُ السُّمَانَى."],[2,58,"وَقُولُوا۟ حِطَّةٌ","أَيْ: قُولُوا احْطُطْ، وَضَعْ عَنَّا ذُنُوبَنَا."],[2,59,"رِجْزًا","عَذَابًا."],[2,60,"وَلَا تَعْثَوْا۟","لَا تَسْعَوْا."],[2,61,"بَقْلِهَا","الْبُقُولِ وَالْخُضَرِ كَالنَّعْنَاعِ."],[2,61,"وَقِثَّآئِهَا","الْخِيَارِ."],[2,61,"وَفُومِهَا","الْحِنْطَةِ، وَالْحُبُوبِ الَّتِي تُؤْكَلُ."],[2,61,"مِصْرًا","بَلَدًا."],[2,61,"وَٱلْمَسْكَنَةُ","فَقْرُ النَّفْسِ."],[2,61,"وَبَآءُو","رَجَعُوا."],[2,62,"وَٱلصَّٰبِـِٔينَ","قَوْمٌ بَاقُونَ عَلَى فِطْرَتِهِمْ، وَلَا دِينَ لَهُمْ يَتَّبِعُونَهُ."],[2,63,"ٱلطُّورَ","جَبَلًا بِسَيْنَاءَ."],[2,65,"خَٰسِـِٔينَ","مَنْبُوذِينَ."],[2,66,"نَكَٰلًا","عِبْرَةً."],[2,68,"فَارِضٌ","مُسِنَّةٌ هَرِمَةٌ."],[2,68,"بِكْرٌ","صَغِيرَةٌ فَتِيَّةٌ."],[2,68,"عَوَانٌۢ","مُتَوَسِّطَةٌ بَيْنَ الْمُسِنَّةِ وَالصَّغِيرَةِ."],[2,69,"فَاقِعٌ","شَدِيدَةُ الصُّفْرَةِ."],[2,71,"لَّا ذَلُولٌ","غَيْرُ مُذَلَّلَةٍ لِلْعَمَلِ فِي الْحِرَاثَةِ."],[2,71,"مُّسَلَّمَةٌ","خَالِيَةٌ مِنَ الْعُيُوبِ."],[2,71,"لَّا شِيَةَ","لَيْسَ فِيهَا عَلَامَةٌ مِنْ لَوْنٍ يُخَالِفُ لَوْنَهَا."],[2,72,"فَٱدَّٰرَٰٔتُمْ","تَنَازَعْتُمْ، وَتَدَافَعْتُمْ تُهْمَةَ الْقَتْلِ."],[2,78,"أُمِّيُّونَ","يَجْهَلُونَ الْقِرَاءَةَ وَالْكِتَابَةَ."],[2,78,"أَمَانِىَّ","تِلَاوَةً أَوْ أَكَاذِيبَ تَلَقَّوْهَا عَنْ أَحْبَارِهِمْ."],[2,79,"فَوَيْلٌ","هَلَاكٌ، وَدَمَارٌ."],[2,83,"مِيثَٰقَ","الْعَهْدَ الْمُؤَكَّدَ."],[2,83,"حُسْنًا","كَلَامًا طَيِّبًا."],[2,85,"تَفْدُوهُمْ","تَسْعَوْا فِي تَحْرِيرِهِمْ مِنَ الْأَسْرِ."],[2,85,"خِزْىٌ","ذُلٌّ، وَفَضِيحَةٌ."],[2,87,"وَقَفَّيْنَا","أَتْبَعْنَا."],[2,87,"وَأَيَّدْنَٰهُ","قَوَّيْنَاهُ."],[2,87,"بِرُوحِ ٱلْقُدُسِ","جِبْرِيلَ عَلَيْهِ السَّلَامُ."],[2,88,"غُلْفٌۢ","مُغَطَّاةٌ."],[2,89,"يَسْتَفْتِحُونَ","يَسْتَنْصِرُونَ بِهِ عَلَى الْمُشْرِكِينَ."],[2,90,"فَبَآءُو","رَجَعُوا."],[2,93,"وَأُشْرِبُوا۟ فِى قُلُوبِهِمُ ٱلْعِجْلَ","امْتَزَجَ بِقُلُوبِهِمْ حُبُّ عِبَادَةِ الْعِجْلِ."],[2,96,"بِمُزَحْزِحِهِۦ","بِمُبْعِدِهِ."],[2,100,"نَبَذَهُۥ","طَرَحَهُ."],[2,102,"تَتْلُوا۟","تُحَدِّثُ، وَتَقْرَأُ."],[2,102,"بِبَابِلَ","أَرْضٍ بِالْعِرَاقِ."],[2,102,"هَٰرُوتَ وَمَٰرُوتَ","اسْمَانِ لِمَلَكَيْنِ أَنْزَلَهُمَا اللهُ؛ ابْتِلَاءً مِنْهُ؛ لِتَعْلِيمِ السِّحْرِ، وَالتَّحْذِيرِ مِنْهُ."],[2,102,"ٱشْتَرَىٰهُ","اخْتَارَهُ."],[2,102,"خَلَٰقٍ","نَصِيبٍ."],[2,104,"رَٰعِنَا","كَلِمَةٌ كَانَ الْيَهُودُ يَقُولُونَهَا لِلنَّبِيِّ ﷺ بِقَصْدِ السَّبِّ، وَنِسْبَتِهِ إِلَى الرُّعُونَةِ."],[2,104,"ٱنظُرْنَا","انْظُرْ إِلَيْنَا، وَتَعَهَّدْنَا."],[2,106,"نَنسَخْ","نُزِلْ، وَنَرْفَعْ."],[2,106,"نُنسِهَا","نَمْحُهَا مِنَ الْقُلُوبِ."],[2,108,"سَوَآءَ ٱلسَّبِيلِ","وَسَطَ الطَّرِيقِ، وَهُوَ الصِّرَاطُ الْمُسْتَقِيمُ."],[2,116,"قَٰنِتُونَ","خَاضِعُونَ، مُنْقَادُونَ."],[2,117,"بَدِيعُ","الْخَالِقُ عَلَى غَيْرِ مِثَالٍ سَابِقٍ."],[2,125,"مَثَابَةً","مَرْجِعًا يَأْتُونَهُ، ثُمَّ يَرْجِعُونَ إِلَى أَهْلِيهِمْ."],[2,126,"أَضْطَرُّهُۥٓ","أُلْجِئُهُ."],[2,126,"ٱلْمَصِيرُ","الْمَرْجِعُ، وَالْمُقَامُ."],[2,127,"ٱلْقَوَاعِدَ","الْأُسُسَ."],[2,128,"وَأَرِنَا مَنَاسِكَنَا","بَصِّرْنَا بِمَعَالِمِ عِبَادَتِنَا لَكَ."],[2,129,"وَيُزَكِّيهِمْ","يُطَهِّرُهُمْ مِنَ الشِّرْكِ وَسُوءِ الْأَخْلَاقِ."],[2,130,"يَرْغَبُ","يُعْرِضُ وَيَنْصَرِفُ."],[2,130,"سَفِهَ نَفْسَهُۥ","سَفِيهٌ، جَاهِلٌ."],[2,136,"وَٱلْأَسْبَاطِ","الْأَنْبِيَاءِ مِنْ وَلَدِ يَعْقُوبَ، الَّذِينَ كَانُوا فِي قَبَائِلِ بَنِي إِسْرَائِيلَ."],[2,137,"شِقَاقٍ","خِلَافٍ شَدِيدٍ."],[2,138,"صِبْغَةَ ٱللَّهِ","الْزَمُوا دِينَ اللهِ وَفِطْرَتَهُ."],[2,143,"يَنقَلِبُ عَلَىٰ عَقِبَيْهِ","يَرْتَدُّ عَنْ دِينِهِ."],[2,147,"ٱلْمُمْتَرِينَ","الشَّاكِّينَ."],[2,159,"يَلْعَنُهُمُ","يَطْرُدُهُمْ."],[2,164,"وَٱلْفُلْكِ","السُّفُنِ."],[2,164,"وَبَثَّ","نَشَرَ."],[2,164,"وَتَصْرِيفِ ٱلرِّيَٰحِ","تَقْلِيبِهَا، وَتَوْجِيهِهَا."],[2,166,"ٱلْأَسْبَابُ","الصِّلَاتُ."],[2,167,"حَسَرَٰتٍ","نَدَامَاتٍ."],[2,169,"بِٱلسُّوٓءِ","الذَّنْبِ الْقَبِيحِ."],[2,169,"وَٱلْفَحْشَآءِ","الْمَعْصِيَةِ الْبَالِغَةِ الْقُبْحِ."],[2,171,"يَنْعِقُ","يَصِيحُ."],[2,173,"أُهِلَّ بِهِۦ لِغَيْرِ ٱللَّهِ","مَا ذُكِرَ عِنْدَ ذَبْحِهِ اسْمُ غَيْرِ اللهِ تَعَالَى."],[2,173,"غَيْرَ بَاغٍ","غَيْرَ ظَالِمٍ فِي أَكْلِهِ فَوْقَ حَاجَتِهِ."],[2,173,"وَلَا عَادٍ","غَيْرَ مُتَجَاوِزٍ حُدُودَ مَا أُبِيحَ لَهُ."],[2,176,"شِقَاقٍۭ بَعِيدٍ","مُنَازَعَةٍ، وَخِلَافٍ بَعِيدٍ عَنِ الْحَقِّ."],[2,177,"ٱلْبِرَّ","التَّوَسُّعَ فِي فِعْلِ الْخَيْرِ وَالطَّاعَةِ."],[2,177,"وَٱبْنَ ٱلسَّبِيلِ","الْمُسَافِرَ الْمُحْتَاجَ الْمُنْقَطِعَ عَنْ أَهْلِهِ."],[2,177,"وَفِى ٱلرِّقَابِ","فِي تَحْرِيرِ الرِّقَابِ مِنَ الرِّقِّ وَالْأَسْرِ."],[2,177,"ٱلْبَأْسَآءِ","الْفَقْرِ."],[2,177,"وَٱلضَّرَّآءِ","الْمَرَضِ."],[2,177,"وَحِينَ ٱلْبَأْسِ","حِينَ شِدَّةِ الْقِتَالِ."],[2,180,"تَرَكَ خَيْرًا","تَرَكَ مَالًا كَثِيرًا."],[2,182,"جَنَفًا","مَيْلًا عَنِ الْحَقِّ خَطَأً وَجَهْلًا."],[2,184,"تَطَوَّعَ خَيْرًا","زَادَ فِي الْفِدْيَةِ بَدَلَ الصِّيَامِ."],[2,186,"فَلْيَسْتَجِيبُوا۟ لِى","فَلْيُطِيعُونِي."],[2,186,"يَرْشُدُونَ","يَهْتَدُونَ."],[2,187,"ٱلرَّفَثُ","الْجِمَاعُ."],[2,187,"لِبَاسٌ","سَكَنٌ، وَسِتْرٌ عَنِ الْحَرَامِ."],[2,187,"تَخْتَانُونَ","تَخُونُونَ، فَتَقَعُونَ فِي الْمَعْصِيَةِ."],[2,187,"بَٰشِرُوهُنَّ","جَامِعُوهُنَّ."],[2,187,"ٱلْخَيْطُ ٱلْأَبْيَضُ","نُورُ الْفَجْرِ."],[2,187,"ٱلْخَيْطِ ٱلْأَسْوَدِ","سَوَادِ اللَّيْلِ."],[2,187,"عَٰكِفُونَ","مُقِيمُونَ فِي الْمَسَاجِدِ؛ بِنِيَّةِ التَّقَرُّبِ إِلَى اللهِ."],[2,187,"حُدُودُ ٱللَّهِ","مُحَرَّمَاتُهُ وَمَنْهِيَّاتُهُ."],[2,188,"وَتُدْلُوا۟","تَدْفَعُوا."],[2,189,"ٱلْأَهِلَّةِ","جَمْعُ هِلَالٍ؛ وَهُوَ الْقَمَرُ فِي بِدَايَةِ ظُهُورِهِ."],[2,191,"ثَقِفْتُمُوهُمْ","وَجَدتُّمُوهُمْ."],[2,191,"وَٱلْفِتْنَةُ","أَذًى لِلْمُسْلِمِينَ، أَوْ شِرْكٌ بِاللهِ."],[2,195,"وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ","لَا تُوقِعُوا أَنْفُسَكُمْ."],[2,195,"ٱلتَّهْلُكَةِ","الْهَلَاكِ بِتَرْكِ الْجِهَادِ، وَالْإِنْفَاقِ فِيهِ."],[2,196,"أُحْصِرْتُمْ","مُنِعْتُمْ لِمَرَضٍ، أَوْ عَدُوٍّ."],[2,196,"ٱلْهَدْىِ","مَا يُهْدَى إِلَى الْبَيْتِ مِنَ الْأَنْعَامِ."],[2,196,"نُسُكٍ","ذَبِيحَةٍ: شَاةٍ تُذْبَحُ لِفُقَرَاءِ الْحَرَمِ."],[2,196,"حَاضِرِى","سَاكِنِي."],[2,197,"أَشْهُرٌ مَّعْلُومَٰتٌ","هِيَ: شَوَّالٌ، وَذُو الْقَعْدَةِ، وَعَشْرٌ مِنْ ذِي الْحِجَّةِ."],[2,197,"رَفَثَ","الْجِمَاعَ وَمُقَدِّمَاتِهِ الْقَوْلِيَّةَ وَالْفِعْلِيَّةَ."],[2,198,"فَضْلًا","رِزْقًا بِالتِّجَارَةِ."],[2,198,"أَفَضْتُم مِّنْ عَرَفَٰتٍ","دَفَعْتُمْ بَعْدَ غُرُوبِ الشَّمْسِ، رَاجِعِينَ مِنْ عَرَفَاتٍ."],[2,203,"مَّعْدُودَٰتٍ","أَيَّامُ التَّشْرِيقِ: الْحَادِيَ عَشَرَ، وَالثَّانِيَ عَشَرَ، وَالثَّالِثَ عَشَرَ؛ مِنْ ذِي الْحِجَّةِ."],[2,204,"أَلَدُّ ٱلْخِصَامِ","شَدِيدُ الْعَدَاوَةِ وَالْخُصُومَةِ."],[2,205,"ٱلْحَرْثَ","الزَّرْعَ."],[2,206,"فَحَسْبُهُۥ","كَافِيهِ."],[2,206,"ٱلْمِهَادُ","الْفِرَاشُ، وَالْمَضْجَعُ."],[2,207,"يَشْرِى","يَبِيعُ."],[2,208,"ٱلسِّلْمِ","شَرَائِعِ الْإِسْلَامِ."],[2,209,"زَلَلْتُم","انْحَرَفْتُمْ."],[2,210,"يَنظُرُونَ","يَنْتَظِرُونَ."],[2,210,"ظُلَلٍ مِّنَ ٱلْغَمَامِ","قِطَعٍ مِنَ السَّحَابِ."],[2,214,"ٱلْبَأْسَآءُ","الْفَقْرُ."],[2,214,"وَٱلضَّرَّآءُ","الْمَرَضُ."],[2,217,"وَٱلْفِتْنَةُ","الشِّرْكُ."],[2,219,"وَٱلْمَيْسِرِ","الْقِمَارِ، وَهُوَ أَخْذُ الْمَالِ، أَوْ إِعْطَاؤُهُ بِطَرِيقِ الْمُغَالَبَاتِ الَّتِي فِيهَا عِوَضٌ مِنَ الطَّرَفَيْنِ."],[2,220,"لَأَعْنَتَكُمْ","لَضَيَّقَ عَلَيْكُمْ."],[2,223,"حَرْثٌ لَّكُمْ","مَوْضِعُ زَرْعٍ لَكُمْ، تَضَعُونَ النُّطْفَةَ فِي أَرْحَامِهِنَّ فَيَحْمِلْنَ."],[2,223,"أَنَّىٰ شِئْتُمْ","كَيْفَ أَرَدْتُمْ، مَا دَامَ ذَلِكَ فِي مَوْضِعِ الْحَرْثِ؛ وَهُوَ الْفَرْجُ."],[2,224,"عُرْضَةً","مَانِعًا."],[2,225,"بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ","الْيَمِينُ اللَّاغِيَةُ هِيَ: الْيَمِينُ الَّتِي لَا يَقْصِدُهَا صَاحِبُهَا."],[2,226,"يُؤْلُونَ","يَحْلِفُونَ أَلَّا يُجَامِعُوا نِسَاءَهُمْ."],[2,226,"تَرَبُّصُ","انْتِظَارٌ."],[2,226,"فَآءُو","رَجَعُوا."],[2,228,"يَتَرَبَّصْنَ","يَنْتَظِرْنَ."],[2,228,"ثَلَٰثَةَ قُرُوٓءٍ","ثَلَاثَ حِيَضٍ."],[2,231,"ضِرَارًا","مُضَارَّةً."],[2,232,"تَعْضُلُوهُنَّ","تَمْنَعُوهُنَّ."],[2,233,"فِصَالًا","فِطَامًا."],[2,235,"عَرَّضْتُم","لَمَّحْتُمْ."],[2,235,"أَكْنَنتُمْ","أَضْمَرْتُمْ."],[2,235,"عُقْدَةَ ٱلنِّكَاحِ","عَقْدَ النِّكَاحِ."],[2,236,"تَفْرِضُوا۟","تُحَدِّدُوا."],[2,236,"فَرِيضَةً","مَهْرًا."],[2,236,"وَمَتِّعُوهُنَّ","أَعْطُوهُنَّ شَيْئًا مِنَ الْمَالِ؛ جَبْرًا لَهُنَّ."],[2,238,"وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ","صَلَاةِ الْعَصْرِ."],[2,238,"قَٰنِتِينَ","مُطِيعِينَ خَاشِعِينَ."],[2,239,"فَرِجَالًا","مَاشِينَ."],[2,246,"هَلْ عَسَيْتُمْ","هَلِ الْأَمْرُ كَمَا أَتَوَقَّعُهُ؟"],[2,247,"بَسْطَةً","سَعَةً."],[2,248,"ٱلتَّابُوتُ","الصُّنْدُوقُ الَّذِي فِيهِ التَّوْرَاةُ."],[2,249,"يَظُنُّونَ","يُوقِنُونَ."],[2,253,"وَأَيَّدْنَٰهُ","قَوَّيْنَاهُ."],[2,253,"بِرُوحِ ٱلْقُدُسِ","جِبْرِيلَ عَلَيْهِ السَّلَامُ."],[2,254,"خُلَّةٌ","صَدَاقَةٌ."],[2,255,"ٱلْقَيُّومُ","الْقَائِمُ عَلَى كُلِّ شَيْءٍ."],[2,255,"سِنَةٌ","نُعَاسٌ."],[2,255,"كُرْسِيُّهُ","مَوْضِعُ قَدَمَيِ الرَّبِّ سُبْحَانَهُ."],[2,255,"يَـُٔودُهُۥ","يُثْقِلُهُ."],[2,256,"بِٱلطَّٰغُوتِ","كُلِّ مَا عُبِدَ مِنْ دُونِ اللهِ."],[2,256,"بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ","بِالْعَقْدِ الْمُحْكَمِ."],[2,258,"فَبُهِتَ","تَحَيَّرَ، وَانْقَطَعَتْ حُجَّتُهُ."],[2,259,"خَاوِيَةٌ","مُتَهَدِّمَةٌ."],[2,259,"عُرُوشِهَا","سُقُوفِهَا."],[2,259,"أَنَّىٰ","كَيْفَ؟"],[2,259,"يَتَسَنَّهْ","يَتَغَيَّرْ."],[2,259,"نُنشِزُهَا","نَرْفَعُهَا، وَنَصِلُ بَعْضَهَا بِبَعْضٍ."],[2,260,"فَصُرْهُنَّ إِلَيْكَ","اضْمُمْهُنَّ إِلَيْكَ، وَقَطِّعْهُنَّ."],[2,262,"مَنًّا","عَدًّا لِلْإِحْسَانِ، وَإِظْهَارًا لَهُ."],[2,264,"صَفْوَانٍ","حَجَرٍ أَمْلَسَ."],[2,264,"وَابِلٌ","مَطَرٌ غَزِيرٌ."],[2,264,"صَلْدًا","أَجْرَدَ لَا تُرَابَ عَلَيْهِ."],[2,265,"جَنَّةٍۭ","بُسْتَانٍ."],[2,265,"بِرَبْوَةٍ","مُرْتَفِعٍ مِنَ الْأَرْضِ."],[2,265,"أُكُلَهَا","ثَمَرَهَا الَّذِي يُؤْكَلُ."],[2,265,"فَطَلٌّ","مَطَرٌ خَفِيفٌ."],[2,266,"إِعْصَارٌ","رِيحٌ شَدِيدَةٌ."],[2,267,"تَيَمَّمُوا۟","تَقْصِدُوا."],[2,267,"ٱلْخَبِيثَ","الرَّدِيءَ."],[2,267,"تُغْمِضُوا۟","تَتَغَاضَوْا عَمَّا فِيهِ مِنْ رَدَاءَةٍ وَنَقْصٍ."],[2,268,"بِٱلْفَحْشَآءِ","سَائِرِ الْمَعَاصِي، وَمِنْهُ الْبُخْلُ."],[2,273,"أُحصِرُوا۟","حُبِسُوا عَنْ طَلَبِ الرِّزْقِ لِلْجِهَادِ."],[2,273,"بِسِيمَٰهُمْ","بِعَلَامَاتِهِمْ، وَآثَارِ الْحَاجَةِ فِيهِمْ."],[2,273,"إِلْحَافًا","إِلْحَاحًا فِي السُّؤَالِ."],[2,275,"يَتَخَبَّطُهُ","يَصْرَعُهُ."],[2,275,"ٱلْمَسِّ","الْجُنُونِ."],[2,276,"يَمْحَقُ","يَنْقُصُ، وَيُذْهِبُ الْبَرَكَةَ."],[2,276,"وَيُرْبِى","يَزِيدُ، وَيُنَمِّي."],[2,279,"فَأْذَنُوا۟","اسْتَيْقِنُوا."],[2,280,"ذُو عُسْرَةٍ","غَيْرُ قَادِرٍ عَلَى السَّدَادِ."],[2,280,"فَنَظِرَةٌ","إِمْهَالٌ."],[2,282,"تَدَايَنتُم","تَعَامَلْتُمْ بِالدُّيُونِ."],[2,282,"وَلَا يَأْبَ","لَا يَمْتَنِعْ."],[2,282,"وَلْيُمْلِلِ","لِيُمْلِ، وَيُقِرَّ."],[2,282,"يَبْخَسْ","يَنْقُصْ."],[2,282,"سَفِيهًا","مَحْجُورًا عَلَيْهِ؛ لِتَبْذِيرِهِ."],[2,282,"ضَعِيفًا","كَالصَّغِيرِ وَالْمَجْنُونِ."],[2,282,"تَضِلَّ","تَنْسَى."],[2,282,"تَسْـَٔمُوٓا۟","تَمَلُّوا."],[2,282,"أَقْسَطُ","أَعْدَلُ."],[2,282,"وَأَقْوَمُ لِلشَّهَٰدَةِ","أَعْظَمُ عَوْنًا عَلَى إِقَامَةِ الشَّهَادَةِ."],[2,282,"وَأَدْنَىٰٓ","أَقْرَبُ."],[2,282,"تَرْتَابُوٓا۟","تَشُكُّوا."],[2,282,"جُنَاحٌ","حَرَجٌ."],[2,283,"فَرِهَٰنٌ مَّقْبُوضَةٌ","هُوَ أَنْ يَدْفَعَ لِصَاحِبِ الْحَقِّ شَيْئًا؛ لِيُضْمَنَ حَقُّهُ حَتَّى يَرُدَّ الْمَدِينُ الدَّيْنَ."],[2,286,"إِصْرًا","مَشَقَّةً وَثِقَلًا."],[3,2,"ٱلْقَيُّومُ","الْقَائِمُ عَلَى كُلِّ شَيْءٍ."],[3,4,"عَزِيزٌ","غَالِبٌ، قَوِيٌّ لَا يُغَالَبُ."],[3,7,"مُّحْكَمَٰتٌ","وَاضِحَاتُ الدَّلَالَةِ."],[3,7,"أُمُّ ٱلْكِتَٰبِ","أَصْلُ الْكِتَابِ الَّذِي يُرْجَعُ إِلَيْهِ عِنْدَ الِاشْتِبَاهِ."],[3,7,"مُتَشَٰبِهَٰتٌ","خَفِيَّاتٌ، لَا يَتَعَيَّنُ الْمُرَادُ مِنْهَا إِلَّا بِرَدِّهَا إِلَى الْمُحْكَمَاتِ."],[3,7,"زَيْغٌ","مَرَضٌ، وَانْحِرَافٌ."],[3,7,"ٱبْتِغَآءَ","طَلَبَ تَفْسِيرِهِ عَلَى مَذَاهِبِهِمُ الْمُنْحَرِفَةِ."],[3,7,"تَأْوِيلِهِۦ","تَفْسِيرِهِ أَوْ مَعْرِفَةِ حَقِيقَتِهِ."],[3,7,"ٱلْأَلْبَٰبِ","الْعُقُولِ السَّلِيمَةِ."],[3,11,"كَدَأْبِ"," ئِبُكُمُ","بَنَاتُ نِسَائِكُمُ اللَّاتِي يَتَرَبَّيْنَ غَالِبًا فِي بُيُوتِكُمْ."],[4,23,"وَحَلَٰٓئِلُ","زَوْجَاتُ."],[4,24,"وَٱلْمُحْصَنَٰتُ","الْمُتَزَوِّجَاتُ."],[4,24,"مَا مَلَكَتْ أَيْمَٰنُكُمْ","الْمَسْبِيَّاتُ، وَهُنَّ الْمَأْخُوذَاتُ مِنْ نِسَاءِ الْكُفَّارِ فِي الْجِهَادِ."],[4,24,"تَبْتَغُوا۟","تَطْلُبُوا."],[4,24,"مُّحْصِنِينَ","أَعِفَّاءَ عَنِ الْحَرَامِ."],[4,24,"مُسَٰفِحِينَ","زَانِينَ."],[4,24,"أُجُورَهُنَّ","مُهُورَهُنَّ."],[4,25,"طَوْلًا","غِنًى، وَسَعَةً."],[4,25,"ٱلْمُحْصَنَٰتِ","الْحَرَائِرِ."],[4,25,"فَتَيَٰتِكُمُ","إِمَائِكُمْ."],[4,25,"مُحْصَنَٰتٍ","عَفِيفَاتٍ."],[4,25,"مُتَّخِذَٰتِ أَخْدَانٍ","مُصَاحِبَاتِ أَصْدِقَاءَ لِلزِّنَى سِرًّا."],[4,25,"ٱلْعَنَتَ","الْوُقُوعَ فِي الزِّنَى."],[4,31,"كَبَآئِرَ","الذُّنُوبَ الْكَبِيرَةَ مِمَّا فِيهِ حَدٌّ، أَوْ لَعْنَةٌ، أَوْ وَعِيدٌ."],[4,31,"سَيِّـَٔاتِكُمْ","الذُّنُوبَ الصَّغِيرَةَ."],[4,33,"مَوَٰلِىَ","وَرَثَةً."],[4,33,"وَٱلَّذِينَ عَقَدَتْ أَيْمَٰنُكُمْ","مَنْ حَالَفْتُمُوهُمْ عَلَى النُّصْرَةِ."],[4,34,"قَٰنِتَٰتٌ","مُطِيعَاتٌ لِلَّهِ ـ تَعَالَى ـ ثُمَّ لِأَزْوَاجِهِنَّ."],[4,34,"نُشُوزَهُنَّ","عِصْيَانَهُنَّ وَتَرَفُّعَهُنَّ عَنْ طَاعَتِكُمْ."],[4,36,"وَٱلْجَارِ ٱلْجُنُبِ","الْجَارِ غَيْرِ الْقَرِيبِ."],[4,36,"وَٱلصَّاحِبِ بِٱلْجَنۢبِ","الرَّفِيقِ فِي السَّفَرِ وَالْحَضَرِ."],[4,36,"مُخْتَالًا","مُتَكَبِّرًا، مُعْجَبًا بِنَفْسِهِ."],[4,36,"فَخُورًا","كَثِيرَ الِافْتِخَارِ عَلَى النَّاسِ بِمَنَاقِبِهِ."],[4,40,"تَكُ","تَكُنْ."],[4,40,"لَّدُنْهُ","عِنْدَهُ."],[4,43,"جُنُبًا","عَلَى جَنَابَةٍ."],[4,43,"عَابِرِى سَبِيلٍ","مُجْتَازِي الْمَسْجِدِ مِنْ بَابٍ إِلَى بَابٍ."],[4,43,"لَٰمَسْتُمُ","جَامَعْتُمْ."],[4,43,"فَتَيَمَّمُوا۟","اقْصِدُوا."],[4,43,"صَعِيدًا","مَا كَانَ عَلَى وَجْهِ الْأَرْضِ مِنْ تُرَابٍ، وَنَحْوِهِ."],[4,43,"طَيِّبًا","طَاهِرًا."],[4,46,"وَٱسْمَعْ غَيْرَ مُسْمَعٍ","يَدْعُونَ عَلَى النَّبِيِّ ﷺ قَائِلِينَ: اسْمَعْ مِنَّا لَا سُمِعْتَ!"],[4,46,"وَرَٰعِنَا","افْهَمْ عَنَّا، وَأَفْهِمْنَا."],[4,46,"لَيًّۢا بِأَلْسِنَتِهِمْ","يَلْوُونَ أَلْسِنَتَهُمْ بِذَلِكَ، وَهُمْ يُرِيدُونَ الدُّعَاءَ عَلَيْهِ بِالرُّعُونَةِ حَسَبَ لُغَتِهِمْ."],[4,46,"وَأَقْوَمَ","أَعْدَلَ قَوْلًا."],[4,47,"نَّطْمِسَ","نَمْحُوَ."],[4,47,"فَنَرُدَّهَا","نُحَوِّلَهَا."],[4,49,"يُزَكُّونَ أَنفُسَهُم","يُثْنُونَ عَلَى أَنْفُسِهِمْ وَأَعْمَالِهِمْ."],[4,50,"يَفْتَرُونَ","يَخْتَلِقُونَ وَيَكْذِبُونَ."],[4,51,"بِٱلْجِبْتِ وَٱلطَّٰغُوتِ","كُلِّ مَا يُعْبَدُ مِنْ دُونِ اللهِ مِنَ الْأَصْنَامِ، وَشَيَاطِينِ الْإِنْسِ وَالْجِنِّ."],[4,53,"نَقِيرًا","قَدْرَ النُّقْرَةِ وَهِيَ الْحُفْرَةُ فِي ظَهْرِ النَّوَاةِ."],[4,57,"ظَلِيلًا","كَثِيفًا، مُمْتَدًّا، دَائِمًا."],[4,58,"نِعِمَّا","نِعْمَ مَا."],[4,59,"تَأْوِيلًا","عَاقِبَةً، وَمَآلًا."],[4,60,"ٱلطَّٰغُوتِ","الْبَاطِلِ الَّذِي لَمْ يَشْرَعْهُ اللهُ."],[4,65,"حَرَجًا","ضِيقًا."],[4,66,"وَأَشَدَّ تَثْبِيتًا","أَقْوَى لِإِيمَانِهِمْ."],[4,71,"ثُبَاتٍ","جَمَاعَةً بَعْدَ جَمَاعَةٍ."],[4,72,"لَّيُبَطِّئَنَّ","يَتَأَخَّرُ عَنِ الْخُرُوجِ مُتَثَاقِلًا، وَيُثَبِّطُ غَيْرَهُ."],[4,72,"شَهِيدًا","حَاضِرًا."],[4,74,"يَشْرُونَ","يَبِيعُونَ."],[4,76,"ٱلطَّٰغُوتِ","الْبَغْيِ وَالْفَسَادِ."],[4,77,"فَتِيلًا","الْخَيْطَ الَّذِي يَكُونُ فِي شَقِّ نَوَاةِ التَّمْرِ."],[4,78,"بُرُوجٍ مُّشَيَّدَةٍ","حُصُونٍ مَنِيعَةٍ."],[4,80,"حَفِيظًا","حَافِظًا، رَقِيبًا."],[4,81,"بَيَّتَ طَآئِفَةٌ","دَبَّرَتْ بِلَيْلٍ."],[4,83,"أَذَاعُوا۟ بِهِۦ","أَفْشَوْهُ."],[4,84,"تَنكِيلًا","عُقُوبَةً."],[4,85,"كِفْلٌ","نَصِيبٌ مِنْ وِزْرِهَا."],[4,85,"مُّقِيتًا","شَاهِدًا، وَحَفِيظًا."],[4,86,"حَسِيبًا","مُجَازِيًا، وَمُحَاسِبًا."],[4,88,"أَرْكَسَهُم","أَوْقَعَهُمْ، وَرَدَّهُمْ."],[4,90,"حَصِرَتْ صُدُورُهُمْ","ضَاقَتْ وَكَرِهَتْ مُقَاتَلَتَكُمْ."],[4,90,"ٱلسَّلَمَ","الِاسْتِسْلَامَ، وَالِانْقِيَادَ."],[4,91,"أُرْكِسُوا۟ فِيهَا","وَقَعُوا فِي أَسْوَأِ حَالٍ."],[4,91,"ثَقِفْتُمُوهُمْ","وَجَدتُّمُوهُمْ."],[4,94,"ضَرَبْتُمْ","خَرَجْتُمْ فِي الْأَرْضِ."],[4,94,"عَرَضَ ٱلْحَيَوٰةِ","مَتَاعَهَا الزَّائِلَ، وَالْمَقْصُودُ: الْغَنِيمَةُ."],[4,100,"مُرَٰغَمًا","مُهَاجَرًا، وَمَكَانًا يُتَحَوَّلُ إِلَيْهِ."],[4,101,"يَفْتِنَكُمُ","يَعْتَدِيَ عَلَيْكُمْ."],[4,102,"تَغْفُلُونَ","تَسْهَوْنَ."],[4,102,"مَّيْلَةً وَٰحِدَةً","حَمْلَةً وَاحِدَةً لِيَقْضُوا عَلَيْكُمْ."],[4,103,"كِتَٰبًا","مَكْتُوبًا مَفْرُوضًا."],[4,103,"مَّوْقُوتًا","مُحَدَّدًا فِي أَوْقَاتٍ مَعْلُومَةٍ."],[4,104,"وَلَا تَهِنُوا۟","لَا تَضْعُفُوا."],[4,104,"ٱبْتِغَآءِ ٱلْقَوْمِ","طَلَبِ الْعَدُوِّ."],[4,105,"خَصِيمًا","مُدَافِعًا عَنْهُمْ."],[4,107,"يَخْتَانُونَ","يَخُونُونَ أَنْفُسَهُمْ بِالْمَعْصِيَةِ."],[4,107,"خَوَّانًا","عَظِيمَ الْخِيَانَةِ."],[4,108,"يُبَيِّتُونَ","يُدَبِّرُونَ لَيْلًا."],[4,114,"نَّجْوَىٰهُمْ","حَدِيثِهِمْ سِرًّا."],[4,115,"يُشَاقِقِ","يُخَالِفْ عِنَادًا."],[4,115,"نُوَلِّهِۦ مَا تَوَلَّىٰ","نَتْرُكْهُ، وَمَا تَوَجَّهَ إِلَيْهِ."],[4,117,"إِنَٰثًا","أَصْنَامًا؛ كَاللَّاتِ وَالْعُزَّى وَمَنَاةَ."],[4,117,"مَّرِيدًا","مُتَمَرِّدًا عَاتِيًا."],[4,118,"نَصِيبًا مَّفْرُوضًا","جُزْءًا مَعْلُومًا."],[4,119,"فَلَيُبَتِّكُنَّ","فَلَيَقْطَعُنَّ وَلَيُشَقِّقُنَّ."],[4,121,"مَحِيصًا","مَحِيدًا، وَمَهْرَبًا."],[4,122,"قِيلًا","قَوْلًا."],[4,124,"نَقِيرًا","قَلِيلًا؛ كَالنُّقْرَةِ وَهِيَ الْحُفْرَةُ فِي ظَهْرِ النَّوَاةِ."],[4,125,"أَسْلَمَ","انْقَادَ، وَاسْتَسْلَمَ."],[4,125,"حَنِيفًا","مَائِلًا عَنِ الشِّرْكِ إِلَى التَّوْحِيدِ."],[4,125,"خَلِيلًا","صَفِيًّا."],[4,127,"بِٱلْقِسْطِ","بِالْعَدْلِ."],[4,128,"نُشُوزًا","تَرَفُّعًا وَانْصِرَافًا عَنْهَا."],[4,128,"وَأُحْضِرَتِ ٱلْأَنفُسُ ٱلشُّحَّ","جُبِلَتْ عَلَى الشُّحِّ وَالْبُخْلِ."],[4,129,"فَتَذَرُوهَا","تَتْرُكُوهَا."],[4,129,"كَٱلْمُعَلَّقَةِ","الَّتِي لَيْسَتْ بِذَاتِ زَوْجٍ، وَلَا مُطَلَّقَةٍ."],[4,135,"قَوَّٰمِينَ","قَائِمِينَ."],[4,135,"بِٱلْقِسْطِ","بِالْعَدْلِ."],[4,135,"تَلْوُۥٓا۟","تُحَرِّفُوا الشَّهَادَةَ بِأَلْسِنَتِكُمْ."],[4,135,"تُعْرِضُوا۟","تَتْرُكُوا الشَّهَادَةَ."],[4,141,"يَتَرَبَّصُونَ بِكُمْ","يَنْتَظِرُونَ مَا يَحُلُّ بِكُمْ."],[4,141,"نَسْتَحْوِذْ عَلَيْكُمْ","نُسَاعِدْكُمْ."],[4,143,"مُّذَبْذَبِينَ","مُتَرَدِّدِينَ."],[4,145,"ٱلدَّرْكِ","الْمَنْزِلَةِ، وَالطَّبَقِ."],[4,154,"ٱلطُّورَ","جَبَلًا بِسَيْنَاءَ."],[4,154,"لَا تَعْدُوا۟","لَا تَعْتَدُوا."],[4,155,"غُلْفٌۢ","مُغَطَّاةٌ."],[4,162,"ٱلرَّٰسِخُونَ","الْمُتَمَكِّنُونَ."],[4,163,"وَٱلْأَسْبَاطِ","الْأَنْبِيَاءِ مِنْ وَلَدِ يَعْقُوبَ عَلَيْهِ السَّلَامُ، الَّذِينَ بُعِثُوا فِي قَبَائِلِ بَنِي إِسْرَائِيلَ الِاثْنَتَيْ عَشْرَةَ."],[4,171,"لَا تَغْلُوا۟","لَا تَتَجَاوَزُوا الِاعْتِقَادَ الْحَقَّ."],[4,171,"وَكَلِمَتُهُۥٓ","خَلَقَهُ بِالْكَلِمَةِ الَّتِي أَرْسَلَ بِهَا جِبْرِيلَ إِلَى مَرْيَمَ وَهِيَ: «كُنْ»؛ فَكَانَ."],[4,172,"يَسْتَنكِفَ","يَأْنَفَ، وَيَمْتَنِعَ."],[4,174,"بُرْهَٰنٌ","دَلِيلٌ صَادِقٌ، وَهُوَ مُحَمَّدٌ ﷺ."],[4,176,"ٱلْكَلَٰلَةِ","مَنْ مَاتَ وَلَيْسَ لَهُ وَلَدٌ، وَلَا وَالِدٌ."],[4,176,"وَلَهُۥٓ أُخْتٌ","أَيْ: أُخْتٌ شَقِيقَةٌ، أَوْ لِأَبٍ."],[5,1,"بِٱلْعُقُودِ","الْعُهُودِ الْمُؤَكَّدَةِ مَعَ اللهِ، وَمَعَ خَلْقِهِ."],[5,1,"مُحِلِّى ٱلصَّيْدِ","مُسْتَحِلِّينَ لِلصَّيْدِ."],[5,1,"حُرُمٌ","مُحْرِمُونَ."],[5,2,"لَا تُحِلُّوا۟","لَا تَنْتَهِكُوا."],[5,2,"شَعَٰٓئِرَ ٱللَّهِ","حُدُودَهُ، وَمَعَالِمَ دِينِهِ."],[5,2,"ٱلشَّهْرَ ٱلْحَرَامَ","ذَا الْقَعْدَةِ، وَذَا الْحِجَّةِ، وَالْمُحَرَّمَ وَرَجَبًا."],[5,2,"ٱلْهَدْىَ","مَا يُهْدَى لِلْبَيْتِ مِنَ الْأَنْعَامِ وَغَيْرِهَا."],[5,2,"ٱلْقَلَٰٓئِدَ","مَا قُلِّدَ مِنَ الْهَدْيِ؛ حَيْثُ يُعَلِّقُونَ النِّعَالَ وَغَيْرَهَا عَلَى رِقَابِهَا؛ عَلَامَةً عَلَى أَنَّهَا هَدْيٌ."],[5,2,"ءَآمِّينَ","قَاصِدِينَ."],[5,2,"وَلَا يَجْرِمَنَّكُمْ","لَا يَحْمِلَنَّكُمْ."],[5,2,"شَنَـَٔانُ","بُغْضُ."],[5,3,"ٱلْمَيْتَةُ","الْحَيَوَانُ الَّذِي مَاتَ حَتْفَ أَنْفِهِ بِدُونِ ذَكَاةٍ."],[5,3,"أُهِلَّ لِغَيْرِ ٱللَّهِ بِهِۦ","ذُكِرَ عَلَيْهِ اسْمُ غَيْرِ اللهِ عِنْدَ الذَّبْحِ."],[5,3,"وَٱلْمُنْخَنِقَةُ","هِيَ: الَّتِي حُبِسَ نَفَسُهَا حَتَّى مَاتَتْ."],[5,3,"وَٱلْمَوْقُوذَةُ","هِيَ: الَّتِي ضُرِبَتْ بِعَصًا أَوْ حَجَرٍ حَتَّى مَاتَتْ."],[5,3,"وَٱلْمُتَرَدِّيَةُ","هِيَ: الَّتِي سَقَطَتْ مِنْ مَكَانٍ عَالٍ فَمَاتَتْ."],[5,3,"وَٱلنَّطِيحَةُ","هِيَ: الَّتِي ضَرَبَتْهَا أُخْرَى بِقَرْنِهَا فَمَاتَتْ."],[5,3,"ٱلنُّصُبِ","مَا يُوضَعُ لِلْعِبَادَةِ مِنْ حَجَرٍ أَوْ غَيْرِهِ."],[5,3,"تَسْتَقْسِمُوا۟","تَطْلُبُوا مَعْرِفَةَ مَا قُسِمَ لَكُمْ."],[5,3,"بِٱلْأَزْلَٰمِ","قِدَاحٍ مُعَيَّنَةٍ كَانُوا يَسْتَقْسِمُونَ بِهَا؛ يَكْتُبُونَ عَلَى أَحَدِهَا: (افْعَلْ)، وَعَلَى الْآخَرِ: (لَا تَفْعَلْ)، ثُمَّ يُحَرِّكُونَهَا، فَأَيُّهَا خَرَجَ، عَمِلُوا بِهِ."],[5,3,"مَخْمَصَةٍ","مَجَاعَةٍ."],[5,3,"مُتَجَانِفٍ","مَائِلٍ، عَمْدًا."],[5,4,"ٱلْجَوَارِحِ","ذَوَاتِ الْأَنْيَابِ وَالْمَخَالِبِ؛ كَالْكِلَابِ وَالصُّقُورِ."],[5,4,"مُكَلِّبِينَ","مُعَلِّمِينَ لَهَا الصَّيْدَ."],[5,5,"وَطَعَامُ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ","ذَبَائِحُهُمْ."],[5,5,"وَٱلْمُحْصَنَٰتُ","الْحَرَائِرُ، الْعَفِيفَاتُ."],[5,5,"مُحْصِنِينَ","عَفِيفِينَ."],[5,5,"وَلَا مُتَّخِذِىٓ أَخْدَانٍ","غَيْرَ مُتَّخِذِي عَشِيقَاتٍ."],[5,6,"جُنُبًا","عَلَى جَنَابَةٍ."],[5,6,"لَٰمَسْتُمُ","جَامَعْتُمْ."],[5,6,"فَتَيَمَّمُوا۟","فَاقْصِدُوا."],[5,6,"صَعِيدًا","مَا عَلَى وَجْهِ الْأَرْضِ، مِنْ تُرَابٍ وَنَحْوِهِ."],[5,6,"طَيِّبًا","طَاهِرًا."],[5,8,"شُهَدَآءَ بِٱلْقِسْطِ","شَاهِدِينَ بِالْعَدْلِ."],[5,8,"وَلَا يَجْرِمَنَّكُمْ","لَا يَحْمِلَنَّكُمْ."],[5,8,"شَنَـَٔانُ","بُغْضُ."],[5,11,"يَبْسُطُوٓا۟ إِلَيْكُمْ","يَبْطِشُوا بِكُمْ."],[5,12,"نَقِيبًا","عَرِيفًا يَتَعَرَّفُ أَخْبَارَهُمْ وَيُفَتِّشُ عَنْ أَحْوَالِهِمْ."],[5,12,"وَعَزَّرْتُمُوهُمْ","نَصَرْتُمُوهُمْ."],[5,13,"وَنَسُوا۟","تَرَكُوا."],[5,13,"حَظًّا","نَصِيبًا."],[5,14,"فَأَغْرَيْنَا","هَيَّجْنَا، وَأَلْقَيْنَا."],[5,16,"سُبُلَ ٱلسَّلَٰمِ","طُرُقَ الْأَمْنِ وَالسَّلَامَةِ."],[5,19,"فَتْرَةٍ","فُتُورٍ وَانْقِطَاعٍ، وَهِيَ الْمُدَّةُ بَيْنَ النَّبِيِّ عِيسَى وَنَبِيِّنَا مُحَمَّدٍ ـ عَلَيْهِمَا الصَّلَاةُ وَالسَّلَامُ ـ."],[5,20,"مُّلُوكًا","تَمْلِكُونَ أَمْرَكُمْ بَعْدَ أَنْ كُنْتُمْ مَمْلُوكِينَ لِفِرْعَوْنَ وَقَوْمِهِ."],[5,21,"ٱلْمُقَدَّسَةَ","الْمُطَهَّرَةَ، وَهِيَ بَيْتُ الْمَقْدِسِ وَمَا حَوْلَهَا."],[5,21,"وَلَا تَرْتَدُّوا۟","لَا تَرْجِعُوا عَنْ قِتَالِهِمْ."],[5,25,"فَٱفْرُقْ","فَاحْكُمْ."],[5,26,"يَتِيهُونَ","يَسِيرُونَ ضَائِعِينَ مُتَحَيِّرِينَ."],[5,26,"فَلَا تَأْسَ","فَلَا تَحْزَنْ."],[5,27,"ٱبْنَىْ ءَادَمَ","قَابِيلَ، وَهَابِيلَ."],[5,28,"بَسَطتَ","مَدَدتَّ."],[5,29,"تَبُوٓأَ بِإِثْمِى","تَرْجِعَ بِإِثْمِ قَتْلِي."],[5,29,"وَإِثْمِكَ","ذَنْبِكَ الَّذِي عَلَيْكَ قَبْلَ ذَلِكَ."],[5,30,"فَطَوَّعَتْ","فَزَيَّنَتْ."],[5,31,"يَبْحَثُ فِى ٱلْأَرْضِ","يَحْفِرُ فِيهَا حُفْرَةً."],[5,31,"سَوْءَةَ","عَوْرَةَ، أَوْ جِيفَةَ أَخِيهِ."],[5,33,"يُصَلَّبُوٓا۟","يُشَدُّوا عَلَى خَشَبَةٍ."],[5,35,"وَٱبْتَغُوٓا۟","اطْلُبُوا."],[5,35,"ٱلْوَسِيلَةَ","الْقُرْبَةَ وَالطَّاعَةَ."],[5,38,"نَكَٰلًا","عُقُوبَةً."],[5,41,"فِتْنَتَهُۥ","ضَلَالَتَهُ."],[5,42,"لِلسُّحْتِ","لِلْحَرَامِ."],[5,42,"ٱلْمُقْسِطِينَ","الْعَادِلِينَ."],[5,44,"وَٱلرَّبَّٰنِيُّونَ","الْعُبَّادُ مِنَ الْيَهُودِ، الَّذِينَ يُرَبُّونَ النَّاسَ بِشَرْعِ اللهِ."],[5,44,"وَٱلْأَحْبَارُ","عُلَمَاءُ الْيَهُودِ."],[5,46,"وَقَفَّيْنَا","أَتْبَعْنَا."],[5,48,"وَمُهَيْمِنًا عَلَيْهِ","حَاكِمًا عَلَيْهَا، شَاهِدًا بِصِحَّتِهَا، أَمِينًا عَلَيْهَا."],[5,48,"شِرْعَةً وَمِنْهَاجًا","شَرِيعَةً، وَطَرِيقًا وَاضِحًا فِي الدِّينِ."],[5,48,"لِّيَبْلُوَكُمْ","لِيَخْتَبِرَكُمْ."],[5,52,"يُسَٰرِعُونَ فِيهِمْ","يُبَادِرُونَ فِي مَوَدَّةِ الْيَهُودِ وَنَحْوِهِمْ."],[5,52,"دَآئِرَةٌ","نَائِبَةٌ وَمُصِيبَةٌ تَدُورُ عَلَيْنَا."],[5,53,"جَهْدَ أَيْمَٰنِهِمْ","مُجْتَهِدِينَ فِي الْحَلِفِ بِأَوْكَدِ الْأَيْمَانِ."],[5,53,"حَبِطَتْ","بَطَلَتْ."],[5,54,"أَذِلَّةٍ","رُحَمَاءَ."],[5,54,"أَعِزَّةٍ","أَشِدَّاءَ."],[5,54,"لَوْمَةَ لَآئِمٍ","اعْتِرَاضَ مُعْتَرِضٍ."],[5,60,"مَثُوبَةً","جَزَاءً، وَعُقُوبَةً."],[5,60,"ٱلطَّٰغُوتَ","كُلَّ مَنْ عُبِدَ مِنْ دُونِ اللهِ."],[5,62,"ٱلسُّحْتَ","الْحَرَامَ؛ وَمِنْهُ الرِّشْوَةُ وَالرِّبَا."],[5,64,"مَغْلُولَةٌ","مَحْبُوسَةٌ عَنْ فِعْلِ الْخَيْرِ."],[5,66,"مُّقْتَصِدَةٌ","مُعْتَدِلَةٌ، ثَابِتَةٌ عَلَى الْحَقِّ."],[5,68,"تُقِيمُوا۟","تَعْمَلُوا."],[5,69,"وَٱلصَّٰبِـُٔونَ","قَوْمٌ بَاقُونَ عَلَى فِطْرَتِهِمْ، وَلَا دِينَ لَهُمْ يَتَّبِعُونَهُ."],[5,71,"فِتْنَةٌ","عَذَابٌ، وَبَلَاءٌ."],[5,75,"وَأُمُّهُۥ صِدِّيقَةٌ","قَدْ صَدَّقَتْ تَصْدِيقًا جَازِمًا."],[5,77,"لَا تَغْلُوا۟","لَا تَتَجَاوَزُوا الْحَقَّ فِي اعْتِقَادِكُمْ."],[5,82,"قِسِّيسِينَ","عُلَمَاءَ النَّصَارَى."],[5,82,"وَرُهْبَانًا","عُبَّادَ النَّصَارَى."],[5,83,"تَفِيضُ","تَمْتَلِئُ دَمْعًا، فَيَنْسَكِبُ."],[5,83,"ٱلشَّٰهِدِينَ","الَّذِينَ يَشْهَدُونَ عَلَى الْأُمَمِ السَّابِقَةِ، وَهُمْ أُمَّةُ نَبِيِّنَا مُحَمَّدٍ ﷺ."],[5,85,"فَأَثَٰبَهُمُ","جَزَاهُمْ."],[5,89,"بِٱللَّغْوِ","مَا لَا يَقْصِدُهُ الْحَالِفُ؛ كَقَوْلِهِ: لَا وَاللهِ، وَبَلَى وَاللهِ."],[5,89,"عَقَّدتُّمُ","قَصَدْتُمْ عَقْدَهُ بِقُلُوبِكُمْ."],[5,89,"وَٱحْفَظُوٓا۟ أَيْمَٰنَكُمْ","اجْتَنِبُوا الْيَمِينَ مِنْ غَيْرِ حَاجَةٍ، وَإِنْ أَوْقَعْتُمُوهَا فَوَفُّوا بِهَا، وَكَفِّرُوهَا إِنْ لَمْ تَفُوا بِهَا."],[5,90,"وَٱلْمَيْسِرُ","الْقِمَارُ، وَهُوَ الْمُرَاهَنَاتُ الَّتِي فِيهَا عِوَضٌ مِنَ الْجَانِبَيْنِ."],[5,90,"وَٱلْأَنصَابُ","حِجَارَةٌ كَانَ الْمُشْرِكُونَ يَذْبَحُونَ عِنْدَهَا تَعْظِيمًا."],[5,90,"وَٱلْأَزْلَٰمُ","الْقِدَاحُ الَّتِي يَسْتَقْسِمُ بِهَا الْكُفَّارُ قَبْلَ الْإِقْدَامِ عَلَى الشَّيْءِ، أَوِ الْإِحْجَامِ عَنْهُ؛ يَكْتُبُونَ عَلَى أَحَدِهَا: (افْعَلْ)، وَعَلَى الْآخَرِ: (لَا تَفْعَلْ)، ثُمَّ يُحَرِّكُونَهَا فَأَيُّهَا خَرَجَ، عَمِلُوا بِهِ."],[5,90,"رِجْسٌ","إِثْمٌ."],[5,93,"جُنَاحٌ","حَرَجٌ، وَإِثْمٌ."],[5,95,"حُرُمٌ","مُحْرِمُونَ."],[5,95,"ٱلنَّعَمِ","بَهِيمَةِ الْأَنْعَامِ؛ مِنَ الْإِبِلِ وَالْبَقَرِ وَالْغَنَمِ."],[5,95,"ذَوَا","صَاحِبَا."],[5,95,"بَٰلِغَ ٱلْكَعْبَةِ","يَصِلُ لِفُقَرَاءِ الْحَرَمِ."],[5,95,"وَبَالَ أَمْرِهِۦ","عَاقِبَةَ فِعْلِهِ."],[5,96,"صَيْدُ ٱلْبَحْرِ","مَا يُصَادُ حَيًّا."],[5,96,"وَطَعَامُهُۥ","مَا يُصَادُ مَيِّتًا."],[5,96,"وَلِلسَّيَّارَةِ","لِلْمُسَافِرِينَ."],[5,97,"قِيَٰمًا لِّلنَّاسِ","صَلَاحًا لِدِينِهِمْ، وَأَمْنًا لِحَيَاتِهِمْ."],[5,97,"وَٱلْهَدْىَ","مَا يُهْدَى لِلْبَيْتِ مِنَ الْأَنْعَامِ وَغَيْرِهَا."],[5,97,"وَٱلْقَلَٰٓئِدَ","هُوَ الْهَدْيُ الَّذِي عُلِّقَ عَلَيْهِ شَيْءٌ؛ إِشْعَارًا بِأَنَّهُ هَدْيٌ."],[5,103,"بَحِيرَةٍ","الَّتِي تُقْطَعُ أُذُنُهَا، وَتُخَلَّى لِلطَّوَاغِيتِ؛ إِذَا وَلَدَتْ عَدَدًا مِنَ الْبُطُونِ."],[5,103,"سَآئِبَةٍ","الَّتِي تُتْرَكُ لِلْأَصْنَامِ؛ بِسَبَبِ بُرْءٍ مِنْ مَرَضٍ، أَوْ نَجَاةٍ مِنْ هَلَاكٍ."],[5,103,"وَصِيلَةٍ","الَّتِي تَتَّصِلُ وِلَادَتُهَا بِأُنْثَى بَعْدَ أُنْثَى؛ فَتُتْرَكُ لِلطَّوَاغِيتِ."],[5,103,"حَامٍ","الذَّكَرُ مِنَ الْإِبِلِ إِذَا وُلِدَ مِنْ صُلْبِهِ عَدَدٌ مِنَ الْإِبِلِ، لَا يُرْكَبُ، وَلَا يُحْمَلُ عَلَيْهِ."],[5,104,"حَسْبُنَا","كَافِينَا."],[5,105,"عَلَيْكُمْ أَنفُسَكُمْ","أَلْزِمُوا أَنْفُسَكُمُ الْعَمَلَ بِالطَّاعَةِ."],[5,106,"ضَرَبْتُمْ فِى ٱلْأَرْضِ","سَافَرْتُمْ."],[5,107,"إِثْمًا","خِيَانَةً."],[5,107,"ٱلْأَوْلَيَٰنِ","الْأَقْرَبَانِ لِلْمَيِّتِ."],[5,108,"أَدْنَىٰٓ","أَقْرَبُ."],[5,108,"عَلَىٰ وَجْهِهَآ","عَلَى حَقِيقَتِهَا."],[5,110,"أَيَّدتُّكَ","قَوَّيْتُكَ."],[5,110,"بِرُوحِ ٱلْقُدُسِ","جِبْرِيلَ عَلَيْهِ السَّلَامُ."],[5,110,"ٱلْأَكْمَهَ","مَنْ وُلِدَ أَعْمَى."],[5,112,"ٱلْحَوَارِيُّونَ","أَصْفِيَاءُ عِيسَى عَلَيْهِ السَّلَامُ."],[5,114,"تَكُونُ لَنَا عِيدًا","نَتَّخِذُ يَوْمَ نُزُولِهَا عِيدًا نُعَظِّمُهُ نَحْنُ، وَمَنْ بَعْدَنَا."],[5,114,"وَءَايَةً مِّنكَ","عَلَامَةً عَلَى وَحْدَانِيَّتِكَ وَنُبُوَّتِي."],[5,117,"شَهِيدًا","شَاهِدًا."],[6,1,"وَجَعَلَ","خَلَقَ."],[6,1,"يَعْدِلُونَ","يُسَوُّونَ بِهِ غَيْرَهُ، وَيُشْرِكُونَ."],[6,2,"تَمْتَرُونَ","تَشُكُّونَ."],[6,3,"وَهُوَ ٱللَّهُ","الْإِلَهُ الْمَعْبُودُ بِحَقٍّ."],[6,6,"قَرْنٍ","أُمَّةٍ مِنَ النَّاسِ."],[6,6,"مِّدْرَارًا","غَزِيرًا."],[6,8,"لَا يُنظَرُونَ","لَا يُمْهَلُونَ."],[6,9,"وَلَلَبَسْنَا","لَخَلَّطْنَا حَتَّى يَشْتَبِهَ عَلَيْهِمُ الْأَمْرُ."],[6,10,"فَحَاقَ","أَحَاطَ وَنَزَلَ."],[6,17,"يَمْسَسْكَ","يُصِبْكَ."],[6,23,"فِتْنَتُهُمْ","إِجَابَتُهُمْ."],[6,25,"أَكِنَّةً","أَغْطِيَةً."],[6,25,"وَقْرًا","ثِقَلًا وَصَمَمًا."],[6,25,"أَسَٰطِيرُ ٱلْأَوَّلِينَ","حِكَايَاتُهُمُ الَّتِي لَا حَقِيقَةَ لَهَا."],[6,26,"وَيَنْـَٔوْنَ","يَبْتَعِدُونَ."],[6,35,"كَبُرَ","عَظُمَ."],[6,38,"مَّا فَرَّطْنَا","مَا تَرَكْنَا."],[6,39,"صُمٌّ","الَّذِينَ لَا يَسْمَعُونَ."],[6,39,"وَبُكْمٌ","الَّذِينَ لَا يَتَكَلَّمُونَ."],[6,40,"أَرَءَيْتَكُمْ","أَخْبِرُونِي."],[6,42,"بِٱلْبَأْسَآءِ","الْفَقْرِ."],[6,42,"وَٱلضَّرَّآءِ","الْمَرَضِ."],[6,44,"مُّبْلِسُونَ","آيِسُونَ، مُنْقَطِعُونَ مِنْ كُلِّ خَيْرٍ."],[6,45,"فَقُطِعَ","اسْتُؤْصِلَ."],[6,45,"دَابِرُ ٱلْقَوْمِ","آخِرُهُمْ."],[6,46,"نُصَرِّفُ","نُنَوِّعُ."],[6,46,"يَصْدِفُونَ","يُعْرِضُونَ."],[6,52,"بِٱلْغَدَوٰةِ","أَوَّلِ النَّهَارِ."],[6,52,"وَٱلْعَشِىِّ","آخِرِ النَّهَارِ."],[6,53,"فَتَنَّا","ابْتَلَيْنَا بِاخْتِلَافِ الْأَرْزَاقِ وَغَيْرِهَا."],[6,54,"بِجَهَٰلَةٍ","بِسَفَاهَةٍ، وَكُلُّ عَاصٍ لِلَّهِ فَهُوَ جَاهِلٌ."],[6,59,"مَفَاتِحُ ٱلْغَيْبِ","خَزَائِنُ الْغَيْبِ؛ وَهِيَ خَمْسٌ مَذْكُورَةٌ فِي آخِرِ لُقْمَانَ."],[6,60,"جَرَحْتُم","اكْتَسَبْتُمْ."],[6,61,"لَا يُفَرِّطُونَ","لَا يُضَيِّعُونَ، وَلَا يُقَصِّرُونَ."],[6,63,"تَضَرُّعًا","مُظْهِرِينَ الضَّرَاعَةَ؛ وَهِيَ شِدَّةُ الْفَقْرِ إِلَى الشَّيْءِ وَالْحَاجَةِ."],[6,63,"وَخُفْيَةً","مُسِرِّينَ بِالدُّعَاءِ."],[6,65,"يَلْبِسَكُمْ شِيَعًا","يَخْلِطَكُمْ فِرَقًا مُتَنَاحِرَةً."],[6,65,"نُصَرِّفُ","نُنَوِّعُ."],[6,67,"مُّسْتَقَرٌّ","نِهَايَةٌ يُعْرَفُ بِهَا أَحَقٌّ، أَمْ بَاطِلٌ."],[6,68,"يَخُوضُونَ","يَتَكَلَّمُونَ مُسْتَهْزِئِينَ."],[6,70,"تُبْسَلَ","تُرْتَهَنَ، وَتُحْبَسَ."],[6,70,"تَعْدِلْ","تَفْتَدِ."],[6,70,"أُبْسِلُوا۟","ارْتُهِنُوا بِذُنُوبِهِمْ."],[6,70,"حَمِيمٍ","مَاءٍ بَالِغِ الْحَرَارَةِ."],[6,71,"ٱسْتَهْوَتْهُ","هَوَتْ بِهِ؛ فَأَضَلَّتْهُ."],[6,73,"ٱلصُّورِ","الْقَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ عَلَيْهِ السَّلَامُ."],[6,76,"جَنَّ","أَظْلَمَ."],[6,76,"ٱلْـَٔافِلِينَ","الْغَائِبِينَ."],[6,77,"أَفَلَ","غَابَ."],[6,79,"حَنِيفًا","مَائِلًا عَنِ الشِّرْكِ إِلَى التَّوْحِيدِ."],[6,82,"يَلْبِسُوٓا۟","يَخْلِطُوا."],[6,87,"وَٱجْتَبَيْنَٰهُمْ","اصْطَفَيْنَاهُمْ."],[6,90,"ٱقْتَدِهْ","اقْتَدِ وَاتَّبِعْ."],[6,91,"حَقَّ قَدْرِهِۦ","حَقَّ تَعْظِيمِهِ."],[6,91,"خَوْضِهِمْ","حَدِيثِهِمُ الْبَاطِلِ."],[6,93,"غَمَرَٰتِ","أَهْوَالِ."],[6,94,"خَوَّلْنَٰكُمْ","مَلَّكْنَاكُمْ مِنْ مَتَاعِ الدُّنْيَا."],[6,94,"تَّقَطَّعَ بَيْنَكُمْ","زَالَ تَوَاصُلُكُمْ."],[6,95,"فَالِقُ ٱلْحَبِّ","الَّذِي يَشُقُّ الْحَبَّ؛ فَيَخْرُجُ الزَّرْعُ مِنْهُ."],[6,95,"تُؤْفَكُونَ","تُصْرَفُونَ عَنِ الْحَقِّ."],[6,96,"فَالِقُ ٱلْإِصْبَاحِ","الَّذِي يَشُقُّ ضِيَاءَ الصُّبْحِ."],[6,96,"حُسْبَانًا","بِحِسَابٍ مُقَدَّرٍ."],[6,98,"فَمُسْتَقَرٌّ","رَحِمُ الْمَرْأَةِ؛ تَسْتَقِرُّ فِيهِ النُّطْفَةُ."],[6,98,"وَمُسْتَوْد "مُهْلَكٌ."],[7,141,"يَسُومُونَكُمْ","يُذِيقُونَكُمْ، وَيُكَلِّفُونَكُمْ."],[7,143,"لِمِيقَٰتِنَا","فِي الْوَقْتِ الَّذِي وَاعَدْنَاهُ فِيهِ."],[7,143,"صَعِقًا","مَغْشِيًّا عَلَيْهِ."],[7,145,"ٱلْأَلْوَاحِ","أَلْوَاحِ التَّوْرَاةِ."],[7,147,"حَبِطَتْ","بَطَلَتْ."],[7,148,"حُلِيِّهِمْ","ذَهَبِهِمْ."],[7,148,"خُوَارٌ","صَوْتٌ يُسْمَعُ؛ كَصَوْتِ الْبَقَرِ."],[7,149,"سُقِطَ فِىٓ أَيْدِيهِمْ","نَدِمُوا."],[7,150,"أَسِفًا","حَزِينًا."],[7,150,"ٱبْنَ أُمَّ","يَا ابْنَ أُمِّي!"],[7,150,"فَلَا تُشْمِتْ بِىَ ٱلْأَعْدَآءَ","لَا تُسِرَّ الْأَعْدَاءَ بِمَا تَفْعَلُ بِي."],[7,154,"سَكَتَ","سَكَنَ."],[7,155,"لِمِيقَٰتِنَا","لِلْوَقْتِ وَالْأَجَلِ الَّذِي وَاعَدْنَاهُ فِيهِ."],[7,155,"ٱلرَّجْفَةُ","الزَّلْزَلَةُ الشَّدِيدَةُ."],[7,156,"هُدْنَآ","رَجَعْنَا تَائِبِينَ إِلَيْكَ."],[7,157,"ٱلْأُمِّىَّ","الَّذِي لَا يَقْرَأُ، وَلَا يَكْتُبُ."],[7,157,"إِصْرَهُمْ","مَا كُلِّفُوهُ مِنَ الْأَعْمَالِ الشَّاقَّةِ."],[7,157,"وَعَزَّرُوهُ","وَقَّرُوهُ، وَعَظَّمُوهُ."],[7,160,"وَقَطَّعْنَٰهُمُ","فَرَّقْنَاهُمْ."],[7,160,"أَسْبَاطًا","قَبِيلَةً بِعَدَدِ الْأَسْبَاطِ، وَهُمْ أَبْنَاءُ يَعْقُوبَ عَلَيْهِ السَّلَامُ الِاثْنَا عَشَرَ."],[7,160,"فَٱنۢبَجَسَتْ","فَانْفَجَرَتْ، وَالِانْبِجَاسُ: أَوَّلُ الِانْفِجَارِ."],[7,160,"ٱلْغَمَٰمَ","السَّحَابَ."],[7,160,"ٱلْمَنَّ","شَيْئًا يُشْبِهُ الصَّمْغَ طَعْمُهُ كَالْعَسَلِ."],[7,160,"وَٱلسَّلْوَىٰ","طَائِرًا يُشْبِهُ السُّمَانَى."],[7,161,"ٱلْقَرْيَةَ","بَيْتَ الْمَقْدِسِ."],[7,161,"حِطَّةٌ","حُطَّ عَنَّا ذُنُوبَنَا."],[7,162,"رِجْزًا","عَذَابًا."],[7,163,"حَاضِرَةَ ٱلْبَحْرِ","عَلَى سَاحِلِ الْبَحْرِ الْأَحْمَرِ."],[7,163,"يَعْدُونَ فِى ٱلسَّبْتِ","يَعْتَدُونَ بِالصَّيْدِ فِي يَوْمِ السَّبْتِ، وَهُوَ مُحَرَّمٌ عَلَيْهِمْ."],[7,163,"شُرَّعًا","ظَاهِرَةً عَلَى وَجْهِ الْمَاءِ."],[7,163,"لَا يَسْبِتُونَ","فِي غَيْرِ يَوْمِ السَّبْتِ."],[7,164,"أُمَّةٌ","جَمَاعَةٌ."],[7,164,"مَعْذِرَةً","أَيْ: نَعِظُهُمْ؛ لِنُعْذَرَ إِلَى اللهِ فِيهِمْ."],[7,165,"بَـِٔيسٍۭ","شَدِيدٍ."],[7,166,"عَتَوْا۟","اسْتَكْبَرُوا، وَعَصَوْا."],[7,166,"خَٰسِـِٔينَ","أَذِلَّاءَ، مُبْعَدِينَ."],[7,167,"تَأَذَّنَ","أَعْلَمَ إِعْلَامًا صَرِيحًا."],[7,167,"يَسُومُهُمْ","يُذِيقُهُمْ."],[7,168,"وَقَطَّعْنَٰهُمْ","فَرَّقْنَاهُمْ."],[7,168,"أُمَمًا","جَمَاعَاتٍ."],[7,168,"بِٱلْحَسَنَٰتِ","بِالرَّخَاءِ فِي الْعَيْشِ."],[7,168,"وَٱلسَّيِّـَٔاتِ","الشِّدَّةِ فِي الْعَيْشِ."],[7,169,"فَخَلَفَ","فَجَاءَ."],[7,169,"خَلْفٌ","بَدَلُ سُوءٍ."],[7,169,"وَرِثُوا۟ ٱلْكِتَٰبَ","أَخَذُوهُ مِنْ أَسْلَافِهِمْ."],[7,169,"عَرَضَ هَٰذَا ٱلْأَدْنَىٰ","مَا يُعْرَضُ لَهُمْ مِنْ دَنِيءِ الْمَكَاسِبِ؛ كَالرِّشْوَةِ."],[7,169,"مِّيثَٰقُ ٱلْكِتَٰبِ","الْعُهُودُ فِي التَّوْرَاةِ؛ بِإِقَامَتِهَا، وَالْعَمَلِ بِهَا."],[7,169,"وَدَرَسُوا۟ مَا فِيهِ","عَلِمُوا مَا فِي الْكِتَابِ، فَضَيَّعُوهُ."],[7,170,"يُمَسِّكُونَ","يَتَمَسَّكُونَ."],[7,171,"نَتَقْنَا","رَفَعْنَا."],[7,171,"ظُلَّةٌ","سَحَابَةٌ."],[7,171,"وَظَنُّوٓا۟","أَيْقَنُوا."],[7,172,"وَأَشْهَدَهُمْ عَلَىٰٓ أَنفُسِهِمْ","قَرَّرَهُمْ بِمَا أُودِعَ فِي فِطَرِهِمْ مِنْ تَوْحِيدِهِ."],[7,172,"أَن تَقُولُوا۟","لِئَلَّا تَقُولُوا."],[7,173,"ذُرِّيَّةً","صِغَارًا."],[7,175,"فَٱنسَلَخَ مِنْهَا","خَرَجَ مِنْهَا بِكُفْرِهِ، وَنَبَذَهَا."],[7,175,"فَأَتْبَعَهُ ٱلشَّيْطَٰنُ","لَحِقَهُ، وَصَارَ قَرِينَهُ، وَاسْتَحْوَذَ عَلَيْهِ."],[7,176,"أَخْلَدَ إِلَى ٱلْأَرْضِ","رَكَنَ إِلَى الدُّنْيَا، وَرَضِيَ بِهَا."],[7,176,"تَحْمِلْ عَلَيْهِ","تَطْرُدْهُ."],[7,176,"يَلْهَثْ","يُخْرِجْ لِسَانَهُ لَاهِثًا."],[7,177,"سَآءَ","قَبُحَ."],[7,179,"ذَرَأْنَا","خَلَقْنَا."],[7,180,"يُلْحِدُونَ","يَمِيلُونَ عَنِ الْحَقِّ فِي أَسْمَائِهِ؛ كَأَنْ يُسَمُّوا آلِهَتَهُمْ بِأَسْمَائِهِ، أَوْ فِي مَعَانِيهَا بِتَحْرِيفِهَا."],[7,181,"يَعْدِلُونَ","يَقْضُونَ، وَيَحْكُمُونَ."],[7,182,"سَنَسْتَدْرِجُهُم","سَنَفْتَحُ لَهُمُ الْأَرْزَاقَ؛ لِيَغْتَرُّوا، ثُمَّ نُبَاغِتُهُمْ بِالْعُقُوبَةِ."],[7,183,"وَأُمْلِى لَهُمْ","أُمْهِلُهُمْ."],[7,183,"مَتِينٌ","قَوِيٌّ، شَدِيدٌ، لَا يُدْفَعُ بِقُوَّةٍ، وَلَا حِيلَةٍ."],[7,184,"جِنَّةٍ","جُنُونٍ."],[7,186,"يَعْمَهُونَ","يَتَحَيَّرُونَ، وَيَتَرَدَّدُونَ."],[7,187,"أَيَّانَ مُرْسَىٰهَا","مَتَى وُقُوعُهَا."],[7,187,"يُجَلِّيهَا","يُظْهِرُهَا."],[7,187,"ثَقُلَتْ","عَظُمَ عِلْمُهَا، وَخَفِيَ."],[7,187,"حَفِىٌّ عَنْهَا","حَرِيصٌ عَلَى الْعِلْمِ بِهَا."],[7,189,"لِيَسْكُنَ","لِيَأْنَسَ، وَيَطْمَئِنَّ."],[7,189,"تَغَشَّىٰهَا","جَامَعَهَا."],[7,189,"فَمَرَّتْ بِهِۦ","قَامَتْ بِهِ، وَقَعَدَتْ؛ لِخِفَّةِ الْحَمْلِ."],[7,189,"أَثْقَلَت","صَارَتْ ثَقِيلَةً لِأَجْلِ الْحَمْلِ."],[7,190,"فَتَعَٰلَى","تَعَاظَمَ، وَتَنَزَّهَ."],[7,195,"تُنظِرُونِ","تُمْهِلُونِ."],[7,196,"وَلِىِّۦَ","نَاصِرِي، وَحَافِظِي مِنْ كُلِّ سُوءٍ."],[7,199,"خُذِ ٱلْعَفْوَ","خُذْ مَا تَيَسَّرَ مِنْ أَخْلَاقِ النَّاسِ، وَلَا تُكَلِّفْهُمْ مَا لَا يُرِيدُونَ بَذْلَهُ لَكَ."],[7,199,"بِٱلْعُرْفِ","بِالْمَعْرُوفِ، وَهُوَ كُلُّ قَوْلٍ وَعَمَلٍ حَسَنٍ."],[7,199,"ٱلْجَٰهِلِينَ","السُّفَهَاءِ."],[7,200,"يَنزَغَنَّكَ","يُصِيبَنَّكَ."],[7,200,"نَزْغٌ","وَسْوَسَةٌ، وَتَثْبِيطٌ عَنِ الْخَيْرِ، وَحَثٌّ عَلَى الشَّرِّ."],[7,200,"فَٱسْتَعِذْ بِٱللَّهِ","فَالْجَأْ مُسْتَجِيرًا بِاللهِ."],[7,201,"طَٰٓئِفٌ مِّنَ ٱلشَّيْطَٰنِ","عَارِضٌ مِنْ وَسْوَسَةِ الشَّيْطَانِ."],[7,202,"يَمُدُّونَهُمْ","يُعِينُونَهُمْ فِي الْغَوَايَةِ."],[7,202,"لَا يُقْصِرُونَ","لَا يَدَّخِرُونَ وُسْعًا فِي غَوَايَتِهِمْ."],[7,203,"ٱجْتَبَيْتَهَا","اخْتَلَقْتَهَا وَأَحْدَثْتَهَا."],[7,203,"بَصَآئِرُ","حُجَجٌ، وَبَرَاهِينُ."],[7,205,"تَضَرُّعًا","تَخَشُّعًا وَتَذَلُّلًا."],[7,205,"وَخِيفَةً","تَوَاضُعًا، وَخَوْفًا مِنْهُ."],[7,205,"بِٱلْغُدُوِّ","بِأَوَّلِ النَّهَارِ."],[7,205,"وَٱلْـَٔاصَالِ","آخِرِ النَّهَارِ."],[7,206,"وَيُسَبِّحُونَهُۥ","يُنَزِّهُونَهُ عَمَّا لَا يَلِيقُ بِجَلَالِهِ."],[8,1,"ٱلْأَنفَالِ","الْغَنَائِمِ."],[8,2,"وَجِلَتْ","فَزِعَتْ."],[8,7,"ٱلطَّآئِفَتَيْنِ","عِيرِ قُرَيْشٍ، وَمَا تَحْمِلُهُ مِنْ أَرْزَاقٍ، أَوِ النَّفِيرِ لِقِتَالِهِمْ."],[8,7,"ذَاتِ ٱلشَّوْكَةِ","صَاحِبَةِ السِّلَاحِ، وَالْقُوَّةِ."],[8,7,"وَيَقْطَعَ","يَسْتَأْصِلَ."],[8,7,"دَابِرَ ٱلْكَٰفِرِينَ","آخِرَهُمْ، وَالْمُرَادُ: جَمِيعُهُمْ."],[8,9,"مُرْدِفِينَ","يَتْبَعُ بَعْضُهُمْ بَعْضًا."],[8,11,"يُغَشِّيكُمُ","يُلْقِي النُّعَاسَ عَلَيْكُمْ؛ كَالْغِطَاءِ."],[8,11,"أَمَنَةً","أَمَانًا."],[8,11,"رِجْزَ ٱلشَّيْطَٰنِ","وَسَاوِسَهُ وَتَخْوِيفَاتِهِ."],[8,11,"وَلِيَرْبِطَ","لِيَشُدَّ."],[8,12,"بَنَانٍ","طَرَفٍ، وَمَفْصِلٍ."],[8,15,"زَحْفًا","مُتَقَارِبِينَ مِنْكُمْ، مُجْتَمِعِينَ؛ كَأَنَّهُمْ لِكَثْرَتِهِمْ يَزْحَفُونَ."],[8,15,"ٱلْأَدْبَارَ","الظُّهُورَ."],[8,16,"مُتَحَرِّفًا لِّقِتَالٍ","مُظْهِرًا الْفِرَارَ؛ خِدْعَةً، ثُمَّ يَكُرُّ."],[8,16,"مُتَحَيِّزًا إِلَىٰ فِئَةٍ","مُنْحَازًا إِلَى جَمَاعَةِ الْمُسْلِمِينَ، سَوَاءٌ كَانُوا سَرِيَّةً فَانْحَازُوا لِلْجَيْشِ أَوِ انْحَازُوا لِلْإِمَامِ الْأَعْظَمِ."],[8,16,"بَآءَ","رَجَعَ."],[8,16,"ٱلْمَصِيرُ","الْمَرْجِعُ، وَالْمَآلُ."],[8,17,"وَلِيُبْلِىَ ٱلْمُؤْمِنِينَ","لِيُنْعِمَ عَلَيْهِمْ بِالنَّصْرِ وَالْأَجْرِ."],[8,18,"مُوهِنُ","مُضْعِفُ."],[8,19,"تَسْتَفْتِحُوا۟","تَطْلُبُوا ـ أَيُّهَا الْكُفَّارُ ـ مِنَ اللهِ أَنْ يُوقِعَ بَأْسَهُ بِالظَّالِمِينَ."],[8,19,"فِئَتُكُمْ","جَمَاعَتُكُمْ."],[8,22,"ٱلصُّمُّ","الَّذِينَ سُدَّتْ آذَانُهُمْ عَنْ سَمَاعِ الْحَقِّ."],[8,22,"ٱلْبُكْمُ","الَّذِينَ خَرِسَتْ أَلْسِنَتُهُمْ عَنِ النُّطْقِ بِالْحَقِّ."],[8,25,"فِتْنَةً","مِحْنَةً."],[8,26,"يَتَخَطَّفَكُمُ","يَأْخُذَكُمُ الْكُفَّارُ بِسُرْعَةٍ."],[8,26,"فَـَٔاوَىٰكُمْ","أَسْكَنَكُمُ الْمَدِينَةَ."],[8,28,"فِتْنَةٌ","اخْتِبَارٌ، وَابْتِلَاءٌ؛ أَتُطِيعُونَهُ، وَتَشْكُرُونَهُ، أَمْ تَنْشَغِلُونَ بِهَا عَنْهُ؟"],[8,29,"فُرْقَانًا","مَخْرَجًا، وَنَجَاةً، وَهِدَايَةً، وَنُورًا."],[8,29,"وَيُكَفِّرْ","يَمْحُ."],[8,29,"وَيَغْفِرْ","يَسْتُرْ فَلَا يُؤَاخِذْ."],[8,30,"لِيُثْبِتُوكَ","لِيَحْبِسُوكَ."],[8,31,"أَسَٰطِيرُ","أَكَاذِيبُ، وَحِكَايَاتُ."],[8,35,"مُكَآءً","صَفِيرًا."],[8,35,"وَتَصْدِيَةً","تَصْفِيقًا."],[8,36,"حَسْرَةً","نَدَامَةً."],[8,37,"فَيَرْكُمَهُۥ","فَيَجْعَلَهُ مُلْقًى بَعْضُهُ فَوْقَ بَعْضٍ."],[8,38,"سَلَفَ","سَبَقَ."],[8,38,"سُنَّتُ ٱلْأَوَّلِينَ","طَرِيقَتُنَا فِيهِمْ بِالْهَلَاكِ إِذَا كَذَّبُوا."],[8,39,"فِتْنَةٌ","شِرْكٌ، وَصَدٌّ عَنْ سَبِيلِ اللهِ."],[8,41,"وَلِذِى ٱلْقُرْبَىٰ","قَرَابَةِ رَسُولِ اللهِ ﷺ، وَهُمْ: بَنُو هَاشِمٍ، وَبَنُو الْمُطَّلِبِ، جَعَلَ الْخُمُسَ لَهُمْ مَكَانَ الصَّدَقَةِ؛ فَإِنَّهَا لَا تَحِلُّ لَهُمْ."],[8,41,"وَٱبْنِ ٱلسَّبِيلِ","الْمُسَافِرِ، الْمُنْقَطِعِ."],[8,41,"ٱلْجَمْعَانِ","جَمْعُ الْمُؤْمِنِينَ، وَجَمْعُ الْكَافِرِينَ."],[8,42,"بِٱلْعُدْوَةِ ٱلدُّنْيَا","بِجَانِبِ الْوَادِي الْأَقْرَبِ إِلَى الْمَدِينَةِ."],[8,42,"بِٱلْعُدْوَةِ ٱلْقُصْوَىٰ","بِجَانِبِ الْوَادِي الْأَبْعَدِ."],[8,42,"وَٱلرَّكْبُ","عِيرُ قُرَيْشٍ الَّتِي فِيهَا تِجَارَتُهُمْ."],[8,42,"أَسْفَلَ مِنكُمْ","قَرِيبًا مِنْ سَاحِلِ الْبَحْرِ الْأَحْمَرِ."],[8,43,"فَشِلْتُمْ","لَجَبُنْتُمْ، وَتَرَدَّدْتُمْ."],[8,43,"سَلَّمَ","وَقَاكُمْ مِنَ الْفَشَلِ، وَنَجَّاكُمْ مِنْ عَاقِبَتِهِ."],[8,46,"فَتَفْشَلُوا۟","تَضْعُفُوا، وَتَجْبُنُوا."],[8,47,"بَطَرًا","كِبْرًا."],[8,48,"جَارٌ لَّكُمْ","نَاصِرُكُمْ، وَمُجِيرُكُمْ."],[8,48,"تَرَآءَتِ","تَقَابَلَتْ."],[8,48,"نَكَصَ","رَجَعَ مُدْبِرًا."],[8,52,"كَدَأْبِ","كَعَادَةٍ، وَسُنَّةٍ."],[8,57,"تَثْقَفَنَّهُمْ","تَجِدَنَّهُمْ."],[8,57,"فَشَرِّدْ بِهِم مَّنْ خَلْفَهُمْ","أَنْزِلْ بِهِمْ عَذَابًا يُخَوِّفُ مَنْ وَرَاءَهُمْ."],[8,58,"فَٱنۢبِذْ","فَاطْرَحْ عَهْدَهُمْ."],[8,58,"عَلَىٰ سَوَآءٍ","لِتَكُونُوا وَإِيَّاهُمْ مُسْتَوِينَ فِي الْعِلْمِ بِطَرْحِهِ."],[8,59,"سَبَقُوٓا۟","فَاتُوا، وَنَجَوْا مِنْ عَذَابِ اللهِ."],[8,61,"جَنَحُوا۟","مَالُوا."],[8,61,"لِلسَّلْمِ","لِلْمُسَالَمَةِ وَتَرْكِ الْحَرْبِ."],[8,61,"فَٱجْنَحْ","مِلْ."],[8,62,"حَسْبَكَ","كَافِيكَ."],[8,65,"حَرِّضِ","حُثَّ."],[8,67,"يُثْخِنَ","يُبَالِغَ فِي الْقَتْلِ."],[8,71,"فَأَمْكَنَ مِنْهُمْ","أَقْدَرَكَ عَلَيْهِمْ."],[8,72,"ءَاوَوا۟","أَنْزَلُوا الْمُهَاجِرِينَ فِي دُورِهِمْ."],[8,75,"وَأُو۟لُوا۟ ٱلْأَرْحَامِ","ذَوُو الْقَرَابَاتِ."],[9,3,"وَأَذَٰنٌ","إِعْلَامٌ."],[9,4,"لَمْ يَنقُصُوكُمْ","لَمْ يَخُونُوا الْعَهْدَ."],[9,4,"وَلَمْ يُظَٰهِرُوا۟","لَمْ يُعَاوِنُوا."],[9,5,"ٱنسَلَخَ","انْقَضَى."],[9,5,"ٱلْأَشْهُرُ ٱلْحُرُمُ","الْأَشْهُرُ الْأَرْبَعَةُ الَّتِي أَمَّنْتُمْ فِيهَا الْمُشْرِكِينَ، بَدَأَتْ يَوْمَ النَّحْرِ، وَانْتَهَتْ فِي الْعَاشِرِ مِنْ رَبِيعٍ الثَّانِي."],[9,5,"وَٱحْصُرُوهُمْ","حَاصِرُوهُمْ فِي مَعَاقِلِهِمْ."],[9,6,"ٱسْتَجَارَكَ","طَلَبَ الْأَمَانَ مِنَ الْقَتْلِ."],[9,7,"ٱسْتَقَٰمُوا۟","وَفَّوْا بِعَهْدِكُمْ."],[9,8,"يَظْهَرُوا۟","يَظْفَرُوا بِكُمْ."],[9,8,"إِلًّا","قَرَابَةً."],[9,8,"ذِمَّةً","عَهْدًا."],[9,12,"نَّكَثُوٓا۟","نَقَضُوا."],[9,12,"أَيْمَٰنَهُم","مَوَاثِيقَهُمْ، وَعُهُودَهُمْ."],[9,12,"لَآ أَيْمَٰنَ لَهُمْ","لَا عَهْدَ لَهُمْ وَلَا ذِمَّةَ."],[9,16,"وَلِيجَةً","بِطَانَةً، وَأَوْلِيَاءَ."],[9,24,"ٱقْتَرَفْتُمُوهَا","اكْتَسَبْتُمُوهَا."],[9,24,"كَسَادَهَا","عَدَمَ رَوَاجِهَا."],[9,25,"فَلَمْ تُغْنِ عَنكُمْ","لَمْ تَنْفَعْكُمْ."],[9,25,"وَلَّيْتُم مُّدْبِرِينَ","فَرَرْتُمْ مُنْهَزِمِينَ."],[9,28,"عَيْلَةً","فَقْرًا."],[9,29,"ٱلْجِزْيَةَ","مَالٌ يُفْرَضُ عَلَى الْكَافِرِ الْمُقِيمِ بِبِلَادِ الْمُسْلِمِينَ."],[9,29,"صَٰغِرُونَ","أَذِلَّاءُ."],[9,30,"يُضَٰهِـُٔونَ","يُشَابِهُونَ."],[9,30,"أَنَّىٰ يُؤْفَكُونَ","كَيْفَ يُصْرَفُونَ عَنِ الْحَقِّ؟!"],[9,31,"أَحْبَارَهُمْ","عُلَمَاءَ الْيَهُودِ."],[9,31,"وَرُهْبَٰنَهُمْ","عُبَّادَ النَّصَارَى."],[9,31,"سُبْحَٰنَهُۥ","تَنَزَّهَ، وَتَقَدَّسَ."],[9,33,"لِيُظْهِرَهُۥ","لِيُعْلِيَهُ."],[9,34,"لَيَأْكُلُونَ","لَيَأْخُذُونَ."],[9,34,"يَكْنِزُونَ","لَا يُؤَدُّونَ الزَّكَاةَ."],[9,36,"كِتَٰبِ ٱللَّهِ","اللَّوْحِ الْمَحْفُوظِ."],[9,36,"أَرْبَعَةٌ حُرُمٌ","حَرَّمَ اللهُ فِيهَا الْقِتَالَ، وَهِيَ: ذُو الْقَعْدَةِ، وَذُو الْحِجَّةِ، وَالْمُحَرَّمُ، وَرَجَبٌ."],[9,37,"ٱلنَّسِىٓءُ","التَّأْخِيرُ لِحُرْمَةِ شَهْرٍ إِلَى شَهْرٍ آخَرَ."],[9,37,"لِّيُوَاطِـُٔوا۟","لِيُوَافِقُوا."],[9,37,"عِدَّةَ","عَدَدَ."],[9,38,"ٱثَّاقَلْتُمْ","تَبَاطَأْتُمْ، وَتَكَاسَلْتُمْ."],[9,39,"إِلَّا تَنفِرُوا۟","إِلَّا تَخْرُجُوا لِلْجِهَادِ."],[9,42,"عَرَضًا قَرِيبًا","مَتَاعًا مِنَ الدُّنْيَا، سَهْلَ الْمَأْخَذِ."],[9,42,"وَسَفَرًا قَاصِدًا","مُتَوَسِّطًا بَيْنَ الْقَرِيبِ وَالْبَعِيدِ."],[9,42,"ٱلشُّقَّةُ","الْمَسَافَةُ الَّتِي تُقْطَعُ بِمَشَقَّةٍ."],[9,45,"وَٱرْتَابَتْ","شَكَّتْ."],[9,45,"يَتَرَدَّدُونَ","يَتَحَيَّرُونَ."],[9,46,"لَأَعَدُّوا۟ لَهُۥ عُدَّةً","لَتَأَهَّبُوا بِالزَّادِ وَالرَّاحِلَةِ."],[9,46,"ٱنۢبِعَاثَهُمْ","خُرُوجَهُمْ لِلْجِهَادِ مَعَكَ."],[9,46,"فَثَبَّطَهُمْ","ثَقَّلَ عَلَيْهِمُ الْخُرُوجَ."],[9,47,"خَبَالًا","فَسَادًا، وَاضْطِرَابًا."],[9,47,"وَلَأَوْضَعُوا۟ خِلَٰلَكُمْ","لَأَسْرَعُوا السَّيْرَ بَيْنَكُمْ بِالنَّمِيمَةِ."],[9,47,"يَبْغُونَكُمُ ٱلْفِتْنَةَ","يَطْلُبُونَ فِتْنَتَكُمْ، وَفَسَادَ ذَاتِ بَيْنِكُمْ."],[9,47,"سَمَّٰعُونَ","جَوَاسِيسُ يَسْمَعُونَ أَخْبَارَكُمْ، وَيَنْقُلُونَهَا إِلَيْهِمْ."],[9,48,"وَقَلَّبُوا۟ لَكَ ٱلْأُمُورَ","دَبَّرُوا الْحِيَلَ."],[9,52,"تَرَبَّصُونَ","تَنْتَظِرُونَ."],[9,52,"إِحْدَى ٱلْحُسْنَيَيْنِ","الشَّهَادَةَ أَوِ النَّصْرَ."],[9,55,"وَتَزْهَقَ أَنفُسُهُمْ","تَخْرُجَ أَرْوَاحُهُمْ."],[9,56,"يَفْرَقُونَ","يَخَافُونَ."],[9,57,"مَلْجَـًٔا","مَأْمَنًا، وَحِصْنًا."],[9,57,"مَغَٰرَٰتٍ","كُهُوفًا فِي الْجِبَالِ."],[9,57,"مُدَّخَلًا","نَفَقًا."],[9,57,"يَجْمَحُونَ","يُسْرِعُونَ."],[9,58,"يَلْمِزُكَ","يَعِيبُكَ."],[9,59,"حَسْبُنَا ٱللَّهُ","كَافِينَا اللهُ."],[9,60,"لِلْفُقَرَآءِ","لِلَّذِينَ لَا يَمْلِكُونَ شَيْئًا."],[9,60,"وَٱلْمَسَٰكِينِ","الَّذِينَ يَمْلِكُونَ دُونَ كِفَايَتِهِمْ."],[9,60,"وَٱلْعَٰمِلِينَ عَلَيْهَا","السُّعَاةِ الَّذِينَ يَجْمَعُونَ الزَّكَاةَ."],[9,60,"وَٱلْمُؤَلَّفَةِ قُلُوبُهُمْ","مَنْ يُرْجَى إِسْلَامُهُمْ، أَوْ دَفْعُ شَرِّهِمْ."],[9,60,"ٱلرِّقَابِ","عِتْقِ الْأَرِقَّاءِ، وَفَكَاكِ الْأَسْرَى."],[9,60,"وَٱلْغَٰرِمِينَ","الْمَدِينِينَ، وَمَنْ غَرِمُوا لِإِصْلَاحِ ذَاتِ الْبَيْنِ."],[9,60,"وَفِى سَبِيلِ ٱللَّهِ","فِي الْجِهَادِ."],[9,60,"وَٱبْنِ ٱلسَّبِيلِ","الْمُسَافِرِ، الْمُنْقَطِعِ."],[9,61,"أُذُنٌ","يَسْتَمِعُ لِكُلِّ مَا يُقَالُ لَهُ، فَيُصَدِّقُهُ."],[9,61,"وَيُؤْمِنُ لِلْمُؤْمِنِينَ","يُصَدِّقُ الْمُؤْمِنِينَ فِيمَا يُخْبِرُونَهُ."],[9,63,"يُحَادِدِ","يُشَاقَّ وَيُخَالِفْ."],[9,68,"حَسْبُهُمْ","كَافِيهِمْ."],[9,69,"فَٱسْتَمْتَعُوا۟ بِخَلَٰقِهِمْ","فَتَمَتَّعُوا بِنَصِيبِهِمْ مِنْ مَلَاذِّ الدُّنْيَا."],[9,69,"وَخُضْتُمْ","دَخَلْتُمْ فِي الْكَذِبِ وَالْبَاطِلِ."],[9,69,"حَبِطَتْ","بَطَلَتْ."],[9,70,"وَٱلْمُؤْتَفِكَٰتِ","قُرَى قَوْمِ لُوطٍ، سُمِّيَتْ بِذَلِكَ؛ لِأَنَّ اللهَ قَلَبَهَا عَلَيْهِمْ."],[9,72,"عَدْنٍ","إِقَامَةٍ."],[9,74,"نَقَمُوٓا۟","كَرِهُوا، وَعَابُوا."],[9,77,"فَأَعْقَبَهُمْ","فَصَيَّرَ عَاقِبَتَهُمْ وَجَزَاءَهُمْ."],[9,79,"يَلْمِزُونَ","يَعِيبُونَ."],[9,79,"ٱلْمُطَّوِّعِينَ","الَّذِينَ يَتَطَوَّعُونَ بِالصَّدَقَةِ بِالْمَالِ الْكَثِيرِ."],[9,81,"بِمَقْعَدِهِمْ","بِقُعُودِهِمْ."],[9,81,"خِلَٰفَ","مُخَالِفِينَ."],[9,83,"ٱلْخَٰلِفِينَ","الْمُتَخَلِّفِينَ عَنِ الْجِهَادِ."],[9,86,"أُو۟لُوا۟ ٱلطَّوْلِ","أَصْحَابُ الْغِنَى وَالسَّعَةِ."],[9,87,"ٱلْخَوَالِفِ","الْقَاعِدِينَ، الْمُتَخَلِّفِينَ؛ مِنَ النِّسَاءِ، وَالصِّبْيَانِ، وَأَصْحَابِ الْأَعْذَارِ."],[9,87,"وَطُبِعَ","خُتِمَ."],[9,90,"ٱلْمُعَذِّرُونَ","الْمُعْتَذِرُونَ."],[9,91,"ٱلضُّعَفَآءِ","كَالشُّيُوخِ."],[9,91,"حَرَجٌ","إِثْمٌ."],[9,91,"نَصَحُوا۟ لِلَّهِ","أَخْلَصُوا لِلَّهِ، وَلَمْ يُثَبِّطُوا، وَعَلِمَ اللهُ مِنْ قُلُوبِهِمْ أَنَّهُمْ لَوْلَا الْعُذْرُ لَجَاهَدُوا."],[9,92,"لِتَحْمِلَهُمْ","لِتَجِدَ لَهُمْ دَوَابَّ يَرْكَبُونَهَا لِلْجِهَادِ."],[9,92,"تَفِيضُ","تَسِيلُ."],[9,93,"ٱلسَّبِيلُ","الْإِثْمُ، وَاللَّوْمُ."],[9,93,"ٱلْخَوَالِفِ","النِّسَاءِ، وَالصِّبْيَانِ."],[9,94,"لَن نُّؤْمِنَ لَكُمْ","لَنْ نُصَدِّقَكُمْ."],[9,95,"ٱنقَلَبْتُمْ","رَجَعْتُمْ."],[9,95,"رِجْسٌ","خُبَثَاءُ الْبَوَاطِنِ."],[9,97,"ٱلْأَعْرَابُ","سُكَّانُ الْبَادِيَةِ."],[9,97,"وَأَجْدَرُ","أَحَقُّ، وَأَحْرَى."],[9,98,"مَغْرَمًا","غَرَامَةً، وَخَسَارَةً."],[9,98,"وَيَتَرَبَّصُ","يَنْتَظِرُ."],[9,98,"ٱلدَّوَآئِرَ","الْحَوَادِثَ وَالْآفَاتِ."],[9,98,"عَلَيْهِمْ دَآئِرَةُ ٱلسَّوْءِ","دُعَاءٌ بِالشَّرِّ وَالْعَذَابِ يَدُورُ عَلَيْهِمْ."],[9,101,"مَرَدُوا۟","لَجُّوا فِيهِ، وَاسْتَمَرُّوا عَلَيْهِ، وَجُرِّبُوا."],[9,103,"وَتُزَكِّيهِم بِهَا","تَرْفَعُهُمْ بِهَا عَنْ مَنَازِلِ الْمُنَافِقِينَ."],[9,103,"وَصَلِّ عَلَيْهِمْ","ادْعُ لَهُمْ بِالْمَغْفِرَةِ."],[9,103,"سَكَنٌ لَّهُمْ","رَحْمَةٌ، وَطُمَأْنِينَةٌ لَهُمْ."],[9,106,"مُرْجَوْنَ","مُؤَخَّرُونَ."],[9,107,"ضِرَارًا","مُضَارَّةً لِلْمُؤْمِنِينَ."],[9,107,"وَإِرْصَادًا","انْتِظَارًا."],[9,109,"شَفَا","طَرَفِ."],[9,109,"جُرُفٍ هَارٍ","حُفْرَةٍ مُتَدَاعِيَةٍ لِلسُّقُوطِ."],[9,110,"رِيبَةً","شَكًّا، وَنِفَاقًا."],[9,110,"تَقَطَّعَ قُلُوبُهُمْ","بِالْمَوْتِ، أَوْ بِالنَّدَامَةِ وَالتَّوْبَةِ."],[9,111,"وَمَنْ أَوْفَىٰ","لَا أَحَدَ أَوْفَى."],[9,111,"فَٱسْتَبْشِرُوا۟","أَظْهِرُوا السُّرُورَ."],[9,112,"ٱلسَّٰٓئِحُونَ","الصَّائِمُونَ."],[9,117,"سَاعَةِ ٱلْعُسْرَةِ","وَقْتِ الشِّدَّةِ، وَالْمُرَادُ: غَزْوَةُ تَبُوكَ."],[9,117,"يَزِيغُ","يَمِيلُ."],[9,118,"بِمَا رَحُبَتْ","مَعَ رَحْبِهَا وَسَعَتِهَا."],[9,120,"وَلَا يَرْغَبُوا۟ بِأَنفُسِهِمْ عَن نَّفْسِهِۦ","بِأَنْ لَا يَرْضَوْا بِالرَّاحَةِ لِأَنْفُسِهِمْ مَعَ تَعَبِهِ ﷺ."],[9,120,"نَصَبٌ","تَعَبٌ."],[9,120,"مَخْمَصَةٌ","مَجَاعَةٌ."],[9,120,"يَغِيظَ","يُغْضِبُ، وَيُغِمُّ."],[9,120,"نَّيْلًا","قَتْلًا، أَوْ هَزِيمَةً، أَوْ أَذًى."],[9,122,"لِيَنفِرُوا۟ كَآفَّةً","لِيَخْرُجُوا لِلْجِهَادِ جَمِيعًا."],[9,123,"ٱلَّذِينَ يَلُونَكُم","الْقَرِيبِينَ مِنْكُمْ."],[9,125,"مَّرَضٌ","شَكٌّ، وَنِفَاقٌ."],[9,125,"رِجْسًا","نِفَاقًا وَشَكًّا."],[9,126,"يُفْتَنُونَ","يُبْتَلَوْنَ بِالْقَحْطِ وَالشِّدَّةِ، وَإِظْهَارِ مَا يُبْطِنُونَهُ مِنَ النِّفَاقِ."],[9,128,"عَزِيزٌ","صَعْبٌ، وَشَاقٌّ عَلَيْهِ."],[9,128,"مَا عَنِتُّمْ","عَنَتُكُمْ، وَمَشَقَّتُكُمْ."],[9,129,"حَسْبِىَ","كَافِيَّ."],[10,2,"قَدَمَ صِدْقٍ","أَجْرًا حَسَنًا بِمَا قَدَّمُوا مِنْ صَالِحِ الْأَعْمَالِ."],[10,3,"ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ","عَلَا عَلَى الْعَرْشِ عُلُوًّا يَلِيقُ بِجَلَالِهِ وَعَظَمَتِهِ."],[10,4,"بِٱلْقِسْطِ","بِالْعَدْلِ."],[10,4,"حَمِيمٍ","مَاءٍ بَالِغٍ غَايَةَ الْحَرَارَةِ."],[10,5,"وَقَدَّرَهُۥ مَنَازِلَ","صَيَّرَ الْقَمَرَ ذَا مَنَازِلَ يَسِيرُ فِيهَا."],[10,6,"ٱخْتِلَٰفِ","تَعَاقُبِ."],[10,10,"دَعْوَىٰهُمْ","دُعَاؤُهُمْ."],[10,11,"يَعْمَهُونَ","يَتَرَدَّدُونَ حَائِرِينَ."],[10,12,"لِجَنۢبِهِۦٓ","مُضْطَجِعًا."],[10,12,"مَرَّ","اسْتَمَرَّ عَلَى كُفْرِهِ."],[10,13,"ٱلْقُرُونَ","الْأُمَمَ الْمُكَذِّبَةَ."],[10,14,"جَعَلْنَٰكُمْ خَلَٰٓئِفَ","اسْتَخْلَفْنَاكُمْ مِنْ بَعْدِ إِهْلَاكِهِمْ."],[10,15,"تِلْقَآئِ نَفْسِىٓ","مِنْ قِبَلِ نَفْسِي."],[10,16,"أَدْرَىٰكُم","أَعْلَمَكُمْ."],[10,22,"ٱلْفُلْكِ","السُّفُنِ."],[10,22,"عَاصِفٌ","شَدِيدَةُ الْهُبُوبِ."],[10,23,"يَبْغُونَ","يُفْسِدُونَ."],[10,24,"زُخْرُفَهَا","بَهْجَتَهَا وَنَضَارَتَهَا."],[10,24,"حَصِيدًا","مَحْصُودَةً، مَقْطُوعَةً."],[10,24,"لَمْ تَغْنَ بِٱلْأَمْسِ","لَمْ تَكُنْ قَائِمَةً بِالْأَمْسِ."],[10,25,"دَارِ ٱلسَّلَٰمِ","الْجَنَّةِ."],[10,26,"ٱلْحُسْنَىٰ","الْجَنَّةُ."],[10,26,"وَزِيَادَةٌ","زَائِدَةٌ عَلَى الْجَنَّةِ وَهِيَ: النَّظَرُ إِلَى وَجْهِ اللهِ الْكَرِيمِ."],[10,26,"يَرْهَقُ","يَغْشَى."],[10,26,"قَتَرٌ","غُبَارٌ."],[10,27,"عَاصِمٍ","مَانِعٍ يَمْنَعُ عَذَابَ اللهِ."],[10,27,"أُغْشِيَتْ","أُلْبِسَتْ."],[10,28,"مَكَانَكُمْ","الْزَمُوا مَكَانَكُمْ."],[10,28,"فَزَيَّلْنَا","فَرَّقْنَا."],[10,30,"تَبْلُوا۟","تُعَايِنُ، وَتَتَفَقَّدُ."],[10,30,"ٱلْحَقِّ","اللهُ الَّذِي لَا رَيْبَ فِي رُبُوبِيَّتِهِ وَأُلُوهِيَّتِهِ."],[10,33,"حَقَّتْ","ثَبَتَتْ، وَوَجَبَتْ."],[10,34,"فَأَنَّىٰ تُؤْفَكُونَ","فَكَيْفَ تُصْرَفُونَ؟!"],[10,35,"لَّا يَهِدِّىٓ","لَا يَهْتَدِي."],[10,39,"وَلَمَّا يَأْتِهِمْ تَأْوِيلُهُۥ","وَلَمْ يَأْتِهِمْ بَعْدُ حَقِيقَةُ مَا وُعِدُوا بِهِ فِي الْكِتَابِ."],[10,43,"يَنظُرُ إِلَيْكَ","يُبْصِرُكَ، وَيُعَايِنُ أَدِلَّةَ نُبُوَّتِكَ الصَّادِقَةِ."],[10,50,"أَرَءَيْتُمْ","أَخْبِرُونِي."],[10,50,"بَيَٰتًا","لَيْلًا."],[10,51,"أَثُمَّ","أَبَعْدَمَا؟"],[10,53,"وَيَسْتَنۢبِـُٔونَكَ","يَسْتَخْبِرُونَكَ."],[10,54,"بِٱلْقِسْطِ","بِالْعَدْلِ."],[10,59,"تَفْتَرُونَ","تَكْذِبُونَ."],[10,61,"شَأْنٍ","أَمْرٍ مِنْ أُمُورِكَ."],[10,61,"تُفِيضُونَ","تَشْرَعُونَ فِيهِ، وَتَعْمَلُونَهُ."],[10,61,"يَعْزُبُ","يَغِيبُ."],[10,61,"مِثْقَالِ ذَرَّةٍ","زِنَةِ نَمْلَةٍ صَغِيرَةٍ."],[10,68,"سُبْحَٰنَهُۥ","تَنَزَّهَ، وَتَقَدَّسَ."],[10,68,"سُلْطَٰنٍ","حُجَّةٍ، وَدَلِيلٍ."],[10,71,"كَبُرَ","عَظُمَ."],[10,71,"فَأَجْمِعُوٓا۟","اعْزِمُوا، وَأَعِدُّوا."],[10,71,"غُمَّةً","مُسْتَتِرًا."],[10,71,"ٱقْضُوٓا۟ إِلَىَّ","اقْضُوا عَلَيَّ بِالْعُقُوبَةِ."],[10,71,"تُنظِرُونِ","تُمْهِلُونِ."],[10,73,"ٱلْفُلْكِ","السَّفِينَةِ."],[10,73,"خَلَٰٓئِفَ","يَخْلُفُونَ الْمُكَذِّبِينَ فِي الْأَرْضِ."],[10,74,"نَطْبَعُ","نَخْتِمُ."],[10,75,"وَمَلَإِيْهِۦ","أَشْرَافِ قَوْمِهِ."],[10,78,"لِتَلْفِتَنَا","لِتَصْرِفَنَا."],[10,78,"ٱلْكِبْرِيَآءُ","الْعَظَمَةُ، وَالسُّلْطَانُ."],[10,82,"وَيُحِقُّ","يُثْبِتُ وَيُعْلِي."],[10,83,"لَعَالٍ","لَجَبَّارٌ، مُسْتَكْبِرٌ."],[10,83,"ٱلْمُسْرِفِينَ","الْمُتَجَاوِزِينَ الْحَدَّ فِي الْكُفْرِ وَالْفَسَادِ."],[10,84,"مُّسْلِمِينَ","مُذْعِنِينَ لَهُ بِالطَّاعَةِ."],[10,85,"لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ ٱلظَّٰلِمِينَ","لَا تَنْصُرْهُمْ عَلَيْنَا، فَيَظُنُّوا أَنَّهُمْ عَلَى الْحَقِّ؛ فَيُفْتَنُوا، أَوْ يَفْتِنُونَا عَنِ الدِّينِ."],[10,87,"تَبَوَّءَا","اتَّخِذَا."],[10,87,"قِبْلَةً","مَسَاجِدَ تُصَلُّونَ فِيهَا عِنْدَ الْخَوْفِ."],[10,88,"ٱطْمِسْ عَلَىٰٓ أَمْوَٰلِهِمْ","أَتْلِفْهَا."],[10,88,"وَٱشْدُدْ عَلَىٰ قُلُوبِهِمْ","اخْتِمْ عَلَيْهَا حَتَّى لَا تُؤْمِنَ."],[10,89,"فَٱسْتَقِيمَا","فَاثْبُتَا عَلَى الدِّينِ، وَاسْتَمِرَّا عَلَى الدَّعْوَةِ."],[10,89,"وَلَا تَتَّبِعَانِّ","لَا تَسْلُكَا."],[10,90,"وَجَٰوَزْنَا","قَطَعْنَا."],[10,90,"بَغْيًا وَعَدْوًا","ظُلْمًا، وَعُدْوَانًا."],[10,92,"نُنَجِّيكَ","نُخْرِجُكَ مِنَ الْبَحْرِ، وَنَجْعَلُكَ عَلَى مُرْتَفِعٍ مِنَ الْأَرْضِ."],[10,92,"ءَايَةً","عِبْرَةً."],[10,93,"بَوَّأْنَا","أَنْزَلْنَا."],[10,93,"مُبَوَّأَ صِدْقٍ","مَنْزِلًا صَالِحًا بِالشَّامِ وَمِصْرَ."],[10,94,"ٱلْمُمْتَرِينَ","الشَّاكِّينَ."],[10,96,"حَقَّتْ","وَجَبَتْ."],[10,98,"فَلَوْلَا","فَهَلَّا."],[10,98,"ٱلْخِزْىِ","الذُّلِّ وَالْهَوَانِ."],[10,100,"ٱلرِّجْسَ","الْعَذَابَ."],[10,101,"وَمَا تُغْنِى","لَا تَنْفَعُ."],[10,102,"خَلَوْا۟","مَضَوْا."],[10,105,"أَقِمْ وَجْهَكَ لِلدِّينِ","أَقِمْ نَفْسَكَ عَلَى الْإِسْلَامِ مُسْتَقِيمًا عَلَيْهِ."],[10,105,"حَنِيفًا","مَائِلًا عَنِ الشِّرْكِ إِلَى التَّوْحِيدِ."],[11,1,"فُصِّلَتْ","بُيِّنَتْ بِالْأَمْرِ وَالنَّهْيِ."],[11,3,"تُوبُوٓا۟ إِلَيْهِ","ارْجِعُوا إِلَيْهِ نَادِمِينَ."],[11,5,"يَثْنُونَ صُدُورَهُمْ","يُضْمِرُونَ فِي صُدُورِهِمُ الْكُفْرَ."],[11,5,"لِيَسْتَخْفُوا۟ مِنْهُ","لِيَسْتَتِرُوا مِنَ اللهِ."],[11,5,"يَسْتَغْشُونَ ثِيَابَهُمْ","يَتَغَطَّوْنَ بِثِيَابِهِمْ."],[11,6,"مُسْتَقَرَّهَا","مَسْكَنَهَا فِي الدُّنْيَا، وَبَعْدَ الْمَوْتِ."],[11,6,"وَمُسْتَوْدَعَهَا","الْمَوْضِعَ الَّذِي تَمُوتُ فِيهِ."],[11,7,"لِيَبْلُوَكُمْ","لِيَخْتَبِرَكُمْ."],[11,8,"أُمَّةٍ مَّعْدُودَةٍ","أَجَلٍ مَعْلُومٍ."],[11,8,"مَا يَحْبِسُهُۥٓ","مَا يَمْنَعُهُ؟"],[11,8,"وَحَاقَ","أَحَاطَ بِهِمْ مِنْ كُلِّ جَانِبٍ."],[11,9,"لَيَـُٔوسٌ","شَدِيدُ الْيَأْسِ وَالْقُنُوطِ."],[11,10,"ضَرَّآءَ","ضِيقٍ وَنَكْبَةٍ."],[11,10,"ٱلسَّيِّـَٔاتُ","الضِّيقُ، وَالشَّدَائِدُ."],[11,10,"لَفَرِحٌ","لَبَطِرٌ بِالنِّعَمِ، مَغْرُورٌ بِهَا."],[11,10,"فَخُورٌ","مُبَالِغٌ فِي الْفَخْرِ وَالتَّعَالِي عَلَى النَّاسِ."],[11,12,"كَنزٌ","مَالٌ كَثِيرٌ."],[11,15,"لَا يُبْخَسُونَ","لَا يُنْقَصُونَ شَيْئًا مِنْ جَزَائِهِمُ الدُّنْيَوِيِّ."],[11,16,"وَحَبِطَ","ذَهَبَ نَفْعُ مَا عَمِلُوهُ."],[11,17,"بَيِّنَةٍ","يَقِينٍ."],[11,17,"وَيَتْلُوهُ شَاهِدٌ مِّنْهُ","هُوَ جِبْرِيلُ، أَوْ نَبِيُّنَا مُحَمَّدٌ، عَلَيْهِمَا الصَّلَاةُ وَالسَّلَامُ."],[11,17,"ٱلْأَحْزَابِ","الْكُفَّارِ الَّذِينَ تَحَزَّبُوا عَلَى نَبِيِّنَا مُحَمَّدٍ ﷺ."],[11,17,"فَلَا تَكُ","فَلَا تَكُنْ."],[11,17,"مِرْيَةٍ","شَكٍّ."],[11,18,"ٱلْأَشْهَٰدُ","الْمَلَائِكَةُ، وَالنَّبِيُّونَ، وَالْجَوَارِحُ، الَّذِينَ يَشْهَدُونَ يَوْمَ الْقِيَامَةِ."],[11,19,"وَيَبْغُونَهَا","يُرِيدُونَهَا."],[11,19,"عِوَجًا","مُعْوَجَّةً، مُوَافِقَةً لِأَهْوَائِهِمْ."],[11,20,"مُعْجِزِينَ","فَائِتِينَ مِنْ عَذَابِ اللهِ بِالْهَرَبِ."],[11,21,"وَضَلَّ","ذَهَبَ."],[11,22,"لَا جَرَمَ","حَقًّا."],[11,23,"وَأَخْبَتُوٓا۟","خَضَعُوا لِلَّهِ."],[11,24,"وَٱلْأَصَمِّ","الَّذِي لَا يَسْمَعُ."],[11,27,"ٱلْمَلَأُ","رُؤَسَاءُ الْكُفْرِ."],[11,27,"أَرَاذِلُنَا","أَسَافِلُنَا."],[11,27,"بَادِىَ ٱلرَّأْىِ","مِنْ غَيْرِ تَفَكُّرٍ، وَلَا رَوِيَّةٍ."],[11,28,"فَعُمِّيَتْ عَلَيْكُمْ","فَأُخْفِيَتْ عَلَيْكُمْ."],[11,28,"أَنُلْزِمُكُمُوهَا","أَنُجْبِرُكُمْ عَلَى قَبُولِهَا."],[11,31,"تَزْدَرِىٓ","تَحْتَقِرُ."],[11,35,"أَمْ يَقُولُونَ","بَلْ أَيَقُولُونَ."],[11,35,"ٱفْتَرَىٰهُ","اخْتَلَقَهُ."],[11,36,"فَلَا تَبْتَئِسْ","لَا تَحْزَنْ."],[11,37,"ٱلْفُلْكَ","السَّفِينَةَ."],[11,37,"بِأَعْيُنِنَا","بِحِفْظِنَا وَمَرْأًى مِنَّا."],[11,38,"مَلَأٌ","أَشْرَافٌ."],[11,40,"وَفَارَ","نَبَعَ الْمَاءُ بِقُوَّةٍ."],[11,40,"ٱلتَّنُّورُ","الْمَكَانُ الَّذِي يُخْبَزُ فِيهِ."],[11,41,"مَجْرِىٰهَا","جَرْيُهَا."],[11,41,"وَمُرْسَىٰهَآ","مُنْتَهَى سَيْرِهَا وَرَسْوِهَا."],[11,44,"أَقْلِعِى","أَمْسِكِي عَنِ الْمَطَرِ."],[11,44,"وَغِيضَ","نَقَصَ، وَنَضَبَ."],[11,44,"وَٱسْتَوَتْ","رَسَتْ."],[11,44,"ٱلْجُودِىِّ","اسْمُ جَبَلٍ."],[11,44,"بُعْدًا","هَلَاكًا."],[11,46,"أَعِظُكَ أَن تَكُونَ","أَعِظُكَ لِئَلَّا تَكُونَ."],[11,47,"أَعُوذُ بِكَ","أَسْتَجِيرُ بِكَ."],[11,50,"مُفْتَرُونَ","كَاذِبُونَ."],[11,52,"مِّدْرَارًا","مُتَتَابِعًا، كَثِيرًا."],[11,53,"عَن قَوْلِكَ","مِنْ أَجْلِ قَوْلِكَ."],[11,54,"ٱعْتَرَىٰكَ","أَصَابَكَ."],[11,54,"بِسُوٓءٍ","بِجُنُونٍ."],[11,55,"فَكِيدُونِى","فَاجْتَهِدُوا فِي إِيصَالِ الضُّرِّ إِلَيَّ."],[11,55,"لَا تُنظِرُونِ","لَا تُمْهِلُونِي."],[11,56,"ءَاخِذٌۢ بِنَاصِيَتِهَآ","مَالِكُهَا، وَالْمُتَصَرِّفُ فِيهَا."],[11,57,"وَيَسْتَخْلِفُ","يَأْتِي بِقَوْمٍ آخَرِينَ يَخْلُفُونَكُمْ فِي دِيَارِكُمْ."],[11,57,"حَفِيظٌ","يَحْفَظُ مِنْ كُلِّ سُوءٍ."],[11,58,"غَلِيظٍ","شَدِيدٍ."],[11,59,"جَبَّارٍ","مُسْتَكْبِرٍ."],[11,59,"عَنِيدٍ","لَا يَقْبَلُ الْحَقَّ."],[11,61,"أَنشَأَكُم","ابْتَدَأَ خَلْقَكُمْ."],[11,61,"وَٱسْتَعْمَرَكُمْ فِيهَا","جَعَلَكُمْ عُمَّارًا لَهَا."],[11,62,"كُنتَ فِينَا مَرْجُوًّا","كُنَّا نَرْجُو أَنْ تَكُونَ سَيِّدًا."],[11,62,"مُرِيبٍ","مُوقِعٍ فِي الرَّيْبِ وَالشَّكِّ."],[11,63,"أَرَءَيْتُمْ","أَخْبِرُونِي."],[11,63,"تَخْسِيرٍ","تَضْلِيلٍ، وَإِبْعَادٍ عَنِ الْخَيْرِ."],[11,64,"ءَايَةً","عَلَامَةً عَلَى صِدْقِي."],[11,64,"بِسُوٓءٍ","بِنَحْرٍ أَوْ ضَرْبٍ."],[11,65,"فَعَقَرُوهَا","فَنَحَرُوهَا."],[11,65,"تَمَتَّعُوا۟ فِى دَارِكُمْ","اسْتَمْتِعُوا بِحَيَاتِكُمْ فِي بَلَدِكُمْ."],[11,66,"خِزْىِ يَوْمِئِذٍ","هَوَانِ ذَلِكَ الْيَوْمِ، وَذِلَّتِهِ."],[11,67,"ٱلصَّيْحَةُ","صَوْتٌ عَظِيمٌ مُهْلِكٌ مِنَ السَّمَاءِ."],[11,67,"جَٰثِمِينَ","هَامِدِينَ، سَاقِطِينَ عَلَى وُجُوهِهِمْ."],[11,68,"لَّمْ يَغْنَوْا۟","لَمْ يَعِيشُوا، وَيُقِيمُوا."],[11,68,"بُعْدًا","هَلَاكًا، وَطَرْدًا."],[11,69,"حَنِيذٍ","مَشْوِيٍّ بِالْحِجَارَةِ الْمُحْمَاةِ."],[11,70,"نَكِرَهُمْ","أَنْكَرَ ذَلِكَ مِنْهُمْ."],[11,70,"وَأَوْجَسَ مِنْهُمْ خِيفَةً","أَحَسَّ فِي نَفْسِهِ خَوْفًا مِنْهُمْ."],[11,71,"وَمِن وَرَآءِ","وَمِنْ بَعْدِ."],[11,72,"يَٰوَيْلَتَىٰٓ","كَلِمَةُ تَعَجُّبٍ."],[11,72,"بَعْلِى","زَوْجِي."],[11,73,"حَمِيدٌ","مَحْمُودُ الصِّفَاتِ وَالْأَفْعَالِ."],[11,73,"مَّجِيدٌ","ذُو عَظَمَةٍ."],[11,74,"ٱلرَّوْعُ","الْخَوْفُ."],[11,75,"أَوَّٰهٌ","كَثِيرُ التَّضَرُّعِ وَالدُّعَاءِ."],[11,75,"مُّنِيبٌ","تَائِبٌ يَرْجِعُ إِلَى اللهِ فِي أُمُورِهِ كُلِّهَا."],[11,77,"سِىٓءَ بِهِمْ","سَاءَهُ مَجِيئُهُمْ."],[11,77,"وَضَاقَ بِهِمْ ذَرْعًا","ضَاقَ صَدْرُهُ، وَاغْتَمَّ لِمَجِيئِهِمْ؛ خَوْفًا عَلَيْهِمْ مِنْ قَوْمِهِ."],[11,77,"عَصِيبٌ","شَدِيدٌ."],[11,78,"يُهْرَعُونَ","يُسْرِعُونَ."],[11,78,"وَلَا تُخْزُونِ","لَا تَفْضَحُونِي."],[11,78,"رَّشِيدٌ","يَأْمُرُ بِالْمَعْرُوفِ، وَيَنْهَى عَنِ الْمُنْكَرِ."],[11,79,"مِنْ حَقٍّ","مِنْ حَاجَةٍ، أَوْ رَغْبَةٍ."],[11,81,"فَأَسْرِ","فَاخْرُجْ."],[11,81,"بِقِطْعٍ مِّنَ ٱلَّيْلِ","بِبَقِيَّةٍ مِنَ اللَّيْلِ."],[11,82,"سِجِّيلٍ","طِينٍ مُتَصَلِّبٍ مَتِينٍ."],[11,82,"مَّنضُودٍ","صُفَّ بَعْضُهَا إِلَى بَعْضٍ مُتَتَابِعَةً."],[11,83,"مُّسَوَّمَةً","مُعَلَّمَةً عِنْدَ اللهِ بِعَلَامَةٍ مَعْرُوفَةٍ لَا تُشْبِهُ حِجَارَةَ الْأَرْضِ."],[11,85,"بِٱلْقِسْطِ","بِالْعَدْلِ."],[11,85,"وَلَا تَبْخَسُوا۟","لَا تَنْقُصُوا."],[11,85,"وَلَا تَعْثَوْا۟","لَا تَسْعَوْا، وَلَا تَسِيرُوا."],[11,86,"بَقِيَّتُ ٱللَّهِ","مَا يُبْقِي اللهُ لَكُمْ بَعْدَ إِيفَاءِ الْكَيْلِ وَالْمِيزَانِ مِنَ الرِّبْحِ الْحَلَالِ."],[11,86,"بِحَفِيظٍ","رَقِيبٍ أُحْصِي أَعْمَالَكُمْ."],[11,88,"أُنِيبُ","أَرْجِعُ بِالتَّوْبَةِ، وَالطَّاعَةِ."],[11,89,"لَا يَجْرِمَنَّكُمْ","لَا يَحْمِلَنَّكُمْ."],[11,89,"شِقَاقِىٓ","عَدَاوَتِي."],[11,91,"ضَعِيفًا","لَسْتَ مِنَ الْكُبَرَاءِ، وَلَا الرُّؤَسَاءِ."],[11,91,"رَهْطُكَ","عَشِيرَتُكَ."],[11,91,"بِعَزِيزٍ","بِصَاحِبِ قَدْرٍ وَمَنْزِلَةٍ."],[11,92,"وَرَآءَكُمْ ظِهْرِيًّا","مَنْبُوذًا خَلْفَ ظُهُورِكُمْ."],[11,93,"مَكَانَتِكُمْ","طَرِيقَتِكُمْ وَحَالَتِكُمْ."],[11,94,"جَٰثِمِينَ","بَارِكِينَ عَلَى رُكَبِهِمْ مَيِّتِينَ."],[11,95,"لَّمْ يَغْنَوْا۟","لَمْ يُقِيمُوا."],[11,95,"بُعْدًا","هَلَاكًا، وَإِبْعَادًا."],[11,96,"وَسُلْطَٰنٍ مُّبِينٍ","حُجَّةٍ تَظْهَرُ لِمَنْ عَايَنَهَا."],[11,98,"فَأَوْرَدَهُمُ","فَأَدْخَلَهُمْ."],[11,98,"ٱلْوِرْدُ","الْمَدْخَلُ."],[11,98,"ٱلْمَوْرُودُ","الْمَدْخُولُ فِيهِ، وَهُوَ هُنَا النَّارُ."],[11,99,"ٱلرِّفْدُ","الْعَوْنُ، وَالْعَطَاءُ."],[11,99,"ٱلْمَرْفُودُ","الْمُعْطَى لَهُمْ."],[11,100,"قَآئِمٌ","آثَارُهُ بَاقِيَةٌ كَمَدَائِنِ صَالِحٍ."],[11,100,"وَحَصِيدٌ","مَحْصُودٌ قَدْ مُحِيَتْ آثَارُهُ، وَلَمْ يَبْقَ مِنْهُ شَيْءٌ."],[11,101,"أَغْنَتْ","نَفَعَتْ."],[11,101,"تَتْبِيبٍ","تَدْمِيرٍ، وَإِهْلَاكٍ، وَخُسْرَانٍ."],[11,106,"زَفِيرٌ","صَوْتٌ شَنِيعٌ، يُسْمَعُ عِنْدَ إِخْرَاجِ النَّفَسِ."],[11,106,"وَشَهِيقٌ","صَوْتٌ شَنِيعٌ يُسْمَعُ عِنْدَ إِدْخَالِ النَّفَسِ."],[11,108,"مَجْذُوذٍ","مَقْطُوعٍ."],[11,109,"فَلَا تَكُ","لَا تَكُنْ."],[11,109,"مِرْيَةٍ","شَكٍّ."],[11,110,"مُرِيبٍ","مُوقِعٍ فِي الرِّيبَةِ، وَقَلَقِ النَّفْسِ."],[11,112,"وَلَا تَطْغَوْا۟","لَا تَتَجَاوَزُوا مَا حَدَّهُ اللهُ لَكُمْ."],[11,113,"وَلَا تَرْكَنُوٓا۟","لَا تَمِيلُوا."],[11,114,"طَرَفَىِ ٱلنَّهَارِ","الصَّبَاحِ وَالْمَسَاءِ، وَقِيلَ: الْمُرَادُ بِهَا: صَلَاةُ الْفَجْرِ وَالظُّهْرِ وَالْعَصْرِ."],[11,114,"وَزُلَفًا مِّنَ ٱلَّيْلِ","سَاعَاتٍ مِنَ اللَّيْلِ، وَقِيلَ: الْمُرَادُ بِهَا: الْمَغْرِبُ وَالْعِشَاءُ أَوِ الْعِشَاءُ وَحْدَهَا."],[11,116,"فَلَوْلَا","فَهَلَّا."],[11,116,"ٱلْقُرُونِ","الْأُمَمِ الْمَاضِيَةِ."],[11,116,"أُو۟لُوا۟ بَقِيَّةٍ","بَقَايَا مِنْ أَهْلِ الْخَيْرِ وَالصَّلَاحِ."],[11,116,"أُتْرِفُوا۟ فِيهِ","مُتِّعُوا فِيهِ مِنْ لَذَّاتِ الدُّنْيَا."],[11,118,"أُمَّةً وَٰحِدَةً","جَمَاعَةً وَاحِدَةً عَلَى دِينٍ وَاحِدٍ، وَهُوَ الْإِسْلَامُ."],[11,121,"مَكَانَتِكُمْ","حَالَتِكُمْ، وَطَرِيقَتِكُمْ."],[12,3,"لَمِنَ ٱلْغَٰفِلِينَ","أَيْ: لَا تَدْرِي عَنْ قَصَصِ السَّابِقِينَ شَيْئًا."],[12,6,"يَجْتَبِيكَ","يَصْطَفِيكَ."],[12,8,"عُصْبَةٌ","جَمَاعَةٌ ذُو عَدَدٍ."],[12,8,"ضَلَٰلٍ","خَطَإٍ."],[12,9,"يَخْلُ","يَخْلُصْ."],[12,10,"غَيَٰبَتِ ٱلْجُبِّ","جَوْفِ الْبِئْرِ، وَالْجُبُّ: هُوَ الْبِئْرُ الَّذِي قُطِعَ مِنَ الْأَرْضِ دُونَ بِنَاءٍ يَحْمِيهِ مِنَ الِانْهِيَارِ."],[12,10,"ٱلسَّيَّارَةِ","الْمَارَّةِ مِنَ الْمُسَافِرِينَ."],[12,12,"يَرْتَعْ","يَأْكُلْ مَا لَذَّ وَطَابَ."],[12,14,"عُصْبَةٌ","جَمَاعَةٌ قَوِيَّةٌ."],[12,15,"وَأَجْمَعُوٓا۟","عَزَمُوا وَصَمَّمُوا."],[12,17,"نَسْتَبِقُ","نَتَسَابَقُ فِي الْجَرْيِ، وَالرَّمْيِ بِالسِّهَامِ."],[12,17,"بِمُؤْمِنٍ لَّنَا","بِمُقِرٍّ لَنَا، وَمُصَدِّقٍ لَنَا."],[12,18,"سَوَّلَتْ","زَيَّنَتْ."],[12,18,"فَصَبْرٌ جَمِيلٌ","احْتِمَالٌ لِلْمُصِيبَةِ لَا شَكْوَى مَعَهُ لِأَحَدٍ مِنَ الْخَلْقِ."],[12,19,"سَيَّارَةٌ","جَمَاعَةٌ مِنَ الْمُسَافِرِينَ."],[12,19,"وَارِدَهُمْ","مَنْ يَتَقَدَّمُهُمْ لِطَلَبِ الْمَاءِ."],[12,19,"فَأَدْلَىٰ دَلْوَهُۥ","فَأَرْسَلَ دَلْوَهُ فِي الْبِئْرِ؛ لِيَمْلَأَهَا بِالْمَاءِ."],[12,19,"وَأَسَرُّوهُ بِضَٰعَةً","كَتَمَ إِخْوَةُ يُوسُفَ كَوْنَهُ أَخَاهُمْ لِيَبِيعُوهُ."],[12,20,"وَشَرَوْهُ","بَاعَهُ إِخْوَتُهُ."],[12,20,"بَخْسٍ","قَلِيلٍ."],[12,21,"مَثْوَىٰهُ","مَقَامَهُ."],[12,22,"أَشُدَّهُۥٓ","مُنْتَهَى قُوَّتِهِ فِي شَبَابِهِ."],[12,23,"وَرَٰوَدَتْهُ","دَعَتْهُ إِلَى نَفْسِهَا بِرِفْقٍ وَلِينٍ."],[12,23,"هَيْتَ لَكَ","هَلُمَّ إِلَيَّ."],[12,23,"مَعَاذَ ٱللَّهِ","أَعْتَصِمُ بِاللهِ."],[12,23,"رَبِّىٓ","سَيِّدِي."],[12,23,"مَثْوَاىَ","مَنْزِلِي وَمُقَامِي."],[12,24,"هَمَّتْ بِهِۦ","مَالَتْ نَفْسُهَا لِفِعْلِ الْفَاحِشَةِ."],[12,24,"وَهَمَّ بِهَا","خَطَرَ بِقَلْبِهِ إِجَابَتُهَا."],[12,24,"بُرْهَٰنَ رَبِّهِۦ","آيَةً مِنَ اللهِ زَجَرَتْهُ عَنْ ذَلِكَ الْخَاطِرِ."],[12,24,"ٱلْمُخْلَصِينَ","الَّذِينَ أَخْلَصُوا فِي عِبَادَةِ اللهِ؛ فَأَخْلَصَهُمْ، وَاخْتَصَّهُمْ بِرَحْمَتِهِ."],[12,25,"وَٱسْتَبَقَا ٱلْبَابَ","أَسْرَعَا إِلَى الْبَابِ يُرِيدُ الْخُرُوجَ وَهِيَ تَمْنَعُهُ."],[12,25,"وَقَدَّتْ","شَقَّتْ."],[12,25,"وَأَلْفَيَا","وَجَدَا."],[12,25,"سَيِّدَهَا","زَوْجَهَا."],[12,26,"قُدَّ مِن قُبُلٍ","شُقَّ مِنَ الْأَمَامِ."],[12,29,"ٱلْخَاطِـِٔينَ","الْآثِمِينَ."],[12,30,"شَغَفَهَا حُبًّا","بَلَغَ حُبُّهَا لَهُ شَغَافَ قَلْبِهَا وَهُوَ غِلَافُهُ."],[12,31,"وَأَعْتَدَتْ","هَيَّأَتْ."],[12,31,"مُتَّكَـًٔا","مَا يَتَّكِئْنَ عَلَيْهِ مِنَ الْوَسَائِدِ."],[12,31,"وَقَطَّعْنَ"
