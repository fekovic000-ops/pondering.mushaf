ا باسط لما قبضت, ولا هادي لمن أضللت ولا مضل لمن هديت, ولا معطي لما منعت ولا مانع لما أعطيت, ولا مقرب لما باعدت ولا مباعد لما قربت, اللهم إني أسألك من بركتك ورحمتك وفضلك ورزقك","s":"أخرجه أبو داود عن أبي بن كعب","v":3,"p":348,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"من سره أن يبسط الله له في رزقه, وأن ينسأ له في أثره فليصل رحمه","s":"أخرجه البخاري والترمذي عن أبي هريرة","v":3,"p":351,"d":1},{"t":"هل تدرون ماذا قال ربكم? قالوا: الله ورسوله أعلم, قال: أصبح من عبادي مؤمن بي وكافر, فأما من قال: مطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب, وأما من قال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب","s":"أخرجه البخاري ومسلم عن زيد بن خالد الجهني","v":3,"p":356,"d":1},{"t":"إن الله يلوم على العجز, ولكن عليك بالكيس, فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":1},{"t":"ثلاثة حق على الله عونهم: المجاهد في سبيل الله, والمكاتب الذي يريد الأداء, والناكح الذي يريد العفاف","s":"أخرجه الترمذي والنسائي عن أبي هريرة","v":3,"p":363,"d":1},{"t":"كان الله ولم يكن شيء قبله, وكان عرشه على الماء, ثم خلق السماوات والأرض, وكتب في الذكر كل شيء","s":"أخرجه البخاري والترمذي عن عمران بن حصين","v":3,"p":389,"d":1},{"t":"احفظ الله يحفظك, احفظ الله تجده أمامك, تعرّف إلى الله في الرخاء يعرفك في الشدة, وإذا سألت فاسأل الله, وإذا استعنت فاستعن بالله","s":"أخرجه الحاكم في المستدرك","v":3,"p":392,"d":1},{"t":"اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب, وما زويت عني مما أحب فاجعله فراغًا لي فيما تحب","s":"أخرجه الترمذي عن عبد الله بن يزيد الخطمي","v":3,"p":478,"d":1},{"t":"اللهم فاطر السماوات والأرض, عالم الغيب والشهادة, أنت تحكم بين عبادك فيما كانوا فيه يختلفون","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن عائشة","v":3,"p":480,"d":1},{"t":"كان النبي ﷺ إذا قام من الليل يتهجد قال: اللهم لك الحمد, أنت نور السماوات والأرض ومن فيهن, ولك الحمد, اللهم بك آمنت ولك أسلمت وعليك توكلت وإليك أنبت وبك خاصمت وإليك حاكمت, فاغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"أخرجه مسلم وابن خزيمة","v":3,"p":481,"d":1},{"t":"اللهم أنت السلام ومنك السلام, تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"استحيوا من الله حق الحياء","s":"","v":4,"p":98,"d":1},{"t":"أن تعبد الله كأنك تراه, فإن لم تكن تراه فإنه يراك","s":"متفق عليه من حديث أبي هريرة","v":4,"p":99,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري, وأصلح لي دنياي التي فيها معاشي, وأصلح لي آخرتي التي فيها معادي, واجعل الحياة زيادة لي في كل خير, واجعل الموت راحة لي من كل شر","s":"رواه مسلم من حديث أبي هريرة","v":4,"p":153,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري, وأصلح لي دنياي التي فيها معاشي","s":"","v":4,"p":169,"d":1},{"t":"اتقوا الله وأصلحوا ذات بينكم, فإن الله تعالى يصلح بين المسلمين","s":"أخرجه الحاكم في المستدرك","v":4,"p":198,"d":1},{"t":"فاتقوا الله واعدلوا بين أولادكم","s":"","v":4,"p":199,"d":1},{"t":"واتق دعوة المظلوم, فإنها ليس بينها وبين الله حجاب","s":"صحيح البخاري من حديث ابن عباس","v":4,"p":206,"d":1},{"t":"اللهم قني عذابك يوم تبعث عبادك","s":"رواه أحمد والترمذي والنسائي من حديث البراء بن عازب","v":4,"p":225,"d":1},{"t":"قال الله: أنفق يا ابن آدم أنفق عليك","s":"أخرجه البخاري","v":4,"p":299,"d":1},{"t":"أرحم أمتي بأمتي أبو بكر, وأشدهم في أمر الله عمر, وأصدقهم حياءً عثمان, وأقرؤهم لكتاب الله أبيّ بن كعب, وأفرضهم زيد بن ثابت, وأعلمهم بالحلال والحرام معاذ بن جبل, ألا وإن لكل أمة أمينًا, وإن أمين هذه الأمة أبو عبيدة بن الجراح","s":"رواه الترمذي","v":4,"p":366,"d":1},{"t":"أتدرون ما المفلس? قالوا: المفلس فينا من لا درهم له ولا متاع. قال: إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة, ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا, فيعطى هذا من حسناته وهذا من حسناته, فإن فنيت حسناته قبل أن يقضى ما عليه أُخذ من خطاياهم فطُرحت عليه ثم طُرح في النار","s":"","v":1,"p":241,"d":0},{"t":"من لم يدع قول الزور والعمل به فليس لله حاجة في أن يدع طعامه وشرابه","s":"أخرجه البخاري وأبو داود والترمذي وابن ماجه عن أبي هريرة","v":1,"p":242,"d":0,"c":"ومنهج الله يقترب من مئة ألف بند في كل شؤون حياتك, بدءاً من فراش الزوجية إلى العلاقات الدولية. علة وجودنا في الأرض أن نعبده."}],"0":[{"t":"قل: أعوذ بكلمات الله التامة من شر ما خلق وذرأ وبرأ, ومن شر ما ينزل من السماء ومن شر ما يعرج فيها, ومن شر فتن الليل والنهار, ومن شر كل طارق يطرق إلا طارقًا يطرق بخير يا رحمن","s":"رواه أحمد عن عبد الرحمن التميمي","v":1,"p":28,"d":1},{"t":"أنا الرحمن, خلقت الرحم وشققت لها اسمًا من اسمي, فمن وصلها وصلته ومن قطعها قطعته","s":"البيهقي عن عبد الرحمن بن عوف","v":1,"p":28,"d":1},{"t":"فإذا سألتم الله فسلوه الفردوس, فإنه أوسط الجنة وأعلى الجنة, وفوقه عرش الرحمن","s":"","v":1,"p":30,"d":1},{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك? قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير, رحمن الدنيا والآخرة ورحيمهما, تعطيهما من تشاء وتمنع منهما من تشاء, ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"الراحمون يرحمهم الرحمن, ارحموا أهل الأرض يرحمكم من في السماء","s":"","v":1,"p":48,"d":1},{"t":"إن أحب أسمائكم إلى الله عبد الله وعبد الرحمن","s":"","v":1,"p":48,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كلمتان خفيفتان على اللسان, ثقيلتان في الميزان, حبيبتان إلى الرحمن: سبحان الله العظيم, سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"إن قلوب بني آدم كلها بين إصبعين من أصابع الرحمن كقلب واحد يصرفه حيث يشاء","s":"مسلم والمسند","v":3,"p":76,"d":1},{"t":"أولياء الله الذين إذا رؤوا ذُكر الله","s":"أخرجه ابن المبارك في الزهد والنسائي في الكبرى من حديث ابن عباس","v":1,"p":36,"d":0,"c":"هذا الإنسان مع هذه الجهود الكبيرة يجعل الله قلبه مستقرًا لرحماته. فبمجرد أن تقع عينك على مؤمن صادق الإيمان يحس الناظر برعشة في قلبه كأنه تذكر الله عز وجل."},{"t":"إن الله يؤتي الدنيا من يحب ومن لا يحب, ولا يؤتي الإيمان إلا من أحب","s":"أخرجه أحمد في مسنده من حديث ابن مسعود","v":1,"p":38,"d":0,"c":"ليس الفوز في أن تنال رحمته العامة فحسب, فهذا قدر مشترك بين جميع الناس, لكن الشيء الذي يجب أن تسعى إليه هو رحمته الخاصة, بأن يعلمك وأن يلقي في قلبك نورًا وأن يلهمك الحكمة."},{"t":"عجب ربنا من قوم يقادون إلى الجنة بالسلاسل","s":"رواه أحمد والبخاري وأبو داود عن أبي هريرة","v":1,"p":41,"d":0},{"t":"إذا كان أمراؤكم خياركم, وأغنياؤكم سمحاءكم, وأموركم شورى بينكم, فظهر الأرض خير لكم من بطنها, وإذا كان أمراؤكم شراركم, وأغنياؤكم بخلاءكم, وأموركم إلى نسائكم, فبطن الأرض خير لكم من ظهرها","s":"","v":1,"p":46,"d":0,"c":"إذا ابتعد الإنسان عن التوحيد وقع في آلام لا تحتمل. إن الإنسان إذا لم يوحد يقع في شقاء لا نهاية له, والتوحيد ألا ترى مع الله أحدًا, وأن ترى كل شيء ينتهي إلى خير."}],"1":[{"t":"رب اغفر لي وتب عليّ إنك أنت التواب الرحيم","s":"","v":1,"p":137,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1}],"56":[{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك? قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير, رحمن الدنيا والآخرة ورحيمهما, تعطيهما من تشاء وتمنع منهما من تشاء, ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"سبحان الملك القدوس","s":"أخرجه أبو داود والنسائي وابن ماجه وابن حبان عن أبي بن كعب","v":3,"p":5,"d":1},{"t":"اطلبوا الحوائج بعزة الأنفس, فإن الأمور تجري بالمقادير","s":"أخرجه ابن عساكر عن عبد الله بن بسر","v":2,"p":430,"d":0,"c":"حينما تعرف أن الله بيده كل شيء تتجه إليه وحده, تعلق الأمل عليه, لا تعلق أملًا على غيره, لا تتضعضع إلا في أعتابه."}],"61":[{"t":"إن لله تسعة وتسعين اسمًا من أحصاها دخل الجنة","s":"رواه البخاري من حديث أبي هريرة","v":2,"p":475,"d":0,"c":"إن من أسماء الله الحسنى: الملك."},{"t":"وجهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين, إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين, لا شريك له وبذلك أمرت وأنا من المسلمين, اللهم أنت الملك لا إله إلا أنت, أنت ربي وأنا عبدك...","s":"أخرجه مسلم وأبو داود والترمذي والنسائي","v":2,"p":476,"d":0},{"t":"ليس الشديد بالصرعة, إنما الشديد الذي يملك نفسه عند الغضب","s":"","v":2,"p":492,"d":0,"c":"الملك الحقيقي أن تملك نفسك لا أن تملكك. وعلاقة الإنسان بهذا الاسم أن يملك نفسه عند الغضب; فالمؤمن رجل قيم لأنه اتصل بالملك فملك نفسه, وأعظم مرتبة تملكها أن تملك نفسك."},{"t":"ولئن سألني لأعطينه ولئن استعاذني لأعيذنه","s":"","v":2,"p":493,"d":0,"c":"أي: كلما دعوتموني أجبكم, كلما سألتموني أعطيتكم, أنا عند ظنكم."}],"62":[{"t":"سبحان الملك القدوس","s":"أخرجه أبو داود والنسائي وابن ماجه وابن حبان عن أبي بن كعب","v":3,"p":5,"d":1},{"t":"إن الله لا ينظر إلى صوركم وأموالكم, ولكن ينظر إلى قلوبكم وأعمالكم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":3,"p":7,"d":0,"c":"مهمة الإنسان في الدنيا أن يطهر نفسه كي تغدو مؤهلة لتكون في جوار الله في الجنة, لأن الله طيب ولا يقبل إلا طيباً. فيجب أن يكون شغلك الشاغل أن تطهر نفسك."},{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":0,"c":"المؤمن الذي يعرف أن أمره كله بيد الله, وأن الله صاحب الأسماء الحسنى والصفات الفضلى, لا يعرف مشاعر القهر ولا الخنوع ولا أحاسيس الذل; لذلك كان النبي الكريم يقول عند الكرب هذا الدعاء."},{"t":"إنما أهلك الذين قبلكم أنهم كانوا إذا سرق فيهم الشريف تركوه, وإذا سرق فيهم الضعيف أقاموا عليه الحد, وايم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن عائشة أم المؤمنين","v":3,"p":13,"d":0,"c":"القدوس يقدّس من شاء من خلقه وفق مراده وحكمته, لذلك ورد في الحديث الصحيح: إن الله لا يقدّس أمة لا يأخذ الضعيف حقه."},{"t":"أيها الناس إياكم وشرك السرائر","s":"","v":3,"p":14,"d":0,"c":"من عرف هذا الاسم طهّر نفسه عن متابعة الشهوات, وطهّر ماله عن الحرام والشبهات, وطهّر وقته من دنس المخالفات, وطهّر سرّه من الملاحظات والالتفاتات. لا تلاحظ الخلق أبداً, لاحظ الخالق."},{"t":"إن الرجل ليحرم الرزق بالذنب يصيبه","s":"رواه الإمام أحمد في مسنده من حديث ثوبان","v":3,"p":19,"d":0,"c":"والذنب والسيئة سبب هوان العبد على ربه وسقوطه من أعين خلقه. اتق الله باجتناب المحرمات تكن من التوابين, وتورّع عن اقتحام الشبهات تكن من المتطهرين."}],"63":[{"t":"إن السلام اسم من أسماء الله تعالى فأفشوه بينكم","s":"أخرجه الطبراني عن أبي هريرة","v":3,"p":21,"d":1},{"t":"اللهم أنت السلام ومنك السلام, تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"إن هذه القلوب تصدأ كما يصدأ الحديد... قيل: وما جلاؤها? قال: كثرة ذكر الموت وتلاوة القرآن","s":"","v":3,"p":33,"d":0,"c":"إذاً من أسماء الله السلام; إنك إذا ذكرته شعرت بالسلام, وزال عنك الخوف والوحشة, وأنستَ به واطمأننت إليه."},{"t":"أما في ثلاثة مواطن فلا يذكر أحد أحدًا: عند الميزان حتى يعلم أيخف ميزانه أو يثقل","s":"","v":3,"p":37,"d":0,"c":"سيدنا يحيى: وسلام عليه يوم ولد, فكان أصعب يوم لديه, ومثل ذلك يوم يموت ويوم يبعث حياً, فأمّنه الله تعالى إذ قال: «وَسَلَامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا»."},{"t":"المسلم من سلم المسلمون من لسانه ويده","s":"أخرجه البخاري عن عبد الله بن عمرو","v":3,"p":39,"d":0,"c":"فإذا تخلّقت باسم الله السلام فلا تسبب للمسلمين إذا عاملت غير المسلمين سمعة سيئة, لا بلسانك ولا بيدك. وما دمت قد آمنت باسم السلام فيجب أن تكون مصدر سلام لمن حولك."}],"64":[{"t":"إن الله عز وجل يقول يوم القيامة: يا ابن آدم مرضت فلم تعدني, قال: يا رب كيف أعودك وأنت رب العالمين? قال: أما علمت أن عبدي فلانًا مرض فلم تعده, أما علمت أنك لو عدته لوجدتني عنده...","s":"صحيح مسلم","v":3,"p":53,"d":0,"c":"فإن أخذ بعض صحتك فذلك ليعوضك عما أخذ منك بشيء من رحمته, فيأخذ ليعطي ويبتلي ليجزي, ويخيف ليطمئن."},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا, يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا... يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها, فمن وجد خيرًا فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه","s":"أخرجه مسلم والترمذي","v":3,"p":54,"d":0,"c":"ثم إن هذه الدنيا أمام الآخرة لا تساوي شيئاً, فإذا وعد الله عز وجل المظلوم بالجنة فيلزم منه عدم الظلم. المؤمن هو الذي يجير المظلوم من الظالم."},{"t":"أتدرون ما الإيمان بالله وحده? قالوا: الله ورسوله أعلم, قال: شهادة أن لا إله إلا الله وأن محمدًا رسول الله","s":"","v":3,"p":55,"d":0,"c":"فالمؤمن هو المصدّق, والمؤمن المنفّذ, والدليل الحديث الشريف. الإيمان تصديق وتطبيق, الإيمان اعتقاد وسلوك: ما أقرّه اللسان وصدّقه العمل وآمن به القلب."},{"t":"يؤذيني ابن آدم, يسب الدهر وأنا الدهر, بيدي الأمر, أقلب الليل والنهار","s":"","v":3,"p":57,"d":0,"c":"ومع ذلك تجد الناس يعصونه جهراً وهو يسترهم, والعبد ينسى وربي لا ينسى; يعصونه جهراً ويسترهم ويرزقهم ويحفظهم, وهذا شأن الله مع عباده."},{"t":"المسلم من سلم المسلمون من لسانه ويده, والمؤمن من أمنه الناس على دمائهم وأموالهم","s":"","v":3,"p":58,"d":0,"c":"إن المؤمن مأمون الجانب في صنعته, في حديثه, في عمله, في مهنته, في حرفته, في زواجه, في شراكته, هكذا المؤمن يكون مأمون الجانب."}],"65":[{"t":"اللهم أنت الصاحب في السفر والخليفة في الأهل","s":"","v":3,"p":65,"d":0,"c":"لذلك قالوا: هاتان الصفتان لا تجتمعان إلا لله عز وجل, هو معك بالحفظ والرعاية والتوفيق والتسديد والنصر والتأييد, وهو في البيت مع أولادك معية علم وقدرة ورعاية في غيبتك, يحفظهم من كل مكروه, هو معك وهو خليفتك في البيت."},{"t":"اللهم اصحبنا في سفرنا, واخلفنا في أهلنا, اللهم إني أعوذ بك من وعثاء السفر وكآبة المنقلب","s":"","v":3,"p":65,"d":0,"c":"لذلك قالوا: هاتان الصفتان لا تجتمعان إلا لله عز وجل, هو معك بالحفظ والرعاية والتوفيق والتسديد والنصر والتأييد, وهو في البيت مع أولادك معية علم وقدرة ورعاية في غيبتك, يحفظهم من كل مكروه."},{"t":"لله أرحم بعباده من هذه بولدها","s":"متفق عليه من حديث عمر بن الخطاب","v":3,"p":66,"d":0,"c":"فمن أودع في قلب الأم الرحمة? تستيقظ عشرات المرات في الليل من أجل وليدها. ونظام الأسرة له هدفان: هدف لتربية الأولاد, وهدف أكبر بكثير أن تتعرف إلى طرف يسير جداً من رحمة الله عز وجل."},{"t":"يا أبا بكر, ما ظنك باثنين الله ثالثهما","s":"متفق عليه من حديث أبي بكر الصديق","v":3,"p":76,"d":0,"c":"الأمر كله بيد الله. الله مهيمن, يحفظ أعظم شيء بأتفه سبب, وأحياناً يهلك إنساناً بأتفه سبب, ليظهر لك كمال قدرته عز وجل."},{"t":"إن قلوب بني آدم كلها بين إصبعين من أصابع الرحمن كقلب واحد يصرفه حيث يشاء","s":"مسلم والمسند","v":3,"p":76,"d":0,"c":"الله المهيمن, علم إعجابكم بأنفسكم فألقى في قلوبكم الخوف, وقلوبكم في يدي الله إما أن يملأها خوفاً وإما أن يملأها طمأنينة."}],"9":[{"t":"لا إله إلا الله الواحد القهار, رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال, فأقول: يا رب أصحابي, فيقول: إنك لا تدري ما أحدثوا بعدك, فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"اللهم اهدني فيمن هديت, وعافني فيمن عافيت","s":"","v":1,"p":180,"d":0,"c":"إذا كنت مع العزيز فهل تذل بعد ذلك? لا, لن يكون هذا أبداً. ألا تقرأ في الدعاء يومياً في قنوت الوتر: إنه لا يذل من واليت ولا يعز من عاديت?"},{"t":"لا ينبغي للمؤمن أن يذل نفسه, قالوا: وكيف يذل نفسه? قال: يتعرض من البلاء لما لا يطيق","s":"الترمذي من حديث حذيفة بن اليمان","v":1,"p":181,"d":0,"c":"لا تكون عزيزاً إذا كنت طماعاً, حينما تطمع تصبح ذليلاً; لمجرد أن تطمع فيما عند الناس تصبح ذليلاً. لذلك إذا طمعت فيما عند الناس كرهوك, ورب العزة إذا طمعت فيما عنده أحبك."},{"t":"ابتغوا الحوائج بعزة الأنفس, فإن الأمور تجري بالمقادير","s":"أخرجه ابن عساكر عن عبد الله بن بسر","v":1,"p":181,"d":0,"c":"كلما قطعت طمعك من الناس أعزك الله, وكلما مرغت جبهتك في السجود لله أعزك الله."},{"t":"البيّعان بالخيار ما لم يتفرقا, فإن صدقا وبيّنا بورك لهما في بيعهما, وإن كتما وكذبا فعسى أن يربحا ربحًا ويُمحق بركة بيعهما","s":"رواه الشيخان من حديث حكيم بن حزام","v":1,"p":193,"d":0,"c":"فهذا الذي يعصي الله لينال دنيا فانية جاهل أحمق, لا يعرف الله عز وجل, فأضاع الآخرة الباقية. ومما وعد الله به المؤمن أن يعزه."},{"t":"من ابتغى أمرًا بمعصية كان أبعد مما رجا وأقرب مما اتقى","s":"","v":1,"p":193,"d":0,"c":"أي: في التجارة لا تكذب تربح, وتكون عند الله صادقاً; وإذا كنت محامياً لا تكذب وسيأتيك دخل وفير, وتكون عند الله صادقاً وعند الناس مخلصاً."}],"66":[{"t":"بئس العبد عبد تخيل واختال ونسي الكبير المتعال, بئس العبد عبد تجبر واعتدى ونسي الجبار الأعلى, بئس العبد عبد سها ولها ونسي المقابر والبلى, بئس العبد عبد عتا وطغى ونسي المبتدأ والمنتهى","s":"رواه الترمذي عن أسماء بنت عميس الخثعمية","v":3,"p":93,"d":1},{"t":"أنا الجبار, أنا المتكبر","s":"","v":3,"p":101,"d":1},{"t":"سبحان ذي الجبروت والملكوت والكبرياء والعظمة","s":"أخرجه أبو داود والنسائي عن عوف بن مالك","v":3,"p":91,"d":0,"c":"والجبار هو الجبروت, كمالك الملك والملكوت."},{"t":"الكبرياء ردائي والعظمة إزاري, فمن نازعني واحدًا منهما قذفته في النار","s":"أخرجه مسلم وأبو داود عن أبي سعيد الخدري وأبي هريرة","v":3,"p":91,"d":0,"c":"واسم الجبار من أسماء التعظيم."},{"t":"إن الله يحب كل قلب حزين","s":"رواه الطبراني والحاكم عن أبي الدرداء","v":3,"p":93,"d":0,"c":"فالحزانى في كنف الله, والحزانى معرضون للرحمة. فيا جابر كل كسير, والجبار هو المصلح لكل الأمور, الميسر لكل عسير, الجابر لكل كسير."}],"67":[{"t":"أنا الجبار, أنا المتكبر","s":"","v":3,"p":101,"d":1},{"t":"إن لله تسعة وتسعين اسمًا, مائة إلا واحدًا, من أحصاها دخل الجنة","s":"متفق عليه من حديث أبي هريرة","v":3,"p":101,"d":0,"c":"فمعنى الإحصاء في حديث رسول الله هو العلم. وقيل: أحصاها الله أي هو المحيط بكل شيء جملة وتفصيلا لا تخفى عليه خافية لا في الأرض ولا في السماء."},{"t":"الكبرياء ردائي, فمن نازعني ردائي قصمته","s":"أخرجه الحاكم في المستدرك من حديث أبي هريرة","v":3,"p":104,"d":0,"c":"بعض العلماء يقول: التكبر من الكبرياء, وذو الكبرياء هو الملك. فالمتكبر هو الملك الذي لا يزول سلطانه, والعظيم الذي لا يجري في ملكه إلا ما يريد."},{"t":"قال الله عز وجل: الكبرياء ردائي والعظمة إزاري","s":"","v":3,"p":104,"d":0,"c":"بعض العلماء يقول: التكبر من الكبرياء, وذو الكبرياء هو الملك. فالمتكبر هو الملك الذي لا يزول سلطانه, والعظيم الذي لا يجري في ملكه إلا ما يريد."},{"t":"وإن الله أوحى إليّ أن تواضعوا حتى لا يفخر أحد على أحد ولا يبغي أحد على أحد","s":"صحيح مسلم من حديث عياض بن حمار","v":3,"p":112,"d":0,"c":"من عرف الله المتكبّر تواضع له وتذلل على أعتابه وتقرب إليه بخدمة عباده. فالكبر يتناقض مع العبودية لله عز وجل; أنت عبد وهو رب, فإذا نازعته رداءه وإزاره قصمك."},{"t":"لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر","s":"صحيح مسلم من حديث عبد الله بن مسعود","v":3,"p":112,"d":0,"c":"لأن الكبر يتناقض مع العبودية لله عز وجل, أنت عبد وهو رب, فإذا نازعته رداءه وإزاره قصمك كما ورد في الحديث الشريف الذي مرّ ذكره."},{"t":"لو لم تذنبوا لخشيت عليكم ما هو أكبر منه: العجب","s":"","v":3,"p":114,"d":0,"c":"شأن الرب أنه متكبر حتى يقبل عباده عليه, وشأن العبد أن يكون متواضعاً مفتقراً حتى يستحق تأييد الله له."}],"68":[{"t":"لا طاعة لمخلوق في معصية الخالق","s":"أخرجه الطبراني عن عمران بن حصين والحكم بن عمرو الغفاري","v":3,"p":115,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله سائر همومه","s":"","v":3,"p":117,"d":0,"c":"المؤمن يرضي جهة واحدة, وهذه الجهة الواحدة هي القوية وبيدها كل الجهات, ومن هنا قال رسول الله ما قال. فلماذا كان المؤمن سعيداً? لأن علاقته مع جهة واحدة."},{"t":"لو كنت متخذًا من أمتي خليلًا لاتخذت أبا بكر خليلًا, ولكن أخي وصاحبي","s":"رواه البخاري من حديث ابن عباس","v":3,"p":119,"d":0,"c":"المستحق لخالص الطاعة والعبادة والإخلاص والحب هو الله, فلا أعتقد أن في الأرض رجلين تحابّا كالصديق ورسول الله, ومع ذلك لم يتخذه خليلاً. فسر السعادة أنك تعمل لوجه واحد, فترضي جهة واحدة, وتبحث عن خالق عظيم فتمحضه كل نفسك."}],"69":[{"t":"إن لكل داء دواء, فإذا أصيب دواء الداء برأ بإذن الله","s":"أخرجه مسلم عن جابر بن عبد الله","v":3,"p":134,"d":0,"c":"وقيل: البارئ هو الخالق على صفة معينة, أما برأ يبرأ برءاً فمعناها سلم من كل نقص وعيب ومرض."},{"t":"اللهم كما حسنت خلقي فحسن خلقي","s":"رواه البيهقي في الدعوات الكبير","v":3,"p":140,"d":0,"c":"فليشكر الإنسان الله عز وجل على أن أعطاه قواماً ورأساً فيه سمع وبصر وفم ولسان وأنف, وهذا الخلق السوي الكامل من نعم الله عز وجل. فأسماء الله الثلاثة الخالق والبارئ والمصور أسماء متلازمة متآلفة, تجمع بينها العلاقة الوشيجة لعملية الخلق: خلقاً وبرءاً وتصويراً."}],"70":[{"t":"اللهم لا عيش إلا عيش الآخرة","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":3,"p":145,"d":0,"c":"درجات الدنيا مؤقتة, ودرجات الآخرة أبدية. فالعبرة ألا تكون غنيا أو قويا, العبرة أن تنجح في امتحانك."},{"t":"بادروا بالأعمال سبعًا: هل تنتظرون إلا فقرًا منسيًا, أو غنى مطغيًا, أو مرضًا مفسدًا, أو هرمًا مفندًا, أو موتًا مجهزًا, أو الدجال فشر غائب ينتظر, أو الساعة فالساعة أدهى وأمر","s":"أخرجه الترمذي والنسائي عن أبي هريرة","v":3,"p":146,"d":0},{"t":"إن الله خلق آدم على صورته","s":"","v":3,"p":147,"d":0,"c":"الله عز وجل صوّر آدم; أعطاه صورة, وجعل له سمعًا والله سميع, وجعل له بصرًا والله بصير, وجعل له علمًا والله عليم. هذه الصفات يصح إطلاقها في حق الذات الإلهية ويصح إطلاقها في حق الإنسان, لكن كل ما خطر في بالك فالله بخلاف ذلك."},{"t":"إنكم قادمون على إخوانكم فأصلحوا رحالكم, وأصلحوا لباسكم, حتى تكونوا كأنكم شامة في الناس","s":"","v":3,"p":148,"d":0,"c":"أنت مسلم يجب أن تكون في أعلى درجة من الأناقة والشكل الحسن, لذلك فالصورة الحسنة والعناية بالجسم وباللباس وبالبيت وبمكان العمل وبالمركبة, هذه من لوازم المؤمن."},{"t":"اللهم لك سجدت وبك آمنت ولك أسلمت, سجد وجهي للذي خلقه وصوره وشق سمعه وبصره, تبارك الله أحسن الخالقين","s":"أخرجه النسائي عن جابر بن عبد الله","v":3,"p":149,"d":0},{"t":"الحمد لله الذي حسّن خَلقي وخُلقي","s":"أخرجه أبو يعلى عن عبد الله بن عباس","v":3,"p":149,"d":0}],"50":[{"t":"لا إله إلا الله الواحد القهار, رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"عجبت لأقوام يساقون إلى الجنة في السلاسل وهم كارهون","s":"","v":2,"p":333,"d":0,"c":"فإن لم تستجب فالله سبحانه وتعالى عنده من الوسائل والأساليب والأدوية والطرائق والمضايقات والشدائد ما يدفعك إلى بابه دفعا, فأيهما أرقى لك أن تأتيه طائعا أو أن تأتيه مكرها, هذا ما فسره النبي."},{"t":"اللهم إنك عفو تحب العفو فاعف عني","s":"رواه أحمد وابن ماجه والترمذي وصححه","v":2,"p":341,"d":0,"c":"ويجب أن يدفعنا اسم الغفار جميعا إلى طلب المغفرة من الله عز وجل على الدوام. ولقد كان هذا الدعاء من أحب الأدعية إلى النبي, فلنكثر منه الحين بعد الحين."}],"29":[{"t":"لا إله إلا الله الواحد القهار, رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"يوم تبدل الأرض غير الأرض والسماوات وبرزوا لله الواحد القهار, قلت: أين الناس يومئذ? قال: على الصراط","s":"","v":2,"p":132,"d":1},{"t":"يا أبا بكر, ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":0,"c":"الأمر كله بيد الله. الله مهيمن, يحفظ أعظم شيء بأتفه سبب, وأحياناً يهلك إنساناً بأتفه سبب, ليظهر لك كمال قدرته عز وجل."}],"39":[{"t":"لقد دعا الله باسمه الأعظم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"","v":2,"p":150,"d":0}],"22":[{"t":"من لم يشكر الناس لم يشكر الله","s":"رواه الإمام أحمد والترمذي من حديث أبي هريرة","v":1,"p":379,"d":0,"c":"أما إذا خدمك أحد خدمة فلا تنس فضله, مع اعتقادك أن هذا الذي جاءك عن طريق فلان هو حقيقة من الله عز وجل, أولا ألهمه, ثانيا سمح له, ثالثا مكنه."},{"t":"من أسلم على يد رجل فله ولاؤه","s":"رواه الطبراني والدارقطني والبيهقي بسند حسن من حديث أبي أمامة","v":1,"p":381,"d":0,"c":"الإنسان يعطيك حاجة ينتهي أثرها بانتهاء الحياة, أما إذا ساق لك الله الهدى عن طريق إنسان فقد أسدى لك نعمة يستمر أثرها فيك وفي ذريتك إلى أبد الآبدين. فالذي ألقى في روع الإنسان أن يخدمك هو الله, والذي مكّنه من ذلك هو الله."},{"t":"والله في عون العبد ما كان العبد في عون أخيه","s":"رواه مسلم من حديث أبي هريرة","v":1,"p":383,"d":0,"c":"من علامة الإيمان أن ترى ما أنت فيه من نعمة من آيات الله الدالة على فضله, وإن أنت خدمت عباده فإذاً لك عون الله سبحانه."},{"t":"عجبًا لأمر المؤمن, إن أمره كله خير, وليس ذلك لأحد إلا للمؤمن: إن أصابته سراء شكر وكان خيرًا له, وإن أصابته ضراء صبر فكان خيرًا له","s":"أخرجه أحمد في مسنده عن صهيب","v":1,"p":384,"d":0,"c":"في الدنيا ابتلاء وفي الآخرة جزاء, وإذا أدرك العبد حقيقة الابتلاء واستعان بالله على تحقيق الرجاء كان موفقاً وناجحاً."},{"t":"أنفق, أنفق عليك","s":"متفق عليه عن أبي هريرة","v":1,"p":385,"d":0,"c":"والعبرة منها كلها: أنه كما تدين تدان, وكذلك اعمل ما شئت فإنك مجزي به. وأنا متيقن أنه لا يقع شيء في الأرض إلا وفق عدالة مطلقة."},{"t":"لا يحل لأحد أن يهب هبة ثم يرجع فيها إلا الوالد فيما يهب لولده","s":"","v":1,"p":385,"d":0,"c":"من خصائص المؤمن وقد آمن بالله الوهاب أن يكون كريماً معطاءً سخياً, لذلك جاء في الحديث. فعلاقة المسلم بهذا الاسم أن يتصف بالكرم, فالله وهاب, وأنت أعط مما رزقك الله."}],"52":[{"t":"إن الله هو المسعّر القابض الباسط الرازق, وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"ليسأل أحدكم ربه حاجته كلها حتى يسأله شسع نعله إذا انقطع","s":"رواه الترمذي","v":2,"p":367,"d":0,"c":"اسأله الأشياء الخسيسة كما تسأله الأشياء النفيسة, وهذا من تمام العبودية لله عز وجل."},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله هم دنياه, ومن تشعبت به الهموم في أحوال الدنيا لم يبال الله في أي أوديتها هلك","s":"رواه الديلمي في الفردوس من حديث أنس","v":2,"p":370,"d":0,"c":"فلو أمعنت النظر فإنك ترى من له دخل أقل من حاجته منعماً براحة البال التي لا يحلم بها من آتاه الله رزقاً وفيراً. والرزق هو ما ينتفع به: المال ينتفع به, والعلم ينتفع به, وشعور القلب بالطمأنينة ينتفع به."},{"t":"إن الرجل ليحرم الرزق بالذنب يصيبه","s":"","v":2,"p":373,"d":0,"c":"والذنب والسيئة سبب هوان العبد على ربه وسقوطه من أعين خلقه. اتق الله باجتناب المحرمات تكن من التوابين, وتورّع عن اقتحام الشبهات تكن من المتطهرين."}],"87":[{"t":"هل تدرون ماذا قال ربكم? قالوا: الله ورسوله أعلم, قال: أصبح من عبادي مؤمن بي وكافر, فأما من قال: مطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب, وأما من قال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب","s":"أخرجه البخاري ومسلم عن زيد بن خالد الجهني","v":3,"p":356,"d":0,"c":"فنستمع إلى من يقول: هناك منخفض متمركز فوق قبرص في طريقه إلينا وهذا سبب الأمطار, ويكتفي بذلك دون أن ينسب النعمة إلى المنعم; هذا رزق الله, هذا فضل الله, هذه رحمة الله. فلا بد من أن نعزو الأسباب إلى مسبب الأسباب, إلى خالق السماوات والأرض, كي نتعامل معه ونصطلح معه."},{"t":"أبيت عند ربي يطعمني ويسقيني","s":"","v":3,"p":359,"d":0,"c":"رزق الأبدان بالأطعمة, ورزق الأرواح بالمعرفة, والمعرفة أشرف الرزقين."},{"t":"إن الله يلوم على العجز, ولكن عليك بالكيس, فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":0,"c":"ومن أسباب زيادة الرزق: صدق التوكل على الله. لكن التوكل من عمل القلب, وليس من عمل الجوارح; والمسلمون حينما تخلفوا في فهم دينهم جعلوا التوكل بالجوارح, فلا يفعل أحدهم شيئاً."},{"t":"أنفق بلال ولا تخش من ذي العرش إقلالًا","s":"أخرجه الطبراني عن بلال","v":3,"p":362,"d":0,"c":"أحد أسباب زيادة الرزق الصدقة. بالصدقة تستدر الرزق من الله عز وجل."},{"t":"ثلاثة حق على الله عونهم: المجاهد في سبيل الله, والمكاتب الذي يريد الأداء, والناكح الذي يريد العفاف","s":"أخرجه الترمذي والنسائي عن أبي هريرة","v":3,"p":363,"d":0,"c":"فالنكاح أحد أسباب زيادة الرزق."}],"47":[{"t":"من جعل الهموم همًّا واحدًا هم آخرته كفاه الله هم دنياه","s":"","v":2,"p":279,"d":0,"c":"لكن المؤمن يعلم أن الفتاح هو الله, هو الحكم, فإذا أرضى جهة واحدة استراح."},{"t":"اللهم اجعل خير عمري آخره, واجعل خواتيم عملي رضوانك, واجعل خير أيامي يوم ألقاك","s":"أخرجه الطبراني في الأوسط من حديث أنس","v":2,"p":281,"d":0,"c":"فالله عز وجل, من إكرامه للمؤمن يجعل خير عمره آخره: يتعبه في أول حياته ولكن يريحه في آخره, أما أهل الدنيا فيعزهم في مقتبل حياتهم ثم يأتي العقاب والذل والهوان والفقر."},{"t":"لا يغني حذر من قدر","s":"أخرجه الحاكم في المستدرك من حديث عائشة","v":2,"p":286,"d":0,"c":"مع الله لا ينفع ذكاء, ولكن ينفع الدعاء مما نزل ومما لم ينزل, ولن يقع شيء إلا بأمر الله."}],"5":[{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم, من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"فضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي من حديث أبي سعيد","v":1,"p":115,"d":0,"c":"لا يرتفع العلم إلا إذا ارتفع المعلوم, فما أعظم العلوم? العلم بالله. أشرف علم أن تعرف الله; لأن شرف العلم من شرف المعلوم, ولا موضوع للعلم أعظم من ذات الله عز وجل."}],"85":[{"t":"إن الله هو المسعّر القابض الباسط الرازق, وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"ما مست يد رسول الله ﷺ يد امرأة قط","s":"أخرجه مسلم عن عائشة","v":3,"p":332,"d":0},{"t":"البر حسن الخلق, والإثم ما حاك في صدرك وكرهت أن يطلع عليه الناس","s":"صحيح مسلم","v":3,"p":339,"d":0,"c":"وربنا عز وجل أودع فيك العقل لتعرفه, وأودع فيك هذه الفطرة العالية لتعرف خطأك, فبالعقل تعرف ربك وبالفطرة تعرف خطأك. واعلم أن معك ميزانًا: إذا كذب الإنسان أو اعتدى أو خان فإنه يشعر بالانقباض."},{"t":"لا أنت أطعمتها ولا سقيتها حين حبستيها, ولا أنت أرسلتها فأكلت من خشاش الأرض","s":"صحيح البخاري","v":3,"p":345,"d":0,"c":"ويفهم من ذلك أن النبي قد خوفنا, وأحيانًا يطمئنك ويبشرك ليجعلك بين الخوف والرجاء, وهذا أسلوب الحكيم. وكما أن الله قابض باسط فيجب أن تكون مرة في دعوتك تخوّف عباد الله من معصيته ومرة تحببهم في طاعته."},{"t":"اللهم لك الحمد كله, اللهم لا قابض لما بسطت ولا باسط لما قبضت, ولا هادي لمن أضللت ولا مضل لمن هديت, ولا معطي لما منعت ولا مانع لما أعطيت, ولا مقرب لما باعدت ولا مباعد لما قربت, اللهم إني أسألك من بركتك ورحمتك وفضلك ورزقك","s":"أخرجه أبو داود عن أبي بن كعب","v":3,"p":348,"d":0,"c":"ومن ثمرات الإيمان باسم الله القابض دعاؤه بدعاء النبي."}],"86":[{"t":"إن الله هو المسعّر القابض الباسط الرازق, وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"من سره أن يبسط الله له في رزقه, وأن ينسأ له في أثره فليصل رحمه","s":"أخرجه البخاري والترمذي عن أبي هريرة","v":3,"p":351,"d":0,"c":"وقد فسّر العلماء هذا الحديث بأن الإنسان قد يفتح محله التجاري ساعة فيربح مليونًا, وقد يفتحه عشر ساعات ويربح مئة ليرة فقط, فالزمن ليس له قيمة بل القيمة كلها في الربح, وكذلك فإن قيمة العمر ليست بمدته بل هي بعطائه."},{"t":"فوالله ما الفقر أخشى عليكم, ولكني أخشى أن تبسط عليكم الدنيا كما بسطت على من كان قبلكم","s":"","v":3,"p":353,"d":0,"c":"إذا استحققت من الله حالة البسط فإياك أن تنزلق منها إلى الغرور أو إلى الاستعلاء أو الإعجاب أو أن تستطيل على عباد الله. والمؤمن باسم الله الباسط يشكر الله تعالى في حال البسط في الرزق ويداوم على الطاعات."}],"122":[{"t":"أرحم أمتي بأمتي أبو بكر, وأشدهم في أمر الله عمر, وأصدقهم حياءً عثمان, وأقرؤهم لكتاب الله أبيّ بن كعب, وأفرضهم زيد بن ثابت, وأعلمهم بالحلال والحرام معاذ بن جبل, ألا وإن لكل أمة أمينًا, وإن أمين هذه الأمة أبو عبيدة بن الجراح","s":"رواه الترمذي","v":4,"p":366,"d":0,"c":"وما من صحابي إلا نوّه النبي بفضله وبيّن شأنه, لأن هذا من أخلاق النبوة. فإذا كان لأخ لك إنجاز جيد وفضيلة مأنوسة ونوّهت بفضله, فسيشعر بقيمته عندك وأنه محترم, وهذا الفعل من فضائل المؤمنين."},{"t":"أنزلوا الناس منازلهم","s":"","v":4,"p":366,"d":0,"c":"ومعنى رفعة الشأن والتنويه بالذكر هذه في المنزلة, والنبي قال: أنزلوا الناس منازلهم. فإذا استقبلت أخاً مؤمناً وأثنيت عليه فلا مانع من باب التشجيع له والتنويه بفضله."}],"121":[{"t":"لا يخلون رجل بامرأة إلا كان الشيطان ثالثهما","s":"رواه الترمذي من حديث عمر","v":4,"p":344,"d":0,"c":"فأنت عزيز لأنك مطيع لله عز وجل, والله تعالى حينما أمرك بهذا المنهج حصّن سمعتك. فما دمت ملتزماً بنص هذا الحديث فلا يستطيع أحد أن ينال منك ولا أن يتهمك, لأنك عملت بأمر الله حفاظاً على سمعتك وكرامتك وعزتك ومكانتك."},{"t":"إن الشيطان يجري من الإنسان مجرى الدم, وإني خشيت أن يقذف في قلوبكما شرًّا","s":"رواه مسلم من حديث صفية بنت حيي","v":4,"p":345,"d":0,"c":"إذا طبّقت أمر الله عز وجل واستقمت عليه فأنت عزيز. وإن أي انحراف يتبعه ذل الفضيحة: عرف أحدهم أنك لست بصادق لحقك الذل, وكشف أنك لست بأمين فسُحبت الثقة منك."},{"t":"الكيّس من دان نفسه وعمل لما بعد الموت","s":"","v":4,"p":350,"d":0,"c":"فالإنسان حين يضع نفسه في مواطن صعبة حفاظاً على عزته البعيدة يفلح; فالأغبياء يعيشون لحظتهم, أما الأذكياء فيعيشون مستقبلهم."},{"t":"لا ينبغي للمؤمن أن يذل نفسه","s":"","v":4,"p":353,"d":0,"c":"فلا شيء يدق أعناق الرجال كالطمع ولا شيء يذل الرجال ويحقرهم كالجشع. الله عز وجل يعزّك إذا طبقت شرعه وإذا استغنيت به عمن سواه."}],"8":[{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم, من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"أيها الناس اربعوا على أنفسكم - أي ارفقوا - إنكم ليس تدعون أصمّ ولا غائبًا, إنكم تدعون سميعًا قريبًا","s":"أخرجه البخاري ومسلم عن أبي موسى","v":1,"p":154,"d":0,"c":"يقول بعض العلماء: الله جل جلاله سميع, أي لا يعزب عن إدراكه مسموع وإن خفي, فقد وسع سمعه كل شيء. ومن لوازم الإله الذي يجب أن تعبده أن يسمعك دون واسطة."},{"t":"اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس... أنت رب المستضعفين وأنت ربي, إلى من تكلني? إلى بعيد يتجهمني أم إلى عدو ملّكته أمري? إن لم يكن بك غضب عليّ فلا أبالي, غير أن عافيتك أوسع لي","s":"أخرجه الطبراني في المعجم الكبير من حديث عبد الله بن جعفر","v":1,"p":166,"d":0,"c":"يعني هذا الإسراء وذاك المعراج مكافأة لك وتكريم لك, وتكريم السماء تعويض عن جفوة الأرض, لأن الله سمع دعاءك في الطائف, وجاء قوله تعالى: ﴿إنه هو السميع البصير﴾."},{"t":"صوتان ملعونان في الدنيا والآخرة: مزمار عند نعمة, ورنة عند مصيبة","s":"أخرجه الضياء في الأحاديث المختارة وهو حسن","v":1,"p":169,"d":0,"c":"فالإنسان المؤمن ترثه عينه وأذنه وقوته وعقله, ويستمتع بسمعه إلى آخر لحظة في حياته, وهذا السمع يجب أن يكون للحق."},{"t":"إني لم أنه عن البكاء, ولكني نهيت عن صوتين أحمقين فاجرين: صوت عند نغمة لهو ولعب ومزامير الشيطان, وصوت عند مصيبة: لطم وجوه وشق جيوب ورنة شيطان","s":"أخرجه الحاكم في المستدرك","v":1,"p":169,"d":0},{"t":"إن الله قال: من عادى لي وليًا فقد آذنته بالحرب, وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه, وما يزال عبدي يتقرب إليّ بالنوافل حتى أحبه, فإذا أحببته كنت سمعه الذي يسمع به, وبصره الذي يبصر به, ويده التي يبطش بها, ورجله التي يمشي بها, ولئن سألني لأعطينه, ولئن استعاذني لأعيذنه, وما ترددت عن شيء أنا فاعله ترددي عن نفس المؤمن, يكره الموت وأنا أكره مساءته","s":"صحيح البخاري","v":1,"p":170,"d":0,"c":"في سمعه نور, يعني أن الباطل لا يسمعه, وكلام يناقض القرآن لا يسمعه, والكلام الفاحش والبذيء لا يسمعه, والغيبة يرفضها إذ في سمعه نور."}],"44":[{"t":"إنكم لا تدعون أصمّ ولا غائبًا, إنكم تدعون سميعًا بصيرًا","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":215,"d":0},{"t":"أدنِ اليتيم منك, وألطفه, وامسح برأسه, وأطعمه من طعامك, فإن ذلك يلين قلبك ويدرك حاجتك","s":"","v":2,"p":220,"d":0,"c":"لكن الله نظر إلى نيته الطيبة, فالمعنى أن الله بصير, تتكشف له بهذه الصفة كمالات صفات هذا الضارب, هو يضربه لله, يضربه ليؤدبه, يضربه ليحمله على الاستقامة."},{"t":"إن الشيطان يجري من الإنسان مجرى الدم, فخشيت أن يقذف في قلوبكما شيئًا","s":"","v":2,"p":222,"d":0,"c":"صحيح أن الله جل جلاله يعلم, لكن لا يكفي أن تقول: الله يعلم, ثم تضع نفسك موضع التهمة; ويجب أن تدفع عن نفسك كل الشبهات."},{"t":"أفضل الإيمان أن تعلم أن الله معك حيثما كنت","s":"","v":2,"p":226,"d":0,"c":"وأرقى حالات المؤمن أن يشعر أنه تحت مراقبة الله عز وجل, أن تشعر دائماً أن الله معك في خلوتك وفي جلوتك; هذا الشعور المستمر من نعم الله العظمى وهو درجة عالية من درجات الإيمان."},{"t":"أن تعبد الله كأنك تراه, فإن لم تكن تراه فإنه يراك...","s":"صحيح البخاري","v":2,"p":231,"d":0,"c":"وإذا عرف الإنسان أن الله تعالى هو البصير وكان عاقلاً زين باطنه بالمراقبة, وزين ظاهره بالمحاسبة."}],"97":[{"t":"ولكل شيء حقيقة, وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه, وما أخطأه لم يكن ليصيبه","s":"أخرجه الطبراني عن أبي الدرداء","v":3,"p":478,"d":0,"c":"فالحكم الكوني واقع لا محالة, فكل شيء وقع أراده الله, وكل شيء أراده الله وقع, وإرادة الله متعلقة بالحكمة المطلقة, والحكمة المطلقة متعلقة بالخير المطلق."},{"t":"اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب, وما زويت عني مما أحب فاجعله فراغًا لي فيما تحب","s":"أخرجه الترمذي عن عبد الله بن يزيد الخطمي","v":3,"p":478,"d":0,"c":"هذه أشياء أنت مسير بها, هذا حكم إلهي, لكن حينما تكتشف الحقائق وتكشف الحكمة من القضاء والقدر يوم القيامة, المؤمن يقول كلمة واحدة: يا رب لك الحمد على ما سقت لي."},{"t":"اللهم فاطر السماوات والأرض, عالم الغيب والشهادة, أنت تحكم بين عبادك فيما كانوا فيه يختلفون","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن عائشة","v":3,"p":480,"d":0},{"t":"كان النبي ﷺ إذا قام من الليل يتهجد قال: اللهم لك الحمد, أنت نور السماوات والأرض ومن فيهن, ولك الحمد, اللهم بك آمنت ولك أسلمت وعليك توكلت وإليك أنبت وبك خاصمت وإليك حاكمت, فاغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"أخرجه مسلم وابن خزيمة","v":3,"p":481,"d":0,"c":"اسم الله الحكم يقتضينا أن نحتكم إلى الله, فهذا أول موقف, أما إذا حكمنا فعلينا أن نحكم بالعدل."}],"101":[{"t":"أنفق, أنفق عليك","s":"رواه الشيخان وأحمد من حديث أبي هريرة","v":4,"p":31,"d":0,"c":"والعبرة منها كلها: أنه كما تدين تدان, وكذلك اعمل ما شئت فإنك مجزي به. وأنا متيقن أنه لا يقع شيء في الأرض إلا وفق عدالة مطلقة."},{"t":"اعمل ما شئت كما تدين تدان","s":"","v":4,"p":31,"d":0,"c":"العبرة من هذه الوقائع كلها أنه كما تدين تدان, وكذلك اعمل ما شئت فإنك مجزي به. ولا يقع شيء في الأرض إلا وفق عدالة مطلقة, فاعلم علم اليقين أن الله عز وجل عدل في خلقه, وعدل في أمره, وعدل في فعله."},{"t":"إن لله ما أخذ وله ما أعطى, وكل شيء عنده بأجل مسمى, فلتصبر ولتحتسب","s":"متفق عليه عن أسامة بن زيد","v":4,"p":34,"d":0,"c":"الذي أخذه له, والذي أعطاك تفضل به عليك, فإذا أيقنت أن لله ما أعطى وله ما أخذ فلا مشكلة إذاً."},{"t":"خذي ما يكفيك وولدك بالمعروف","s":"متفق عليه من حديث عائشة","v":4,"p":37,"d":0,"c":"فالله سبحانه وتعالى عدل في خلقه, وعدل في أمره, وعدل في فعله, ونحن المؤمنين ينبغي أن نقف بين الإفراط والتفريط, وأن نكون معتدلين في كل أفعالنا."}],"31":[{"t":"تعلموا أنه لن يرى أحد منكم ربه حتى يموت","s":"رواه مسلم عن عمرو بن ثابت الأنصاري","v":2,"p":9,"d":0,"c":"في الدنيا ليس هناك رؤية, وأي دعوى برؤيته افتراء وكذب, لأن الدنيا خلقت للابتلاء, أما الآخرة فهي دار الجزاء. وتعني كلمة لطيف أن الله عز وجل من اللطف بحيث لا تراه ولا تسمعه, ولكن تراه بعقلك."},{"t":"من لعب بالنردشير فكأنما غمس يده في لحم خنزير ودمه","s":"رواه مسلم","v":2,"p":15,"d":0,"c":"وبالتدريج ربنا يعالج الأمور, فربنا لطيف في العلاج; والإنسان أحياناً يغلب رجاؤه على خوفه وربنا لطيف يخوّفه, وأحياناً يغلب خوفه على رجائه وربنا لطيف."},{"t":"زادك الله حرصًا ولا تعد","s":"أخرجه البخاري من حديث أبي بكرة","v":2,"p":15,"d":0,"c":"والمربي المؤمن لطيف, ينقل من يعالجه ويربيه من درجة إلى درجة بالرفق واللطف. لقد ترفق به, ولذلك قال النبي: إن الله تعالى رفيق يحب الرفق."},{"t":"هلال خير ورشد, هلال خير ورشد, هلال خير ورشد, آمنت بالذي خلقك - ثلاث مرات - ثم يقول: الحمد لله الذي ذهب بشهر كذا وجاء بشهر كذا","s":"أخرجه أبو داود","v":2,"p":17,"d":0}],"16":[{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك? قال: قل: لا إله إلا الله الحليم الكريم, لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"إن فيك خصلتين يحبهما الله ورسوله: الحلم والأناة","s":"","v":1,"p":269,"d":0,"c":"وصفة الحلم تعني الأناة, ومعالجة الأمور بصبر وعلم وحكمة, ويقابل الحلم العجلة المفسدة لأمور الدين والدنيا."},{"t":"سبقت رحمتي غضبي","s":"متفق عليه من حديث أبي هريرة","v":1,"p":273,"d":0,"c":"هذه الكلمة هي الرحمة, هي الإحسان, اقتضت أن يؤخر الله عقابهم لعلهم يرجعون, لعلهم يندمون, لعلهم يراجعون أنفسهم; ويؤكد هذه الحقيقة قول النبي: سبقت رحمتي غضبي."},{"t":"لله أرحم بعباده من هذه بولدها","s":"متفق عليه من حديث عمر بن الخطاب","v":1,"p":276,"d":0,"c":"فمن أودع في قلب الأم الرحمة? تستيقظ عشرات المرات في الليل من أجل وليدها. ونظام الأسرة له هدفان: هدف لتربية الأولاد, وهدف أكبر بكثير أن تتعرف إلى طرف يسير جداً من رحمة الله عز وجل."},{"t":"ليس أحد أحب إليه المدح من الله, من أجل ذلك مدح نفسه, وليس أحد أغير من الله, من أجل ذلك حرّم الفواحش","s":"رواه مسلم من حديث عبد الله بن مسعود","v":1,"p":277,"d":0,"c":"إن الله عز وجل حليم, ومعلوم أن الله يحب الكمال, والله سبحانه وتعالى يحب المحامد, يحب العمل الذي يحمد عليه الإنسان, يحب الحلم, يحب الرحمة, يحب الإنصاف, يحب العدل."},{"t":"لا تغضب","s":"أخرجه البخاري والترمذي ومالك عن أبي هريرة","v":1,"p":278,"d":0,"c":"والحلم سيد الأخلاق, ولأن المؤمن حليم فقراره صحيح, والإنسان حينما يغضب لا يرى الحقائق, بل يرتكب حماقات لا يرتكبها الصغار. فالإنسان إذا غضب غابت عنه الحقائق وارتكب حماقات يندم عليها أشد الندم."},{"t":"ليس الشديد بالصُّرَعة, إنما الشديد الذي يملك نفسه عند الغضب","s":"متفق عليه","v":1,"p":278,"d":0,"c":"الله يحب الكمال, يحب العمل الذي يُحمد عليه الإنسان, يحب الحلم, يحب الرحمة, يحب الإنصاف, يحب العدل. والحلم سيد الأخلاق, ولأن المؤمن حليم فقراره صحيح, والإنسان حينما يغضب لا يرى الحقائق, بل يرتكب حماقات لا يرتكبها الصغار."},{"t":"إنما الصبر عند الصدمة الأولى","s":"صحيح البخاري","v":1,"p":278,"d":0,"c":"فالإنسان إذا غضب غابت عنه الحقائق وارتكب حماقات يندم عليها أشد الندم. هدّئ نفسك, عالج الأمور بأناة وصبر وعلم وحكمة, لا تأخذ الأمر بتعجل بل بحلم وهدوء."}],"20":[{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي, ثم دعا: اللهم إني أسألك بأن لك الحمد, لا إله إلا أنت المنان, بديع السماوات والأرض, يا ذا الجلال والإكرام, يا حي يا قيوم, فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له, له الملك وله الحمد وهو على كل شيء قدير, سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم, ثم قال: اللهم اغفر لي, أو دعا, استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"كلمتان خفيفتان على اللسان, ثقيلتان في الميزان, حبيبتان إلى الرحمن: سبحان الله العظيم, سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك, وأسألك من فضلك العظيم, فإنك تقدر ولا أقدر, وتعلم ولا أعلم, وأنت علام الغيوب","s":"","v":2,"p":422,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم, ربنا ورب كل شيء, فالق الحب والنوى, ومنزل التوراة والإنجيل والفرقان, أعوذ بك من شر كل شيء أنت آخذ بناصيته, اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك? قال: قل: لا إله إلا الله الحليم الكريم, لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"أعوذ بالله العظيم, وبوجهه الكريم, وسلطانه القديم, من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1}],"14":[{"t":"إن الله تعالى تجاوز لأمتي ما وسوست به صدورها ما لم تعمل به أو تتكلم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن أبي هريرة","v":1,"p":249,"d":0,"c":"كل خاطر, كل حديث ذاتي لا يرضي الله ينبغي أن تستغفر الله منه, هذا الاستغفار العام, فالله عز وجل تفضل علينا وعفا عنا فيما حدثنا به أنفسنا, أما إذا انقلب إلى عمل فهناك استغفار خاص."},{"t":"لو لم يكن لكم ذنوب يغفرها الله لكم لجاء الله بقوم لهم ذنوب يغفرها لهم","s":"","v":1,"p":250,"d":0,"c":"ليس معنى الحديث أن تسارع إلى الذنب, ولكن معنى الحديث أن الذي لا يشعر بذنبه هالك, لا يعبأ الله به. هذا الاسم من أقرب الأسماء إلى المؤمن, لأن العبد من شأنه أن يذنب, ولأن الله تعالى من شأنه أن يغفر."},{"t":"اللهم أنت ربي لا إله إلا أنت, خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت, أعوذ بك من شر ما صنعت, أبوء لك بنعمتك عليّ وأبوء بذنبي فاغفر لي, فإنه لا يغفر الذنوب إلا أنت","s":"أخرجه أبو داود عن بريدة بن الخصيب","v":1,"p":255,"d":0,"c":"وقد علمنا النبي دعاء هو سيد الاستغفار. العبد عبد والرب رب, العبد شأنه الاستغفار والرب شأنه الغفران, من لنا غير الله? مهما أذنبنا فليس لنا إلا الله الغفور."}],"12":[{"t":"بروا آباءكم تبركم أبناؤكم, وعفّوا تعفّ نساؤكم","s":"","v":1,"p":233,"d":0,"c":"يشكر الله لك برك لأبيك بأن يلهم أولادك في المستقبل أن يكونوا بك بررة, وهذا عطاء في الدنيا قبل الآخرة. والذي يتعفف عن الحرام يكافئه الله بزوجة عفيفة, لأن الله عز وجل هو الشاكر."}],"48":[{"t":"قال الله: أعددت لعبادي الصالحين ما لا عين رأت, ولا أذن سمعت, ولا خطر على قلب بشر","s":"صحيح البخاري","v":2,"p":293,"d":0,"c":"هذا معنى الشكور, صيغة مبالغة لاسم الفاعل, إنه يعطي اللانهاية, يعطي الأبد. الله سمى ما أعد لك في الجنة ملكا كبيرا, هذا معنى الشكور; شيء لا يقدر بثمن مقابل شيء قليل جدا قدمته نلت به شيئا كثيرا."},{"t":"قد تركتكم على البيضاء ليلها كنهارها لا يزيغ عنها بعدي إلا هالك","s":"أخرجه أحمد في مسنده","v":2,"p":302,"d":0},{"t":"إن ذكرني في ملأ ذكرته في ملأ خير منهم","s":"","v":2,"p":304,"d":0,"c":"أنت أثنيت على الله أمام خمسة أشخاص من عامة الناس, والله عز وجل أثنى عليك أمام علية القوم. هذا هو الشكور: إن عملت يعاملك بالإحسان فهو شكور, وإن تحدثت عن الله عز وجل يعاملك بالعرفان فهو شكور."},{"t":"عجبًا لأمر المؤمن! إن أمره كله له خير, إن أصابته سراء شكر فكان خيرًا له, وإن أصابته ضراء صبر فكان خيرًا له, وليس ذلك لأحد إلا للمؤمن","s":"أخرجه مسلم عن صهيب الرومي","v":2,"p":308,"d":0,"c":"والإيمان نصف صبر ونصف شكر. أروع ما في هذا الإيمان العظيم أن في كل الأحوال مع الله; إن كانت الأمور على خلاف ما تشتهي فأنت صبور, وإن كانت وفق ما تشتهي فأنت شكور."}],"19":[{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له, له الملك وله الحمد وهو على كل شيء قدير, سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم, ثم قال: اللهم اغفر لي, أو دعا, استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك? قال: قل: لا إله إلا الله الحليم الكريم, لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"وفضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي عن أبي سعيد وقال: حسن غريب","v":1,"p":320,"d":0,"c":"شرف العلم من شرف المعلوم; أي لا يوجد علم أشرف من أن تعرف الله, ولا علم أشرف من أن تعرف أسماءه الحسنى وصفاته الفضلى, ففضل علمك بأسماء الله الحسنى على علمك بمخلوقاته كفضل الله على مخلوقاته."},{"t":"لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا","s":"أخرجه مسلم والترمذي عن أبي ذر الغفاري","v":1,"p":320,"d":0,"c":"العلي لا يزيده تعظيم العباد وإجلالهم له شيئاً, فلو أن كل الخلق سبحوه وعظموه وبجلوه فهذا لا يزيده علواً, فهو علي بذاته."},{"t":"إن الله كريم يحب الكرم, ويحب معالي الأخلاق ويكره سفسافها","s":"أخرجه الحاكم عن سهل بن سعد الساعدي","v":1,"p":326,"d":0,"c":"ومن ثمرات معرفة اسم الله العلي أنه يحبك حين تحب معالي الأمور: أن تحب الله لا أن تحب امرأة, وأن تحب الآخرة لا الدنيا, وأن تحب رضوان الله لا المال. فالمؤمن يحب معالي الأمور ويكره سفسافها ودنيّها."}],"40":[{"t":"بئس العبد عبد تخيل واختال ونسي الكبير المتعال, بئس العبد عبد تجبر واعتدى ونسي الجبار الأعلى, بئس العبد عبد سها ولها ونسي المقابر والبلى, بئس العبد عبد عتا وطغى ونسي المبتدأ والمنتهى","s":"رواه الترمذي عن أسماء بنت عميس الخثعمية","v":3,"p":93,"d":1},{"t":"عجبت لها, فتحت لها أبواب السماء, قال ابن عمر: فما تركتهن منذ سمعت رسول الله ﷺ يقول ذلك","s":"صحيح مسلم","v":2,"p":168,"d":0,"c":"إذا قلت: الله أكبر فقد كبّرته, وإذا سبحته وحمدته ووحدته وكبرته فقد عرفته, وإذا عرفته عرفت كل شيء وسعدت بهذه المعرفة إلى الأبد."},{"t":"صنائع المعروف تقي مصارع السوء","s":"رواه الطبراني وصححه الألباني","v":2,"p":178,"d":0,"c":"أما أهل الدنيا فهان أمر الله عليهم فهانوا على الله, ترى حياته تافهة عند الله لم يبال في أي أوديتها هلك, تراه يموت ميتة سيئة بشعة حقيرة; لكنّ المؤمن له عند الله شأن كبير."}],"35":[{"t":"اللهم احفظني بالإسلام قائمًا, واحفظني بالإسلام قاعدًا, واحفظني بالإسلام راقدًا, ولا تشمت بي عدوًا ولا حاسدًا, اللهم إني أسألك من كل خير خزائنه بيدك, وأعوذ بك من كل شر خزائنه بيدك","s":"أخرجه ابن حبان والحاكم وصححه","v":2,"p":73,"d":0,"c":"الحفيظ هو الذي يهيئ الأسباب بتوفيقه إلى الطاعة والإيمان, يحفظك من الوقوع في العصيان, ويمدك بالأسباب التي تعينك على الطاعة والإيمان."},{"t":"والشر ليس إليك","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن علي بن أبي طالب","v":2,"p":73,"d":0,"c":"هذا يعني أن الشر نسبي, وليس هناك شر مطلق, فالشر المطلق يتناقض مع وجود الله. فالمصيبة قد تعد شراً بالنسبة إليك, لكنها بالنسبة إلى مستقبل حياتك تعد خيراً, فالله عز وجل يوظف الشر النسبي للخير المطلق."},{"t":"سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل, وشاب نشأ في عبادة الله, ورجل قلبه معلق في المساجد, ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه, ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله, ورجل تصدق فأخفى حتى لا تعلم شماله ما تنفق يمينه, ورجل ذكر الله خاليًا ففاضت عيناه","s":"متفق عليه عن أبي هريرة","v":2,"p":80,"d":0,"c":"إن أخشى ما أخشاه أن أخرج عن ظل الله عز وجل, وتخرج بالمعاصي; فإذا كنت مستقيماً فأنت في ظل الله, أنت في حفظه, أنت في رعايته."},{"t":"سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون, اللهم إنا نسألك في سفرنا هذا البر والتقوى ومن العمل ما ترضى, اللهم هون علينا سفرنا هذا واطو عنا بعده, اللهم أنت الصاحب في السفر والخليفة في الأهل والمال","s":"رواه أبو داود في السنن","v":2,"p":83,"d":0},{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره, فإنه لا يدري ما خلفه عليه, ثم يقول: باسمك ربي وضعت جنبي وبك أرفعه, إن أمسكت نفسي فارحمها, وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"رواه البخاري عن أبي هريرة","v":2,"p":91,"d":0,"c":"فالإنسان إذا نام بين حالتين: إما أن يستيقظ من نومه ويبقى حياً, وإما ألا يستيقظ لأن الله أمسك نفسه, أي: أخذ روحه. لذلك علمنا رسولنا أن نسأل الله عند النوم أن يرحمنا إذا أمسك بنفوسنا, وأن يحفظنا بما يحفظ عباده الصالحين إذا أرسل نفوسنا بعد النوم."},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":0,"c":"هذا الوضع الذي يتكرر أحياناً, يُقبل ثم يُدبر, يتألق ثم يخبو, يتحرك ثم يسكن, هذا الوضع لا يرضي الله عز وجل."},{"t":"احفظ الله يحفظك","s":"أخرجه الترمذي عن عبد الله بن عباس","v":2,"p":93,"d":0,"c":"الله حفيظ يحفظ عباده, وأنت أيها المؤمن اشتق من هذا الكمال كمالاً تتقرب به إلى الله: احفظ من حولك, احفظ أولادك, احفظ دينهم, احفظ عقيدتهم, احفظ عباداتهم, احفظ دراستهم. ألا تتمنى أيها المؤمن أن يحفظك الله تعالى? إذاً اعمل بوصية نبيك صلى الله عليه وسلم."}],"28":[{"t":"ذكر الرجل يطيل السفر أشعث أغبر, يمد يديه إلى السماء: يا رب يا رب, ومطعمه حرام, ومشربه حرام, وملبسه حرام, وغُذي بالحرام, فأنى يُستجاب لذلك?","s":"عن أبي هريرة","v":1,"p":475,"d":0,"c":"فمن أدب المؤمن مع اسم المقيت ألا يتناول إلا الحلال الطيب ليرتفع عند الله ذكره ويعظم أجره. هناك أثر يقول: أطب مطعمك تكن مستجاب الدعوة."},{"t":"اللهم اجعل رزق آل محمد قوتًا","s":"متفق عليه من حديث أبي هريرة","v":1,"p":479,"d":0,"c":"الإنسان المشغول بذكر الله عز وجل قوته موفور وحاجاته ميسرة. وليس معنى هذا أنه يسأل الله الفقر, لكن معناه أنه يريد رزقًا يغطي كل حاجاته دون أموال طائلة تشغله عن الله عز وجل, فما قل وكفى خير مما كثر وألهى."},{"t":"اللهم من أحبني فاجعل رزقه قوتًا","s":"أخرجه البخاري ومسلم والترمذي عن أبي هريرة","v":1,"p":479,"d":0,"c":"كل يوم ثلاث وجبات وعندها تعرف إلى المقيت, ولا يشغلك القوت عن المقيت. فالله عز وجل يقيت الأشباح بالطعام, ويقيت الأرواح بالعلم والمعرفة, ونحن عالة على المقيت جل جلاله."},{"t":"من أطعمه الله طعامًا فليقل: اللهم بارك لنا فيه","s":"","v":1,"p":480,"d":0,"c":"هذه مشتقات الألبان من أعظم الأرزاق الإلهية. فالنعمة تعبر عن المنعم, والقوت عن المقيت."}],"25":[{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":0,"c":"اركب البحر واغمس إبرة فيه وارفعها ثم انظر ماذا أخذت من ماء البحر, فهذا الذي أخذته هو الدنيا والبحر هو الآخرة, والله واسع عليم, فالإنسان مهما غني وتنعّم وقوي وانغمس في الملذات والشهوات فكل هذا لا يساوي من الآخرة مثقال ذرة."},{"t":"شرف المؤمن صلاته بالليل, وعزه استغناؤه عما في أيدي الناس","s":"رواه الحاكم عن سهل بن سعد وصححه","v":1,"p":425,"d":0,"c":"شرف الإنسان بطاعته لله, فاعلم إذًا أن شرفك بطاعتك لله ولا شيء آخر. فالحسيب هو الشريف."},{"t":"لا تقيّ مالك بمالك","s":"ابن ماجه عن عبد الله بن عمرو","v":1,"p":426,"d":0,"c":"لا تجعل ماله دريئة أو حقل تجارب. فمن الذي يعرف هذه الحقائق? هو الله, الحسيب الذي يحاسب; فالخلفيات والنيات والحقائق لا يعلمها إلا الله."}],"72":[{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك? قال: قل: لا إله إلا الله الحليم الكريم, لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"أعوذ بالله العظيم, وبوجهه الكريم, وسلطانه القديم, من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1},{"t":"الكريم ابن الكريم ابن الكريم ابن الكريم: يوسف بن يعقوب بن إسحاق بن إبراهيم","s":"أخرجه البخاري من حديث ابن عمر","v":3,"p":165,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":0},{"t":"إن ربكم تبارك وتعالى حيي كريم, يستحيي أن يرفع العبد يديه فيردهما صفرًا","s":"","v":3,"p":164,"d":0},{"t":"إنك ستأتي قومًا أهل كتاب, فإذا جئتهم فادعهم إلى أن يشهدوا أن لا إله إلا الله وأن محمدًا رسول الله, فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم خمس صلوات في كل يوم وليلة, فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم صدقة تؤخذ من أغنيائهم فترد على فقرائهم","s":"أخرجه البخاري","v":3,"p":168,"d":0,"c":"كرائم أموالهم: يعني إن كان عنده بقرة يحرص عليها حرصًا شديدًا فدعها له وخذ بقرة أخرى يختارها لك هو, لا كما يفعل بعض الناس يأخذ ما يعجبه; وهذا يتعارض مع السنة الشريفة."},{"t":"ليس أحد أصبر على أذى سمعه من الله تعالى, إنهم ليدعون له ولدًا وإنه ليعافيهم ويرزقهم","s":"متفق عليه من حديث أبي موسى الأشعري","v":3,"p":171,"d":0,"c":"هذه البيوت لا يعلم ما فيها من طاعات أو من معاصٍ إلا الله, ومع ذلك يرزقهم ويعافيهم. والكريم إذا أتاه عباده بالطاعات اليسيرة قابلهم بالثواب الجزيل."}],"75":[{"t":"أحبوا الله لما يغذوكم به من نعمه, وأحبوني لحب الله, وأحبوا أهل بيتي لحبي","s":"رواه الترمذي من حديث ابن عباس","v":3,"p":216,"d":0,"c":"الكافر يقف عند النعمة ويعمى عن المنعم, والمؤمن يتجاوزها إلى المنعم. ولا بد أن يجتمع في قلب المؤمن تعظيم لله وخوف منه وحب له: تعظيم بالآلاء, وتخويف بالمصائب, ومحبة بالنعم."}],"24":[{"t":"فأقول كما قال العبد الصالح عيسى ابن مريم: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ﴾","s":"","v":1,"p":403,"d":1},{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال, فأقول: يا رب أصحابي, فيقول: إنك لا تدري ما أحدثوا بعدك, فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"علمنا رسول الله ﷺ خطبة الحاجة: إن الحمد لله نستعينه ونستغفره, ونعوذ به من شرور أنفسنا, من يهده الله فلا مضل له, ومن يضلل فلا هادي له, وأشهد أن لا إله إلا الله وأشهد أن محمدًا عبده ورسوله, ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾","s":"أخرجه أبو داود والترمذي والنسائي عن عبد الله بن مسعود","v":1,"p":404,"d":0},{"t":"فقال رجل: وما تزكية النفس? فقال: أن يعلم أن الله عز وجل معه حيث كان","s":"البيهقي في السنن","v":1,"p":405,"d":0,"c":"فالمراقبة حال ذكره العلماء كثيراً, وهذا الحال يشعرك أن الله معك دائماً."},{"t":"إذا صلى أحدكم فليلبس ثوبيه, فإن الله أحق من تزين له","s":"","v":1,"p":412,"d":0}],"49":[{"t":"إن الله حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه الترمذي من حديث سلمان الفارسي","v":2,"p":313,"d":0,"c":"زوال الكون أهون على الله من أن تدعوه فلا يستجيب لك; واستجابته إما أن يطمئنك, وإما أن يعطيك, وإما أن يلقي في روعك أن هذه الحاجة لا تناسبك. والمجيب في حق الله تعالى هو الذي يقابل مسألة السائلين بالإسعاف."},{"t":"ما من رجل يدعو الله بدعاء إلا استجيب له, فإما أن يعجل له في الدنيا, وإما أن يدخر له في الآخرة, وإما أن يكفر عنه من ذنوبه بقدر ما دعا, ما لم يدع بإثم أو قطيعة رحم أو يستعجل. قالوا: يا رسول الله وكيف يستعجل? قال: يقول: دعوت ربي فلم يستجب لي","s":"متفق عليه عن أبي هريرة","v":2,"p":321,"d":0,"c":"فالله حكيم في إجابته, قد يعجّل أو يؤجّل على حسب السائل والسؤال, أو يلطف بعبد فيختار له ما يناسب الحال, أو يدّخر ما ينفعه عند المصير والمآل, لكن الله تعالى يجيب عبده حتماً ولا يخيّب ظنه أبداً."},{"t":"القلوب أوعية, وبعضها أوعى من بعض, فإذا سألتم الله عز وجل أيها الناس فاسألوه وأنتم موقنون بالإجابة, فإن الله لا يستجيب لعبد دعاه عن ظهر قلب غافل","s":"أخرجه الإمام أحمد عن عبد الله بن عمرو","v":2,"p":321,"d":0,"c":"شرط إجابة الدعاء صدق الإيمان والولاء. فالله حكيم في إجابته, قد يعجّل أو يؤجّل على حسب السائل والسؤال, لكن الله تعالى يجيب عبده حتماً ولا يخيّب ظنه أبداً."},{"t":"اللهم إني أعوذ بك من العجز والكسل والبخل والهرم وعذاب القبر, اللهم آتِ نفسي تقواها, وزكها أنت خير من زكاها, أنت وليها ومولاها, اللهم إني أعوذ بك من علم لا ينفع, ومن قلب لا يخشع, ومن نفس لا تشبع, ومن دعوة لا يستجاب لها","s":"أخرجه مسلم والترمذي والنسائي عن زيد بن أرقم","v":2,"p":321,"d":0,"c":"وتعدّ حالة عدم استجابة الدعاء مصيبة كبيرة."}],"10":[{"t":"الحمد لله الذي وسع سمعه الأصوات","s":"البخاري عن عائشة","v":1,"p":198,"d":0,"c":"الواسع الذي وسع سمعه جميع المسموعات, ووسع رزقه جميع المخلوقات, فله مطلق الجمال والكمال في الذات والصفات والأفعال. والله واسع لا يشغله معلوم عن معلوم ولا شأن عن شأن ولا حال عن حال."},{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":0,"c":"اركب البحر واغمس إبرة فيه وارفعها ثم انظر ماذا أخذت من ماء البحر, فهذا الذي أخذته هو الدنيا والبحر هو الآخرة, والله واسع عليم, فالإنسان مهما غني وتنعّم وقوي وانغمس في الملذات والشهوات فكل هذا لا يساوي من الآخرة مثقال ذرة."},{"t":"إنكم لا تسعون الناس بأموالكم, ولكن ليسعهم منكم بسط الوجه وحسن الخلق","s":"أخرجه الحاكم في المستدرك عن أبي هريرة","v":1,"p":209,"d":0,"c":"المال يضيق ولكن الخلق أوسع. ومن أدب التخلق بهذا الاسم أن تتسع رحمتك لكل عباد الله من كل الأجناس. إنكم لن تسعوا الناس بأموالكم فسعوهم بأخلاقكم."},{"t":"اللهم اهدِ قومي فإنهم لا يعلمون","s":"البيهقي في شعب الإيمان عن عبد الله بن عبيد","v":1,"p":209,"d":0,"c":"لكن النبي وسعت رحمته خصومه وأعداءه والذين كذّبوه وسخروا منه واستخفوا به, فمن أدب التخلق بهذا الاسم أن تتسع رحمتك لكل عباد الله من كل الأجناس."}],"6":[{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال, فأقول: يا رب أصحابي, فيقول: إنك لا تدري ما أحدثوا بعدك, فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"ما قلّ وكفى خير مما كثر وألهى","s":"رواه أحمد في مسنده من حديث أبي الدرداء","v":1,"p":132,"d":0,"c":"يعني ما يكفيه, لا ما يطغيه ولا ما يلهيه, إذ غاية كل حاجتك أن تكون صحيح البدن مكتفياً تقطن في بيت الحاجات الأساسية فيه موفورة, هذا هو الغنى. والحقيقة أن هذه الحكم مبذولة بين أيدينا, والبطولة أن تعيش هذه الحكم وتطبقها."}],"37":[{"t":"إن الله جميل يحب الجمال","s":"أخرجه مسلم وأبو داود والترمذي عن عبد الله بن مسعود","v":2,"p":112,"d":0,"c":"المجيد سبحانه وتعالى هو الذي علا وارتفع بذاته, له المجد في أسمائه وصفاته وأفعاله, ومجده بيّن في جماله جل جلاله وسعته وعلوه واستوائه على عرشه."},{"t":"حجابه النور, لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه","s":"","v":2,"p":112,"d":0,"c":"ومجده بين في جماله جل جلاله. هذا جمال الذات, أما كيفيته فأمر لا يدركه أحد, إذ عين العلم به عين الجهل به, وكل شيء خطر ببالك فالله بخلاف ذلك."},{"t":"الكرسي موضع القدمين, والعرش لا يقدر قدره","s":"رواه الحاكم والدارمي عن ابن عباس","v":2,"p":113,"d":0,"c":"ما أمجد أوصافه, فله علو لا ند له ولا نظير ولا شبيه له ولا مثيل, فالمجد وصف جامع لكل أنواع العلو التي يتصف بها المعبود, فهو العلي العظيم."},{"t":"ما السماوات السبع مع الكرسي إلا كحلقة ملقاة بأرض فلاة","s":"","v":2,"p":113,"d":0,"c":"ما أمجد أوصافه, فله علو لا ند له ولا نظير ولا شبيه له ولا مثيل, فالمجد وصف جامع لكل أنواع العلو التي يتصف بها المعبود, فهو العلي العظيم."},{"t":"... ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة...","s":"صحيح البخاري من حديث عبد الله بن عمر","v":2,"p":121,"d":0,"c":"فإذا طلب أحد المال من الله تعالى ليحل به مشكلات المسلمين نقول له: نعم الطلب طلبك, وهذا عمل من أرقى الأعمال وأرجاها عند الله تعالى."},{"t":"والله ما الدنيا في الآخرة إلا مثل ما يجعل أحدكم إصبعه هذه في اليم, فلينظر بم ترجع","s":"رواه أحمد والطبراني من حديث المستورد بن شداد","v":2,"p":123,"d":0,"c":"عطاؤه لا حدود له. فالله عز وجل أحياناً يعطي الإنسان قليلاً من الدنيا قد يختل توازنه بسببه, فكيف إذا أعطاك الله الجنة?"},{"t":"... أعددت لعبادي الصالحين ما لا عين رأت, ولا أذن سمعت, ولا خطر على قلب بشر...","s":"صحيح البخاري من حديث أبي هريرة","v":2,"p":124,"d":0,"c":"فالله يهيئ لنا ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر; إذا أكرمنا بالجنة فهناك كل ما لا يتصوره العقل, والثمن طاعته فقط."},{"t":"... يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرمًا فلا تظالموا, يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم, يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم, يا عبادي كلكم عار إلا من كسوته فاستكسوني أكسكم...","s":"صحيح مسلم من حديث أبي ذر","v":2,"p":130,"d":0,"c":"فمن عرف أن الله هو الماجد المجيد سمت همته إليه واعتمد عليه في كل الأمور. وأخلاق المؤمن نحو هذا الاسم: أن يقصد وجه الله الكريم لأنه الغني وحده, وأن يحسن للمخلوقات تأسياً بكمالات الله."}],"112":[{"t":"اللهم قني عذابك يوم تبعث عبادك","s":"رواه أحمد والترمذي والنسائي من حديث البراء بن عازب","v":4,"p":225,"d":0,"c":"إذا تحقق وأيقن أن الله سبحانه وتعالى يبعث الناس بعد الموت ثم يجزيهم بالثواب والعقاب, فعندئذ يشغل وقته كله بطاعته, والتزود للدار الآخرة وتصفح أعماله ومحاسبة نفسه حساباً دقيقاً."}],"26":[{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال, فأقول: يا رب أصحابي, فيقول: إنك لا تدري ما أحدثوا بعدك, فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":0},{"t":"ألا أنبئكم بأكبر الكبائر? - ثلاثًا - قلنا: بلى يا رسول الله, قال: الإشراك بالله, وعقوق الوالدين","s":"","v":1,"p":436,"d":0,"c":"الشهادة هي الإخبار بما شاهده المرء, شهد فلان على فلان بحق فهو شاهد وشهيد, والشاهد يلزمه أن يبين ما علمه على الحقيقة, وهو واجب يرقى إلى مستوى الفرض."},{"t":"صبرًا آل ياسر, فإن موعدكم الجنة","s":"أخرجه الأصبهاني في حلية الأولياء عن عثمان بن عفان","v":1,"p":443,"d":0,"c":"الله مع المحسن ومع الطائع ومع المستقيم ينصره ويؤيده لأنه شهيد ويشهد لنا. فما معنى أن الله شهيد? أي أن قريشاً بخيلها وقوتها وفرسانها ومؤامراتها دمرها الله عز وجل ونصر النبي. أي أنك إذا أردت أن تكون أقوى الناس فتوكل على الله."}],"23":[{"t":"كيف أنعم وقد التقم صاحب القرن القرن واستمع الإذن متى يؤمر بالنفخ فينفخ? فكأن ذلك ثقل على أصحاب رسول الله ﷺ, فقال لهم: قولوا: حسبنا الله ونعم الوكيل, على الله توكلنا","s":"الترمذي عن أبي سعيد الخدري","v":1,"p":388,"d":1},{"t":"إن الله يلوم على العجز, ولكن عليك بالكيس, فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":1},{"t":"لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير, تغدو خماصًا وتروح بطانًا","s":"","v":1,"p":393,"d":0,"c":"المهم أن تكل إليه أمرك, لا يوجد مؤمن على الإطلاق بإخلاص شديد وبصدق بالغ وكل إلى الله شأنا من شؤون حياته إلا ويتولى الله أمره."},{"t":"اللهم رحمتك أرجو, فلا تكلني إلى نفسي طرفة عين, وأصلح لي شأني كله, لا إله إلا أنت","s":"أخرجه الحاكم عن أنس بن مالك","v":1,"p":400,"d":0,"c":"نصيب المؤمن من اسم الله الوكيل: أن توقن بعلمه وبقدرته وبرحمته وبحكمته, وشرط التوكل أن تعرفه, فاجتهد أن تعرفه من أجل أن تتوكل عليه."},{"t":"إن الله يلوم على العجز","s":"أخرجه أبو داود عن عوف بن مالك","v":1,"p":401,"d":0,"c":"التوكل الحقيقي أن تأخذ بالأسباب وكأنها كل شيء, ثم تتوكل على الله وكأنها ليست بشيء."},{"t":"يا أبا بكر, ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":0,"c":"الأمر كله بيد الله. الله مهيمن, يحفظ أعظم شيء بأتفه سبب, وأحياناً يهلك إنساناً بأتفه سبب, ليظهر لك كمال قدرته عز وجل."}],"36":[{"t":"وبعث الله عز وجل الريح على المشركين فكفى الله المؤمنين القتال وكان الله قويًا عزيزًا","s":"رواه أحمد عن عائشة","v":2,"p":95,"d":0},{"t":"اعلم أبا مسعود! لله أقدر عليك منك عليه","s":"رواه الترمذي","v":2,"p":109,"d":0,"c":"وقال بعضهم: إذا دعتك قدرتك إلى ظلم الناس فتذكّر قدرة الله عليك. فإذا ظن الإنسان أنه قوي وأنه يفعل ما يريد فاستخدم هذه القوة في غير العدل فقد استوجب سخط الله عز وجل."}],"53":[{"t":"اللهم إني أعوذ بك من زوال نعمتك, وتحول عافيتك, وفجاءة نقمتك, وجميع سخطك","s":"رواه مسلم من حديث ابن عمر","v":2,"p":384,"d":0,"c":"مهما تألقت صحته فإنه مربوط بحبل متين, ففي أية لحظة يشد الله الحبل; فالإنسان إذاً في قبضة الله عز وجل. فإذا لم يكن مصطلحاً معه ومطيعاً له ومنيباً ومخلصاً فمشكلته مع الله خطيرة."},{"t":"إذا اشتكيت فضع يدك حيث تشتكي ثم قل: بسم الله, أعوذ بعزة الله وقدرته من شر ما أجد من وجعي هذا, ثم ارفع يدك, ثم أعد ذلك وترًا","s":"رواه الترمذي والحاكم من حديث أنس بن مالك","v":2,"p":390,"d":0}],"33":[{"t":"وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه...","s":"متفق عليه","v":2,"p":57,"d":0,"c":"وإذا أحبّك الله ألقى محبتك في قلوب الخلق. والإنسان يستمع إلى ملايين الموضوعات في حياته, أما المؤمن فسمعه منضبط بالمنهج الإلهي."},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":0,"c":"هذا الوضع الذي يتكرر أحياناً, يُقبل ثم يُدبر, يتألق ثم يخبو, يتحرك ثم يسكن, هذا الوضع لا يرضي الله عز وجل."},{"t":"صنائع المعروف تقي مصارع السوء","s":"رواه الطبراني وصححه الألباني","v":2,"p":178,"d":0,"c":"أما أهل الدنيا فهان أمر الله عليهم فهانوا على الله, ترى حياته تافهة عند الله لم يبال في أي أوديتها هلك, تراه يموت ميتة سيئة بشعة حقيرة; لكنّ المؤمن له عند الله شأن كبير."}],"51":[{"t":"إن آل أبي ليسوا بأوليائي, إنما وليي الله وصالح المؤمنين, ولكن لهم رحم أبلها ببلالها","s":"أخرجه أبو داود والترمذي عن أبي سعيد الخدري","v":2,"p":344,"d":0,"c":"أي أصلها بصلتها التي أمرت بها, فالولاء شيء والواجب شيء آخر. المؤمن يوالي المؤمنين ويتعاون معهم, أما أقرباؤه فلهم حق عليه يؤديه بالتمام والكمال, لكنّ قلبه مع المؤمنين."},{"t":"إذا صنع لأحدكم خادمه طعامًا ثم جاءه به وقد ولي حره ودخانه, فليقعده معه فليأكل","s":"","v":2,"p":345,"d":0,"c":"لك خادم صنع لك طعاماً, فليأكل معك, فمن تواضع النبي صلى الله عليه وسلم أنه كان يأكل مع الخادم."}],"21":[{"t":"عجبت لأمر المؤمن, إن أمره كله خير, إن أصابه ما يحب حمد الله وكان له خير, وإن أصابه ما يكره فصبر كان له خير","s":"أخرجه أحمد في مسنده","v":1,"p":350,"d":0,"c":"فالحمد من ألزم لوازم المؤمن. كان تعظم عنده النعمة مهما دقت, ولا بد من قول: الحمد لله."},{"t":"يا ابن آدم! مرضت فلم تعدني, قال: يا رب! كيف أعودك وأنت رب العالمين?! قال: أما علمت أن عبدي فلانًا مرض فلم تعده, أما علمت أنك لو عدته لوجدتني عنده","s":"حديث قدسي رواه مسلم من حديث أبي هريرة","v":1,"p":358,"d":0,"c":"أنت عندما تعطي شيئًا نفيسًا لإنسان مؤمن فقير جائع, فالله عز وجل يغنيك ويحمدك على هذا العمل. الله حميد ويحمدكم على عملكم, وهو حامد أي يحمد ذاته ويحمد خلقه إذا أعطوا وبذلوا ونصحوا وصبروا."},{"t":"يا عبادي, كلكم ضال إلا من هديته فاستهدوني أهدكم","s":"أخرجه مسلم والترمذي عن أبي ذر الغفاري","v":1,"p":361,"d":0,"c":"فما لم تتوجه إلى الله لمعرفة الحقيقة فلن تصل إليها, لأن هذه العين مهما تكن دقيقة لا قيمة لها من دون ضوء يتوسط بينك وبين المرئي, وكذلك العقل كالعين تمامًا لا قيمة له إطلاقًا دون وحي يعينك على فهم الحقيقة."},{"t":"ابن آدم! إنك إذا ذكرتني شكرتني","s":"","v":1,"p":365,"d":0,"c":"إذا علمت أن هذه النعم من الله وشكرته عليها اكتسبت نعمة جديدة, فقد شكرت الله عز وجل."}],"116":[{"t":"إن لله تسعة وتسعين اسمًا","s":"","v":4,"p":269,"d":0,"c":"يتوهم البعض أن الإحصاء هو العد, فمن عدها دخل الجنة, وهذا خطأ في فهم كلمة أحصاها... فالعد شيء والإحصاء شيء آخر... فالإحصاء يعني العلم الدقيق."},{"t":"إن لله تسعة وتسعين اسمًا, مائة إلا واحدًا, من أحصاها دخل الجنة","s":"رواه البخاري ومسلم عن أبي هريرة","v":4,"p":272,"d":0,"c":"فمعنى الإحصاء في حديث رسول الله هو العلم. وقيل: أحصاها الله أي هو المحيط بكل شيء جملة وتفصيلا لا تخفى عليه خافية لا في الأرض ولا في السماء."}],"120":[{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره, فإنه لا يدري ما خلفه عليه, ثم ليضطجع على شقه الأيمن, ثم ليقل: باسمك ربي وضعت جنبي وبك أرفعه, إن أمسكت نفسي فارحمها, وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"صحيح البخاري","v":4,"p":340,"d":0,"c":"المعنى الخامس: النوم, فالنوم موت خفيف, والموت نوم ثقيل. فأحدنا إن نام إما أن يصحو من النوم أو لا يصحو, فإذا لم يصح من نومه نسأل الله أن يرحمه, وإذا صحا من نومه نسأل الله أن يحفظه من المعاصي."}],"17":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"عش ما شئت فإنك ميت, وأحبب من شئت فإنك مفارقه, واعمل ما شئت فإنك مجزي به","s":"رواه الحاكم عن سهل بن سعد وهو حديث حسن","v":1,"p":288,"d":0,"c":"كل مخلوق يموت ولا يبقى إلا ذو العزة والجبروت. الليل مهما طال فلا بد من طلوع الفجر, والعمر مهما طال فلا بد من نزول القبر. حياتنا في الدنيا غير حقيقية, حياة مؤقتة, لأنه يعقبها موت."},{"t":"اثبت أحد, فإن عليك نبيًا وصديقًا وشهيدين","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"إن من أمنّ الناس عليّ في صحبته وماله أبا بكر, ولو كنت متخذًا خليلًا غير ربي عز وجل لاتخذت أبا بكر, ولكن أخوة الإسلام ومودته, لا يبقين في المسجد باب إلا سد إلا باب أبي بكر","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"لو كنت متخذًا من أمتي خليلًا لاتخذت أبا بكر خليلًا, ولكن أخي وصاحبي","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0,"c":"المستحق لخالص الطاعة والعبادة والإخلاص والحب هو الله, فلا أعتقد أن في الأرض رجلين تحابّا كالصديق ورسول الله, ومع ذلك لم يتخذه خليلاً. فسر السعادة أنك تعمل لوجه واحد, فترضي جهة واحدة, وتبحث عن خالق عظيم فتمحضه كل نفسك."}],"18":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي, ثم دعا: اللهم إني أسألك بأن لك الحمد, لا إله إلا أنت المنان, بديع السماوات والأرض, يا ذا الجلال والإكرام, يا حي يا قيوم, فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":0,"c":"وهذا الاسم أيضاً ورد في السنة من حديث أنس بن مالك رضي الله عنه."},{"t":"إن الأمر بالمعروف والنهي عن المنكر لا يقطع رزقًا ولا يقرب أجلًا","s":"أخرجه ابن أبي حاتم في تفسيره","v":1,"p":307,"d":0,"c":"وقال بعض العلماء: القيوم هو القائم على خلقه بآجالهم وأعمالهم وأرزاقهم."},{"t":"البر لا يبلى, والذنب لا يُنسى, والديان لا يموت","s":"أخرجه عبد الرزاق في مصنفه عن أبي قلابة مرسلًا","v":1,"p":308,"d":0},{"t":"الأمانة غنى","s":"رواه القضاعي في مسند الشهاب من حديث أنس بن مالك","v":1,"p":308,"d":0,"c":"طبعاً من معانيها الضيقة ألا يأكل الإنسان مالاً حراماً, ومن معانيها الواسعة أن تكون أميناً في عملك, أميناً في اختصاصك وأميناً في كل شيء."},{"t":"اللهم لك الحمد أنت قيّم السماوات والأرض ومن فيهن, ولك الحمد لك ملك السماوات والأرض ومن فيهن, ولك الحمد أنت نور السماوات والأرض ومن فيهن...","s":"أخرجه البخاري","v":1,"p":313,"d":0,"c":"واسم القيوم من أسماء الله الحسنى, وإذا تعمقت في اسم القيوم تركت الخلق واتجهت إلى الحق, وارتاحت نفسك من القلق ونجوت من الاضطراب."}],"38":[{"t":"لا إله إلا الله الواحد القهار, رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"يوم تبدل الأرض غير الأرض والسماوات وبرزوا لله الواحد القهار, قلت: أين الناس يومئذ? قال: على الصراط","s":"","v":2,"p":132,"d":1},{"t":"أوتروا يا أهل القرآن, فإن الله وتر يحب الوتر","s":"رواه مسلم والترمذي","v":2,"p":144,"d":0,"c":"أي يحب القلب المنفرد بمحبته تعالى, فالله لا يقبل العمل المشترك ولا القلب المشترك."},{"t":"والذي نفسي بيده لقد سأل الله باسمه الأعظم الذي إذا دعي به أجاب, وإذا سئل به أعطى","s":"رواه الترمذي وغيره","v":2,"p":144,"d":0,"c":"والحقيقة أن هذا البحث في التوحيد بحث ثمين, والتوحيد علم جليل مقتبس من اسم الله الواحد."}],"76":[{"t":"إن الله يحب معالي الأمور وأشرافها, ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":231,"d":0,"c":"والمؤمن يتعالى عن كل السفاسف. المؤمن في أفق معرفة الله, في أفق الدعوة إليه, في أفق خدمة عباده, في أفق الأعمال الصالحة, في أفق تطهير قلبه من كل دنس."}],"77":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري, وأصلح لي دنياي التي فيها معاشي, وأصلح لي آخرتي التي فيها معادي","s":"رواه مسلم عن أبي هريرة","v":3,"p":243,"d":0,"c":"وهنا يقول بعض العلماء: الله جل جلاله اختار هذا الاسم لذاته ليقصده عباده في المهمات في دنياهم وفي دينهم. نعم, هناك دنيا ضرورية للآخرة, وما ورد في الدعاء اشتمل على صلاح الدنيا والآخرة."},{"t":"أعظم النساء بركة أيسرهن مؤونة","s":"","v":3,"p":244,"d":0,"c":"تجد المؤمن مؤونته خفيفة, وحاجاته خفيفة, بل إن النبي صلى الله عليه وسلم وصف الزوجة الصالحة بأنها قليلة المؤونة; أي طلباتها قليلة تقنع بالقليل."}],"4":[{"t":"لا إله إلا الله وحده لا شريك له, له الملك وله الحمد وهو على كل شيء قدير, اللهم لا مانع لما أعطيت, ولا معطي لما منعت, ولا ينفع ذا الجد منك الجد","s":"رواه البخاري ومسلم عن المغيرة بن شعبة","v":1,"p":97,"d":0},{"t":"الكبرياء ردائي, والعظمة إزاري, فمن نازعني منهما شيئًا أذقته عذابي","s":"أخرجه أحمد وأبو داود وابن ماجه عن أبي هريرة; وابن ماجه عن ابن عباس","v":1,"p":101,"d":0,"c":"إن أمة قوية خططت لبناء مجدها على أنقاض الشعوب وإذلالها, إن هذه القوة الغاشمة نجاح خططها على المدى البعيد يتناقض مع وجود الله."},{"t":"ولكل شيء حقيقة, وما بلغ العبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه, وما أخطأه لم يكن ليصيبه","s":"أخرجه أحمد والطبراني عن أبي الدرداء","v":1,"p":102,"d":0,"c":"القدر هو الفعل والمقدور هو العلم, والله عز وجل عليم قدير. يعلم أن فلانًا من الناس مستقيم فيقدر له توفيقًا, ويطلع على إنسان كاذب فيقدر له علاجًا; فمجمل القضاء والقدر أن الله يعلم ويقدّر لهذا الإنسان ما يناسبه."},{"t":"ولكل شيء حقيقة, وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه, وما أخطأه لم يكن ليصيبه","s":"أخرجه الطبراني عن أبي الدرداء","v":3,"p":478,"d":0,"c":"فالحكم الكوني واقع لا محالة, فكل شيء وقع أراده الله, وكل شيء أراده الله وقع, وإرادة الله متعلقة بالحكمة المطلقة, والحكمة المطلقة متعلقة بالخير المطلق."}],"71":[{"t":"يا رسول الله! كيف يحشر أهل النار على وجوههم? قال: إن الذي أمشاهم على أقدامهم قادر أن يمشيهم على وجوههم","s":"أحمد عن أنس بن مالك","v":3,"p":151,"d":0},{"t":"إن الله لا يقدس أمة لا يأخذ الضعيف حقه من القوي","s":"أخرجه الحاكم عن أبي سفيان بن الحارث بن عبد المطلب","v":3,"p":160,"d":0,"c":"ومن عرف القادر جل جلاله فإنه لا يخنع ولا يستسلم, هو متواضع لله لكن لا يضعف أمام خصمه. يمكن أن نمر بأزمات طاحنة ونبقى أمة قوية, أما إذا ذهب الحق والعدل فقد انتهينا عند الله."}],"55":[{"t":"أما إنك لو لم تفعل للفحتك النار أو لمستك النار","s":"صحيح مسلم","v":2,"p":421,"d":0,"c":"من أدب المؤمن مع ربه المقتدر أن يستحضر قدرة الله دائمًا أمامه. فعندما يتحرك الإنسان ويعلم دائمًا أن الله على كل شيء قدير يكون في حركته رحمة."},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك, وأسألك من فضلك العظيم, فإنك تقدر ولا أقدر, وتعلم ولا أعلم, وأنت علام الغيوب","s":"","v":2,"p":422,"d":0,"c":"أي: أستعين بقدرتك على تحقيق هذا الأمر, وأطلب منك أن تجعل لي يا رب قدرة على المطلوب لأني ضعيف; فالإنسان ضعيف والله هو القدير."},{"t":"فلا تقل: لو أني فعلت لكان كذا وكذا, ولكن قل: قدر الله وما شاء فعل, فإن لو تفتح عمل الشيطان","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":423,"d":0,"c":"وقد علمنا النبي موقف الموحد فيما وقع ومضى من الأحداث. آخر كلمة في اسم المقتدر: إن عرفت قدرته وقدره خضعت له واستعنت به واعتمدت عليه وتوكلت عليه فأصبحت أقوى الأقوياء."}],"82":[{"t":"من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن أبي هريرة","v":3,"p":292,"d":0,"c":"المقدَّم: كل ما قدمت أيها الإنسان من خير أو شر وتقدمت لفلان فيه. والعمل الصالح الذي قدمته ابتغاء وجه الله هو قدم."},{"t":"إن الله يحب معالي الأمور وأشرافها ويكره سفسافها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":293,"d":0,"c":"أما التقديم الشرعي فهذا متعلق بمحبة الله لفعل دون فعل. فالله قدّم في محبته معالي الأمور, فالله تعالى أحب أعمالًا فقدمها في الثواب, وأبغض أعمالًا فأخرها في الثواب."},{"t":"إن الله وملائكته يصلون على الصف المقدم, والمؤذن يغفر له مدى صوته ويصدقه من سمعه من رطب ويابس, وله مثل أجر من صلى معه","s":"أخرجه النسائي عن البراء بن عازب","v":3,"p":294,"d":0,"c":"فالله تعالى أحب أعمالًا فقدّمها في الثواب, وأبغض أعمالًا فأخّرها في الثواب. فالمقدِّم هو الله جل جلاله الذي يقدّم الأشياء ويضعها في مواضعها على مقتضى حكمته وعلى مقتضى الاستحقاق."},{"t":"لو كنت متخذًا خليلًا لاتخذت أبا بكر خليلًا... ولكن أخوة الإسلام, لا تبقين في المسجد خوخة إلا خوخة أبي بكر","s":"متفق عليه من حديث أبي سعيد الخدري","v":3,"p":300,"d":0,"c":"فالله قدّمه; ما أخذ رسول الله من أحد ماله كله إلا أبا بكر. الله قدّمهما, وفي كل مجتمع مقدَّم ومؤخَّر."}],"83":[{"t":"اللهم ربنا لك الحمد, أنت قيّم السماوات والأرض ومن فيهن","s":"","v":3,"p":307,"d":0,"c":"المؤخر عكس المقدم, فالله جل جلاله هو المؤخر أي هو الذي يؤخر الأشياء فيضعها في مواضعها, إما تأخيراً كونياً أو تأخيراً شرعياً."},{"t":"فمن لم يأت الدعوة فقد عصى الله ورسوله","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":312,"d":0,"c":"إذاً المؤمن يقدم أهل الإيمان ودعوة أهل الإيمان. وأنت عندما تتخلق بكمالات الله تقدم المؤمن وتجله, وإذا وجدت فاسقاً أو فاجراً تؤخره, وتأخيرك إياه له معنى ردع له وتحجيم لحاله."},{"t":"إذا دعي أحدكم فليجب, فإن كان صائمًا فليصل, وإن كان مفطرًا فليطعم","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":313,"d":0,"c":"إذاً المؤمن يقدم أهل الإيمان ودعوة أهل الإيمان. فأنت عندما تتخلق بكمالات الله تقدم المؤمن وتجله, وإذا وجدت فاسقاً أو فاجراً تؤخره."},{"t":"إن الملائكة تضع أجنحتها لطالب العلم","s":"","v":3,"p":313,"d":0,"c":"فأنت عندما تقدّم أهل الإيمان تنعشهم. وأنت عندما تتخلق بكمالات الله تقدّم المؤمن وتجلّه, وإذا وجدت فاسقاً أو فاجراً تؤخره, وتأخيرك إياه له معنى ردع له وتحجيم لحاله."},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":3,"p":315,"d":0,"c":"لا تخضع لكافر, لا تقبل منه عطاء أو نحوه كأن يقوم بإيصالك بمركبته ويستعلي عليك, فأنت عزيز. وإذا كان إنساناً منحرفاً متفلتاً يمنّ عليك ويتفضل عليك فلا تقبل منه شيئاً."},{"t":"رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله وما أنت أعلم به مني, اللهم اغفر لي خطاياي وعمدي وجهلي وهزلي وكل ذلك عندي, اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"صحيح البخاري من حديث أبي موسى الأشعري","v":3,"p":318,"d":0,"c":"فالبطولة أن تقدم ما قدمه الله, وأن تؤخر ما أخره الله, وأن ترعى حق الله وحق الناس, وأن تأتي مقاييسك متوافقة مع مقاييس القرآن الكريم, عندئذ تكون قد استفدت من اسمي المقدّم والمؤخّر."}],"57":[{"t":"اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم, ربنا ورب كل شيء, فالق الحب والنوى, ومنزل التوراة والإنجيل والفرقان, أعوذ بك من شر كل شيء أنت آخذ بناصيته, اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"كان الله ولم يكن شيء غيره","s":"","v":2,"p":435,"d":0,"c":"من معاني هذا الاسم أنك مهما أوغلت في النهاية فإنك ستصل إلى الله, فالله وراء كل شيء وسبب كل مسبَّب. إذا تحركت نحو الوراء بسلسلة الأسباب وجب قطعاً أن تنتهي إلى الله, هو الأول."},{"t":"كان الله ولم يكن شيء غيره, وكان عرشه على الماء, وكتب في الذكر كل شيء, وخلق السماوات والأرض","s":"رواه البخاري","v":2,"p":436,"d":0,"c":"كان الله ولم يكن معه شيء, وسيدنا علي سُئل: متى كان الله? فأجاب: ومتى لم يكن. هو الأول بكل ما سواه, المتقدم على كل ما عداه, فكل ما سوى الله يأتي بعد الله."},{"t":"بعثت أنا والساعة هكذا - وقرن بين السبابة والوسطى","s":"صحيح البخاري","v":2,"p":441,"d":0,"c":"لو انتهت الحياة الدنيا فماذا بعد الحياة الدنيا? الله, هو الأول والآخر, لو تحركت نحو الماضي فالله هو الأول, ونحو المستقبل فالله هو الآخر."}],"58":[{"t":"اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم, ربنا ورب كل شيء, فالق الحب والنوى, ومنزل التوراة والإنجيل والفرقان, أعوذ بك من شر كل شيء أنت آخذ بناصيته, اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1}],"59":[{"t":"اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي ه
