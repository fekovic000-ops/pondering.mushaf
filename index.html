ُضِيئًا."],[40,62,"تُؤْفَكُونَ","كَيْفَ تُصْرَفُونَ عَنِ الإِيمَانِ بِهِ؟!"],[40,63,"يُؤْفَكُ","يُصْرَفُ."],[40,64,"فَتَبَارَكَ","تَكَاثَرَ خَيْرُهُ وَفَضْلُهُ."],[40,66,"أَنْ أُسْلِمَ","أَنْ أَخْضَعَ وَأَنْقَادَ بِالطَّاعَةِ."],[40,67,"عَلَقَةٍ","الدَّمِ الغَلِيظِ؛ المُتَعَلِّقِ بِجِدَارِ الرَّحِمِ، وَهُوَ أَحَدُ أَطْوَارِ الجَنِينِ."],[40,67,"لِتَبْلُغُوٓا۟ أَشُدَّكُمْ","لِتَتَكَامَلَ قُوَّتُكُمْ."],[40,67,"أَجَلًا مُّسَمًّى","مُدَّةً مُقَدَّرَةً تَنْتَهِي بِهَا أَعْمَارُكُمْ."],[40,69,"يُصْرَفُونَ","كَيْفَ يَعْدِلُونَ عَنْهَا مَعَ صِحَّتِهَا؟!"],[40,70,"بِٱلْكِتَٰبِ","بِالقُرْآنِ."],[40,71,"وَٱلسَّلَٰسِلُ","القُيُودُ فِي الأَرْجُلِ."],[40,72,"ٱلْحَمِيمِ","المَاءِ الَّذِي بَلَغَ غَايَةَ الحَرَارَةِ."],[40,72,"يُسْجَرُونَ","يُوقَدُ عَلَيْهِمْ."],[40,74,"ضَلُّوا۟ عَنَّا","غَابُوا عَنْ عُيُونِنَا."],[40,75,"تَمْرَحُونَ","تَتَوَسَّعُونَ فِي الفَرَحِ أَشَرًا وَبَطَرًا."],[40,76,"مَثْوَى","مَأْوَى، وَمَسْكَنُ."],[40,78,"قُضِىَ بِٱلْحَقِّ","حُكِمَ بِالعَدْلِ بَيْنَ الرُّسُلِ، وَمُكَذِّبِيهِمْ."],[40,80,"حَاجَةً فِى صُدُورِكُمْ","أَمْرًا ذَا بَالٍ تَهْتَمُّونَ بِهِ."],[40,82,"فَمَآ أَغْنَىٰ عَنْهُم","فَمَا دَفَعَ عَنْهُمْ."],[40,83,"مِّنَ ٱلْعِلْمِ","العِلْمِ بِالدُّنْيَا، وَبِمَا عِنْدَهُمْ مِنَ الأَبَاطِيلِ الَّتِي يَظُنُّونَهَا عِلْمًا."],[40,83,"وَحَاقَ","نَزَلَ وَأَحَاطَ."],[40,84,"بَأْسَنَا","عَذَابَنَا."],[40,85,"يَكُ","يَكُنْ."],[40,85,"سُنَّتَ ٱللَّهِ","طَرِيقَتَهُ فِي عَدَمِ قَبُولِ تَوْبَةِ مَنْ عَايَنَ العَذَابَ."],[40,85,"خَلَتْ","مَضَتْ."],[41,3,"فُصِّلَتْ","بُيِّنَتْ آيَاتُهُ، وَوُضِّحَتْ مَعَانِيهِ."],[41,5,"أَكِنَّةٍ","أَغْطِيَةٍ مَانِعَةٍ مِنْ فَهْمِ مَا تَدْعُونَا إِلَيْهِ."],[41,5,"وَقْرٌ","صَمَمٌ، وَثِقَلٌ."],[41,6,"فَٱسْتَقِيمُوٓا۟ إِلَيْهِ","اسْلُكُوا الطَّرِيقَ المُوصِلَ إِلَيْهِ."],[41,6,"وَوَيْلٌ","هَلَاكٌ، وَعَذَابٌ."],[41,8,"غَيْرُ مَمْنُونٍ","غَيْرُ مَقْطُوعٍ، وَلَا مَمْنُوعٍ."],[41,9,"أَندَادًا","شُرَكَاءَ، وَنُظَرَاءَ."],[41,10,"رَوَٰسِىَ","جِبَالًا ثَوَابِتَ."],[41,10,"أَقْوَٰتَهَا","أَرْزَاقَ أَهْلِهَا."],[41,10,"فِىٓ أَرْبَعَةِ أَيَّامٍ","يَوْمَانِ لِخَلْقِ الأَرْضِ، وَيَوْمَانِ لِخَلْقِ الرَّوَاسِي، وَتَقْدِيرِ الأَقْوَاتِ."],[41,10,"سَوَآءً","فِي تَمَامِ أَرْبَعَةِ أَيَّامٍ مُسْتَوِيَةٍ؛ بِلَا زِيَادَةٍ، وَلَا نُقْصَانٍ."],[41,11,"ٱسْتَوَىٰٓ","قَصَدَ."],[41,12,"فَقَضَىٰهُنَّ","فَخَلَقَهُنَّ، وَأَبْدَعَهُنَّ."],[41,12,"بِمَصَٰبِيحَ","بِنُجُومٍ مُضِيئَةٍ."],[41,12,"وَحِفْظًا","حَرَسًا مِنَ الشَّيَاطِينِ."],[41,13,"أَنذَرْتُكُمْ","خَوَّفْتُكُمْ."],[41,13,"صَٰعِقَةً","عَذَابًا هَائِلًا."],[41,16,"صَرْصَرًا","شَدِيدَةَ البُرُودَةِ، عَالِيَةَ الصَّوْتِ."],[41,16,"نَّحِسَاتٍ","مَشْؤُومَاتٍ."],[41,16,"ٱلْخِزْىِ","الذُّلُّ وَالهَوَانُ."],[41,17,"فَهَدَيْنَٰهُمْ","فَبَيَّنَّا لَهُمْ سَبِيلَ الحَقِّ."],[41,17,"فَٱسْتَحَبُّوا۟","فَاخْتَارُوا."],[41,17,"ٱلْهُونِ","المُهِينِ."],[41,19,"يُوزَعُونَ","يُرَدُّ أَوَّلُهُمْ عَلَى آخِرِهِمْ."],[41,22,"تَسْتَتِرُونَ","تَسْتَخْفُونَ عِنْدَ ارْتِكَابِكُمُ المَعَاصِيَ."],[41,22,"يَشْهَدَ","خَوْفًا مِنْ أَنْ يَشْهَدَ."],[41,23,"أَرْدَىٰكُمْ","أَهْلَكَكُمْ."],[41,24,"مَثْوًى","مَأْوًى وَمَسْكَنٌ."],[41,24,"يَسْتَعْتِبُوا۟","يَطْلُبُوا العُتْبَى وَهِيَ المَغْفِرَةُ."],[41,24,"ٱلْمُعْتَبِينَ","مَا هُمْ مِنَ المُجَابِينَ إِلَى مَا طَلَبُوا."],[41,25,"وَقَيَّضْنَا","هَيَّأْنَا."],[41,25,"قُرَنَآءَ","مُصَاحِبِينَ مِنْ شَيَاطِينِ الإِنْسِ وَالجِنِّ."],[41,25,"وَحَقَّ عَلَيْهِمُ ٱلْقَوْلُ","وَجَبَ عَلَيْهِمُ الوَعِيدُ بِالعَذَابِ."],[41,25,"خَلَتْ","مَضَتْ."],[41,26,"وَٱلْغَوْا۟ فِيهِ","ائْتُوا بِاللَّغْوِ؛ مِنَ الصَّفِيرِ، وَالصِّيَاحِ، وَالجَلَبَةِ، عِنْدَ قِرَاءَتِهِ."],[41,29,"ٱلْأَسْفَلِينَ","فِي الدَّرْكِ الأَسْفَلِ مِنَ النَّارِ."],[41,30,"ٱسْتَقَٰمُوا۟","ثَبَتُوا عَلَى الحَقِّ عِلْمًا، وَعَمَلًا."],[41,30,"تَتَنَزَّلُ عَلَيْهِمُ","تَنْزِلُ عِنْدَ المَوْتِ."],[41,31,"أَوْلِيَآؤُكُمْ","أَنْصَارُكُمْ."],[41,31,"تَدَّعُونَ","تَطْلُبُونَ."],[41,32,"نُزُلًا","ضِيَافَةً، وَإِنْعَامًا."],[41,33,"أَحْسَنُ","لَا أَحَدَ أَفْضَلُ."],[41,34,"وَلِىٌّ حَمِيمٌ","قَرِيبٌ لَكَ، شَفِيقٌ عَلَيْكَ."],[41,35,"يُلَقَّىٰهَآ","مَا يُوَفَّقُ لَهَا."],[41,35,"حَظٍّ عَظِيمٍ","صَاحِبُ نَصِيبٍ وَافِرٍ؛ مِنَ السَّعَادَةِ، وَالخُلُقِ، وَالخَيْرِ."],[41,36,"يَنزَغَنَّكَ","يُلْقِيَنَّ فِي نَفْسِكَ وَسْوَسَةً، وَيَصْرِفَنَّكَ عَنِ الخَيْرِ."],[41,36,"فَٱسْتَعِذْ بِٱللَّهِ","اسْتَجِرْ، وَاعْتَصِمْ بِاللهِ قَائِلًا: أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ."],[41,38,"يَسْـَٔمُونَ","لَا يَفْتُرُونَ، وَلَا يَمَلُّونَ."],[41,39,"خَٰشِعَةً","يَابِسَةً لَا نَبَاتَ فِيهَا."],[41,39,"ٱهْتَزَّتْ","دَبَّتْ فِيهَا الحَيَاةُ، وَتَحَرَّكَتْ بِالنَّبَاتِ."],[41,39,"وَرَبَتْ","انْتَفَخَتْ، وَعَلَتْ."],[41,40,"يُلْحِدُونَ","يَمِيلُونَ عَنِ الحَقِّ."],[41,41,"بِٱلذِّكْرِ","بِالقُرْآنِ."],[41,41,"عَزِيزٌ","مُمْتَنِعٌ عَلَى كُلِّ مَنْ أَرَادَهُ بِتَحْرِيفٍ، أَوْ سُوءٍ."],[41,41,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِٱلذِّكْرِ","إِنَّ الجَاحِدِينَ بِالقُرْآنِ، وَالخَبَرُ مَحْذُوفٌ، تَقْدِيرُهُ: هَالِكُونَ."],[41,42,"لَّا يَأْتِيهِ ٱلْبَٰطِلُ","لَا يَقْرَبُهُ شَيْطَانٌ، وَلَا يُبْطِلُهُ شَيْءٌ؛ مَحْفُوظٌ مِنْ كُلِّ زِيَادَةٍ، وَنَقْصٍ، وَتَحْرِيفٍ."],[41,42,"مِنۢ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِۦ","فِي أَيِّ نَاحِيَةٍ مِنْ نَوَاحِيهِ."],[41,44,"أَعْجَمِيًّا","غَيْرَ عَرَبِيٍّ."],[41,44,"لَوْلَا فُصِّلَتْ","هَلَّا بُيِّنَتْ آيَاتُهُ؟!"],[41,44,"ءَا۬عْجَمِىٌّ وَعَرَبِىٌّ","لَقَالُوا: كَيْفَ يَكُونُ القُرْآنُ أَعْجَمِيًّا، وَلِسَانُ الَّذِي أُنْزِلَ عَلَيْهِ القُرْآنُ عَرَبِيًّا؟!"],[41,44,"وَقْرٌ","صَمَمٌ."],[41,44,"يُنَادَوْنَ","كَمَنْ يُنَادَى."],[41,44,"مِن مَّكَانٍۭ بَعِيدٍ","فَلَا يَسْمَعُ دَاعِيًا، وَلَا يُجِيبُ مُنَادِيًا."],[41,45,"كَلِمَةٌ","بِتَأْجِيلِ العَذَابِ."],[41,45,"مُرِيبٍ","شَدِيدِ الرِّيبَةِ مُقْلِقٍ."],[41,47,"أَكْمَامِهَا","أَوْعِيَتِهَا."],[41,47,"ءَاذَنَّٰكَ","أَعْلَمْنَاكَ."],[41,48,"وَضَلَّ","ذَهَبَ، وَغَابَ."],[41,48,"وَظَنُّوا۟","أَيْقَنُوا."],[41,48,"مَّحِيصٍ","مَلْجَإٍ، وَمَهْرَبٍ."],[41,49,"يَسْـَٔمُ","لَا يَمَلُّ."],[41,49,"دُعَآءِ ٱلْخَيْرِ","طَلَبِ الزِّيَادَةِ فِي الدُّنْيَا."],[41,49,"ٱلشَّرُّ","الفَقْرُ، وَالمَرَضُ، وَالخَوْفُ."],[41,50,"وَمَآ أَظُنُّ","مَا أَعْتَقِدُ."],[41,50,"غَلِيظٍ","شَدِيدٍ."],[41,51,"وَنَـَٔا بِجَانِبِهِۦ","تَبَاعَدَ عَنْ شُكْرِ النِّعْمَةِ، وَاتِّبَاعِ الحَقِّ؛ تَكَبُّرًا."],[41,51,"فَذُو دُعَآءٍ عَرِيضٍ","صَاحِبُ دُعَاءٍ بِكَشْفِ الضُّرِّ كَثِيرٍ."],[41,52,"أَرَءَيْتُمْ","أَخْبِرُونِي."],[41,52,"مَنْ أَضَلُّ","لَا أَحَدَ أَضَلُّ."],[41,52,"شِقَاقٍۭ بَعِيدٍ","خِلَافٍ بَعِيدٍ عَنِ الحَقِّ."],[41,53,"ٱلْـَٔافَاقِ","أَقْطَارِ السَّمَوَاتِ، وَالأَرْضِ."],[41,53,"أَنَّهُ ٱلْحَقُّ","أَنَّ القُرْآنَ حَقٌّ لَا رَيْبَ فِيهِ."],[41,53,"أَوَلَمْ يَكْفِ بِرَبِّكَ","أَلَا يَكْفِيهِمْ دَلَالَةً عَلَى أَنَّ القُرْآنَ حَقٌّ: شَهَادَةُ اللهِ لَهُ بِذَلِكَ؟!"],[41,54,"مِّرْيَةٍ","شَكٍّ عَظِيمٍ."],[42,5,"يَتَفَطَّرْنَ","يَتَشَقَّقْنَ."],[42,6,"أَوْلِيَآءَ","آلِهَةً يَتَوَلَّوْنَهَا، وَيَعْبُدُونَهَا."],[42,6,"حَفِيظٌ","رَقِيبٌ عَتِيدٌ."],[42,7,"أُمَّ ٱلْقُرَىٰ","مَكَّةَ؛ وَالمُرَادُ أَهْلُهَا."],[42,7,"لَّا رَيْبَ فِيهِ","لَا شَكَّ فِي مَجِيئِهِ."],[42,8,"أُمَّةً وَٰحِدَةً","مُجْتَمِعِينَ عَلَى الهُدَى."],[42,10,"أُنِيبُ","إِلَيْهِ أَرْجِعُ فِي كُلِّ الأُمُورِ."],[42,11,"فَاطِرُ","خَالِقُ، وَمُبْدِعُ."],[42,11,"أَزْوَٰجًا","أَنْوَاعًا؛ ذُكُورًا، وَإِنَاثًا."],[42,11,"يَذْرَؤُكُمْ فِيهِ","يُكَثِّرُكُمْ؛ بِسَبَبِ التَّزْوِيجِ."],[42,12,"مَقَالِيدُ ٱلسَّمَٰوَٰتِ","مِلْكُهَا، وَمَفَاتِيحُ خَزَائِنِهَا."],[42,12,"يَبْسُطُ","يُوَسِّعُ."],[42,12,"وَيَقْدِرُ","يُضَيِّقُ."],[42,13,"كَبُرَ","عَظُمَ."],[42,13,"يَجْتَبِىٓ إِلَيْهِ","يَصْطَفِي لِتَوْحِيدِهِ، وَدِينِهِ."],[42,13,"يُنِيبُ","يَرْجِعُ إِلَيْهِ بِالطَّاعَةِ."],[42,14,"بَغْيًۢا","عِنَادًا، وَظُلْمًا."],[42,14,"كَلِمَةٌ سَبَقَتْ","بِتَأْخِيرِ العَذَابِ."],[42,14,"ٱلْكِتَٰبَ","التَّوْرَاةَ، وَالإِنْجِيلَ."],[42,14,"مُرِيبٍ","مُوقِعٍ فِي الرِّيبَةِ، وَالاخْتِلَافِ المَذْمُومِ."],[42,15,"فَلِذَٰلِكَ فَٱدْعُ","قُمْ بِالدَّعْوَةِ إِلَى ذَلِكَ الدِّينِ."],[42,15,"لَا حُجَّةَ بَيْنَنَا وَبَيْنَكُمُ","لَا جِدَالَ بَيْنَنَا وَبَيْنَكُمْ؛ بَعْدَمَا تَبَيَّنَ الحَقُّ."],[42,15,"ٱلْمَصِيرُ","المَرْجِعُ."],[42,16,"يُحَآجُّونَ فِى ٱللَّهِ","يُخَاصِمُونَ فِي دِينِ اللهِ."],[42,16,"دَاحِضَةٌ","ذَاهِبَةٌ بَاطِلَةٌ."],[42,17,"بِٱلْحَقِّ","بِالصِّدْقِ."],[42,17,"وَٱلْمِيزَانَ","العَدْلَ."],[42,18,"مُشْفِقُونَ مِنْهَا","خَائِفُونَ مِنْ قِيَامِهَا."],[42,18,"يُمَارُونَ","يُجَادِلُونَ."],[42,20,"حَرْثَ ٱلْـَٔاخِرَةِ","ثَوَابَهَا."],[42,21,"كَلِمَةُ ٱلْفَصْلِ","قَضَاؤُهُ بِإِمْهَالِهِمْ وَعَدَمِ مُعَاجَلَتِهِمْ بِالعُقُوبَةِ."],[42,23,"إِلَّا ٱلْمَوَدَّةَ فِى ٱلْقُرْبَىٰ","لَا تُؤْذُونِي فِي تَبْلِيغِ الدَّعْوَةِ؛ لِمَا بَيْنِي وَبَيْنَكُمْ مِنَ القَرَابَةِ."],[42,23,"يَقْتَرِفْ حَسَنَةً","يَكْتَسِبْ طَاعَةً."],[42,24,"ٱفْتَرَىٰ","اخْتَلَقَ."],[42,24,"يَخْتِمْ","يَطْبَعْ."],[42,27,"لَبَغَوْا۟","لَطَغَوْا وَتَجَبَّرُوا."],[42,28,"قَنَطُوا۟","يَئِسُوا مِنْ نُزُولِهِ."],[42,28,"وَيَنشُرُ رَحْمَتَهُۥ","يَبْسُطُ مَطَرَهُ."],[42,28,"ٱلْوَلِىُّ","الَّذِي يَتَوَلَّى عِبَادَهُ بِإِحْسَانِهِ."],[42,29,"بَثَّ","فَرَّقَ، وَنَشَرَ."],[42,29,"دَآبَّةٍ","مَا يَدِبُّ عَلَى الأَرْضِ؛ مِنْ إِنْسٍ، وَحَيَوَانٍ، وَغَيْرِهِمَا."],[42,31,"بِمُعْجِزِينَ","بِفَائِتِينَ مِنَ العَذَابِ."],[42,32,"ٱلْجَوَارِ","السُّفُنُ الجَارِيَةُ."],[42,32,"كَٱلْأَعْلَٰمِ","كَالجِبَالِ فِي عِظَمِهَا."],[42,33,"فَيَظْلَلْنَ","يَصِرْنَ وَيَبْقَيْنَ."],[42,33,"رَوَاكِدَ","ثَوَابِتَ لَا تَجْرِي."],[42,34,"يُوبِقْهُنَّ","يُهْلِكِ السُّفُنَ بِالغَرَقِ."],[42,35,"مَّحِيصٍ","مَهْرَبٍ، وَمَلْجَإٍ."],[42,37,"وَٱلْفَوَٰحِشَ","مَا عَظُمَ قُبْحُهُ مِنَ المَعَاصِي."],[42,39,"ٱلْبَغْىُ","الظُّلْمُ، وَالعُدْوَانُ."],[42,39,"يَنتَصِرُونَ","يَنْتَقِمُونَ مِمَّنْ بَغَى عَلَيْهِمْ؛ لِشَجَاعَتِهِمْ، وَلَا يَعْتَدُونَ."],[42,40,"وَأَصْلَحَ","وَضَعَ عَفْوَهُ فِيمَنْ يُصْلِحُهُ العَفْوُ."],[42,41,"سَبِيلٍ","مُؤَاخَذَةٍ."],[42,42,"ٱلسَّبِيلُ","المُؤَاخَذَةُ."],[42,42,"وَيَبْغُونَ","يَعْتَدُونَ."],[42,43,"عَزْمِ ٱلْأُمُورِ","الأَفْعَالِ الحَمِيدَةِ، وَالخِصَالِ المَشْكُورَةِ."],[42,44,"يُضْلِلِ ٱللَّهُ","يَصْرِفْهُ عَنِ الهُدَى."],[42,44,"مَرَدٍّ","مَرْجِعٍ إِلَى الدُّنْيَا."],[42,44,"سَبِيلٍ","طَرِيقٍ."],[42,45,"خَٰشِعِينَ","خَاضِعِينَ مُتَضَائِلِينَ."],[42,45,"يَنظُرُونَ مِن طَرْفٍ خَفِىٍّ","يُسَارِقُونَ النَّظَرَ، وَلَا يَنْظُرُونَ بِمِلْءِ أَعْيُنِهِمْ."],[42,46,"فَمَا لَهُۥ مِن سَبِيلٍ","مَا لَهُ مِنْ طَرِيقٍ يَصِلُ بِهِ إِلَى الحَقِّ فِي الدُّنْيَا."],[42,47,"لَّا مَرَدَّ لَهُۥ","لَا يُمْكِنُ رَدُّهُ."],[42,47,"نَّكِيرٍ","لَا تُنْكِرُونَ ذُنُوبَكُمْ، وَلَيْسَ لَكُمْ مَكَانٌ تَسْتَخْفُونَ وَتَتَنَكَّرُونَ فِيهِ."],[42,48,"حَفِيظًا","حَافِظًا لِأَعْمَالِهِمْ."],[42,48,"كَفُورٌ","جَحُودٌ؛ يُعَدِّدُ المَصَائِبَ، وَيَنْسَى النِّعَمَ."],[42,50,"يُزَوِّجُهُمْ","يَجْمَعُ لَهُ النَّوْعَيْنِ."],[42,50,"عَقِيمًا","لَا يُولَدُ لَهُ."],[42,51,"وَحْيًا","إِعْلَامًا فِي المَنَامِ، أَوْ بِالإِلْهَامِ."],[42,51,"مِن وَرَآئِ حِجَابٍ","كَمَا كَلَّمَ مُوسَى عليه السلام."],[42,51,"رَسُولًا","هُوَ: جِبْرِيلُ عليه السلام."],[42,52,"رُوحًا","قُرْآنًا، سُمِّيَ القُرْآنُ رُوحًا؛ لِأَنَّهُ حَيَاةُ القُلُوبِ."],[42,52,"صِرَٰطٍ مُّسْتَقِيمٍ","هُوَ: الإِسْلَامُ."],[42,53,"تَصِيرُ","تَرْجِعُ إِلَيْهِ، فَيُجَازِيكُمْ عَلَيْهَا."],[43,4,"أُمِّ ٱلْكِتَٰبِ","اللَّوْحِ المَحْفُوظِ."],[43,4,"لَعَلِىٌّ","رَفِيعُ الشَّأْنِ."],[43,4,"حَكِيمٌ","مُحْكَمٌ، وَذُو حِكْمَةٍ بَالِغَةٍ."],[43,5,"أَفَنَضْرِبُ عَنكُمُ ٱلذِّكْرَ صَفْحًا","أَفَنُعْرِضُ عَنْكُمْ، وَنَتْرُكُ تَذْكِيرَكُمْ بِالقُرْآنِ؟!"],[43,5,"أَن كُنتُمْ","بِسَبَبِ أَنْ كُنْتُمْ."],[43,6,"وَكَمْ أَرْسَلْنَا","كَثِيرًا مِنَ الأَنْبِيَاءِ أَرْسَلْنَا."],[43,8,"بَطْشًا","قُوَّةً."],[43,8,"وَمَضَىٰ مَثَلُ ٱلْأَوَّلِينَ","سَبَقَ فِي القُرْآنِ أَحَادِيثُ إِهْلَاكِهِمْ."],[43,10,"مَهْدًا","فِرَاشًا مُمَهَّدًا."],[43,10,"سُبُلًا","طُرُقًا لِمَعَاشِكُمْ تَسْلُكُونَهَا."],[43,11,"بِقَدَرٍ","بِمِقْدَارٍ، وَوَزْنٍ مَعْلُومٍ."],[43,11,"فَأَنشَرْنَا","أَحْيَيْنَا."],[43,11,"مَّيْتًا","مُقْفِرَةً مِنَ النَّبَاتِ."],[43,12,"ٱلْأَزْوَٰجَ","الأَصْنَافَ؛ مِنْ نَبَاتٍ، وَحَيَوَانٍ."],[43,12,"ٱلْفُلْكِ","السُّفُنِ."],[43,13,"مُقْرِنِينَ","مُطِيقِينَ."],[43,15,"جُزْءًا","نَصِيبًا."],[43,15,"لَكَفُورٌ","لَجَحُودٌ لِنِعَمِ رَبِّهِ."],[43,16,"وَأَصْفَىٰكُم","خَصَّكُمْ."],[43,17,"بِمَا ضَرَبَ لِلرَّحْمَٰنِ مَثَلًا","بِالأُنْثَى الَّتِي نَسَبَهَا لِلرَّحْمَٰنِ؛ حِينَ زَعَمَ أَنَّ المَلَائِكَةَ بَنَاتُ اللهِ."],[43,17,"ظَلَّ","صَارَ."],[43,17,"كَظِيمٌ","مُمْتَلِئٌ حُزْنًا، وَغَمًّا."],[43,18,"يُنَشَّؤُا۟","يُرَبَّى."],[43,18,"ٱلْحِلْيَةِ","الزِّينَةِ."],[43,18,"ٱلْخِصَامِ","الجِدَالِ."],[43,18,"مُبِينٍ","غَيْرُ وَاضِحٍ، وَبَيِّنٍ."],[43,20,"يَخْرُصُونَ","يَتَقَوَّلُونَ عَلَى اللهِ الكَذِبَ."],[43,22,"أُمَّةٍ","طَرِيقَةٍ، وَدِينٍ."],[43,26,"بَرَآءٌ","بَرِيءٌ."],[43,27,"فَطَرَنِى","خَلَقَنِي."],[43,28,"كَلِمَةًۢ بَاقِيَةً","أَيْ: لَا إِلَهَ إِلَّا اللهُ: بَاقِيَةً."],[43,28,"عَقِبِهِۦ","ذُرِّيَّتِهِ."],[43,29,"مَتَّعْتُ هَٰٓؤُلَآءِ","لَمْ أُعَاجِلْهُمْ بِالعُقُوبَةِ."],[43,31,"لَوْلَا","هَلَّا."],[43,31,"ٱلْقَرْيَتَيْنِ","مَكَّةَ، وَالطَّائِفِ."],[43,32,"رَحْمَتَ رَبِّكَ","النُّبُوَّةَ."],[43,32,"سُخْرِيًّا","مُسَخَّرًا فِي العَمَلِ."],[43,32,"وَرَحْمَتُ رَبِّكَ","الجَنَّةُ."],[43,33,"أُمَّةً وَٰحِدَةً","جَمَاعَةً وَاحِدَةً عَلَى الكُفْرِ."],[43,33,"وَمَعَارِجَ","سَلَالِمَ مِنْ فِضَّةٍ."],[43,33,"يَظْهَرُونَ","يَصْعَدُونَ."],[43,35,"وَزُخْرُفًا","ذَهَبًا."],[43,35,"وَإِن كُلُّ ذَٰلِكَ لَمَّا","مَا كُلُّ ذَلِكَ إِلَّا."],[43,36,"يَعْشُ","يُعْرِضْ."],[43,36,"نُقَيِّضْ","نُهَيِّئْ، وَنُيَسِّرْ."],[43,36,"قَرِينٌ","مُلَازِمٌ، وَمُصَاحِبٌ."],[43,38,"بُعْدَ ٱلْمَشْرِقَيْنِ","مِثْلَ تَبَاعُدِ مَا بَيْنَ المَشْرِقِ، وَالمَغْرِبِ."],[43,44,"لَذِكْرٌ","لَشَرَفٌ؛ لِأَنَّهُ أُنْزِلَ بِلُغَتِهِمْ."],[43,46,"وَمَلَإِي۟هِۦ","أَشْرَافُ قَوْمِهِ."],[43,48,"ءَايَةٍ","حُجَّةٍ عَلَى صِدْقِ دَعْوَتِهِ."],[43,48,"بِٱلْعَذَابِ","مِنَ الجَرَادِ، وَالقُمَّلِ، وَالضَّفَادِعِ، وَنَحْوِهَا."],[43,49,"ٱلسَّاحِرُ","العَالِمُ (وَكَانَ السَّاحِرُ فِيهِمْ عَظِيمًا يُوَقَّرُونَهُ، وَلَمْ يَكُنْ صِفَةَ ذَمٍّ)."],[43,49,"بِمَا عَهِدَ عِندَكَ","بِعَهْدِهِ الَّذِي عَهِدَ إِلَيْكَ، وَمَا خَصَّكَ بِهِ مِنَ الفَضَائِلِ."],[43,50,"يَنكُثُونَ","يَغْدِرُونَ، وَيُصِرُّونَ عَلَى الكُفْرِ."],[43,52,"مَهِينٌ","ضَعِيفٌ لَا عِزَّ لَهُ."],[43,52,"وَلَا يَكَادُ يُبِينُ","لَا يَكَادُ يُفْصِحُ فِي كَلَامِهِ."],[43,53,"مُقْتَرِنِينَ","مَقْرُونِينَ مَعَهُ يُصَدِّقُونَهُ."],[43,54,"فَٱسْتَخَفَّ قَوْمَهُۥ","اسْتَخَفَّ بِعُقُولِهِمْ."],[43,55,"ءَاسَفُونَا","أَغْضَبُونَا."],[43,56,"سَلَفًا","قُدْوَةً لِمَنْ يَعْمَلُ مِثْلَ عَمَلِهِمْ؛ فَيَسْتَحِقُّ العُقُوبَةَ."],[43,56,"وَمَثَلًا","عِظَةً، وَعِبْرَةً."],[43,57,"يَصِدُّونَ","يَضِجُّونَ وَيَصِيحُونَ، فَرَحًا، وَجَذَلًا."],[43,58,"خَصِمُونَ","شَدِيدُو الخُصُومَةِ بِالبَاطِلِ."],[43,59,"مَثَلًا","عِبْرَةً، وَآيَةً."],[43,60,"لَجَعَلْنَا مِنكُم","لَجَعَلْنَا بَدَلَكُمْ."],[43,60,"يَخْلُفُونَ","يَخْلُفُ بَعْضُهُمْ بَعْضًا، بَدَلًا مِنْ بَنِي آدَمَ."],[43,61,"لَعِلْمٌ لِّلسَّاعَةِ","إِنَّ نُزُولَ عِيسَى عليه السلام لَدَلِيلٌ عَلَى قُرْبِ وُقُوعِ السَّاعَةِ."],[43,61,"فَلَا تَمْتَرُنَّ","لَا تَشُكُّوا."],[43,61,"صِرَٰطٌ مُّسْتَقِيمٌ","طَرِيقٌ قَوِيمٌ إِلَى الجَنَّةِ لَا عِوَجَ فِيهِ."],[43,63,"بِٱلْحِكْمَةِ","بِالنُّبُوَّةِ."],[43,65,"ٱلْأَحْزَابُ","الفِرَقُ."],[43,65,"فَوَيْلٌ","هَلَاكٌ، وَدَمَارٌ."],[43,66,"يَنظُرُونَ","يَنْتَظِرُونَ."],[43,66,"بَغْتَةً","فَجْأَةً."],[43,67,"ٱلْأَخِلَّآءُ","الأَصْدِقَاءُ، وَالأَحْبَابُ."],[43,70,"تُحْبَرُونَ","تُنَعَّمُونَ، وَتُسَرُّونَ."],[43,71,"بِصِحَافٍ","بِأَوَانٍ."],[43,75,"لَا يُفَتَّرُ عَنْهُمْ","لَا يُخَفَّفُ عَنْهُمْ."],[43,75,"مُبْلِسُونَ","آيِسُونَ مِنْ رَحْمَةِ اللهِ."],[43,77,"مَٰلِكُ","هُوَ: خَازِنُ جَهَنَّمَ."],[43,77,"لِيَقْضِ","لِيُمِتْنَا."],[43,79,"أَمْ أَبْرَمُوٓا۟ أَمْرًا","أَحْكَمُوا أَمْرًا فِي كَيْدِ نَبِيِّنَا مُحَمَّدٍ صلى الله عليه وسلم."],[43,80,"يَحْسَبُونَ","يَظُنُّونَ."],[43,80,"وَنَجْوَىٰهُم","مَا تَكَلَّمُوا فِيهِ فِيمَا بَيْنَهُمْ."],[43,80,"وَرُسُلُنَا","مَلَائِكَتُنَا الكِرَامُ الحَفَظَةُ."],[43,82,"عَمَّا يَصِفُونَ","عَمَّا يَصِفُونَ اللهَ بِهِ؛ مِنَ الصَّاحِبَةِ، وَالوَلَدِ."],[43,83,"فَذَرْهُمْ","اتْرُكْهُمْ."],[43,83,"يَخُوضُوا۟","يَتَكَلَّمُوا بِبَاطِلِهِمْ."],[43,84,"إِلَٰهٌ","مَعْبُودٌ بِحَقٍّ."],[43,85,"وَتَبَارَكَ","تَكَاثَرَتْ بَرَكَةُ اللهِ، وَكَثُرَ خَيْرُهُ."],[43,86,"شَهِدَ بِٱلْحَقِّ","أَقَرَّ بِتَوْحِيدِ اللهِ، وَنُبُوَّةِ نَبِيِّنَا مُحَمَّدٍ صلى الله عليه وسلم."],[43,87,"فَأَنَّىٰ يُؤْفَكُونَ","كَيْفَ يُنْصَرِفُونَ عَنْ عِبَادَةِ اللهِ؟!"],[43,88,"وَقِيلِهِۦ","وَقَوْلِ مُحَمَّدٍ فِي شَكْوَاهُ."],[43,89,"فَٱصْفَحْ","أَعْرِضْ عَنْ أَذَاهُمْ."],[44,3,"لَيْلَةٍ مُّبَٰرَكَةٍ","هِيَ: لَيْلَةُ القَدْرِ مِنْ شَهْرِ رَمَضَانَ."],[44,4,"يُفْرَقُ","يُقْضَى وَيُفْصَلُ مِنَ اللَّوْحِ المَحْفُوظِ إِلَى الكَتَبَةِ مِنَ المَلَائِكَةِ."],[44,4,"أَمْرٍ حَكِيمٍ","أَمْرٍ مُحْكَمٍ؛ مِنَ الآجَالِ، وَالأَرْزَاقِ، فِي تِلْكَ السَّنَةِ."],[44,10,"فَٱرْتَقِبْ","انْتَظِرْ بِهَؤُلَاءِ المُشْرِكِينَ."],[44,11,"يَغْشَى","يَعُمُّ."],[44,13,"أَنَّىٰ لَهُمُ ٱلذِّكْرَىٰ","كَيْفَ يَكُونُ لَهُمُ التَّذَكُّرُ وَالاتِّعَاظُ؟!"],[44,13,"رَسُولٌ مُّبِينٌ","بَيِّنُ الرِّسَالَةِ؛ وَهُوَ نَبِيُّنَا مُحَمَّدٌ صلى الله عليه وسلم."],[44,14,"تَوَلَّوْا۟","أَعْرَضُوا."],[44,14,"مُعَلَّمٌ","عَلَّمَهُ بَشَرٌ، أَوْ شَيْطَانٌ."],[44,16,"ٱلْبَطْشَةَ ٱلْكُبْرَىٰٓ","العَذَابَ الأَكْبَرَ يَوْمَ القِيَامَةِ."],[44,17,"فَتَنَّا","اخْتَبَرْنَا وَابْتَلَيْنَا."],[44,18,"أَدُّوٓا۟ إِلَىَّ","سَلِّمُوا لِي عِبَادَ اللهِ مِنْ بَنِي إِسْرَائِيلَ."],[44,19,"أَن لَّا تَعْلُوا۟","أَلَّا تَتَكَبَّرُوا."],[44,19,"بِسُلْطَٰنٍ","بِبُرْهَانٍ، وَحُجَّةٍ."],[44,20,"عُذتُ","اسْتَجَرْتُ."],[44,20,"أَن تَرْجُمُونِ","أَنْ تَقْتُلُونِي رَجْمًا بِالحِجَارَةِ."],[44,24,"رَهْوًا","سَاكِنًا غَيْرَ مُضْطَرِبٍ."],[44,26,"وَمَقَامٍ كَرِيمٍ","مَنَازِلَ جَمِيلَةٍ."],[44,27,"وَنَعْمَةٍ","عِيشَةٍ، وَتَنَعُّمٍ."],[44,27,"فَٰكِهِينَ","نَاعِمِينَ مُتْرَفِينَ."],[44,28,"قَوْمًا ءَاخَرِينَ","هُمْ: بَنُو إِسْرَائِيلَ؛ خَلَفُوا الأَقْبَاطَ عَلَى بِلَادِهِمْ."],[44,29,"مُنظَرِينَ","مُؤَخَّرِينَ عَنِ العُقُوبَةِ."],[44,30,"ٱلْعَذَابِ ٱلْمُهِينِ","المُذِلِّ؛ وَهُوَ قَتْلُ أَبْنَائِهِمْ، وَاسْتِخْدَامُ نِسَائِهِمْ."],[44,31,"عَالِيًا","مُتَكَبِّرًا جَبَّارًا."],[44,32,"ٱخْتَرْنَٰهُمْ","اصْطَفَيْنَاهُمْ."],[44,32,"عَلَى ٱلْعَٰلَمِينَ","عَالَمِي زَمَانِهِمْ."],[44,33,"بَلَٰٓؤٌا۟ مُّبِينٌ","اخْتِبَارٌ بَيْنَ الرَّخَاءِ، وَالشِّدَّةِ."],[44,35,"بِمُنشَرِينَ","بِمَبْعُوثِينَ."],[44,41,"لَا يُغْنِى مَوْلًى","لَا يَدْفَعُ صَاحِبٌ."],[44,44,"ٱلْأَثِيمِ","صَاحِبِ الآثَامِ الكَبِيرَةِ."],[44,45,"كَٱلْمُهْلِ","كَالمَعْدِنِ المُذَابِ."],[44,46,"ٱلْحَمِيمِ","المَاءِ الَّذِي بَلَغَ الغَايَةَ فِي الحَرَارَةِ."],[44,47,"فَٱعْتِلُوهُ","جُرُّوهُ وَسُوقُوهُ بِعُنْفٍ."],[44,47,"سَوَآءِ ٱلْجَحِيمِ","وَسَطِ الجَحِيمِ."],[44,49,"أَنتَ ٱلْعَزِيزُ ٱلْكَرِيمُ","عَلَى وَجْهِ التَّهَكُّمِ، وَالتَّوْبِيخِ لَهُمْ."],[44,50,"تَمْتَرُونَ","تَشُكُّونَ."],[44,51,"مَقَامٍ أَمِينٍ","مَوْضِعٍ يُؤْمَنُ فِيهِ الخَوْفُ، وَالآفَاتُ، وَالأَحْزَانُ."],[44,53,"سُندُسٍ","هُوَ: الرَّقِيقُ مِنَ الدِّيبَاجِ."],[44,53,"وَإِسْتَبْرَقٍ","هُوَ: الغَلِيظُ مِنَ الدِّيبَاجِ."],[44,54,"بِحُورٍ عِينٍ","نِسَاءِ الجَنَّةِ الحِسَانِ، الوَاسِعَاتِ الأَعْيُنِ."],[44,55,"يَدْعُونَ فِيهَا","يَطْلُبُونَ فِيهَا."],[44,56,"ٱلْمَوْتَةَ ٱلْأُولَىٰ","الَّتِي ذَاقُوهَا فِي الدُّنْيَا."],[44,59,"فَٱرْتَقِبْ","انْتَظِرْ نَصْرَكَ، وَهَلَاكَهُمْ."],[44,59,"مُّرْتَقِبُونَ","مُنْتَظِرُونَ مَوْتَكَ، وَهَزِيمَتَكَ."],[45,4,"يَبُثُّ","يَنْشُرُ، وَيُفَرِّقُ."],[45,5,"وَتَصْرِيفِ ٱلرِّيَٰحِ","تَقْلِيبِهَا فِي مَهَابِّهَا لِمَنْفَعَتِكُمْ."],[45,7,"وَيْلٌ","هَلَاكٌ، وَدَمَارٌ."],[45,7,"أَفَّاكٍ","كَذَّابٍ."],[45,7,"أَثِيمٍ","كَثِيرِ الإِثْمِ."],[45,9,"هُزُوًا","سُخْرِيَةً."],[45,12,"ٱلْفُلْكُ","السُّفُنُ."],[45,14,"لَا يَرْجُونَ أَيَّامَ ٱللَّهِ","لَا يَتَوَقَّعُونَ وَقَائِعَهُ وَعَذَابَهُ بِأَعْدَائِهِ."],[45,16,"ٱلْكِتَٰبَ","التَّوْرَاةَ، وَالإِنْجِيلَ."],[45,16,"وَٱلْحُكْمَ","تَحْكِيمَهُمَا."],[45,17,"بَيِّنَٰتٍ مِّنَ ٱلْأَمْرِ","شَرَائِعَ وَاضِحَاتٍ فِي الحَلَالِ، وَالحَرَامِ، وَدَلَالَاتٍ تُبَيِّنُ الحَقَّ مِنَ البَاطِلِ."],[45,17,"بَغْيًۢا بَيْنَهُمْ","حَسَدًا وَعَدَاوَةً بَيْنَهُمْ."],[45,18,"شَرِيعَةٍ مِّنَ ٱلْأَمْرِ","مِنْهَاجٍ وَاضِحٍ مِنْ أَمْرِ الدِّينِ."],[45,19,"لَن يُغْنُوا۟ عَنكَ","لَنْ يَدْفَعُوا عَنْكَ."],[45,20,"بَصَٰٓئِرُ","يُبْصِرُ بِهِ النَّاسُ الحَقَّ."],[45,21,"أَمْ حَسِبَ","بَلْ ظَنَّ."],[45,21,"ٱجْتَرَحُوا۟","اكْتَسَبُوا."],[45,23,"أَفَرَءَيْتَ","أَخْبِرْنِي."],[45,23,"وَخَتَمَ","طَبَعَ."],[45,23,"غِشَٰوَةً","غِطَاءً."],[45,26,"لَا رَيْبَ فِيهِ","لَا شَكَّ فِيهِ."],[45,32,"إِن نَّظُنُّ إِلَّا ظَنًّا","مَا نَتَوَقَّعُ وُقُوعَهَا إِلَّا تَوَهُّمًا."],[45,33,"وَحَاقَ بِهِم","نَزَلَ بِهِمْ."],[45,34,"نَنسَىٰكُمْ","نَتْرُكُكُمْ فِي العَذَابِ."],[45,34,"وَمَأْوَىٰكُمُ","مَنْزِلُكُمْ وَمَقَرُّكُمْ."],[45,35,"وَغَرَّتْكُمُ","خَدَعَتْكُمْ."],[45,35,"يُسْتَعْتَبُونَ","لَا يُطْلَبُ مِنْهُمْ أَنْ يُرْضُوا رَبَّهُمْ بِالتَّوْبَةِ، وَالطَّاعَةِ."],[45,37,"ٱلْكِبْرِيَآءُ","العَظَمَةُ، وَالسُّلْطَانُ، وَالقُدْرَةُ."],[46,3,"وَأَجَلٍ مُّسَمًّى","هُوَ: وَقْتُ فَنَائِهِمَا إِذَا قَامَتِ القِيَامَةُ."],[46,4,"شِرْكٌ","شِرْكَةٌ وَنَصِيبٌ مَعَ اللهِ تَعَالَى فِي خَلْقِ السَّمَوَاتِ."],[46,4,"أَثَٰرَةٍ","بَقِيَّةٍ."],[46,5,"وَمَنْ أَضَلُّ","لَا أَحَدَ أَضَلُّ، وَأَجْهَلُ."],[46,8,"ٱفْتَرَىٰهُ","اخْتَلَقَهُ."],[46,8,"تُفِيضُونَ فِيهِ","تَقُولُونَ فِي القُرْآنِ."],[46,9,"بِدْعًا مِّنَ ٱلرُّسُلِ","أَوَّلَ رُسُلِ اللهِ إِلَى خَلْقِهِ."],[46,10,"أَرَءَيْتُمْ","أَخْبِرُونِي."],[46,10,"وَشَهِدَ شَاهِدٌ","كَعَبْدِ اللهِ بْنِ سَلَامٍ رضي الله عنه."],[46,11,"إِفْكٌ قَدِيمٌ","كَذِبٌ مَأْثُورٌ عَنِ النَّاسِ الأَقْدَمِينَ."],[46,12,"إِمَامًا","هَادِيًا يَأْتَمُّونَ بِهِ، وَيَعْمَلُونَ."],[46,12,"مُّصَدِّقٌ","لِكُتُبٍ قَبْلَهُ."],[46,13,"ٱسْتَقَٰمُوا۟","ثَبَتُوا عَلَى الإِيمَانِ وَالطَّاعَةِ."],[46,15,"وَوَصَّيْنَا","أَمَرْنَاهُ، وَأَلْزَمْنَاهُ."],[46,15,"كُرْهًا","عَلَى مَشَقَّةٍ، وَتَعَبٍ."],[46,15,"وَفِصَٰلُهُۥ","فِطَامُهُ."],[46,15,"بَلَغَ أَشُدَّهُۥ","نِهَايَةَ قُوَّتِهِ البَدَنِيَّةِ وَالعَقْلِيَّةِ."],[46,15,"أَوْزِعْنِىٓ","أَلْهِمْنِي."],[46,17,"أُفٍّ لَّكُمَآ","قُبْحًا لَكُمَا."],[46,17,"أَنْ أُخْرَجَ","أُبْعَثَ مِنْ قَبْرِي حَيًّا."],[46,17,"خَلَتِ ٱلْقُرُونُ","مَضَتِ الأُمَمُ السَّابِقَةُ."],[46,17,"يَسْتَغِيثَانِ ٱللَّهَ","يَسْأَلَانِ اللهَ هِدَايَتَهُ."],[46,17,"وَيْلَكَ","هَلَكَتْ."],[46,17,"أَسَٰطِيرُ ٱلْأَوَّلِينَ","مَا سَطَّرَهُ الأَوَّلُونَ مِنَ الأَكَاذِيبِ فِي كُتُبِهِمْ."],[46,18,"حَقَّ عَلَيْهِمُ ٱلْقَوْلُ","وَجَبَ عَلَيْهِمُ العَذَابُ."],[46,18,"فِىٓ أُمَمٍ","فِي جُمْلَةِ أُمَمٍ كَافِرَةٍ."],[46,18,"خَلَتْ","مَضَتْ."],[46,19,"دَرَجَٰتٌ","وَلِكُلِّ فَرِيقٍ مِنَ الأَعْدَاءِ وَالأَشْقِيَاءِ مَنَازِلُ فِي القِيَامَةِ بِأَعْمَالِهِمْ."],[46,20,"ٱلْهُونِ","عَذَابَ الخِزْيِ وَالهَوَانِ."],[46,21,"أَخَا عَادٍ","هُوَ: هُودٌ عليه السلام."],[46,21,"بِٱلْأَحْقَافِ","اسْمُ مَوْقِعِهِمْ؛ وَهُوَ فِي جَنُوبِ جَزِيرَةِ العَرَبِ."],[46,21,"ٱلنُّذُرُ","مَضَتِ الرُّسُلُ."],[46,22,"لِتَأْفِكَنَا","لِتَصْرِفَنَا."],[46,24,"عَارِضًا","سَحَابًا عَرَضًا فِي أُفُقِ السَّمَاءِ."],[46,25,"تُدَمِّرُ","تُهْلِكُ."],[46,25,"كُلَّ شَىْءٍۭ","مَرَّتْ بِهِ مِمَّا أُرْسِلَتْ بِهَلَاكِهِ."],[46,26,"مَكَّنَّٰهُمْ","أَقْدَرْنَاهُمْ، وَبَسَطْنَا لَهُمْ."],[46,26,"فِيمَآ إِن مَّكَّنَّٰكُمْ فِيهِ","فِي الَّذِي لَمْ نُمَكِّنْكُمْ فِيهِ."],[46,26,"وَحَاقَ","نَزَلَ."],[46,27,"وَصَرَّفْنَا ٱلْـَٔايَٰتِ","بَيَّنَّا لَهُمْ أَنْوَاعَ الحُجَجِ، وَكَرَّرْنَاهَا لَهُمْ."],[46,28,"فَلَوْلَا","هَلَّا."],[46,28,"قُرْبَانًا","يَتَقَرَّبُونَ بِهَا إِلَى رَبِّهِمْ."],[46,28,"إِفْكُهُمْ","كَذِبُهُمْ."],[46,28,"يَفْتَرُونَ","يُكَذِّبُونَ."],[46,29,"صَرَفْنَآ","بَعَثْنَا وَوَجَّهْنَا نَحْوَكَ."],[46,29,"قُضِىَ","فَرَغَ رَسُولُ اللهِ صلى الله عليه وسلم مِنْ تِلَاوَتِهِ."],[46,29,"مُّنذِرِينَ","مُحَذِّرِينَ مِنْ بَأْسِ اللهِ."],[46,31,"دَاعِىَ ٱللَّهِ","رَسُولَ اللهِ مُحَمَّدًا صلى الله عليه وسلم."],[46,31,"وَيُجِرْكُم","يُنْقِذْكُمْ."],[46,32,"بِمُعْجِزٍ","بِفَائِتٍ مِنَ اللهِ بِالهَرَبِ."],[46,32,"أَوْلِيَآءُ","أَنْصَارٌ يَمْنَعُونَهُ مِنْ عَذَابِ اللهِ."],[46,33,"وَلَمْ يَعْىَ بِخَلْقِهِنَّ","لَمْ يَعْجِزْ عَنْ خَلْقِهِنَّ، وَلَمْ يَتْعَبْ بِهِ."],[46,35,"أُو۟لُوا۟ ٱلْعَزْمِ","ذَوُو الثَّبَاتِ وَالصَّبْرِ؛ وَهُمْ: نُوحٌ، وَإِبْرَاهِيمُ، وَمُوسَى، وَعِيسَى، وَمُحَمَّدٌ؛ عَلَيْهِمُ الصَّلَاةُ وَالسَّلَامُ."],[46,35,"تَسْتَعْجِل لَّهُمْ","لَا تَتَعَجَّلْ بِطَلَبِ عُقُوبَتِهِمْ."],[46,35,"بَلَٰغٌ","هَذَا تَبْلِيغٌ مِنَ اللهِ لَهُمْ."],[47,1,"أَضَلَّ أَعْمَٰلَهُمْ","أَحْبَطَهَا، وَأَبْطَلَهَا."],[47,2,"كَفَّرَ","أَزَالَ، وَمَحَا."],[47,2,"بَالَهُمْ","حَالَهُمْ وَشَأْنَهُمْ فِي الدُّنْيَا وَالآخِرَةِ."],[47,3,"ٱلْبَٰطِلَ","الشَّيْطَانَ."],[47,4,"فَضَرْبَ ٱلرِّقَابِ","اضْرِبُوا مِنْهُمُ الأَعْنَاقَ."],[47,4,"أَثْخَنتُمُوهُمْ","أَضْعَفْتُمُوهُمْ بِكَثْرَةِ القِتَالِ، وَكَسَرْتُمْ شَوْكَتَهُمْ."],[47,4,"فَشُدُّوا۟ ٱلْوَثَاقَ","أَحْكِمُوا قَيْدَ الأَسْرَى."],[47,4,"مَنًّۢا","تَمُنُّونَ عَلَيْهِمْ بِإِطْلَاقِ الأَسْرَى مِنْ غَيْرِ عِوَضٍ."],[47,4,"فِدَآءً","تَطْلُبُونَ مِنْهُمْ فِدْيَةً تُخَلِّصُهُمْ مِنَ الأَسْرِ."],[47,4,"تَضَعَ ٱلْحَرْبُ أَوْزَارَهَا","أَثْقَالَهَا؛ وَالمُرَادُ: حَتَّى تَنْتَهِيَ الحَرْبُ."],[47,4,"لِيَبْلُوَا۟","لِيَخْتَبِرَ."],[47,4,"يُضِلَّ أَعْمَٰلَهُمْ","يُبْطِلَ ثَوَابَ أَعْمَالِهِمْ."],[47,5,"بَالَهُمْ","شَأْنَهُمْ فِي الدُّنْيَا وَالآخِرَةِ."],[47,6,"عَرَّفَهَا لَهُمْ","بَيَّنَهَا لَهُمْ؛ فَيَهْتَدُونَ إِلَى مَسَاكِنِهِمْ فِيهَا مِنْ غَيْرِ اسْتِدْلَالٍ."],[47,7,"وَيُثَبِّتْ أَقْدَامَكُمْ","يُثَبِّتْكُمْ عِنْدَ القِتَالِ، وَيُقَوِّ قُلُوبَكُمْ."],[47,8,"فَتَعْسًا","هَلَاكًا، وَخَيْبَةً."],[47,8,"وَأَضَلَّ أَعْمَٰلَهُمْ","أَذْهَبَ ثَوَابَ أَعْمَالِهِمْ."],[47,9,"فَأَحْبَطَ أَعْمَٰلَهُمْ","أَبْطَلَ أَعْمَالَهُمْ."],[47,10,"أَمْثَٰلُهَا","عُقُوبَاتٌ مُمَاثِلَةٌ."],[47,11,"مَوْلًى","وَلِيٌّ، وَنَاصِرٌ."],[47,12,"مَثْوًى","مَأْوًى، وَمَسْكَنٌ."],[47,13,"وَكَأَيِّن مِّن قَرْيَةٍ","كَثِيرٌ مِنَ القُرَى."],[47,15,"مَّثَلُ","صِفَةُ."],[47,15,"غَيْرِ ءَاسِنٍ","غَيْرِ مُتَغَيِّرٍ، وَلَا مُنْتِنٍ."],[47,15,"حَمِيمًا","بَالِغَ الغَايَةِ فِي الحَرَارَةِ."],[47,16,"وَمِنْهُم","مِنَ المُنَافِقِينَ."],[47,16,"ءَانِفًا","الآنَ."],[47,18,"يَنظُرُونَ","يَنْتَظِرُونَ."],[47,18,"بَغْتَةً","فَجْأَةً."],[47,18,"جَآءَ أَشْرَاطُهَا","ظَهَرَتْ عَلَامَاتُهَا."],[47,18,"فَأَنَّىٰ","مِنْ أَيْنَ لَهُمْ؟!"],[47,18,"ذِكْرَىٰهُمْ","تَذَكُّرُهُمْ."],[47,19,"مُتَقَلَّبَكُمْ","تَصَرُّفَكُمْ فِي يَقَظَتِكُمْ نَهَارًا."],[47,19,"وَمَثْوَىٰكُمْ","مُسْتَقَرَّكُمْ فِي نَوْمِكُمْ لَيْلًا."],[47,20,"مَّرَضٌ","شَكٌّ، وَنِفَاقٌ."],[47,20,"ٱلْمَغْشِىِّ عَلَيْهِ","المُغْمَى عَلَيْهِ مِنْ شِدَّةِ الخَوْفِ."],[47,21,"عَزَمَ ٱلْأَمْرُ","وَجَبَ القِتَالُ."],[47,22,"فَهَلْ عَسَيْتُمْ","لَعَلَّكُمْ."],[47,22,"تَوَلَّيْتُمْ","أَعْرَضْتُمْ عَنِ الإِيمَانِ."],[47,24,"أَمْ","بَلْ."],[47,24,"أَقْفَالُهَآ","مُعَلَّقَةٌ؛ فَلَا تَفْهَمُ القُرْآنَ."],[47,25,"ٱرْتَدُّوا۟ عَلَىٰٓ أَدْبَٰرِهِم","رَجَعُوا كُفَّارًا."],[47,25,"سَوَّلَ لَهُمْ","زَيَّنَ لَهُمْ خَطَايَاهُمْ."],[47,25,"وَأَمْلَىٰ لَهُمْ","مَدَّ لَهُمْ فِي الأَمَلِ."],[47,26,"كَرِهُوا۟","هُمُ اليَهُودُ."],[47,26,"إِسْرَارَهُمْ","مَا يُخْفُونَهُ، وَيُسِرُّونَهُ."],[47,28,"فَأَحْبَطَ أَعْمَٰلَهُمْ","أَبْطَلَ ثَوَابَ أَعْمَالِهِمْ."],[47,29,"أَمْ حَسِبَ","بَلْ ظَنَّ."],[47,29,"مَّرَضٌ","نِفَاقٌ، وَشَكٌّ."],[47,29,"أَضْغَٰنَهُمْ","أَحْقَادَهُمْ."],[47,30,"بِسِيمَٰهُمْ","عَلَامَاتِهِمُ الظَّاهِرَةِ."],[47,30,"لَحْنِ ٱلْقَوْلِ","مَا يَبْدُو مِنْ كَلَامِهِمُ الَّذِي يَدُلُّ عَلَى مَقَاصِدِهِمْ."],[47,31,"وَلَنَبْلُوَنَّكُمْ","لَنَخْتَبِرَنَّكُمْ."],[47,31,"وَنَبْلُوَا۟ أَخْبَارَكُمْ","نَخْتَبِرَ أَقْوَالَكُمْ وَأَفْعَالَكُمْ."],[47,32,"وَشَآقُّوا۟ ٱلرَّسُولَ","خَالَفُوهُ، وَحَارَبُوهُ."],[47,35,"تَهِنُوا۟","لَا تَضْعُفُوا، وَتَجْبُنُوا عَنْ مُقَاتَلَةِ الكُفَّارِ."],[47,35,"ٱلسَّلْمِ","الصُّلْحِ، وَالمُسَالَمَةِ."],[47,35,"يَتِرَكُمْ","يَنْقُصْكُمْ ثَوَابَ أَعْمَالِكُمْ."],[47,37,"فَيُحْفِكُمْ","يُلِحَّ عَلَيْكُمْ، وَيُجْهِدْكُمْ."],[47,37,"أَضْغَٰنَكُمْ","أَحْقَادَكُمْ."],[48,1,"فَتْحًا مُّبِينًا","هُوَ: صُلْحُ الحُدَيْبِيَةِ عَامَ سِتَّةٍ مِنَ الهِجْرَةِ."],[48,2,"صِرَٰطًا مُّسْتَقِيمًا","طَرِيقًا، وَدِينًا لَا عِوَجَ فِيهِ."],[48,3,"عَزِيزًا","قَوِيًّا لَا ضَعْفَ فِيهِ."],[48,4,"ٱلسَّكِينَةَ","الطُّمَأْنِينَةَ، وَالثَّبَاتَ."],[48,5,"وَيُكَفِّرَ","يَمْحُو."],[48,6,"ظَنَّ ٱلسَّوْءِ","الظَّنَّ السَّيِّئَ؛ وَهُوَ: الظَّنُّ بِأَنْ لَنْ يَنْصُرَ اللهُ دِينَهُ."],[48,6,"دَآئِرَةُ ٱلسَّوْءِ","دُعَاءٌ عَلَيْهِمْ بِأَنْ تَدُورَ عَلَيْهِمْ دَائِرَةُ العَذَابِ، وَكُلُّ مَا يَسُوءُ."],[48,6,"مَصِيرًا","مَنْزِلًا يَصِيرُونَ إِلَيْهِ."],[48,9,"وَتُعَزِّرُوهُ","تَنْصُرُوا اللهَ."],[48,9,"وَتُوَقِّرُوهُ","تُعَظِّمُوا اللهَ."],[48,9,"بُكْرَةً وَأَصِيلًا","أَوَّلَ النَّهَارِ، وَآخِرَهُ."],[48,10,"نَّكَثَ","نَقَضَ بَيْعَتَهُ."],[48,11,"ٱلْمُخَلَّفُونَ","الَّذِينَ تَخَلَّفُوا عَنِ الخُرُوجِ مَعَكَ إِلَى مَكَّةَ."],[48,11,"ٱلْأَعْرَابِ","البَدْوِ."],[48,12,"يَنقَلِبَ","لَنْ يَرْجِعَ."],[48,12,"ظَنَّ ٱلسَّوْءِ","الظَّنَّ السَّيِّئَ؛ وَهُوَ: أَلَّا يَنْصُرَ اللهُ نَبِيَّهُ صلى الله عليه وسلم."],[48,12,"بُورًا","هَلْكَى لَا خَيْرَ فِيهِمْ."],[48,13,"أَعْتَدْنَا","أَعْدَدْنَا."],[48,15,"مَغَانِمَ","غَنَائِمَ خَيْبَرَ الَّتِي وَعَدَكُمُ اللهُ بِهَا."],[48,15,"ذَرُونَا","اتْرُكُونَا."],[48,16,"أُو۟لِى بَأْسٍ","أَصْحَابِ شِدَّةٍ وَقُوَّةٍ فِي الحَرْبِ."],[48,17,"حَرَجٌ","إِثْمٌ فِي تَرْكِ الجِهَادِ."],[48,18,"يُبَايِعُونَكَ","بَيْعَةَ الرِّضْوَانِ بِالحُدَيْبِيَةِ."],[48,18,"ٱلسَّكِينَةَ","الطُّمَأْنِينَةَ، وَالثَّبَاتَ."],[48,18,"فَتْحًا قَرِيبًا","فَتْحَ خَيْبَرَ."],[48,21,"أَحَاطَ ٱللَّهُ بِهَا","قَادِرٌ عَلَيْهَا قَدْ وَعَدَكُمْ بِهَا، وَسَيُنْجِزُ وَعْدَهُ."],[48,22,"لَوَلَّوُا۟ ٱلْأَدْبَٰرَ","لَانْهَزَمُوا، وَوَلَّوْكُمْ ظُهُورَهُمْ."],[48,23,"سُنَّةَ ٱللَّهِ","طَرِيقَتَهُ بِنَصْرِ جُنْدِهِ، وَهَزِيمَةِ أَعْدَائِهِ."],[48,24,"بِبَطْنِ مَكَّةَ","بِالحُدَيْبِيَةِ قُرْبَ مَكَّةَ."],[48,24,"أَظْفَرَكُمْ","أَقْدَرَكُمْ عَلَيْهِمْ؛ فَأَمْسَكْتُمْ بِهِمْ، وَكَانُوا ثَمَانِينَ رَجُلًا."],[48,25,"وَٱلْهَدْىَ","البُدْنَ الَّتِي سَاقَهَا رَسُولُ اللهِ صلى الله عليه وسلم فِي عَامِ الحُدَيْبِيَةِ؛ لِيُهْدِيَهَا فِي الحَرَمِ."],[48,25,"مَعْكُوفًا","مَحْبُوسًا."],[48,25,"مَحِلَّهُۥ","المَكَانَ الَّذِي يَحِلُّ فِيهِ نَحْرُهُ؛ وَهُوَ الحَرَمُ."],[48,25,"رِجَالٌ مُّؤْمِنُونَ","مُسْتَضْعَفُونَ، مُسْتَخْفُونَ بِإِيمَانِهِمْ."],[48,25,"تَطَـُٔوهُمْ","خَشْيَةَ أَنْ تُهْلِكُوهُمْ إِذَا حَارَبْتُمُ الكُفَّارَ."],[48,25,"مَّعَرَّةٌۢ","إِثْمٌ، وَعَيْبٌ، وَغَرَامَةٌ."],[48,25,"تَزَيَّلُوا۟","تَمَيَّزَ هَؤُلَاءِ المُسْتَضْعَفُونَ عَنِ الكُفَّارِ."],[48,26,"ٱلْحَمِيَّةَ","الأَنَفَةَ."],[48,26,"سَكِينَتَهُۥ","الاطْمِئْنَانَ وَالوَقَارَ."],[48,26,"كَلِمَةَ ٱلتَّقْوَىٰ","هِيَ: لَا إِلَهَ إِلَّا اللهُ."],[48,27,"فَتْحًا قَرِيبًا","هُوَ: صُلْحُ الحُدَيْبِيَةِ، وَفَتْحُ خَيْبَرَ."],[48,28,"بِٱلْهُدَىٰ","بِالبَيَانِ الوَاضِحِ، وَالعِلْمِ النَّافِعِ."],[48,28,"لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ","لِيُعْلِيَهُ عَلَى المِلَلِ كُلِّهَا."],[48,29,"سِيمَاهُمْ","عَلَامَتُهُمْ."],[48,29,"مَثَلُهُمْ","صِفَتُهُمْ."],[48,29,"شَطْـَٔهُۥ","سَاقُهُ، وَفَرْعُهُ."],[48,29,"فَـَٔازَرَهُۥ","قَوَّى ذَلِكَ الشَّطْءُ الزَّرْعَ."],[48,29,"فَٱسْتَغْلَظَ","صَارَ غَلِيظًا."],[48,29,"فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ","قَوِيَ، وَاسْتَوَى قَائِمًا عَلَى سِيقَانِهِ."],[48,29,"ٱلزُّرَّاعَ","الزَّارِعِينَ الَّذِينَ زَرَعُوهُ، وَهَذَا مَثَلٌ ضَرَبَهُ اللهُ لِأَصْحَابِ النَّبِيِّ صلى الله عليه وسلم وَأَنَّهُمْ يَبْدُؤُونَ قِلَّةً ضُعَفَاءَ، ثُمَّ يَكْثُرُونَ وَيَقْوَوْنَ."],[49,1,"لَا تُقَدِّمُوا۟","لَا تَتَقَدَّمُوا بِقَوْلٍ أَوْ فِعْلٍ، وَلَا تَقْضُوا أَمْرًا دُونَ أَمْرِ اللهِ وَرَسُولِهِ؛ فَتَبْتَدِعُوا."],[49,2,"أَن تَحْبَطَ","كَرَاهَةَ أَنْ تَبْطُلَ."],[49,3,"يَغُضُّونَ","يَخْفِضُونَ."],[49,3,"ٱمْتَحَنَ ٱللَّهُ قُلُوبَهُمْ","اخْتَبَرَهَا، وَصَفَّاهَا، وَأَخْلَصَهَا لِتَقْوَاهُ."],[49,4,"يُنَادُونَكَ","يُنَادِيكَ الأَعْرَابُ بِصَوْتٍ مُرْتَفِعٍ، غَلِيظٍ، جَافٍ."],[49,4,"ٱلْحُجُرَٰتِ","حُجُرَاتِ زَوْجَاتِهِ صلى الله عليه وسلم."],[49,6,"بِنَبَإٍ","بِخَبَرٍ."],[49,6,"فَتَبَيَّنُوٓا۟","فَتَثَبَّتُوا مِنْ خَبَرِهِ."],[49,6,"أَن تُصِيبُوا۟","خَشْيَةَ أَنْ تُصِيبُوا."],[49,7,"لَعَنِتُّمْ","لَأَدَّى إِلَى مَشَقَّتِكُمْ، وَعَنَتِكُمْ."],[49,9,"بَغَتْ","اعْتَدَتْ."],[49,9,"تَفِىٓءَ","تَرْجِعَ إِلَى حُكْمِ اللهِ وَرَسُولِهِ."],[49,9,"وَأَقْسِطُوٓا۟","اعْدِلُوا."],[49,9,"ٱلْمُقْسِطِينَ","العَادِلِينَ فِي أَحْكَامِهِمْ."],[49,11,"يَسْخَرْ","لَا يَهْزَأْ، وَيَنْتَقِصْ."],[49,11,"قَوْمٌ","رِجَالٌ."],[49,11,"تَلْمِزُوٓا۟","لَا يَعِبْ، وَلَا يَطْعَنْ بَعْضُكُمْ بَعْضًا."],[49,11,"تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ","لَا يَدْعُ بَعْضُكُمْ بَعْضًا بِمَا يَكْرَهُ مِنَ الأَلْقَابِ."],[49,11,"بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ","قُبْحُ الِاسْمِ وَالصِّفَةُ الفُسُوقُ؛ وَهُوَ: السُّخْرِيَةُ، وَاللَّمْزُ، وَالتَّنَابُزُ."],[49,11,"بَعْدَ ٱلْإِيمَٰنِ","بَعْدَمَا دَخَلْتُمْ فِي الإِسْلَامِ."],[49,12,"كَثِيرًا مِّنَ ٱلظَّنِّ","هُوَ ظَنُّ السُّوءِ بِالمُؤْمِنِينَ."],[49,12,"تَجَسَّسُوا۟","لَا تُفَتِّشُوا عَنْ عَوْرَاتِ المُسْلِمِينَ."],[49,12,"يَغْتَب","لَا يَقُلْ أَحَدُكُمْ فِي أَخِيهِ الغَائِبِ مَا يَكْرَهُ."],[49,13,"وَقَبَآئِلَ","القَبِيلَةُ: الجَمَاعَةُ دُونَ الشَّعْبِ."],[49,14,"ٱلْأَعْرَابُ","البَدْوُ."],[49,14,"يَلِتْكُم","لَا يَنْقُصْكُمْ مِنْ ثَوَابِ أَعْمَالِكُمْ."],[49,15,"يَرْتَابُوا۟","لَمْ يَشُكُّوا."],[50,1,"ٱلْمَجِيدِ","ذِي المَجْدِ وَالشَّرَفِ."],[50,3,"رَجْعٌۢ بَعِيدٌ","رُجُوعٌ إِلَى الحَيَاةِ بَعْدَ المَوْتِ، بَعِيدُ الوُقُوعِ."],[50,4,"تَنقُصُ","تُفْنِي مِنْ أَجْسَادِهِمْ."],[50,4,"كِتَٰبٌ حَفِيظٌۢ","حَافِظٌ لِجَمِيعِ أَفْعَالِهِمْ؛ وَهُوَ اللَّوْحُ المَحْفُوظُ."],[50,5,"مَّرِيجٍ","مُضْطَرِبٍ، مُخْتَلِطٍ، لَا يَثْبُتُونَ عَلَى شَيْءٍ."],[50,6,"فُرُوجٍ","فُتُوقٍ، وَشُقُوقٍ."],[50,7,"مَدَدْنَٰهَا","وَسَّعْنَاهَا، وَفَرَشْنَاهَا."],[50,7,"رَوَٰسِىَ","جِبَالًا ثَوَابِتَ."],[50,7,"زَوْجٍۭ بَهِيجٍ","نَوْعِ حَسَنِ المَنْظَرِ."],[50,8,"تَبْصِرَةً","عِبْرَةً يَتَبَصَّرُ بِهَا مِنْ عَمَى الجَهْلِ."],[50,8,"مُّنِيبٍ","رَجَّاعٍ إِلَى اللهِ تَعَالَى."],[50,9,"وَحَبَّ ٱلْحَصِيدِ","حَبَّ الزَّرْعِ الَّذِي يُحْصَدُ."],[50,10,"بَاسِقَٰتٍ","طِوَالًا."],[50,10,"طَلْعٌ نَّضِيدٌ","ثَمَرٌ مُتَرَاكِبٌ بَعْضُهُ فَوْقَ بَعْضٍ."],[50,12,"ٱلرَّسِّ","البِئْرِ."],[50,14,"وَأَصْحَٰبُ ٱلْأَيْكَةِ","أَصْحَابُ الشَّجَرِ الكَثِيفِ المُلْتَفِّ بَعْضُهُ عَلَى بَعْضٍ؛ وَهُمْ قَوْمُ شُعَيْبٍ عليه السلام."],[50,14,"فَحَقَّ وَعِيدِ","وَجَبَ نُزُولُ العَذَابِ عَلَى الجَمِيعِ."],[50,15,"أَفَعَيِينَا","أَفَعَجَزْنَا، وَضَعُفَتْ قُدْرَتُنَا؟!"],[50,15,"بِٱلْخَلْقِ ٱلْأَوَّلِ","خَلْقِهِمُ الَّذِي خَلَقْنَاهُ أَوَّلَ مَرَّةٍ، بَعْدَ أَنْ لَمْ يَكُونُوا شَيْئًا."],[50,15,"لَبْسٍ","حَيْرَةٍ، وَشَكٍّ."],[50,16,"حَبْلِ ٱلْوَرِيدِ","عِرْقٍ فِي العُنُقِ، مُتَّصِلٍ بِالقَلْبِ."],[50,17,"ٱلْمُتَلَقِّيَانِ","المَلَكَانِ المُتَرَصِّدَانِ."],[50,18,"رَقِيبٌ عَتِيدٌ","مَلَكٌ يَرْقُبُ قَوْلَهُ وَيَكْتُبُهُ، حَاضِرٌ مُعَدٌّ لِذَلِكَ."],[50,19,"سَكْرَةُ ٱلْمَوْتِ","شِدَّةُ المَوْتِ، وَغَمْرَتُهُ."],[50,19,"تَحِيدُ","تَهْرُبُ، وَتَرُوغُ."],[50,20,"ٱلصُّورِ","القَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ عليه السلام."],[50,21,"سَآئِقٌ وَشَهِيدٌ","مَلَكَانِ أَحَدُهُمَا يَسُوقُهَا إِلَى المَحْشَرِ، وَالآخَرُ يَشْهَدُ عَلَيْهَا بِمَا عَمِلَتْ."],[50,22,"غِطَآءَكَ","حِجَابَ غَفْلَتِكَ عَنِ الآخِرَةِ."],[50,22,"حَدِيدٌ","شَدِيدٌ قَوِيٌّ."],[50,23,"قَرِينُهُۥ","المَلَكُ الكَاتِبُ الَّذِي يَشْهَدُ عَلَيْهِ."],[50,23,"هَٰذَا مَا لَدَىَّ عَتِيدٌ","مَا عِنْدِي مِنْ دِيوَانِ عَمَلِهِ: مُعَدٌّ مَحْفُوظٌ حَاضِرٌ."],[50,24,"أَلْقِيَا","اطْرَحَا أَيُّهَا المَلَكَانِ."],[50,25,"مُعْتَدٍ","ظَالِمٍ، مُتَجَاوِزٍ لِلْحَدِّ."],[50,25,"مُّرِيبٍ","شَاكٍّ فِي وَعْدِ اللهِ وَوَعِيدِهِ."],[50,27,"قَرِينُهُۥ","شَيْطَانُهُ الَّذِي كَانَ يُصَاحِبُهُ فِي الدُّنْيَا."],[50,27,"مَآ أَطْغَيْتُهُۥ","مَا أَضْلَلْتُهُ."],[50,30,"هَلْ مِن مَّزِيدٍ","هَلْ مِنْ زِيَادَةٍ مِنَ الجِنِّ وَالإِنْسِ؟! فَيَضَعُ الجَبَّارُ قَدَمَهُ عَلَيْهَا، فَيَنْزَوِي بَعْضُهَا عَلَى بَعْضٍ، وَتَقُولُ: قَطْ قَطْ، أَيْ: حَسْبِي؛ كَمَا ثَبَتَ فِي الحَدِيثِ الصَّحِيحِ."],[50,31,"وَأُزْلِفَتِ","قُرِّبَتْ."],[50,32,"أَوَّابٍ","رَجَّاعٍ إِلَى اللهِ بِالتَّوْبَةِ."],[50,32,"حَفِيظٍ","حَافِظٍ لِكُلِّ مَا يُقَرِّبُهُ مِنْ رَبِّهِ مِنَ الطَّاعَاتِ."],[50,33,"مُّنِيبٍ","تَائِبٍ، مُقْبِلٍ عَلَى الطَّاعَةِ."],[50,34,"بِسَلَٰمٍ","دُخُولًا مَقْرُونًا بِالسَّلَامَةِ مِنَ الآفَاتِ."],[50,35,"وَلَدَيْنَا مَزِيدٌ","عِنْدَنَا زِيَادَةُ نَعِيمٍ، وَأَعْظَمُهُ: النَّظَرُ إِلَى وَجْهِ اللهِ الكَرِيمِ."],[50,36,"وَكَمْ أَهْلَكْنَا","كَثِيرًا أَهْلَكْنَا."],[50,36,"قَرْنٍ","أُمَمٍ."],[50,36,"بَطْشًا","قُوَّةً، وَسَطْوَةً."],[50,36,"فَنَقَّبُوا۟","طَوَّفُوا."],[50,36,"مَحِيصٍ","مَهْرَبٍ."],[50,37,"أَلْقَى ٱلسَّمْعَ","أَصْغَى السَّمْعَ."],[50,37,"وَهُوَ شَهِيدٌ","هُوَ حَاضِرٌ بِقَلْبِهِ، غَيْرُ غَافِلٍ وَلَا لَاهٍ."],[50,38,"لُّغُوبٍ","تَعَبٍ، وَنَصَبٍ."],[50,39,"وَسَبِّحْ بِحَمْدِ رَبِّكَ","صَلِّ حَامِدًا لَهُ."],[50,39,"قَبْلَ طُلُوعِ ٱلشَّمْسِ","صَلَاةَ الفَجْرِ."],[50,39,"وَقَبْلَ ٱلْغُرُوبِ","صَلَاةَ العَصْرِ."],[50,40,"وَأَدْبَٰرَ ٱلسُّجُودِ","سَبِّحْ عَقِبَ الصَّلَوَاتِ، أَوْ صَلِّ النَّوَافِلَ بَعْدَ الفَرَائِضِ."],[50,41,"ٱلْمُنَادِ","المَلَكُ المُوَكَّلُ بِالنَّفْخِ فِي الصُّورِ؛ وَهُوَ: إِسْرَافِيلُ عليه السلام."],[50,42,"ٱلصَّيْحَةَ","نَفْخَةَ البَعْثِ."],[50,42,"يَوْمُ ٱلْخُرُوجِ","أَيْ: مِنَ القُبُورِ."],[50,43,"ٱلْمَصِيرُ","المَرْجِعُ، وَالمَآلُ."],[50,44,"تَشَقَّقُ ٱلْأَرْضُ","تَتَصَدَّعُ."],[50,44,"سِرَاعًا","يَخْرُجُونَ مُسْرِعِينَ."],[50,45,"بِجَبَّارٍ","بِمُسَلَّطٍ تُجْبِرُهُمْ عَلَى الإِيمَانِ."],[50,45,"يَخَافُ وَعِيدِ","يَخْشَى وَعِيدِي."],[51,1,"وَٱلذَّٰرِيَٰتِ","قَسَمٌ بِالرِّيَاحِ، المُثِيرَاتِ لِلتُّرَابِ."],[51,2,"فَٱلْحَٰمِلَٰتِ وِقْرًا","فَالسُّحُبِ الحَامِلَاتِ ثِقْلًا عَظِيمًا مِنَ المَاءِ."],[51,3,"فَٱلْجَٰرِيَٰتِ يُسْرًا","فَالسُّفُنِ الَّتِي تَجْرِي فِي البِحَارِ بِيُسْرٍ."],[51,4,"فَٱلْمُقَسِّمَٰتِ أَمْرًا","فَالمَلَائِكَةِ الَّتِي تُقَسِّمُ أَمْرَ اللهِ فِي خَلْقِهِ."],[51,6,"ٱلدِّينَ","الحِسَابَ، وَالجَزَاءَ."],[51,7,"ٱلْحُبُكِ","ذَاتِ الخَلْقِ الحَسَنِ، وَذَاتِ الطُّرُقِ الَّتِي تَسِيرُ فِيهَا الكَوَاكِبُ."],[51,8,"قَوْلٍ مُّخْتَلِفٍ","مُتَنَاقِضٍ، مُضْطَرِبٍ فِي القُرْآنِ وَالرَّسُولِ صلى الله عليه وسلم."],[51,9,"يُؤْفَكُ عَنْهُ","يُصْرَفُ عَنِ القُرْآنِ وَالرَّسُولِ صلى الله عليه وسلم."],[51,10,"ٱلْخَرَّٰصُونَ","قُتِلَ، وَلُعِنَ الكَذَّابُونَ، الظَّانُّونَ غَيْرَ الحَقِّ."],[51,11,"غَمْرَةٍ","جَهْلٍ يَغْمُرُهُمْ."],[51,11,"سَاهُونَ","غَافِلُونَ عَنْ أَمْرِ الآخِرَةِ."],[51,12,"يَسْـَٔلُونَ","سُؤَالَ اسْتِبْعَادٍ وَإِنْكَارٍ."],[51,12,"أَيَّانَ يَوْمُ ٱلدِّينِ","مَتَى يَوْمُ الجَزَاءِ؟!"],[51,13,"يُفْتَنُونَ","يُحْرَقُونَ، وَيُعَذَّبُونَ."],[51,14,"فِتْنَتَكُمْ","عَذَابَكُمْ."],[51,17,"يَهْجَعُونَ","يَنَامُونَ."],[51,18,"وَبِٱلْأَسْحَارِ","آخِرَ اللَّيْلِ، قُبَيْلَ الفَجْرِ."],[51,19,"لِّلسَّآئِلِ","لِلْمُحْتَاجِ الَّذِي يَسْأَلُ النَّاسَ."],[51,19,"وَٱلْمَحْرُومِ","الَّذِي لَا يَسْأَلُ النَّاسَ حَيَاءً."],[51,23,"إِنَّهُۥ لَحَقٌّ","إِنَّ مَا وَعَدَكُمْ بِهِ مِنَ الجَزَاءِ لَحَقٌّ ثَابِتٌ."],[51,24,"ضَيْفِ إِبْرَٰهِيمَ","أَضْيَافِهِ مِنَ المَلَائِكَةِ."],[51,25,"مُّنكَرُونَ","غُرَبَاءُ لَا تُعْرَفُونَ."],[51,26,"فَرَاغَ","مَالَ، وَعَدَلَ بِخُفْيَةٍ."],[51,28,"فَأَوْجَسَ مِنْهُمْ","أَحَسَّ فِي نَفْسِهِ مِنْهُمْ."],[51,28,"بِغُلَٰمٍ عَلِيمٍ","هُوَ: إِسْحَاقُ عليه السلام."],[51,29,"ٱمْرَأَتُهُۥ","هِيَ: سَارَةُ."],[51,29,"صَرَّةٍ","صَيْحَةٍ، وَضَجَّةٍ."],[51,29,"فَصَكَّتْ وَجْهَهَا","لَطَمَتْهُ بِيَدِهَا تَعَجُّبًا."],[51,29,"عَقِيمٌ","لَا يُولَدُ لِي وَلَدٌ."],[51,31,"خَطْبُكُمْ","مَا شَأْنُكُمْ؟"],[51,34,"مُّسَوَّمَةً","مُعَلَّمَةً بِأَنَّهَا لِعَذَابِ المُسْرِفِينَ."],[51,37,"فِيهَآ ءَايَةً","فِي قَرْيَتِهِمْ أَثَرًا مِنَ العَذَابِ بَاقِيًا؛ عَلَامَةً عَلَى قُدْرَةِ اللهِ."],[51,38,"وَفِى مُوسَىٰٓ","فِي إِرْسَالِنَا مُوسَى عليه السلام: آيَةٌ لِلَّذِينَ يَخَافُونَ العَذَابَ."],[51,38,"بِسُلْطَٰنٍ مُّبِينٍ","بِآيَاتٍ، وَمُعْجِزَاتٍ ظَاهِرَةٍ."],[51,39,"فَتَوَلَّىٰ بِرُكْنِهِۦ","أَعْرَضَ فِرْعَوْنُ؛ مُغْتَرًّا بِقُوَّتِهِ وَجَانِبِهِ."],[51,40,"فَنَبَذْنَٰهُمْ فِى ٱلْيَمِّ","طَرَحْنَاهُمْ فِي البَحْرِ."],[51,40,"مُلِيمٌ","آتٍ بِمَا يُلَامُ عَلَيْهِ."],[51,41,"ٱلْعَقِيمَ","الَّتِي لَا بَرَكَةَ فِيهَا، وَلَا تَأْتِي بِخَيْرٍ."],[51,42,"مَا تَذَرُ","مَا تَدَعُ."],[51,42,"كَٱلرَّمِيمِ","كَالشَّيْءِ البَالِي."],[51,43,"تَمَتَّعُوا۟ حَتَّىٰ حِينٍ","انْتَفِعُوا بِحَيَاتِكُمْ حَتَّى تَنْتَهِيَ آجَالُكُمْ."],[51,44,"فَعَتَوْا۟","تَكَبَّرُوا، وَعَصَوْا."],[51,44,"ٱلصَّٰعِقَةُ","الصَّيْحَةُ المُهْلِكَةُ."],[51,45,"قِيَامٍ","مِنْ نُهُوضٍ، وَلَا هَرَبٍ."],[51,47,"بِأَيْيْدٍ","بِقُوَّةٍ، وَقُدْرَةٍ عَظِيمَةٍ."],[51,48,"فَرَشْنَٰهَا","مَهَّدْنَاهَا، وَبَسَطْنَاهَا."],[51,49,"زَوْجَيْنِ","صِنْفَيْنِ، وَنَوْعَيْنِ مُخْتَلِفَيْنِ."],[51,53,"أَتَوَاصَوْا۟ بِهِۦ","هَلْ وَصَّى بَعْضُهُمْ بَعْضًا بِالتَّكْذِيبِ؟"],[51,53,"طَاغُونَ","مُتَجَاوِزُونَ الحَدَّ فِي الكُفْرِ."],[51,59,"ذَنُوبًا","نَصِيبًا مِنَ العَذَابِ سَيَنْزِلُ بِهِمْ."],[52,1,"وَٱلطُّورِ","قَسَمٌ بِالجَبَلِ الَّذِي كَلَّمَ اللهُ عَلَيْهِ مُوسَى عليه السلام."],[52,2,"وَكِتَٰبٍ مَّسْطُورٍ","قَسَمٌ بِالقُرْآنِ المَكْتُوبِ."],[52,3,"فِى رَقٍّ مَّنشُورٍ","فِي صُحُفٍ مَنْشُورَةٍ، مَبْسُوطَةٍ."],[52,4,"وَٱلْبَيْتِ ٱلْمَعْمُورِ","قَسَمٌ بِالبَيْتِ المَعْمُورِ بِالمَلَائِكَةِ الَّذِينَ يَطُوفُونَ بِهِ دَائِمًا، وَهُوَ فِي السَّمَاءِ بِحِذَاءِ الكَعْبَةِ، يَطُوفُ بِهِ كُلَّ يَوْمٍ سَبْعُونَ أَلْفَ مَلَكٍ."],[52,5,"وَٱلسَّقْفِ ٱلْمَرْفُوعِ","قَسَمٌ بِالسَّمَاءِ."],[52,6,"ٱلْمَسْجُورِ","المَمْلُوءِ بِالمَاءِ."],[52,9,"تَمُورُ","تَتَحَرَّكُ، وَتَضْطَرِبُ."],[52,13,"يُدَعُّونَ","يُدْفَعُونَ بِعُنْفٍ وَشِدَّةٍ."],[52,16,"ٱصْلَوْهَا","ادْخُلُوهَا وَذُوقُوا حَرَّهَا."],[52,18,"فَٰكِهِينَ","مُتَلَذِّذِينَ، نَاعِمِينَ، مَسْرُورِينَ."],[52,20,"مَصْفُوفَةٍ","مُتَقَابِلَةٍ، وَبَعْضُهَا إِلَى جَنْبِ بَعْضٍ."],[52,20,"بِحُورٍ","نِسَاءٍ بِيضٍ."],[52,20,"عِينٍ","وَاسِعَاتِ العُيُونِ، حِسَانِهَا."],[52,21,"وَمَآ أَلَتْنَٰهُم","مَا نَقَصْنَا الآبَاءَ بِهَذَا الإِلْحَاقِ."],[52,21,"رَهِينٌ","مَرْهُونٌ بِعَمَلِهِ، لَا يَحْمِلُ ذَنْبَ غَيْرِهِ."],[52,23,"يَتَنَٰزَعُونَ","يَتَعَاطَوْنَ بَيْنَهُمْ، وَيُنَاوِلُ بَعْضُهُمْ بَعْضًا."],[52,23,"كَأْسًا","مِنَ الخَمْرِ."],[52,23,"لَّا لَغْوٌ فِيهَا","لَا كَلَامٌ سَاقِطٌ أَثْنَاءَ شُرْبِهَا."],[52,23,"وَلَا تَأْثِيمٌ","وَلَا يَقَعُ بِسَبَبِهَا إِثْمٌ فِي قَوْلٍ أَوْ فِعْلٍ."],[52,24,"مَّكْنُونٌ","مَصُونٌ، مَسْتُورٌ فِي أَصْدَافِهِ."],[52,26,"مُشْفِقِينَ","خَائِفِينَ مِنَ العَذَابِ."],[52,27,"عَذَابَ ٱلسَّمُومِ","عَذَابِ النَّارِ الَّتِي تَنْفُذُ فِي المَسَامِّ."],[52,28,"ٱلْبَرُّ","المُحْسِنُ، كَثِيرُ الخَيْرِ."],[52,29,"بِنِعْمَتِ رَبِّكَ","بِسَبَبِ إِنْعَامِ اللهِ عَلَيْكَ بِالنُّبُوَّةِ، وَرَجَاحَةِ العَقْلِ."],[52,29,"بِكَاهِنٍ","يَدَّعِي عِلْمَ الغَيْبِ."],[52,30,"أَمْ","بَلْ."],[52,30,"نَّتَرَبَّصُ بِهِۦ","نَنْتَظِرُ بِهِ."],[52,30,"رَيْبَ ٱلْمَنُونِ","نُزُولَ المَوْتِ، وَحَوَادِثَ الدَّهْرِ."],[52,32,"أَحْلَٰمُهُم","عُقُولُهُمْ."],[52,32,"طَاغُونَ","مُتَجَاوِزُونَ الحَدَّ فِي العِصْيَانِ."],[52,33,"تَقَوَّلَهُۥ","اخْتَلَقَ القُرْآنَ مِنْ عِنْدِ نَفْسِهِ."],[52,37,"خَزَآئِنُ رَبِّكَ","خَزَائِنُ رِزْقِهِ وَرَحْمَتِهِ."],[52,37,"ٱلْمُصَيْطِرُونَ","المُتَسَلِّطُونَ، الجَبَّارُونَ."],[52,38,"سُلَّمٌ","مِصْعَدٌ إِلَى السَّمَاءِ."],[52,38,"بِسُلْطَٰنٍ مُّبِينٍ","بِحُجَّةٍ بَيِّنَةٍ تُصَدِّقُ دَعْوَاهُ."],[52,40,"مِّن مَّغْرَمٍ","مِنْ الْتِزَامِ غَرَامَةٍ تَطْلُبُهَا مِنْهُمْ."],[52,40,"مُّثْقَلُونَ","مُتْعَبُونَ، مُجْهَدُونَ."],[52,42,"كَيْدًا","مَكْرًا."],[52,42,"ٱلْمَكِيدُونَ","يَرْجِعُ مَكْرُهُمْ عَلَى أَنْفُسِهِمْ."],[52,44,"كِسْفًا","قِطَعًا."],[52,44,"مَّرْكُومٌ","مُتَرَاكِمٌ بَعْضُهُ فَوْقَ بَعْضٍ."],[52,45,"يُصْعَقُونَ","يُهْلَكُونَ."],[52,46,"لَا يُغْنِى عَنْهُمْ","لَا يَدْفَعُ عَنْهُمْ."],[52,47,"دُونَ ذَٰلِكَ","قَبْلَ ذَلِكَ يَقَعُ فِي الدُّنْيَا عَلَيْهِمْ."],[52,48,"بِأَعْيُنِنَا","بِمَرْأًى مِنَّا، وَحِفْظٍ، وَاعْتِنَاءٍ؛ وَفِيهِ: إِثْبَاتُ صِفَةِ العَيْنَيْنِ للهِ؛ كَمَا يَلِيقُ بِهِ؛ بِلَا تَكْيِيفٍ، وَلَا تَمْثِيلٍ، وَجَاءَتْ بِصِيغَةِ الجَمْعِ لِلتَّعْظِيمِ."],[52,48,"وَسَبِّحْ بِحَمْدِ رَبِّكَ","نَزِّهْ رَبَّكَ، حَامِدًا لَهُ."],[52,48,"حِينَ تَقُومُ","لِلصَّلَاةِ، وَمِنْ نَوْمِكَ."],[52,49,"فَسَبِّحْهُ","نَزِّهْهُ، وَعَظِّمْهُ، وَصَلِّ لَهُ."],[52,49,"وَإِدْبَٰرَ ٱلنُّجُومِ","نَزِّهْهُ، وَصَلِّ لَهُ صَلَاةَ الصُّبْحِ وَقْتَ غَيْبَةِ النُّجُومِ."],[53,1,"وَٱلنَّجْمِ إِذَا هَوَىٰ","قَسَمٌ بِالثُّرَيَّا إِذَا غَابَتْ."],[53,2,"مَا ضَلَّ","مَا حَادَ عَنِ الحَقِّ."],[53,2,"وَمَا غَوَىٰ","مَا اعْتَقَدَ بَاطِلًا قَطُّ."],[53,4,"إِنْ هُوَ","أَيْ: القُرْآنُ، وَالسُّنَّةُ."],[53,5,"شَدِيدُ ٱلْقُوَىٰ","مَلَكٌ شَدِيدُ القُوَّةِ؛ وَهُوَ جِبْرِيلُ عليه السلام."],[53,6,"ذُو مِرَّةٍ","صَاحِبُ قُوَّةٍ، وَمَنْظَرٍ حَسَنٍ."],[53,6,"فَٱسْتَوَىٰ","ظَهَرَ مُسْتَوِيًا عَلَى صُورَتِهِ الحَقِيقِيَّةِ لِلرَّسُولِ صلى الله عليه وسلم."],[53,7,"بِٱلْأُفُقِ ٱلْأَعْلَىٰ","أُفُقِ الشَّمْسِ عِنْدَ مَطْلَعِهَا."],[53,8,"دَنَا","اقْتَرَبَ جِبْرِيلُ عليه السلام مِنْ نَبِيِّنَا مُحَمَّدٍ صلى الله عليه وسلم."],[53,8,"فَتَدَلَّىٰ","زَادَ فِي القُرْبِ."],[53,9,"قَابَ قَوْسَيْنِ","كَانَ دُنُوُّهُ مِقْدَارَ قَوْسَيْنِ."],[53,10,"عَبْدِهِۦ","عَبْدِ اللهِ؛ وَهُوَ نَبِيُّنَا مُحَمَّدٌ صلى الله عليه وسلم."],[53,12,"أَفَتُمَٰرُونَهُۥ","أَتُكَذِّبُونَ مُحَمَّدًا صلى الله عليه وسلم؛ فَتُجَادِلُونَهُ؟!"],[53,13,"نَزْلَةً أُخْرَىٰ","مَرَّةً أُخْرَى فِي صُورَتِهِ الخِلْقِيَّةِ."],[53,14,"سِدْرَةِ ٱلْمُنتَهَىٰ","شَجَرَةُ نَبِقٍ فِي السَّمَاءِ السَّابِعَةِ، يَنْتَهِي إِلَيْهَا مَا يُعْرَجُ بِهِ مِنَ الأَرْضِ، وَيَنْتَهِي إِلَيْهَا مَا يُهْبَطُ بِهِ مِنْ فَوْقِهَا."],[53,17,"مَا زَاغَ ٱلْبَصَرُ","مَا مَالَ بَصَرُهُ يَمِينًا، وَلَا شِمَالًا."],[53,17,"وَمَا طَغَىٰ","مَا جَاوَزَ مَا أُمِرَ بِرُؤْيَتِهِ."],[53,18,"لَقَدْ رَأَىٰ","لَيْلَةَ المِعْرَاجِ."],[53,19,"ٱللَّٰتَ وَٱلْعُزَّىٰ","اسْمَانِ لِصَنَمَيْنِ كَانُوا يَعْبُدُونَهُمَا فِي الجَاهِلِيَّةِ."],[53,20,"وَمَنَوٰةَ","اسْمُ صَنَمٍ كَانُوا يَعْبُدُونَهُ فِي الجَاهِلِيَّةِ."],[53,22,"ضِيزَىٰ","جَائِرَةٌ."],[53,23,"سُلْطَٰنٍ","حُجَّةٍ تُصَدِّقُ دَعْوَاكُمْ فِيهَا."],[53,26,"لَا تُغْنِى","لَا تَنْفَعُ."],[53,31,"بِٱلْحُسْنَى","بِالجَنَّةِ."],[53,32,"وَٱلْفَوَٰحِشَ","مَا عَظُمَ قُبْحُهُ مِنَ الكَبَائِرِ."],[53,32,"ٱللَّمَمَ","الذُّنُوبَ الصِّغَارَ الَّتِي لَا يُصِرُّ صَاحِبُهَا عَلَيْهَا، أَوْ يُلِمُّ بِهَا العَبْدُ عَلَى وَجْهِ النُّدْرَةِ."],[53,32,"فَلَا تُزَكُّوٓا۟ أَنفُسَكُمْ","لَا تَمْدَحُوهَا، وَتَصِفُوهَا بِالتَّقْوَى."],[53,34,"وَأَكْدَىٰ","تَوَقَّفَ عَنِ العَطَاءِ، وَقَطَعَ مَعْرُوفَهُ بُخْلًا."],[53,38,"أَلَّا تَزِرُ وَازِرَةٌ","أَنَّهُ لَا تَحْمِلُ نَفْسٌ آثِمَةٌ."],[53,38,"وِزْرَ أُخْرَىٰ","إِثْمَ نَفْسٍ أُخْرَى."],[53,42,"ٱلْمُنتَهَىٰ","انْتِهَاءَ جَمِيعِ خَلْقِهِ يَوْمَ القِيَامَةِ."],[53,47,"ٱلنَّشْأَةَ ٱلْأُخْرَىٰ","إِعَادَةَ خَلْقِهِمْ بَعْدَ فَنَائِهِمْ."],[53,48,"أَغْنَىٰ وَأَقْنَىٰ","مَلَّكَهُمُ الأَمْوَالَ، وَأَرْضَاهُمْ بِمَا أَعْطَاهُمْ."],[53,49,"ٱلشِّعْرَىٰ","نَجْمٌ مُضِيءٌ كَانَ أَهْلُ الجَاهِلِيَّةِ يَعْبُدُونَهُ مِنْ دُونِ اللهِ."],[53,50,"عَادًا ٱلْأُولَىٰ","قَوْمَ هُودٍ عليه السلام."],[53,51,"وَثَمُودَا۠","قَوْمَ صَالِحٍ عليه السلام."],[53,53,"وَٱلْمُؤْتَفِكَةَ","مَدَائِنَ قَوْمِ لُوطٍ عليه السلام، سُمِّيَتْ بِذَلِكَ؛ لِأَنَّ اللهَ قَلَبَهَا عَلَى أَهْلِهَا."],[53,53,"أَهْوَىٰ","أَسْقَطَهَا إِلَى الأَرْضِ بَعْدَ رَفْعِهَا."],[53,54,"فَغَشَّىٰهَا","فَأَلْبَسَهَا مِنَ الحِجَارَةِ."],[53,55,"ءَالَآءِ رَبِّكَ","نِعَمِ رَبِّكَ."],[53,55,"تَتَمَارَىٰ","تَتَشَكَّكُ أَيُّهَا الإِنْسَانُ المُكَذِّبُ."],[53,56,"هَٰذَا نَذِيرٌ","مُحَمَّدٌ صلى الله عليه وسلم مُنْذِرٌ بِالحَقِّ كَمَنْ سَبَقَهُ."],[53,57,"أَزِفَتِ","قَرُبَتْ، وَدَنَا وَقْتُهَا."],[53,57,"ٱلْـَٔازِفَةُ","القِيَامَةُ، سُمِّيَتْ بِذَلِكَ؛ لِقُرْبِ مِيعَادِهَا."],[53,58,"كَاشِفَةٌ","نَفْسٌ تَدْفَعُ أَهْوَالَهَا، وَتَطَّلِعُ عَلَى وَقْتِ وُقُوعِهَا."],[53,61,"سَٰمِدُونَ","لَاهُونَ، مُعْرِضُونَ."],[54,1,"وَٱنشَقَّ ٱلْقَمَرُ","انْفَلَقَ القَمَرُ فَلْقَتَيْنِ؛ مُعْجِزَةً لِلنَّبِيِّ صلى الله عليه وسلم، عِنْدَمَا سَأَلَهُ المُشْرِكُونَ آيَةً."],[54,2,"مُّسْتَمِرٌّ","بَاطِلٌ مُضْمَحِلٌّ، أَوْ قَوِيٌّ دَائِمٌ."],[54,3,"مُّسْتَقِرٌّ","مُنْتَهٍ إِلَى غَايَةٍ يَسْتَقِرُّ عَلَيْهَا."],[54,4,"مُّزْدَجَرٌ","كِفَايَةٌ لِرَدْعِهِمْ عَنْ كُفْرِهِمْ."],[54,6,"شَىْءٍ نُّكُرٍ","أَمْرٍ فَظِيعٍ مُنْكَرٍ؛ وَهُوَ مَوْقِفُ الحِسَابِ."],[54,7,"خُشَّعًا","ذَلِيلَةً مِنْ شِدَّةِ الهَوْلِ."],[54,7,"ٱلْأَجْدَاثِ","القُبُورِ."],[54,8,"مُّهْطِعِينَ","مُسْرِعِينَ."],[54,9,"وَٱزْدُجِرَ","زُجِرَ، وَنُهِرَ عَنْ تَبْلِيغِ الدَّعْوَةِ."],[54,10,"مَغْلُوبٌ","ضَعِيفٌ عَنْ مُقَاوَمَتِهِمْ."],[54,11,"مُّنْهَمِرٍ","مُتَدَفِّقٍ."],[54,12,"وَفَجَّرْنَا","شَقَقْنَا."],[54,12,"فَٱلْتَقَى ٱلْمَآءُ","أَيْ: الْتَقَى مَاءُ السَّمَاءِ وَالمَاءُ المُتَفَجِّرُ مِنَ الأَرْضِ."],[54,12,"قُدِرَ","قَدَّرَهُ اللهُ فِي الأَزَلِ؛ وَهُوَ إِهْلَاكُهُمْ بِالطُّوفَانِ."],[54,13,"ذَاتِ أَلْوَٰحٍ وَدُسُرٍ","سَفِينَةٍ ذَاتِ أَلْوَاحٍ، وَمَسَامِيرَ شُدَّتْ بِهَا."],[54,14,"بِأَعْيُنِنَا","بِمَرْأًى مِنَّا، وَحِفْظٍ، وَفِيهَا: إِثْبَاتُ صِفَةِ العَيْنَيْنِ للهِ تَعَالَى؛ كَمَا يَلِيقُ بِجَلَالِهِ."],[54,14,"جَزَآءً","أُغْرِقُوا انْتِصَارًا مِنَّا لِنُوحٍ عليه السلام، وَعُقُوبَةً لَهُمْ عَلَى كُفْرِهِمْ."],[54,14,"لِّمَن كَانَ كُفِرَ","هُوَ: نُوحٌ عليه السلام."],[54,15,"تَّرَكْنَٰهَآ ءَايَةً","أَبْقَيْنَا قِصَّةَ نُوحٍ عليه السلام، وَعُقُوبَةَ قَوْمِهِ؛ عِبْرَةً، وَدَلِيلًا عَلَى قُدْرَتِنَا."],[54,15,"مُّدَّكِرٍ","مُعْتَبِرٍ، وَمُتَّعِظٍ."],[54,16,"نُذُرِ","إِنْذَارِي."],[54,19,"صَرْصَرًا","شَدِيدَةَ البَرْدِ."],[54,19,"يَوْمِ نَحْسٍ","يَوْمِ شُؤْمٍ."],[54,19,"مُّسْتَمِرٍّ","دَائِمِ الشُّؤْمِ."],[54,20,"تَنزِعُ ٱلنَّاسَ","تَقْتَلِعُهُمْ مِنْ مَوَاضِعِهِمْ، وَتَرْمِي بِهِمْ عَلَى رُؤُوسِهِمْ، فَتَدُقُّ أَعْنَاقَهُمْ، وَتَنْفَصِلُ عَنْ أَجْسَادِهِمْ."],[54,20,"أَعْجَازُ نَخْلٍ","أُصُولُ نَخْلٍ بِلَا رُؤُوسٍ."],[54,20,"مُّنقَعِرٍ","مُنْقَلِعٍ مِنْ أَصْلِهِ."],[54,24,"وَسُعُرٍ","جُنُونٍ."],[54,25,"أَشِرٌ","مُتَكَبِّرٌ، مُتَجَبِّرٌ."],[54,27,"فِتْنَةً لَّهُمْ","اخْتِبَارًا لَهُمْ."],[54,27,"فَٱرْتَقِبْهُمْ","انْتَظِرْ يَا صَالِحُ مَا يَحِلُّ بِهِمْ مِنَ العَذَابِ."],[54,27,"وَٱصْطَبِرْ","اصْبِرْ عَلَى الدَّعْوَةِ، وَالأَذَى."],[54,28,"وَنَبِّئْهُمْ","أَخْبِرْهُمْ."],[54,28,"قِسْمَةٌۢ بَيْنَهُمْ","مَقْسُومٌ بَيْنَ قَوْمِكَ وَالنَّاقَةِ؛ يَوْمٌ لَهُمْ، وَيَوْمٌ لِلنَّاقَةِ."],[54,28,"شِرْبٍ","نَصِيبٌ مِنَ المَاءِ."],[54,28,"مُّحْتَضَرٌ","يَحْضُرُهُ صَاحِبُهُ فِي يَوْمِهِ، وَيُحْرَمُ مِنْهُ الآخَرُ."],[54,29,"فَنَادَوْا۟ صَاحِبَهُمْ","دَعَوْهُ لِيَعْقِرَ النَّاقَةَ."],[54,29,"فَتَعَاطَىٰ","تَنَاوَلَ النَّاقَةَ بِيَدِهِ."],[54,29,"فَعَقَرَ","نَحَرَ."],[54,31,"كَهَشِيمِ ٱلْمُحْتَظِرِ","كَالزَّرْعِ اليَابِسِ الَّذِي دَاسَتْهُ البَهَائِمُ فَتَهَشَّمَ."],[54,32,"مُّدَّكِرٍ","مُتَّعِظٍ."],[54,33,"بِٱلنُّذُرِ","بِآيَاتِ اللهِ الَّتِي أُنْذِرُوا بِهَا."],[54,34,"حَاصِبًا","حِجَارَةً."],[54,34,"بِسَحَرٍ","فِي آخِرِ اللَّيْلِ."],[54,36,"أَنذَرَهُم بَطْشَتَنَا","خَوَّفَهُمْ لُوطٌ عليه السلام بِأْسَ اللهِ."],[54,36,"فَتَمَارَوْا۟","شَكُّوا، وَكَذَّبُوا."],[54,37,"رَٰوَدُوهُ","طَلَبُوا مِنْهُ أَنْ يَفْعَلُوا الفَاحِشَةَ بِهِمْ."],[54,37,"فَطَمَسْنَآ","أَعْمَيْنَا، وَحَجَبْنَا؛ عَاقَبَهُمُ اللهُ بِالطَّمْسِ، ثُمَّ قَلَبَ قُرَاهُمْ، ثُمَّ أَمْطَرَهُمْ حِجَارَةً مِنْ طِينٍ."],[54,38,"بُكْرَةً","أَوَّلَ النَّهَارِ."],[54,38,"مُّسْتَقِرٌّ","دَائِمٌ مُتَّصِلٌ بِعَذَابِ الآخِرَةِ."],[54,41,"ءَالَ فِرْعَوْنَ","أَتْبَاعَهُ، وَقَوْمَهُ."],[54,41,"ٱلنُّذُرُ","الإِنْذَارُ بِالعُقُوبَةِ."],[54,42,"عَزِيزٍ","غَالِبٍ، قَوِيٍّ لَا يُغْلَبُ."],[54,43,"ٱلزُّبُرِ","الكُتُبِ المُنَزَّلَةِ عَلَى الأَنْبِيَاءِ عليهم السلام."],[54,44,"نَحْنُ جَمِيعٌ مُّنتَصِرٌ","جَمَاعَةٌ مُنْتَصِرَةٌ لَا يَغْلِبُنَا مَنْ أَرَادَنَا بِسُوءٍ."],[54,45,"ٱلْجَمْعُ","جَمَاعَةُ كُفَّارِ مَكَّةَ."],[54,45,"وَيُوَلُّونَ ٱلدُّبُرَ","يَفِرُّونَ مُنْهَزِمِينَ، قَدْ وَلَّوْكُمْ أَدْبَارَهُمْ؛ وَقَدْ حَصَلَ هَذَا فِي غَزْوَةِ بَدْرٍ."],[54,46,"أَدْهَىٰ وَأَمَرُّ","أَعْظَمُ وَأَشَدُّ مَرَارَةً مِمَّا لَحِقَهُمْ مِنَ العَذَابِ فِي بَدْرٍ."],[54,47,"وَسُعُرٍ","عَذَابٍ."],[54,48,"مَسَّ سَقَرَ","إِصَابَةَ جَهَنَّمَ، وَعَذَابَهَا لَكُمْ."],[54,50,"إِلَّا وَٰحِدَةٌ","إِلَّا قَوْلَةٌ وَاحِدَةٌ، وَهِيَ: «كُنْ»."],[54,50,"كَلَمْحٍۭ بِٱلْبَصَرِ","سَرِيعٍ لَا يَتَأَخَّرُ كَطَرْفَةِ العَيْنِ."],[54,51,"أَشْيَاعَكُمْ","أَشْبَاهَكُمْ فِي الكُفْرِ."],[54,51,"مُّدَّكِرٍ","مُتَّعِظٍ."],[54,52,"فِى ٱلزُّبُرِ","مَكْتُوبٌ فِي الكُتُبِ الَّتِي بِيَدِ الحَفَظَةِ."],[54,53,"مُّسْتَطَرٌ","مَسْطُورٌ مَكْتُوبٌ فِي صَحَائِفِ أَعْمَالِهِمْ."],[54,54,"وَنَهَرٍ","أَنْهَارٍ."],[54,55,"مَقْعَدِ صِدْقٍ","مَجْلِسِ حَقٍّ؛ لَا لَغْوَ فِيهِ، وَلَا تَأْثِيمَ."],[55,4,"ٱلْبَيَانَ","النُّطْقَ؛ بِأَنْ يُبِينَ عَمَّا فِي نَفْسِهِ بِالنُّطْقِ."],[55,5,"بِحُسْبَانٍ","يَجْرِيَانِ مُتَعَاقِبَيْنِ، بِحِسَابٍ مُتْقَنٍ لَا يَضْطَرِبُ."],[55,6,"وَٱلنَّجْمُ","الكَوْكَبُ فِي السَّمَاءِ."],[55,7,"وَوَضَعَ ٱلْمِيزَانَ","وَضَعَ فِي الأَرْضِ العَدْلَ."],[55,8,"أَلَّا تَطْغَوْا۟","لِئَلَّا تَعْتَدُوا، وَتَخُونُوا."],[55,9,"بِٱلْقِسْطِ","بِالعَدْلِ."],[55,9,"تُخْسِرُوا۟","وَلَا تَنْقُصُوا."],[55,10,"وَضَعَهَا لِلْأَنَامِ","مَهَّدَهَا؛ لِيَسْتَقِرَّ عَلَيْهَا الخَلْقُ."],[55,11,"ٱلْأَكْمَامِ","الأَوْعِيَةِ الَّتِي يَكُونُ مِنْهَا التَّمْرُ."],[55,12,"وَٱلْحَبُّ ذُو ٱلْعَصْفِ","وَفِيهَا الحَبُّ ذُو القِشْرِ وَالتِّبْنِ؛ رِزْقًا لَكُمْ وَلِأَنْعَامِكُمْ."],[55,12,"وَٱلرَّيْحَانُ","كُلُّ نَبْتٍ طَيِّبِ الرَّائِحَةِ."],[55,14,"ٱلْإِنسَٰنَ","آدَمَ عليه السلام."],[55,14,"صَلْصَٰلٍ","طِينٍ يَابِسٍ يُسْمَعُ لَهُ صَلْصَلَةٌ."],[55,14,"كَٱلْفَخَّارِ","هُوَ الطِّينُ الَّذِي يُطْبَخُ لِيَتَحَجَّرَ."],[55,15,"ٱلْجَآنَّ","إِبْلِيسَ."],[55,15,"مَّارِجٍ مِّن نَّارٍ","لَهَبِ النَّارِ المُخْتَلِطِ بَعْضُهُ بِبَعْضٍ."],[55,16,"ءَالَآءِ رَبِّكُمَا","نِعَمِ رَبِّكُمَا."],[55,16,"تُكَذِّبَانِ","يَا مَعْشَرَ الإِنْسِ وَالجِنِّ."],[55,17,"ٱلْمَشْرِقَيْنِ","مَشْرِقِ الشَّمْسِ؛ فِي الشِّتَاءِ، وَالصَّيْفِ."],[55,17,"ٱلْمَغْرِبَيْنِ","مَغْرِبِ الشَّمْسِ؛ فِي الشِّتَاءِ، وَالصَّيْفِ."],[55,19,"مَرَجَ ٱلْبَحْرَيْنِ","خَلَطَ مَاءَ البَحْرَيْنِ: العَذْبَ، وَالمَالِحَ."],[55,20,"بَرْزَخٌ","حَاجِزٌ."],[55,20,"لَّا يَبْغِيَانِ","لَا يَطْغَى أَحَدُهُمَا عَلَى الآخَرِ، وَيَذْهَبُ بِخَصَائِصِهِ."],[55,24,"ٱلْجَوَارِ","السُّفُنُ الجَارِيَةُ الضَّخْمَةُ."],[55,24,"ٱلْمُنشَـَٔاتُ","المَرْفُوعَاتُ الأَشْرِعَةِ."],[55,24,"كَٱلْأَعْلَٰمِ","كَالجِبَالِ فِي عِظَمِهَا."],[55,26,"فَانٍ","هَالِكٌ."],[55,27,"ذُو ٱلْجَلَٰلِ","صَاحِبُ العَظَمَةِ، وَالكِبْرِيَاءِ."],[55,27,"وَٱلْإِكْرَامِ","الفَضْلِ، وَالجُودِ."],[55,29,"فِى شَأْنٍ","أَيْ: أَمْرٍ فَيُعِزُّ وَيُذِلُّ، وَيُعْطِي وَيَمْنَعُ، وَيُحْيِي وَيُمِيتُ."],[55,33,"تَنفُذُوا۟","تَجِدُونَ مَنْفَذًا تَهْرُبُونَ مِنْهُ."],[55,33,"أَقْطَارِ","نَوَاحِي."],[55,33,"فَٱنفُذُوا۟","اهْرُبُوا (أَمْرُ تَعْجِيزٍ)."],[55,33,"بِسُلْطَٰنٍ","بِقُوَّةٍ، وَكَمَالِ قُدْرَةٍ."],[55,35,"شُوَاظٌ","لَهَبٌ خَالِصٌ."],[55,35,"وَنُحَاسٌ","نُحَاسٌ مُذَابٌ، يُصَبُّ عَلَى رُؤُوسِكُمْ، أَوْ دُخَانٌ لَا لَهَبَ فِيهِ."],[55,35,"تَنتَصِرَانِ","فَلَا يَنْصُرُ بَعْضُكُمْ بَعْضًا."],[55,37,"وَرْدَةً","حَمْرَاءَ كَلَوْنِ الوَرْدِ."],[55,37,"كَٱلدِّهَانِ","كَالزَّيْتِ المَغْلِيِّ، أَوْ كَالجِلْدِ الأَحْمَرِ."],[55,41,"بِسِيمَٰهُمْ","بِعَلَامَاتِهِمْ."],[55,41,"فَيُؤْخَذُ بِٱلنَّوَٰصِى","تَأْخُذُهُمْ مَلَائِكَةُ العَذَابِ بِمُقَدِّمَةِ رُؤُوسِهِمْ، وَأَقْدَامِهِمْ فَتَرْمِيهِمْ فِي النَّارِ."],[55,44,"يَطُوفُونَ","يَتَرَدَّدُونَ."],[55,44,"حَمِيمٍ ءَانٍ","مَاءٍ حَارٍّ قَدْ بَلَغَ الغَايَةَ فِي الحَرَارَةِ."],[55,46,"خَافَ مَقَامَ رَبِّهِۦ","خَافَ القِيَامَ بَيْنَ يَدَيْ رَبِّهِ فِي مَوْقِفِ الحِسَابِ."],[55,48,"أَفْنَانٍ","أَغْصَانٍ كَثِيرَةٍ نَضِرَةٍ."],[55,52,"زَوْجَانِ","صِنْفَانِ."],[55,54,"بَطَآئِنُهَا","بِطَانَتُهَا."],[55,54,"إِسْتَبْرَقٍ","غَلِيظِ الدِّيبَاجِ."],[55,54,"وَجَنَى","ثَمَرُ."],[55,54,"دَانٍ","قَرِيبُ القِطَافِ."],[55,56,"قَٰصِرَٰتُ ٱلطَّرْفِ","قَصَرْنَ أَبْصَارَهُنَّ عَلَى أَزْوَاجِهِنَّ؛ فَلَا يَنْظُرْنَ إِلَى غَيْرِهِمْ."],[55,56,"يَطْمِثْهُنَّ","يَطَأْهُنَّ."],[55,62,"وَمِن دُونِهِمَا","أَيْ: أَدْنَى مِنَ الجَنَّتَيْنِ السَّابِقَتَيْنِ."],[55,64,"مُدْهَآمَّتَانِ","خَضْرَاوَانِ قَدِ اشْتَدَّتْ خُضْرَتُهُمَا حَتَّى مَالَتْ إِلَى السَّوَادِ."],[55,66,"نَضَّاخَتَانِ","فَوَّارَتَانِ بِالمَاءِ؛ لَا تَنْقَطِعَانِ."],[55,70,"خَيْرَٰتٌ","زَوْجَاتٌ طَيِّبَاتُ الأَخْلَاقِ."],[55,72,"حُورٌ","نِسَاءٌ بِيضٌ حِسَانٌ."],[55,72,"مَّقْصُورَٰتٌ","مَسْتُورَاتٌ مَصُونَاتٌ."],[55,74,"يَطْمِثْهُنَّ","يَطَأْهُنَّ."],[55,76,"رَفْرَفٍ خُضْرٍ","وَسَائِدَ ذَوَاتِ أَغْطِيَةٍ خُضْرٍ."],[55,76,"وَعَبْقَرِىٍّ","فُرُشٍ، وَبُسُطٍ."],[55,78,"تَبَٰرَكَ","كَثُرَتْ بَرَكَتُهُ، وَخَيْرُهُ."],[56,1,"ٱلْوَاقِعَةُ","القِيَامَةُ."],[56,2,"لَيْسَ لِوَقْعَتِهَا","لَيْسَ لِوُقُوعِهَا، وَقِيَامِهَا."],[56,2,"كَاذِبَةٌ","نَفْسٌ تُكَذِّبُ بِذَلِكَ."],[56,3,"خَافِضَةٌ رَّافِعَةٌ","تَخْفِضُ الكُفَّارَ فِي النَّارِ، وَتَرْفَعُ المُؤْمِنِينَ فِي الجَنَّةِ."],[56,4,"رُجَّتِ","حُرِّكَتْ."],[56,4,"رَجًّا","تَحْرِيكًا شَدِيدًا."],[56,5,"وَبُسَّتِ","فُتِّتَتْ."],[56,6,"هَبَآءً مُّنۢبَثًّا","غُبَارًا مُتَطَايِرًا فِي الجَوِّ."],[56,7,"أَزْوَٰجًا","أَصْنَافًا."],[56,9,"ٱلْمَشْـَٔمَةِ","الشِّمَالِ."],[56,10,"وَٱلسَّٰبِقُونَ","الَّذِينَ يَسْبِقُونَ إِلَى الخَيْرَاتِ، وَيُسَارِعُونَ لِلطَّاعَاتِ."],[56,10,"ٱلسَّٰبِقُونَ","الَّذِينَ يَسْبِقُونَ إِلَى المَنَازِلِ العَالِيَةِ فِي الجَنَّةِ."],[56,13,"ثُلَّةٌ","جَمَاعَةٌ كَثِيرَةٌ."],[56,13,"ٱلْأَوَّلِينَ","صَدْرِ هَذِهِ الأُمَّةِ وَغَيْرِهِمْ مِنَ الأُمَمِ الأُخْرَى."],[56,14,"ٱلْـَٔاخِرِينَ","آخِرِ هَذِهِ الأُمَّةِ."],[56,15,"مَّوْضُونَةٍ","مَنْسُوجَةٍ بِالذَّهَبِ."],[56,17,"وِلْدَٰنٌ مُّخَلَّدُونَ","غِلْمَانٌ لِلْخِدْمَةِ لَا يَهْرَمُونَ، وَلَا يَمُوتُونَ."],[56,18,"بِأَكْوَابٍ","أَقْدَاحٍ لَا عُرَا لَهَا، وَلَا خَرَاطِيمَ."],[56,18,"وَأَبَارِيقَ","أَوَانٍ لَهَا عُرًا، وَخَرَاطِيمُ."],[56,18,"وَكَأْسٍ","خَمْرٍ، أَوْ قَدَحٍ فِيهِ خَمْرٌ."],[56,18,"مِّن مَّعِينٍ","خَمْرٍ جَارِيَةٍ فِي الجَنَّةِ."],[56,19,"لَّا يُصَدَّعُونَ عَنْهَا","لَا تُصَدَّعُ مِنْهَا رُؤُوسُهُمْ."],[56,19,"يُنزِفُونَ","لَا تَذْهَبُ بِعُقُولِهِمْ."],[56,22,"وَحُورٌ عِينٌ","نِسَاءٌ بِيضٌ وَاسِعَاتُ الأَعْيُنِ حِسَانُهَا."],[56,23,"ٱلْمَكْنُونِ","المَصُونِ فِي أَصْدَافِهِ مِنْ صَفَائِهِنَّ، وَجَمَالِهِنَّ."],[56,25,"لَغْوًا","بَاطِلًا، وَكَلَامًا لَا خَيْرَ فِيهِ."],[56,25,"تَأْثِيمًا","مَا يَتَأَثَّمُونَ بِسَمَاعِهِ."],[56,26,"قِيلًا","قَوْلًا."],[56,26,"سَلَٰمًا","إِلَّا قَوْلًا سَالِمًا مِنْ هَذِهِ العُيُوبِ، وَإِلَّا تَسْلِيمَ بَعْضِهِمْ عَلَى بَعْضٍ."],[56,28,"سِدْرٍ مَّخْضُودٍ","شَجَرِ النَّبِقِ لَا شَوْكَ فِيهِ."],[56,29,"وَطَلْحٍ مَّنضُودٍ","مَوْزٍ مُتَرَاكِبٍ بَعْضُهُ عَلَى بَعْضٍ، أَوْ هُوَ شَجَرُ الطَّلْحِ المَعْرُوفُ، وَهُوَ أَعْظَمُ أَشْجَارِ العَرَبِ."],[56,30,"وَظِلٍّ مَّمْدُودٍ","ظِلٌّ دَائِمٌ لَا يَزُولُ."],[56,31,"مَّسْكُوبٍ","جَارٍ لَا يَنْقَطِعُ."],[56,34,"مَّرْفُوعَةٍ","مَرْفُوعَةٍ عَلَى السُّرُرِ."],[56,35,"أَنشَأْنَٰهُنَّ إِنشَآءً","خَلَقْنَا نِسَاءَ أَهْلِ الجَنَّةِ نَشْأَةً كَامِلَةً لَا تَقْبَلُ الفَنَاءَ."],[56,37,"عُرُبًا","مُتَحَبِّبَاتٍ لِأَزْوَاجِهِنَّ."],[56,37,"أَتْرَابًا","فِي سِنٍّ وَاحِدَةٍ."],[56,42,"سَمُومٍ","رِيحٍ حَارَّةٍ مِنْ حَرِّ نَارِ جَهَنَّمَ، تَأْخُذُ بِأَنْفَاسِهِمْ."],[56,42,"وَحَمِيمٍ","مَاءٍ حَارٍّ يَغْلِي."],[56,43,"يَحْمُومٍ","دُخَانٍ شَدِيدِ السَّوَادِ."],[56,44,"لَّا بَارِدٍ وَلَا كَرِيمٍ","لَا بَارِدِ المَنْزِلِ، وَلَا طَيِّبِ المَنْظَرِ."],[56,45,"مُتْرَفِينَ","مُتَنَعِّمِينَ مُنْهَمِكِينَ فِي الشَّهَوَاتِ."],[56,46,"ٱلْحِنثِ ٱلْعَظِيمِ","الذَّنْبِ العَظِيمِ؛ وَهُوَ الشِّرْكُ بِاللهِ."],[56,48,"أَوَءَابَآؤُنَا","أَنُبْعَثُ نَحْنُ، وَآبَاؤُنَا؟!"],[56,52,"زَقُّومٍ","الزَّقُّومُ: أَقْبَحُ الشَّجَرِ فِي النَّارِ."],[56,54,"ٱلْحَمِيمِ","مَاءٍ مُتَنَاهٍ فِي الحَرَارَةِ."],[56,55,"شُرْبَ ٱلْهِيمِ","كَشُرْبِ الإِبِلِ العِطَاشِ الَّتِي لَا تَرْوَى لِدَاءٍ يُصِيبُهَا."],[56,56,"نُزُلُهُمْ","مَا أُعِدَّ لَهُمْ مِنَ الجَزَاءِ."],[56,56,"يَوْمَ ٱلدِّينِ","يَوْمَ الجَزَاءِ، وَالحِسَابِ."],[56,57,"فَلَوْلَا تُصَدِّقُونَ","هَلَّا تُصَدِّقُونَ بِالبَعْثِ؟!"],[56,58,"مَّا تُمْنُونَ","النُّطَفَ الَّتِي تَقْذِفُونَهَا فِي أَرْحَامِ نِسَائِكُمْ."],[56,60,"بِمَسْبُوقِينَ","بِعَاجِزِينَ."],[56,65,"حُطَٰمًا","هَشِيمًا؛ لَا يُنْتَفَعُ بِهِ فِي مَطْعَمٍ."],[56,65,"فَظَلْتُمْ","أَصْبَحْتُمْ."],[56,65,"تَفَكَّهُونَ","تَتَعَجَّبُونَ مِمَّا نَزَلَ بِزَرْعِكُمْ."],[56,66,"لَمُغْرَمُونَ","تَقُولُونَ: إِنَّا لَخَاسِرُونَ مُعَذَّبُونَ."],[56,69,"ٱلْمُزْنِ","السَّحَابِ."],[56,70,"أُجَاجًا","شَدِيدَ المُلُوحَةِ؛ لَا يُنْتَفَعُ بِهِ فِي شُرْبٍ، وَلَا زَرْعٍ."],[56,71,"تُورُونَ","تُوقِدُونَ، وَتَقْدَحُونَ الزِّنَادَ لِاسْتِخْرَاجِهَا."],[56,72,"أَنشَأْتُمْ","أَوْجَدْتُمْ."],[56,72,"شَجَرَتَهَآ","الشَّجَرَةَ الَّتِي تُقْدَحُ مِنْهَا النَّارُ؛ كَالمَرْخِ وَالعَفَارِ."],[56,73,"تَذْكِرَةً","تَذْكِيرًا لَكُمْ بِنَارِ جَهَنَّمَ."],[56,73,"لِّلْمُقْوِينَ","مَنْفَعَةً لِلْمُسَافِرِينَ."],[56,74,"فَسَبِّحْ بِٱسْمِ رَبِّكَ","نَزِّهْ رَبَّكَ ذَاكِرًا اسْمَهُ."],[56,75,"فَلَآ أُقْسِمُ","أُقْسِمُ وَأَحْلِفُ، وَ(لَا): تَوْكِيدٌ لِلْقَسَمِ."],[56,75,"بِمَوَٰقِعِ ٱلنُّجُومِ","بِمَسَاقِطِهَا فِي مَغَارِبِهَا فِي السَّمَاءِ."],[56,77,"كَرِيمٌ","عَظِيمُ المَنَافِعِ، كَثِيرُ الخَيْرِ، غَزِيرُ العِلْمِ."],[56,78,"مَّكْنُونٍ","مَسْتُورٍ مَصُونٍ."],[56,81,"ٱلْحَدِيثِ","القُرْآنِ."],[56,81,"مُّدْهِنُونَ","مُكَذِّبُونَ."],[56,82,"وَتَجْعَلُونَ رِزْقَكُمْ","تَجْعَلُونَ شُكْرَ نِعَمِ اللهِ عَلَيْكُمْ."],[56,83,"بَلَغَتِ ٱلْحُلْقُومَ","وَصَلَتِ الرُّوحُ الحُلْقُومَ عِنْدَ المَوْتِ."],[56,86,"مَدِينِينَ","غَيْرَ مَجْزِيِّينَ، وَمُحَاسَبِينَ."],[56,87,"تَرْجِعُونَهَآ","تَرُدُّونَ الرُّوحَ إِلَى الجَسَدِ."],[56,89,"فَرَوْحٌ","رَحْمَةٌ وَاسِعَةٌ، وَاسْتِرَاحَةٌ، وَفَرَحٌ."],[56,89,"وَرَيْحَانٌ","رِزْقٌ حَسَنٌ، وَرَائِحَةٌ طَيِّبَةٌ، وَجَمِيعُ مَا تَطِيبُ بِهِ نَفْسُهُ."],[56,91,"فَسَلَٰمٌ لَّكَ","يُقَالُ لَهُ: سَلَامَةٌ لَكَ، وَأَمْنٌ."],[56,91,"مِنْ أَصْحَٰبِ ٱلْيَمِينِ","لِكَوْنِكَ مِنْ أَصْحَابِ اليَمِينِ."],[56,93,"فَنُزُلٌ","ضِيَافَةٌ."],[56,93,"حَمِيمٍ","شَرَابِ جَهَنَّمَ المُتَنَاهِي فِي الحَرَارَةِ."],[56,94,"وَتَصْلِيَةُ جَحِيمٍ","يَدْخُلُ فِيهَا، وَيُقَاسِي حَرَّهَا."],[56,95,"حَقُّ ٱلْيَقِينِ","لَا مِرْيَةَ فِيهِ."],[57,1,"سَبَّحَ لِلَّهِ","نَزَّهَ اللهَ عَمَّا لَا يَلِيقُ بِهِ جَلَّ جَلَالُهُ."],[57,3,"ٱلْأَوَّلُ","الَّذِي لَيْسَ قَبْلَهُ شَيْءٌ."],[57,3,"وَٱلْـَٔاخِرُ","الَّذِي لَيْسَ بَعْدَهُ شَيْءٌ."],[57,3,"وَٱلظَّٰهِرُ","الَّذِي لَيْسَ فَوْقَهُ شَيْءٌ."],[57,3,"وَٱلْبَاطِنُ","الَّذِي لَيْسَ دُونَهُ شَيْءٌ."],[57,4,"يَلِجُ","مَا يَدْخُلُ مِنْ مَطَرٍ، وَغَيْرِهِ."],[57,4,"يَعْرُجُ فِيهَا","مَا يَصْعَدُ إِلَيْهَا مِنَ المَلَائِكَةِ، وَالأَعْمَالِ."],[57,6,"يُولِجُ","يُدْخِلُ."],[57,7,"مُّسْتَخْلَفِينَ فِيهِ","مِنَ المَالِ الَّذِي جَعَلَكُمْ خُلَفَاءَ فِي التَّصَرُّفِ فِيهِ."],[57,10,"ٱلْفَتْحِ","فَتْحِ مَكَّةَ."],[57,10,"ٱلْحُسْنَىٰ","الجَنَّةَ."],[57,11,"قَرْضًا حَسَنًا","مُحْتَسِبًا فِي نَفَقَتِهِ بِلَا مَنٍّ، وَلَا أَذًى."],[57,13,"ٱنظُرُونَا","انْتَظِرُونَا."],[57,13,"نَقْتَبِسْ","نَأْخُذْ، وَنُصِبْ."],[57,13,"بَاطِنُهُۥ","مِمَّا يَلِي المُؤْمِنِينَ."],[57,13,"وَظَٰهِرُهُۥ","مِمَّا يَلِي المُنَافِقِينَ."],[57,14,"فَتَنتُمْ","أَهْلَكْتُمْ."],[57,14,"وَتَرَبَّصْتُمْ","تَرَقَّبْتُمْ حُصُولَ النَّوَائِبِ لِلنَّبِيِّ صلى الله عليه وسلم، وَالمُؤْمِنِينَ مَعَهُ."],[57,14,"وَٱرْتَبْتُمْ","شَكَكْتُمْ فِي البَعْثِ."],[57,14,"وَغَرَّتْكُمُ ٱلْأَمَانِىُّ","خَدَعَتْكُمُ الأَبَاطِيلُ."],[57,14,"أَمْرُ ٱللَّهِ","المَوْتُ."],[57,14,"ٱلْغَرُورُ","الشَّيْطَانُ."],[57,15,"فِدْيَةٌ","عِوَضٌ لِيُفْتَدَى بِهِ مِنْ عَذَابِ اللهِ."],[57,15,"مَأْوَىٰكُمُ","مَصِيرُكُمْ."],[57,15,"مَوْلَىٰكُمْ","أَوْلَى بِكُمْ."],[57,15,"ٱلْمَصِيرُ","المَرْجِعُ."],[57,16,"أَلَمْ يَأْنِ","أَلَمْ يَحِنْ وَيَجِئِ الوَقْتُ؟!"],[57,16,"تَخْشَعَ","تَخْضَعَ، وَتَرِقَّ، وَتَلِينَ."],[57,16,"ٱلْأَمَدُ","الزَّمَانُ."],[57,18,"ٱلْمُصَّدِّقِينَ","المُتَصَدِّقِينَ."],[57,18,"قَرْضًا حَسَنًا","مُحْتَسِبِينَ فِي نَفَقَاتِهِمْ بِلَا مَنٍّ، وَلَا أَذًى."],[57,19,"ٱلصِّدِّيقُونَ","المُبَالِغُونَ فِي التَّصْدِيقِ."],[57,19,"وَٱلشُّهَدَآءُ","الَّذِينَ قُتِلُوا فِي سَبِيلِ اللهِ."],[57,20,"لَعِبٌ","تَلْعَبُ بِهَا الأَبْدَانُ."],[57,20,"وَلَهْوٌ","تَلْهُو بِهَا القُلُوبُ."],[57,20,"ٱلْكُفَّارَ","الزُّرَّاعَ، سُمُّوا بِذَلِكَ؛ لِأَنَّهُمْ يَسْتُرُونَ الحَبَّ فِي التُّرَابِ."],[57,20,"يَهِيجُ","يَيْبَسُ."],[57,20,"حُطَٰمًا","فُتَاتًا مُتَهَشِّمًا."],[57,21,"سَابِقُوٓا۟","سَارِعُوا مُسَارَعَةَ المُتَسَابِقِينَ فِي المِضْمَارِ."],[57,22,"كِتَٰبٍ","هُوَ: اللَّوْحُ المَحْفُوظُ."],[57,22,"نَّبْرَأَهَآ","نَخْلُقَ هَذِهِ المَخْلُوقَاتِ."],[57,23,"تَأْسَوْا۟","تَحْزَنُوا."],[57,23,"تَفْرَحُوا۟","فَرَحَ بَطَرٍ، وَاخْتِيَالٍ."],[57,23,"مُخْتَالٍ","مُتَكَبِّرٍ."],[57,23,"فَخُورٍ","مُتَطَاوِلٍ بِهِ يَفْخَرُ عَلَى النَّاسِ."],[57,24,"ٱلْحَمِيدُ","المَحْمُودُ عَلَى كَمَالِ صِفَاتِهِ، وَجَمِيلِ فِعَالِهِ."],[57,25,"بِٱلْبَيِّنَٰتِ","بِالحُجَجِ الوَاضِحَاتِ."],[57,25,"وَٱلْمِيزَانَ","العَدْلَ فِي الأَقْوَالِ، وَالأَفْعَالِ."],[57,25,"بَأْسٌ","قُوَّةٌ."],[57,25,"عَزِيزٌ","غَالِبٌ لَا يُغْلَبُ."],[57,27,"قَفَّيْنَا عَلَىٰٓ ءَاثَٰرِهِم","أَتْبَعْنَاهُمْ، وَبَعَثْنَا بَعْدَهُمْ."],[57,27,"وَرَهْبَانِيَّةً","غُلُوًّا فِي التَّعَبُّدِ."],[57,27,"مَا كَتَبْنَٰهَا","مَا فَرَضْنَاهَا."],[57,27,"ٱبْتِغَآءَ","فَعَلُوهَا مِنْ عِنْدِ أَنْفُسِهِمْ يَطْلُبُونَ..."],[57,27,"فَمَا رَعَوْهَا","مَا قَامُوا بِهَا حَقَّ القِيَامِ، بَلْ بَدَّلُوا وَخَالَفُوا."],[57,28,"كِفْلَيْنِ","ضِعْفَيْنِ."],[57,29,"لِّئَلَّا يَعْلَمَ","أَعْطَاكُمُ اللهُ ذَلِكَ لِأَجْلِ أَنْ يَعْلَمَ."],[58,1,"تُجَٰدِلُكَ","تُرَاجِعُكَ، وَهِيَ: خَوْلَةُ بِنْتُ ثَعْلَبَةَ."],[58,1,"زَوْجِهَا","أَوْسِ بْنِ الصَّامِتِ."],[58,2,"يُظَٰهِرُونَ","يَقُولُ الرَّجُلُ لِامْرَأَتِهِ: أَنْتِ عَلَيَّ كَظَهْرِ أُمِّي."],[58,2,"إِنْ أُمَّهَٰتُهُمْ","مَا أُمَّهَاتُهُمْ."],[58,2,"مُنكَرًا","فَظِيعًا."],[58,2,"وَزُورًا","كَذِبًا."],[58,3,"يَعُودُونَ","يَرْجِعُونَ عَنْ قَوْلِهِمْ، وَيَعْزِمُونَ عَلَى وَطْءِ نِسَائِهِمْ."],[58,3,"فَتَحْرِيرُ رَقَبَةٍ","عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ؛ عَبْدٍ، أَوْ أَمَةٍ."],[58,3,"يَتَمَآسَّا","يَسْتَمْتِعَا بِالجِمَاعِ."],[58,5,"يُحَآدُّونَ","يُشَاقُّونَ وَيُخَالِفُونَ."],[58,5,"كُبِتُوا۟","خُذِلُوا، وَأُهِينُوا."],[58,7,"نَّجْوَىٰ ثَلَٰثَةٍ","تَنَاجِي ثَلَاثَةٍ بِحَدِيثِ سِرٍّ."],[58,8,"بِمَا لَمْ يُحَيِّكَ بِهِ ٱللَّهُ","قَالُوا لَكَ: السَّامُ عَلَيْكُمْ، أَيِ: المَوْتُ لَكَ."],[58,8,"لَوْلَا","هَلَّا."],[58,8,"حَسْبُهُمْ","كَافِيَتُهُمْ."],[58,8,"ٱلْمَصِيرُ","المَرْجِعُ، وَالمَآلُ."],[58,10,"ٱلنَّجْوَىٰ","التَّحَدُّثُ بِخُفْيَةٍ بِالإِثْمِ وَالعُدْوَانِ."],[58,11,"تَفَسَّحُوا۟","لِيُوَسِّعَ بَعْضُكُمْ لِبَعْضٍ فِي المَجَالِسِ."],[58,11,"ٱنشُزُوا۟","قُومُوا مِنْ مَجَالِسِكُمْ لِأَمْرٍ فِيهِ خَيْرٌ لَكُمْ."],[58,13,"ءَأَشْفَقْتُمْ","أَخَشِيتُمُ الفَقْرَ؟"],[58,14,"تَوَلَّوْا۟ قَوْمًا","المُنَافِقِينَ اتَّخَذُوا اليَهُودَ أَصْدِقَاءَ، وَوَالَوْهُمْ."],[58,16,"جُنَّةً","وِقَايَةً لَهُمْ مِنَ القَتْلِ."],[58,18,"وَيَحْسَبُونَ","يَعْتَقِدُونَ."],[58,19,"ٱسْتَحْوَذَ","غَلَبَ، وَاسْتَوْلَى."],[58,20,"يُحَآدُّونَ","يُخَالِفُونَ، وَيُشَاقُّونَ."],[58,20,"ٱلْأَذَلِّينَ","الأَذِلَّاءِ المَغْلُوبِينَ المُهَانِينَ."],[58,21,"لَأَغْلِبَنَّ","لَأَنْتَصِرَنَّ."],[58,21,"عَزِيزٌ","غَالِبٌ لَا يُغْلَبُ."],[58,22,"يُوَآدُّونَ","يُحِبُّونَ."],[58,22,"حَآدَّ","عَادَى."],[58,22,"عَشِيرَتَهُمْ","أَقْرِبَاءَهُمْ."],[58,22,"وَأَيَّدَهُم","قَوَّاهُمْ."],[58,22,"بِرُوحٍ مِّنْهُ","بِنَصْرٍ، وَتَأْيِيدٍ."],[59,1,"سَبَّحَ لِلَّهِ","نَزَّهَ اللهَ عَمَّا لَا يَلِيقُ بِهِ جَلَّ جَلَالُهُ وَمَجْدُهُ."],[59,2,"أَهْلِ ٱلْكِتَٰبِ","هُمْ يَهُودُ بَنِي النَّضِيرِ."],[59,2,"لِأَوَّلِ ٱلْحَشْرِ","فِي أَوَّلِ إِخْرَاجٍ، وَإِجْلَاءٍ إِلَى الشَّامِ."],[59,2,"لَمْ يَحْتَسِبُوا۟","لَمْ يَخْطُرْ لَهُمْ بِبَالٍ."],[59,2,"وَقَذَفَ","أَلْقَى."],[59,2,"ٱلرُّعْبَ","الخَوْفَ الشَّدِيدَ."],[59,2,"يَٰٓأُو۟لِى ٱلْأَبْصَٰرِ","يَا أَصْحَابَ البَصَائِرِ السَّلِيمَةِ."],[59,3,"ٱلْجَلَآءَ","الخُرُوجَ مِنْ دِيَارِهِمْ."],[59,4,"شَآقُّوا۟","خَالَفُوا أَشَدَّ المُخَالَفَةِ."],[59,5,"لِينَةٍ","نَخْلَةٍ، أَوْ نَوْعٍ مِنَ النَّخْلِ."],[59,5,"أُصُولِهَا","سَاقِهَا."],[59,5,"وَلِيُخْزِىَ","لِيُذِلَّ."],[59,6,"وَمَآ أَفَآءَ ٱللَّهُ","وَمَا رَدَّهُ اللهُ مِنْ أَمْوَالِ بَنِي النَّضِيرِ، وَالفَيْءُ: مَا أُخِذَ مِنْ أَمْوَالِ الكُفَّارِ بِحَقٍّ، مِنْ غَيْرِ قِتَالٍ، وَالغَنِيمَةُ: مَا أُخِذَ بِقِتَالٍ."],[59,6,"فَمَآ أَوْجَفْتُمْ","فَلَمْ تَرْكُضُوا لِتَحْصِيلِهِ."],[59,6,"رِكَابٍ","مَا يُرْكَبُ مِنَ الإِبِلِ."],[59,7,"وَلِذِى ٱلْقُرْبَىٰ","لِأَصْحَابِ قَرَابَةِ النَّبِيِّ صلى الله عليه وسلم."],[59,7,"وَٱلْيَتَٰمَىٰ","الأَطْفَالِ الفُقَرَاءِ الَّذِينَ مَاتَ آبَاؤُهُمْ."],[59,7,"وَٱبْنِ ٱلسَّبِيلِ","الغَرِيبِ المُسَافِرِ الَّذِي نَفِدَتْ نَفَقَتُهُ، وَانْقَطَعَ عَنْهُ مَالُهُ."],[59,7,"دُولَةًۢ","مُلْكًا مُتَدَاوَلًا."],[59,9,"تَبَوَّءُو ٱلدَّارَ","اسْتَوْطَنُوا المَدِينَةَ."],[59,9,"حَاجَةً","حَسَدًا."],[59,9,"مِّمَّآ أُوتُوا۟","مِمَّا أُعْطُوا مِنْ مَالِ الفَيْءِ وَغَيْرِهِ."],[59,9,"خَصَاصَةٌ","حَاجَةٌ، وَفَقْرٌ."],[59,9,"يُوقَ","يُكْفَ وَيُجَنَّبْ."],[59,9,"شُحَّ نَفْسِهِۦ","الشُّحُّ: بُخْلٌ بِالمَالِ مَعَ حِرْصٍ عَلَيْهِ، وَتَطَلُّعٍ لِمَا بِيَدِ غَيْرِهِ."],[59,10,"غِلًّا","حَسَدًا، وَحِقْدًا."],[59,11,"لِإِخْوَٰنِهِمُ","يَهُودِ بَنِي النَّضِيرِ."],[59,14,"جُدُرٍ","حِيطَانٍ."],[59,14,"بَأْسُهُم بَيْنَهُمْ","عَدَاوَتُهُمْ فِيمَا بَيْنَهُمْ."],[59,14,"شَتَّىٰ","مُتَفَرِّقَةٌ."],[59,15,"وَبَالَ أَمْرِهِمْ","سُوءَ عَاقِبَةِ كُفْرِهِمْ."],[59,16,"كَمَثَلِ ٱلشَّيْطَٰنِ","مَثَلُ المُنَافِقِينَ فِي وَعْدِهِمُ اليَهُودَ بِالنَّصْرِ وَخِذْلَانِهِمْ لَهُمْ كَمَثَلِ الشَّيْطَانِ."],[59,18,"وَلْتَنظُرْ","وَلْتَتَدَبَّرْ."],[59,19,"نَسُوا۟ ٱللَّهَ","تَرَكُوا أَدَاءَ حَقِّهِ."],[59,19,"فَأَنسَىٰهُمْ أَنفُسَهُمْ","بِحَيْثُ غَفَلُوا عَنْ حُظُوظِ أَنْفُسِهِمْ فِي الآخِرَةِ."],[59,21,"مُّتَصَدِّعًا","مُتَشَقِّقًا."],[59,22,"لَآ إِلَٰهَ إِلَّا هُوَ","لَا مَعْبُودَ بِحَقٍّ إِلَّا هُوَ."],[59,22,"عَٰلِمُ ٱلْغَيْبِ","عَالِمُ السِّرِّ، وَمَا غَابَ عَنِ الأَعْيُنِ."],[59,22,"وَٱلشَّهَٰدَةِ","وَعَالِمُ كُلِّ مُعْلَنٍ، وَحَاضِرٍ."],[59,22,"ٱلرَّحْمَٰنُ","الَّذِي وَسِعَتْ رَحْمَتُهُ كُلَّ شَيْءٍ، أَوِ الرَّحْمَةُ صِفَتُهُ."],[59,22,"ٱلرَّحِيمُ","الَّذِي يَرْحَمُ المُؤْمِنِينَ خَاصَّةً، أَوِ الرَّحْمَةُ فِعْلُهُ."],[59,23,"ٱلسَّلَٰمُ","المُنَزَّهُ عَنْ كُلِّ نَقْصٍ، الَّذِي سَلِمَ مِنْ كُلِّ عَيْبٍ."],[59,23,"ٱلْمُؤْمِنُ","المُصَدِّقُ رُسُلَهُ بِالمُعْجِزَاتِ، وَالآيَاتِ البَيِّنَاتِ."],[59,23,"ٱلْمُهَيْمِنُ","الرَّقِيبُ عَلَى كُلِّ خَلْقِهِ."],[59,23,"ٱلْعَزِيزُ","القَوِيُّ الغَالِبُ الَّذِي لَا يُغْلَبُ."],[59,23,"ٱلْجَبَّارُ","الَّذِي قَهَرَ جَمِيعَ العِبَادِ."],[59,23,"سُبْحَٰنَ ٱللَّهِ","تَنَزَّهَ اللهُ تَعَالَى."],[59,24,"ٱلْخَٰلِقُ","المُقَدِّرُ لِلأَشْيَاءِ، وَالمُوجِدُ لَهَا."],[59,24,"ٱلْبَارِئُ","الَّذِي يُصْدِرُ خَلْقَهُ عَلَى الكَيْفِيَّةِ الَّتِي يَشَاؤُهَا."],[59,24,"ٱلْحُسْنَىٰ","الَّتِي لَا أَحْسَنَ مِنْهَا."],[60,1,"أَوْلِيَآءَ","خُلَصَاءَ وَأَحِبَّاءَ."],[60,1,"تُلْقُونَ","تُفْضُونَ."],[60,1,"أَن تُؤْمِنُوا۟","لِأَجْلِ إِيمَانِكُمْ."],[60,1,"ضَلَّ سَوَآءَ ٱلسَّبِيلِ","أَخْطَأَ طَرِيقَ الهُدَى."],[60,2,"يَثْقَفُوكُمْ","يَظْفَرُوا بِكُمْ."],[60,2,"وَيَبْسُطُوٓا۟","يَمُدُّوا."],[60,3,"يَفْصِلُ بَيْنَكُمْ","يُفَرِّقُ بَيْنَ المُطِيعِينَ، وَالعَاصِينَ."],[60,4,"أُسْوَةٌ","قُدْوَةٌ."],[60,4,"بُرَءَٰٓؤُا۟","بَرِيئُونَ."],[60,4,"إِلَّا قَوْلَ إِبْرَٰهِيمَ","لَكِنْ لَا تَقْتَدُوا بِإِبْرَاهِيمَ حِينَ قَالَ."],[60,4,"أَنَبْنَا","رَجَعْنَا بِالتَّوْبَةِ، وَالطَّاعَةِ."],[60,4,"ٱلْمَصِيرُ","المَرْجِعُ."],[60,5,"فِتْنَةً لِّلَّذِينَ كَفَرُوا۟","بِعَذَابِكَ لَنَا، أَوْ تَسْلِيطِ الكُفَّارِ عَلَيْنَا، فَيَقُولُونَ: لَوْ كَانَ هَؤُلَاءِ عَلَى حَقٍّ، مَا أَصَابَهُمُ العَذَابُ، فَيَزْدَادُوا كُفْرًا."],[60,6,"يَرْجُوا۟ ٱللَّهَ","يَطْمَعُ فِي الخَيْرِ مِنَ اللهِ."],[60,6,"يَتَوَلَّ","يُعْرِضْ عَنِ الِاقْتِدَاءِ بِالأَنْبِيَاءِ، وَيُوَالِ أَعْدَاءَ اللهِ."],[60,6,"ٱلْحَمِيدُ","المَحْمُودُ فِي ذَاتِهِ، وَصِفَاتِهِ، وَأَفْعَالِهِ."],[60,7,"مَوَدَّةً","مَحَبَّةً."],[60,8,"تَبَرُّوهُمْ","تُكْرِمُوهُمْ."],[60,8,"وَتُقْسِطُوٓا۟","تَعْدِلُوا فِيهِمْ."],[60,8,"ٱلْمُقْسِطِينَ","العَادِلِينَ."],[60,9,"وَظَٰهَرُوا۟","عَاوَنُوا."],[60,9,"أَن تَوَلَّوْهُمْ","أَنْ تَنْصُرُوهُمْ، وَتَوَدُّوهُمْ."],[60,10,"فَٱمْتَحِنُوهُنَّ","فَاخْتَبِرُوهُنَّ؛ لِتَعْلَمُوا صِدْقَ إِيمَانِهِنَّ."],[60,10,"وَءَاتُوهُم مَّآ أَنفَقُوا۟","وَأَعْطُوا أَزْوَاجَ اللَّاتِي أَسْلَمْنَ مِثْلَ مَا أَنْفَقُوا عَلَيْهِنَّ مِنَ المُهُورِ."],[60,10,"جُنَاحَ","إِثْمٌ."],[60,10,"أُجُورَهُنَّ","مُهُورَهُنَّ."],[60,10,"بِعِصَمِ ٱلْكَوَافِرِ","بِعُقُودِ نِكَاحِ زَوْجَاتِكُمُ الكَافِرَاتِ."],[60,10,"وَسْـَٔلُوا۟ مَآ أَنفَقْتُمْ","وَاطْلُبُوا مِنَ المُشْرِكِينَ مُهُورَ نِسَائِكُمُ المُرْتَدَّاتِ اللَّوَاتِي لَحِقْنَ بِهِمْ."],[60,11,"وَإِن فَاتَكُمْ شَىْءٌ مِّنْ أَزْوَٰجِكُمْ","انْفَلَتَتْ وَاحِدَةٌ بِرِدَّةٍ."],[60,11,"فَعَاقَبْتُمْ","فَظَفِرْتُمْ بِالكُفَّارِ، وَغَنِمْتُمْ مِنْهُمْ."],[60,12,"يُبَايِعْنَكَ","يُعَاهِدْنَكَ."],[60,12,"بِبُهْتَٰنٍ يَفْتَرِينَهُۥ","بِأَنْ يُلْحِقْنَ بِأَزْوَاجِهِنَّ أَوْلَادًا لَيْسُوا مِنْهُمْ."],[60,13,"لَا تَتَوَلَّوْا۟","لَا تَجْعَلُوهُمْ أَوْلِيَاءَ، وَأَخِلَّاءَ."],[61,1,"سَبَّحَ لِلَّهِ","نَزَّهَ اللهَ عَمَّا لَا يَلِيقُ بِجَلَالِهِ سُبْحَانَهُ."],[61,3,"كَبُرَ مَقْتًا","عَظُمَ بُغْضًا."],[61,4,"صَفًّا","صَافِّينَ صَفًّا."],[61,4,"مَّرْصُوصٌ","مُتَرَاصٌّ مُحْكَمٌ لَا فُرْجَةَ فِيهِ، وَلَا يَنْفُذُ فِيهِ العَدُوُّ."],[61,5,"زَاغُوٓا۟","عَدَلُوا عَنِ الحَقِّ، مَعَ عِلْمِهِمْ بِهِ."],[61,5,"أَزَاغَ ٱللَّهُ قُلُوبَهُمْ","صَرَفَهَا عَنْ قَبُولِ الحَقِّ؛ جَزَاءً عَلَى زَيْغِهِمْ."],[61,6,"لِّمَا بَيْنَ يَدَىَّ","لِمَا جَاءَ قَبْلِي."],[61,6,"بِٱلْبَيِّنَٰتِ","بِالآيَاتِ الوَاضِحَاتِ."],[61,7,"وَمَنْ أَظْلَمُ","لَا أَحَدَ أَشَدُّ ظُلْمًا، وَعُدْوَانًا."],[61,7,"ٱفْتَرَىٰ","اخْتَلَقَ."],[61,7,"يُدْعَىٰٓ إِلَى ٱلْإِسْلَٰمِ","يُدْعَى إِلَى الدُّخُولِ فِي الإِسْلَامِ."],[61,8,"نُورَ ٱللَّهِ","الحَقَّ الَّذِي جَاءَ بِهِ الرَّسُولُ صلى الله عليه وسلم."],[61,8,"بِأَفْوَٰهِهِمْ","بِأَقْوَالِهِمُ الكَاذِبَةِ."],[61,8,"مُتِمُّ نُورِهِۦ","مُظْهِرُ الحَقِّ بِإِتْمَامِ دِينِهِ."],[61,9,"لِيُظْهِرَهُۥ","لِيُعْلِيَهُ."],[61,9,"ٱلدِّينِ كُلِّهِۦ","الأَدْيَانِ المُخَالِفَةِ كُلِّهَا."],[61,13,"وَأُخْرَىٰ","وَنِعْمَةٌ أُخْرَى لَكُمْ."],[61,14,"لِلْحَوَارِيِّـۧنَ","أَصْفِيَاءِ عِيسَى عليه السلام، وَخَوَاصِّهِ."],[61,14,"فَأَيَّدْنَا","قَوَّيْنَا، وَنَصَرْنَا."],[61,14,"ظَٰهِرِينَ","غَالِبِينَ."],[62,1,"يُسَبِّحُ","يُنَزِّهُ اللهَ عَنْ كُلِّ مَا لَا يَلِيقُ بِهِ."],[62,1,"ٱلْقُدُّوسِ","الْمُنَزَّهِ عَنْ كُلِّ نَقْصٍ."],[62,1,"ٱلْعَزِيزِ","الْقَوِيِّ الْغَالِبِ الَّذِي لَا يُغَالَبُ."],[62,2,"ٱلْأُمِّيِّـۧنَ","الْعَرَبِ الَّذِينَ لَا يَقْرَؤُونَ، وَلَا كِتَابَ عِنْدَهُمْ."],[62,2,"وَيُزَكِّيهِمْ","يُطَهِّرُهُمْ مِنَ الْعَقَائِدِ الْفَاسِدَةِ، وَالْأَخْلَاقِ السَّيِّئَةِ."],[62,2,"ٱلْكِتَٰبَ","الْقُرْآنَ."],[62,2,"وَٱلْحِكْمَةَ","السُّنَّةَ، وَإِذَا جَاءَتِ الْحِكْمَةُ مَعَ الْكِتَابِ فَالْمُرَادُ بِهَا: السُّنَّةُ."],[62,3,"وَءَاخَرِينَ مِنْهُمْ","وَبَعَثَهُ إِلَى قَوْمٍ آخَرِينَ مِنَ الْعَرَبِ، وَغَيْرِهِمْ."],[62,3,"لَمَّا يَلْحَقُوا بِهِمْ","لَمْ يَجِيئُوا بَعْدُ، وَسَيَجِيئُونَ."],[62,5,"أَسْفَارًۢا","كُتُبًا."],[62,5,"بِئْسَ مَثَلُ ٱلْقَوْمِ","قُبْحَ مَثَلُهُمْ."],[62,6,"هَادُوٓا۟","تَدَيَّنُوا بِالْيَهُودِيَّةِ."],[62,9,"فَٱسْعَوْا۟","فَامْضُوا."],[62,9,"وَذَرُوا۟","اتْرُكُوا."],[62,10,"فَضْلِ ٱللَّهِ","رِزْقِ اللهِ."],[62,11,"لَهْوًا","مَا يُلْهِي مِنْ غِنَاءٍ، وَزِينَةٍ، وَنَحْوِهِمَا."],[62,11,"ٱنفَضُّوٓا۟ إِلَيْهَا","تَفَرَّقُوا عَنْكَ قَاصِدِينَ إِلَيْهَا."],[62,11,"قَآئِمًا","تَخْطُبُ عَلَى الْمِنْبَرِ."],[63,2,"جُنَّةً","وِقَايَةً وَسُتْرَةً لَهُمْ مِنَ الْمُؤَاخَذَةِ وَالْعَذَابِ."],[63,3,"ءَامَنُوا۟","أَيْ: فِي الظَّاهِرِ لَا غَيْرُ."],[63,3,"فَطُبِعَ","خُتِمَ."],[63,3,"لَا يَفْقَهُونَ","لَا يَفْهَمُونَ مَا فِيهِ صَلَاحُهُمْ."],[63,4,"تَسْمَعْ لِقَوْلِهِمْ","تَسْمَعْ لِحَدِيثِهِمْ؛ لِفَصَاحَتِهِمْ."],[63,4,"كَأَنَّهُمْ خُشُبٌ مُّسَنَّدَةٌ","كَأَنَّهُمْ لِخُلُوِّ قُلُوبِهِمْ مِنَ الْإِيمَانِ، وَعُقُولِهِمْ مِنَ الْفَهْمِ: أَخْشَابٌ مُلْقَاةٌ عَلَى حَائِطٍ."],[63,4,"يَحْسَبُونَ","يَظُنُّونَ."],[63,4,"كُلَّ صَيْحَةٍ عَلَيْهِمْ","كُلَّ صَوْتٍ عَالٍ وَاقِعًا عَلَيْهِمْ؛ لِعِلْمِهِمْ بِحَقِيقَةِ حَالِهِمْ، وَلِخَوْفِهِمْ."],[63,4,"قَٰتَلَهُمُ ٱللَّهُ","أَخْزَاهُمْ، وَطَرَدَهُمْ مِنْ رَحْمَتِهِ."],[63,4,"أَنَّىٰ يُؤْفَكُونَ","كَيْفَ يُصْرَفُونَ عَنِ الْإِيمَانِ بَعْدَ قِيَامِ الْبُرْهَانِ؟!"],[63,5,"لَوَّوْا۟ رُءُوسَهُمْ","عَطَفُوهَا إِعْرَاضًا، وَاسْتِهْزَاءً."],[63,5,"يَصُدُّونَ","يُعْرِضُونَ."],[63,7,"يَنفَضُّوا۟","يَتَفَرَّقُوا عَنْهُ."],[63,8,"رَّجَعْنَا","مِنْ غَزْوَةِ بَنِي الْمُصْطَلِقِ."],[63,8,"ٱلْأَعَزُّ","الْأَقْوَى؛ يَعْنُونَ: أَنْفُسَهُمْ."],[63,8,"ٱلْأَذَلَّ","الْأَضْعَفَ وَالْأَهْوَنَ؛ يَعْنُونَ: رَسُولَ اللهِ ﷺ، وَمَنْ مَعَهُ!"],[63,8,"وَلِلَّهِ ٱلْعِزَّةُ","الْقُوَّةُ، وَالْغَلَبَةُ."],[63,9,"لَا تُلْهِكُمْ","لَا تَشْغَلْكُمْ."],[63,10,"لَوْلَآ أَخَّرْتَنِىٓ","هَلَّا أَمْهَلْتَنِي، وَأَخَّرْتَ أَجَلِي."],[63,11,"أَجَلُهَا","وَقْتُ مَوْتِهَا."],[64,1,"يُسَبِّحُ","يُنَزِّهُ اللهَ عَمَّا لَا يَلِيقُ بِهِ."],[64,3,"ٱلْمَصِيرُ","الْمَرْجِعُ."],[64,5,"وَبَالَ أَمْرِهِمْ","سُوءَ عَاقِبَةِ كُفْرِهِمْ."],[64,6,"وَتَوَلَّوا۟","أَعْرَضُوا عَنِ الْحَقِّ."],[64,8,"وَٱلنُّورِ","الْقُرْآنِ."],[64,9,"لِيَوْمِ ٱلْجَمْعِ","يَوْمِ الْقِيَامَةِ الَّذِي يُحْشَرُ فِيهِ الْأَوَّلُونَ وَالْآخِرُونَ."],[64,9,"يَوْمُ ٱلتَّغَابُنِ","يَظْهَرُ فِيهِ خَسَارَةُ الْكُفَّارِ، وَغَبْنُهُمْ، بِتَرْكِهِمُ الْإِيمَانَ."],[64,9,"يُكَفِّرْ","يَمْحُ."],[64,11,"بِإِذْنِ ٱللَّهِ","بِقَضَائِهِ، وَقَدَرِهِ."],[64,11,"يَهْدِ قَلْبَهُ","يُوَفِّقْهُ لِلتَّسْلِيمِ بِالْقَضَاءِ، وَالصَّبْرِ عَلَى الْمَقْدُورِ."],[64,12,"تَوَلَّيْتُمْ","أَعْرَضْتُمْ عَنْ طَاعَةِ الرَّسُولِ ﷺ."],[64,13,"فَلْيَتَوَكَّلِ","فَلْيَعْتَمِدْ، وَلْيُفَوِّضْ."],[64,14,"عَدُوًّا لَّكُمْ","بِصَدِّكُمْ عَنْ سَبِيلِ اللهِ، وَتَثْبِيطِكُمْ عَنْ طَاعَةِ اللهِ."],[64,14,"تَعْفُوا۟","تَتَجَاوَزُوا عَنْ سَيِّئَاتِهِمْ."],[64,14,"وَتَصْفَحُوا۟","تُعْرِضُوا عَنْهَا."],[64,14,"وَتَغْفِرُوا۟","تَسْتُرُوهَا عَلَيْهِمْ."],[64,15,"فِتْنَةٌ","بَلَاءٌ، وَاخْتِبَارٌ لَكُمْ."],[64,16,"وَمَن يُوقَ شُحَّ نَفْسِهِۦ","يُكْفَ بُخْلَهَا الشَّدِيدَ، وَطَمَعَهَا بِمَا فِي أَيْدِي النَّاسِ."],[65,1,"فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ","مُسْتَقْبِلَاتٍ لِعِدَّتِهِنَّ، أَيْ: فِي طُهْرٍ لَمْ يَقَعْ فِيهِ جِمَاعٌ."],[65,1,"وَأَحْصُوا۟ ٱلْعِدَّةَ","احْفَظُوهَا؛ لِتَعْلَمُوا وَقْتَ الرَّجْعَةِ إِنْ أَرَدْتُمُ الْمُرَاجَعَةَ."],[65,1,"بِفَٰحِشَةٍ مُّبَيِّنَةٍ","بِمَعْصِيَةٍ ظَاهِرَةٍ؛ كَالزِّنَى، وَالتَّطَاوُلِ عَلَى الزَّوْجِ بِاللِّسَانِ."],[65,2,"بَلَغْنَ أَجَلَهُنَّ","قَارَبْنَ أَنْ يَنْتَهِينَ مِنْ عِدَّتِهِنَّ."],[65,2,"ذَوَىْ عَدْلٍ","صَاحِبَيْ عَدَالَةٍ."],[65,2,"وَأَقِيمُوا۟","أَدُّوا."],[65,2,"مَخْرَجًا","فَرَجًا مِنْ كُلِّ ضِيقٍ."],[65,3,"لَا يَحْتَسِبُ","لَا يَخْطُرُ بِبَالِهِ، وَلَا يَتَوَقَّعُ."],[65,3,"حَسْبُهُۥٓ","كَافِيهِ."],[65,3,"بَٰلِغُ أَمْرِهِۦ","مُنْفِذُ حُكْمِهِ؛ لَا يَفُوتُهُ شَيْءٌ، وَلَا يُعْجِزُهُ مَطْلُوبٌ."],[65,3,"قَدْرًا","أَجَلًا يَنْتَهِي إِلَيْهِ."],[65,4,"يَئِسْنَ","انْقَطَعَ رَجَاؤُهُنَّ؛ لِكِبَرِهِنَّ."],[65,4,"ٱرْتَبْتُمْ","شَكَكْتُمْ؛ فَلَمْ تَدْرُوا مَا الْحُكْمُ فِيهِنَّ."],[65,4,"وَأُو۟لَٰتُ ٱلْأَحْمَالِ","صَاحِبَاتُ الْحَمْلِ."],[65,6,"مِنْ حَيْثُ سَكَنتُم","قِبَلَ سُكْنَاكُمْ."],[65,6,"مِّن وُجْدِكُمْ","عَلَى قَدْرِ وُسْعِكُمْ، وَطَاقَتِكُمْ."],[65,6,"أُو۟لَٰتِ","ذَوَاتِ."],[65,6,"وَأْتَمِرُوا۟","وَلْيَأْمُرْ بَعْضُكُمْ بَعْضًا."],[65,6,"بِمَعْرُوفٍ","بِمَا عُرِفَ مِنْ سَمَاحَةٍ، وَطِيبِ نَفْسٍ."],[65,6,"تَعَاسَرْتُمْ","تَشَاحَحْتُمْ فِي الْإِرْضَاعِ فَامْتَنَعَ الْأَبُ مِنَ الْأُجْرَةِ، وَالْأُمُّ مِنَ الرَّضَاعِ."],[65,7,"قُدِرَ","ضُيِّقَ."],[65,8,"وَكَأَيِّن","كَثِيرٍ."],[65,8,"عَتَتْ","عَصَتْ، وَتَجَبَّرَتْ."],[65,8,"نُّكْرًا","مُنْكَرًا عَظِيمًا."],[65,9,"وَبَالَ أَمْرِهَا","سُوءَ عَاقِبَةِ عُتُوِّهِمْ، وَكُفْرِهِمْ."],[66,2,"تَحِلَّةَ أَيْمَٰنِكُمْ","تَحْلِيلَ أَيْمَانِكُمْ بِأَدَاءِ الْكَفَّارَةِ عَنْهَا."],[66,2,"مَوْلَىٰكُمْ","نَاصِرُكُمْ، وَمُتَوَلِّي أُمُورِكُمْ."],[66,3,"بَعْضِ أَزْوَٰجِهِۦ","هِيَ: حَفْصَةُ بِنْتُ عُمَرَ رضي الله عنهما."],[66,3,"وَأَظْهَرَهُ","أَطْلَعَهُ."],[66,3,"عَرَّفَ بَعْضَهُۥ","أَعْلَمَ حَفْصَةَ ﵂ بَعْضَ مَا أُخْبِرَتْ بِهِ."],[66,4,"تَتُوبَآ إِلَى ٱللَّهِ","تَرْجِعَا - يَا حَفْصَةُ، وَيَا عَائِشَةُ - إِلَى اللهِ."],[66,4,"صَغَتْ قُلُوبُكُمَا","مَالَتْ إِلَى مَحَبَّةِ مَا كَرِهَهُ الرَّسُولُ ﷺ مِنْ إِفْشَاءِ سِرِّهِ."],[66,4,"وَإِن تَظَٰهَرَا عَلَيْهِ","وَإِنْ تَتَعَاوَنَا عَلَيْهِ."],[66,4,"ظَهِيرٌ","أَعْوَانٌ، وَأَنْصَارٌ."],[66,5,"سَٰٓئِحَٰتٍ","صَائِمَاتٍ."],[66,8,"تَوْبَةً نَّصُوحًا","صَادِقَةً لَا يَعُودُ صَاحِبُهَا إِلَى الذَّنْبِ، وَلَا يُرِيدُ الْعَوْدَ إِلَيْهِ."],[66,8,"لَا يُخْزِى","لَا يُذِلُّ، وَلَا يُعَذِّبُ."],[66,8,"يَسْعَىٰ","يَسِيرُ."],[66,8,"بَيْنَ أَيْدِيهِمْ","أَمَامَهُمْ."],[66,9,"وَٱغْلُظْ عَلَيْهِمْ","اسْتَعْمِلِ الْخُشُونَةَ وَالشِّدَّةَ فِي جِهَادِهِمْ."],[66,9,"وَمَأْوَىٰهُمْ","مَسْكَنُهُمْ."],[66,9,"ٱلْمَصِيرُ","الْمَرْجِعُ، وَالْمَآلُ."],[66,10,"فَخَانَتَاهُمَا","بِالْكُفْرِ، وَالْمُخَالَفَةِ فِي الدِّينِ."],[66,10,"فَلَمْ يُغْنِيَا","فَلَمْ يَدْفَعَا وَيَمْنَعَا عَنْهُمَا."],[66,12,"أَحْصَنَتْ","حَفِظَتْ وَصَانَتْ عَنِ الزِّنَى."],[66,12,"فَنَفَخْنَا فِيهِ مِن رُّوحِنَا","جِبْرِيلُ ﷺ، حَيْثُ نَفَخَ فِي جَيْبِ قَمِيصِهَا؛ فَوَصَلَتِ النَّفْخَةُ إِلَى رَحِمِهَا."],[66,12,"ٱلْقَٰنِتِينَ","الْمُطِيعِينَ لِرَبِّهِمْ."],[67,1,"تَبَٰرَكَ","تَعَالَى، وَتَعَاظَمَ، وَتَكَاثَرَ خَيْرُهُ وَبِرُّهُ."],[67,2,"لِيَبْلُوَكُمْ","لِيَخْتَبِرَكُمْ."],[67,2,"أَحْسَنُ عَمَلًا","أَخْلَصُهُ، وَأَصْوَبُهُ."],[67,3,"طِبَاقًا","بَعْضُهَا فَوْقَ بَعْضٍ، مِنْ غَيْرِ مُمَاسَّةٍ."],[67,3,"تَفَٰوُتٍ","اخْتِلَافٍ، وَتَبَايُنٍ."],[67,3,"فُطُورٍ","شُقُوقٍ، وَصُدُوعٍ."],[67,4,"ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ","أَعِدِ النَّظَرَ مَرَّةً بَعْدَ مَرَّةٍ."],[67,4,"يَنقَلِبْ","يَرْجِعْ."],[67,4,"خَاسِئًا","ذَلِيلًا صَاغِرًا."],[67,4,"حَسِيرٌ","مُتْعَبٌ، كَلِيلٌ."],[67,5,"رُجُومًا لِّلشَّيَٰطِينِ","شُهُبًا مُحْرِقَةً لِمُسْتَرِقِي السَّمْعِ مِنَ الشَّيَاطِينِ."],[67,5,"وَأَعْتَدْنَا","أَعْدَدْنَا."],[67,6,"ٱلْمَصِيرُ","الْمَرْجِعُ، وَالْمَآلُ."],[67,7,"شَهِيقًا","صَوْتًا مُنْكَرًا."],[67,7,"تَفُورُ","تَغْلِي غَلَيَانًا شَدِيدًا."],[67,8,"تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ","تَتَمَزَّقُ مِنْ شِدَّةِ غَضَبِهَا عَلَى الْكُفَّارِ."],[67,8,"فَوْجٌ","جَمَاعَةٌ."],[67,8,"نَذِيرٌ","رَسُولٌ يُحَذِّرُكُمْ هَذَا الْعَذَابَ."],[67,9,"إِنْ أَنتُمْ","مَا أَنْتُمْ."],[67,11,"فَسُحْقًا","بُعْدًا."],[67,12,"بِٱلْغَيْبِ","يَخْشَوْنَهُ وَهُمْ غَائِبُونَ عَنْ أَعْيُنِ النَّاسِ، وَيَخْشَوْنَ الْعَذَابَ قَبْلَ مُعَايَنَتِهِ."],[67,15,"ذَلُولًا","سَهْلَةً، مُمَهَّدَةً تَسْتَقِرُّونَ عَلَيْهَا."],[67,15,"مَنَاكِبِهَا","نَوَاحِيهَا، وَجَوَانِبِهَا."],[67,15,"وَإِلَيْهِ ٱلنُّشُورُ","إِلَيْهِ تُبْعَثُونَ مِنْ قُبُورِكُمْ لِلْجَزَاءِ وَالْحِسَابِ."],[67,16,"مَّن فِى ٱلسَّمَآءِ","اللهُ الَّذِي فِي الْعُلُوِّ."],[67,16,"تَمُورُ","تَضْطَرِبُ بِكُمْ حَتَّى تَهْلِكُوا."],[67,17,"حَاصِبًا","رِيحًا تَرْجُمُكُمْ بِالْحِجَارَةِ الصَّغِيرَةِ."],
