var NEXP=[["الرحمن: اسم يختص بالله وحده, ولا يجوز إطلاقه على غيره, ومعناه المتصف بالرحمة العامة الشاملة لجميع الخلائق في الدنيا, مؤمنهم وكافرهم, وقد سبقت رحمته غضبه.", "Al-Raḥmān is a name reserved for Allah alone. It means the One whose mercy is all-embracing and reaches every creature in this world, believer and disbeliever alike; His mercy outstrips His anger."], ["الرحيم: صيغة مبالغة بمعنى الراحم, وتدل على الرحمة الخاصة بالمؤمنين, يرحمهم في الدنيا بالهداية وفي الآخرة بالجنة والنظر إلى وجهه, وتمتد رحمته إلى ذريتهم من بعدهم. ويجوز وصف الإنسان بالرحيم, بخلاف الرحمن.", "Al-Raḥīm is an intensive form meaning the Merciful. It points to His special mercy for the believers: guidance in this world, Paradise and seeing Him in the next, extending even to their descendants. A person may be described as raḥīm, but not as al-Raḥmān."], ["الرب: هو المالك والسيد والمربي والمنعم, والتربية تجمع الإمداد والرعاية. وإذا أطلق معرَّفاً بـ(ال) اختص بالله تعالى, فهو الخالق الرازق المدبر لخلقه, ويربي النفوس بالهداية كما يربي الأجساد بالنعم.", "Al-Rabb means the Owner, Master, Sustainer and Nurturer. Nurturing combines providing and caring. With the definite article it refers to Allah alone: He creates, provides for and directs His creation, nurturing souls with guidance as He nurtures bodies with blessings."], ["المالك: اسم فاعل من ملك, ومعناه أن الله مالك الأشياء كلها ومتصرف فيها كيف يشاء, في عالم الغيب والشهادة وفي الدنيا والآخرة. وملكه عن أصالة واستحقاق لأنه خالقها, وهو صاحب حق التصرف المطلق فيها.", "Al-Mālik is the Owner. Allah owns everything and disposes of it as He wills, in the seen and the unseen, in this world and the next. His ownership is original and by right, because He created it, and His authority over it is absolute."], ["القدير: صيغة مبالغة من القادر, وهو مأخوذ من التقدير ومن القدرة معاً: فالله ذو علم يقدّر به الأمور, وذو قدرة ينفذها. فبقدر ما تطمئن إلى علمه تطمئن إلى قدرته, ولا يعجزه شيء.", "Al-Qadīr is the intensive form of \"able\". It draws on both taqdīr (determining) and qudra (power): Allah knows and decrees all things and has the power to carry them out, so nothing is beyond Him."], ["العليم: صيغة مبالغة من العلم, ومعناه أن الله يعلم كل شيء, دقيقه وجليله, علماً مطابقاً للواقع. والعلم عند الإنسان معرفة ثابتة تطابق الواقع, أما علم الله فشامل لا يخفى عليه شيء.", "Al-ʿAlīm is the intensive form of knowing: Allah knows everything, the smallest and the greatest, with knowledge that matches reality exactly. Human knowledge is partial, while His knowledge is complete and nothing is hidden from Him."], ["الحكيم: الذي يُحكم الأمور ويتقنها, ويضع الشيء المناسب بالقدر المناسب, في الوقت المناسب والمكان المناسب. فالله حكيم في خلقه وأمره وشرعه, وحكمته حقيقية قائمة به, يتنزه عن كل ما لا ينبغي.", "Al-Ḥakīm is the One who makes every matter perfect and sound: the right thing, in the right measure, at the right time and place. Allah is wise in His creation, His decrees and His law, and He is free of anything unfitting."], ["التواب: صيغة مبالغة من تاب بمعنى رجع, فالله يرجع على عباده بالرحمة والمغفرة ويقبل توبتهم, ويغفر الذنوب كثرةً ونوعاً. والتوبة ترك الذنب والندم عليه والعزم على عدم العودة, وهي مخرج النجاة للمذنب.", "Al-Tawwāb comes from tāba, \"to return\". Allah turns back to His servants with mercy and forgiveness and accepts their repentance, for sins of every number and kind. Repentance means leaving the sin, regretting it and resolving not to return; it is the way out for the sinner."], ["السميع: الذي يسمع كل صوت, سرّه وجهره, دقيقه وجليله, ويسمع الدعاء فيجيب. وسمعه سبحانه لا يشغله صوت عن صوت, وهو مقترن غالباً بالعليم.", "Al-Samīʿ hears every sound, hidden or open, faint or loud, and hears every prayer and answers it. No sound distracts Him from another, and the name often appears together with al-ʿAlīm."], ["العزيز: له معنيان: الذي لا مثيل له ولا نظير, وهو الغالب الذي لا يُغلب. فعزته سبحانه كمال القوة والغلبة, لا يقهره أحد, وهو مع ذلك رحيم بعباده.", "Al-ʿAzīz has two meanings: the One who has no like or equal, and the One who overcomes and is never overcome. His might is complete, no one can overpower Him, and yet He is merciful to His servants."], ["الواسع: من السعة, ومعناه أن علم الله وعطاءه ورحمته وغناه وسع كل شيء. فالإنسان محدود في علمه وماله وقدرته, أما الله فلا حدّ لسعة علمه ولا لفضله على خلقه.", "Al-Wāsiʿ comes from \"vastness\". Allah's knowledge, giving, mercy and richness encompass everything. A human is limited in knowledge, wealth and power, while there is no limit to the breadth of His knowledge or His bounty."], ["الرؤوف: صيغة مبالغة من الرأفة, وهي أشد الرحمة ومنتهاها, أو رقة القلب التي تدفع الشر عن المرؤوف به. وقد وصف الله بها نفسه ووصف بها نبيه صلى الله عليه وسلم بالمؤمنين.", "Al-Raʾūf is an intensive form of raʾfa, the most tender and complete form of mercy, which keeps harm away from the one it is shown to. Allah describes Himself with it, and also describes His Prophet ﷺ with it toward the believers."], ["الشاكر: الذي يجزي على العمل القليل بالثواب الكثير, ولا يضيع إحسان محسن. فكل إحسان يقدمه المخلوق يلقى جزاءه من الله في الدنيا أو في الآخرة, وشكر الله لعباده قبوله لأعمالهم ومضاعفة أجرها.", "Al-Shākir is the One who rewards a small deed with a great reward and never wastes a good act. Every good done by a creature is repaid by Allah in this world or the next; His gratitude means He accepts our deeds and multiplies their reward."], ["الإله (الله): هو المعبود بحق, المستحق للألوهية وحده, ومعنى لا إله إلا الله: لا معبود بحق إلا الله. وهو الخالق الرب الذي يرجع إليه الأمر كله, فلا يستحق العبادة سواه.", "Al-Ilāh (Allah) is the One truly worshipped, who alone deserves divinity. \"Lā ilāha illā Allāh\" means that none is truly worthy of worship except Allah. He is the Creator and Lord to whom all affairs return, so no one else deserves worship."], ["الغفور: صيغة مبالغة من المغفرة, وأصل الغفر الستر والتغطية, فالله يستر الذنوب ويمحو أثرها, ويغفر الكثير منها مهما كبر. وهو اسم يفتح باب الرجاء للتائبين.", "Al-Ghafūr is an intensive form of forgiveness. Ghafr originally means covering, so Allah covers sins and removes their effect, forgiving many sins however great. The name opens the door of hope to those who repent."], ["القريب: قرب الله من عباده قرب علم وإحاطة وقدرة, وقرب إجابة لمن دعاه. وهو مع المؤمنين بالحفظ والتأييد والنصر. ومن أيقن أن الله قريب منه لم يجرؤ على معصيته.", "Al-Qarīb means Allah is near to His servants: near in knowledge and encompassing power, and near in answering the one who calls on Him. He is with the believers with protection, support and help. Whoever is certain that Allah is near will hesitate to disobey Him."], ["الحليم: صاحب الحلم, وهو الأناة وعدم التعجيل بالعقوبة مع القدرة عليها. فالله يُمهل العاصي ويستره ولا يعاجله, ليتوب ويرجع. والحلم ضد العجلة التي تفسد أمور الدين والدنيا.", "Al-Ḥalīm is the Forbearing: the One who does not hasten to punish although He is able to. Allah gives the sinner time and covers him so he may repent and return. Forbearance is the opposite of haste, which spoils matters of religion and of this world."], ["الحي: الذي له الحياة الكاملة الدائمة, التي لم تُسبق بعدم ولا يلحقها فناء, وهي أصل صفات الكمال كلها من علم وقدرة وسمع وبصر. وهو اسم من أعظم الأسماء, ورد في آية الكرسي.", "Al-Ḥayy is the Ever-Living: His life is complete and everlasting, without a beginning or end, and it is the source of all His attributes of perfection such as knowledge, power, hearing and sight. It is among the greatest names and appears in Āyat al-Kursī."], ["القيوم: القائم بنفسه المقيم لغيره, فهو سبحانه غني عن كل شيء ولا قيام لشيء إلا به. وهو المدبر لأمور خلقه والقائم عليهم بالرعاية والحفظ. ويُذكر مع الحي في آية الكرسي.", "Al-Qayyūm is the One who stands by Himself and sustains everything else. He needs nothing, and nothing exists or stands except through Him. He manages His creation and watches over it. It is paired with al-Ḥayy in Āyat al-Kursī."], ["العلي: من أسماء التنزيه, ومعناه العالي فوق خلقه, علو الذات وعلو القدر وعلو القهر, المنزه عن كل نقص. وهو العلي العظيم الذي لا يعلو عليه شيء.", "Al-ʿAlī is the Most High, one of the names of transcendence: He is above His creation in essence, in rank and in power, and free of every imperfection. Nothing is above Him."], ["العظيم: الموصوف بالعظمة, وهي الكبر والجلال وعلو الشأن. والعظمة لله حقيقةً, وإذا وُصف بها العبد فهي مذمومة لأنها كبر وتجبّر. وكل أمة بنت مجدها على التعالي والتغطرس كان مصيرها الهلاك كقوم عاد.", "Al-ʿAẓīm is the Magnificent: the One of true greatness, majesty and exalted rank. Greatness belongs to Allah in reality; when claimed by a human it is blameworthy, as it becomes arrogance. Nations that built their glory on pride and tyranny, like ʿĀd, ended in ruin."], ["الحميد: بمعنى المحمود, من الحمد وهو نقيض الذم. فالحمد يتعلق بالكمال والذم بالنقص, والله كامل كمالاً مطلقاً فهو المستحق للحمد على ذاته وأسمائه وصفاته وأفعاله, ويحمده خلقه.", "Al-Ḥamīd means the Praiseworthy. Praise is tied to perfection and blame to deficiency; since Allah is perfect in an absolute way, He deserves all praise for His essence, names, attributes and actions, and His creation praises Him."], ["الوهاب: صيغة مبالغة من الواهب, وهو الذي يعطي الهبة من غير عوض ولا غرض. فالله يهب بلا حساب, يهب الحياة والصحة والعقل والذرية والهداية, والنفوس مجبولة على حب من أحسن إليها.", "Al-Wahhāb is the Bestower, an intensive form of giver: He gives gifts without return and without need. Allah gives without measure: life, health, intellect, children and guidance. Hearts are naturally made to love the one who is good to them."], ["الوكيل: القائم بأمور عباده, الكفيل برزقهم وتدبير شؤونهم, الذي يُفوَّض إليه الأمر. ومن توكل على الله تولاه وكفاه, ومن استغنى به أغناه. ومعنى «حسبنا الله ونعم الوكيل»: الله يكفينا, ونعم من يُعتمد عليه.", "Al-Wakīl is the One who takes charge of His servants' affairs, guarantees their provision and manages their matters; the One to whom everything is entrusted. Whoever relies on Allah, He takes care of and suffices him."], ["الرقيب: الحافظ الذي لا يغيب عنه شيء, والمراقبة: الحفظ والحراسة والانتباه. فالله يراقب عباده في السر والعلن, علماً وحفظاً, ومن أيقن أنه يعلم ويراقب استقام وانتهت مشكلاته.", "Al-Raqīb is the Watchful: the One who guards and observes everything and from whom nothing is absent. Allah watches His servants in private and in public, with knowledge and protection. Whoever is certain that He sees and watches stays upright."], ["الحسيب: له ثلاثة معان: الكافي الذي يكفي عباده, والمحاسب الذي يحاسب الخلق على أعمالهم, والمكافئ. ومنه «حسبي الله ونعم الوكيل», أي الله كافيني.", "Al-Ḥasīb has several meanings: the One who is sufficient for His servants, the One who takes the creation to account for their deeds, and the One who repays. From it comes \"Ḥasbiya Allāh\", meaning Allah is enough for me."], ["الشهيد: صيغة مبالغة من الشاهد, والشهود الحضور مع الرؤية والعلم. فالله شهيد على كل شيء, حاضر بعلمه لا يغيب عنه شيء, وسيشهد على الخلق يوم القيامة بما عملوا.", "Al-Shahīd is the Witness: shuhūd means being present, seeing and knowing. Allah is witness over everything; nothing is absent from His knowledge, and He will testify over His creation on the Day of Judgment about what they did."], ["العفو: الذي يمحو الذنوب ويتجاوز عن السيئات, وهو أبلغ من الغفور. فتح الله لعباده باب التوبة لأنه يعلم أنهم يخطئون, فمهما بلغت إساءة العبد لا ييأس من عفوه.", "Al-ʿAfuww is the One who wipes away sins and overlooks wrongdoing; it conveys even more than al-Ghafūr. Allah opened the door of repentance because He knows His servants err, so however great a person's wrongdoing, he should not lose hope in His pardon."], ["المقيت: من القوت, وهو ما يمسك الرمق ويقيم البدن, فالله هو الموصل القوت لكل مخلوق, وقيل: هو المقتدر والحفيظ. فهو الذي خلق الطعام وخلق الجسم وجعل بينهما توافقاً.", "Al-Muqīt is the Sustainer, from qūt, the food that keeps the body going. Allah supplies each creature with its sustenance; it is also explained as the All-Powerful and Protector. He created food and the body and made them fit each other."], ["القاهر: من القهر, وهو الغلبة والعلو مع الإذلال, فالله يقهر كل قوة تظن نفسها لا تُقهر, ويقهر الظالمين والمتغطرسين. ومن آثار هذا الاسم أن ينقض عزائم الجبابرة.", "Al-Qāhir is the Subduer: qahr is overcoming and being above with subjugation. Allah subdues every power that believes itself unconquerable, including tyrants and the arrogant, and He breaks the resolve of oppressors."], ["الخبير: صيغة مبالغة من الخبرة, وهو العالم ببواطن الأمور وحقائقها وبواعثها ودقائقها, لا يخفى عليه شيء. فلا تتحرك ذرة ولا تسكن إلا بعلمه, يعلم الداء والدواء.", "Al-Khabīr is the All-Aware: the One who knows the inner nature, motives and finest details of every matter. No atom moves or rests without His knowledge; He knows the disease and the remedy."], ["اللطيف: له معنيان: الذي يعلم دقائق الأمور وخفاياها, والذي يوصل الخير إلى عباده برفق من حيث لا يشعرون. فلطفه رقة ورحمة وتدبير خفي لمصلحتهم, يدفع به عنهم الشر.", "Al-Laṭīf has two meanings: the One who knows the subtlest details and hidden things, and the One who brings good to His servants gently and in ways they do not notice. His kindness is a quiet care that works for their benefit and keeps harm away."], ["الغني: الذي لا يحتاج إلى أحد, ويحتاج إليه كل أحد في كل شيء. وغنى الإنسان نسبي, فهو مفتقر إلى غيره كالطبيب والصانع, أما غنى الله فمطلق, وهو الغني بذاته عن خلقه وعن عبادتهم.", "Al-Ghanī is the Self-Sufficient: the One who needs no one while everyone needs Him in everything. Human wealth is relative, since even the rich depend on others such as the doctor; Allah's richness is absolute, He is independent of His creation and of their worship."], ["الولي: الناصر المتولي لأمور عباده, المحب لهم المعين لهم. ولي الذين آمنوا يخرجهم من الظلمات إلى النور, والإنسان مفطور على الضعف والافتقار, وفي افتقاره إلى الله سعادته. والمولى اسم قريب منه.", "Al-Walī is the Protecting Friend: the One who takes charge of His servants' affairs, loves them and helps them. He is the ally of those who believe and brings them out of darkness into light. Humans are made weak and needy, and their need of Allah is their happiness. \"Al-Mawlā\" is closely related."], ["النصير: صيغة مبالغة من الناصر, فمهما قوي الأعداء فالله هو النصير الذي ينصر من يشاء. والنصر من عند الله وحده, وله قواعد وشروط, أولها الاستقامة على أمره والافتقار إليه.", "Al-Naṣīr is the Helper, an intensive form: however strong the enemies, Allah is the One who gives victory. Victory comes only from Him and has conditions, the first being to stay upright on His command and to turn to Him in need."], ["الحفيظ: الحافظ لخلقه ولكل شيء, يصونه من التلف والضياع. يحفظ السماوات والأرض, ويحفظ عباده بملائكة تحرسهم, ويحفظ أعمالهم ويحصيها, ولا يغيب عنه شيء ولا ينساه.", "Al-Ḥafīẓ is the Preserver: He protects His creation and everything in it from loss and ruin. He preserves the heavens and the earth, protects His servants through angels who guard them, and keeps a record of their deeds; nothing escapes Him or is forgotten."], ["القوي: الموصوف بكمال القوة, وهي نقيض الضعف والعجز. وكل قوة في الأرض مستمدة من قوته, تأييداً للمؤمنين أو استدراجاً للكافرين. وهو القوي وحده, ولا يعجزه شيء.", "Al-Qawī is the Strong, the One of perfect strength, the opposite of weakness and incapacity. All strength on earth is drawn from His strength, given as support to the believers or as a gradual trial for the disbelievers. He alone is truly strong and nothing weakens Him."], ["المجيد: الكريم الواسع المجد, وأصل المجد جمع شرف الذات إلى حسن الفعال. فالله له المجد في ذاته وأسمائه وصفاته وأفعاله, وهو عظيم الجلال والإحسان.", "Al-Majīd is the Glorious: the One of vast honour and generosity. Majd combines nobility of essence with excellence of action. Allah has glory in His essence, names, attributes and deeds, and is great in majesty and in giving."], ["الواحد: المتفرد بذاته وصفاته وأفعاله, الذي لا شريك له ولا مثيل. والتوحيد أن تؤمن بالله إلهاً واحداً. وهو القائم بنفسه الذي لا يفتقر إلى غيره, ويحتاجه كل شيء, كامل بذاته وأسمائه وصفاته.", "Al-Wāḥid is the One, unique in His essence, attributes and actions, with no partner or equal. Tawḥīd is to believe in Allah as the one God. He stands by Himself, needs nothing, and everything needs Him; He is perfect in His essence, names and attributes."], ["القهار: صيغة مبالغة من القاهر, يقهر الطغاة مهما كثروا, وله القهر المطلق على جميع المخلوقات, وإرادته نافذة لا يعارضها أحد. ومن أراد أن يكون قوياً فليتوكل عليه مستقيماً على أمره.", "Al-Qahhār is the Overwhelming, an intensive form of \"subduer\": He overcomes tyrants however many they are, His authority over all creatures is complete, and His will cannot be opposed. Whoever wants strength should rely on Him while staying upright on His command."], ["الكبير: نقيض الصغير, والكبر في الله اتساع الذات وعظمة الصفات. فهو سبحانه أكبر من كل شيء, وكل شيء تحت قهره وسلطانه. ومعنى «الله أكبر» أنه أكبر من كل ما نخافه أو نرجوه.", "Al-Kabīr is the Great, the opposite of small. Allah's greatness lies in the vastness of His essence and the majesty of His attributes. He is greater than everything and everything is under His power. \"Allāhu akbar\" means He is greater than anything we fear or hope for."], ["المتعالي: صيغة من العلو أبلغ من العلي, فهو المرتفع فوق كل شيء بقدرته وقهره وعظمته, المحيط بكل شيء علماً وقدرة. وقد اقترن في القرآن بالكبير: «الكبير المتعال».", "Al-Mutaʿālī is the Exalted, a form of height that conveys more than al-ʿAlī: He is raised above everything in power, dominion and greatness, and encompasses all things in knowledge and might. In the Quran it is joined to al-Kabīr: \"the Great, the Exalted\"."], ["الوارث: الباقي بعد فناء الخلق, فكل ما بيد الناس يرجع إليه. ولذلك فالإنسان لا يملك حقيقة, بل ما في يده أمانة من الله, وهو الوارث الذي ترجع إليه الأرض ومن عليها.", "Al-Wārith is the Inheritor: the One who remains after all creation passes away, and to whom everything people hold returns. So a person does not truly own anything; what is in his hand is a trust from Allah, who inherits the earth and all upon it."], ["الخلاق: صيغة مبالغة من الخالق, تدل على الكثرة والإتقان معاً: فالله يخلق ما يشاء كماً ونوعاً, ويحسن كل ما خلق. وقد خلق من لا شيء كل شيء على غير مثال سابق.", "Al-Khallāq is an intensive form of Creator, pointing to both the number and the quality of what He creates: Allah creates whatever He wills and perfects all He creates. He made everything from nothing, on no earlier model."], ["البصير: صيغة مبالغة من البصر, فالله يرى كل شيء في عالم الغيب والشهادة مهما دق أو خفي أو عظُم, لا يخفى عليه شيء. وبصره صفة تليق بجلاله, نثبتها من غير تمثيل ولا تعطيل: «ليس كمثله شيء وهو السميع البصير».", "Al-Baṣīr is the All-Seeing, an intensive form of sight. Allah sees everything in the seen and the unseen, however small, hidden or great, and nothing is concealed from Him. His sight is an attribute that befits His majesty, affirmed without likening it to ours: \"There is nothing like Him, and He is the All-Hearing, the All-Seeing.\""], ["الحق: الثابت الموجود الذي لا يزول, والمطابق للواقع, وهو العدل ضد الظلم. والله هو الحق لأن وجوده دائم لا يسبقه عدم ولا يلحقه فناء, وقوله حق ووعده حق, ودينه هو الحق.", "Al-Ḥaqq is the Truth: the Real and Ever-Existing who never ceases, the One whose word matches reality, and justice as opposed to wrong. Allah is al-Ḥaqq because His existence is permanent, with no beginning or end; His word and promise are true, and His religion is the truth."], ["المبين: من أبان بمعنى أظهر ووضّح, فهو سبحانه الذي بيّن الحق وأوضحه لعباده بالآيات والرسل والكتب. والبيان من أرقى أدوات التواصل, والله هو الذي علّم الإنسان البيان.", "Al-Mubīn is the One who makes things clear: Allah made the truth plain to His servants through signs, messengers and scriptures. Clear expression is among the finest means of human communication, and it is Allah who taught humans to express themselves."], ["الفتاح: صيغة مبالغة من الفتح, فهو يفتح أبواب الرزق والرحمة والهداية, ويفتح ما استعصى من الأبواب مهما أُغلق, وهو الذي يحكم بين عباده بالحق. وقد يُغلق الأمر على الخلق فيفتحه الله.", "Al-Fattāḥ is the Opener, an intensive form of opening: He opens the doors of provision, mercy and guidance, opens doors that seemed shut for good, and judges between His servants with truth. When a matter is closed to people, Allah opens it."], ["الشكور: صيغة مبالغة من الشكر, وأصل الشكر الزيادة والظهور. فالله يجزي على العمل القليل بالأجر الكثير ويضاعفه, ويشكر لعباده طاعتهم فيقبلها ويثيبهم عليها, وهو الذي يستحق الشكر من خلقه.", "Al-Shakūr is the Most Appreciative, an intensive form of gratitude; shukr originally means increase and showing forth. Allah rewards a little obedience with abundant reward and multiplies it, accepts and thanks His servants for their good deeds, and is the One most deserving of thanks."], ["المجيب: الذي يستجيب لمن دعاه ويعطي السائل ما سأل, فلا يرد دعاء عبد صادق. والإجابة تكون بتحقيق المطلوب, أو بدفع شر مثله, أو بادخار الأجر للآخرة. وهو قريب مجيب.", "Al-Mujīb is the One who responds to the one who calls on Him and gives the asker what he asks. He does not turn away a sincere prayer: He answers by granting the request, by averting a similar harm, or by storing the reward for the Hereafter."], ["الغفار: صيغة مبالغة من الغفر, يغفر الذنوب كثرةً ونوعاً, وأصل المغفرة التغطية والستر. فهو يستر الذنب على صاحبه في الدنيا والآخرة, ويتجاوز عنه فضلاً منه.", "Al-Ghaffār is the Ever-Forgiving, an intensive form: He forgives sins in number and in kind, and maghfira originally means covering. He covers the servant's sin in this world and the next and overlooks it out of His bounty."], ["المولى: من الولاية وهي القرب وتولي الأمر, فالله هو الناصر المتولي لشؤون عباده المؤمنين, يرعاهم ويدبر أمورهم ويحفظهم, وإليه مرجعهم. وهو نعم المولى ونعم النصير.", "Al-Mawlā is the Protector, from walāya, nearness and taking charge. Allah is the Helper who takes care of His believing servants' affairs, looks after them, protects them, and is the One they return to. He is the best Protector and the best Helper."], ["الرزاق: صيغة مبالغة من الرازق, يرزق جميع المخلوقات مهما كثر عددها رزقاً وافراً, ما شاء وكيف شاء بلا حدود. ورزقه لا يقتصر على المال, بل يشمل الصحة والعلم والهداية.", "Al-Razzāq is the Ever-Providing, an intensive form: He provides for all creatures however many, abundantly and without limit. His provision is not only wealth, but also health, knowledge and guidance."], ["المتين: القوي الثابت في قوته, الشديد في عزمه, الذي لا تضعف قوته ولا تنقطع. والمتانة قوة مستمرة ممتدة مع الإحكام, فالله كامل القوة لا يعجزه شيء في الأرض ولا في السماء.", "Al-Matīn is the Firm: the One whose strength is constant, whose determination is unshakeable, and whose power neither weakens nor ends. Matāna is lasting strength joined with solidity; Allah's power is complete and nothing on earth or in the heavens can defeat Him."], ["البر: العطوف على عباده المحسن إليهم بلطفه وبره, الصادق في وعده. يعطي بلا حساب, ويرحم عباده ويتجاوز عنهم, وبره يشمل خلقه كلهم في الدنيا وخاصة المؤمنين في الآخرة.", "Al-Barr is the Kind and Beneficent: tender toward His servants, doing good to them through His gentleness, and true to His promise. He gives without reckoning, shows mercy and overlooks; His kindness covers all creation in this world and the believers in particular in the next."], ["المقتدر: أبلغ من القادر والقدير, وهو التام القدرة المتمكن من كل شيء تمكناً كاملاً, الذي لا يمتنع عليه شيء. فقدرته مطلقة بخلاف قدرة البشر التي تنتهي حدودها, وبمعرفة قدره سبحانه حق المعرفة يُعظَّم ويُطاع.", "Al-Muqtadir is the One of perfect, complete power, stronger in sense than al-Qādir and al-Qadīr: He has full command over everything and nothing is beyond Him. His power is absolute, unlike human power which has limits; knowing His true worth leads to honouring and obeying Him."], ["المليك: صيغة مبالغة من الملك, وهو الذي يملك ويحكم. فالملك يحكم ولا يملك, والمالك يملك ولا يحكم, والله ملك ومالك ومليك: يملك الملك والملكوت, ويتصرف في كل شيء خلقاً وتدبيراً ومصيراً.", "Al-Malīk is the Sovereign King, an intensive form of malik. A king rules without owning, an owner owns without ruling, but Allah is King, Owner and Sovereign: He owns the kingdom and the unseen dominion and disposes of everything in its creation, management and final end."], ["الأول: الذي ليس قبله شيء, المتقدم في الوجود على كل شيء, وكل شيء مبني على وجوده. فهو سبحانه أول بلا ابتداء, وهو أول رتبةً أيضاً, فكل خير منه, ولا يسبقه أحد.", "Al-Awwal is the First: the One before whom there is nothing, preceding everything in existence, with everything built upon His existence. He is first without a beginning, and also first in rank: all good comes from Him and none precedes Him."], ["الآخر: الذي ليس بعده شيء, الباقي بعد فناء الخلق كله. وهو يقابل الأول, فهو سبحانه الدائم الذي لا يلحقه فناء, وإليه ينتهي كل شيء ومصير الخلق.", "Al-Ākhir is the Last: the One after whom there is nothing, who remains after all creation has perished. He is the counterpart of al-Awwal, the Everlasting who never ends, and to Him everything and the destiny of creation finally return."], ["الظاهر: من الظهور, وهو الغالب العالي الذي ليس فوقه شيء. ظهرت دلائل وجوده وقدرته في كل شيء, وهو الظاهر بالغلبة والقهر فوق كل شيء. وقد جاء في الحديث: «وأنت الظاهر فليس فوقك شيء».", "Al-Ẓāhir is the Manifest, from ẓuhūr: the Dominant and High above whom nothing exists. The proofs of His existence and power are visible in everything, and He is manifest in overcoming everything. The Prophet ﷺ said: \"You are al-Ẓāhir, so nothing is above You.\""], ["الباطن: الذي احتجب عن أبصار الخلق مع قربه منهم, ويعلم بواطن الأمور وخفاياها, فليس دونه شيء. احتجب سبحانه بذاته عن الأبصار لحكمة هي الابتلاء, وهو أقرب إلى عباده من أنفسهم بعلمه.", "Al-Bāṭin is the Hidden: veiled from the sight of creatures although near to them, and He knows the inner side and hidden depths of everything, so nothing is closer than He. He is hidden from sight for the wisdom of testing, yet closer to His servants than themselves through His knowledge."], ["الملك: صاحب الملك والتصرف المطلق, والقدرة على الحكم والأمر والنهي, وهو مالك الملوك. وهو من أسماء الذات ومن أسماء الأفعال, فكل ما يُملك فمالكه الله, ويملك ويحكم ويتصرف ومصير كل شيء إليه.", "Al-Malik is the King: the One of absolute dominion and authority, with power to rule, command and forbid; the King of kings. Everything that is owned is ultimately owned by Allah; He owns, governs and disposes of all things, and everything returns to Him."], ["القدوس: المنزه عن كل نقص وعيب وعن كل صفة تشبه صفات الخلق. فكل ما يخطر ببالنا عن الله فهو سبحانه أكبر منه. ومن معاني «الله أكبر» أنه أكبر مما عرفنا, والقدوس طاهر منزه تعالى عن الأوهام.", "Al-Quddūs is the Holy: free of every fault and deficiency and of any attribute resembling the creation. Whatever we imagine about Allah, He is greater than it. The meaning of \"Allāhu akbar\" includes that He is greater than all we know; al-Quddūs is pure and exalted above all human imagination."], ["السلام: ذو السلامة, فذاته سالمة من كل عيب, وصفاته سالمة من كل نقص, وأفعاله سالمة من كل شر مطلق, فما في الدنيا من شرور هو في الحقيقة خير في مآله وحكمته. وهو الذي يمنح عباده السلامة والأمان.", "Al-Salām is the Source of Peace: His essence is free of every fault, His attributes free of every deficiency, and His acts free of absolute evil; the evils in the world are, in their end and wisdom, serving good. He is the One who grants His servants safety and peace."], ["المؤمن: الذي يمنح الأمان لعباده, ويصدّق رسله بالآيات, ويصدق وعده. ومن اسمه المؤمن أنه آمن أولياءه من عذابه, وآمن خلقه من أن يظلمهم. وقد سمّى الله المؤمنين باسم مشتق من اسمه تكريماً لهم.", "Al-Muʾmin is the Granter of Security: He gives safety to His servants, confirms His messengers by signs, and is true to His promise. He makes His friends safe from His punishment and assures creation that He will not wrong them. Allah honoured the believers by naming them with a word taken from His own name."], ["المهيمن: الرقيب الشهيد الذي يعلم السر وأخفى, المسيطر على خلقه علماً وقدرةً. ومن لوازم الاسم القدرة التامة على تحقيق مصالح العباد, والمواظبة والاستمرار في الرقابة, فلا يغفل ولا ينام.", "Al-Muhaymin is the Guardian and Watcher who knows the secret and what is even more hidden, in full control of His creation in knowledge and power. The name implies complete ability to bring about His servants' good, and constant, uninterrupted oversight: He never neglects or sleeps."], ["الجبار: له ثلاثة معان: العالي الذي لا يُنال, والقاهر الذي يجبر الخلق على ما يريد, والذي يجبر الكسر ويصلح الحال ويجبر قلوب المنكسرين. وهو إذا وُصف به العبد فهو ذم, أما في الله فهو مدح.", "Al-Jabbār has three meanings: the Exalted who cannot be reached, the Compeller who brings creation to what He wills, and the One who mends what is broken and consoles the broken-hearted. For a human it is a blame, but for Allah it is praise."], ["المتكبر: المتعالي عن صفات الخلق, الذي له الكبرياء وحده. والكبر مذموم في العبد لأنه يضع نفسه فوق مقامه, ممدوح في الله لأنه الأحق به. وهو العظيم الذي لا ينبغي لأحد أن ينازعه فيه.", "Al-Mutakabbir is the Supreme: exalted above the attributes of creatures, the One who alone possesses greatness. Arrogance is blameworthy in a servant because he puts himself above his rank, but is praiseworthy in Allah because it is truly His right; no one may compete with Him in it."], ["الخالق: الموجد للأشياء من العدم على غير مثال سابق, وقد يأتي الخلق بمعنى المخلوق. والخالق المبدع المقدّر الذي أتقن خلق كل شيء, ومن آياته في خلق الإنسان ما لا تستطيع الصناعة البشرية مجاراته.", "Al-Khāliq is the Creator: He brings things into existence from nothing, on no earlier model; \"khalq\" can also mean the created. He designs and perfects everything He creates, and in the human body are signs that human engineering cannot match."], ["البارئ: بمعنى الخالق, لكنه يختص بخلق الشيء سليماً من التفاوت والعيب, المميز بعضه عن بعض بالصور والأجناس. فالخالق: المقدّر, والبارئ: المنفذ الذي يُخرج المخلوقات من العدم إلى الوجود.", "Al-Bāriʾ is the Maker, close in sense to the Creator, but it highlights bringing creatures into being free of defect and distinct from one another in form and kind. In a common explanation, al-Khāliq plans and measures, and al-Bāriʾ carries it out, bringing creatures from non-existence into existence."], ["المصور: الذي يعطي كل مخلوق صورته الخاصة على الهيئة التي أرادها. فهو مرحلة ثالثة بعد الخلق والبرء: خلق من العدم, ثم أخرج المخلوق سليماً, ثم صوّره وزيّنه بالشكل والهيئة التي ينتفع بها.", "Al-Muṣawwir is the Fashioner: He gives each creature its own particular form as He willed. It is a third stage after creating and making: He brings it from nothing, brings it forth sound, then shapes and adorns it in the form that serves it."], ["القادر: من القدر والتقدير, فالله يقدّر المقادير في علمه قبل أن يخلق الأشياء, ثم يُنفذها بقدرته. فالقدر مبني على العلم والقدرة معاً, وله القدرة التامة على كل شيء.", "Al-Qādir is the Able, from qadr and taqdīr: Allah determines all measures in His knowledge before creating things, then carries them out by His power. Destiny rests on both knowledge and power, and He has complete ability over everything."], ["الكريم: الكرم يشمل كل صفة محمودة, فليس العطاء وحده. والله كريم في ذاته وأسمائه وأفعاله, يعطي بلا سؤال, ويعفو عن المسيء, ويتجاوز ويُكرم عباده, وهو نقيض اللئيم.", "Al-Karīm is the Generous: karam covers every praiseworthy quality, not only giving. Allah is generous in His essence, names and actions: He gives without being asked, pardons the wrongdoer, overlooks and honours His servants. It is the opposite of meanness."], ["الودود: مأخوذ من الودّ, وهو المحبة والمودة. فالله يحب عباده المؤمنين ويحبونه, ويتودد إليهم بنعمه. والودّ فيه معنى المعية والمصاحبة, وهو من لوازم المحبة.", "Al-Wadūd is the Most Loving, from wudd, love and affection. Allah loves His believing servants and they love Him, and He shows His love to them through His blessings. Wudd also carries the sense of closeness and companionship, which follows from love."], ["الأعلى: اسم تفضيل من العلو, من أسماء التنزيه, فهو العالي فوق كل شيء ذاتاً وقدراً وقهراً, المنزه عن كل نقص وعما لا يليق به, فلا أحد يعلو عليه.", "Al-Aʿlā is the Most High, a superlative from height and one of the names of transcendence: He is above everything in essence, rank and power, free of all deficiency and of what is unfitting for Him. No one is higher than Him."], ["الأكرم: اسم تفضيل من الكرم, أي أعظم الكرماء. وجاء في أول ما نزل: «اقرأ وربك الأكرم», فكرمه أنه علّم الإنسان ما لم يعلم. وهو الذي لا ينفد عطاؤه, ولا يضيع إحسانه.", "Al-Akram is the Most Generous, the superlative of karam. It appears in the first revelation: \"Read, and your Lord is the Most Generous\", whose generosity includes teaching humanity what it did not know. His giving never runs out and His kindness is never lost."], ["الأحد: من الواحد, لكنه يفيد النفي, فهو الذي لا مثيل له ولا نظير. الواحد من حيث العدد, والأحد من حيث النوع, فالله منفرد في ذاته وصفاته وأفعاله, ولا يحتاج إلى شيء وكل شيء يحتاج إليه.", "Al-Aḥad is the Unique, related to \"one\" but carrying the sense of negation: nothing like Him exists. \"Wāḥid\" refers to number and \"Aḥad\" to kind: Allah is alone in His essence, attributes and actions, needing nothing while everything needs Him."], ["الصمد: له معنيان: السيد المقصود في الحوائج الذي يُفزع إليه ولا يُقضى أمر دونه, والذي لا جوف له ولا يحتاج إلى طعام. فهو الغني الكامل في سؤدده, وكل الخلق يصمدون إليه, أي يقصدونه.", "Al-Ṣamad is the Self-Sufficient Master. It has two meanings: the Lord to whom all turn in their needs and without whom no matter is decided, and the One who has no hollow interior and needs no food. He is perfect in lordship and all creation turns to Him."], ["الوتر: الفرد الذي لا شريك له ولا مثيل. والله وتر والخلق شفع, فالمخلوقات تأتي أزواجاً مفتقرة إلى بعضها, أما الله فواحد لا يحتاج إلى أحد. وجاء في الحديث: «إن الله وتر يحب الوتر».", "Al-Witr is the One: the single, without partner or equal. Allah is the Witr and the creation is paired; creatures come in pairs, each needing the other, while Allah is one and needs no one. In the hadith: \"Allah is witr and loves the witr.\""], ["الجميل: ذو الجمال الكامل في ذاته وأسمائه وصفاته وأفعاله. وقد جاء في صحيح مسلم: «إن الله جميل يحب الجمال». وجماله يشمل الجلال والكمال, ويدعو إلى حبه ومعرفته.", "Al-Jamīl is the Beautiful: perfectly beautiful in His essence, names, attributes and actions. In Ṣaḥīḥ Muslim: \"Allah is beautiful and loves beauty.\" His beauty includes majesty and perfection, and calls hearts to love and know Him."], ["الحيي: ذو الحياء, وهو صفة كريمة تمنع من فعل ما يشين. ومن حياء الله أنه يستحي من عبده إذا رفع يديه إليه أن يردهما صفراً, فيعطيه ويستر عيبه, كرماً منه وفضلاً.", "Al-Ḥayiyy is the Modest: ḥayāʾ is a noble quality that keeps one from what is shameful. Allah's modesty means He is shy to return empty the hands His servant raises to Him: He gives and covers the servant's faults, out of generosity and bounty."], ["الستير: صيغة مبالغة من الستر, يستر العيوب والذنوب مهما كثرت, ويحب الستر لعباده. فهو يستر على العاصي في الدنيا ولا يفضحه, ويحب من عباده أن يستروا ولا يتتبعوا عورات الناس.", "Al-Sittīr is the All-Concealing, an intensive form of covering: He covers faults and sins however many, and loves covering for His servants. He conceals the sinner in this world and does not expose him, and loves that His servants cover others and do not hunt for their flaws."], ["المقدم: الذي يقدّم من يشاء من خلقه بالتوفيق والرفعة والحظ, ويقدّم الأشياء في الوجود وفق حكمته. ورد في دعاء النبي ﷺ: «أنت المقدم وأنت المؤخر». ويقترن في الأغلب بالمؤخر.", "Al-Muqaddim is the One who advances whoever He wills among His creatures through success, honour and favour, and places things first in existence according to His wisdom. The Prophet ﷺ said in a prayer: \"You are the Advancer and You are the Delayer.\" It is usually mentioned with al-Muʾakhkhir."], ["المؤخر: الذي يؤخر ما يشاء ومن يشاء بحكمته, فيؤخر العقوبة عن عباده, ويؤخر الأجل, ويؤخر من استحق التأخير. وفي غزوة بدر أخّر الله المشركين فكانوا أهلاً لتوبيخ النبي ﷺ. فهو يؤخر كل شيء لحكمة.", "Al-Muʾakhkhir is the Delayer: the One who postpones whatever and whomever He wills according to His wisdom. He delays punishment from His servants, delays the appointed time, and puts back those who deserve to be put back. Everything He delays is for a wise reason."], ["المسعر: الذي يرفع الأسعار ويخفضها بحكمته, يزيد الشيء أو ينقصه في قيمته وتأثيره ومكانته. فكل رخص وغلاء بقدر الله, ولا يجوز للبشر الاعتراض بالظلم, ومنه قول النبي ﷺ: «إن الله هو المسعر القابض الباسط الرازق».", "Al-Musaʿʿir is the One who sets prices: He raises or lowers the value, effect and standing of things according to His wisdom. Cheapness and scarcity both happen by His decree. The Prophet ﷺ said: \"Allah is the Price-Setter, the Withholder, the Expander, the Provider.\""], ["القابض: الذي يقبض الأرزاق والأرواح والقلوب, ويمسك العطاء بحكمته عمن يشاء. والقبض ضد البسط, فهو يقبض الرزق عمن يشاء ابتلاءً, ويقبض أرواح عباده عند آجالهم, ويقبض القلوب فيضيقها.", "Al-Qābiḍ is the Withholder: He withholds provision, souls and hearts, and holds back giving from whom He wills according to His wisdom. Qabḍ is the opposite of basṭ: He withholds provision from some as a trial, takes the souls of His servants at their appointed time, and narrows hearts."], ["الباسط: الذي يبسط الرزق والرحمة والأخلاق لمن يشاء, فيوسع على عباده بمنّه. وهو يبسط يده بالعطاء, ويبسط القلوب بالفرح, ويبسط التوبة لعباده. ويقترن بالقابض, فلا يكتمل الاسم إلا بذكر ضده.", "Al-Bāsiṭ is the Expander: He expands provision, mercy and hearts for whom He wills, giving widely from His bounty. He extends His hand in giving, opens hearts with joy and spreads out repentance for His servants. It is paired with al-Qābiḍ, since each is understood together with its opposite."], ["الرازق: الذي يعطي كل مخلوق ما ينتفع به, والرزق ما انتفعت به فعلاً من طعام ولباس وسكن, وهو غير الكسب الذي يُحاسَب عليه الإنسان. فالله هو الرازق لجميع خلقه على السواء, مؤمنهم وكافرهم.", "Al-Rāziq is the Provider: He gives each creature what it benefits from. Rizq is what one actually benefits from, such as food, clothing and shelter, which is not the same as earnings a person will be held accountable for. Allah provides for all His creation alike, believer and disbeliever."], ["الديان: صيغة مبالغة من دان بمعنى جازى, فهو الذي يجازي العباد بأعمالهم, ويحاسب على كل ذنب مهما كثر أو كبر, ويوم الدين هو يوم الجزاء. فلا تضيع عنده حسنة ولا يُظلم أحد.", "Al-Dayyān is the Requiter, an intensive form of dāna, \"to repay\": He repays His servants for their deeds and takes account of every sin however many or great; the Day of Judgment is the Day of Recompense. No good deed is lost with Him and no one is wronged."], ["المنان: صيغة مبالغة من المن, وهو العطاء العظيم والنعمة الثقيلة التي لا مقابل لها. وإنعام الله حق, فقد منّ علينا بنعمة الإيجاد, ثم الإمداد, ثم الهداية. ومنّة الله منزهة عن الأذى والتعالي.", "Al-Mannān is the Bestower of Favour, an intensive form of mann, a great and weighty blessing given with nothing in return. Allah's favour is real: He favoured us with existence, then with provision, then with guidance. His favour is free of any harm or superiority."], ["المالك: اسم فاعل من ملك, فالله مالك الأشياء كلها ومتصرف فيها, ملكيته مطلقة لعالم الغيب والشهادة وللدنيا والآخرة. وفي القراءات: «ملك يوم الدين» و«مالك يوم الدين», وكلاهما حق.", "Al-Mālik is the Owner: Allah owns all things and disposes of them, His ownership absolute over the unseen and the seen, this world and the next. In the readings, both \"Malik yawm al-dīn\" and \"Māliki yawm al-dīn\" are authentic."], ["المحسن: الذي يحسن إلى عباده, والإحسان ضد القبح, وإحسان الله يبدأ من الخلق: «الذي أحسن كل شيء خلقه». فقد جعل لنا عينين وأذنين وأعضاء متقنة, ويحسن إلينا بالنعم, ويحب المحسنين.", "Al-Muḥsin is the One who does good to His servants. Iḥsān is the opposite of ugliness, and Allah's iḥsān begins with creation: \"He who perfected everything He created.\" He gave us two eyes, two ears and finely made organs, does good to us with blessings, and loves those who do good."], ["الشافي: الذي يشفي من المرض فلا شفاء إلا شفاؤه. والمرض يصيب الإنسان بأسبابه, ولكن الشفاء بيد الله, كما قال إبراهيم: «وإذا مرضت فهو يشفين». وهو يشفي أمراض الأجساد والقلوب.", "Al-Shāfī is the Healer: there is no cure except His cure. Illness comes through its causes, but healing is in Allah's hand, as Ibrāhīm said: \"And when I am ill, it is He who heals me.\" He heals the ailments of both bodies and hearts."], ["الرفيق: اللطيف الذي يعامل عباده برفق, ويرافقهم بعلمه دون أن يشعروا, فرحمته ومغفرته وقبوله للتوبة رفق. وفي الحديث: «إن الله رفيق يحب الرفق». ومن دعاء السفر: «اللهم أنت الصاحب في السفر».", "Al-Rafīq is the Gentle: He treats His servants with softness and is with them through His knowledge without their sensing it; His mercy, forgiveness and acceptance of repentance are all gentleness. In the hadith: \"Allah is gentle and loves gentleness.\" A traveller's prayer says: \"O Allah, You are the Companion on the journey.\""], ["المعطي: الذي يعطي كل شيء, وكل نعمة في الكون عطاء منه, وما نفعله نحن مجرد تعبئة وتوزيع لما أعطاه. أعطانا نعمة الإيجاد, ونعمة الإمداد, ونعمة الهداية. وفي الحديث: «والله المعطي وأنا القاسم».", "Al-Muʿṭī is the Giver: He gives everything, and every blessing in the world is a gift from Him; what we do is only package and distribute what He gave. He gave us the gift of existence, the gift of sustenance and the gift of guidance. In the hadith: \"Allah is the Giver and I am the distributor.\""], ["السيد: من السيادة, والسيد المطلق هو الله لأنه مالك الخلق ومدبرهم, وبأمره يعملون وعن قوله يصدرون. وقد وُصف الإنسان بالسيد مجازاً, ولكن النبي ﷺ قال: «السيد الله», تحذيراً من تعظيم الناس بعضهم بعضاً.", "Al-Sayyid is the Master, from sayāda: the absolute Master is Allah because He owns and directs creation; by His command they act and from His word they proceed. A person may be called \"sayyid\" in a figurative sense, but the Prophet ﷺ said \"The Master is Allah\", warning against people exalting one another."], ["الطيب: المتصف بالطيب, المنزه عن كل نقص وعيب, طيب في ذاته وأسمائه وصفاته وأفعاله. ومن كمال طيبه أنه لا يقبل إلا طيباً. وقد طيّب الدنيا للموحدين فأحياهم حياة طيبة.", "Al-Ṭayyib is the Pure: the One who has all that is good, free of all fault, pure in His essence, names, attributes and acts. Part of His purity is that He accepts nothing except what is good, and He made this world pleasant for those who worship Him alone, giving them a good life."], ["الحكم: هو الذي يفصل بين عباده ويحكم بالعدل, والحكم بمعنى القضاء والفصل في الأمور, وأصله المنع. فلا حكم إلا حكمه, وإليه الحكم في الدنيا والآخرة, ولا معقب لحكمه.", "Al-Ḥakam is the Judge: He decides between His servants with justice. Ḥukm means ruling and deciding matters, and originally means preventing. No ruling is final except His, the judgment belongs to Him in this world and the next, and no one can revoke His decision."], ["الجواد: من جاد يجود, والجود الكرم والعطاء الكثير عن سماحة نفس وارتياح للعطاء. ومن الجود أن يبذل الإنسان نفسه في سبيل الله. والله جواد منح خلقه نعمة الوجود, فوجودك منحة منه, ثم أمدّك بما يديم هذا الوجود.", "Al-Jawād is the Munificent, from jāda yajūd: generosity and abundant giving that comes from an open, willing heart. The highest generosity is for a person to give his very self in God's way. Allah is munificent: He granted creation the gift of existence, so your being is a gift from Him, and then He supplied what sustains it."], ["السبوح: من التسبيح وهو التعظيم والتنزيه. والسبوح صيغة مبالغة, أي هو الذي يُسبَّح ويُقدَّس مهما سبّحه العباد, منزه عن كل نقص. والمطلوب من العبد ذكر كثير لا ذكر قليل كحال المنافقين.", "Al-Subbūḥ is the One exalted above all imperfection. Tasbīḥ is glorification and declaring Him free of any fault, and subbūḥ is an intensive form: however much His servants glorify Him, He remains the One who is glorified and held sacred. The servant is asked for much remembrance, not the little the hypocrites offer."], ["الإرادة: من الرود وهو الطلب, وهي المشيئة, ونزوع النفس إلى الشيء. وإرادة الله مطلقة نافذة, لا يكون في ملكه إلا ما يريد. وللإنسان إرادة مخلوقة اختار بها الطاعة أو المعصية, وبها يُحاسَب, ولكنها لا تخرج عن إرادة الله.", "Al-Irāda, Will: from rawd, meaning to seek; it is volition, the soul's inclination toward something. Allah's will is absolute and effective: nothing happens in His dominion except what He wills. Human beings have a created will with which they choose obedience or disobedience and are held accountable, yet it never goes beyond Allah's will."], ["العدل: العدل صفة لله, فهو الحَكَم العدل في خلقه وتشريعه وأمره وأفعاله. وفي الخلق: كل شيء موضوع في موضعه المناسب المعتدل بين الإفراط والتفريط, كموضع اليد من الجسم. وفي التشريع: أمر بما فيه صلاح الناس ونهى عما فيه ضررهم.", "Al-ʿAdl is Justice, one of Allah's attributes: He is the just Judge in His creation, legislation, command and acts. In creation, everything is placed rightly, balanced between excess and deficiency, like the position of the hand on the body. In legislation, He commands what benefits people and forbids what harms them."], ["البقاء: ضد الفناء. شأن الخلق الفناء: «كل من عليها فان», وشأن الله البقاء الدائم: «ويبقى وجه ربك ذو الجلال والإكرام». ومما يبقى للإنسان ما كان لله من عمل صالح, وما كان رزقاً حلالاً هو «بقية الله».", "Al-Baqāʾ is Permanence, the opposite of perishing. Creation's lot is to perish: \"Everyone upon it will perish\"; Allah's is to remain forever: \"And there remains the Face of your Lord, full of majesty and honour.\" What lasts for a person is what was done for Allah, and lawful provision is called \"what Allah leaves you\"."], ["عالم الغيب والشهادة: العلم إدراك الشيء على ما هو عليه مع دليل, وليس شكاً ولا ظناً ولا وهماً. والله يعلم الغيب الذي غاب عنا, والشهادة التي نراها, لا يغيب عنه شيء. وللإنسان من العلم ما أعطاه الله, وهو ما يتميز به عن سائر المخلوقات.", "ʿĀlim al-Ghayb wa-l-Shahāda, Knower of the unseen and the seen. Knowledge is grasping a thing as it is, with proof; it is not doubt, guess or fancy. Allah knows what is hidden from us and what we witness, and nothing escapes Him. What knowledge people have is what He gave them, and it is what sets humans apart from other creatures."], ["الله نور السماوات والأرض: النور هو الضوء الذي يعين على الإبصار, وهو دنيوي وأخروي. والدنيوي معقول بعين البصيرة كالفكرة الواضحة والعلم, ومحسوس بعين البصر. فالله نور السماوات والأرض بمعنى أنه منوّرهما, وبنوره يهتدي الخلق, ومن هداه فقد أنار قلبه.", "Allah is the Light of the heavens and the earth. Light is what helps us see, and it is of this world or the next. Worldly light is either grasped by insight, like a clear idea or knowledge, or perceived by the eye. Allah is the Light of the heavens and earth in that He illuminates them; creation is guided by His light, and whomever He guides, He lights up his heart."], ["ذو الجلال والإكرام: جلّ أي عظُم قدره, والجليل هو العظيم المنزه عما لا يليق به. وذو الجلال هو المستحق للأمر والنهي وحده, يكشف للقلوب المقبلة بعض أوصاف جلاله ولأسرارها بعض نعوت جماله. وكل جلال وحسن في الكون من آثار صفاته.", "Dhū al-Jalāl wa-l-Ikrām, Lord of Majesty and Honour. Jalla means his rank is great; the Jalīl is the Great One, above anything unfitting. The Lord of Majesty alone deserves to command and forbid, and He discloses to turning hearts some of His majestic attributes and some of His beauty. Every majesty and beauty in the world is a trace of His attributes."], ["الاصطفاء: أخذ صفو الشيء, أما الاختيار فأخذ خيره. فالله اصطفى من خلقه أنبياء ورسلاً وملائكة وهو أعلم حيث يجعل رسالته. وأعظم المصطفين نبينا محمد ﷺ, والاصطفاء فضل من الله لا ينال بالكسب.", "Al-Iṣṭifāʾ is Choosing: it means taking the purest part of a thing, whereas ikhtiyār takes its best. Allah chose prophets, messengers and angels from His creation, and He knows best where to place His message. The greatest of the chosen is our Prophet Muhammad ﷺ; this choosing is a favour from Allah, not something earned."], ["التسخير: سوق الشيء إلى الغرض المختص قهراً, والتذليل والتطويع. ومن رحمة الله أنه سخّر للإنسان ما في السماوات وما في الأرض: الشمس والقمر والبحر والأنعام. فالإنسان مكرَّم لأنه حمل الأمانة, وكل ما في الكون مسخَّر لخدمته ليعرف ربه.", "Al-Taskhīr is Subjugation: directing a thing to its set purpose by force, making it submissive and pliant. Among Allah's mercies is that He subjected to humankind what is in the heavens and the earth: sun, moon, sea and livestock. Humans are honoured because they bore the trust, and everything in the universe is placed at their service so that they may know their Lord."], ["المنع: ضد الإعطاء, وبينهما طباق في البلاغة. والله يعطي ويمنع بحكمته, فمنعه عطاء في الحقيقة. ومن معانيه أيضاً الحماية: يمنع عبده من خصومه وأعدائه ومن الشر أن ينزل به. وفي الحديث: «اللهم لا مانع لما أعطيت ولا معطي لما منعت».", "Al-Manʿ is Withholding, the opposite of giving, and the two form a rhetorical contrast. Allah gives and withholds in His wisdom, so His withholding is truly a form of giving. It also means protection: He shields His servant from adversaries, enemies and harm. In the hadith: \"O Allah, none can withhold what You give, and none can give what You withhold.\""], ["النفع والضر: الله وحده يملك النفع والضر, فلا ينفع ولا يضر أحد إلا بإذنه. وهو يضر لينفع, ويمنع ليعطي, ويخفض ليرفع, ويقبض ليبسط. ولو انكشفت للإنسان حكمة الشدائد لذاب حباً لله وحياءً منه.", "Al-Nafʿ wa-l-Ḍarr, Benefit and Harm. Allah alone holds benefit and harm, and no one benefits or harms except by His leave. He harms in order to benefit, withholds in order to give, lowers in order to raise, and restricts in order to expand. If the wisdom of hardships were unveiled to a person, he would melt with love of Allah and shame before Him."], ["فالله خير حافظ: الحفظ الحراسة والرعاية, ومنه حفظ المال وحفظ القرآن. والله هو الحافظ, يحفظ عباده من الأخطار وما خلق من الزوال, ويحفظ عليهم أعمالهم. ونعمة الذاكرة القوية من أكبر نعمه على الإنسان. ومن حفظ الله في أمره حفظه الله.", "Fa-Allāhu khayru ḥāfiẓā, \"Allah is the best Guardian\". Ḥifẓ means guarding and caring, as in safeguarding wealth or memorizing the Quran. Allah is the Guardian: He protects His servants from dangers, keeps creation from vanishing, and preserves their deeds for them. A strong memory is among His greatest gifts. Whoever keeps Allah's commands, Allah keeps him."], ["قائماً بالقسط: القسط هو العدل, والمقسط العادل بخلاف القاسط الظالم. والله قائم بالقسط, يدبّر خلقه بالعدل ويجازي بالعدل لا يظلم أحداً. وقد أمر عباده أن يقوموا بالقسط ويقيموا الوزن به.", "Qāʾiman bi-l-qisṭ, \"Upholding justice\". Qisṭ is fairness; the muqsiṭ is the just one, as opposed to the qāsiṭ, the wrongdoer. Allah upholds justice: He runs His creation with fairness and repays with fairness, wronging no one. He has told His servants to stand firm in justice and to keep the scales just."], ["البعث: في اللغة الإثارة والإنهاض والإرسال والنشر, ومنه إيقاظ النائم. وفي حق الله أنه يبعث الخلق من قبورهم يوم القيامة أحياءً للحساب: «وأن الله يبعث من في القبور». والإيمان بالبعث ركن من أركان الإيمان, وبه تستقيم حياة الإنسان لأنه يعلم أن وراء الدنيا حساباً.", "Al-Baʿth, Resurrection: in the language it means rousing, raising up, sending and spreading out, as in waking a sleeper. As for Allah, He raises creation from the graves alive on the Day of Judgment for reckoning: \"And that Allah will resurrect those in the graves.\" Belief in resurrection is a pillar of faith, and a person's life is set straight by knowing that an accounting lies beyond this world."], ["تأخير العقوبة: الله لا يعجّل العقوبة لمن عصاه, فهو يمهل ولا يهمل. قال تعالى: «ولو يؤاخذ الله الناس بما كسبوا ما ترك على ظهرها من دابة ولكن يؤخرهم إلى أجل مسمى». وتأخير العقوبة من رحمته وحلمه, ليتوب العاصي ويرجع.", "Delaying punishment: Allah does not rush to punish those who disobey Him; He gives respite but does not neglect. \"If Allah were to impose blame on people for what they earned, He would not have left upon the earth any creature, but He defers them for a specified term.\" Delaying punishment is part of His mercy and forbearance, so the sinner may repent and return."], ["ذو انتقام: المنتقم من الانتقام وهو العقوبة. والله يعاقب من يشاء متى شاء, ولا يستطيع هذا بشر على الحقيقة. ومن كان مع الله فهو قوي مهما بلغ عدوه من الجبروت, فإن الله ينتقم من الظالم ويوقفه عند حده ويحمي خلقه من أذاه. وانتقامه عدل لا ظلم فيه.", "Dhū Intiqām, Possessor of Retribution: intiqām is punishment. Allah punishes whom He wills when He wills, which no human truly can. Whoever is with Allah is strong however mighty his enemy, for Allah takes retribution from the oppressor, stops him at his limit and protects His creation from his harm. His retribution is just and holds no injustice."], ["الجمع: الضم, وتجميع أجزاء الشيء بعضها إلى بعض. ويوم الجمع هو يوم القيامة, يجمع الله فيه الأولين والآخرين والإنس والجن, ويجمع العبد وعمله. فالله جامع الناس ليوم لا ريب فيه, وهو الذي يجمع بين القلوب ويؤلف بينها.", "Al-Jamʿ, Gathering: joining, bringing the parts of a thing together. The Day of Gathering is Judgment Day, when Allah gathers the first and the last, humans and jinn, and joins each servant with his deeds. Allah gathers people for a day about which there is no doubt, and it is He who unites hearts and brings them together."], ["الإحصاء: ليس العد فحسب, فقوله ﷺ: «إن لله تسعة وتسعين اسماً من أحصاها دخل الجنة» لا يعني مجرد عدّها وحفظها, فالجنة أعظم من أن تُنال بذلك, بل هو معرفتها وفهم معانيها والتخلق بما يصلح منها والعمل بمقتضاها. وعلم الله محيط, أحصى كل شيء عدداً.", "Al-Iḥṣāʾ, Counting: not mere tallying. The Prophet's ﷺ words \"Allah has ninety-nine names; whoever iḥṣā's them will enter Paradise\" do not mean merely counting and memorizing them, since Paradise is too great to be won so cheaply. It means knowing them, understanding their meanings, living by what suits a servant of them, and acting on what they imply. Allah's knowledge encompasses all, and He has counted everything in number."], ["يدبر الأمر: التدبير النظر في عواقب الأمور وما تؤول إليه. والعاقل يتدبر عواقب أمره قبل أن يقدم عليه. والله يدبر أمر السماوات والأرض كلها بعلم وحكمة: «يدبر الأمر من السماء إلى الأرض». فلا يجري شيء إلا بتدبيره, ومنه الخير والرحمة وإن بدا غير ذلك.", "Yudabbir al-amr, \"He arranges the matter\": tadbīr is looking at the outcomes of affairs and where they lead. A wise person considers the consequences before acting. Allah arranges the affair of the heavens and the earth with knowledge and wisdom: \"He arranges the matter from the heaven to the earth.\" Nothing happens except through His arrangement, which holds good and mercy even when it seems otherwise."], ["يهدي من يشاء: الهداية في اللغة الإمالة, ومنها سُميت الهدية لأنها تميل القلب. فالهداية أن يميل الله القلب إلى الحق. والإنسان مخيّر أمامه خيارات: «إنا هديناه السبيل إما شاكراً وإما كفوراً», والله يهدي من توجه إليه بصدق ويوفقه.", "Yahdī man yashāʾ, \"He guides whom He wills\": hidāya in the language means inclining; gifts (hadiyya) are so named because they incline the heart. Guidance is Allah inclining the heart to the truth. The human being has options before him: \"We guided him to the way, whether he be grateful or ungrateful,\" and Allah guides and grants success to whoever turns to Him sincerely."], ["يضل من يشاء: الضلال الانحراف عن الطريق, وإضلال الله ليس ظلماً ولا إجباراً, بل هو أن يخلي بين العبد وما اختاره لنفسه بعد أن أعرض عن الحق. فمن اختار الضلال وعاند أُضلّ, ومن أقبل على الله هُدي. فلا يُنسب إلى الله إلا العدل.", "Yuḍill man yashāʾ, \"He lets go astray whom He wills\": ḍalāl is deviating from the road, and Allah's leading astray is neither injustice nor compulsion; it is leaving the servant to what he chose for himself after he turned away from the truth. Whoever chooses misguidance and persists is let go astray, and whoever turns to Allah is guided. Only justice is attributed to Allah."], ["يحيي ويميت: الله يحيي الأجساد بنفخ الأرواح فيها, فالنطفة في الرحم تنمو ثم يلقي الله فيها الروح فيتحرك الجنين وتكتمل أجهزته, ويحيي الأرض بعد موتها, ويحيي القلوب بالإيمان. ويميت الأحياء عند آجالهم, فالحياة والموت بيده وحده.", "Yuḥyī wa-yumīt, \"He gives life and causes death\": Allah gives life to bodies by placing souls in them; the drop in the womb grows, then Allah places the soul in it, the foetus moves and its systems are completed. He revives the earth after its death and the hearts with faith. He causes the living to die at their appointed times; life and death are in His hand alone."], ["يعز ويذل: «تعز من تشاء وتذل من تشاء بيدك الخير». العزة الحقيقية بالله وطاعته, والذلة بمعصيته. فقد يُعزّ الله عبداً بالإيمان والاستقامة وإن كان فقيراً, ويذل متكبراً وإن كان ذا مال وسلطان. فلا يطلب العزة إلا من الله.", "Yuʿizz wa-yudhill, \"He honours and humbles\": \"You honour whom You will and You humble whom You will; in Your hand is [all] good.\" True honour is through Allah and obeying Him, and humiliation through disobeying Him. Allah may honour a servant for faith and uprightness though he be poor, and humble an arrogant person though he has wealth and power. Honour is sought from no one but Allah."], ["يخفض ويرفع: الخفض ضد الرفع. الناس يتمايزون في الدنيا بالمال والقوة والجاه والعلم, فإذا وقعت الواقعة انقلبت المقاييس: «خافضة رافعة», ويصبح الإنسان بقدر استقامته وطاعته وإحسانه للخلق. فالله يخفض المتكبرين ويرفع المتواضعين والمؤمنين.", "Yakhfiḍ wa-yarfaʿ, \"He lowers and raises\": khafḍ is the opposite of raising. In this world people are ranked by wealth, power, status and learning, but when the Event comes the measures are reversed: \"It will bring down [some], raise up [others].\" A person is then worth his uprightness, obedience and kindness to creation. Allah lowers the arrogant and raises the humble and the faithful."], ["يبدئ ويعيد: الله هو الذي بدأ الخلق من العدم ثم يعيده بعد الفناء. وفي ذلك دليل على قدرته, فمن قدر على البدء قدر على الإعادة وهي أهون عليه في تقديركم. وبإعادة الخلق يوم القيامة يقوم الحق ويزهق الباطل: «جاء الحق وما يبدئ الباطل وما يعيد».", "Yubdiʾ wa-yuʿīd, \"He begins and repeats\": Allah is the One who began creation from nothing and will bring it back after it perishes. In this is a proof of His power: whoever could begin it can repeat it, which is easier in your reckoning. By restoring creation on Judgment Day truth stands and falsehood is erased: \"The truth has come, and falsehood neither begins nor repeats.\""], ["يؤتي الحكمة: الحكمة ترجيح لوضع على غيره لسبب صحيح, فهي وضع الشيء في موضعه المناسب, كمفتاح الكهرباء في مكان يلائم طول الإنسان وحركة يده. والله يؤتي الحكمة من يشاء: «ومن يؤت الحكمة فقد أوتي خيراً كثيراً». وهي فهم الحق والعمل به وإصابة الصواب في القول والفعل.", "Yuʾtī al-ḥikma, \"He grants wisdom\": ḥikma is preferring one arrangement over another for a sound reason, putting a thing in its right place, like a light switch placed at a height that suits a person's stature and arm. Allah grants wisdom to whom He wills: \"And whoever is given wisdom has certainly been given much good.\" It is understanding the truth, acting on it, and hitting the mark in word and deed."]];

{"t":"إن أخنع اسم عند الله رجل تسمى ملك الأملاك, لا مالك إلا الله","s":"متفق عليه عن أبي هريرة","v":1,"p":82,"d":1},{"t":"كان الله ولم يكن شيء قبله, وكان عرشه على الماء","s":"","v":1,"p":83,"d":1},{"t":"احفظ الله يحفظك, احفظ الله تجده أمامك, تعرّف إلى الله في الرخاء يعرفك في الشدة, وإذا سألت فاسأل الله, وإذا استعنت فاستعن بالله, قد مضى القلم بما هو كائن, فلو جهد الناس أن ينفعوك بما لم يقضه الله لك لم يقدروا عليه, ولو جهد الناس أن يضروك بما لم يكتبه الله عليك لم يقدروا عليه, فإن استطعت أن تعمل بالصبر مع اليقين فافعل, فإن لم تستطع فاصبر, فإن في الصبر على ما تكره خيرًا كثيرًا, واعلم أن النصر مع الصبر, وأن الفرج مع الكرب, وأن مع العسر يسرًا","s":"أخرجه الحاكم في المستدرك من حديث ابن عباس","v":1,"p":86,"d":1},{"t":"لا إله إلا الله وحده لا شريك له, له الملك وله الحمد وهو على كل شيء قدير, اللهم لا مانع لما أعطيت, ولا معطي لما منعت, ولا ينفع ذا الجد منك الجد","s":"رواه البخاري ومسلم عن المغيرة بن شعبة","v":1,"p":97,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم, من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"فضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي من حديث أبي سعيد","v":1,"p":115,"d":1},{"t":"قال الله عز وجل: أنا عند ظن عبدي بي, وأنا معه حيث يذكرني, والله لله أفرح بتوبة عبده من أحدكم يجد ضالته بالفلاة, ومن تقرب إليّ شبرًا تقربت إليه ذراعًا, ومن تقرب إليّ ذراعًا تقربت إليه باعًا, وإذا أقبل إليّ يمشي أقبلت إليه أهرول","s":"","v":1,"p":138,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس... أنت رب المستضعفين وأنت ربي, إلى من تكلني? إلى بعيد يتجهمني أم إلى عدو ملّكته أمري? إن لم يكن بك غضب عليّ فلا أبالي, غير أن عافيتك أوسع لي","s":"أخرجه الطبراني في المعجم الكبير من حديث عبد الله بن جعفر","v":1,"p":166,"d":1},{"t":"إن الله قال: من عادى لي وليًا فقد آذنته بالحرب, وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه, وما يزال عبدي يتقرب إليّ بالنوافل حتى أحبه, فإذا أحببته كنت سمعه الذي يسمع به, وبصره الذي يبصر به, ويده التي يبطش بها, ورجله التي يمشي بها, ولئن سألني لأعطينه, ولئن استعاذني لأعيذنه, وما ترددت عن شيء أنا فاعله ترددي عن نفس المؤمن, يكره الموت وأنا أكره مساءته","s":"صحيح البخاري","v":1,"p":170,"d":1},{"t":"لا إله إلا الله الواحد القهار, رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"اللهم اهدني فيمن هديت, وعافني فيمن عافيت","s":"","v":1,"p":180,"d":1},{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":1},{"t":"اللهم اهدِ قومي فإنهم لا يعلمون","s":"البيهقي في شعب الإيمان عن عبد الله بن عبيد","v":1,"p":209,"d":1},{"t":"إن الله تعالى تجاوز لأمتي ما وسوست به صدورها ما لم تعمل به أو تتكلم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن أبي هريرة","v":1,"p":249,"d":1},{"t":"لو لم يكن لكم ذنوب يغفرها الله لكم لجاء الله بقوم لهم ذنوب يغفرها لهم","s":"","v":1,"p":250,"d":1},{"t":"اللهم أنت ربي لا إله إلا أنت, خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت, أعوذ بك من شر ما صنعت, أبوء لك بنعمتك عليّ وأبوء بذنبي فاغفر لي, فإنه لا يغفر الذنوب إلا أنت","s":"أخرجه أبو داود عن بريدة بن الخصيب","v":1,"p":255,"d":1},{"t":"إن فيك خصلتين يحبهما الله ورسوله: الحلم والأناة","s":"","v":1,"p":269,"d":1},{"t":"ليس أحد أحب إليه المدح من الله, من أجل ذلك مدح نفسه, وليس أحد أغير من الله, من أجل ذلك حرّم الفواحش","s":"رواه مسلم من حديث عبد الله بن مسعود","v":1,"p":277,"d":1},{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي, ثم دعا: اللهم إني أسألك بأن لك الحمد, لا إله إلا أنت المنان, بديع السماوات والأرض, يا ذا الجلال والإكرام, يا حي يا قيوم, فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"اللهم لك الحمد أنت قيّم السماوات والأرض ومن فيهن, ولك الحمد لك ملك السماوات والأرض ومن فيهن, ولك الحمد أنت نور السماوات والأرض ومن فيهن...","s":"أخرجه البخاري","v":1,"p":313,"d":1},{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له, له الملك وله الحمد وهو على كل شيء قدير, سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم, ثم قال: اللهم اغفر لي, أو دعا, استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"وفضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي عن أبي سعيد وقال: حسن غريب","v":1,"p":320,"d":1},{"t":"إن الله كريم يحب الكرم, ويحب معالي الأخلاق ويكره سفسافها","s":"أخرجه الحاكم عن سهل بن سعد الساعدي","v":1,"p":326,"d":1},{"t":"كلمتان خفيفتان على اللسان, ثقيلتان في الميزان, حبيبتان إلى الرحمن: سبحان الله العظيم, سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"عجبت لأمر المؤمن, إن أمره كله خير, إن أصابه ما يحب حمد الله وكان له خير, وإن أصابه ما يكره فصبر كان له خير","s":"أخرجه أحمد في مسنده","v":1,"p":350,"d":1},{"t":"من لم يشكر الناس لم يشكر الله","s":"رواه الإمام أحمد والترمذي من حديث أبي هريرة","v":1,"p":379,"d":1},{"t":"والله في عون العبد ما كان العبد في عون أخيه","s":"رواه مسلم من حديث أبي هريرة","v":1,"p":383,"d":1},{"t":"كيف أنعم وقد التقم صاحب القرن القرن واستمع الإذن متى يؤمر بالنفخ فينفخ? فكأن ذلك ثقل على أصحاب رسول الله ﷺ, فقال لهم: قولوا: حسبنا الله ونعم الوكيل, على الله توكلنا","s":"الترمذي عن أبي سعيد الخدري","v":1,"p":388,"d":1},{"t":"لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير, تغدو خماصًا وتروح بطانًا","s":"","v":1,"p":393,"d":1},{"t":"اللهم رحمتك أرجو, فلا تكلني إلى نفسي طرفة عين, وأصلح لي شأني كله, لا إله إلا أنت","s":"أخرجه الحاكم عن أنس بن مالك","v":1,"p":400,"d":1},{"t":"إن الله يلوم على العجز","s":"أخرجه أبو داود عن عوف بن مالك","v":1,"p":401,"d":1},{"t":"يا أبا بكر, ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":1},{"t":"علمنا رسول الله ﷺ خطبة الحاجة: إن الحمد لله نستعينه ونستغفره, ونعوذ به من شرور أنفسنا, من يهده الله فلا مضل له, ومن يضلل فلا هادي له, وأشهد أن لا إله إلا الله وأشهد أن محمدًا عبده ورسوله, ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾","s":"أخرجه أبو داود والترمذي والنسائي عن عبد الله بن مسعود","v":1,"p":404,"d":1},{"t":"فقال رجل: وما تزكية النفس? فقال: أن يعلم أن الله عز وجل معه حيث كان","s":"البيهقي في السنن","v":1,"p":405,"d":1},{"t":"إذا صلى أحدكم فليلبس ثوبيه, فإن الله أحق من تزين له","s":"","v":1,"p":412,"d":1},{"t":"ألا أنبئكم بأكبر الكبائر? - ثلاثًا - قلنا: بلى يا رسول الله, قال: الإشراك بالله, وعقوق الوالدين","s":"","v":1,"p":436,"d":1},{"t":"سلوا الله العفو والعافية واليقين في الآخرة والأولى","s":"أخرجه أحمد في مسنده","v":1,"p":463,"d":1},{"t":"اللهم اجعل رزق آل محمد قوتًا","s":"متفق عليه من حديث أبي هريرة","v":1,"p":479,"d":1},{"t":"اللهم من أحبني فاجعل رزقه قوتًا","s":"أخرجه البخاري ومسلم والترمذي عن أبي هريرة","v":1,"p":479,"d":1},{"t":"من أطعمه الله طعامًا فليقل: اللهم بارك لنا فيه","s":"","v":1,"p":480,"d":1},{"t":"زادك الله حرصًا ولا تعد","s":"أخرجه البخاري من حديث أبي بكرة","v":2,"p":15,"d":1},{"t":"اللهم أنت الله لا إله إلا أنت, أنت الغني ونحن الفقراء","s":"","v":2,"p":24,"d":1},{"t":"قال الله عز وجل: أنفق أنفق عليك, وقال: يد الله ملأى لا تغيضها نفقة, سحاء الليل والنهار, أرأيتم ما أنفق منذ خلق السماء والأرض? فإنه لم يغض ما في يده, وكان عرشه على الماء, وبيده الميزان يخفض ويرفع","s":"متفق عليه عن أبي هريرة","v":2,"p":27,"d":1},{"t":"اللهم احفظني بالإسلام قائمًا, واحفظني بالإسلام قاعدًا, واحفظني بالإسلام راقدًا, ولا تشمت بي عدوًا ولا حاسدًا, اللهم إني أسألك من كل خير خزائنه بيدك, وأعوذ بك من كل شر خزائنه بيدك","s":"أخرجه ابن حبان والحاكم وصححه","v":2,"p":73,"d":1},{"t":"سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل, وشاب نشأ في عبادة الله, ورجل قلبه معلق في المساجد, ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه, ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله, ورجل تصدق فأخفى حتى لا تعلم شماله ما تنفق يمينه, ورجل ذكر الله خاليًا ففاضت عيناه","s":"متفق عليه عن أبي هريرة","v":2,"p":80,"d":1},{"t":"سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون, اللهم إنا نسألك في سفرنا هذا البر والتقوى ومن العمل ما ترضى, اللهم هون علينا سفرنا هذا واطو عنا بعده, اللهم أنت الصاحب في السفر والخليفة في الأهل والمال","s":"رواه أبو داود في السنن","v":2,"p":83,"d":1},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":1},{"t":"احفظ الله يحفظك","s":"أخرجه الترمذي عن عبد الله بن عباس","v":2,"p":93,"d":1},{"t":"وبعث الله عز وجل الريح على المشركين فكفى الله المؤمنين القتال وكان الله قويًا عزيزًا","s":"رواه أحمد عن عائشة","v":2,"p":95,"d":1},{"t":"إن الله جميل يحب الجمال","s":"أخرجه مسلم وأبو داود والترمذي عن عبد الله بن مسعود","v":2,"p":112,"d":1},{"t":"... ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة...","s":"صحيح البخاري من حديث عبد الله بن عمر","v":2,"p":121,"d":1},{"t":"والله ما الدنيا في الآخرة إلا مثل ما يجعل أحدكم إصبعه هذه في اليم, فلينظر بم ترجع","s":"رواه أحمد والطبراني من حديث المستورد بن شداد","v":2,"p":123,"d":1},{"t":"أوتروا يا أهل القرآن, فإن الله وتر يحب الوتر","s":"رواه مسلم والترمذي","v":2,"p":144,"d":1},{"t":"والذي نفسي بيده لقد سأل الله باسمه الأعظم الذي إذا دعي به أجاب, وإذا سئل به أعطى","s":"رواه الترمذي وغيره","v":2,"p":144,"d":1},{"t":"لقد دعا الله باسمه الأعظم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"","v":2,"p":150,"d":1},{"t":"عجبت لها, فتحت لها أبواب السماء, قال ابن عمر: فما تركتهن منذ سمعت رسول الله ﷺ يقول ذلك","s":"صحيح مسلم","v":2,"p":168,"d":1},{"t":"إن الله يحب معالي الأمور وأشرافها, ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":2,"p":187,"d":1},{"t":"اللهم اقسم لنا من خشيتك ما يحول بيننا وبين معاصيك, ومن طاعتك ما تبلغنا به جنتك, ومن اليقين ما تهون به علينا مصيبات الدنيا, ومتعنا بأسماعنا وأبصارنا وقوتنا ما أحييتنا, واجعله الوارث منا, واجعل ثأرنا على من ظلمنا, وانصرنا على من عادانا, ولا تجعل مصيبتنا في ديننا, ولا تجعل الدنيا أكبر همنا ولا مبلغ علمنا","s":"","v":2,"p":203,"d":1},{"t":"إن الرجل ليعمل - وإن المرأة لتعمل - بطاعة الله ستين عامًا, ثم يحضرهما الموت فيضاران في الوصية, فتجب لهما النار","s":"أخرجه أبو داود والترمذي عن أبي هريرة","v":2,"p":204,"d":1},{"t":"أفضل الإيمان أن تعلم أن الله معك حيثما كنت","s":"","v":2,"p":226,"d":1},{"t":"أن تعبد الله كأنك تراه, فإن لم تكن تراه فإنه يراك...","s":"صحيح البخاري","v":2,"p":231,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم آخرته كفاه الله هم دنياه","s":"","v":2,"p":279,"d":1},{"t":"اللهم اجعل خير عمري آخره, واجعل خواتيم عملي رضوانك, واجعل خير أيامي يوم ألقاك","s":"أخرجه الطبراني في الأوسط من حديث أنس","v":2,"p":281,"d":1},{"t":"قال الله: أعددت لعبادي الصالحين ما لا عين رأت, ولا أذن سمعت, ولا خطر على قلب بشر","s":"صحيح البخاري","v":2,"p":293,"d":1},{"t":"إن الله حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه الترمذي من حديث سلمان الفارسي","v":2,"p":313,"d":1},{"t":"ما من رجل يدعو الله بدعاء إلا استجيب له, فإما أن يعجل له في الدنيا, وإما أن يدخر له في الآخرة, وإما أن يكفر عنه من ذنوبه بقدر ما دعا, ما لم يدع بإثم أو قطيعة رحم أو يستعجل. قالوا: يا رسول الله وكيف يستعجل? قال: يقول: دعوت ربي فلم يستجب لي","s":"متفق عليه عن أبي هريرة","v":2,"p":321,"d":1},{"t":"القلوب أوعية, وبعضها أوعى من بعض, فإذا سألتم الله عز وجل أيها الناس فاسألوه وأنتم موقنون بالإجابة, فإن الله لا يستجيب لعبد دعاه عن ظهر قلب غافل","s":"أخرجه الإمام أحمد عن عبد الله بن عمرو","v":2,"p":321,"d":1},{"t":"اللهم إني أعوذ بك من العجز والكسل والبخل والهرم وعذاب القبر, اللهم آتِ نفسي تقواها, وزكها أنت خير من زكاها, أنت وليها ومولاها, اللهم إني أعوذ بك من علم لا ينفع, ومن قلب لا يخشع, ومن نفس لا تشبع, ومن دعوة لا يستجاب لها","s":"أخرجه مسلم والترمذي والنسائي عن زيد بن أرقم","v":2,"p":321,"d":1},{"t":"اللهم إنك عفو تحب العفو فاعف عني","s":"رواه أحمد وابن ماجه والترمذي وصححه","v":2,"p":341,"d":1},{"t":"إن آل أبي ليسوا بأوليائي, إنما وليي الله وصالح المؤمنين, ولكن لهم رحم أبلها ببلالها","s":"أخرجه أبو داود والترمذي عن أبي سعيد الخدري","v":2,"p":344,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله هم دنياه, ومن تشعبت به الهموم في أحوال الدنيا لم يبال الله في أي أوديتها هلك","s":"رواه الديلمي في الفردوس من حديث أنس","v":2,"p":370,"d":1},{"t":"اللهم إني أعوذ بك من زوال نعمتك, وتحول عافيتك, وفجاءة نقمتك, وجميع سخطك","s":"رواه مسلم من حديث ابن عمر","v":2,"p":384,"d":1},{"t":"إذا اشتكيت فضع يدك حيث تشتكي ثم قل: بسم الله, أعوذ بعزة الله وقدرته من شر ما أجد من وجعي هذا, ثم ارفع يدك, ثم أعد ذلك وترًا","s":"رواه الترمذي والحاكم من حديث أنس بن مالك","v":2,"p":390,"d":1},{"t":"رب أشعث مدفوع بالأبواب لو أقسم على الله لأبره","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":396,"d":1},{"t":"عليكم بالصدق, فإن الصدق يهدي إلى البر, وإن البر يهدي إلى الجنة, وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقًا, وإياكم والكذب, فإن الكذب يهدي إلى الفجور, وإن الفجور يهدي إلى النار, وما يزال العبد يكذب ويتحرى الكذب حتى يكتب عند الله كذابًا","s":"متفق عليه من حديث عبد الله بن مسعود","v":2,"p":398,"d":1},{"t":"يا أيها الناس! إن الله قد أذهب عنكم عبية الجاهلية وتعاظمها بآبائها, فالناس رجلان: برّ تقي كريم على الله, وفاجر شقي هين على الله, والناس بنو آدم, وآدم من تراب","s":"","v":2,"p":402,"d":1},{"t":"لقد رفعوا إليّ في الجنة فيما يرى النائم على سرر من ذهب, فرأيت في سرير عبد الله بن رواحة ازورارًا عن سريري صاحبيه, فقلت: بم هذا? فقيل لي: مضيا وتردد عبد الله بن رواحة بعض التردد ثم مضى","s":"رواه الطبراني ورجاله ثقات من حديث عبد الله بن الزبير","v":2,"p":404,"d":1},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك, وأسألك من فضلك العظيم, فإنك تقدر ولا أقدر, وتعلم ولا أعلم, وأنت علام الغيوب","s":"","v":2,"p":422,"d":1},{"t":"فلا تقل: لو أني فعلت لكان كذا وكذا, ولكن قل: قدر الله وما شاء فعل, فإن لو تفتح عمل الشيطان","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":423,"d":1},{"t":"اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"كان الله ولم يكن شيء غيره","s":"","v":2,"p":435,"d":1},{"t":"كان الله ولم يكن شيء غيره, وكان عرشه على الماء, وكتب في الذكر كل شيء, وخلق السماوات والأرض","s":"رواه البخاري","v":2,"p":436,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم, ربنا ورب كل شيء, فالق الحب والنوى, ومنزل التوراة والإنجيل والفرقان, أعوذ بك من شر كل شيء أنت آخذ بناصيته, اللهم أنت الأول فليس قبلك شيء, وأنت الآخر فليس بعدك شيء, وأنت الظاهر فليس فوقك شيء, وأنت الباطن فليس دونك شيء, اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"وجهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين, إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين, لا شريك له وبذلك أمرت وأنا من المسلمين, اللهم أنت الملك لا إله إلا أنت, أنت ربي وأنا عبدك...","s":"أخرجه مسلم وأبو داود والترمذي والنسائي","v":2,"p":476,"d":1},{"t":"إن الله لا ينظر إلى صوركم وأموالكم, ولكن ينظر إلى قلوبكم وأعمالكم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":3,"p":7,"d":1},{"t":"لا إله إلا الله العليم الحكيم, لا إله إلا الله رب العرش العظيم, لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"إنما أهلك الذين قبلكم أنهم كانوا إذا سرق فيهم الشريف تركوه, وإذا سرق فيهم الضعيف أقاموا عليه الحد, وايم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن عائشة أم المؤمنين","v":3,"p":13,"d":1},{"t":"إن السلام اسم من أسماء الله تعالى فأفشوه بينكم","s":"أخرجه الطبراني عن أبي هريرة","v":3,"p":21,"d":1},{"t":"إن الله عز وجل يقول يوم القيامة: يا ابن آدم مرضت فلم تعدني, قال: يا رب كيف أعودك وأنت رب العالمين? قال: أما علمت أن عبدي فلانًا مرض فلم تعده, أما علمت أنك لو عدته لوجدتني عنده...","s":"صحيح مسلم","v":3,"p":53,"d":1},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا, يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا... يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها, فمن وجد خيرًا فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه","s":"أخرجه مسلم والترمذي","v":3,"p":54,"d":1},{"t":"أتدرون ما الإيمان بالله وحده? قالوا: الله ورسوله أعلم, قال: شهادة أن لا إله إلا الله وأن محمدًا رسول الله","s":"","v":3,"p":55,"d":1},{"t":"اللهم أنت الصاحب في السفر والخليفة في الأهل","s":"","v":3,"p":65,"d":1},{"t":"اللهم اصحبنا في سفرنا, واخلفنا في أهلنا, اللهم إني أعوذ بك من وعثاء السفر وكآبة المنقلب","s":"","v":3,"p":65,"d":1},{"t":"إن الله يحب كل قلب حزين","s":"رواه الطبراني والحاكم عن أبي الدرداء","v":3,"p":93,"d":1},{"t":"قال الله عز وجل: الكبرياء ردائي والعظمة إزاري","s":"","v":3,"p":104,"d":1},{"t":"وإن الله أوحى إليّ أن تواضعوا حتى لا يفخر أحد على أحد ولا يبغي أحد على أحد","s":"صحيح مسلم من حديث عياض بن حمار","v":3,"p":112,"d":1},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله سائر همومه","s":"","v":3,"p":117,"d":1},{"t":"إن لكل داء دواء, فإذا أصيب دواء الداء برأ بإذن الله","s":"أخرجه مسلم عن جابر بن عبد الله","v":3,"p":134,"d":1},{"t":"اللهم كما حسنت خلقي فحسن خلقي","s":"رواه البيهقي في الدعوات الكبير","v":3,"p":140,"d":1},{"t":"اللهم لا عيش إلا عيش الآخرة","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":3,"p":145,"d":1},{"t":"إن الله خلق آدم على صورته","s":"","v":3,"p":147,"d":1},{"t":"اللهم لك سجدت وبك آمنت ولك أسلمت, سجد وجهي للذي خلقه وصوره وشق سمعه وبصره, تبارك الله أحسن الخالقين","s":"أخرجه النسائي عن جابر بن عبد الله","v":3,"p":149,"d":1},{"t":"يا رسول الله! كيف يحشر أهل النار على وجوههم? قال: إن الذي أمشاهم على أقدامهم قادر أن يمشيهم على وجوههم","s":"أحمد عن أنس بن مالك","v":3,"p":151,"d":1},{"t":"إن الله لا يقدس أمة لا يأخذ الضعيف حقه من القوي","s":"أخرجه الحاكم عن أبي سفيان بن الحارث بن عبد المطلب","v":3,"p":160,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك? قال: قل: لا إله إلا الله الحليم الكريم, لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":1},{"t":"أعوذ بالله العظيم, وبوجهه الكريم, وسلطانه القديم, من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1},{"t":"إنك ستأتي قومًا أهل كتاب, فإذا جئتهم فادعهم إلى أن يشهدوا أن لا إله إلا الله وأن محمدًا رسول الله, فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم خمس صلوات في كل يوم وليلة, فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم صدقة تؤخذ من أغنيائهم فترد على فقرائهم","s":"أخرجه البخاري","v":3,"p":168,"d":1},{"t":"ليس أحد أصبر على أذى سمعه من الله تعالى, إنهم ليدعون له ولدًا وإنه ليعافيهم ويرزقهم","s":"متفق عليه من حديث أبي موسى الأشعري","v":3,"p":171,"d":1},{"t":"أحبوا الله لما يغذوكم به من نعمه, وأحبوني لحب الله, وأحبوا أهل بيتي لحبي","s":"رواه الترمذي من حديث ابن عباس","v":3,"p":216,"d":1},{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري, وأصلح لي دنياي التي فيها معاشي, وأصلح لي آخرتي التي فيها معادي","s":"رواه مسلم عن أبي هريرة","v":3,"p":243,"d":1},{"t":"إن الله يحب معالي الأمور وأشرافها ويكره سفسافها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":293,"d":1},{"t":"إن الله وملائكته يصلون على الصف المقدم, والمؤذن يغفر له مدى صوته ويصدقه من سمعه من رطب ويابس, وله مثل أجر من صلى معه","s":"أخرجه النسائي عن البراء بن عازب","v":3,"p":294,"d":1},{"t":"اللهم ربنا لك الحمد, أنت قيّم السماوات والأرض ومن فيهن","s":"","v":3,"p":307,"d":1},{"t":"فمن لم يأت الدعوة فقد عصى الله ورسوله","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":312,"d":1},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":3,"p":315,"d":1},{"t":"رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله وما أنت أعلم به مني, اللهم اغفر لي خطاياي وعمدي وجهلي وهزلي وكل ذلك عندي, اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"صحيح البخاري من حديث أبي موسى الأشعري","v":3,"p":318,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق, وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"ما مست يد رسول الله ﷺ يد امرأة قط","s":"أخرجه مسلم عن عائشة","v":3,"p":332,"d":1},{"t":"اللهم لك الحمد كله, اللهم لا قابض لما بسطت ول
