var KTT=["Introduction: What is pondering, and why do we ponder?", "Pondering with the heart", "Pondering with the mind: the tools and the map", "Humility before the Quran", "Drawing out the message from the Quran", "Put yourself in the verse: the direct and the indirect message", "How a verse is built: context, time and place", "How a sentence relates to the theme of the surah", "How a verse relates to the passage it sits in", "How do you form a Quranic picture of a topic?", "The fit between the beginning and the end of a surah", "The fit between the opening of a surah and the end of the one before it", "The phenomenon of iltifat (the shift in address)", "Key fourteen"];
var KTE={"0_0":"Before you begin any key, you need to know what you are dealing with when you open the Mushaf, and what it asks of you.","0_1":"1- The Quran is a healing","0_3":"The Quran is a healing and a mercy for the believers, and yet many of us read it and feel no effect of that healing. The question the first key puts before you is: is the problem in the healing, or in the way we deal with it? Medicine only helps when it is taken the right way, and pondering is the way.","0_5":"The verse gathers four qualities: an admonition, a healing for what is in the chests, guidance, and mercy. Make these four your question whenever you read: what did it admonish me with today? What was healed in my chest?","0_6":"2- The Quran is alive","0_8":"God called the Quran “a spirit from His command”, and the spirit is what hearts live by. So the Quran is not read the way a dead text is read; you engage with it as you would with living speech that addresses you and asks you for an answer. If you read it with a present heart, it will respond to you.","0_9":"3- The Quran is a book from outside the world","0_12":"Every other book was written from inside this world, by a human mind that lives in it. The Quran came down from outside the world to be read by the world. So do not judge it by the measures of human books; come to it knowing that the One addressing you is the Creator of this world. The second verse states the purpose of its revelation: “that they may ponder its verses”.","0_13":"What is pondering?","0_14":"Pondering (tadabbur) is looking into the “dubur” of a matter, that is, what lies behind its surface, its outcome and what connects to it. With the Quran it means pausing at a verse after reading it, drawing lessons from it, and linking its parts to what comes before and after.","0_15":"The difference between pondering and tafsir","0_16":"Tafsir is a science with its own tools: the sciences of the Quran, the Arabic language, and the reasons of revelation. That is why it belongs to the people of knowledge.","0_17":"Pondering is asked of every reader, because it is engagement, reflection and drawing out lessons. It does not replace tafsir and does not oppose it; it rests on the sound understanding that tafsir provides.","1_0":"There are two kinds of pondering: of the heart and of the mind. This key is about pondering with the heart, which is where everything begins.","1_2":"The verse ties pondering to the heart: “or are there locks upon the hearts?” A heart with locks on it is not entered by the Quran, however much its owner reads. In contrast, the next verse ties pondering to the mind:","1_4":"The two kinds complete each other: pondering with the heart is your engagement, humility and response; pondering with the mind is your understanding, linking and analysis.","1_5":"How to practise pondering with the heart","1_6":"1- Engage with the verse as you read it. If you pass a verse of punishment, seek refuge in God; if you pass a verse of mercy, ask God for mercy; if you pass a verse of glorification, glorify Him.","1_7":"2- Give the Quran its time. The Quran is not pondered in a hurry. Set a fixed, quiet time, even if it is short.","1_8":"3- Bind what you understand by writing it down. It is said: “Knowledge is prey, and writing is its leash.” The thoughts that pass through you leave if you do not bind them. This is what the notes section of this app is designed for.","1_9":"Speed in completing the Quran","1_10":"It is established in the authentic hadith that the Prophet ﷺ said to Abdullah ibn Amr, who used to complete the Quran every night and fast every day: “Complete it in a month.” He said: I can do better than that. He said: “Complete it in twenty days.” He said: I can do better than that. He said: “Complete it in ten.” He said: I can do better than that. He said: “Complete it in seven.” Then he said to him afterwards: “Complete it in three.” So if you arrange it monthly, that is good; or in forty days, that is good, because in some narrations it is forty days.","1_11":"The lesson from the hadith: a fast completion is not the highest aim, and the Prophet ﷺ did not set for Abdullah a completion in less than three days. If your concern is pondering, set yourself a portion in which you can understand what you read, even if the completion takes a month or more.","2_0":"Pondering with the mind needs tools to help you, and then keys with which to move your mind inside the text. This key is the map that prepares the way for the remaining keys.","2_1":"Tools that help pondering with the mind","2_2":"1- Mastery of the Arabic language: the Quran is Arabic, and the wider your language, the wider your understanding. A suggested reference: “Lessons in Rhetoric” (Durus al-Balagha) by Dr. Muhammad Abu Musa.","2_3":"2- Reading the tafsirs, such as al-Qurtubi’s Al-Jami‘ li-Ahkam al-Quran, Ibn Ashur’s al-Tahrir wa al-Tanwir, al-Alusi’s Ruh al-Ma‘ani, and Sayyid Qutb’s In the Shade of the Quran. Each of these books opens a different door for you.","2_4":"3- Picturing and imagining the verses: seeing the scene the verse describes. Helpful books include “Artistic Imagery in the Quran” and “Scenes of the Resurrection in the Quran”.","2_5":"4- Thematic pondering: gathering the verses on one topic and looking at them together (this comes in the tenth key).","2_6":"The character of the one who ponders","2_7":"Using your thought to understand: do not pass a verse until you ask what you understood.","2_8":"Sincerity of intention: ponder to be guided, not to show knowledge.","2_9":"Gradual progress: do not try to take everything from a verse in one sitting. Fix a daily time and progress step by step.","2_10":"Noticing context: look at what came before the verse and what followed it. The earlier is what precedes it, and the later is what follows it.","2_11":"Noticing pronouns: ask of every sentence: who is addressing whom? Who is the speaker and who is addressed?","2_12":"The Quran was sent down for you: every verse has a share for you, even if it was revealed about people before you.","2_13":"Identify who is addressed: is the address singular or plural? To whom? Can this be understood from the context?","2_14":"Keys of pondering with the mind: a map of what is coming","2_15":"1- Put yourself in every Quranic sentence and look for every message, direct or indirect, addressed to your heart (keys 5 and 6).","2_16":"2- The relation between the body of a verse and its ending, or between a verse and the reason for its revelation (key 6).","2_17":"3- The build of a verse, taking time and place into account (key 7).","2_18":"4- The link between a Quranic sentence and the theme of the surah (key 8).","2_19":"5- The relation of a verse to the passage in which it appears (key 9).","2_20":"6- Following the verses that speak about one topic in their contexts, so that a complete picture forms for you (key 10).","2_21":"7- The fit between the verses at the beginning of a surah and its end (key 11).","2_22":"8- The fit between the beginning of a surah and the end of the surah before it (key 12).","2_23":"9- The phenomenon of iltifat (key 13).","3_0":"The first condition for understanding the Quran is to come to it as a student, not as a judge.","3_2":"“Be mindful of God, and God teaches you”: mindfulness of God is the path of learning. The Quran is the teacher and you are the student, and the more you are mindful of God, the more understanding He gives you.","3_3":"Two practical rules","3_4":"1- Everything in the Quran has a wisdom. If the wisdom does not appear to you, that does not mean it does not exist; it means you have not reached it yet. Keep searching and do not accuse the text.","3_5":"2- If something is difficult for you, ask God to open it for you. It is reported of Shaykh al-Islam Ibn Taymiyyah that when a question puzzled him, he would pray and say:","3_6":"O Teacher of Ibrahim, teach me, and O You who made Sulayman understand, make me understand. Then the difficulty would go away.","3_7":"The Quran guides the sincere and misleads the one who mocks","3_9":"The Quran is the same Quran, yet it guides some and misleads others. The difference is in the intention with which each one came to it: whoever came with sincerity and a wish to be guided is guided, and whoever came mocking is led astray.","4_0":"The key that turns reading into a message addressed to you: knowing which sentence you are reading, then putting yourself inside it.","4_1":"The difference between a verse and a Quranic sentence","4_2":"A verse (ayah) is the unit of numbering in the Mushaf, while a Quranic sentence is the unit in which the meaning is complete. A sentence may be smaller than a verse, and it may extend over several verses. This difference matters because you ponder the completed meaning, not merely the number of verses.","4_3":"An example of a verse: verse 157 of Surat al-Baqarah, which is part of a larger sentence:","4_5":"Here the sentence extends from verse 155 to 157, because the meaning is not complete without all of it:","4_7":"How to draw out the message","4_8":"1- Identify the sentence that gives a complete meaning.","4_9":"2- Put yourself inside the verse: where do I stand in this speech? Am I the one addressed? Am I the one this description is about?","4_10":"3- Look for the direct messages, then the indirect ones.","4_12":"An example: the verse gives a parable of the Quran if it were sent down on a mountain. It ends with: “And those parables We strike for the people, that they may reflect.” Striking parables is a sign that you must reflect and put yourself into the parable, not pass over it as if it were only a description of mountains.","4_13":"A note: the Quran is not content to bring you rulings (the lawful and the forbidden). Much of it is admonition, parables and scenes, and these too are meant for pondering.","5_0":"Train yourself to read a verse with one question: what is this speech telling me? You will often find a message that is not written explicitly. These are examples from your file.","5_1":"Example 1: the verse of permission to enter houses","5_3":"The verse has a clear legal ruling, but ask: what message can you learn about yourself and your relationship with God from its closing: “And God knows what you reveal and what you conceal”?","5_4":"Example 2: forgiveness and punishment in one verse","5_7":"The two verses mention forgiveness and mercy and then the painful punishment, so they join hope and fear in one place. Note from your file that God mentioned forgiveness in the form of emphasis (“I am the Forgiving, the Merciful”) set against the punishment. Ponder this balance.","5_8":"Example 3: who is the rightly guided?","5_10":"What is the relation between the saying of those struck by a calamity, “Indeed we belong to God and indeed to Him we return”, and describing them as the rightly guided at the end of the sentence? In your file the guidance here is knowing yourself: that you belong to God, that you are God’s property, and that the return is to Him. This knowledge is the true guidance.","5_11":"Example 4: why “the Almighty, the Wise”?","5_13":"Al-Aziz (the Almighty): the One able to carry out the punishment.","5_14":"Al-Hakim (the Wise): the One who knows everything and knows how and when to carry out the punishment, and it has a wisdom.","5_15":"The verse speaks of punishment and forgiveness together, so the joining of the two names suits its context: the One who holds power and who rules with wisdom.","5_16":"Example 5: the name of God “al-Hakim” in the context of Luqman","5_18":"The verses speak about God’s creation, so the name “al-Aziz” suits them; then comes speech about wisdom and about Luqman, whom God gave wisdom, so the name “al-Hakim” suits it. Two names in one passage, and each suits a part of the speech.","6_0":"A verse is not words piled together. The order of its parts, and the amount of bringing forward and putting back in it, carries meaning. This key trains you to ask: why this order here in particular?","6_1":"Example 1: the difference between two similar verses","6_4":"Both verses forbid killing children, but there is a difference between them in order and wording. In the verse of al-Isra (“fear of poverty”): the fear is of a coming poverty, so He said “We provide for them and for you” and began with the children. In the verse of al-An‘am (“because of poverty”): the poverty is present now, so He said “We provide for you and for them” and began with the parents. So the wording took account of the state of the one addressed in each context.","6_5":"Example 2: the order of relatives","6_8":"Compare the two lists: who are the ones a person flees from in each surah? In what order? And why? A question to ponder: what would happen if the order were changed?","6_9":"Example 3: the stages of the human being in consecutive verses","6_11":"In a short passage God mentions the stages of the human being: before creation, then creation, then guidance, then the punishment prepared for the disbelievers, then looking at the righteous. The passage tells the whole story from the beginning to the final destination.","6_12":"Example 4: linking time with place","6_14":"The heavens and the earth point to place in this world, and the Hereafter points to time. So the verse links place with time: praise belongs to God in this world and in the Hereafter.","6_15":"Example 5: likening the tangible to the intangible","6_17":"The good word is something intangible, so God likened it to a tree, which is tangible. The firmness of the word is like the firmness of the root of the tree, and its branches are like the branches of the tree in the sky. This is one of the Quran’s methods of bringing a meaning close.","7_0":"Before you ponder a sentence, know the theme of the surah it is in, for the sentence is part of a larger structure.","7_1":"First: know the themes of the surah (example: Surat an-Naml)","7_2":"1–6: the opening of the surah about the Quran and its role in people’s lives","7_3":"7–14: Musa","7_4":"15: Dawud","7_5":"16–44: Sulayman","7_6":"45–53: Salih","7_7":"54–58: Lut","7_8":"60–65: the blessings of God","7_9":"66–75: the disbelievers’ denial of resurrection and reckoning","7_10":"67–81: the role of the Quran in people’s lives and conveying it","7_11":"82–90: the states of people after the resurrection","7_12":"91–93: the Quran and its role in guiding people","7_13":"This division shows you how the theme of the surah moves, and that a particular verse comes in its place for a reason. So if you read a verse that links what came before with what follows, ask what connects the two themes.","7_14":"Example 1: Surat an-Nur","7_16":"This central verse speaks about God’s creation of the creatures from water and their variety (one that walks on its belly, one on two legs, and one on four). The question: what is its relation to the theme of the surah?","7_17":"The answer: the other verses of the surah speak about kinds of people, and as God created the creatures in different kinds, so people too are of different kinds.","7_22":"Example 2: Surat al-Adiyat","7_24":"What is the relation of the oath by the charging horses to the theme of the surah? The theme of the surah is the resurrection. When horses charge they raise dust, so the picture of raised dust is the first picture of what will happen on the day when what is in the graves is scattered. The oath prepares for the theme of the surah with a similar picture.","7_25":"Example 3: Surat al-Fajr","7_27":"What is the relation of the oath by the dawn to the theme of the surah? The surah speaks about tyranny and injustice, and that every wrongdoer has an end from God. Dawn is the beginning of light and the end of darkness. So the oath suits the promise that injustice will not last.","8_0":"A verse is understood more deeply when you know the passage it falls in and the general message that passage wants to deliver.","8_1":"Example 1: the verse removing hardship in Surat an-Nur","8_4":"What is the relation of this verse to the passage? The surah speaks about modesty, manners and asking permission, which are rulings that may become burdensome if pushed too far. So the verse came to remove hardship in specific cases, joining good manners with ease.","8_5":"Example 2: the ships in the context of blessings","8_8":"In this passage God mentions His blessings upon us, and when the mention reaches the ships, the speech moves to the story of Nuh, for whom the ark was made. So one word (the ship) was the bridge between the passage of blessings and the passage of the story.","9_0":"When you want to know what the Quran says about a topic, do not be content with one verse. Gather everything said about it, and look at the context of each place before and after it.","9_1":"The steps","9_2":"1- Identify the topic or the word (a name of God, an attribute, or an event).","9_3":"2- Gather all the places where it is mentioned (in this app, search and the “Names” tab help you).","9_4":"3- Read each place with what comes before and after it.","9_5":"4- Compare: what repeats? Which name or attribute is paired with it? And why here?","9_6":"Example 1: the name of God “al-Wahid”","9_13":"Notice that the name “al-Wahid” came in all these places paired with the name “al-Qahhar”. Why? Because oneness may suggest weakness, since in ordinary life the many overcome the one. So the name “al-Qahhar” came to show that God is One and yet He is the Subduer. From another side: the name “al-Qahhar” is not mentioned alone but with “al-Wahid”, because there is no subduer other than God.","9_14":"Example 2: the name of God “al-Ali”","9_23":"Reflect on what the name “al-Ali” is paired with in these places. You find that it often comes with “al-Kabir” and “al-Azim”. This is because highness is completed by greatness and majesty; there is no one higher, greater or more majestic than Him, so God paired the name al-Ali with them.","9_24":"It is also noticed in many places that the name “al-Ali” and what is paired with it comes in the context of judgement (“judgement belongs to God, the Most High, the Great”). Try following this meaning through the verses above.","10_0":"A surah is one unit, and often its beginning is in harmony with its end. When you read the beginning of a surah, reflect on its end, and the reverse.","10_1":"The method","10_2":"1- Read the first verses of the surah, and note the key words and meanings.","10_3":"2- Read the last verses, and look for words or meanings that repeat what was mentioned at the beginning.","10_4":"3- Ask: what does the surah want to fix in my mind?","10_5":"Example 1: Surat al-Anbiya","10_8":"At the start of the surah: “The reckoning of mankind has drawn near, while they are in heedlessness, turning away”, and at its end: “And the true promise has drawn near... O woe to us, we were in heedlessness.” The same two words (drew near, heedlessness) at the beginning and at the end.","10_9":"Example 2: Surat al-Mu’minun","10_12":"The surah begins with “The believers have indeed succeeded” and ends with “Indeed, the disbelievers will not succeed.” Success is the title with which the surah begins and ends.","10_13":"Example 3: Surat al-Kahf","10_16":"The surah begins by denying that God has a child, and ends with the oneness of God and righteous deeds. Ask yourself: how does the warning at the beginning connect with the final call? In your file there is a note about the order of righteous deeds and faith in the last verse.","10_17":"Example 4: Surat an-Naml","10_20":"Compare the receiving of the Quran at the beginning of the surah with the command to praise and to recognise the signs at its end.","10_21":"Example 5: Surat an-Nur","10_24":"The first verse speaks of clear verses God sent down so that you may remember, and the last reminds that to God belongs what is in the heavens and the earth and that He will inform them of what they did. Link the two descriptions.","11_0":"Just as the parts of one surah fit together, the end of one surah also fits with the beginning of the next. These are clear examples.","11_1":"1- al-Isra and al-Kahf","11_4":"The two surahs are connected by the phrase “Praise be to God who”: the first praises God for not taking a child, and the second praises Him for sending down the Book.","11_5":"2- at-Tur and an-Najm","11_8":"at-Tur ends with “the setting of the stars” and an-Najm begins with “By the star when it falls”.","11_9":"3- al-Waqi‘ah and al-Hadid","11_12":"al-Waqi‘ah ends with the command to glorify, “So glorify the name of your Lord, the Great”, and al-Hadid begins by telling that whatever is in the heavens and the earth glorifies God. So you feel that with your glorification you are part of a cosmic system in which everything glorifies God.","11_13":"4- al-Hajj and al-Mu’minun","11_16":"al-Hajj ends with “that you may succeed” and al-Mu’minun begins with “The believers have indeed succeeded.” The first promises success and shows its way, and the second announces who has succeeded.","12_0":"Iltifat: when speech suddenly moves from one form to another (from past to present, or from singular to plural). This shift does not come by chance; it carries a meaning that serves the picture the Quran wants to paint.","12_1":"The questions you ask","12_2":"What form did the speech begin with, and to which form did it move?","12_3":"What does this shift add to the scene?","12_4":"Patterns of examples","12_5":"1- Past then present, to bring the scene before you","12_7":"It begins in the past tense (was driven, were opened) and then at times uses the present. The shift acts out the state and makes you feel it as if it were happening now.","12_8":"2- Present then past","12_10":"3- Past, past, then present","12_12":"It conveys the moment of hardship to you (they came upon you, the eyes turned away, the hearts reached the throats), then the present tense “and you assumed” comes to heighten the moment and make them feel it.","12_13":"4- Singular then plural","12_16":"The speech began in the singular (“one who is on clear evidence”) and then moved to the plural (“and they followed their desires”), as if painting the picture that all are included in this description.","12_19":"Here too: singular then plural. “And whoever defends himself after having been wronged, there is no blame upon them”: every person who defends himself after being wronged has no blame.","12_20":"5- Examples whose messages you reflect on","12_22":"The role of Satan in beautifying falsehood: he makes their deeds and their passing pleasures look good to them, and makes the punishment look light to them (“The Fire will not touch us except for a number of days”).","12_24":"A verse that terrifies the wrongdoer that God will take retribution from him, and reassures the wronged that God will help him.","12_26":"God does not want to punish us, and faith and gratitude are salvation from punishment.","13_0":"In your original file, key 14 is written on the last page with no material under it. Send me the content of this key when it is complete and I will write it here in the same style."};

 ['h','١- القرآن شفاء'],
 ['v','17:82'],
 ['p','القرآن شفاء ورحمة للمؤمنين، ومع ذلك نجد أن كثيراً منا يقرؤه ولا يشعر بأثر الشفاء. السؤال الذي يضعه المفتاح الأول أمامك: هل المشكلة في الشفاء أم في طريقة تعاملنا معه؟ الدواء لا ينفع إلا إذا أُخذ بالطريقة الصحيحة، والتدبر هو الطريقة.'],
 ['v','10:57'],
 ['p','الآية تجمع أربع صفات: موعظة، وشفاء لما في الصدور، وهدى، ورحمة. اجعل هذه الصفات الأربع سؤالك كلما قرأت: ماذا وعظني اليوم؟ وما الذي شُفي في صدري؟'],
 ['h','٢- القرآن حي'],
 ['v','42:52'],
 ['p','سمّى الله القرآن «روحاً من أمره»، والروح هي ما تحيا به القلوب. فالقرآن لا يُقرأ كما يُقرأ نص ميت، وإنما يُتفاعل معه كما يُتفاعل مع كلام حي يخاطبك ويطلب منك جواباً. إذا قرأته بقلب حاضر فسيتفاعل معك.'],
 ['h','٣- القرآن كتاب من خارج العالم'],
 ['v','39:1'],['v','38:29'],
 ['p','كل كتاب آخر كُتب من داخل هذا العالم بعقل بشر يعيش فيه. أما القرآن فنزل من خارج العالم ليقرأه العالم. لذلك لا تحاكمه بمقاييس الكتب البشرية؛ ادخل عليه وأنت تعلم أن الذي يخاطبك هو خالق هذا العالم. وقد بيّنت الآية الثانية الغاية من إنزاله: «ليدبروا آياته».'],
 ['h','ما التدبر؟'],
 ['p','التدبر هو النظر في «دُبُر» الأمر، أي في ما وراء ظاهره وعاقبته وما يتصل به. في القرآن: أن تتوقف عند الآية بعد قراءتها، فتستخرج منها الدروس، وتربط بين أجزائها وما قبلها وما بعدها.'],
 ['h','الفرق بين التدبر والتفسير'],
 ['b','التفسير علم له أدواته: علوم القرآن، واللغة العربية، وأسباب النزول. ولذلك هو من اختصاص أهل العلم.'],
 ['b','التدبر مطلوب من كل قارئ، لأنه تفاعل وتأمل واستخراج للدروس. هو لا يُغني عن التفسير، ولا يُعارضه، بل يقوم على الفهم الصحيح الذي يقدمه التفسير.']]},
{n:2,t:'التدبر القلبي',pg:[2,3],c:[
 ['lead','نوعان من التدبر: قلبي وعقلي. وفي هذا المفتاح التدبر القلبي، وهو الذي يبدأ منه كل شيء.'],
 ['v','47:24'],
 ['p','الآية تربط التدبر بالقلب: «أم على قلوب أقفالها». فالقلب الذي عليه أقفال لا يدخله القرآن مهما قرأ صاحبه. وبالمقابل تربط الآية التالية التدبر بالعقل:'],
 ['v','4:82'],
 ['p','والنوعان متكاملان: التدبر القلبي هو تفاعلك وخشوعك واستجابتك، والتدبر العقلي هو فهمك وربطك وتحليلك.'],
 ['h','كيف تطبق التدبر القلبي'],
 ['n','١- تفاعل مع الآية وأنت تقرؤها. إذا مررت بآية عذاب فاستعذ بالله، وإذا مررت بآية رحمة فاسأل الله الرحمة، وإذا مررت بآية تسبيح فسبّح.'],
 ['n','٢- أعطِ القرآن وقته. لا يُتدبر القرآن على عجلة. حدد وقتاً ثابتاً وهادئاً، وإن كان قصيراً.'],
 ['n','٣- قيّد ما فهمت بالكتابة. قيل: «العلم صيد والكتابة قيد»، والخواطر التي تمر عليك تذهب إن لم تقيّدها. وهذا ما صُمم له قسم الملاحظات في هذا التطبيق.'],
 ['h','السرعة في الختم'],
 ['q','ثبت في الحديث الصحيح: أن النبي ﷺ قال لعبدالله بن عمرو -وكان يختم القرآن كل ليلة ويصوم كل يوم- فقال له النبي ﷺ: «اختمه في شهر» فقال: إني أطيق أفضل من ذلك، قال: «اختمه في عشرين» قال: إني أطيق أفضل من ذلك، قال: «اختمه في عشر» قال: إني أطيق أفضل من ذلك، قال: «اختمه في سبع» ثم قال له بعد ذلك: «اختمه في ثلاث» فإذا رتبه في كل شهر؛ فحسن، أو في أربعين يومًا؛ فحسن؛ لأن في بعض الروايات في أربعين يومًا.'],
 ['p','الدرس من الحديث: الختم السريع ليس هو المقصود الأعلى، والنبي ﷺ لم يحدد لعبدالله ختمة أقل من ثلاث أيام. فإذا كان همك التدبر فاجعل لنفسك ورداً تستطيع أن تفهم فيه ما تقرأ، ولو أخذت الختمة شهراً أو أكثر.']]},
{n:3,t:'التدبر العقلي: الأدوات والخريطة',pg:[3,4,5],c:[
 ['lead','التدبر العقلي يحتاج إلى أدوات تعينك، ثم إلى مفاتيح تحرّك بها عقلك داخل النص. هذا المفتاح هو الخريطة التي تمهد لبقية المفاتيح.'],
 ['h','أدوات تساعد على التدبر العقلي'],
 ['n','١- إتقان اللغة العربية: فالقرآن عربي، وكلما اتسعت لغتك اتسع فهمك. ومن المراجع المقترحة: «دروس البلاغة» للدكتور محمد أبو موسى.'],
 ['n','٢- الاطلاع على التفاسير: مثل الجامع لأحكام القرآن للقرطبي، والتحرير والتنوير لابن عاشور، وروح المعاني للألوسي، وفي ظلال القرآن لسيد قطب. كل كتاب منها يفتح لك باباً مختلفاً.'],
 ['n','٣- تصوّر الآيات وتخيّلها: أن ترى المشهد الذي تصفه الآية. ومن الكتب المعينة: «التصوير الفني في القرآن»، و«مشاهد القيامة في القرآن».'],
 ['n','٤- التفكير التدبري الموضوعي: أن تجمع آيات الموضوع الواحد وتنظر فيها معاً (وسيأتي في المفتاح العاشر).'],
 ['h','أخلاق المتدبر'],
 ['b','إعمال الفكر من أجل الفهم: لا تمر على الآية حتى تسأل ماذا فهمت.'],
 ['b','الإخلاص في النية: تدبّر لتهتدي، لا لتُظهر علماً.'],
 ['b','التدرج: لا تحاول أخذ كل شيء من الآية في جلسة واحدة. ثبّت وقتاً يومياً وتدرج.'],
 ['b','ملاحظة السياق: انظر إلى ما سبق الآية وما لحقها. فالسابق ما قبلها، واللاحق ما بعدها.'],
 ['b','ملاحظة الضمائر: اسأل في كل جملة: من يخاطب من؟ ومن المتكلم ومن المخاطب؟'],
 ['b','القرآن منزّل لك: كل آية لها نصيب فيك، حتى لو نزلت في قوم قبلك.'],
 ['b','حدد المخاطبين: هل الخطاب مفرد أم جمع؟ ولمن؟ وهل يُفهم هذا من السياق؟'],
 ['h','مفاتيح التدبر العقلي: خريطة ما يأتي'],
 ['n','١- ضع نفسك في كل جملة قرآنية وابحث عن كل رسالة، مباشرة أو غير مباشرة، موجهة إلى قلبك (المفتاحان ٥ و٦).'],
 ['n','٢- العلاقة بين جسم الآية ونهايتها، أو بين الآية وسبب نزولها (المفتاح ٦).'],
 ['n','٣- بناء الآية مع مراعاة الزمان والمكان (المفتاح ٧).'],
 ['n','٤- الصلة بين الجملة القرآنية وموضوع السورة (المفتاح ٨).'],
 ['n','٥- علاقة الآية بالمقطع الذي وردت فيه (المفتاح ٩).'],
 ['n','٦- تتبع الآيات التي تتحدث عن موضوع واحد في سياقاتها لتتكون عندك صورة كاملة (المفتاح ١٠).'],
 ['n','٧- تناسب الآيات في أول السورة مع آخرها (المفتاح ١١).'],
 ['n','٨- تناسب أول السورة مع آخر السورة التي قبلها (المفتاح ١٢).'],
 ['n','٩- ظاهرة الالتفات (المفتاح ١٣).']]},
{n:4,t:'التواضع للقرآن',pg:[5],c:[
 ['lead','أول شرط لفهم القرآن أن تدخل عليه طالباً لا حاكماً.'],
 ['v','2:282'],
 ['p','«واتقوا الله ويعلمكم الله»: التقوى طريق التعلم. فالقرآن معلّم وأنت الطالب، وكلما اتقيت الله زادك فهماً.'],
 ['h','قاعدتان عمليتان'],
 ['n','١- كل شيء في القرآن له حكمة. فإن لم تظهر لك الحكمة فهذا لا يعني أنها غير موجودة؛ يعني أنك لم تصل إليها بعد. استمر في البحث ولا تتهم النص.'],
 ['n','٢- إذا أشكل عليك أمر فاسأل الله أن يفتح عليك. ومما يُروى عن شيخ الإسلام ابن تيمية أنه إذا استشكلت عليه مسألة دعا فقال:'],
 ['q','اللهم يا معلم إبراهيم علمني، ويا مفهم سليمان فهمني. فيزول الإشكال.'],
 ['h','القرآن يهدي من أخلص ويضل من استهزأ'],
 ['v','2:26'],
 ['p','القرآن هو القرآن، لكنه يهدي بعضهم ويُضل آخرين. الفرق في النية التي دخل بها كل واحد: من دخل بإخلاص وإرادة للهداية اهتدى، ومن دخل مستهزئاً ضل.']]},
{n:5,t:'استخلاص الرسالة من القرآن',pg:[6],c:[
 ['lead','المفتاح الذي يحوّل القراءة إلى رسالة موجهة إليك: أن تعرف أي جملة تقرأ، ثم تضع نفسك داخلها.'],
 ['h','الفرق بين الآية والجملة القرآنية'],
 ['p','الآية هي وحدة الترقيم في المصحف، والجملة القرآنية هي الوحدة التي يكتمل بها المعنى. قد تكون الجملة أصغر من الآية، وقد تمتد على آيات عدة. وهذا الفرق مهم لأنك تتدبر المعنى المكتمل، وليس مجرد عدد الآيات.'],
 ['p','مثال على الآية: الآية ١٥٧ من سورة البقرة، وهي جزء من جملة أكبر:'],
 ['v','2:157'],
 ['p','والجملة هنا تمتد من الآية ١٥٥ إلى ١٥٧، لأن المعنى لا يكتمل إلا بها كلها:'],
 ['r','2:155','2:157'],
 ['h','كيف تستخلص الرسالة'],
 ['n','١- حدد الجملة التي تعطي معنى كاملاً.'],
 ['n','٢- ضع نفسك داخل الآية: ما موقعي من هذا الكلام؟ هل أنا المخاطَب؟ هل أنا الذي يُقصد بهذا الوصف؟'],
 ['n','٣- ابحث عن الرسائل المباشرة، ثم غير المباشرة.'],
 ['v','59:21'],
 ['p','مثال: الآية تضرب مثلاً للقرآن لو نزل على جبل. وختمت بقولها: «وتلك الأمثال نضربها للناس لعلهم يتفكرون». فضرب الأمثال إشارة إلى أن عليك أن تتفكر وتضع نفسك في المثل، لا أن تمر عليه كأنه وصف للجبال فقط.'],
 ['p','ملاحظة: القرآن لا يكتفي بأن يأتيك بالأحكام (الحلال والحرام)، فكثير منه مواعظ وأمثال ومشاهد، وهي أيضاً مقصودة للتدبر.']]},
{n:6,t:'ضع نفسك في الآية: الرسالة المباشرة وغير المباشرة',pg:[6,7,8],c:[
 ['lead','تدرّب على قراءة الآية بسؤال واحد: ما الذي يقوله لي هذا الكلام؟ وستجد غالباً رسالة غير مكتوبة بشكل صريح. هذه أمثلة من ملفك.'],
 ['h','مثال ١: آية الإذن بدخول البيوت'],
 ['v','24:29'],
 ['p','الآية فيها حكم فقهي واضح، لكن اسأل: ما الرسالة التي يمكن أن تتعلمها عن نفسك وعن علاقتك بالله من خاتمتها: «والله يعلم ما تبدون وما تكتمون»؟'],
 ['h','مثال ٢: المغفرة والعذاب في آية واحدة'],
 ['v','15:49'],['v','15:50'],
 ['p','الآيتان تذكران المغفرة والرحمة ثم العذاب الأليم، فتجمعان الرجاء والخوف في موضع واحد. ويُلاحظ في ملفك أن الله ذكر المغفرة بصيغة التأكيد (أنا الغفور الرحيم) في مقابل العذاب. تدبّر هذا التوازن.'],
 ['h','مثال ٣: من هو المهتدي؟'],
 ['r','2:155','2:157'],
 ['p','ما العلاقة بين قول الذين أصابتهم مصيبة «إنا لله وإنا إليه راجعون» وبين وصفهم بالمهتدين في ختام الجملة؟ في ملفك أن الهدى هنا هو معرفة النفس: أنها لله وأنها ملك لله، وأن الرجوع إليه. فهذه المعرفة هي الهداية الصحيحة.'],
 ['h','مثال ٤: لماذا «العزيز الحكيم»؟'],
 ['v','5:118'],
 ['b','العزيز: القادر على إيقاع العقوبة.'],
 ['b','الحكيم: الذي يعلم كل شيء ويعرف كيف ومتى تُوقع العقوبة، ولها حكمة.'],
 ['p','والآية تتحدث عن العذاب والمغفرة معاً، فاجتماع الاسمين يناسب سياقها: من يملك القدرة ومن يحكم بحكمة.'],
 ['h','مثال ٥: اسم الله «الحكيم» في سياق لقمان'],
 ['r','31:8','31:14'],
 ['p','الآيات تتحدث عن خلق الله، فيناسبها اسم «العزيز»، ثم يأتي كلام عن الحكمة وعن لقمان الذي آتاه الله الحكمة، فيناسبها اسم «الحكيم». اسمان في مقطع واحد، وكل واحد منهما يناسب جزءاً من الكلام.']]},
{n:7,t:'بناء الآية: مراعاة السياق والزمان والمكان',pg:[9,10],c:[
 ['lead','الآية ليست كلمات مرصوصة. ترتيب أجزائها ومقدار ما فيها من التقديم والتأخير يحمل معنى. وهذا المفتاح يدربك على أن تسأل: لماذا هذا الترتيب هنا بالذات؟'],
 ['h','مثال ١: الفرق بين آيتين متشابهتين'],
 ['v','6:151'],['v','17:31'],
 ['p','الآيتان تنهيان عن قتل الأولاد، لكن بينهما فرقاً في الترتيب والتعبير. في آية الإسراء (خشية إملاق): الخوف من فقر قادم، فقال «نحن نرزقهم وإياكم» وبدأ بالأولاد. وفي آية الأنعام (من إملاق): الفقر موجود الآن، فقال «نرزقكم وإياهم» وبدأ بالآباء. فالتعبير راعى حال المخاطب في كل سياق.'],
 ['h','مثال ٢: ترتيب الأقارب'],
 ['r','80:34','80:36'],['r','70:11','70:14'],
 ['p','قارن القائمتين: من الذين يفر منهم الإنسان في كل سورة؟ وبأي ترتيب؟ ولماذا؟ سؤال التدبر: ما الذي يحدث لو غُيّر الترتيب؟'],
 ['h','مثال ٣: مراحل الإنسان في آيات متتالية'],
 ['r','76:1','76:5'],
 ['p','في مقطع قصير يذكر الله مراحل الإنسان: ما قبل الخلق، ثم الخلق، ثم الهداية، ثم إعداد العذاب للكافرين، ثم النظر إلى الأبرار. المقطع يحكي القصة كاملة من البداية إلى المصير.'],
 ['h','مثال ٤: ربط الزمان بالمكان'],
 ['v','34:1'],
 ['p','السماوات والأرض إشارة إلى المكان في الدنيا، والآخرة إشارة إلى الزمان. فالآية تربط المكان بالزمان: الحمد لله في الدنيا وفي الآخرة.'],
 ['h','مثال ٥: تشبيه الملموس بغير الملموس'],
 ['r','14:24','14:26'],
 ['p','الكلمة الطيبة شيء غير ملموس، فشبّهها الله بالشجرة، وهي شيء ملموس. وثبات الكلمة كثبات أصل الشجرة، وفروعها كفروع الشجرة في السماء. هذا من أساليب القرآن في تقريب المعنى.']]},
{n:8,t:'صلة الجملة بموضوع السورة',pg:[9,10,11,12],c:[
 ['lead','قبل أن تتدبر جملة، اعرف موضوع السورة التي هي فيها، فالجملة جزء من بناء أكبر.'],
 ['h','أولاً: اعرف مواضيع السورة (مثال: سورة النمل)'],
 ['b','١–٦: مقدمة السورة عن القرآن ودوره في حياة الناس'],
 ['b','٧–١٤: موسى'],['b','١٥: داود'],['b','١٦–٤٤: سليمان'],['b','٤٥–٥٣: صالح'],['b','٥٤–٥٨: لوط'],['b','٦٠–٦٥: نعم الله'],['b','٦٦–٧٥: تكذيب الكفار بالبعث والحساب'],['b','٦٧–٨١: دور القرآن في حياة الناس والإبلاغ به'],['b','٨٢–٩٠: أحوال الناس بعد البعث'],['b','٩١–٩٣: القرآن ودوره في هداية الناس'],
 ['p','هذا التقسيم يبين لك كيف ينتقل موضوع السورة، وأن آية بعينها تأتي في مكانها لسبب. فإذا قرأت آية تربط بين السابق واللاحق فاسأل ما الذي يربط بين الموضوعين.'],
 ['h','مثال ١: سورة النور'],
 ['v','24:45'],
 ['p','هذه الآية الرئيسية تتحدث عن خلق الله للدواب من ماء وتنوعها (ماشٍ على بطنه، وعلى رجلين، وعلى أربع). والسؤال: ما علاقتها بموضوع السورة؟'],
 ['p','الجواب: الآيات الأخرى في السورة تتحدث عن أنواع من الناس، وكما خلق الله الدواب أنواعاً مختلفة، فكذلك الناس أنواع.'],
 ['v','24:11'],['v','24:12'],['v','24:26'],['v','24:23'],
 ['h','مثال ٢: سورة العاديات'],
 ['r','100:1','100:11'],
 ['p','ما علاقة القسم بالعاديات (الخيل) بموضوع السورة؟ موضوع السورة هو البعث. والخيل حين تعدو تثير الغبار، فصورة الغبار المثار هي الصورة الأولى لما سيحدث يوم يُبعثر ما في القبور. فالقسم يُمهّد لموضوع السورة بصورة مشابهة.'],
 ['h','مثال ٣: سورة الفجر'],
