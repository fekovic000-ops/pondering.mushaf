0}],"15":[{"t":"لا إله إلا الله الواحد القهار، رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"يوم تبدل الأرض غير الأرض والسماوات وبرزوا لله الواحد القهار، قلت: أين الناس يومئذ؟ قال: على الصراط","s":"","v":2,"p":132,"d":1},{"t":"يا أبا بكر، ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":0},{"t":"لقد دعا الله باسمه الأعظم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"","v":2,"p":150,"d":0}],"16":[{"t":"من لم يشكر الناس لم يشكر الله","s":"رواه الإمام أحمد والترمذي من حديث أبي هريرة","v":1,"p":379,"d":0},{"t":"من أسلم على يد رجل فله ولاؤه","s":"رواه الطبراني والدارقطني والبيهقي بسند حسن من حديث أبي أمامة","v":1,"p":381,"d":0},{"t":"والله في عون العبد ما كان العبد في عون أخيه","s":"رواه مسلم من حديث أبي هريرة","v":1,"p":383,"d":0},{"t":"عجبًا لأمر المؤمن، إن أمره كله خير، وليس ذلك لأحد إلا للمؤمن: إن أصابته سراء شكر وكان خيرًا له، وإن أصابته ضراء صبر فكان خيرًا له","s":"أخرجه أحمد في مسنده عن صهيب","v":1,"p":384,"d":0},{"t":"أنفق، أنفق عليك","s":"متفق عليه عن أبي هريرة","v":1,"p":385,"d":0},{"t":"لا يحل لأحد أن يهب هبة ثم يرجع فيها إلا الوالد فيما يهب لولده","s":"","v":1,"p":385,"d":0}],"17":[{"t":"إن الله هو المسعّر القابض الباسط الرازق، وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"ليسأل أحدكم ربه حاجته كلها حتى يسأله شسع نعله إذا انقطع","s":"رواه الترمذي","v":2,"p":367,"d":0},{"t":"من جعل الهموم همًّا واحدًا هم المعاد كفاه الله هم دنياه، ومن تشعبت به الهموم في أحوال الدنيا لم يبال الله في أي أوديتها هلك","s":"رواه الديلمي في الفردوس من حديث أنس","v":2,"p":370,"d":0},{"t":"إن الرجل ليحرم الرزق بالذنب يصيبه","s":"","v":2,"p":373,"d":0},{"t":"هل تدرون ماذا قال ربكم؟ قالوا: الله ورسوله أعلم، قال: أصبح من عبادي مؤمن بي وكافر، فأما من قال: مطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب، وأما من قال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب","s":"أخرجه البخاري ومسلم عن زيد بن خالد الجهني","v":3,"p":356,"d":0},{"t":"أبيت عند ربي يطعمني ويسقيني","s":"","v":3,"p":359,"d":0},{"t":"إن الله يلوم على العجز، ولكن عليك بالكيس، فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":0},{"t":"أنفق بلال ولا تخش من ذي العرش إقلالًا","s":"أخرجه الطبراني عن بلال","v":3,"p":362,"d":0},{"t":"ثلاثة حق على الله عونهم: المجاهد في سبيل الله، والمكاتب الذي يريد الأداء، والناكح الذي يريد العفاف","s":"أخرجه الترمذي والنسائي عن أبي هريرة","v":3,"p":363,"d":0}],"18":[{"t":"من جعل الهموم همًّا واحدًا هم آخرته كفاه الله هم دنياه","s":"","v":2,"p":279,"d":0},{"t":"اللهم اجعل خير عمري آخره، واجعل خواتيم عملي رضوانك، واجعل خير أيامي يوم ألقاك","s":"أخرجه الطبراني في الأوسط من حديث أنس","v":2,"p":281,"d":0},{"t":"لا يغني حذر من قدر","s":"أخرجه الحاكم في المستدرك من حديث عائشة","v":2,"p":286,"d":0}],"19":[{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم، من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"فضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي من حديث أبي سعيد","v":1,"p":115,"d":0}],"20":[{"t":"إن الله هو المسعّر القابض الباسط الرازق، وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"ما مست يد رسول الله ﷺ يد امرأة قط","s":"أخرجه مسلم عن عائشة","v":3,"p":332,"d":0},{"t":"البر حسن الخلق، والإثم ما حاك في صدرك وكرهت أن يطلع عليه الناس","s":"صحيح مسلم","v":3,"p":339,"d":0},{"t":"لا أنت أطعمتها ولا سقيتها حين حبستيها، ولا أنت أرسلتها فأكلت من خشاش الأرض","s":"صحيح البخاري","v":3,"p":345,"d":0},{"t":"اللهم لك الحمد كله، اللهم لا قابض لما بسطت ولا باسط لما قبضت، ولا هادي لمن أضللت ولا مضل لمن هديت، ولا معطي لما منعت ولا مانع لما أعطيت، ولا مقرب لما باعدت ولا مباعد لما قربت، اللهم إني أسألك من بركتك ورحمتك وفضلك ورزقك","s":"أخرجه أبو داود عن أبي بن كعب","v":3,"p":348,"d":0}],"21":[{"t":"إن الله هو المسعّر القابض الباسط الرازق، وإني لأرجو أن ألقى الله وليس أحد منكم يطالبني بمظلمة في دم ولا مال","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":331,"d":1},{"t":"إن الله هو المسعّر القابض الباسط الرازق","s":"أخرجه أبو داود والترمذي عن أنس بن مالك","v":3,"p":349,"d":1},{"t":"من سره أن يبسط الله له في رزقه، وأن ينسأ له في أثره فليصل رحمه","s":"أخرجه البخاري والترمذي عن أبي هريرة","v":3,"p":351,"d":0},{"t":"فوالله ما الفقر أخشى عليكم، ولكني أخشى أن تبسط عليكم الدنيا كما بسطت على من كان قبلكم","s":"","v":3,"p":353,"d":0}],"22":[{"t":"أرحم أمتي بأمتي أبو بكر، وأشدهم في أمر الله عمر، وأصدقهم حياءً عثمان، وأقرؤهم لكتاب الله أبيّ بن كعب، وأفرضهم زيد بن ثابت، وأعلمهم بالحلال والحرام معاذ بن جبل، ألا وإن لكل أمة أمينًا، وإن أمين هذه الأمة أبو عبيدة بن الجراح","s":"رواه الترمذي","v":4,"p":366,"d":0},{"t":"أنزلوا الناس منازلهم","s":"","v":4,"p":366,"d":0}],"23":[{"t":"أرحم أمتي بأمتي أبو بكر، وأشدهم في أمر الله عمر، وأصدقهم حياءً عثمان، وأقرؤهم لكتاب الله أبيّ بن كعب، وأفرضهم زيد بن ثابت، وأعلمهم بالحلال والحرام معاذ بن جبل، ألا وإن لكل أمة أمينًا، وإن أمين هذه الأمة أبو عبيدة بن الجراح","s":"رواه الترمذي","v":4,"p":366,"d":0},{"t":"أنزلوا الناس منازلهم","s":"","v":4,"p":366,"d":0}],"24":[{"t":"لا يخلون رجل بامرأة إلا كان الشيطان ثالثهما","s":"رواه الترمذي من حديث عمر","v":4,"p":344,"d":0},{"t":"إن الشيطان يجري من الإنسان مجرى الدم، وإني خشيت أن يقذف في قلوبكما شرًّا","s":"رواه مسلم من حديث صفية بنت حيي","v":4,"p":345,"d":0},{"t":"الكيّس من دان نفسه وعمل لما بعد الموت","s":"","v":4,"p":350,"d":0},{"t":"لا ينبغي للمؤمن أن يذل نفسه","s":"","v":4,"p":353,"d":0}],"25":[{"t":"لا يخلون رجل بامرأة إلا كان الشيطان ثالثهما","s":"رواه الترمذي من حديث عمر","v":4,"p":344,"d":0},{"t":"إن الشيطان يجري من الإنسان مجرى الدم، وإني خشيت أن يقذف في قلوبكما شرًّا","s":"رواه مسلم من حديث صفية بنت حيي","v":4,"p":345,"d":0},{"t":"الكيّس من دان نفسه وعمل لما بعد الموت","s":"","v":4,"p":350,"d":0},{"t":"لا ينبغي للمؤمن أن يذل نفسه","s":"","v":4,"p":353,"d":0}],"26":[{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم، من همزه ونفخه ونفثه","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":105,"d":1},{"t":"أعوذ بالله السميع العليم من الشيطان الرجيم","s":"أخرجه أبو داود والترمذي والنسائي عن أبي سعيد الخدري","v":1,"p":154,"d":1},{"t":"أيها الناس اربعوا على أنفسكم - أي ارفقوا - إنكم ليس تدعون أصمّ ولا غائبًا، إنكم تدعون سميعًا قريبًا","s":"أخرجه البخاري ومسلم عن أبي موسى","v":1,"p":154,"d":0},{"t":"اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس... أنت رب المستضعفين وأنت ربي، إلى من تكلني؟ إلى بعيد يتجهمني أم إلى عدو ملّكته أمري؟ إن لم يكن بك غضب عليّ فلا أبالي، غير أن عافيتك أوسع لي","s":"أخرجه الطبراني في المعجم الكبير من حديث عبد الله بن جعفر","v":1,"p":166,"d":0},{"t":"صوتان ملعونان في الدنيا والآخرة: مزمار عند نعمة، ورنة عند مصيبة","s":"أخرجه الضياء في الأحاديث المختارة وهو حسن","v":1,"p":169,"d":0},{"t":"إني لم أنه عن البكاء، ولكني نهيت عن صوتين أحمقين فاجرين: صوت عند نغمة لهو ولعب ومزامير الشيطان، وصوت عند مصيبة: لطم وجوه وشق جيوب ورنة شيطان","s":"أخرجه الحاكم في المستدرك","v":1,"p":169,"d":0},{"t":"إن الله قال: من عادى لي وليًا فقد آذنته بالحرب، وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه، وما يزال عبدي يتقرب إليّ بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده التي يبطش بها، ورجله التي يمشي بها، ولئن سألني لأعطينه، ولئن استعاذني لأعيذنه، وما ترددت عن شيء أنا فاعله ترددي عن نفس المؤمن، يكره الموت وأنا أكره مساءته","s":"صحيح البخاري","v":1,"p":170,"d":0}],"27":[{"t":"إنكم لا تدعون أصمّ ولا غائبًا، إنكم تدعون سميعًا بصيرًا","s":"أخرجه البخاري ومسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":215,"d":0},{"t":"أدنِ اليتيم منك، وألطفه، وامسح برأسه، وأطعمه من طعامك، فإن ذلك يلين قلبك ويدرك حاجتك","s":"","v":2,"p":220,"d":0},{"t":"إن الشيطان يجري من الإنسان مجرى الدم، فخشيت أن يقذف في قلوبكما شيئًا","s":"","v":2,"p":222,"d":0},{"t":"أفضل الإيمان أن تعلم أن الله معك حيثما كنت","s":"","v":2,"p":226,"d":0},{"t":"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك...","s":"صحيح البخاري","v":2,"p":231,"d":0}],"28":[{"t":"ولكل شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه الطبراني عن أبي الدرداء","v":3,"p":478,"d":0},{"t":"اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب، وما زويت عني مما أحب فاجعله فراغًا لي فيما تحب","s":"أخرجه الترمذي عن عبد الله بن يزيد الخطمي","v":3,"p":478,"d":0},{"t":"اللهم فاطر السماوات والأرض، عالم الغيب والشهادة، أنت تحكم بين عبادك فيما كانوا فيه يختلفون","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن عائشة","v":3,"p":480,"d":0},{"t":"كان النبي ﷺ إذا قام من الليل يتهجد قال: اللهم لك الحمد، أنت نور السماوات والأرض ومن فيهن، ولك الحمد، اللهم بك آمنت ولك أسلمت وعليك توكلت وإليك أنبت وبك خاصمت وإليك حاكمت، فاغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"أخرجه مسلم وابن خزيمة","v":3,"p":481,"d":0}],"29":[{"t":"أنفق، أنفق عليك","s":"رواه الشيخان وأحمد من حديث أبي هريرة","v":4,"p":31,"d":0},{"t":"اعمل ما شئت كما تدين تدان","s":"","v":4,"p":31,"d":0},{"t":"إن لله ما أخذ وله ما أعطى، وكل شيء عنده بأجل مسمى، فلتصبر ولتحتسب","s":"متفق عليه عن أسامة بن زيد","v":4,"p":34,"d":0},{"t":"خذي ما يكفيك وولدك بالمعروف","s":"متفق عليه من حديث عائشة","v":4,"p":37,"d":0}],"30":[{"t":"تعلموا أنه لن يرى أحد منكم ربه حتى يموت","s":"رواه مسلم عن عمرو بن ثابت الأنصاري","v":2,"p":9,"d":0},{"t":"من لعب بالنردشير فكأنما غمس يده في لحم خنزير ودمه","s":"رواه مسلم","v":2,"p":15,"d":0},{"t":"زادك الله حرصًا ولا تعد","s":"أخرجه البخاري من حديث أبي بكرة","v":2,"p":15,"d":0},{"t":"هلال خير ورشد، هلال خير ورشد، هلال خير ورشد، آمنت بالذي خلقك - ثلاث مرات - ثم يقول: الحمد لله الذي ذهب بشهر كذا وجاء بشهر كذا","s":"أخرجه أبو داود","v":2,"p":17,"d":0}],"32":[{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك؟ قال: قل: لا إله إلا الله الحليم الكريم، لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"إن فيك خصلتين يحبهما الله ورسوله: الحلم والأناة","s":"","v":1,"p":269,"d":0},{"t":"سبقت رحمتي غضبي","s":"متفق عليه من حديث أبي هريرة","v":1,"p":273,"d":0},{"t":"لله أرحم بعباده من هذه بولدها","s":"متفق عليه من حديث عمر بن الخطاب","v":1,"p":276,"d":0},{"t":"ليس أحد أحب إليه المدح من الله، من أجل ذلك مدح نفسه، وليس أحد أغير من الله، من أجل ذلك حرّم الفواحش","s":"رواه مسلم من حديث عبد الله بن مسعود","v":1,"p":277,"d":0},{"t":"لا تغضب","s":"أخرجه البخاري والترمذي ومالك عن أبي هريرة","v":1,"p":278,"d":0},{"t":"ليس الشديد بالصُّرَعة، إنما الشديد الذي يملك نفسه عند الغضب","s":"متفق عليه","v":1,"p":278,"d":0},{"t":"إنما الصبر عند الصدمة الأولى","s":"صحيح البخاري","v":1,"p":278,"d":0}],"33":[{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم، ثم قال: اللهم اغفر لي، أو دعا، استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله العظيم، سبحان الله وبحمده","s":"","v":1,"p":330,"d":1},{"t":"لا إله إلا الله العظيم الحليم","s":"صحيح البخاري","v":1,"p":342,"d":1},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب","s":"","v":2,"p":422,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك؟ قال: قل: لا إله إلا الله الحليم الكريم، لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1}],"34":[{"t":"إن الله تعالى تجاوز لأمتي ما وسوست به صدورها ما لم تعمل به أو تتكلم","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي عن أبي هريرة","v":1,"p":249,"d":0},{"t":"لو لم يكن لكم ذنوب يغفرها الله لكم لجاء الله بقوم لهم ذنوب يغفرها لهم","s":"","v":1,"p":250,"d":0},{"t":"اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت","s":"أخرجه أبو داود عن بريدة بن الخصيب","v":1,"p":255,"d":0}],"35":[{"t":"بروا آباءكم تبركم أبناؤكم، وعفّوا تعفّ نساؤكم","s":"","v":1,"p":233,"d":0},{"t":"قال الله: أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر","s":"صحيح البخاري","v":2,"p":293,"d":0},{"t":"قد تركتكم على البيضاء ليلها كنهارها لا يزيغ عنها بعدي إلا هالك","s":"أخرجه أحمد في مسنده","v":2,"p":302,"d":0},{"t":"إن ذكرني في ملأ ذكرته في ملأ خير منهم","s":"","v":2,"p":304,"d":0},{"t":"عجبًا لأمر المؤمن! إن أمره كله له خير، إن أصابته سراء شكر فكان خيرًا له، وإن أصابته ضراء صبر فكان خيرًا له، وليس ذلك لأحد إلا للمؤمن","s":"أخرجه مسلم عن صهيب الرومي","v":2,"p":308,"d":0}],"36":[{"t":"من تعارّ من الليل فقال: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله العلي العظيم، ثم قال: اللهم اغفر لي، أو دعا، استجيب له","s":"أخرجه أبو داود وابن ماجه","v":1,"p":316,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك؟ قال: قل: لا إله إلا الله الحليم الكريم، لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"وفضل كلام الله على سائر الكلام كفضل الله على خلقه","s":"رواه الترمذي عن أبي سعيد وقال: حسن غريب","v":1,"p":320,"d":0},{"t":"لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا","s":"أخرجه مسلم والترمذي عن أبي ذر الغفاري","v":1,"p":320,"d":0},{"t":"إن الله كريم يحب الكرم، ويحب معالي الأخلاق ويكره سفسافها","s":"أخرجه الحاكم عن سهل بن سعد الساعدي","v":1,"p":326,"d":0}],"37":[{"t":"بئس العبد عبد تخيل واختال ونسي الكبير المتعال، بئس العبد عبد تجبر واعتدى ونسي الجبار الأعلى، بئس العبد عبد سها ولها ونسي المقابر والبلى، بئس العبد عبد عتا وطغى ونسي المبتدأ والمنتهى","s":"رواه الترمذي عن أسماء بنت عميس الخثعمية","v":3,"p":93,"d":1},{"t":"عجبت لها، فتحت لها أبواب السماء، قال ابن عمر: فما تركتهن منذ سمعت رسول الله ﷺ يقول ذلك","s":"صحيح مسلم","v":2,"p":168,"d":0},{"t":"صنائع المعروف تقي مصارع السوء","s":"رواه الطبراني وصححه الألباني","v":2,"p":178,"d":0}],"38":[{"t":"اللهم احفظني بالإسلام قائمًا، واحفظني بالإسلام قاعدًا، واحفظني بالإسلام راقدًا، ولا تشمت بي عدوًا ولا حاسدًا، اللهم إني أسألك من كل خير خزائنه بيدك، وأعوذ بك من كل شر خزائنه بيدك","s":"أخرجه ابن حبان والحاكم وصححه","v":2,"p":73,"d":0},{"t":"والشر ليس إليك","s":"أخرجه مسلم وأبو داود والترمذي والنسائي عن علي بن أبي طالب","v":2,"p":73,"d":0},{"t":"سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق في المساجد، ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه، ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله، ورجل تصدق فأخفى حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خاليًا ففاضت عيناه","s":"متفق عليه عن أبي هريرة","v":2,"p":80,"d":0},{"t":"سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون، اللهم إنا نسألك في سفرنا هذا البر والتقوى ومن العمل ما ترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده، اللهم أنت الصاحب في السفر والخليفة في الأهل والمال","s":"رواه أبو داود في السنن","v":2,"p":83,"d":0},{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره، فإنه لا يدري ما خلفه عليه، ثم يقول: باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"رواه البخاري عن أبي هريرة","v":2,"p":91,"d":0},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":0},{"t":"احفظ الله يحفظك","s":"أخرجه الترمذي عن عبد الله بن عباس","v":2,"p":93,"d":0}],"39":[{"t":"ذكر الرجل يطيل السفر أشعث أغبر، يمد يديه إلى السماء: يا رب يا رب، ومطعمه حرام، ومشربه حرام، وملبسه حرام، وغُذي بالحرام، فأنى يُستجاب لذلك؟","s":"عن أبي هريرة","v":1,"p":475,"d":0},{"t":"اللهم اجعل رزق آل محمد قوتًا","s":"متفق عليه من حديث أبي هريرة","v":1,"p":479,"d":0},{"t":"اللهم من أحبني فاجعل رزقه قوتًا","s":"أخرجه البخاري ومسلم والترمذي عن أبي هريرة","v":1,"p":479,"d":0},{"t":"من أطعمه الله طعامًا فليقل: اللهم بارك لنا فيه","s":"","v":1,"p":480,"d":0}],"40":[{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":0},{"t":"شرف المؤمن صلاته بالليل، وعزه استغناؤه عما في أيدي الناس","s":"رواه الحاكم عن سهل بن سعد وصححه","v":1,"p":425,"d":0},{"t":"لا تقيّ مالك بمالك","s":"ابن ماجه عن عبد الله بن عمرو","v":1,"p":426,"d":0}],"42":[{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"قال لي رسول الله ﷺ: يا علي ألا أعلمك كلمات إن قلتهن غفر الله لك؟ قال: قل: لا إله إلا الله الحليم الكريم، لا إله إلا الله العلي العظيم","s":"","v":3,"p":163,"d":1},{"t":"أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم","s":"أخرجه أبو داود عن عبد الله بن عمرو بن العاص","v":3,"p":164,"d":1},{"t":"الكريم ابن الكريم ابن الكريم ابن الكريم: يوسف بن يعقوب بن إسحاق بن إبراهيم","s":"أخرجه البخاري من حديث ابن عمر","v":3,"p":165,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":0},{"t":"إن ربكم تبارك وتعالى حيي كريم، يستحيي أن يرفع العبد يديه فيردهما صفرًا","s":"","v":3,"p":164,"d":0},{"t":"إنك ستأتي قومًا أهل كتاب، فإذا جئتهم فادعهم إلى أن يشهدوا أن لا إله إلا الله وأن محمدًا رسول الله، فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم خمس صلوات في كل يوم وليلة، فإن هم أطاعوا لك بذلك فأخبرهم أن الله قد فرض عليهم صدقة تؤخذ من أغنيائهم فترد على فقرائهم","s":"أخرجه البخاري","v":3,"p":168,"d":0},{"t":"ليس أحد أصبر على أذى سمعه من الله تعالى، إنهم ليدعون له ولدًا وإنه ليعافيهم ويرزقهم","s":"متفق عليه من حديث أبي موسى الأشعري","v":3,"p":171,"d":0},{"t":"أحبوا الله لما يغذوكم به من نعمه، وأحبوني لحب الله، وأحبوا أهل بيتي لحبي","s":"رواه الترمذي من حديث ابن عباس","v":3,"p":216,"d":0}],"43":[{"t":"فأقول كما قال العبد الصالح عيسى ابن مريم: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ﴾","s":"","v":1,"p":403,"d":1},{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال، فأقول: يا رب أصحابي، فيقول: إنك لا تدري ما أحدثوا بعدك، فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"علمنا رسول الله ﷺ خطبة الحاجة: إن الحمد لله نستعينه ونستغفره، ونعوذ به من شرور أنفسنا، من يهده الله فلا مضل له، ومن يضلل فلا هادي له، وأشهد أن لا إله إلا الله وأشهد أن محمدًا عبده ورسوله، ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾","s":"أخرجه أبو داود والترمذي والنسائي عن عبد الله بن مسعود","v":1,"p":404,"d":0},{"t":"فقال رجل: وما تزكية النفس؟ فقال: أن يعلم أن الله عز وجل معه حيث كان","s":"البيهقي في السنن","v":1,"p":405,"d":0},{"t":"إذا صلى أحدكم فليلبس ثوبيه، فإن الله أحق من تزين له","s":"","v":1,"p":412,"d":0}],"44":[{"t":"إن الله حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه الترمذي من حديث سلمان الفارسي","v":2,"p":313,"d":0},{"t":"ما من رجل يدعو الله بدعاء إلا استجيب له، فإما أن يعجل له في الدنيا، وإما أن يدخر له في الآخرة، وإما أن يكفر عنه من ذنوبه بقدر ما دعا، ما لم يدع بإثم أو قطيعة رحم أو يستعجل. قالوا: يا رسول الله وكيف يستعجل؟ قال: يقول: دعوت ربي فلم يستجب لي","s":"متفق عليه عن أبي هريرة","v":2,"p":321,"d":0},{"t":"القلوب أوعية، وبعضها أوعى من بعض، فإذا سألتم الله عز وجل أيها الناس فاسألوه وأنتم موقنون بالإجابة، فإن الله لا يستجيب لعبد دعاه عن ظهر قلب غافل","s":"أخرجه الإمام أحمد عن عبد الله بن عمرو","v":2,"p":321,"d":0},{"t":"اللهم إني أعوذ بك من العجز والكسل والبخل والهرم وعذاب القبر، اللهم آتِ نفسي تقواها، وزكها أنت خير من زكاها، أنت وليها ومولاها، اللهم إني أعوذ بك من علم لا ينفع، ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها","s":"أخرجه مسلم والترمذي والنسائي عن زيد بن أرقم","v":2,"p":321,"d":0}],"45":[{"t":"الحمد لله الذي وسع سمعه الأصوات","s":"البخاري عن عائشة","v":1,"p":198,"d":0},{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرًا منها شربة ماء","s":"رواه الترمذي","v":1,"p":206,"d":0},{"t":"إنكم لا تسعون الناس بأموالكم، ولكن ليسعهم منكم بسط الوجه وحسن الخلق","s":"أخرجه الحاكم في المستدرك عن أبي هريرة","v":1,"p":209,"d":0},{"t":"اللهم اهدِ قومي فإنهم لا يعلمون","s":"البيهقي في شعب الإيمان عن عبد الله بن عبيد","v":1,"p":209,"d":0}],"46":[{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال، فأقول: يا رب أصحابي، فيقول: إنك لا تدري ما أحدثوا بعدك، فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"ما قلّ وكفى خير مما كثر وألهى","s":"رواه أحمد في مسنده من حديث أبي الدرداء","v":1,"p":132,"d":0}],"48":[{"t":"إن الله جميل يحب الجمال","s":"أخرجه مسلم وأبو داود والترمذي عن عبد الله بن مسعود","v":2,"p":112,"d":0},{"t":"حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه","s":"","v":2,"p":112,"d":0},{"t":"الكرسي موضع القدمين، والعرش لا يقدر قدره","s":"رواه الحاكم والدارمي عن ابن عباس","v":2,"p":113,"d":0},{"t":"ما السماوات السبع مع الكرسي إلا كحلقة ملقاة بأرض فلاة","s":"","v":2,"p":113,"d":0},{"t":"... ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة...","s":"صحيح البخاري من حديث عبد الله بن عمر","v":2,"p":121,"d":0},{"t":"والله ما الدنيا في الآخرة إلا مثل ما يجعل أحدكم إصبعه هذه في اليم، فلينظر بم ترجع","s":"رواه أحمد والطبراني من حديث المستورد بن شداد","v":2,"p":123,"d":0},{"t":"... أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر...","s":"صحيح البخاري من حديث أبي هريرة","v":2,"p":124,"d":0},{"t":"... يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرمًا فلا تظالموا، يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم، يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم، يا عبادي كلكم عار إلا من كسوته فاستكسوني أكسكم...","s":"صحيح مسلم من حديث أبي ذر","v":2,"p":130,"d":0}],"49":[{"t":"اللهم قني عذابك يوم تبعث عبادك","s":"رواه أحمد والترمذي والنسائي من حديث البراء بن عازب","v":4,"p":225,"d":0}],"50":[{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال، فأقول: يا رب أصحابي، فيقول: إنك لا تدري ما أحدثوا بعدك، فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":0},{"t":"ألا أنبئكم بأكبر الكبائر؟ - ثلاثًا - قلنا: بلى يا رسول الله، قال: الإشراك بالله، وعقوق الوالدين","s":"","v":1,"p":436,"d":0},{"t":"صبرًا آل ياسر، فإن موعدكم الجنة","s":"أخرجه الأصبهاني في حلية الأولياء عن عثمان بن عفان","v":1,"p":443,"d":0}],"52":[{"t":"كيف أنعم وقد التقم صاحب القرن القرن واستمع الإذن متى يؤمر بالنفخ فينفخ؟ فكأن ذلك ثقل على أصحاب رسول الله ﷺ، فقال لهم: قولوا: حسبنا الله ونعم الوكيل، على الله توكلنا","s":"الترمذي عن أبي سعيد الخدري","v":1,"p":388,"d":1},{"t":"إن الله يلوم على العجز، ولكن عليك بالكيس، فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":1},{"t":"لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير، تغدو خماصًا وتروح بطانًا","s":"","v":1,"p":393,"d":0},{"t":"اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت","s":"أخرجه الحاكم عن أنس بن مالك","v":1,"p":400,"d":0},{"t":"إن الله يلوم على العجز","s":"أخرجه أبو داود عن عوف بن مالك","v":1,"p":401,"d":0},{"t":"يا أبا بكر، ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":0}],"53":[{"t":"وبعث الله عز وجل الريح على المشركين فكفى الله المؤمنين القتال وكان الله قويًا عزيزًا","s":"رواه أحمد عن عائشة","v":2,"p":95,"d":0},{"t":"اعلم أبا مسعود! لله أقدر عليك منك عليه","s":"رواه الترمذي","v":2,"p":109,"d":0}],"54":[{"t":"اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك","s":"رواه مسلم من حديث ابن عمر","v":2,"p":384,"d":0},{"t":"إذا اشتكيت فضع يدك حيث تشتكي ثم قل: بسم الله، أعوذ بعزة الله وقدرته من شر ما أجد من وجعي هذا، ثم ارفع يدك، ثم أعد ذلك وترًا","s":"رواه الترمذي والحاكم من حديث أنس بن مالك","v":2,"p":390,"d":0}],"55":[{"t":"وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه...","s":"متفق عليه","v":2,"p":57,"d":0},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":0},{"t":"صنائع المعروف تقي مصارع السوء","s":"رواه الطبراني وصححه الألباني","v":2,"p":178,"d":0},{"t":"إن آل أبي ليسوا بأوليائي، إنما وليي الله وصالح المؤمنين، ولكن لهم رحم أبلها ببلالها","s":"أخرجه أبو داود والترمذي عن أبي سعيد الخدري","v":2,"p":344,"d":0},{"t":"إذا صنع لأحدكم خادمه طعامًا ثم جاءه به وقد ولي حره ودخانه، فليقعده معه فليأكل","s":"","v":2,"p":345,"d":0}],"56":[{"t":"عجبت لأمر المؤمن، إن أمره كله خير، إن أصابه ما يحب حمد الله وكان له خير، وإن أصابه ما يكره فصبر كان له خير","s":"أخرجه أحمد في مسنده","v":1,"p":350,"d":0},{"t":"يا ابن آدم! مرضت فلم تعدني، قال: يا رب! كيف أعودك وأنت رب العالمين؟! قال: أما علمت أن عبدي فلانًا مرض فلم تعده، أما علمت أنك لو عدته لوجدتني عنده","s":"حديث قدسي رواه مسلم من حديث أبي هريرة","v":1,"p":358,"d":0},{"t":"يا عبادي، كلكم ضال إلا من هديته فاستهدوني أهدكم","s":"أخرجه مسلم والترمذي عن أبي ذر الغفاري","v":1,"p":361,"d":0},{"t":"ابن آدم! إنك إذا ذكرتني شكرتني","s":"","v":1,"p":365,"d":0}],"57":[{"t":"إن لله تسعة وتسعين اسمًا","s":"","v":4,"p":269,"d":0},{"t":"إن لله تسعة وتسعين اسمًا، مائة إلا واحدًا، من أحصاها دخل الجنة","s":"رواه البخاري ومسلم عن أبي هريرة","v":4,"p":272,"d":0}],"60":[{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره، فإنه لا يدري ما خلفه عليه، ثم ليضطجع على شقه الأيمن، ثم ليقل: باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"صحيح البخاري","v":4,"p":340,"d":0}],"61":[{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره، فإنه لا يدري ما خلفه عليه، ثم ليضطجع على شقه الأيمن، ثم ليقل: باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"صحيح البخاري","v":4,"p":340,"d":0}],"62":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"عش ما شئت فإنك ميت، وأحبب من شئت فإنك مفارقه، واعمل ما شئت فإنك مجزي به","s":"رواه الحاكم عن سهل بن سعد وهو حديث حسن","v":1,"p":288,"d":0},{"t":"اثبت أحد، فإن عليك نبيًا وصديقًا وشهيدين","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"إن من أمنّ الناس عليّ في صحبته وماله أبا بكر، ولو كنت متخذًا خليلًا غير ربي عز وجل لاتخذت أبا بكر، ولكن أخوة الإسلام ومودته، لا يبقين في المسجد باب إلا سد إلا باب أبي بكر","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"لو كنت متخذًا من أمتي خليلًا لاتخذت أبا بكر خليلًا، ولكن أخي وصاحبي","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0}],"63":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":0},{"t":"إن الأمر بالمعروف والنهي عن المنكر لا يقطع رزقًا ولا يقرب أجلًا","s":"أخرجه ابن أبي حاتم في تفسيره","v":1,"p":307,"d":0},{"t":"البر لا يبلى، والذنب لا يُنسى، والديان لا يموت","s":"أخرجه عبد الرزاق في مصنفه عن أبي قلابة مرسلًا","v":1,"p":308,"d":0},{"t":"الأمانة غنى","s":"رواه القضاعي في مسند الشهاب من حديث أنس بن مالك","v":1,"p":308,"d":0},{"t":"اللهم لك الحمد أنت قيّم السماوات والأرض ومن فيهن، ولك الحمد لك ملك السماوات والأرض ومن فيهن، ولك الحمد أنت نور السماوات والأرض ومن فيهن...","s":"أخرجه البخاري","v":1,"p":313,"d":0}],"66":[{"t":"لا إله إلا الله الواحد القهار، رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"يوم تبدل الأرض غير الأرض والسماوات وبرزوا لله الواحد القهار، قلت: أين الناس يومئذ؟ قال: على الصراط","s":"","v":2,"p":132,"d":1},{"t":"أوتروا يا أهل القرآن، فإن الله وتر يحب الوتر","s":"رواه مسلم والترمذي","v":2,"p":144,"d":0},{"t":"والذي نفسي بيده لقد سأل الله باسمه الأعظم الذي إذا دعي به أجاب، وإذا سئل به أعطى","s":"رواه الترمذي وغيره","v":2,"p":144,"d":0},{"t":"إن الله يحب معالي الأمور وأشرافها، ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":231,"d":0}],"67":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي","s":"رواه مسلم عن أبي هريرة","v":3,"p":243,"d":0},{"t":"أعظم النساء بركة أيسرهن مؤونة","s":"","v":3,"p":244,"d":0}],"68":[{"t":"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد","s":"رواه البخاري ومسلم عن المغيرة بن شعبة","v":1,"p":97,"d":0},{"t":"الكبرياء ردائي، والعظمة إزاري، فمن نازعني منهما شيئًا أذقته عذابي","s":"أخرجه أحمد وأبو داود وابن ماجه عن أبي هريرة؛ وابن ماجه عن ابن عباس","v":1,"p":101,"d":0},{"t":"ولكل شيء حقيقة، وما بلغ العبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه أحمد والطبراني عن أبي الدرداء","v":1,"p":102,"d":0},{"t":"يا رسول الله! كيف يحشر أهل النار على وجوههم؟ قال: إن الذي أمشاهم على أقدامهم قادر أن يمشيهم على وجوههم","s":"أحمد عن أنس بن مالك","v":3,"p":151,"d":0},{"t":"إن الله لا يقدس أمة لا يأخذ الضعيف حقه من القوي","s":"أخرجه الحاكم عن أبي سفيان بن الحارث بن عبد المطلب","v":3,"p":160,"d":0},{"t":"ولكل شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه الطبراني عن أبي الدرداء","v":3,"p":478,"d":0}],"69":[{"t":"أما إنك لو لم تفعل للفحتك النار أو لمستك النار","s":"صحيح مسلم","v":2,"p":421,"d":0},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب","s":"","v":2,"p":422,"d":0},{"t":"فلا تقل: لو أني فعلت لكان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن لو تفتح عمل الشيطان","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":423,"d":0}],"70":[{"t":"من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن أبي هريرة","v":3,"p":292,"d":0},{"t":"إن الله يحب معالي الأمور وأشرافها ويكره سفسافها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":293,"d":0},{"t":"إن الله وملائكته يصلون على الصف المقدم، والمؤذن يغفر له مدى صوته ويصدقه من سمعه من رطب ويابس، وله مثل أجر من صلى معه","s":"أخرجه النسائي عن البراء بن عازب","v":3,"p":294,"d":0},{"t":"لو كنت متخذًا خليلًا لاتخذت أبا بكر خليلًا... ولكن أخوة الإسلام، لا تبقين في المسجد خوخة إلا خوخة أبي بكر","s":"متفق عليه من حديث أبي سعيد الخدري","v":3,"p":300,"d":0}],"71":[{"t":"اللهم ربنا لك الحمد، أنت قيّم السماوات والأرض ومن فيهن","s":"","v":3,"p":307,"d":0},{"t":"فمن لم يأت الدعوة فقد عصى الله ورسوله","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":312,"d":0},{"t":"إذا دعي أحدكم فليجب، فإن كان صائمًا فليصل، وإن كان مفطرًا فليطعم","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":313,"d":0},{"t":"إن الملائكة تضع أجنحتها لطالب العلم","s":"","v":3,"p":313,"d":0},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":3,"p":315,"d":0},{"t":"رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله وما أنت أعلم به مني، اللهم اغفر لي خطاياي وعمدي وجهلي وهزلي وكل ذلك عندي، اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"صحيح البخاري من حديث أبي موسى الأشعري","v":3,"p":318,"d":0}],"72":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"كان الله ولم يكن شيء غيره","s":"","v":2,"p":435,"d":0},{"t":"كان الله ولم يكن شيء غيره، وكان عرشه على الماء، وكتب في الذكر كل شيء، وخلق السماوات والأرض","s":"رواه البخاري","v":2,"p":436,"d":0},{"t":"بعثت أنا والساعة هكذا - وقرن بين السبابة والوسطى","s":"صحيح البخاري","v":2,"p":441,"d":0}],"73":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1}],"74":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"خير الصدقة ما كان عن ظهر غنى","s":"أخرجه البخاري وأبو داود والنسائي عن أبي هريرة","v":2,"p":454,"d":0}],"75":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"وأنت الباطن فليس دونك شيء","s":"","v":2,"p":465,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1}],"77":[{"t":"فإنما ترزقون وتنصرون بضعفائكم","s":"","v":2,"p":181,"d":0},{"t":"أتدرون ما المفلس؟ قالوا: المفلس فينا من لا درهم له ولا متاع. قال: إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه ثم طرح في النار","s":"أخرجه مسلم والترمذي عن أبي هريرة","v":2,"p":185,"d":0},{"t":"إن الله يحب معالي الأمور وأشرافها، ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":2,"p":187,"d":0}],"78":[{"t":"رب أشعث مدفوع بالأبواب لو أقسم على الله لأبره","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":396,"d":0},{"t":"عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقًا، وإياكم والكذب، فإن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار، وما يزال العبد يكذب ويتحرى الكذب حتى يكتب عند الله كذابًا","s":"متفق عليه من حديث عبد الله بن مسعود","v":2,"p":398,"d":0},{"t":"يا أيها الناس! إن الله قد أذهب عنكم عبية الجاهلية وتعاظمها بآبائها، فالناس رجلان: برّ تقي كريم على الله، وفاجر شقي هين على الله، والناس بنو آدم، وآدم من تراب","s":"","v":2,"p":402,"d":0},{"t":"لقد رفعوا إليّ في الجنة فيما يرى النائم على سرر من ذهب، فرأيت في سرير عبد الله بن رواحة ازورارًا عن سريري صاحبيه، فقلت: بم هذا؟ فقيل لي: مضيا وتردد عبد الله بن رواحة بعض التردد ثم مضى","s":"رواه الطبراني ورجاله ثقات من حديث عبد الله بن الزبير","v":2,"p":404,"d":0},{"t":"البر لا يبلى، والذنب لا ينسى، والديان لا يموت، اعمل ما شئت كما تدين تدان","s":"أخرجه عبد الرزاق في مصنفه عن أبي قلابة مرسلًا","v":2,"p":409,"d":0},{"t":"رضا الرب في رضا الوالدين","s":"","v":2,"p":410,"d":0},{"t":"وإن أحسن الناس إسلامًا أحسنهم خلقًا","s":"أخرجه أبو يعلى والطبراني عن جابر بن سمرة","v":2,"p":410,"d":0},{"t":"ما من شيء أثقل في ميزان المؤمن يوم القيامة من خلق حسن","s":"أخرجه أبو داود والترمذي عن أبي الدرداء","v":2,"p":411,"d":0},{"t":"إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم","s":"أخرجه أبو داود عن عائشة أم المؤمنين","v":2,"p":411,"d":0},{"t":"إن العبد ليبلغ بحسن خلقه عظيم درجات الآخرة","s":"أخرجه الطبراني عن أنس بن مالك","v":2,"p":411,"d":0},{"t":"الخلق الحسن يذيب الخطايا كما يذيب الماء الجليد، والخلق السوء يفسد العمل كما يفسد الخل العسل","s":"أخرجه الطبراني عن عبد الله بن عباس","v":2,"p":411,"d":0}],"79":[{"t":"رب اغفر لي وتب عليّ إنك أنت التواب الرحيم","s":"","v":1,"p":137,"d":1},{"t":"قال الله عز وجل: أنا عند ظن عبدي بي، وأنا معه حيث يذكرني، والله لله أفرح بتوبة عبده من أحدكم يجد ضالته بالفلاة، ومن تقرب إليّ شبرًا تقربت إليه ذراعًا، ومن تقرب إليّ ذراعًا تقربت إليه باعًا، وإذا أقبل إليّ يمشي أقبلت إليه أهرول","s":"","v":1,"p":138,"d":0}],"80":[{"t":"يا أبا جهل بن هشام، يا أمية بن خلف، يا عتبة بن ربيعة، يا شيبة بن ربيعة، أليس قد وجدتم ما وعد ربكم حقًا؟ فإني قد وجدت ما وعدني ربي حقًا... والذي نفسي بيده ما أنتم بأسمع لما أقول منهم","s":"أخرجه مسلم عن أنس بن مالك","v":4,"p":250,"d":0}],"81":[{"t":"سلوا الله العفو والعافية واليقين في الآخرة والأولى","s":"أخرجه أحمد في مسنده","v":1,"p":463,"d":1},{"t":"اللهم إنك عفو تحب العفو فاعف عني","s":"رواه أحمد وابن ماجه والترمذي وصححه","v":2,"p":341,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":1},{"t":"مرحبًا بالراكب المهاجر","s":"أخرجه الحاكم في المستدرك والترمذي عن عكرمة بن أبي جهل","v":1,"p":465,"d":0}],"82":[{"t":"من اشترى سرقة وهو يعلم أنها سرقة فقد اشترك في عارها وإثمها","s":"أخرجه الحاكم في المستدرك والبيهقي في شعب الإيمان","v":1,"p":220,"d":0},{"t":"هل تنصرون وترزقون إلا بضعفائكم","s":"البخاري عن سهل بن سعد","v":1,"p":222,"d":0}],"83":[{"t":"اعلم أبا مسعود! لله أقدر عليك منك عليه","s":"رواه مسلم من حديث أبي مسعود الأنصاري","v":4,"p":193,"d":0},{"t":"دخلت امرأة النار من جراء هرة لها أو هي ربطتها، فلا هي أطعمتها ولا هي أرسلتها ترمرم من خشاش الأرض","s":"صحيح مسلم","v":4,"p":195,"d":0},{"t":"اتقوا الله وأصلحوا ذات بينكم، فإن الله تعالى يصلح بين المسلمين","s":"أخرجه الحاكم في المستدرك","v":4,"p":198,"d":0},{"t":"فاتقوا الله واعدلوا بين أولادكم","s":"","v":4,"p":199,"d":0},{"t":"واتق دعوة المظلوم، فإنها ليس بينها وبين الله حجاب","s":"صحيح البخاري من حديث ابن عباس","v":4,"p":206,"d":0}],"85":[{"t":"اللهم أنت الله لا إله إلا أنت، أنت الغني ونحن الفقراء","s":"","v":2,"p":24,"d":1},{"t":"قال الله عز وجل: أنفق أنفق عليك، وقال: يد الله ملأى لا تغيضها نفقة، سحاء الليل والنهار، أرأيتم ما أنفق منذ خلق السماء والأرض؟ فإنه لم يغض ما في يده، وكان عرشه على الماء، وبيده الميزان يخفض ويرفع","s":"متفق عليه عن أبي هريرة","v":2,"p":27,"d":0},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا","s":"صحيح مسلم عن أبي ذر","v":2,"p":29,"d":0}],"87":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر","s":"رواه مسلم من حديث أبي هريرة","v":4,"p":153,"d":0},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":4,"p":160,"d":0}],"88":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي","s":"","v":4,"p":169,"d":0},{"t":"إن ربكم حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه أبو داود والترمذي من حديث سلمان الفارسي","v":4,"p":170,"d":0}],"89":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي","s":"","v":4,"p":169,"d":0},{"t":"إن ربكم حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه أبو داود والترمذي من حديث سلمان الفارسي","v":4,"p":170,"d":0}],"90":[{"t":"حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه","s":"","v":2,"p":112,"d":1}],"91":[{"t":"قال الله: أنفق يا ابن آدم أنفق عليك","s":"أخرجه البخاري","v":4,"p":299,"d":0},{"t":"الرؤيا الصالحة جزء من ست وأربعين جزءًا من النبوة","s":"أخرجه البخاري ومسلم من حديث أبي سعيد الخدري","v":4,"p":302,"d":0}],"93":[{"t":"أوصيكم بالأنصار، فإنهم كرشي وعيبتي، وقد قضوا الذي عليهم وبقي الذي لهم، فاقبلوا من محسنهم وتجاوزوا عن مسيئهم","s":"رواه البخاري من حديث أنس بن مالك","v":4,"p":41,"d":0}],"94":[{"t":"اللهم اقسم لنا من خشيتك ما يحول بيننا وبين معاصيك، ومن طاعتك ما تبلغنا به جنتك، ومن اليقين ما تهون به علينا مصيبات الدنيا، ومتعنا بأسماعنا وأبصارنا وقوتنا ما أحييتنا، واجعله الوارث منا، واجعل ثأرنا على من ظلمنا، وانصرنا على من عادانا، ولا تجعل مصيبتنا في ديننا، ولا تجعل الدنيا أكبر همنا ولا مبلغ علمنا","s":"","v":2,"p":203,"d":0},{"t":"إن الرجل ليعمل - وإن المرأة لتعمل - بطاعة الله ستين عامًا، ثم يحضرهما الموت فيضاران في الوصية، فتجب لهما النار","s":"أخرجه أبو داود والترمذي عن أبي هريرة","v":2,"p":204,"d":0}],"97":[{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك؟ قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة ورحيمهما، تعطيهما من تشاء وتمنع منهما من تشاء، ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"من أحيا أرضًا ميتة فهي له","s":"البخاري عن عمر بن الخطاب","v":1,"p":82,"d":0},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء","s":"","v":1,"p":83,"d":0},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله، قد مضى القلم بما هو كائن، فلو جهد الناس أن ينفعوك بما لم يقضه الله لك لم يقدروا عليه، ولو جهد الناس أن يضروك بما لم يكتبه الله عليك لم يقدروا عليه، فإن استطعت أن تعمل بالصبر مع اليقين فافعل، فإن لم تستطع فاصبر، فإن في الصبر على ما تكره خيرًا كثيرًا، واعلم أن النصر مع الصبر، وأن الفرج مع الكرب، وأن مع العسر يسرًا","s":"أخرجه الحاكم في المستدرك من حديث ابن عباس","v":1,"p":86,"d":0},{"t":"عجبًا لأمر المؤمن! إن أمره كله له خير، إن أصابته سراء شكر فكان خيرًا له، وإن أصابته ضراء صبر فكان خيرًا له، وليس ذلك لغير المؤمن","s":"أخرجه مسلم عن صهيب الرومي","v":1,"p":89,"d":0},{"t":"إن أخنع اسم عند الله رجل تسمى ملك الأملاك، لا مالك إلا الله","s":"متفق عليه عن أبي هريرة","v":3,"p":388,"d":0},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء، ثم خلق السماوات والأرض، وكتب في الذكر كل شيء","s":"أخرجه البخاري والترمذي عن عمران بن حصين","v":3,"p":389,"d":0},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله","s":"أخرجه الحاكم في المستدرك","v":3,"p":392,"d":0}],"98":[{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"ألظوا بيا ذا الجلال والإكرام","s":"","v":4,"p":110,"d":1},{"t":"استحيوا من الله حق الحياء","s":"","v":4,"p":98,"d":0},{"t":"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك","s":"متفق عليه من حديث أبي هريرة","v":4,"p":99,"d":0},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد منكم ما نقص ذلك من ملكي شيئًا","s":"أخرجه مسلم من حديث أبي ذر","v":4,"p":104,"d":0},{"t":"يا حي يا قيوم برحمتك أستغيث","s":"","v":4,"p":110,"d":0},{"t":"إياك وما يعتذر منه","s":"أخرجه الطبراني في الأوسط من حديث ابن عمر","v":4,"p":111,"d":0}]};
var NTAB="q",NVK=null;
var NI=null,NR={},NSEL=null,NL=40,PSET={};
function nrmA(t){var o='';for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if((c>=0x64B&&c<=0x65F)||c===0x640||(c>=0x6D6&&c<=0x6ED)||(c>=0x8D3&&c<=0x8FF)||c===0x621)continue;if(c===0x670||c===0x622||c===0x623||c===0x625||c===0x671)c=0x627;else if(c===0x649||c===0x6CC||c===0x626)c=0x64A;else if(c===0x624)c=0x648;else if(c===0x6A9)c=0x643;o+=String.fromCharCode(c)}return o}
function nunits(t){var u=[];for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(c===0x640||(c>=0x6D6&&c<=0x6ED)||(c>=0x8D3&&c<=0x8FF)||c===0x670||c===0x621||c===0x622||c===0x623||c===0x625||c===0x627||c===0x671)continue;if(c>=0x64B&&c<=0x650){if(u.length){var v=c<=0x64D?c+3:c;u[u.length-1][1]=String.fromCharCode(v)}continue}if(c>=0x651&&c<=0x65F)continue;if(c===0x649||c===0x6CC||c===0x626)c=0x64A;else if(c===0x624)c=0x648;else if(c===0x6A9)c=0x643;u.push([String.fromCharCode(c),''])}return u}
(function(){['','و','ف'].forEach(function(b){['','ب','ل','ك'].forEach(function(m){['','ل'].forEach(function(d){PSET[b+m+d]=1})})})})();
function bidx(al){var L=Object.create(null),S2=Object.create(null),combos=[];
 ['','و','ف'].forEach(function(b){['','ب','ل','ك'].forEach(function(m){[0,1].forEach(function(d){var p;if(al){p=b+m+(d?'ال':'');if(m==='ل'&&d)p=b+'لل'}else p=b+m+(d?'ل':'');combos.push([p,(m===''&&d)?1:0])})})});
 NV.forEach(function(v,vi){var arr=al?v.a:v.n;for(var wi=0;wi<arr.length;wi++){var w=arr[wi];for(var ci=0;ci<combos.length;ci++){var p=combos[ci][0];if(w.length>p.length&&w.substr(0,p.length)===p){var s=w.slice(p.length),code=vi*256+wi;(L[s]||(L[s]=[])).push(code);if(combos[ci][1])(S2[s]||(S2[s]=[])).push(code)}}}});
 return [L,S2]}
function ensureIdx(){if(NV&&NV.length!==S.v.length){NV=null;NI=null;NR={}}if(NI)return;

 NV.forEach(function(v){if(!v.a)v.a=v.w.map(nrmA)});
 NI=[bidx(false),bidx(true)]}
function umatch(wu,su){for(var k=0;k<=3&&k<=wu.length-su.length;k++){if(wu.length-k!==su.length)continue;var pl='';for(var q=0;q<k;q++)pl+=wu[q][0];if(PSET[pl]===undefined)continue;var ok=true;for(var i=0;i<su.length;i++){if(wu[k+i][0]!==su[i][0]){ok=false;break}if(i<su.length-1&&su[i][1]&&su[i][1]!==wu[k+i][1]){ok=false;break}}if(ok)return true}return false}
function nrun(spec){var H={};function add(vi,wi){(H[vi]||(H[vi]={}))[wi]=1}
 spec.split(' ').forEach(function(tk){if(!tk)return;var st=false,al=false,vw=false;
  while('=!@'.indexOf(tk.charAt(0))>=0){var f=tk.charAt(0);if(f==='=')st=true;else if(f==='!')al=true;else vw=true;tk=tk.slice(1)}
  if(st)al=true;

 ['h','مثال ٤: لماذا «العزيز الحكيم»؟'],

 ['p','والآية تتحدث عن العذاب والمغفرة معاً، فاجتماع الاسمين يناسب سياقها: من يملك القدرة ومن يحكم بحكمة.'],
 ['h','مثال ٥: اسم الله «الحكيم» في سياق لقمان'],

{n:7,t:'بناء الآية: مراعاة السياق والزمان والمكان',pg:[9,10],c:[
 ['lead','الآية ليست كلمات مرصوصة. ترتيب أجزائها ومقدار ما فيها من التقديم والتأخير يحمل معنى. وهذا المفتاح يدربك على أن تسأل: لماذا هذا الترتيب هنا بالذات؟'],
 ['h','مثال ١: الفرق بين آيتين متشابهتين'],
 ['v','6:151'],['v','17:31'],
 ['p','الآيتان تنهيان عن قتل الأولاد، لكن بينهما فرقاً في الترتيب والتعبير. في آية الإسراء (خشية إملاق): الخوف من فقر قادم، فقال «نحن نرزقهم وإياكم» وبدأ بالأولاد. وفي آية الأنعام (من إملاق): الفقر موجود الآن، فقال «نرزقكم وإياهم» وبدأ بالآباء. فالتعبير راعى حال المخاطب في كل سياق.'],
 ['h','مثال ٢: ترتيب الأقارب'],
 ['r','80:34','80:36'],['r','70:11','70:14'],
 ['p','قارن القائمتين: من الذين يفر منهم الإنسان في كل سورة؟ وبأي ترتيب؟ ولماذا؟ سؤال التدبر: ما الذي يحدث لو غُيّر الترتيب؟'],
 ['h','مثال ٣: مراحل الإنسان في آيات متتالية'],
 ['r','76:1','76:5'],
 ['p','في مقطع قصير يذكر الله مراحل الإنسان: ما قبل الخلق، ثم الخلق، ثم الهداية، ثم إعداد العذاب للكافرين، ثم النظر إلى الأبرار. المقطع يحكي القصة كاملة من البداية إلى المصير.'],
 ['h','مثال ٤: ربط الزمان بالمكان'],
 ['v','34:1'],
 ['p','السماوات والأرض إشارة إلى المكان في الدنيا، والآخرة إشارة إلى الزمان. فالآية تربط المكان بالزمان: الحمد لله في الدنيا وفي الآخرة.'],
 ['h','مثال ٥: تشبيه الملموس بغير الملموس'],
 ['r','14:24','14:26'],
 ['p','الكلمة الطيبة شيء غير ملموس، فشبّهها الله بالشجرة، وهي شيء ملموس. وثبات الكلمة كثبات أصل الشجرة، وفروعها كفروع الشجرة في السماء. هذا من أساليب القرآن في تقريب المعنى.']]},
{n:8,t:'صلة الجملة بموضوع السورة',pg:[9,10,11,12],c:[
 ['lead','قبل أن تتدبر جملة، اعرف موضوع السورة التي هي فيها، فالجملة جزء من بناء أكبر.'],

 ['p','هذا التقسيم يبين لك كيف ينتقل موضوع السورة، وأن آية بعينها تأتي في مكانها لسبب. فإذا قرأت آية تربط بين السابق واللاحق فاسأل ما الذي يربط بين الموضوعين.'],
 ['h','مثال ١: سورة النور'],
 ['v','24:45'],
 ['p','هذه الآية الرئيسية تتحدث عن خلق الله للدواب من ماء وتنوعها (ماشٍ على بطنه، وعلى رجلين، وعلى أربع). والسؤال: ما علاقتها بموضوع السورة؟'],
 ['p','الجواب: الآيات الأخرى في السورة تتحدث عن أنواع من الناس، وكما خلق الله الدواب أنواعاً مختلفة، فكذلك الناس أنواع.'],

 ['h','مثال ٢: سورة العاديات'],
 ['r','100:1','100:11'],
 ['p','ما علاقة القسم بالعاديات (الخيل) بموضوع السورة؟ موضوع السورة هو البعث. والخيل حين تعدو تثير الغبار، فصورة الغبار المثار هي الصورة الأولى لما سيحدث يوم يُبعثر ما في القبور. فالقسم يُمهّد لموضوع السورة بصورة مشابهة.'],
 ['h','مثال ٣: سورة الفجر'],
 ['v','89:14'],
 ['p','ما علاقة القسم بالفجر بموضوع السورة؟ السورة تتحدث عن الطغيان والظلم، وأن كل ظالم له عاقبة من الله. والفجر هو بداية النور وانتهاء الظلمة. فالقسم يناسب الوعد بأن الظلم لن يدوم.']]},
{n:9,t:'علاقة الآية بالمقطع الذي وردت فيه',pg:[12,13],c:[

 ['h','مثال ١: آية رفع الحرج في سورة الأدب'],
 ['r','24:58','24:60'],['v','24:61'],
 ['p','ما علاقة هذه الآية بالمقطع؟ السورة تتحدث عن الحياء والآداب والاستئذان، وهي أحكام قد تشق على الناس إن بُولغ فيها. فجاءت الآية لترفع الحرج في مواضع محددة، فتجمع بين الأدب وبين التيسير.'],

{n:10,t:'كيف تكوّن صورة قرآنية عن موضوع؟',pg:[13,14,15,16,17],c:[
 ['lead','حين تريد أن تعرف ما يقوله القرآن في موضوع ما، لا تكتفِ بآية واحدة. اجمع كل ما ذُكر فيه، وانظر في سياق كل موضع قبله وبعده.'],

 ['h','مثال ١: اسم الله «الواحد»'],
 ['v','12:39'],['v','13:16'],['v','14:48'],['v','38:65'],['v','39:4'],['v','40:16'],
 ['p','لاحظ أن اسم «الواحد» جاء في هذه المواضع كلها مقروناً باسم «القهار». لماذا؟ لأن الوحدة قد توحي بالضعف، فالكثرة تغلب الواحد في الحياة المعتادة. فجاء اسم «القهار» ليبين أن الله واحد ومع ذلك هو القاهر. ومن جهة أخرى: اسم «القهار» لا يُذكر وحده، بل يُذكر مع «الواحد»، لأنه لا يوجد قهار غير الله.'],

 ['r','40:9','40:12'],
 ['r','13:8','13:9'],

{n:11,t:'تناسب أول السورة وآخرها',pg:[18],c:[
 ['lead','السورة وحدة واحدة، وغالباً ما يتناغم أولها مع آخرها. حين تقرأ أول السورة فتأمل آخرها، والعكس.'],
 ['h','الطريقة'],
