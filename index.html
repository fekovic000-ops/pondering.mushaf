[67,17,"نَذِيرِ","تَحْذِيرِي لَكُمْ."],[67,18,"نَكِيرِ","إِنْكَارِي عَلَيْهِمْ، وَتَغْيِيرِ مَا بِهِمْ مِنَ النِّعْمَةِ."],[67,19,"صَٰٓفَّٰتٍ","بَاسِطَاتٍ أَجْنِحَتَهَا عِنْدَ طَيَرَانِهَا فِي الْهَوَاءِ."],[67,19,"وَيَقْبِضْنَ","يَضْمُمْنَهَا إِلَى جُنُوبِهَا أَحْيَانًا."],[67,20,"غُرُورٍ","خِدَاعٍ وَضَلَالٍ مِنَ الشَّيْطَانِ."],[67,21,"لَّجُّوا۟","اسْتَمَرُّوا، وَتَمَادَوْا."],[67,21,"عُتُوٍّ","مُعَانَدَةٍ، وَاسْتِكْبَارٍ."],[67,21,"وَنُفُورٍ","شُرُودٍ وَتَبَاعُدٍ عَنِ الْحَقِّ."],[67,22,"مُكِبًّا","مُنَكِّسًا."],[67,22,"سَوِيًّا","مُسْتَوِيًا، مُنْتَصِبَ الْقَامَةِ سَالِمًا."],[67,22,"صِرَٰطٍ مُّسْتَقِيمٍ","طَرِيقٍ وَاضِحٍ لَا اعْوِجَاجَ فِيهِ."],[67,23,"أَنشَأَكُمْ","أَوْجَدَكُمْ."],[67,24,"ذَرَأَكُمْ","خَلَقَكُمْ، وَنَشَرَكُمْ فِي الْأَرْضِ."],[67,27,"رَأَوْهُ زُلْفَةً","رَأَوْا عَذَابَ اللهِ قَرِيبًا."],[67,27,"سِيٓـَٔتْ","ذَلَّتْ، وَاسْوَدَّتْ."],[67,27,"تَدَّعُونَ","تَطْلُبُونَ أَنْ يُعَجَّلَ لَكُمْ مِنَ الْعَذَابِ اسْتِهْزَاءً."],[67,28,"يُجِيرُ","يَحْمِي."],[67,30,"أَرَءَيْتُمْ","أَخْبِرُونِي."],[67,30,"غَوْرًا","ذَاهِبًا فِي الْأَرْضِ لَا تَصِلُونَ إِلَيْهِ بِوَسِيلَةٍ."],[67,30,"مَّعِينٍ","جَارٍ عَلَى وَجْهِ الْأَرْضِ، ظَاهِرٍ لِلْعُيُونِ."],[68,1,"وَٱلْقَلَمِ","قَسَمٌ بِالْقَلَمِ الَّذِي تَكْتُبُ بِهِ الْمَلَائِكَةُ، وَالنَّاسُ."],[68,1,"وَمَا يَسْطُرُونَ","وَالَّذِي يَكْتُبُونَهُ بِالْقَلَمِ."],[68,3,"مَمْنُونٍ","مَنْقُوصٍ، وَلَا مُنْقَطِعٍ."],[68,6,"بِأَيْيِكُمُ ٱلْمَفْتُونُ","فِي أَيِّ الْفَرِيقَيْنِ الْفِتْنَةُ، وَالْجُنُونُ؟"],[68,9,"تُدْهِنُ","تُلَايِنُ، وَتُصَانِعُ."],[68,10,"حَلَّافٍ","كَثِيرِ الْحَلِفِ."],[68,10,"مَّهِينٍ","كَذَّابٍ، حَقِيرٍ."],[68,11,"هَمَّازٍ","مُغْتَابٍ لِلنَّاسِ."],[68,11,"مَّشَّآءٍۭ بِنَمِيمٍ","يَمْشِي بِالنَّمِيمَةِ، وَهِيَ: نَقْلُ الْحَدِيثِ بَيْنَ النَّاسِ عَلَى وَجْهِ الْإِفْسَادِ."],[68,13,"عُتُلٍّۭ","فَاحِشٍ، لَئِيمٍ، غَلِيظٍ فِي كُفْرِهِ."],[68,13,"زَنِيمٍ","مَنْسُوبٍ لِغَيْرِ أَبِيهِ."],[68,14,"أَن كَانَ","مِنْ أَجْلِ أَنَّهُ كَانَ."],[68,15,"أَسَٰطِيرُ ٱلْأَوَّلِينَ","أَبَاطِيلُهُمْ، وَخُرَافَاتُهُمْ."],[68,16,"سَنَسِمُهُۥ","سَنَجْعَلُ لَهُ عَلَامَةً لَا تُفَارِقُهُ."],[68,16,"ٱلْخُرْطُومِ","أَنْفِهِ."],[68,17,"بَلَوْنَٰهُمْ","اخْتَبَرْنَاهُمْ."],[68,17,"ٱلْجَنَّةِ","الْحَدِيقَةِ."],[68,17,"لَيَصْرِمُنَّهَا","لَيَقْطَعُنَّ ثِمَارَ حَدِيقَتِهَا."],[68,18,"وَلَا يَسْتَثْنُونَ","وَلَا يَنْوُونَ اسْتِثْنَاءَ حِصَّةِ الْمَسَاكِينِ، وَلَمْ يَقُولُوا: إِنْ شَاءَ اللهُ."],[68,19,"فَطَافَ عَلَيْهَا","أَحَاطَ نَازِلًا عَلَيْهَا."],[68,19,"طَآئِفٌ","نَارٌ أَحْرَقَتْهَا."],[68,20,"كَٱلصَّرِيمِ","كَاللَّيْلِ الْمُظْلِمِ."],[68,21,"فَتَنَادَوْا۟","نَادَى بَعْضُهُمْ بَعْضًا."],[68,22,"أَنِ ٱغْدُوا۟","اذْهَبُوا مُبَكِّرِينَ."],[68,22,"حَرْثِكُمْ","مَزْرَعَتِكُمْ."],[68,22,"صَٰرِمِينَ","مُصِرِّينَ عَلَى قَطْعِ الثِّمَارِ."],[68,25,"عَلَىٰ حَرْدٍ","عَلَى قَصْدِهِمُ السَّيِّئِ فِي مَنْعِ الْمَسَاكِينِ."],[68,26,"لَضَآلُّونَ","لَمُخْطِئُونَ فِي طَرِيقِهَا."],[68,28,"أَوْسَطُهُمْ","أَعْدَلُهُمْ، وَخَيْرُهُمْ عَقْلًا وَدِينًا."],[68,28,"لَوْلَا تُسَبِّحُونَ","هَلَّا تَذْكُرُونَ اللهَ، وَتَسْتَغْفِرُونَهُ؛ مِنْ فِعْلِكُمْ، وَخُبْثِ نِيَّتِكُمْ."],[68,30,"يَتَلَٰوَمُونَ","يَلُومُ بَعْضُهُمْ بَعْضًا عَلَى مَا قَصَدُوهُ مِنْ مَنْعِ الْمَسَاكِينِ."],[68,32,"رَٰغِبُونَ","طَالِبُونَ الْخَيْرَ."],[68,33,"كَذَٰلِكَ ٱلْعَذَابُ","مِثْلُ ذَلِكَ الْعِقَابِ الَّذِي عَاقَبْنَاهُمْ بِهِ نُعَاقِبُ كُلَّ مَنْ بَخِلَ، وَخَالَفَ أَمْرَ اللهِ."],[68,38,"تَخَيَّرُونَ","تَشْتَهُونَ."],[68,39,"أَيْمَٰنٌ","عُهُودٌ، وَمَوَاثِيقُ."],[68,39,"إِنَّ لَكُمْ لَمَا تَحْكُمُونَ","إِنَّهُ سَيَحْصُلُ لَكُمْ مَا تُرِيدُونَ، وَتَشْتَهُونَ."],[68,40,"زَعِيمٌ","كَفِيلٌ وَضَامِنٌ بِأَنْ يَكُونَ لَهُمْ ذَلِكَ."],[68,42,"يُكْشَفُ عَن سَاقٍ","يَكْشِفُ رَبُّنَا عَنْ سَاقِهِ؛ فَيَسْجُدُ الْمُؤْمِنُونَ، وَيَعْجِزُ الْمُنَافِقُونَ؛ كَمَا ثَبَتَ فِي الْحَدِيثِ."],[68,43,"خَٰشِعَةً أَبْصَٰرُهُمْ","مُنْكَسِرَةً ذَلِيلَةً؛ لَا يَرْفَعُونَهَا."],[68,43,"تَرْهَقُهُمْ","تَغْشَاهُمْ."],[68,43,"سَٰلِمُونَ","أَصِحَّاءُ، قَادِرُونَ."],[68,44,"ٱلْحَدِيثِ","الْقُرْآنِ."],[68,44,"سَنَسْتَدْرِجُهُم","سَنُمِدُّهُمْ بِالْأَمْوَالِ وَالنِّعَمِ؛ اسْتِدْرَاجًا لَهُمْ."],[68,45,"وَأُمْلِى لَهُمْ","أُمْهِلُهُمْ، وَأُطِيلُ أَعْمَارَهُمْ."],[68,45,"مَتِينٌ","قَوِيٌّ، شَدِيدٌ."],[68,46,"مَّغْرَمٍ","غَرَامَةِ تِلْكَ الْأُجْرَةِ."],[68,46,"مُّثْقَلُونَ","مُكَلَّفُونَ حِمْلًا ثَقِيلًا."],[68,47,"أَمْ عِندَهُمُ","بَلْ أَعِنْدَهُمْ."],[68,48,"وَلَا تَكُن كَصَاحِبِ ٱلْحُوتِ","لَا تَكُنْ مِثْلَ يُونُسَ حِينَ اسْتَعْجَلَ الْعَذَابَ، وَغَضِبَ."],[68,48,"مَكْظُومٌ","مَمْلُوءٌ غَمًّا."],[68,49,"نِعْمَةٌ مِّن رَّبِّهِۦ","بِتَوْفِيقِهِ لِلتَّوْبَةِ، وَقَبُولِهَا."],[68,49,"لَنُبِذَ بِٱلْعَرَآءِ","لَطُرِحَ مِنْ بَطْنِ الْحُوتِ بِالْأَرْضِ الْفَضَاءِ الْمُهْلِكَةِ."],[68,49,"وَهُوَ مَذْمُومٌ","آتٍ بِمَا يُلَامُ عَلَيْهِ."],[68,50,"فَٱجْتَبَٰهُ","اصْطَفَاهُ رَبُّهُ لِرِسَالَتِهِ."],[68,51,"لَيُزْلِقُونَكَ","لَيُسْقِطُونَكَ عَنْ مَكَانِكَ؛ بِنَظَرِهِمْ إِلَيْكَ؛ عَدَاوَةً وَبُغْضًا."],[69,1,"ٱلْحَآقَّةُ","الْقِيَامَةُ الْوَاقِعَةُ حَقًّا الَّتِي يَتَحَقَّقُ فِيهَا الْوَعْدُ وَالْوَعِيدُ."],[69,4,"بِٱلْقَارِعَةِ","بِالْقِيَامَةِ الَّتِي تَقْرَعُ الْقُلُوبَ بِأَهْوَالِهَا."],[69,5,"بِٱلطَّاغِيَةِ","بِالصَّيْحَةِ الَّتِي جَاوَزَتِ الْحَدَّ فِي شِدَّتِهَا."],[69,6,"صَرْصَرٍ","بَارِدَةٍ."],[69,6,"عَاتِيَةٍ","شَدِيدَةِ الْهُبُوبِ."],[69,7,"سَخَّرَهَا عَلَيْهِمْ","سَلَّطَهَا عَلَيْهِمْ."],[69,7,"حُسُومًا","مُتَتَابِعَةً؛ لَا تَفْتُرُ، وَلَا تَنْقَطِعُ."],[69,7,"صَرْعَىٰ","مَوْتَى."],[69,7,"أَعْجَازُ نَخْلٍ","أُصُولُ نَخْلٍ."],[69,7,"خَاوِيَةٍ","خَرِبَةٍ مُتَآكِلَةِ الْأَجْوَافِ."],[69,9,"وَٱلْمُؤْتَفِكَٰتُ","أَهْلُ قُرَى قَوْمِ لُوطٍ الَّذِينَ انْقَلَبَتْ بِهِمْ دِيَارُهُمْ."],[69,9,"بِٱلْخَاطِئَةِ","بِالْفَعْلَاتِ ذَاتِ الْخَطَإِ الْجَسِيمِ."],[69,10,"رَّابِيَةً","بَالِغَةً فِي الشِّدَّةِ."],[69,11,"طَغَا ٱلْمَآءُ","جَاوَزَ الْمَاءُ حَدَّهُ، وَارْتَفَعَ فَوْقَ كُلِّ شَيْءٍ."],[69,11,"ٱلْجَارِيَةِ","السَّفِينَةِ الَّتِي صَنَعَهَا نُوحٌ ﷺ، تَجْرِي فِي الْمَاءِ."],[69,12,"وَتَعِيَهَآ","تَحْفَظَهَا."],[69,13,"ٱلصُّورِ","الْقَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ ﷺ."],[69,13,"نَفْخَةٌ وَٰحِدَةٌ","هِيَ: النَّفْخَةُ الْأُولَى الَّتِي يَكُونُ بِهَا هَلَاكُ الْعَالَمِ."],[69,14,"وَحُمِلَتِ","رُفِعَتْ مِنْ أَمَاكِنِهَا."],[69,14,"فَدُكَّتَا","دُقَّتَا، وَكُسِرَتَا."],[69,15,"وَقَعَتِ ٱلْوَاقِعَةُ","قَامَتِ الْقِيَامَةُ."],[69,16,"وَاهِيَةٌ","ضَعِيفَةٌ، مُسْتَرْخِيَةٌ."],[69,17,"وَٱلْمَلَكُ","الْمَلَائِكَةُ."],[69,17,"أَرْجَآئِهَا","جَوَانِبِهَا، وَأَطْرَافِهَا."],[69,18,"تُعْرَضُونَ","عَلَى اللهِ لِلْجَزَاءِ وَالْحِسَابِ."],[69,19,"هَآؤُمُ","خُذُوا."],[69,20,"ظَنَنتُ","أَيْقَنْتُ."],[69,21,"رَّاضِيَةٍ","هَنِيئَةٍ مَرْضِيَّةٍ."],[69,23,"قُطُوفُهَا","ثِمَارُهَا."],[69,23,"دَانِيَةٌ","قَرِيبَةٌ يَتَنَاوَلُهَا الْقَاعِدُ وَالْمُضْطَجِعُ."],[69,24,"هَنِيٓـًٔۢا","غَيْرَ مُنَغِّصٍ، وَلَا مُكَدِّرٍ."],[69,24,"أَسْلَفْتُمْ","قَدَّمْتُمْ."],[69,26,"مَا حِسَابِيَهْ","مَا جَزَائِي."],[69,27,"كَانَتِ ٱلْقَاضِيَةَ","الْمَوْتَةَ الْقَاطِعَةَ لِأَمْرِي، وَلَمْ أُبْعَثْ."],[69,28,"مَآ أَغْنَىٰ","مَا نَفَعَنِي."],[69,29,"هَلَكَ عَنِّى","ذَهَبَ عَنِّي."],[69,29,"سُلْطَٰنِيَهْ","حُجَّتِي، وَقُوَّتِي."],[69,30,"فَغُلُّوهُ","اجْمَعُوا يَدَيْهِ إِلَى عُنُقِهِ بِالْأَغْلَالِ."],[69,31,"صَلُّوهُ","أَدْخِلُوهُ، وَأَحْرِقُوهُ بِهَا."],[69,32,"ذَرْعُهَا","طُولُهَا بِذِرَاعِ الْمَلَكِ."],[69,32,"فَٱسْلُكُوهُ","فَأَدْخِلُوهُ فِيهَا."],[69,35,"حَمِيمٌ","قَرِيبٌ يَحْمِيهِ مِنَ الْعَذَابِ."],[69,36,"غِسْلِينٍ","صَدِيدِ أَهْلِ النَّارِ."],[69,37,"ٱلْخَٰطِـُٔونَ","الْمُذْنِبُونَ، الْمُصِرُّونَ عَلَى الْكُفْرِ."],[69,38,"فَلَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): لِتَأْكِيدِ الْقَسَمِ."],[69,42,"بِقَوْلِ كَاهِنٍ","بِسَجْعِ كَسَجْعِ الْكُهَّانِ الَّذِينَ يَدَّعُونَ عِلْمَ الْمُغَيَّبَاتِ."],[69,44,"تَقَوَّلَ","اخْتَلَقَ، وَافْتَرَى عَلَيْنَا."],[69,46,"ٱلْوَتِينَ","نِيَاطَ الْقَلْبِ، وَهُوَ: عِرْقٌ مُتَّصِلٌ بِهِ إِذَا قُطِعَ مَاتَ صَاحِبُهُ."],[69,47,"حَٰجِزِينَ","مَانِعِينَ الْهَلَاكَ وَالْعِقَابَ عَنْهُ."],[69,50,"لَحَسْرَةٌ","لَنَدَامَةٌ عَظِيمَةٌ."],[69,52,"فَسَبِّحْ بِٱسْمِ رَبِّكَ","فَنَزِّهْ رَبَّكَ عَمَّا لَا يَلِيقُ بِهِ ذَاكِرًا اسْمَهُ."],[70,1,"سَأَلَ سَآئِلٌۢ","دَعَا دَاعٍ."],[70,1,"بِعَذَابٍ وَاقِعٍ","بِوُقُوعِ الْعَذَابِ عَلَيْهِمْ."],[70,3,"ذِى ٱلْمَعَارِجِ","صَاحِبِ الْعُلُوِّ وَالْجَلَالِ."],[70,4,"تَعْرُجُ","تَصْعَدُ."],[70,4,"وَٱلرُّوحُ","جِبْرِيلُ ﷺ."],[70,5,"صَبْرًا جَمِيلًا","لَا جَزَعَ فِيهِ، وَلَا شَكْوَى مِنْهُ لِغَيْرِ اللهِ."],[70,8,"كَٱلْمُهْلِ","مِثْلِ حُثَالَةِ الزَّيْتِ."],[70,9,"كَٱلْعِهْنِ","كَالصُّوفِ الْمَصْبُوغِ الْمَنْفُوشِ الَّذِي ذَرَّتْهُ الرِّيحُ."],[70,10,"حَمِيمًا","قَرِيبٌ."],[70,11,"يُبَصَّرُونَهُمْ","يُشَاهِدُ بَعْضُهُمْ بَعْضًا، وَيَعْرِفُهُ وَلَا يُكَلِّمُهُ."],[70,13,"وَفَصِيلَتِهِ","عَشِيرَتِهِ."],[70,13,"تُـْٔوِيهِ","تَضُمُّهُ، وَيَنْتَمِي إِلَيْهَا."],[70,15,"كَلَّآ","لَيْسَ الْأَمْرُ كَمَا تَتَمَنَّاهُ أَيُّهَا الْكَافِرُ مِنْ حُصُولِ الِافْتِدَاءِ."],[70,15,"لَظَىٰ","جَهَنَّمُ تَتَلَهَّبُ نَارُهَا، وَتَتَلَظَّى."],[70,16,"نَزَّاعَةً لِّلشَّوَىٰ","تَنْزِعُ بِشِدَّةِ حَرِّهَا جِلْدَةَ الرَّأْسِ، وَسَائِرَ أَطْرَافِ الْبَدَنِ."],[70,18,"فَأَوْعَىٰٓ","أَمْسَكَ مَالَهُ فِي وِعَاءٍ، وَلَمْ يُؤَدِّ حَقَّ اللهِ فِيهِ."],[70,19,"هَلُوعًا","يَجْزَعُ عِنْدَ الْمُصِيبَةِ، وَيَمْنَعُ إِذَا أَصَابَهُ الْخَيْرُ، وَتَفْسِيرُ الْهَلُوعِ جَاءَ فِي الْآيَتَيْنِ بَعْدَهَا."],[70,20,"جَزُوعًا","كَثِيرَ الْأَسَى وَالْحُزْنِ."],[70,21,"ٱلْخَيْرُ","الْمَالُ، وَالْيُسْرُ."],[70,24,"حَقٌّ مَّعْلُومٌ","نَصِيبٌ مُعَيَّنٌ فَرَضَهُ اللهُ عَلَيْهِمْ؛ وَهُوَ الزَّكَاةُ."],[70,25,"وَٱلْمَحْرُومِ","مَنْ يَتَعَفَّفُ عَنِ السُّؤَالِ."],[70,26,"بِيَوْمِ ٱلدِّينِ","يَوْمِ الْجَزَاءِ وَالْحِسَابِ."],[70,28,"غَيْرُ مَأْمُونٍ","لَا يَنْبَغِي أَنْ يَأْمَنَهُ أَحَدٌ."],[70,30,"مَا مَلَكَتْ أَيْمَٰنُهُمْ","إِمَاؤُهُمُ الْمَمْلُوكَاتُ لَهُمْ."],[70,30,"غَيْرُ مَلُومِينَ","غَيْرُ مُؤَاخَذِينَ."],[70,31,"ٱلْعَادُونَ","الْمُتَجَاوِزُونَ الْحَلَالَ إِلَى الْحَرَامِ."],[70,32,"رَٰعُونَ","حَافِظُونَ."],[70,33,"قَآئِمُونَ","مُؤَدُّونَ لِلشَّهَادَةِ، دُونَ تَغْيِيرٍ، أَوْ كِتْمَانٍ."],[70,36,"قِبَلَكَ مُهْطِعِينَ","مُسْرِعِينَ نَحْوَكَ قَدْ مَدُّوا أَعْنَاقَهُمْ إِلَيْكَ، مُقْبِلِينَ عَلَيْكَ."],[70,37,"عِزِينَ","جَمَاعَاتٍ مُتَعَدِّدَةً وَمُتَفَرِّقَةً."],[70,40,"فَلَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): لِتَأْكِيدِ الْقَسَمِ."],[70,41,"بِمَسْبُوقِينَ","لَا أَحَدَ يَفُوتُنَا وَيُعْجِزُنَا إِذَا أَرَدْنَاهُ."],[70,43,"ٱلْأَجْدَاثِ","الْقُبُورِ."],[70,43,"نُصُبٍ","أَحْجَارٍ تُعْبَدُ مِنْ دُونِ اللهِ."],[70,43,"يُوفِضُونَ","يُهَرْوِلُونَ، وَيُسْرِعُونَ."],[70,44,"خَٰشِعَةً","ذَلِيلَةً، مُنْكَسِرَةً."],[70,44,"تَرْهَقُهُمْ","تَغْشَاهُمْ."],[71,4,"أَجَلٍ مُّسَمًّى","وَقْتٍ مُقَدَّرٍ فِي عِلْمِ اللهِ تَعَالَى."],[71,4,"أَجَلَ ٱللَّهِ","وَقْتَ مَجِيءِ عَذَابِهِ."],[71,7,"وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ","تَغَطَّوْا بِهَا؛ مُبَالَغَةً فِي كَرَاهِيَتِي."],[71,7,"وَأَصَرُّوا۟","أَقَامُوا عَلَى كُفْرِهِمْ."],[71,9,"أَعْلَنتُ","رَفَعْتُ صَوْتِي دَاعِيًا."],[71,11,"ٱلسَّمَآءَ","الْمَطَرَ."],[71,11,"مِدْرَارًا","مُتَتَابِعًا، غَزِيرًا."],[71,12,"جَنَّٰتٍ","بَسَاتِينَ."],[71,13,"لَا تَرْجُونَ لِلَّهِ وَقَارًا","لَا تَخَافُونَ عَظَمَةَ اللهِ."],[71,14,"أَطْوَارًا","عَلَى مَرَاحِلَ مُخْتَلِفَةٍ: نُطْفَةً، ثُمَّ عَلَقَةً، وَهَكَذَا."],[71,15,"طِبَاقًا","مُتَطَابِقَةً بَعْضُهَا فَوْقَ بَعْضٍ."],[71,16,"سِرَاجًا","مِصْبَاحًا مُضِيئًا، وَفِيهِ حَرَارَةٌ؛ كَالسِّرَاجِ."],[71,17,"أَنۢبَتَكُم","أَنْشَأَ أَصْلَكُمْ."],[71,19,"بِسَاطًا","مُمَهَّدَةً."],[71,20,"سُبُلًا","طُرُقًا."],[71,20,"فِجَاجًا","وَاسِعَةً."],[71,22,"كُبَّارًا","عَظِيمًا."],[71,23,"لَا تَذَرُنَّ","لَا تَتْرُكُنَّ."],[71,23,"وَدًّا وَلَا سُوَاعًا","هَذِهِ أَسْمَاءُ أَصْنَامِهِمْ، وَكَانَتْ أَسْمَاءَ رِجَالٍ صَالِحِينَ، لَمَّا مَاتُوا زَيَّنَ لَهُمُ الشَّيْطَانُ أَنْ يُقِيمُوا لَهُمُ التَّمَاثِيلَ وَالصُّوَرَ؛ لِيَنْشَطُوا عَلَى الطَّاعَةِ إِذَا رَأَوْهُمْ، فَلَمَّا طَالَ الْأَمَدُ، عَبَدُوهُمْ."],[71,24,"ضَلَٰلًا","بُعْدًا عَنِ الْحَقِّ."],[71,25,"مِّمَّا خَطِيٓـَٰٔتِهِمْ","بِسَبَبِ ذُنُوبِهِمْ."],[71,26,"دَيَّارًا","أَحَدًا حَيًّا عَلَى الْأَرْضِ يَدُورُ، وَيَتَحَرَّكُ."],[71,28,"تَبَارًۢا","هَلَاكًا، وَخُسْرَانًا."],[72,1,"نَفَرٌ","جَمَاعَةٌ."],[72,1,"عَجَبًا","يُتَعَجَّبُ مِنْهُ فِي فَصَاحَتِهِ، وَبَلَاغَتِهِ، وَمَعَانِيهِ."],[72,2,"ٱلرُّشْدِ","الْحَقِّ، وَالْهُدَى."],[72,3,"جَدُّ رَبِّنَا","عَظَمَةُ رَبِّنَا، وَجَلَالُهُ، وَغِنَاهُ."],[72,3,"صَٰحِبَةً","زَوْجَةً."],[72,4,"سَفِيهُنَا","إِبْلِيسُ."],[72,4,"شَطَطًا","قَوْلًا بَعِيدًا عَنِ الْحَقِّ مِنْ دَعْوَى الصَّاحِبَةِ وَالْوَلَدِ."],[72,6,"يَعُوذُونَ","يَسْتَجِيرُونَ، وَيَسْتَعِيذُونَ."],[72,6,"رَهَقًا","طُغْيَانًا، وَسَفَهًا."],[72,7,"وَأَنَّهُمْ ظَنُّوا۟","وَأَنَّ كُفَّارَ الْإِنْسِ حَسِبُوا."],[72,8,"لَمَسْنَا ٱلسَّمَآءَ","طَلَبْنَا بُلُوغَ السَّمَاءِ؛ لِاسْتِرَاقِ السَّمْعِ."],[72,8,"وَشُهُبًا","نُجُومًا مُحْرِقَةً؛ وَذَلِكَ لَمَّا بُعِثَ النَّبِيُّ ﷺ."],[72,9,"مَقَٰعِدَ لِلسَّمْعِ","مَوَاضِعَ؛ لِنَسْتَمِعَ إِلَى أَخْبَارِهَا."],[72,9,"رَصَدًا","أَرْصِدَ لَهُ؛ لِيُرْمَى بِهِ."],[72,10,"رَشَدًا","خَيْرًا، وَصَلَاحًا، وَرَحْمَةً."],[72,11,"طَرَآئِقَ قِدَدًا","فِرَقًا وَمَذَاهِبَ مُخْتَلِفَةً."],[72,12,"ظَنَنَّآ","أَيْقَنَّا."],[72,12,"لَن نُّعْجِزَ ٱللَّهَ","لَنْ نَفُوتَهُ، وَنُفْلِتَ مِنْ قَبْضَتِهِ."],[72,13,"بَخْسًا","نُقْصَانًا مِنْ حَسَنَاتِهِ."],[72,13,"وَلَا رَهَقًا","وَلَا ظُلْمًا يَلْحَقُهُ بِزِيَادَةٍ فِي سَيِّئَاتِهِ."],[72,14,"ٱلْقَٰسِطُونَ","الْجَائِرُونَ، الظَّالِمُونَ الَّذِينَ حَادُوا عَنِ الْحَقِّ."],[72,14,"تَحَرَّوْا۟ رَشَدًا","قَصَدُوا طَرِيقَ الْحَقِّ، وَاجْتَهَدُوا فِي اخْتِيَارِهِ."],[72,16,"وَأَلَّوِ ٱسْتَقَٰمُوا۟","وَأَنَّهُ لَوِ اسْتَقَامَ الْكُفَّارُ."],[72,16,"ٱلطَّرِيقَةِ","دِينِ الْإِسْلَامِ."],[72,16,"غَدَقًا","كَثِيرًا."],[72,17,"لِنَفْتِنَهُمْ فِيهِ","لِنَخْتَبِرَهُمْ كَيْفَ يَشْكُرُونَ نِعَمَ اللهِ عَلَيْهِمْ."],[72,17,"يَسْلُكْهُ","يُدْخِلْهُ."],[72,17,"صَعَدًا","شَدِيدًا شَاقًّا."],[72,19,"يَدْعُوهُ","يَعْبُدُ رَبَّهُ."],[72,19,"كَادُوا۟","قَارَبَ الْجِنُّ."],[72,19,"لِبَدًا","جَمَاعَاتٍ مُتَرَاكِبَةً بَعْضُهَا فَوْقَ بَعْضٍ، مِنْ شِدَّةِ ازْدِحَامِهِمْ لِسَمَاعِ الْقُرْآنِ مِنْهُ."],[72,21,"رَشَدًا","نَفْعًا."],[72,22,"يُجِيرَنِى","يُنْقِذَنِي."],[72,22,"مُلْتَحَدًا","مَلْجَأً أَفِرُّ إِلَيْهِ مِنْ عَذَابِهِ."],[72,23,"إِلَّا بَلَٰغًا","لَكِنْ أَمْلِكُ أَنْ أُبَلِّغَكُمْ."],[72,25,"إِنْ أَدْرِىٓ","مَا أَدْرِي."],[72,25,"مَّا تُوعَدُونَ","الْعَذَابُ الَّذِي وُعِدْتُمْ بِهِ."],[72,25,"أَمَدًا","مُدَّةً طَوِيلَةً."],[72,27,"يَسْلُكُ","يُرْسِلُ."],[72,27,"رَصَدًا","مَلَائِكَةً يَحْفَظُونَهُ، وَيَحْرُسُونَهُ."],[73,1,"ٱلْمُزَّمِّلُ","أَصْلُهَا: الْمُتَزَمِّلُ، أَيِ: الْمُتَلَفِّفُ بِثِيَابِهِ."],[73,4,"وَرَتِّلِ","اقْرَأْ بِتُؤَدَةٍ وَتَمَهُّلٍ؛ مُبَيِّنًا الْحُرُوفَ وَالْوُقُوفَ."],[73,5,"ثَقِيلًا","عَظِيمًا، مُشْتَمِلًا عَلَى الْأَوَامِرِ وَالنَّوَاهِي."],[73,6,"نَاشِئَةَ ٱلَّيْلِ","الْعِبَادَةُ الَّتِي تَنْشَأُ فِي جَوْفِ اللَّيْلِ بَعْدَ النَّوْمِ."],[73,6,"هِىَ أَشَدُّ وَطْـًٔا","أَشَدُّ تَأْثِيرًا فِي الْقَلْبِ."],[73,6,"وَأَقْوَمُ قِيلًا","أَبْيَنُ قَوْلًا؛ لِحُضُورِ الْقَلْبِ، وَقِلَّةِ الشَّوَاغِلِ."],[73,7,"سَبْحًا","تَصَرُّفًا، وَتَقَلُّبًا فِي مَصَالِحِكَ."],[73,8,"وَتَبَتَّلْ","انْقَطِعْ لِعِبَادَتِهِ."],[73,9,"وَكِيلًا","تُفَوِّضُ أُمُورَكَ إِلَيْهِ، وَتَعْتَمِدُ عَلَيْهِ."],[73,10,"هَجْرًا جَمِيلًا","أَعْرِضْ عَنْهُمْ؛ تَارِكًا الِانْتِقَامَ مِنْهُمْ."],[73,11,"أُو۟لِى ٱلنَّعْمَةِ","أَصْحَابِ النَّعِيمِ وَالتَّرَفِ."],[73,11,"وَمَهِّلْهُمْ قَلِيلًا","أَجِّلْهُمْ زَمَنًا قَلِيلًا بِتَأْخِيرِ الْعَذَابِ عَنْهُمْ."],[73,12,"أَنكَالًا","قُيُودًا ثَقِيلَةً."],[73,13,"ذَا غُصَّةٍ","يَنْشَبُ فِي الْحُلُوقِ، لَا يُسْتَسَاغُ؛ لِكَرَاهَتِهِ."],[73,14,"تَرْجُفُ","تَضْطَرِبُ."],[73,14,"كَثِيبًا","رَمْلًا مُجْتَمِعًا."],[73,14,"مَّهِيلًا","سَائِلًا مُتَنَاثِرًا."],[73,16,"وَبِيلًا","شَدِيدًا."],[73,18,"مُنفَطِرٌۢ بِهِۦ","مُتَصَدِّعَةٌ فِي يَوْمِ الْقِيَامَةِ."],[73,18,"مَفْعُولًا","وَاقِعًا لَا مَحَالَةَ."],[73,19,"سَبِيلًا","طَرِيقًا بِالطَّاعَةِ."],[73,20,"تَقُومُ","تُصَلِّي مُتَهَجِّدًا مِنَ اللَّيْلِ."],[73,20,"أَدْنَىٰ","أَقَلَّ."],[73,20,"لَّن تُحْصُوهُ","لَنْ يُمْكِنَكُمْ قِيَامُ اللَّيْلِ كُلِّهِ."],[73,20,"فَتَابَ عَلَيْكُمْ","خَفَّفَ عَنْكُمْ."],[73,20,"يَبْتَغُونَ","يَطْلُبُونَ بِالتَّنَقُّلِ فِي الْأَرْضِ."],[73,20,"فَضْلِ ٱللَّهِ","رِزْقِ اللهِ."],[73,20,"وَأَقْرِضُوا۟","تَصَدَّقُوا."],[73,20,"قَرْضًا حَسَنًا","صَدَقَةً بِإِخْلَاصٍ، وَطِيبِ نَفْسٍ."],[74,1,"ٱلْمُدَّثِّرُ","أَصْلُهُ: الْمُتَدَثِّرُ، وَهُوَ الْمُتَغَطِّي بِثِيَابِهِ."],[74,3,"وَرَبَّكَ فَكَبِّرْ","اخْصُصْ رَبَّكَ بِالتَّكْبِيرِ وَالتَّعْظِيمِ."],[74,4,"وَثِيَابَكَ فَطَهِّرْ","طَهِّرْ نَفْسَكَ مِنَ الْمَعَاصِي وَالْآثَامِ."],[74,5,"وَٱلرُّجْزَ","الْأَصْنَامَ، وَأَعْمَالَ الشِّرْكِ."],[74,6,"وَلَا تَمْنُن تَسْتَكْثِرُ","لَا تُعْطِ الْعَطِيَّةَ، كَيْ تَلْتَمِسَ أَكْثَرَ مِنْهَا."],[74,8,"نُقِرَ فِى ٱلنَّاقُورِ","نُفِخَ فِي الصُّورِ نَفْخَةَ الْبَعْثِ."],[74,11,"وَحِيدًا","فَرِيدًا لَا مَالَ لَهُ، وَلَا وَلَدَ، وَالْمُرَادُ بِهِ: الْوَلِيدُ بْنُ الْمُغِيرَةِ."],[74,12,"مَّمْدُودًا","مَبْسُوطًا وَاسِعًا."],[74,13,"شُهُودًا","حُضُورًا مَعَهُ فِي مَكَّةَ لَا يَغِيبُونَ عَنْهُ."],[74,14,"وَمَهَّدتُّ لَهُۥ تَمْهِيدًا","يَسَّرْتُ لَهُ سُبُلَ الْعَيْشِ تَيْسِيرًا."],[74,17,"سَأُرْهِقُهُۥ صَعُودًا","سَأُكَلِّفُهُ عَذَابًا شَاقًّا لَا رَاحَةَ لَهُ فِيهِ."],[74,18,"وَقَدَّرَ","هَيَّأَ مَا يَقُولُهُ فِي الطَّعْنِ فِي الْقُرْآنِ، وَمَنْ جَاءَ بِهِ."],[74,19,"فَقُتِلَ","غُلِبَ وَقُهِرَ."],[74,21,"نَظَرَ","تَأَمَّلَ فِيمَا هَيَّأَ مِنَ الطَّعْنِ."],[74,22,"عَبَسَ","قَطَّبَ وَجْهَهُ."],[74,22,"وَبَسَرَ","اشْتَدَّ فِي الْعُبُوسِ لَمَّا ضَاقَتْ عَلَيْهِ الْحِيَلُ فِي الطَّعْنِ."],[74,23,"أَدْبَرَ","رَجَعَ مُعْرِضًا عَنِ الْحَقِّ."],[74,24,"يُؤْثَرُ","يُنْقَلُ عَنِ الْأَوَّلِينَ."],[74,26,"سَأُصْلِيهِ سَقَرَ","سَأُدْخِلُهُ جَهَنَّمَ؛ كَيْ يَصْلَى حَرَّهَا."],[74,28,"لَا تُبْقِى","لَا تَتْرُكُ لَحْمًا."],[74,28,"وَلَا تَذَرُ","لَا تَتْرُكُ عَظْمًا."],[74,29,"لَوَّاحَةٌ لِّلْبَشَرِ","مُحْرِقَةٌ لِلْجُلُودِ، مُغَيِّرَةٌ لِلْبَشَرَةِ."],[74,31,"فِتْنَةً","اخْتِبَارًا لِلْكُفَّارِ."],[74,31,"وَلَا يَرْتَابَ","لَا يَشُكَّ."],[74,31,"مَّرَضٌ","نِفَاقٌ."],[74,31,"جُنُودَ رَبِّكَ","مَلَائِكَتَهُ."],[74,35,"إِنَّهَا لَإِحْدَى ٱلْكُبَرِ","إِنَّ النَّارَ لَإِحْدَى الْعَظَائِمِ."],[74,38,"رَهِينَةٌ","مَحْبُوسَةٌ بِعَمَلِهَا."],[74,42,"مَا سَلَكَكُمْ","مَا أَدْخَلَكُمْ."],[74,45,"نَخُوضُ","نَتَحَدَّثُ بِالْبَاطِلِ."],[74,47,"ٱلْيَقِينُ","الْمَوْتُ."],[74,50,"حُمُرٌ مُّسْتَنفِرَةٌ","حُمُرٌ وَحْشِيَّةٌ شَدِيدَةُ النِّفَارِ."],[74,51,"قَسْوَرَةٍ","أَسَدٍ كَاسِرٍ."],[74,56,"أَهْلُ ٱلتَّقْوَىٰ","أَهْلٌ لِأَنْ يُتَّقَى، وَيُطَاعَ."],[75,1,"لَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): تَأْكِيدٌ لِلْقَسَمِ."],[75,2,"بِٱلنَّفْسِ ٱللَّوَّامَةِ","النَّفْسِ الَّتِي تَلُومُ صَاحِبَهَا."],[75,4,"نُّسَوِّىَ بَنَانَهُۥ","نَجْعَلَ أَصَابِعَ يَدَيْهِ وَرِجْلَيْهِ شَيْئًا مُسْتَوِيًا؛ كَخُفِّ الْبَعِيرِ، أَوْ نُعِيدَ خَلْقَهَا كَمَا كَانَتْ."],[75,6,"أَيَّانَ","مَتَى؟"],[75,7,"بَرِقَ ٱلْبَصَرُ","تَحَيَّرَ الْبَصَرُ وَدُهِشَ لِأَهْوَالِ الْقِيَامَةِ."],[75,9,"وَجُمِعَ ٱلشَّمْسُ وَٱلْقَمَرُ","قُرِنَ بَيْنَهُمَا فِي الطُّلُوعِ مِنَ الْمَغْرِبِ مُظْلِمَيْنِ."],[75,11,"لَا وَزَرَ","لَا مَلْجَأَ وَلَا مَنْجَى لَهُ مِنَ اللهِ."],[75,12,"ٱلْمُسْتَقَرُّ","الْمَرْجِعُ، وَالْمَصِيرُ."],[75,14,"عَلَىٰ نَفْسِهِۦ بَصِيرَةٌ","شَاهِدٌ تَنْطِقُ جَوَارِحُهُ بِعَمَلِهِ."],[75,15,"وَلَوْ أَلْقَىٰ مَعَاذِيرَهُۥ","لَوْ جَاءَ بِكُلِّ مَعْذِرَةٍ يَعْتَذِرُ بِهَا، مَا قُبِلَتْ."],[75,16,"لِتَعْجَلَ بِهِۦٓ","لِتَسْتَعْجِلَ حِفْظَ مَا يُوحَى إِلَيْكَ."],[75,17,"جَمْعَهُۥ","فِي صَدْرِكَ."],[75,17,"وَقُرْءَانَهُۥ","قِرَاءَتَهُ بِلِسَانِكَ مَتَى شِئْتَ."],[75,18,"فَٱتَّبِعْ قُرْءَانَهُۥ","اسْتَمِعْ لِقِرَاءَتِهِ مِنْ جِبْرِيلَ، ثُمَّ اقْرَأْهُ كَمَا أَقْرَأَكَ."],[75,19,"بَيَانَهُۥ","تَفْسِيرَ مَا أَشْكَلَ عَلَيْكَ فَهْمُهُ."],[75,22,"نَّاضِرَةٌ","مُشْرِقَةٌ، حَسَنَةٌ."],[75,23,"نَاظِرَةٌ","تَرَى رَبَّهَا فِي الْجَنَّةِ."],[75,24,"بَاسِرَةٌ","عَابِسَةٌ، كَالِحَةٌ."],[75,25,"فَاقِرَةٌ","مُصِيبَةٌ عَظِيمَةٌ تَقْصِمُ فَقَارَ الظَّهْرِ."],[75,26,"كَلَّآ","حَقًّا."],[75,26,"بَلَغَتِ ٱلتَّرَاقِىَ","وَصَلَتِ الرُّوحُ إِلَى أَعَالِي الصَّدْرِ."],[75,27,"مَنْ رَاقٍ","هَلْ مِنْ رَاقٍ يَرْقِيهِ، وَيَشْفِيهِ؟"],[75,28,"وَظَنَّ","أَيْقَنَ الْمُحْتَضَرُ."],[75,29,"وَٱلْتَفَّتِ ٱلسَّاقُ بِٱلسَّاقِ","اتَّصَلَتْ شِدَّةُ آخِرِ الدُّنْيَا بِشِدَّةِ أَوَّلِ الْآخِرَةِ، وَالْتَفَّتْ إِحْدَى سَاقَيْهِ بِالْأُخْرَى عِنْدَ الْمَوْتِ."],[75,30,"ٱلْمَسَاقُ","سَوْقُ الْعِبَادِ لِلْجَزَاءِ."],[75,32,"وَتَوَلَّىٰ","أَعْرَضَ عَنِ الْإِيمَانِ."],[75,33,"يَتَمَطَّىٰٓ","يَتَبَخْتَرُ فِي مِشْيَتِهِ مُخْتَالًا."],[75,34,"أَوْلَىٰ لَكَ فَأَوْلَىٰ","كَلِمَةُ وَعِيدٍ، أَيْ: هَلَاكٌ لَكَ فَهَلَاكٌ."],[75,36,"سُدًى","هَمَلًا لَا يُؤْمَرُ، وَلَا يُحَاسَبُ."],[75,37,"يُمْنَىٰ","يُصَبُّ فِي الرَّحِمِ."],[75,38,"عَلَقَةً","قِطْعَةً مِنْ دَمٍ جَامِدٍ."],[75,38,"فَسَوَّىٰ","عَدَّلَ خَلْقَهُ، وَأَعْضَاءَهُ."],[76,1,"هَلْ أَتَىٰ","قَدْ مَضَى."],[76,1,"حِينٌ","زَمَنٌ طَوِيلٌ."],[76,2,"أَمْشَاجٍ","مُخْتَلِطَةٍ مِنْ مَاءِ الرَّجُلِ وَمَاءِ الْمَرْأَةِ."],[76,2,"نَّبْتَلِيهِ","نَخْتَبِرُهُ بِالْأَوَامِرِ، وَالنَّوَاهِي."],[76,3,"هَدَيْنَٰهُ ٱلسَّبِيلَ","بَيَّنَّا لَهُ طَرِيقَ الْخَيْرِ، وَالشَّرِّ."],[76,4,"سَلَٰسِلَا۟","قُيُودًا مِنْ حَدِيدٍ تُشَدُّ بِهَا أَرْجُلُهُمْ."],[76,4,"وَأَغْلَٰلًا","تُغَلُّ وَتُجْمَعُ بِهَا أَيْدِيهِمْ إِلَى أَعْنَاقِهِمْ."],[76,4,"وَسَعِيرًا","نَارًا يُحْرَقُونَ بِهَا."],[76,5,"كَأْسٍ","إِنَاءِ شُرْبِ الْخَمْرِ، وَفِيهَا خَمْرٌ."],[76,5,"مِزَاجُهَا كَافُورًا","مَخْلُوطَةً بِأَحْسَنِ أَنْوَاعِ الطِّيبِ، وَهُوَ مَاءُ الْكَافُورِ."],[76,6,"يَشْرَبُ بِهَا","يَشْرَبُونَ مُتَلَذِّذِينَ بِهَا."],[76,6,"يُفَجِّرُونَهَا تَفْجِيرًا","يُجْرُونَهَا إِجْرَاءً سَهْلًا حَيْثُ شَاءُوا."],[76,7,"يُوفُونَ بِٱلنَّذْرِ","بِمَا أَوْجَبُوا عَلَى أَنْفُسِهِمْ مِنَ الطَّاعَاتِ."],[76,7,"مُسْتَطِيرًا","فَاشِيًا مُنْتَشِرًا عَلَى النَّاسِ."],[76,8,"وَيَتِيمًا","طِفْلًا مَاتَ وَالِدُهُ قَبْلَ بُلُوغِهِ، وَلَا مَالَ لَهُ."],[76,8,"وَأَسِيرًا","الْمَأْخُوذَ فِي الْحَرْبِ."],[76,10,"عَبُوسًا","تَكْلَحُ فِيهِ الْوُجُوهُ لِهَوْلِهِ."],[76,10,"قَمْطَرِيرًا","شَدِيدَ الْعُبُوسِ."],[76,11,"وَلَقَّىٰهُمْ","أَعْطَاهُمْ."],[76,11,"نَضْرَةً","حُسْنًا وَنُورًا."],[76,13,"ٱلْأَرَآئِكِ","الْأَسِرَّةِ الْمُزَيَّنَةِ بِفَاخِرِ الثِّيَابِ، وَالسُّتُورِ."],[76,13,"زَمْهَرِيرًا","شِدَّةَ بَرْدٍ."],[76,14,"وَدَانِيَةً","قَرِيبَةً أَشْجَارُهَا."],[76,14,"وَذُلِّلَتْ قُطُوفُهَا","سُهِّلَ لَهُمْ أَخْذُ ثِمَارِهَا."],[76,15,"قَوَارِيرَا۠","مِنَ الزُّجَاجِ."],[76,16,"قَدَّرُوهَا","قَدَّرَهَا السُّقَاةُ عَلَى مِقْدَارِ مَا يَشْتَهِي الشَّارِبُونَ."],[76,17,"كَأْسًا","إِنَاءً مَمْلُوءًا خَمْرًا."],[76,18,"سَلْسَبِيلًا","سُمِّيَتْ بِذَلِكَ؛ لِسَلَاسَةِ شُرْبِهَا، وَسُهُولَةِ مَسَاغِهِ."],[76,19,"وِلْدَٰنٌ مُّخَلَّدُونَ","غِلْمَانٌ لِلْخِدْمَةِ دَائِمُونَ عَلَى حَالِهِمْ."],[76,19,"لُؤْلُؤًا","كَاللُّؤْلُؤِ الْمُفَرَّقِ الْمُضِيءِ؛ لِحُسْنِهِمْ، وَصَفَاءِ أَلْوَانِهِمْ."],[76,20,"وَإِذَا رَأَيْتَ ثَمَّ","وَإِذَا أَبْصَرْتَ أَيَّ مَكَانٍ فِي الْجَنَّةِ."],[76,21,"عَٰلِيَهُمْ","يَعْلُوهُمْ."],[76,21,"ثِيَابُ سُندُسٍ","الْحَرِيرُ الرَّقِيقُ الْأَخْضَرُ؛ وَهَذَا بَاطِنُ الثِّيَابِ."],[76,21,"وَإِسْتَبْرَقٌ","الْحَرِيرُ الْغَلِيظُ؛ وَهَذَا ظَاهِرُ الثِّيَابِ."],[76,21,"طَهُورًا","لَا رِجْسَ فِيهِ، وَلَا دَنَسَ."],[76,22,"سَعْيُكُم","عَمَلُكُمُ الصَّالِحُ فِي الدُّنْيَا."],[76,24,"لِحُكْمِ رَبِّكَ","لِأَمْرِهِ الْقَدَرِيِّ فَتَقَبَّلْهُ، وَلِأَمْرِهِ الشَّرْعِيِّ فَتَمْضِيَ عَلَيْهِ."],[76,25,"بُكْرَةً وَأَصِيلًا","أَوَّلَ النَّهَارِ، وَآخِرَهُ."],[76,26,"وَسَبِّحْهُ","صَلِّ لَهُ."],[76,28,"وَشَدَدْنَآ أَسْرَهُمْ","أَحْكَمْنَا خَلْقَهُمْ."],[76,29,"تَذْكِرَةٌ","عِظَةٌ."],[76,29,"سَبِيلًا","طَرِيقًا إِلَى اللهِ بِطَاعَتِهِ."],[77,1,"وَٱلْمُرْسَلَٰتِ عُرْفًا","قَسَمٌ بِالرِّيَاحِ حِينَ تَهُبُّ مُتَتَابِعَةً يَقْفُو بَعْضُهَا أَثَرَ بَعْضٍ."],[77,2,"فَٱلْعَٰصِفَٰتِ عَصْفًا","قَسَمٌ بِالرِّيَاحِ شَدِيدَةِ الْهُبُوبِ الْمُهْلِكَةِ."],[77,3,"وَٱلنَّٰشِرَٰتِ نَشْرًا","قَسَمٌ بِالْمَلَائِكَةِ الْمُوَكَّلِينَ بِالسُّحُبِ يَسُوقُونَهَا حَيْثُ شَاءَ اللهُ."],[77,4,"فَٱلْفَٰرِقَٰتِ فَرْقًا","قَسَمٌ بِالْمَلَائِكَةِ الَّتِي تَنْزِلُ بِمَا يَفْرِقُ بَيْنَ الْحَقِّ، وَالْبَاطِلِ."],[77,5,"فَٱلْمُلْقِيَٰتِ ذِكْرًا","قَسَمٌ بِالْمَلَائِكَةِ الَّتِي تُلْقِي الْوَحْيَ مِنَ اللهِ، وَتَنْزِلُ بِهِ عَلَى الْأَنْبِيَاءِ."],[77,6,"عُذْرًا","إِعْذَارًا مِنَ اللهِ إِلَى خَلْقِهِ."],[77,6,"نُذْرًا","لِلْإِنْذَارِ مِنَ اللهِ إِلَى خَلْقِهِ."],[77,7,"تُوعَدُونَ","مِنْ أَمْرِ الْقِيَامَةِ وَمَا فِيهَا مِنْ جَزَاءٍ، وَحِسَابٍ."],[77,8,"طُمِسَتْ","مُحِيَتْ، وَذَهَبَ نُورُهَا."],[77,9,"فُرِجَتْ","تَصَدَّعَتْ، وَتَشَقَّقَتْ."],[77,10,"نُسِفَتْ","تَطَايَرَتْ، وَتَنَاثَرَتْ."],[77,11,"أُقِّتَتْ","عُيِّنَ لَهُمْ وَقْتٌ وَأَجَلٌ، لِلْفَصْلِ بَيْنَهُمْ وَبَيْنَ أُمَمِهِمْ."],[77,12,"لِأَىِّ يَوْمٍ أُجِّلَتْ","لِأَيِّ يَوْمٍ عَظِيمٍ أُخِّرَتْ الرُّسُلُ."],[77,13,"لِيَوْمِ ٱلْفَصْلِ","لِيَوْمٍ يُفْصَلُ فِيهِ وَيُقْضَى بَيْنَ الْخَلَائِقِ."],[77,15,"وَيْلٌ","هَلَاكٌ عَظِيمٌ."],[77,20,"مَّآءٍ مَّهِينٍ","ضَعِيفٍ حَقِيرٍ؛ وَهُوَ النُّطْفَةُ."],[77,21,"قَرَارٍ مَّكِينٍ","مَكَانٍ حَصِينٍ مُتَمَكِّنٍ."],[77,22,"قَدَرٍ","وَقْتٍ."],[77,25,"كِفَاتًا","وِعَاءً تَضُمُّ الْأَحْيَاءَ وَالْأَمْوَاتَ."],[77,27,"رَوَٰسِىَ شَٰمِخَٰتٍ","جِبَالًا ثَوَابِتَ، مُرْتَفِعَاتٍ."],[77,27,"فُرَاتًا","عَذْبًا، سَائِغًا."],[77,30,"ظِلٍّ","هُوَ دُخَانُ جَهَنَّمَ."],[77,30,"ذِى ثَلَٰثِ شُعَبٍ","يَتَفَرَّعُ مِنْهُ ثَلَاثُ قِطَعٍ."],[77,31,"لَّا ظَلِيلٍ","لَا يُظِلُّ مِنْ حَرِّ ذَلِكَ الْيَوْمِ."],[77,31,"وَلَا يُغْنِى","لَا يَدْفَعُ، وَلَا يَقِي."],[77,32,"بِشَرَرٍ","الشَّرَارَةُ: مَا يَتَطَايَرُ مِنَ النَّارِ."],[77,32,"كَٱلْقَصْرِ","كَالْبِنَاءِ الْمُشَيَّدِ فِي الْعِظَمِ وَالِارْتِفَاعِ."],[77,33,"جِمَٰلَتٌ صُفْرٌ","كَأَنَّ الشَّرَرَ إِبِلٌ سُودٌ يَمِيلُ لَوْنُهَا إِلَى الصُّفْرَةِ."],[77,39,"كَيْدٌ","حِيلَةٌ فِي الْخَلَاصِ مِنَ الْعَذَابِ."],[77,41,"ظِلَٰلٍ","ظِلِّ الْأَشْجَارِ الْوَارِفَةِ."],[77,43,"هَنِيٓـًٔۢا","مُتَهَنِّينَ مِنْ غَيْرِ تَنْغِيصٍ، وَلَا كَدَرٍ."],[77,50,"حَدِيثٍۭ بَعْدَهُۥ","كِتَابٍ وَكَلَامٍ بَعْدَ الْقُرْآنِ."],[78,1,"عَمَّ","عَنْ أَيِّ شَيْءٍ؟"],[78,2,"ٱلنَّبَإِ ٱلْعَظِيمِ","الْخَبَرِ الْعَظِيمِ؛ وَهُوَ الْقُرْآنُ الَّذِي فِيهِ خَبَرُ الْبَعْثِ."],[78,6,"مِهَٰدًا","مُمَهَّدَةً كَالْفِرَاشِ."],[78,7,"أَوْتَادًا","تُثَبِّتُ الْأَرْضَ."],[78,8,"أَزْوَٰجًا","أَصْنَافًا: ذُكُورًا وَإِنَاثًا."],[78,9,"سُبَاتًا","رَاحَةً لِأَبْدَانِكُمْ، وَقَطْعًا لِأَعْمَالِكُمْ."],[78,10,"لِبَاسًا","سَاتِرًا لَكُمْ بِظُلْمَتِهِ؛ كَاللِّبَاسِ."],[78,11,"مَعَاشًا","تَحْصُلُونَ فِيهِ مَا تَعِيشُونَ بِهِ."],[78,13,"سِرَاجًا وَهَّاجًا","مِصْبَاحًا وَقَّادًا، مُضِيئًا."],[78,14,"ٱلْمُعْصِرَٰتِ","السُّحُبِ الْمُمْطِرَةِ."],[78,14,"ثَجَّاجًا","مُنْصَبًّا بِكَثْرَةٍ."],[78,16,"وَجَنَّٰتٍ أَلْفَافًا","بَسَاتِينَ مُلْتَفَّةً أَشْجَارُهَا."],[78,17,"مِيقَٰتًا","وَقْتًا، وَمِيعَادًا لِلْفَصْلِ بَيْنَ الْخَلْقِ."],[78,18,"ٱلصُّورِ","الْقَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ ﷺ."],[78,19,"أَبْوَٰبًا","ذَاتَ أَبْوَابٍ كَثِيرَةٍ؛ لِنُزُولِ الْمَلَائِكَةِ."],[78,20,"وَسُيِّرَتِ","نُسِفَتْ بَعْدَ ثُبُوتِهَا."],[78,20,"سَرَابًا","كَالسَّرَابِ الَّذِي لَا حَقِيقَةَ لَهُ."],[78,21,"مِرْصَادًا","تَرْصُدُ أَهْلَهَا، وَتَرْقُبُهُمْ."],[78,23,"أَحْقَابًا","دُهُورًا لَا تَنْقَطِعُ."],[78,24,"بَرْدًا","مَا يُبَرِّدُ حَرَّ النَّارِ عَلَى أَجْسَادِهِمْ."],[78,25,"حَمِيمًا","مَاءً حَارًّا بَالِغًا نِهَايَةَ الْحَرَارَةِ."],[78,25,"وَغَسَّاقًا","صَدِيدَ أَهْلِ النَّارِ."],[78,26,"وِفَاقًا","عَادِلًا، مُوَافِقًا لِأَعْمَالِهِمْ."],[78,27,"لَا يَرْجُونَ","لَا يَخَافُونَ."],[78,29,"أَحْصَيْنَٰهُ","حَفِظْنَاهُ، وَضَبَطْنَاهُ مَكْتُوبًا فِي اللَّوْحِ الْمَحْفُوظِ."],[78,31,"مَفَازًا","فَوْزًا بِدُخُولِهِمُ الْجَنَّةَ، أَوْ مَكَانًا يَفُوزُونَ بِهِ؛ وَهُوَ الْجَنَّةُ."],[78,32,"حَدَآئِقَ","بَسَاتِينَ عَظِيمَةً قَدْ أُحْدِقَتْ بِهَا الْأَشْجَارُ."],[78,33,"وَكَوَاعِبَ","حَدِيثَاتِ السِّنِّ، نَوَاهِدَ."],[78,33,"أَتْرَابًا","مُسْتَوِيَاتٍ فِي سِنٍّ وَاحِدَةٍ."],[78,34,"دِهَاقًا","مَمْلُوءَةً خَمْرًا."],[78,35,"لَغْوًا","بَاطِلًا مِنَ الْقَوْلِ."],[78,36,"حِسَابًا","كَثِيرًا، كَافِيًا لَهُمْ."],[78,37,"خِطَابًا","كَلَامًا، وَسُؤَالًا إِلَّا بِإِذْنِهِ."],[78,38,"ٱلرُّوحُ","جِبْرِيلُ ﷺ."],[78,38,"صَفًّا","مُصْطَفِّينَ."],[78,38,"لَّا يَتَكَلَّمُونَ","لَا يَشْفَعُونَ."],[78,38,"صَوَابًا","حَقًّا، وَسَدَادًا."],[78,39,"ٱلْحَقُّ","الَّذِي لَا رَيْبَ فِي وُقُوعِهِ."],[78,39,"مَـَٔابًا","مَرْجِعًا بِالْعَمَلِ الصَّالِحِ."],[79,1,"وَٱلنَّٰزِعَٰتِ","قَسَمٌ بِالْمَلَائِكَةِ تَنْزِعُ أَرْوَاحَ الْكُفَّارِ."],[79,1,"غَرْقًا","نَزْعًا شَدِيدًا."],[79,2,"وَٱلنَّٰشِطَٰتِ","قَسَمٌ بِالْمَلَائِكَةِ تَسُلُّ أَرْوَاحَ الْمُؤْمِنِينَ بِرِفْقٍ."],[79,3,"وَٱلسَّٰبِحَٰتِ","قَسَمٌ بِالْمَلَائِكَةِ الَّتِي تَسْبَحُ فِي نُزُولِهَا مِنَ السَّمَاءِ، وَصُعُودِهَا إِلَيْهَا."],[79,4,"فَٱلسَّٰبِقَٰتِ","قَسَمٌ بِالْمَلَائِكَةِ الَّتِي تَسْبِقُ الشَّيَاطِينَ بِالْوَحْيِ إِلَى الْأَنْبِيَاءِ؛ لِئَلَّا تَسْتَرِقَهُ."],[79,5,"فَٱلْمُدَبِّرَٰتِ أَمْرًا","قَسَمٌ بِالْمَلَائِكَةِ الْمُنَفِّذَاتِ أَمْرَ اللهِ، وَجَوَابُ الْقَسَمِ مَحْذُوفٌ، وَتَقْدِيرُهُ: لَتُبْعَثُنَّ."],[79,6,"تَرْجُفُ ٱلرَّاجِفَةُ","تَضْطَرِبُ الْأَرْضُ بِالنَّفْخَةِ الْأُولَى: نَفْخَةِ الصَّعْقِ."],[79,7,"تَتْبَعُهَا ٱلرَّادِفَةُ","تَلِيهَا نَفْخَةٌ أُخْرَى لِلْبَعْثِ."],[79,8,"وَاجِفَةٌ","خَائِفَةٌ، مُضْطَرِبَةٌ."],[79,9,"خَٰشِعَةٌ","ذَلِيلَةٌ مِنْ هَوْلِ مَا تُشَاهِدُ."],[79,10,"ٱلْحَافِرَةِ","الْحَالَةِ الَّتِي كُنَّا عَلَيْهَا فِي الْأَرْضِ."],[79,11,"نَّخِرَةً","بَالِيَةً."],[79,12,"كَرَّةٌ خَاسِرَةٌ","رَجْعَةٌ خَائِبَةٌ ذَاتُ خُسْرَانٍ."],[79,13,"زَجْرَةٌ","نَفْخَةٌ."],[79,14,"بِٱلسَّاهِرَةِ","بِوَجْهِ الْأَرْضِ أَحْيَاءً بَعْدَ أَنْ كَانُوا فِي بَطْنِهَا."],[79,16,"ٱلْمُقَدَّسِ","الْمُطَهَّرِ."],[79,16,"طُوًى","اسْمُ الْوَادِي."],[79,18,"تَزَكَّىٰ","تَتَطَهَّرَ مِنَ الْكُفْرِ، وَتَتَحَلَّى بِالْإِيمَانِ."],[79,19,"وَأَهْدِيَكَ","أُرْشِدَكَ."],[79,20,"ٱلْـَٔايَةَ ٱلْكُبْرَىٰ","مُعْجِزَةَ الْعَصَا، وَالْيَدِ الْبَيْضَاءِ."],[79,22,"يَسْعَىٰ","يَجْتَهِدُ فِي مُعَارَضَةِ مُوسَى ﷺ."],[79,23,"فَحَشَرَ","جَمَعَ أَهْلَ مَمْلَكَتِهِ."],[79,25,"نَكَالَ","عُقُوبَةَ."],[79,28,"رَفَعَ سَمْكَهَا","أَعْلَى سَقْفَهَا."],[79,29,"وَأَغْطَشَ لَيْلَهَا","أَظْلَمَ لَيْلَهَا بِغُرُوبِ شَمْسِهَا."],[79,29,"وَأَخْرَجَ ضُحَىٰهَا","أَبْرَزَ نَهَارَهَا بِشُرُوقِ شَمْسِهَا."],[79,30,"دَحَىٰهَآ","بَسَطَهَا، وَأَوْدَعَ فِيهَا مَنَافِعَهَا."],[79,31,"وَمَرْعَىٰهَا","مَا يُرْعَى مِنَ النَّبَاتِ."],[79,32,"أَرْسَىٰهَا","أَثْبَتَهَا عَلَى الْأَرْضِ؛ كَالْأَوْتَادِ."],[79,34,"ٱلطَّآمَّةُ","الْقِيَامَةُ، وَهِيَ النَّفْخَةُ الثَّانِيَةُ."],[79,36,"وَبُرِّزَتِ","أُظْهِرَتْ إِظْهَارًا بَيِّنًا."],[79,39,"ٱلْمَأْوَىٰ","الْمَصِيرُ."],[79,40,"مَقَامَ رَبِّهِۦ","الْقِيَامَ بَيْنَ يَدَيْ رَبِّهِ لِلْحِسَابِ."],[79,42,"أَيَّانَ مُرْسَىٰهَا","مَتَى وَقْتُ حُلُولِهَا؟"],[79,43,"فِيمَ أَنتَ مِن ذِكْرَىٰهَآ","لَيْسَ عِنْدَكَ عِلْمُهَا؛ حَتَّى تَذْكُرَهَا."],[79,46,"عَشِيَّةً","مَا بَيْنَ الظُّهْرِ إِلَى غُرُوبِ الشَّمْسِ."],[79,46,"ضُحَىٰهَا","مَا بَيْنَ طُلُوعِ الشَّمْسِ إِلَى نِصْفِ النَّهَارِ."],[80,1,"عَبَسَ","قَطَّبَ وَجْهَهُ، وَظَهَرَ أَثَرُ التَّغَيُّرِ عَلَيْهِ."],[80,1,"وَتَوَلَّىٰٓ","أَعْرَضَ."],[80,2,"أَن جَآءَهُ ٱلْأَعْمَىٰ","لِأَجْلِ مَجِيءِ عَبْدِ اللهِ بْنِ أُمِّ مَكْتُومٍ ﵁."],[80,3,"يَزَّكَّىٰٓ","يَتَطَهَّرُ مِنْ ذُنُوبِهِ."],[80,6,"تَصَدَّىٰ","تَتَعَرَّضُ لَهُ."],[80,10,"تَلَهَّىٰ","تَتَشَاغَلُ."],[80,11,"كَلَّآ","لَيْسَ الْأَمْرُ كَمَا فَعَلْتَ."],[80,15,"سَفَرَةٍ","مَلَائِكَةٍ كَتَبَةٍ يَقُومُونَ بِالسِّفَارَةِ بَيْنَ اللهِ وَخَلْقِهِ."],[80,16,"بَرَرَةٍ","مُطِيعِينَ للهِ لَا يَعْصُونَهُ."],[80,17,"قُتِلَ ٱلْإِنسَٰنُ","لُعِنَ الْكَافِرُ، وَعُذِّبَ."],[80,17,"مَآ أَكْفَرَهُۥ","مَا أَشَدَّ كُفْرَهُ!"],[80,19,"نُّطْفَةٍ","مَاءٍ قَلِيلٍ مَهِينٍ؛ وَهُوَ الْمَنِيُّ."],[80,19,"فَقَدَّرَهُۥ","خَلَقَهُ أَطْوَارًا."],[80,20,"ٱلسَّبِيلَ يَسَّرَهُۥ","سَهَّلَ لَهُ طَرِيقَ خُرُوجِهِ مِنْ بَطْنِ أُمِّهِ، وَبَيَّنَ لَهُ طَرِيقَ الْخَيْرِ وَالشَّرِّ."],[80,21,"فَأَقْبَرَهُۥ","جَعَلَ لَهُ مَكَانًا يُقْبَرُ فِيهِ."],[80,22,"أَنشَرَهُۥ","أَحْيَاهُ."],[80,23,"لَمَّا يَقْضِ مَآ أَمَرَهُۥ","لَمْ يُؤَدِّ الْكَافِرُ مَا أَمَرَهُ اللهُ بِهِ مِنَ الْإِيمَانِ وَالطَّاعَةِ."],[80,28,"وَقَضْبًا","عَلَفًا لِلدَّوَابِّ."],[80,30,"غُلْبًا","عَظِيمَةَ الْأَشْجَارِ."],[80,31,"وَأَبًّا","كَلَأً لِلْبَهَائِمِ."],[80,33,"ٱلصَّآخَّةُ","صَيْحَةُ يَوْمِ الْقِيَامَةِ الَّتِي تَصُمُّ الْآذَانَ مِنْ هَوْلِهَا."],[80,37,"يُغْنِيهِ","يَشْغَلُهُ."],[80,38,"مُّسْفِرَةٌ","مُسْتَنِيرَةٌ."],[80,39,"مُّسْتَبْشِرَةٌ","فَرِحَةٌ."],[80,40,"غَبَرَةٌ","غُبَارٌ، وَكُدُورَةٌ."],[80,41,"تَرْهَقُهَا","تَغْشَاهَا."],[80,41,"قَتَرَةٌ","ذِلَّةٌ، وَظُلْمَةٌ."],[80,42,"ٱلْكَفَرَةُ","الْجَاحِدُونَ بِقُلُوبِهِمْ."],[80,42,"ٱلْفَجَرَةُ","الْعُصَاةُ بِأَعْمَالِهِمْ."],[81,1,"كُوِّرَتْ","لُفَّتْ، وَذَهَبَ ضَوْؤُهَا."],[81,2,"ٱنكَدَرَتْ","تَنَاثَرَتْ، وَذَهَبَ نُورُهَا."],[81,3,"سُيِّرَتْ","أُزِيلَتْ عَنْ وَجْهِ الْأَرْضِ؛ فَصَارَتْ هَبَاءً مَنْثُورًا."],[81,4,"ٱلْعِشَارُ","النُّوقُ الْحَوَامِلُ."],[81,4,"عُطِّلَتْ","أُهْمِلَتْ، وَتُرِكَتْ."],[81,5,"حُشِرَتْ","جُمِعَتْ، وَاخْتَلَطَتْ؛ لِيُقْتَصَّ لِبَعْضِهَا مِنْ بَعْضٍ."],[81,6,"سُجِّرَتْ","مُلِئَتْ حَتَّى فَاضَتْ، فَانْفَجَرَتْ، ثُمَّ اتَّقَدَتْ نِيرَانًا."],[81,7,"زُوِّجَتْ","قُرِنَتْ بِأَمْثَالِهَا وَنَظَائِرِهَا."],[81,8,"ٱلْمَوْءُۥدَةُ","الطِّفْلَةُ الْمَدْفُونَةُ حَيَّةً."],[81,10,"ٱلصُّحُفُ","صُحُفُ الْأَعْمَالِ."],[81,10,"نُشِرَتْ","فُتِحَتْ، وَبُسِطَتْ."],[81,11,"كُشِطَتْ","قُلِعَتْ، وَأُزِيلَتْ."],[81,12,"سُعِّرَتْ","أُوقِدَتْ، فَأُضْرِمَتْ."],[81,13,"أُزْلِفَتْ","قُرِّبَتْ مِنْ أَهْلِهَا."],[81,14,"أَحْضَرَتْ","قَدَّمَتْ مِنْ خَيْرٍ أَوْ شَرٍّ."],[81,15,"فَلَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): لِتَأْكِيدِ الْقَسَمِ."],[81,15,"بِٱلْخُنَّسِ","النُّجُومِ الْمُخْتَفِيَةِ أَنْوَارُهَا نَهَارًا."],[81,16,"ٱلْجَوَارِ","النُّجُومِ الْجَارِيَةِ فِي أَفْلَاكِهَا."],[81,16,"ٱلْكُنَّسِ","النُّجُومِ الْمُسْتَتِرَةِ فِي أَبْرَاجِهَا."],[81,17,"عَسْعَسَ","أَقْبَلَ بِظَلَامِهِ، وَأَدْبَرَ."],[81,18,"تَنَفَّسَ","ظَهَرَ ضِيَاؤُهُ، وَامْتَدَّ."],[81,19,"رَسُولٍ كَرِيمٍ","هُوَ: جِبْرِيلُ ﷺ."],[81,20,"مَكِينٍ","ذِي مَكَانَةٍ رَفِيعَةٍ عِنْدَ اللهِ."],[81,21,"ثَمَّ","هُنَاكَ فِي السَّمَوَاتِ."],[81,23,"رَءَاهُ بِٱلْأُفُقِ","رَأَى نَبِيُّنَا مُحَمَّدٌ ﷺ جِبْرِيلَ فِي الْأُفُقِ عَلَى صُورَتِهِ الَّتِي خُلِقَ عَلَيْهَا."],[81,24,"بِضَنِينٍ","بِبَخِيلٍ فِي تَبْلِيغِ الْوَحْيِ، وَفِي قِرَاءَةٍ: (بِظَنِينٍ)، أَيْ: مُتَّهَمٍ عَلَى الْوَحْيِ."],[81,25,"رَّجِيمٍ","مَرْجُومٍ، مَطْرُودٍ مِنْ رَحْمَةِ اللهِ."],[81,27,"إِنْ هُوَ","مَا هُوَ."],[81,27,"لِّلْعَٰلَمِينَ","الْإِنْسِ، وَالْجِنِّ."],[81,29,"رَبُّ ٱلْعَٰلَمِينَ","رَبُّ الْخَلَائِقِ أَجْمَعِينَ."],[82,1,"ٱنفَطَرَتْ","انْشَقَّتْ."],[82,2,"ٱنتَثَرَتْ","تَسَاقَطَتْ."],[82,3,"فُجِّرَتْ","امْتَلَأَتْ، وَفَاضَتْ، فَانْفَجَرَتْ، وَسَالَتْ مِيَاهُهَا."],[82,4,"بُعْثِرَتْ","قُلِبَتْ بِبَعْثِ مَنْ كَانَ مَقْبُورًا فِيهَا."],[82,6,"مَا غَرَّكَ بِرَبِّكَ","مَا خَدَعَكَ، وَجَرَّأَكَ عَلَى الْكُفْرِ بِهِ، وَعِصْيَانِهِ؟"],[82,7,"فَسَوَّىٰكَ","جَعَلَكَ مُسْتَوِيَ الْخِلْقَةِ سَالِمَ الْأَعْضَاءِ."],[82,7,"فَعَدَلَكَ","جَعَلَكَ مُعْتَدِلَ الْخَلْقِ مُتَنَاسِبَ الْأَعْضَاءِ."],[82,9,"بِٱلدِّينِ","يَوْمِ الْجَزَاءِ، وَالْحِسَابِ."],[82,10,"لَحَٰفِظِينَ","لَمَلَائِكَةً رُقَبَاءَ يَكْتُبُونَ أَعْمَالَكُمْ."],[82,16,"بِغَآئِبِينَ","فَلَا يَخْرُجُونَ مِنْ جَهَنَّمَ، وَلَا يَمُوتُونَ."],[83,1,"وَيْلٌ","عَذَابٌ شَدِيدٌ."],[83,1,"لِّلْمُطَفِّفِينَ","الَّذِينَ يَبْخَسُونَ الْمِكْيَالَ، وَالْمِيزَانَ."],[83,3,"يُخْسِرُونَ","يَنْقُصُونَ فِي الْمِكْيَالِ، وَالْمِيزَانِ."],[83,4,"يَظُنُّ","يَعْتَقِدُ."],[83,7,"كِتَٰبَ ٱلْفُجَّارِ","كِتَابُ أَعْمَالِهِمْ، أَوْ مَصِيرُهُمْ."],[83,7,"سِجِّينٍ","سِجْنٍ، وَضِيقٍ."],[83,9,"مَّرْقُومٌ","مَكْتُوبٌ كَالرَّقْمِ فِي الثَّوْبِ لَا يُمْحَى."],[83,12,"مُعْتَدٍ","ظَالِمٍ مُتَجَاوِزٍ لِلْحَدِّ."],[83,12,"أَثِيمٍ","كَثِيرِ الْإِثْمِ."],[83,13,"أَسَٰطِيرُ","أَبَاطِيلُ."],[83,14,"رَانَ","غَطَّى."],[83,15,"لَّمَحْجُوبُونَ","مَحْرُومُونَ مِنْ رُؤْيَةِ رَبِّهِمْ."],[83,16,"لَصَالُوا۟ ٱلْجَحِيمِ","لَدَاخِلُو النَّارِ يُقَاسُونَ حَرَّهَا."],[83,18,"لَفِى عِلِّيِّينَ","لَفِي مَرْتَبَةٍ، وَمَكَانٍ عَالٍ."],[83,23,"ٱلْأَرَآئِكِ","الْأَسِرَّةِ الْمُزَيَّنَةِ بِالسُّتُورِ، وَالثِّيَابِ."],[83,24,"نَضْرَةَ","بَهْجَةَ."],[83,25,"رَّحِيقٍ","خَمْرٍ صَافِيَةٍ."],[83,26,"خِتَٰمُهُۥ مِسْكٌ","آخِرُهُ رَائِحَةُ الْمِسْكِ."],[83,27,"وَمِزَاجُهُۥ","خَلْطُهُ."],[83,27,"تَسْنِيمٍ","عَيْنٌ فِي أَعْلَى الْجَنَّةِ."],[83,28,"يَشْرَبُ بِهَا","يَشْرَبُونَ مُتَلَذِّذِينَ بِهَا."],[83,30,"يَتَغَامَزُونَ","يَغْمِزُ بَعْضُهُمْ بَعْضًا بِأَعْيُنِهِمُ اسْتِهْزَاءً."],[83,31,"ٱنقَلَبُوٓا۟","رَجَعُوا."],[83,31,"فَكِهِينَ","مُتَلَذِّذِينَ بِسُخْرِيَتِهِمْ مِنَ الْمُؤْمِنِينَ."],[83,33,"حَٰفِظِينَ","رُقَبَاءَ يُحْصُونَ أَعْمَالَهُمْ."],[83,36,"ثُوِّبَ","جُوزِيَ."],[84,1,"ٱنشَقَّتْ","تَصَدَّعَتْ، وَتَفَطَّرَتْ بِالْغَمَامِ يَوْمَ الْقِيَامَةِ."],[84,2,"وَأَذِنَتْ لِرَبِّهَا","أَطَاعَتْ أَمْرَ رَبِّهَا."],[84,2,"وَحُقَّتْ","وَحُقَّ لَهَا أَنْ تُطِيعَ."],[84,3,"مُدَّتْ","بُسِطَتْ، وَوُسِّعَتْ، وَدُكَّتْ جِبَالُهَا."],[84,4,"وَأَلْقَتْ","قَذَفَتْ مَا فِي بَطْنِهَا مِنَ الْأَمْوَاتِ."],[84,6,"كَادِحٌ إِلَىٰ رَبِّكَ","سَاعٍ إِلَى اللهِ، وَعَامِلٌ بِالْخَيْرِ أَوِ الشَّرِّ."],[84,7,"كِتَٰبَهُۥ","صَحِيفَةَ عَمَلِهِ."],[84,11,"يَدْعُوا۟ ثُبُورًا","يَدْعُو بِالْهَلَاكِ قَائِلًا: وَاثُبُورَاهْ!"],[84,12,"وَيَصْلَىٰ سَعِيرًا","يَدْخُلُ النَّارَ يُقَاسِي حَرَّهَا."],[84,14,"لَّن يَحُورَ","لَنْ يَرْجِعَ إِلَى اللهِ لِيُحَاسِبَهُ."],[84,16,"فَلَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): لِتَأْكِيدِ الْقَسَمِ."],[84,16,"بِٱلشَّفَقِ","بِاحْمِرَارِ الْأُفُقِ عِنْدَ الْغُرُوبِ."],[84,17,"وَسَقَ","جَمَعَ."],[84,18,"ٱتَّسَقَ","تَكَامَلَ نُورُهُ، وَأَبْدَرَ."],[84,19,"طَبَقًا عَن طَبَقٍ","أَطْوَارًا مُتَعَدِّدَةً، وَأَحْوَالًا مُتَبَايِنَةً: نُطْفَةً، ثُمَّ عَلَقَةً، وَهَكَذَا."],[84,23,"يُوعُونَ","يَكْتُمُونَ فِي صُدُورِهِمْ مِنَ الْعِنَادِ، وَالتَّكْذِيبِ."],[84,25,"غَيْرُ مَمْنُونٍ","غَيْرُ مَقْطُوعٍ، وَلَا مَنْقُوصٍ."],[85,1,"ذَاتِ ٱلْبُرُوجِ","ذَاتِ الْمَنَازِلِ الَّتِي تَمُرُّ بِهَا الشَّمْسُ، وَالْقَمَرُ."],[85,2,"وَٱلْيَوْمِ ٱلْمَوْعُودِ","هُوَ: يَوْمُ الْقِيَامَةِ."],[85,3,"وَشَاهِدٍ وَمَشْهُودٍ","أَقْسَمَ اللهُ بِكُلِّ شَاهِدٍ يَشْهَدُ، وَبِكُلِّ مَا يُشْهَدُ عَلَيْهِ."],[85,4,"قُتِلَ","لُعِنَ، وَعُذِّبَ، وَهَلَكَ."],[85,4,"أَصْحَٰبُ ٱلْأُخْدُودِ","الَّذِينَ شَقُّوا فِي الْأَرْضِ شَقًّا عَظِيمًا؛ لِإِحْرَاقِ الْمُؤْمِنِينَ."],[85,5,"ٱلْوَقُودِ","مَا تُشْعَلُ وَتُوقَدُ بِهِ النَّارُ."],[85,7,"شُهُودٌ","حُضُورٌ."],[85,10,"فَتَنُوا۟","حَرَّقُوا بِالنَّارِ."],[85,10,"عَذَابُ ٱلْحَرِيقِ","الْعَذَابُ الْمُحْرِقُ."],[85,12,"بَطْشَ","انْتِقَامَ."],[85,13,"يُبْدِئُ","يَخْلُقُ الْخَلْقَ ابْتِدَاءً."],[85,13,"وَيُعِيدُ","يُحْيِيهِمْ بَعْدَ مَوْتِهِمْ."],[85,14,"ٱلْوَدُودُ","الْمُحِبُّ لِأَوْلِيَائِهِ، الْمَحْبُوبُ لَهُمْ."],[85,15,"ٱلْمَجِيدُ","الْعَظِيمُ."],[86,1,"وَٱلطَّارِقِ","النَّجْمِ الَّذِي يَطْلُعُ لَيْلًا."],[86,3,"ٱلثَّاقِبُ","الْمُضِيءُ الْمُتَوَهِّجُ."],[86,4,"إِن كُلُّ نَفْسٍ لَّمَّا","مَا كُلُّ نَفْسٍ إِلَّا."],[86,4,"حَافِظٌ","مَلَكٌ يَحْفَظُ أَعْمَالَهَا."],[86,6,"دَافِقٍ","مُنْصَبٍّ بِسُرْعَةٍ فِي الرَّحِمِ."],[86,7,"ٱلصُّلْبِ","الظَّهْرِ."],[86,7,"وَٱلتَّرَآئِبِ","عِظَامِ الصَّدْرِ."],[86,8,"رَجْعِهِۦ","رَدِّهِ حَيًّا بَعْدَ الْمَوْتِ."],[86,9,"تُبْلَى ٱلسَّرَآئِرُ","تُخْتَبَرُ، وَتُكْشَفُ ضَمَائِرُ الْقُلُوبِ."],[86,11,"ذَاتِ ٱلرَّجْعِ","صَاحِبَةِ الْمَطَرِ الْمُتَكَرِّرِ."],[86,12,"ذَاتِ ٱلصَّدْعِ","ذَاتِ التَّشَقُّقِ بِالنَّبَاتِ."],[86,13,"فَصْلٌ","فَاصِلٌ بَيْنَ الْحَقِّ، وَالْبَاطِلِ."],[86,17,"رُوَيْدًۢا","قَلِيلًا."],[87,1,"سَبِّحِ ٱسْمَ رَبِّكَ","نَزِّهْ رَبَّكَ ذَاكِرًا اسْمَهُ بِلِسَانِكَ."],[87,1,"ٱلْأَعْلَى","الَّذِي لَهُ عُلُوُّ الذَّاتِ، وَعُلُوُّ الْقَدْرِ، وَعُلُوُّ الْقَهْرِ."],[87,2,"فَسَوَّىٰ","أَتْقَنَ خَلْقَهُ، وَأَحْسَنَهُ."],[87,3,"فَهَدَىٰ","يَسَّرَ لَهُ مَا يُنَاسِبُهُ."],[87,4,"ٱلْمَرْعَىٰ","الْكَلَأَ الْأَخْضَرَ."],[87,5,"غُثَآءً","هَشِيمًا جَافًّا."],[87,5,"أَحْوَىٰ","مُتَغَيِّرًا."],[87,7,"إِلَّا مَا شَآءَ ٱللَّهُ","إِلَّا مَا أَرَادَ اللهُ أَنْ يَنْسَخَ تِلَاوَتَهُ وَحُكْمَهُ، وَيُنْسِيَكَ إِيَّاهُ."],[87,8,"لِلْيُسْرَىٰ","لِلطَّرِيقَةِ الْمُيَسَّرَةِ فِي شَرِيعَتِكَ، وَحَيَاتِكَ."],[87,12,"يَصْلَى ٱلنَّارَ","يَدْخُلُهَا، وَيُقَاسِي حَرَّهَا."],[87,14,"أَفْلَحَ","فَازَ، وَظَفِرَ بِالْمَطْلُوبِ."],[87,14,"تَزَكَّىٰ","طَهَّرَ نَفْسَهُ مِنَ الْمَعَاصِي، وَحَلَّاهَا بِالطَّاعَةِ."],[87,18,"إِنَّ هَٰذَا","أَيْ: مِنْ قَوْلِهِ: «قَدْ أَفْلَحَ مَنْ تَزَكَّى...»."],[88,1,"ٱلْغَٰشِيَةِ","الْقِيَامَةِ تَغْشَى النَّاسَ بِأَهْوَالِهَا."],[88,2,"خَٰشِعَةٌ","ذَلِيلَةٌ مُنْكَسِرَةٌ."],[88,3,"عَامِلَةٌ نَّاصِبَةٌ","مُجْهَدَةٌ بِالْعَمَلِ وَالتَّعَبِ فِي النَّارِ."],[88,4,"تَصْلَىٰ نَارًا","تَدْخُلُ نَارًا، وَتُقَاسِي حَرَّهَا."],[88,4,"حَامِيَةً","شَدِيدَةَ التَّوَهُّجِ."],[88,5,"ءَانِيَةٍ","شَدِيدَةِ الْحَرَارَةِ."],[88,6,"ضَرِيعٍ","نَبْتٍ خَبِيثٍ ذِي شَوْكٍ، لَا تَرْعَاهُ الدَّوَابُّ."],[88,9,"لِّسَعْيِهَا","لِعَمَلِهَا بِالطَّاعَةِ فِي الدُّنْيَا."],[88,11,"لَٰغِيَةً","لَا كَلِمَةً لَغْوٍ وَاحِدَةً، وَلَا نَفْسًا تَلْغُو وَتَهْذِي."],[88,12,"جَارِيَةٌ","مُتَدَفِّقَةٌ بِالْمَاءِ."],[88,14,"مَّوْضُوعَةٌ","مُعَدَّةٌ لِلشَّارِبِينَ."],[88,15,"وَنَمَارِقُ","وَسَائِدُ."],[88,16,"وَزَرَابِىُّ مَبْثُوثَةٌ","بُسُطٌ كَثِيرَةٌ مَفْرُوشَةٌ."],[88,20,"سُطِحَتْ","بُسِطَتْ، وَمُهِّدَتْ."],[88,22,"بِمُصَيْطِرٍ","بِمُسَلِّطٍ تُكْرِهُهُمْ عَلَى الْإِيمَانِ."],[88,25,"إِيَابَهُمْ","مَرْجِعَهُمْ بَعْدَ الْمَوْتِ."],[89,1,"وَٱلْفَجْرِ","قَسَمٌ بِالْوَقْتِ الْمَعْرُوفِ أَوَّلَ النَّهَارِ."],[89,2,"وَلَيَالٍ عَشْرٍ","قَسَمٌ بِلَيَالِي عَشْرِ ذِي الْحِجَّةِ الْأَوَّلِ، وَمَا شَرُفَتْ بِهِ مِنْ أَعْمَالٍ."],[89,3,"وَٱلشَّفْعِ وَٱلْوَتْرِ","قَسَمٌ بِكُلِّ زَوْجٍ، وَفَرْدٍ."],[89,4,"يَسْرِ","يَسْرِي بِظَلَامِهِ، وَجَوَابُ الْقَسَمِ مَحْذُوفٌ، تَقْدِيرُهُ: لَتُبْعَثُنَّ."],[89,5,"لِّذِى حِجْرٍ","لِصَاحِبِ عَقْلٍ."],[89,7,"إِرَمَ","قَبِيلَةُ إِرَمَ؛ نِسْبَةً إِلَى جَدِّهِمْ."],[89,7,"ذَاتِ ٱلْعِمَادِ","صَاحِبَةِ الْقُوَّةِ، وَالْأَبْنِيَةِ الْمَرْفُوعَةِ عَلَى الْأَعْمِدَةِ."],[89,9,"جَابُوا۟","قَطَعُوا."],[89,9,"بِٱلْوَادِ","وَادِي الْقُرَى شَمَالَ غَرْبِ الْجَزِيرَةِ الْعَرَبِيَّةِ."],[89,10,"ذِى ٱلْأَوْتَادِ","صَاحِبِ الْجُنُودِ الَّذِينَ ثَبَّتُوا مُلْكَهُ."],[89,11,"طَغَوْا۟","تَجَاوَزُوا الْحَدَّ فِي الْإِفْسَادِ."],[89,13,"سَوْطَ عَذَابٍ","عَذَابًا شَدِيدًا."],[89,14,"لَبِٱلْمِرْصَادِ","يَرْقُبُ الْعَاصِينَ، وَيُمْهِلُهُمْ، ثُمَّ يَأْخُذُهُمْ."],[89,15,"ٱبْتَلَىٰهُ","اخْتَبَرَهُ بِالنِّعْمَةِ."],[89,16,"فَقَدَرَ","ضَيَّقَ."],[89,17,"ٱلْيَتِيمَ","الَّذِي مَاتَ أَبُوهُ قَبْلَ بُلُوغِهِ."],[89,18,"وَلَا تَحَٰٓضُّونَ","لَا يَحُثُّ بَعْضُكُمْ بَعْضًا."],[89,19,"ٱلتُّرَاثَ","الْمِيرَاثَ."],[89,19,"لَّمًّا","شَدِيدًا."],[89,20,"جَمًّا","مُفْرِطًا."],[89,21,"دُكَّتِ","زُلْزِلَتْ."],[89,22,"وَجَآءَ رَبُّكَ","جَاءَ رَبُّكَ لِفَصْلِ الْقَضَاءِ بَيْنَ الْعِبَادِ مَجِيئًا يَلِيقُ بِجَلَالِهِ."],[89,22,"وَٱلْمَلَكُ","الْمَلَائِكَةُ."],[89,22,"صَفًّا صَفًّا","صُفُوفًا كَثِيرَةً."],[89,23,"وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","لَا يَنْفَعُهُ التَّذَكُّرُ؛ فَقَدْ فَاتَ أَوَانُهُ."],[89,26,"يُوثِقُ","لَا يَشُدُّ بِالسَّلَاسِلِ، وَالْأَغْلَالِ."],[89,26,"وَثَاقَهُۥٓ","مِثْلَ إِيثَاقِهِ."],[90,1,"لَآ أُقْسِمُ","أُقْسِمُ، وَ(لَا): لِتَأْكِيدِ الْقَسَمِ."],[90,1,"ٱلْبَلَدِ","مَكَّةَ."],[90,2,"حِلٌّۢ","يَحِلُّ لَكَ مَا تَصْنَعُ بِهِ مِنَ الْمُقَاتَلَةِ، وَقَدْ أَنْجَزَ اللهُ لَهُ هَذَا الْوَعْدَ فِي فَتْحِ مَكَّةَ."],[90,3,"وَوَالِدٍ وَمَا وَلَدَ","قَسَمٌ بِكُلِّ وَالِدٍ، وَبِكُلِّ مَوْلُودٍ، وَمِنْهُمْ آدَمُ ﷺ وَذُرِّيَّتُهُ."],[90,4,"كَبَدٍ","شِدَّةٍ وَعَنَاءٍ مِنْ مُكَابَدَةِ الدُّنْيَا."],[90,5,"أَيَحْسَبُ","أَيَظُنُّ؟"],[90,6,"لُّبَدًا","كَثِيرًا."],[90,10,"وَهَدَيْنَٰهُ","بَيَّنَّا لَهُ."],[90,10,"ٱلنَّجْدَيْنِ","طَرِيقَيِ الْخَيْرِ وَالشَّرِّ."],[90,11,"فَلَا ٱقْتَحَمَ","فَهَلَّا تَجَاوَزَ."],[90,11,"ٱلْعَقَبَةَ","مَشَقَّةَ الْآخِرَةِ؛ بِإِنْفَاقِ الْمَالِ، وَالْعَمَلِ الصَّالِحِ."],[90,13,"فَكُّ رَقَبَةٍ","إِعْتَاقُهَا مِنَ الرِّقِّ."],[90,14,"مَسْغَبَةٍ","مَجَاعَةٍ شَدِيدَةٍ."],[90,15,"ذَا مَقْرَبَةٍ","ذَا قَرَابَةٍ."],[90,16,"ذَا مَتْرَبَةٍ","مُعْدِمًا لَا شَيْءَ عِنْدَهُ."],[90,18,"ٱلْمَيْمَنَةِ","الْيَمِينِ؛ بِأَنْ يُؤْخَذَ بِهِمْ ذَاتَ الْيَمِينِ إِلَى الْجَنَّةِ."],[90,19,"ٱلْمَشْـَٔمَةِ","الشِّمَالِ؛ بِأَنْ يُؤْخَذَ بِهِمْ ذَاتَ الشِّمَالِ إِلَى النَّارِ."],[90,20,"مُّؤْصَدَةٌۢ","مُطْبَقَةٌ مُغْلَقَةٌ."],[91,1,"وَضُحَىٰهَا","قَسَمٌ بِإِشْرَاقِ الشَّمْسِ ضُحًى."],[91,2,"تَلَىٰهَا","تَبِعَ الشَّمْسَ فِي الطُّلُوعِ وَالْأُفُولِ."],[91,3,"جَلَّىٰهَا","كَشَفَ ظُلْمَةَ اللَّيْلِ وَأَزَالَهَا."],[91,4,"يَغْشَىٰهَا","يُغَطِّي الْأَرْضَ بِظُلْمَتِهِ."],[91,6,"طَحَىٰهَا","بَسَطَهَا."],[91,7,"سَوَّىٰهَا","أَكْمَلَ خَلْقَهَا؛ لِأَدَاءِ مُهِمَّتِهَا."],[91,8,"فَأَلْهَمَهَا","بَيَّنَ لَهَا."],[91,8,"فُجُورَهَا وَتَقْوَىٰهَا","طَرِيقَ الْخَيْرِ، وَطَرِيقَ الشَّرِّ."],[91,9,"زَكَّىٰهَا","طَهَّرَهَا وَنَمَّاهَا بِالطَّاعَةِ."],[91,10,"خَابَ","خَسِرَ."],[91,10,"دَسَّىٰهَا","أَخْفَى نَفْسَهُ، وَنَقَصَهَا بِالْمَعَاصِي."],[91,11,"بِطَغْوَىٰهَآ","بِسَبَبِ طُغْيَانِهَا، وَتَجَاوُزِهَا الْحَدَّ فِي الْعِصْيَانِ."],[91,12,"ٱنۢبَعَثَ","نَهَضَ مُسْرِعًا؛ لِعَقْرِ النَّاقَةِ."],[91,12,"أَشْقَىٰهَا","أَكْثَرُهُمْ شَقَاوَةً، وَتَمَرُّدًا؛ وَهُوَ قُدَارُ بْنُ سَالِفٍ."],[91,13,"نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا","احْذَرُوا نَاقَةَ اللهِ أَنْ تَمَسُّوهَا بِسُوءٍ، وَأَنْ تَعْتَدُوا عَلَى سَقْيِهَا."],[91,14,"فَعَقَرُوهَا","فَنَحَرُوهَا."],[91,14,"فَدَمْدَمَ","فَأَطْبَقَ عَلَيْهِمُ الْعُقُوبَةَ."],[91,14,"فَسَوَّىٰهَا","عَمَّهُمْ بِالْعُقُوبَةِ؛ فَلَمْ يُفْلِتْ مِنْهُمْ أَحَدٌ."],[91,15,"عُقْبَٰهَا","عَاقِبَةَ مَا نَزَلَ بِهِمْ مِنَ الْعُقُوبَةِ."],[92,1,"يَغْشَىٰ","يُغَطِّي بِظَلَامِهِ الْأَرْضَ."],[92,2,"تَجَلَّىٰ","انْكَشَفَ بِضِيَائِهِ."],[92,4,"لَشَتَّىٰ","لَمُخْتَلِفٌ."],[92,5,"أَعْطَىٰ","بَذَلَ مَالَهُ مُتَصَدِّقًا."],[92,6,"بِٱلْحُسْنَىٰ","بِالثَّوَابِ عَلَى أَعْمَالِهِ."],[92,7,"لِلْيُسْرَىٰ","لِكُلِّ خَيْرٍ، وَسَعَادَةٍ."],[92,10,"لِلْعُسْرَىٰ","لِكُلِّ عُسْرٍ، وَشَقَاوَةٍ."],[92,11,"وَمَا يُغْنِى","لَا يَنْفَعُهُ."],[92,11,"تَرَدَّىٰٓ","وَقَعَ فِي النَّارِ."],[92,12,"إِنَّ عَلَيْنَا لَلْهُدَىٰ","عَلَيْنَا أَنْ نُبَيِّنَ طَرِيقَ الْهُدَى؛ فَضْلًا مِنَّا وَرَحْمَةً."],[92,14,"تَلَظَّىٰ","تَتَوَهَّجُ."],[92,15,"يَصْلَىٰهَآ","لَا يَدْخُلُهَا، وَيُقَاسِي حَرَّهَا."],[92,17,"وَسَيُجَنَّبُهَا","سَيُبْعَدُ عَنْهَا."],[92,19,"تُجْزَىٰٓ","تُكَافَأُ؛ فَلَيْسَ إِنْفَاقُهُ مُكَافَأَةً لِمَنْ أَحْسَنَ إِلَيْهِ."],[93,1,"وَٱلضُّحَىٰ","قَسَمٌ بِأَوَّلِ النَّهَارِ، أَوْ كُلِّهِ."],[93,2,"سَجَىٰ","غَطَّى الْكَوْنَ بِظَلَامِهِ، وَسَكَنَ."],[93,3,"مَا وَدَّعَكَ","مَا تَرَكَكَ."],[93,3,"وَمَا قَلَىٰ","وَمَا أَبْغَضَكَ عِنْدَمَا أَبْطَأَ عَلَيْكَ الْوَحْيُ."],[93,6,"فَـَٔاوَىٰ","فَآوَاكَ، وَرَعَاكَ."],[93,7,"ضَآلًّا","لَا تَدْرِي الْوَحْيَ، وَلَا تَعْلَمُ الْقُرْآنَ."],[93,8,"عَآئِلًا","فَقِيرًا."],[93,9,"فَلَا تَقْهَرْ","لَا تُسِئْ مُعَامَلَتَهُ، وَتَأْخُذْ مَالَهُ."],[93,10,"ٱلسَّآئِلَ","الْفَقِيرَ الَّذِي يَسْأَلُ، وَطَالِبَ الْعِلْمِ."],[93,10,"فَلَا تَنْهَرْ","لَا تَزْجُرْ."],[94,1,"أَلَمْ نَشْرَحْ","قَدْ وَسَّعْنَا بِنُورِ الْإِسْلَامِ بَعْدَ الْحَيْرَةِ وَالضِّيقِ."],[94,2,"وَوَضَعْنَا","حَطَطْنَا، وَغَفَرْنَا."],[94,2,"وِزْرَكَ","ذَنْبَكَ."],[94,3,"أَنقَضَ","أَثْقَلَ."],[94,7,"فَرَغْتَ","مِنْ أَشْغَالِ الدُّنْيَا."],[94,7,"فَٱنصَبْ","فَجِدَّ فِي الْعِبَادَةِ."],[94,8,"فَٱرْغَب","فَتَوَجَّهْ، وَاطْلُبْ، وَتَضَرَّعْ."],[95,2,"وَطُورِ سِينِينَ","جَبَلِ طُورِ سَيْنَاءَ الَّذِي كَلَّمَ اللهُ عَلَيْهِ مُوسَى ﷺ."],[95,3,"وَهَٰذَا ٱلْبَلَدِ","مَكَّةَ."],[95,4,"تَقْوِيمٍ","صُورَةٍ."],[95,5,"أَسْفَلَ سَٰفِلِينَ","النَّارِ؛ إِنْ لَمْ يُطِعِ اللهَ."],[95,6,"غَيْرُ مَمْنُونٍ","غَيْرُ مَقْطُوعٍ، وَلَا مَنْقُوصٍ."],[95,7,"بِٱلدِّينِ","بِالْبَعْثِ، وَالْجَزَاءِ."],[96,2,"عَلَقٍ","قِطْعَةِ دَمٍ غَلِيظٍ."],[96,6,"كَلَّآ","حَقًّا."],[96,6,"لَيَطْغَىٰٓ","لَيَتَجَاوَزُ الْحَدَّ فِي الْعِصْيَانِ، وَالْكِبْرِ."],[96,7,"أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","بِسَبَبِ أَنْ رَأَى نَفْسَهُ مُسْتَغْنِيًا بِمَالِهِ."],[96,8,"ٱلرُّجْعَىٰٓ","الرُّجُوعَ، وَالْمَصِيرَ."],[96,9,"أَرَءَيْتَ","أَلَا تَعْجَبُ!!"],[96,13,"وَتَوَلَّىٰٓ","أَعْرَضَ عَنِ الْإِيمَانِ."],[96,15,"لَنَسْفَعًۢا","لَنَأْخُذَنَّ أَخْذًا عَنِيفًا فَنَطْرَحُهُ فِي النَّارِ."],[96,15,"بِٱلنَّاصِيَةِ","بِمُقَدَّمِ رَأْسِهِ."],[96,16,"خَاطِئَةٍ","آثِمَةٍ."],[96,17,"فَلْيَدْعُ","فَلْيُحْضِرْ، وَلْيُنَادِ."],[96,17,"نَادِيَهُۥ","أَهْلَ مَجْلِسِهِ مِنْ قَوْمِهِ، وَعَشِيرَتِهِ."],[96,18,"ٱلزَّبَانِيَةَ","مَلَائِكَةَ الْعَذَابِ."],[96,19,"كَلَّا","لَيْسَ الْأَمْرُ عَلَى مَا يَظُنُّ أَبُو جَهْلٍ."],[96,19,"وَٱقْتَرِب","ادْنُ مِنْهُ بِالطَّاعَةِ."],[97,1,"أَنزَلْنَٰهُ","أَنْزَلْنَا الْقُرْآنَ جُمْلَةً وَاحِدَةً مِنَ اللَّوْحِ الْمَحْفُوظِ إِلَى بَيْتِ الْعِزَّةِ فِي السَّمَاءِ الدُّنْيَا."],[97,1,"لَيْلَةِ ٱلْقَدْرِ","لَيْلَةِ الشَّرَفِ، وَالْعَظَمَةِ، وَكِتَابِ الْمَقَادِيرِ."],[97,4,"وَٱلرُّوحُ","جِبْرِيلُ ﷺ."],[97,4,"أَمْرٍ","قَضَاءِ قَدَّرَهُ اللهُ فِي تِلْكَ السَّنَةِ."],[97,5,"سَلَٰمٌ","أَمْنٌ، وَسَلَامَةٌ، وَتَسْلِيمٌ مِنَ الْمَلَائِكَةِ."],[98,1,"مُنفَكِّينَ","تَارِكِينَ كُفْرَهُمْ."],[98,1,"ٱلْبَيِّنَةُ","الْعَلَامَةُ الَّتِي وُعِدُوا بِهَا فِي الْكُتُبِ السَّابِقَةِ."],[98,2,"رَسُولٌ مِّنَ ٱللَّهِ","أَيْ: وَالْبَيِّنَةُ رَسُولٌ مِنَ اللهِ."],[98,2,"يَتْلُوا۟","يَقْرَأُ."],[98,2,"مُّطَهَّرَةً","مُنَزَّهَةً مِنَ الْبَاطِلِ، مَحْفُوظَةً مِنَ الشَّيَاطِينِ."],[98,3,"كُتُبٌ قَيِّمَةٌ","أَخْبَارٌ صَادِقَةٌ، وَأَوَامِرُ عَادِلَةٌ."],[98,4,"تَفَرَّقَ","اخْتَلَفَ."],[98,4,"أُوتُوا۟ ٱلْكِتَٰبَ","الْيَهُودُ وَالنَّصَارَى."],[98,4,"ٱلْبَيِّنَةُ","مِنْ بَعْدِ مَا تَبَيَّنُوا أَنَّهُ نَبِيٌّ حَقًّا، تَفَرَّقُوا، وَكَانُوا مُجْتَمِعِينَ عَلَى صِحَّةِ نُبُوَّتِهِ قَبْلَ ذَلِكَ."],[98,5,"مُخْلِصِينَ","قَاصِدِينَ وَجْهَ اللهِ وَحْدَهُ."],[98,5,"حُنَفَآءَ","مَائِلِينَ عَنِ الشِّرْكِ إِلَى الْإِيمَانِ."],[98,5,"ٱلْقَيِّمَةِ","الِاسْتِقَامَةِ."],[98,6,"ٱلْبَرِيَّةِ","الْخَلِيقَةِ."],[98,8,"عَدْنٍ","إِقَامَةٍ، وَاسْتِقْرَارٍ."],[99,1,"زُلْزِلَتِ","رُجَّتْ وَحُرِّكَتْ بِقُوَّةٍ."],[99,1,"زِلْزَالَهَا","تَحْرِيكَهَا الشَّدِيدَ."],[99,2,"أَثْقَالَهَا","مَا فِي بَطْنِهَا مِنَ الْمَوْتَى وَالْكُنُوزِ."],[99,3,"مَا لَهَا","مَا الَّذِي حَدَثَ لَهَا؟"],[99,4,"تُحَدِّثُ أَخْبَارَهَا","تُخْبِرُ الْأَرْضُ بِمَا عُمِلَ عَلَيْهَا."],[99,5,"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","بِسَبَبِ أَنَّ رَبَّكَ أَمَرَهَا بِأَنْ تُخْبِرَ."],[99,6,"يَصْدُرُ ٱلنَّاسُ","يَرْجِعُونَ عَنْ مَوْقِفِ الْحِسَابِ."],[99,6,"أَشْتَاتًا","أَصْنَافًا مُتَفَرِّقِينَ."],[99,6,"لِّيُرَوْا۟ أَعْمَٰلَهُمْ","لِيُرِيَهُمُ اللهُ مَا عَمِلُوا، وَيُجَازِيَهُمْ عَلَيْهِ."],[99,7,"مِثْقَالَ ذَرَّةٍ","وَزْنَ نَمْلَةٍ صَغِيرَةٍ."],[100,1,"وَٱلْعَٰدِيَٰتِ ضَبْحًا","قَسَمٌ بِالْخَيْلِ الْجَارِيَةِ فِي سَبِيلِ اللهِ، حِينَ يَظْهَرُ صَوْتُهَا مِنْ سُرْعَةِ عَدْوِهَا."],[100,2,"فَٱلْمُورِيَٰتِ قَدْحًا","فَالْمُوقِدَاتِ بِحَوَافِرِهَا النَّارَ مِنْ شِدَّةِ عَدْوِهَا."],[100,3,"فَٱلْمُغِيرَٰتِ صُبْحًا","فَالْخَيْلِ الَّتِي تُغِيرُ وَتُبَاغِتُ الْعَدُوَّ صَبَاحًا."],[100,4,"فَأَثَرْنَ","فَهَيَّجْنَ."],[100,4,"نَقْعًا","غُبَارًا."],[100,5,"فَوَسَطْنَ بِهِۦ جَمْعًا","فَتَوَسَّطْنَ بِرُكْبَانِهِنَّ جُمُوعَ الْأَعْدَاءِ."],[100,6,"لَكَنُودٌ","لَجَحُودٌ."],[100,7,"لَشَهِيدٌ","لَمُقِرٌّ عَلَى جُحُودِهِ."],[100,8,"ٱلْخَيْرِ","الْمَالِ."],[100,9,"بُعْثِرَ","أُثِيرَ، وَأُخْرِجَ."],[100,10,"وَحُصِّلَ","اسْتُخْرِجَ، وَأُبْرِزَ."],[101,1,"ٱلْقَارِعَةُ","الْقِيَامَةُ الَّتِي تَقْرَعُ الْقُلُوبَ بِأَهْوَالِهَا."],[101,4,"ٱلْمَبْثُوثِ","الْمُنْتَشِرِ."],[101,5,"كَٱلْعِهْنِ","كَالصُّوفِ الْمَصْبُوغِ بِأَلْوَانٍ مُخْتَلِفَةٍ."],[101,5,"ٱلْمَنفُوشِ","الَّذِي مُزِّقَ، وَنُفِّشَ، فَتَفَرَّقَتْ أَجْزَاؤُهُ."],[101,6,"ثَقُلَتْ مَوَٰزِينُهُۥ","رَجَحَتْ مَوَازِينُ حَسَنَاتِهِ."],[101,9,"فَأُمُّهُۥ هَاوِيَةٌ","مَأْوَاهُ إِلَى جَهَنَّمَ يَهْوِي عَلَى رَأْسِهِ."],[101,11,"حَامِيَةٌۢ","حَارَّةٌ قَدِ اشْتَدَّ إِيقَادُهَا."],[102,1,"أَلْهَىٰكُمُ","شَغَلَكُمْ عَنْ طَاعَةِ اللهِ."],[102,1,"ٱلتَّكَاثُرُ","التَّفَاخُرُ بِكَثْرَةِ الْأَمْوَالِ وَالْأَوْلَادِ وَالْمَتَاعِ."],[102,2,"زُرْتُمُ ٱلْمَقَابِرَ","دُفِنْتُمْ فِي الْقُبُورِ."],[102,5,"عِلْمَ ٱلْيَقِينِ","حَقَّ الْعِلْمِ."],[102,7,"عَيْنَ ٱلْيَقِينِ","لَتُبْصِرُنَّ جَهَنَّمَ يَقِينًا بِلَا رَيْبٍ."],[102,8,"ٱلنَّعِيمِ","كُلِّ أَنْوَاعِ النِّعَمِ مِنَ الْأَمْنِ، وَالْأَهْلِ، وَالْمَطْعَمِ، وَنَحْوِهَا."],[103,1,"وَٱلْعَصْرِ","وَالدَّهْرِ."],[103,2,"ٱلْإِنسَٰنَ","كُلُّ بَنِي آدَمَ."],[103,2,"خُسْرٍ","خُسْرَانٍ، وَهَلَكَةٍ، وَنُقْصَانٍ."],[103,3,"بِٱلْحَقِّ","بِالْخَيْرِ كُلِّهِ: اعْتِقَادًا، وَعَمَلًا."],[103,3,"بِٱلصَّبْرِ","عَلَى الطَّاعَةِ، وَعَنِ الْمَعْصِيَةِ، وَعَلَى أَقْدَارِ اللهِ الْمُؤْلِمَةِ."],[104,1,"وَيْلٌ","شَرٌّ، وَهَلَاكٌ."],[104,1,"هُمَزَةٍ","مُغْتَابٍ لِلنَّاسِ."],[104,1,"لُّمَزَةٍ","طَعَّانٍ فِي النَّاسِ."],[104,2,"وَعَدَّدَهُۥ","أَحْصَاهُ."],[104,3,"يَحْسَبُ","يَظُنُّ."],[104,3,"أَخْلَدَهُۥ","أَبْقَاهُ خَالِدًا فِي الدُّنْيَا."],[104,4,"كَلَّا","لَيْسَ الْأَمْرُ كَمَا يَظُنُّ."],[104,4,"لَيُنۢبَذَنَّ","لَيُطْرَحَنَّ."],[104,4,"ٱلْحُطَمَةِ","النَّارِ الَّتِي تُهَشِّمُ كُلَّ مَا يُلْقَى فِيهَا."],[104,7,"تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ","تَنْفُذُ لِشِدَّتِهَا مِنْ أَجْسَامِهِمْ إِلَى قُلُوبِهِمْ."],[104,8,"مُّؤْصَدَةٌۢ","مُطْبَقَةٌ."],[104,9,"فِى عَمَدٍ مُّمَدَّدَةٍۭ","يُعَذَّبُونَ فِي أَعْمِدَةٍ طَوِيلَةٍ، أَوْ أَنَّ أَبْوَابَهَا مُغْلَقَةٌ بِأَعْمِدَةٍ مُمَدَّدَةٍ؛ لِئَلَّا يَخْرُجُوا مِنْهَا."],[105,1,"أَلَمْ تَرَ","أَلَمْ تَعْلَمْ؟"],[105,1,"بِأَصْحَٰبِ ٱلْفِيلِ","وَهُمْ: أَبْرَهَةُ الْحَبَشِيُّ، وَجَيْشُهُ الَّذِينَ أَرَادُوا تَدْمِيرَ الْكَعْبَةِ."],[105,2,"كَيْدَهُمْ","تَدْبِيرَهُمْ وَسَعْيَهُمْ لِتَخْرِيبِ الْكَعْبَةِ."],[105,2,"تَضْلِيلٍ","تَضْيِيعٍ، وَإِبْطَالٍ، وَخَسَارٍ."],[105,3,"أَبَابِيلَ","جَمَاعَاتٍ مُتَتَابِعَةً."],[105,4,"سِجِّيلٍ","طِينٍ مُتَحَجِّرٍ."],[105,5,"كَعَصْفٍ مَّأْكُولٍۭ","مُحَطَّمِينَ؛ كَأَوْرَاقِ الزَّرْعِ الْيَابِسَةِ الَّتِي أَكَلَتْهَا الْبَهَائِمُ، ثُمَّ رَمَتْ بِهَا."],[106,1,"لِإِيلَٰفِ قُرَيْشٍ","اعْجَبُوا لِقُرَيْشٍ مَا أَلِفُوهُ وَاعْتَادُوهُ مِنَ الرِّحْلَتَيْنِ، وَتَرْكِهِمْ عِبَادَةَ اللهِ، أَوِ الْمَعْنَى: لِتَعْبُدْ قُرَيْشٌ رَبَّهَا؛ لِإِنْعَامِهِ عَلَيْهِمْ بِاعْتِيَادِ الرِّحْلَتَيْنِ."],[106,2,"رِحْلَةَ ٱلشِّتَآءِ","إِلَى الْيَمَنِ."],[106,2,"وَٱلصَّيْفِ","إِلَى الشَّامِ."],[107,1,"بِٱلدِّينِ","بِالْبَعْثِ، وَالْجَزَاءِ."],[107,2,"يَدُعُّ ٱلْيَتِيمَ","يُدْفَعُ الْيَتِيمُ بِعُنْفٍ عَنْ حَقِّهِ."],[107,3,"وَلَا يَحُضُّ","لَا يَحُثُّ النَّاسَ."],[107,4,"فَوَيْلٌ","فَعَذَابٌ شَدِيدٌ."],[107,5,"سَاهُونَ","غَيْرُ مُبَالِينَ بِهَا؛ يُؤَخِّرُونَهَا عَنْ وَقْتِهَا، وَلَا يُقِيمُونَهَا عَلَى وَجْهِهَا."],[107,6,"يُرَآءُونَ","يُظَاهِرُونَ بِأَعْمَالِهِمْ؛ مُرَاءَاةً لِلنَّاسِ."],[107,7,"ٱلْمَاعُونَ","يَمْنَعُونَ إِعَارَةَ مَا لَا تَضُرُّ إِعَارَتُهُ مِنَ الْآنِيَةِ وَغَيْرِهَا؛ لِبُخْلِهِمْ."],[108,1,"ٱلْكَوْثَرَ","الْخَيْرَ الْكَثِيرَ، وَمِنْهُ نَهْرُ الْكَوْثَرِ فِي الْجَنَّةِ."],[108,2,"وَٱنْحَرْ","اذْبَحْ ذَبِيحَتَكَ لِلَّهِ وَحْدَهُ."],[108,3,"شَانِئَكَ","مُبْغِضَكَ."],[108,3,"ٱلْأَبْتَرُ","الْمُنْقَطِعُ أَثَرُهُ، الْمَقْطُوعُ مِنْ كُلِّ خَيْرٍ."],[109,4,"وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ","لَا أَعْبُدُ مُسْتَقْبَلًا مَا عَبَدْتُمْ مِنَ الْآلِهَةِ الْبَاطِلَةِ."],[109,6,"لَكُمْ دِينُكُمْ","لَكُمْ شِرْكُكُمْ، وَكُفْرُكُمْ."],[109,6,"وَلِىَ دِينِ","لِي إِخْلَاصِي، وَتَوْحِيدِيَ الَّذِي لَا أَبْغِي غَيْرَهُ."],[110,1,"وَٱلْفَتْحُ","فَتْحُ مَكَّةَ، وَكَانَ ذَلِكَ فِي الْعَامِ الثَّامِنِ الْهِجْرِيِّ."],[110,2,"أَفْوَاجًا","جَمَاعَاتٍ كَثِيرَةً تِلْوَ جَمَاعَاتٍ."],[110,3,"فَسَبِّحْ بِحَمْدِ رَبِّكَ","نَزِّهْ رَبَّكَ تَنْزِيهًا مَصْحُوبًا بِحَمْدِهِ."],[110,3,"تَوَّابًۢا","يَرْجِعُ عَلَى الْمُسْتَغْفِرِ بِالرَّحْمَةِ، وَيَقْبَلُ التَّوْبَةَ مِمَّنْ تَابَ."],[111,1,"تَبَّتْ","خَسِرَتْ، وَهَلَكَتْ، وَهَذَا دُعَاءٌ عَلَيْهِ."],[111,1,"وَتَبَّ","حَصَلَ لَهُ الْخَسَارُ وَالْهَلَاكُ، وَهَذَا خَبَرٌ عَنْهُ."],[111,2,"مَآ أَغْنَىٰ عَنْهُ","مَا دَفَعَ عَنْهُ الْخَسَارَ."],[111,2,"وَمَا كَسَبَ","وَهُوَ وَلَدُهُ."],[111,3,"سَيَصْلَىٰ نَارًا","سَيَدْخُلُ نَارًا يُقَاسِي حَرَّهَا."],[111,3,"ذَاتَ لَهَبٍ","نَارًا مُتَأَجِّجَةً، مُتَّقِدَةً."],[111,4,"حَمَّالَةَ ٱلْحَطَبِ","تَحْمِلُ الشَّوْكَ، فَتَطْرَحُهُ فِي طَرِيقِ النَّبِيِّ ﷺ؛ لِتُؤْذِيَهُ."],[111,5,"جِيدِهَا","عُنُقِهَا."],[111,5,"مِّن مَّسَدٍۭ","مِنْ لِيفٍ شَدِيدٍ خَشِنٍ تُرْفَعُ بِهِ فِي النَّارِ، ثُمَّ تُرْمَى."],[112,2,"ٱلصَّمَدُ","السَّيِّدُ الَّذِي كَمُلَ فِي سُؤْدُدِهِ وَغِنَاهُ، وَالَّذِي يُقْصَدُ فِي قَضَاءِ الْحَوَائِجِ."],[112,4,"كُفُوًا","مُكَافِئًا، وَمُمَاثِلًا، وَنَظِيرًا."],[113,1,"أَعُوذُ","أَعْتَصِمُ، وَأَلْتَجِئُ."],[113,1,"ٱلْفَلَقِ","الصُّبْحِ."],[113,3,"غَاسِقٍ","لَيْلٍ شَدِيدِ الظُّلْمَةِ."],[113,3,"وَقَبَ","إِذَا دَخَلَ ظَلَامُهُ، وَتَغَلْغَلَ."],[113,4,"ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ","السَّاحِرَاتِ اللَّوَاتِي يَنْفُخْنَ بِلَا رِيقٍ فِي عُقَدِ الْخَيْطِ؛ بِقَصْدِ السِّحْرِ، سَوَاءٌ كُنَّ نِسَاءً، أَوْ أَنْفُسًا خَبِيثَةً."],[113,5,"حَاسِدٍ","مَنْ يَتَمَنَّى زَوَالَ النِّعْمَةِ عَنْ غَيْرِهِ."],[114,1,"أَعُوذُ","أَعْتَصِمُ، وَأَلْتَجِئُ."],[114,1,"بِرَبِّ ٱلنَّاسِ","مُرَبِّيهِمْ، وَخَالِقِهِمْ، وَمُدَبِّرِ أَحْوَالِهِمْ."],[114,3,"إِلَٰهِ ٱلنَّاسِ","مَعْبُودِهِمُ الْحَقِّ."],[114,4,"ٱلْوَسْوَاسِ","الشَّيْطَانِ الَّذِي يُلْقِي شُكُوكَهُ وَأَبَاطِيلَهُ فِي الْقُلُوبِ عِنْدَ الْغَفْلَةِ."],[114,4,"ٱلْخَنَّاسِ","الَّذِي يَخْتَفِي وَيَهْرُبُ عِنْدَ ذِكْرِ اللهِ."],[114,6,"مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","الْمَوْسْوِسُ يَكُونُ جِنِّيًّا وَإِنْسِيًّا، أَوِ الْمُوَسْوَسُ فِيهِمْ مِنَ الْجِنَّةِ وَالنَّاسِ."]]</script></head>
