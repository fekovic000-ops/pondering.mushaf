 بما يُنزِلُه من عذابِه، وهزيمةٍ بالكفَّار في كلِّ ناحية."],[21,45,"أُنذِرُكُم","أُخوِّفُكم."],[21,46,"نَفْحَةٌ","نصيبٌ يسير."],[21,47,"ٱلْقِسْطَ","ذواتِ العدل."],[21,47,"مِثْقَالَ حَبَّةٍ","العادلِ أو وزنَ ذرَّة."],[21,48,"ٱلْفُرْقَانَ","التوراةَ الفارقةَ بين الحقِّ والباطل."],[21,51,"رُشْدَهُۥ","هُداه."],[21,52,"ٱلتَّمَاثِيلُ","الأصنامُ التي صنعتُموها."],[21,52,"عَٰكِفُونَ","مُقيمون على عبادتِها، مُلازمون لها."],[21,56,"فَطَرَهُنَّ","خلقَهنَّ."],[21,57,"لَأَكِيدَنَّ","لَأمكُرَنَّ، ولأُكسِّرنَّ."],[21,57,"مُدْبِرِينَ","ذاهبين."],[21,58,"جُذَٰذًا","قِطَعًا صغيرةً."],[21,61,"عَلَىٰٓ أَعْيُنِ ٱلنَّاسِ","بمَرأًى من الناس."],[21,65,"نُكِسُوا۟ عَلَىٰ رُءُوسِهِمْ","رجعوا إلى عِنادِهم."],[21,67,"أُفٍّ لَّكُمْ","قُبحًا لكم."],[21,71,"ٱلْأَرْضِ ٱلَّتِى بَٰرَكْنَا فِيهَا","أرضِ الشام."],[21,72,"نَافِلَةً","زيادةً عمَّا سأل."],[21,74,"قَوْمَ سَوْءٍ","أهلَ فسادٍ وقُبح."],[21,78,"يَحْكُمَانِ","يَقضِيان بين خصمَين عدَتْ غنمُ أحدِهما على زرعِ الآخر."],[21,78,"ٱلْحَرْثِ","الزَّرع."],[21,78,"نَفَشَتْ","انتشرَتْ فيه ليلًا بلا راعٍ."],[21,79,"يُسَبِّحْنَ","تُسبِّحُ الجبالُ معه إذا سبَّح."],[21,80,"صَنْعَةَ لَبُوسٍ","صناعةَ الدُّروعِ يعمَلُها حِلَقًا مُتشابِكةً."],[21,80,"لِتُحْصِنَكُم","لتحميَكم."],[21,80,"بَأْسِكُمْ","حربِكم."],[21,81,"عَاصِفَةً","شديدةَ الهُبوب."],[21,82,"يَغُوصُونَ لَهُۥ","يَغوصون في البِحار؛ لاستخراجِ اللَّآلئ."],[21,87,"وَذَا ٱلنُّونِ","وصاحبَ الحوت، وهو يونسُ عليه السلام."],[21,87,"أَن لَّن نَّقْدِرَ عَلَيْهِ","أنْ لن نُضيِّقَ عليه في بطنِ الحوت، ونُؤاخِذَه."],[21,89,"خَيْرُ ٱلْوَٰرِثِينَ","خيرُ الباقين، وخيرُ من خلَفَني بخير."],[21,90,"رَغَبًا وَرَهَبًا","رجاءً في الثواب، وخوفًا من العقاب."],[21,90,"خَٰشِعِينَ","خاضعين، مُتذلِّلين."],[21,91,"أَحْصَنَتْ فَرْجَهَا","حفِظَتْه من الفواحش."],[21,91,"فَنَفَخْنَا","نفَخَ جبريلُ عليه السلام في جَيبِ قميصِها، فوصلَتِ النَّفخةُ إلى رَحِمِها."],[21,91,"مِن رُّوحِنَا","من جهةِ رُوحِنا، وهو: جبريلُ عليه السلام."],[21,91,"ءَايَةً","علامةً على قُدرةِ الله."],[21,92,"أُمَّتُكُمْ أُمَّةً وَٰحِدَةً","مِلَّتُكم مِلَّةً واحدةً، وهي: الإسلام."],[21,93,"وَتَقَطَّعُوٓا۟ أَمْرَهُم","اختلفوا على رُسُلِهم، وتفرَّقوا."],[21,94,"فَلَا كُفْرَانَ لِسَعْيِهِۦ","فلا جُحودَ لعملِه."],[21,95,"وَحَرَٰمٌ","مُمتنِع."],[21,95,"لَا يَرْجِعُونَ","أي: إلى الدنيا؛ ليستدرِكوا ما فرَّطوا فيه."],[21,96,"فُتِحَتْ يَأْجُوجُ","أي: سُدُّ يأجوجَ."],[21,96,"حَدَبٍ","مُرتفعٍ من الأرض."],[21,96,"يَنسِلُونَ","يُسرِعون."],[21,97,"ٱلْوَعْدُ ٱلْحَقُّ","يومُ القيامة."],[21,97,"شَٰخِصَةٌ","مفتوحةٌ لا تكادُ تَطرِف."],[21,98,"حَصَبُ جَهَنَّمَ","وَقودُها، وحَطَبُها."],[21,98,"وَٰرِدُونَ","داخِلون."],[21,100,"زَفِيرٌ","تنفُّسٌ شديدٌ تنتفِخُ منه الضُّلوعُ يدلُّ على شدَّةِ عذابِهم."],[21,102,"حَسِيسَهَا","صوتَ لهيبِها، واحتراقِ الأجسادِ فيها."],[21,103,"ٱلْفَزَعُ ٱلْأَكْبَرُ","الهَولُ الأعظمُ يومَ القيامة."],[21,104,"كَطَىِّ ٱلسِّجِلِّ لِلْكُتُبِ","كما تُطوى الصَّحيفةُ على ما كُتِبَ فيها."],[21,105,"ٱلزَّبُورِ","الكتبِ المنزَّلةِ على الأنبياء."],[21,105,"ٱلذِّكْرِ","اللَّوحِ المحفوظ."],[21,109,"ءَاذَنتُكُمْ","أعلَمتُكم ما أُمِرتُ به."],[21,109,"عَلَىٰ سَوَآءٍ","أنا وأنتم مستوون في العلم به."],[21,111,"وَإِنْ أَدْرِىٓ","لستُ أدري."],[21,111,"لَعَلَّهُۥ فِتْنَةٌ","لعلَّ تأخيرَ العذابِ الذي استعجلتُموه استدراجٌ لكم."],[21,112,"ٱحْكُم بِٱلْحَقِّ","افصِلْ بيننا، وبينَ المكذِّبين بالقضاءِ الحقِّ."],[22,1,"زَلْزَلَةَ ٱلسَّاعَةِ","أهوالَ القيامة، واضطرابَ الأرضِ يومَها."],[22,2,"تَذْهَلُ","تغفُلُ، وتنشغِلُ."],[22,2,"مُرْضِعَةٍ","التي أَلقمَتْ وليدَها ثَديَها."],[22,3,"مَّرِيدٍ","مُتمرِّد."],[22,4,"تَوَلَّاهُ","اتَّخذَه وليًّا وتبِعَه."],[22,5,"رَيْبٍ","شكٍّ."],[22,5,"عَلَقَةٍ","دمٍ أحمرَ غليظٍ تعلَّقَ في الرَّحِم."],[22,5,"مُّضْغَةٍ","قطعةِ لحمٍ صغيرةٍ قَدرَ ما يُمضَغ."],[22,5,"مُّخَلَّقَةٍ","تامَّةِ الخَلق."],[22,5,"أَشُدَّكُمْ","وقتَ شبابِكم، واكتمالِ قُوَّتِكم."],[22,5,"أَرْذَلِ ٱلْعُمُرِ","سِنِّ الهَرَم، وضَعفِ العقل."],[22,5,"هَامِدَةً","يابسةً ميِّتةً."],[22,5,"ٱهْتَزَّتْ","تحرَّكَتْ بالنَّبات."],[22,5,"وَرَبَتْ","ارتفعَتْ، وزادَتْ لارتوائِها."],[22,5,"مِن كُلِّ زَوْجٍ","من كلِّ نوعٍ من أنواعِ النَّبات."],[22,5,"بَهِيجٍ","حسَنٍ يَسُرُّ الناظرين."],[22,9,"ثَانِىَ عِطْفِهِۦ","لاويًا عُنُقَه في تكبُّر."],[22,11,"عَلَىٰ حَرْفٍ","على ضَعفٍ، وشكٍّ، وترَدُّد."],[22,11,"خَيْرٌ","صحَّةٌ، وسَعةُ رزق."],[22,11,"فِتْنَةٌ","ابتلاءٌ بمكروهٍ وشدَّة."],[22,13,"ٱلْمَوْلَىٰ","الناصر."],[22,15,"بِسَبَبٍ إِلَى ٱلسَّمَآءِ","بحبلٍ إلى سقفِ بيتِه، فلْيَخنُقْ به نفسَه."],[22,15,"ثُمَّ لْيَقْطَعْ","أي: ليَقطَعْ ذلك الحبل."],[22,17,"وَٱلصَّٰبِـِٔينَ","عَبَدةَ الملائكة، أوِ الكواكب."],[22,17,"وَٱلْمَجُوسَ","عَبَدةَ النار."],[22,17,"شَهِيدٌ","عالمٌ به عِلمَ مشاهَدة."],[22,19,"خَصْمَانِ","فريقانِ مختلفانِ، وهم أهلُ إيمانٍ، وأهلُ كُفران."],[22,19,"قُطِّعَتْ لَهُمْ ثِيَابٌ","جُعلَتْ لهم ثيابٌ من النار يلبَسونها."],[22,19,"ٱلْحَمِيمُ","الماءُ المتناهي في حَرِّه."],[22,20,"يُصْهَرُ بِهِۦ","يُذابُ به."],[22,21,"مَقَٰمِعُ","مَطارِق."],[22,22,"مِنْ غَمٍّ","من شدَّةِ غمِّهم، وكَربِهم."],[22,22,"وَذُوقُوا۟","وقيلَ لهم: ذُوقوا."],[22,23,"يُحَلَّوْنَ","يُزيَّنون."],[22,24,"صِرَٰطِ ٱلْحَمِيدِ","طريقِ الإسلامِ المحمود."],[22,25,"ٱلْعَٰكِفُ فِيهِ","المُقيمُ فيه."],[22,25,"وَٱلْبَادِ","القادمُ إليه."],[22,25,"يُرِدْ","يَهُمَّ."],[22,25,"بِإِلْحَادٍۭ بِظُلْمٍ","بمَيلٍ عن الحقِّ ظُلمًا."],[22,26,"بَوَّأْنَا","هيَّأْنا، وبيَّنَّا."],[22,27,"وَأَذِّن","نادِ وأعلِمْ رافعًا صوتَك."],[22,27,"رِجَالًا","يمشون على أقدامِهم؛ جمعُ راجِل."],[22,27,"ضَامِرٍ","البعيرِ خفيفِ اللَّحمِ من الأعمالِ لا من الهُزال."],[22,27,"فَجٍّ عَمِيقٍ","طريقٍ بعيد."],[22,28,"أَيَّامٍ مَّعْلُومَٰتٍ","هي: عشرُ ذي الحِجَّة، وثلاثةُ أيامٍ بعدَه."],[22,28,"ٱلْبَآئِسَ ٱلْفَقِيرَ","الذي اشتدَّ فقرُه."],[22,29,"لْيَقْضُوا۟ تَفَثَهُمْ","ليُكمِلوا حجَّهم بإحلالِهم من إحرامِهم وإزالةِ وسَخِ أبدانِهم."],[22,29,"نُذُورَهُمْ","الحجَّ، والعُمرةَ، والهَدايا."],[22,29,"ٱلْعَتِيقِ","القديمِ الذي أعتقَه الله، من تسلُّطِ الجبَّارين عليه."],[22,30,"حُرُمَٰتِ ٱللَّهِ","شعائرِ الدِّين، ومَناسِكِ الحجِّ."],[22,30,"ٱلرِّجْسَ مِنَ ٱلْأَوْثَٰنِ","القَذارةَ التي هي: الأوثان."],[22,30,"قَوْلَ ٱلزُّورِ","الكذبَ والافتراءَ على الله."],[22,31,"حُنَفَآءَ لِلَّهِ","مستقيمين على الإخلاصِ مائلين عن الشِّرك."],[22,31,"سَحِيقٍ","بعيدٍ مُهلِك."],[22,32,"شَعَٰٓئِرَ ٱللَّهِ","ما أُشعِرتُم به، وأُعلِمتُم؛ من أعمالِ الحجِّ والذبائحِ التي تُنحَرُ فيه."],[22,33,"لَكُمْ فِيهَا مَنَٰفِعُ","يَحِلُّ الانتفاعُ بها بالرُّكوب، وشُربِ اللَّبَن."],[22,33,"مَحِلُّهَآ","وقتُ ذَبحِها."],[22,33,"ٱلْبَيْتِ ٱلْعَتِيقِ","الحَرَم."],[22,34,"مَنسَكًا","نُسُكًا وعبادةً؛ بذبحِ الأنعامِ تقرُّبًا للهِ."],[22,34,"ٱلْمُخْبِتِينَ","الخاضعينَ المتواضِعين."],[22,35,"وَجِلَتْ","خافَتْ."],[22,36,"وَٱلْبُدْنَ","الإبلَ، جمعُ بَدَنة."],[22,36,"شَعَٰٓئِرِ ٱللَّهِ","أعلامِ دينِه."],[22,36,"صَوَآفَّ","قائماتٍ؛ قد صُفَّتْ ثلاثٌ من قوائمِها، وقُيِّدتِ الرَّابعة."],[22,36,"وَجَبَتْ","سقطَتْ على الأرضِ بعدَ النَّحر."],[22,36,"ٱلْقَانِعَ","الفقيرَ الذي لم يسأَلْ تعفُّفًا."],[22,36,"وَٱلْمُعْتَرَّ","الذي يسأَلُ لحاجتِه."],[22,37,"يَنَالَ ٱللَّهَ","يصِلَ إلى الله."],[22,38,"خَوَّانٍ","كثيرِ الخيانةِ لأمانةِ ربِّه."],[22,40,"صَوَٰمِعُ","مَعابدُ رُهبانِ النَّصارى."],[22,40,"وَبِيَعٌ","كَنائسُ النَّصارى."],[22,40,"وَصَلَوَٰتٌ","مَعابدُ اليهود."],[22,40,"وَمَسَٰجِدُ","مَعابدُ المسلمين."],[22,44,"فَأَمْلَيْتُ لِلْكَٰفِرِينَ","فأمهَلتُ ولم أُعاجِلْ بالعقوبة."],[22,44,"نَكِيرِ","إنكاري عليهم كفرَهم بالعذابِ والهلاك."],[22,45,"فَكَأَيِّن مِّن قَرْيَةٍ","فكثيرٌ من القُرى."],[22,45,"خَاوِيَةٌ عَلَىٰ عُرُوشِهَا","مُتهدِّمةٌ قد سقطَتْ حيطانُها على سُقوفِها."],[22,45,"وَقَصْرٍ مَّشِيدٍ","مرفوعِ البُنيانِ مُزخرَفٍ قد خلا من ساكنيه."],[22,48,"أَمْلَيْتُ لَهَا","أمهَلتُها، ولم أُعاجِلْها بالعقوبة."],[22,51,"سَعَوْا۟ فِىٓ ءَايَٰتِنَا","اجتهَدوا في الكَيدِ؛ لإبطالِ القرآن."],[22,51,"مُعَٰجِزِينَ","مُغالِبينَ ظانِّينَ أنَّهم يُعجِزوننا."],[22,52,"تَمَنَّىٰٓ","قرأَ الآياتِ المنزَّلةَ عليهم."],[22,52,"أَلْقَى ٱلشَّيْطَٰنُ","وضَعَ في قلوبِ أوليائِه الوَساوِسَ، والشُّبَهَ صدًّا عن اتِّباعِ القراءة."],[22,52,"فِىٓ أُمْنِيَّتِهِۦ","في قراءتِه."],[22,52,"فَيَنسَخُ","فيُبطِلُ، ويُزيل."],[22,52,"يُحْكِمُ","يُثبِتُ."],[22,53,"فِتْنَةً","اختبارًا للذين في قلوبِهم مرضٌ."],[22,53,"شِقَاقٍۭ بَعِيدٍ","عَداوةٍ شديدةٍ، وخِلافٍ بعيدٍ عنِ الصَّواب."],[22,54,"فَتُخْبِتَ","تَخضَعَ، وتَسكُنَ."],[22,55,"مِرْيَةٍ","شكٍّ."],[22,55,"بَغْتَةً","فجأةً."],[22,55,"يَوْمٍ عَقِيمٍ","لا خيرَ فيه، ولا يومَ بعدَه، وهو يومُ القيامة."],[22,59,"مُّدْخَلًا","وهو الجنَّة."],[22,60,"بُغِىَ عَلَيْهِ","اعتُدِيَ عليه."],[22,61,"يُولِجُ","يُدخِل."],[22,65,"وَٱلْفُلْكَ","السُّفُنَ."],[22,67,"مَنسَكًا","شَريعةً، وعبادةً."],[22,70,"فِى كِتَٰبٍ","هو اللَّوحُ المحفوظ."],[22,71,"سُلْطَٰنًا","حُجَّةً، وبُرهانًا."],[22,72,"ٱلْمُنكَرَ","الكَراهةَ ظاهرةً على وُجوهِهم."],[22,72,"يَسْطُونَ","يَبطِشون."],[22,72,"ٱلْمَصِيرُ","المكانُ الذي يَصيرونَ إليه."],[22,73,"ٱلطَّالِبُ","المعبودُ من دونِ اللهِ الذي أُخِذَ منه شيءٌ."],[22,73,"وَٱلْمَطْلُوبُ","الذُّباب."],[22,74,"مَا قَدَرُوا۟","ما عظَّموا."],[22,75,"يَصْطَفِى","يَختار."],[22,78,"حَرَجٍ","ضيقٍ، وشِدَّة."],[22,78,"ٱجْتَبَىٰكُمْ","اصطفاكم."],[22,78,"مِلَّةَ أَبِيكُمْ","هذه المِلَّةَ السَّمحةَ مِلَّةَ أبيكم."],[22,78,"هُوَ سَمَّىٰكُمُ","اللهُ سمَّاكمُ المسلمينَ في الكتبِ السَّابقة."],[22,78,"مَوْلَىٰكُمْ","مالِكُكم، وناصِرُكم، ومُتولِّي أمورِكم."],[23,1,"أَفْلَحَ","فازَ."],[23,3,"ٱللَّغْوِ","ما لا خيرَ فيه من الأقوالِ والأفعال."],[23,6,"أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ","الإماء."],[23,7,"ٱلْعَادُونَ","المُجاوِزونَ الحلالَ إلى الحرام."],[23,8,"رَٰعُونَ","حافظون."],[23,11,"ٱلْفِرْدَوْسَ","أعلى مَنازلِ الجنَّة، وهو أعلى مَنازلِ الجنَّةِ وأوسَطُها."],[23,12,"سُلَٰلَةٍ مِّن طِينٍ","مأخوذٍ ومُستَلٍّ من جميعِ الأرض."],[23,13,"نُطْفَةً","مَنِيَّ الرِّجالِ يخرُجُ من أصلابِهم."],[23,13,"قَرَارٍ مَّكِينٍ","هو الرَّحِمُ تستقِرُّ فيه النُّطفة."],[23,14,"عَلَقَةً","دمًا أحمرَ مُلتصِقًا بالرَّحِم."],[23,14,"مُضْغَةً","قطعةَ لحمٍ قَدرَ ما يُمضَغ."],[23,17,"طَرَآئِقَ","سمواتٍ بعضُها فوقَ بعض."],[23,18,"بِقَدَرٍ","بمقدارِ حاجةِ الخلق."],[23,20,"وَشَجَرَةً","هي شجرةُ الزَّيتون."],[23,20,"بِٱلدُّهْنِ","بالزَّيت."],[23,20,"وَصِبْغٍ","إدامٍ يُغمَسُ فيه الخُبز."],[23,22,"ٱلْفُلْكِ","السُّفُن."],[23,25,"جِنَّةٌ","مَسٌّ من الجُنون."],[23,27,"بِأَعْيُنِنَا","بحِفظِنا وكَلاءَتِنا؛ وفيه إثباتُ صفةِ العينِ للهِ على الوجهِ اللائقِ به."],[23,27,"وَفَارَ ٱلتَّنُّورُ","نَبَعَ الماءُ من التَّنُّورِ المعروف."],[23,27,"فَٱسْلُكْ فِيهَا","فأدخِلْ فيها."],[23,27,"سَبَقَ عَلَيْهِ ٱلْقَوْلُ","استحقَّ العذاب."],[23,30,"لَمُبْتَلِينَ","لَمُختبِرين."],[23,31,"قَرْنًا","جيلًا."],[23,33,"ٱلْمَلَأُ مِن قَوْمِهِ","أشرافُ قومِ هودٍ، ووُجهاؤُهم."],[23,36,"هَيْهَاتَ","بعيدًا حقًّا."],[23,40,"عَمَّا قَلِيلٍ","بعدَ زمنٍ قريب."],[23,41,"غُثَآءً","كغُثاءِ السَّيلِ الذي يَطفو على الماء."],[23,41,"فَبُعْدًا","فهلاكًا وإبعادًا من الرَّحمة."],[23,42,"قُرُونًا","أُمَمًا وأجيالًا."],[23,43,"أَجَلَهَا","موعدُ هلاكِها المحدَّد."],[23,44,"تَتْرَا","يتبعُ بعضُهم بعضًا."],[23,44,"أَحَادِيثَ","أخبارًا لمَن بعدَهم."],[23,45,"بِـَٔايَٰتِنَا","وهي تسعٌ: العصا، واليدُ، والجرادُ، والقُمَّلُ، والضَّفادعُ، والدَّمُ، والطُّوفانُ، والسِّنونَ، ونقصُ الثَّمرات."],[23,46,"عَالِينَ","متكبِّرينَ مُتطاولينَ على الناس."],[23,47,"عَٰبِدُونَ","مُتذلِّلونَ مُطيعون."],[23,50,"وَءَاوَيْنَٰهُمَآ","جعلْنا لهما مأوًى ومسكنًا."],[23,50,"رَبْوَةٍ","مكانٍ مرتفعٍ من الأرض."],[23,50,"ذَاتِ قَرَارٍ","مُستوٍ للاستقرارِ عليه."],[23,50,"وَمَعِينٍ","ماءٍ جارٍ ظاهرٍ للعيون."],[23,52,"أُمَّتُكُمْ","دِينُكم يا مَعشرَ الأنبياء."],[23,52,"أُمَّةً وَٰحِدَةً","دينًا واحدًا هو: الإسلام."],[23,53,"فَتَقَطَّعُوٓا۟ أَمْرَهُم","فتفرَّقَ الأتباعُ في الدِّين."],[23,53,"زُبُرًا","شِيَعًا، وأحزابًا."],[23,54,"غَمْرَتِهِمْ","ضلالتِهم، وجهلِهم."],[23,54,"حَتَّىٰ حِينٍ","إلى وقتِ نزولِ العذابِ بهم."],[23,57,"مُّشْفِقُونَ","وجِلون."],[23,60,"وَجِلَةٌ","خائفةٌ من عدمِ القَبول."],[23,63,"غَمْرَةٍ مِّنْ هَٰذَا","ضلالٍ عن هذا القرآن."],[23,64,"يَجْـَٔرُونَ","يَرفَعونَ أصواتَهم مُتضرِّعين."],[23,66,"عَلَىٰٓ أَعْقَٰبِكُمْ تَنكِصُونَ","تَنفِرونَ من سَماعِ الآياتِ كالذي يَرجِعُ إلى الوَراء."],[23,67,"مُسْتَكْبِرِينَ بِهِۦ","مُستعلينَ على الناسِ بسببِ الحَرَام؛ تقولون: نحنُ أهلُه لا نُغلَبُ فيه."],[23,67,"سَٰمِرًا تَهْجُرُونَ","تتسامرونَ بالليلِ حولَ الحَرَمِ بالسَّيِّئِ من القَول."],[23,71,"بِذِكْرِهِمْ","بما فيه عِزُّهم وشَرَفُهم، وهو القرآن."],[23,72,"خَرْجًا","أجرًا."],[23,72,"فَخَرَاجُ رَبِّكَ","فثوابُه، وعَطاؤُه."],[23,74,"لَنَٰكِبُونَ","لَمائِلون."],[23,75,"لَّلَجُّوا۟","لتمادَوْا."],[23,75,"يَعْمَهُونَ","يَتحيَّرون ويَتخبَّطون."],[23,76,"ٱسْتَكَانُوا۟","خضَعوا."],[23,77,"مُبْلِسُونَ","آيِسونَ من كلِّ خيرٍ مُتحيِّرون."],[23,79,"ذَرَأَكُمْ","خلقَكم، وبَثَّكم."],[23,88,"يُجِيرُ","يَحمي ويُغيثُ مَن يشاء."],[23,88,"وَلَا يُجَارُ عَلَيْهِ","لا يُغاثُ أحدٌ ويُحمى منه."],[23,89,"فَأَنَّىٰ تُسْحَرُونَ","فكيف تذهبُ عقولُكم وتُخدَعونَ عن توحيدِه؟!"],[23,91,"وَلَعَلَا","لَغالَبَ وطلبَ العُلوَّ."],[23,91,"عَمَّا يَصِفُونَ","عن وصفِهم إيّاهُ بالشَّريكِ، والوَلَد."],[23,97,"هَمَزَٰتِ ٱلشَّيَٰطِينِ","وساوِسِهم، ونَزَغاتِهم."],[23,100,"بَرْزَخٌ","حاجزٌ دونَ الرَّجعة."],[23,102,"ثَقُلَتْ مَوَٰزِينُهُۥ","كثُرَتْ حسناتُه."],[23,104,"تَلْفَحُ","تُحرِق."],[23,104,"كَٰلِحُونَ","عابِسونَ قلَصَتْ شِفاهُهم، وبَرَزَتْ أسنانُهم."],[23,108,"ٱخْسَـُٔوا۟","اُمكُثوا أذِلَّاء."],[23,110,"فَٱتَّخَذْتُمُوهُمْ سِخْرِيًّا","اشتغلتُم بالاستهزاءِ بهم."],[23,113,"ٱلْعَآدِّينَ","الحُسَّابِ الذين يَعُدُّونَ الأيَّام."],[24,1,"وَفَرَضْنَٰهَا","أوجَبنا العملَ بأحكامِها."],[24,2,"طَآئِفَةٌ","جماعةٌ."],[24,4,"يَرْمُونَ","يَقذِفونَ بالزِّنى."],[24,4,"ٱلْمُحْصَنَٰتِ","العفيفاتِ، ومِثلُهنَّ العفيفون."],[24,8,"وَيَدْرَؤُا۟","يَدفعُ العُقوبة."],[24,11,"بِٱلْإِفْكِ","أشنَعِ الكَذِب، وهو رميُ أمِّ المؤمنينَ عائشةَ رضيَ اللهُ عنها بالزِّنى."],[24,11,"عُصْبَةٌ مِّنكُمْ","جماعةٌ منكم."],[24,11,"تَوَلَّىٰ كِبْرَهُۥ","تحمَّلَ مُعظَمَه."],[24,14,"أَفَضْتُمْ فِيهِ","خُضتُم فيه من حديثِ الإفك."],[24,15,"تَلَقَّوْنَهُۥ","تَتلقَّفونَه، وتَنقُلونَه."],[24,16,"بُهْتَٰنٌ","كَذِب."],[24,17,"يَعِظُكُمُ","يَنهاكم."],[24,21,"خُطُوَٰتِ ٱلشَّيْطَٰنِ","طُرُقَه، ومَذاهِبَه."],[24,21,"مَا زَكَىٰ","ما تَطهَّرَ من الذُّنوب."],[24,22,"وَلَا يَأْتَلِ","لا يَحلِف."],[24,22,"أُو۟لُوا۟ ٱلْفَضْلِ","أهلُ الفضلِ في الدِّين، والمال."],[24,23,"ٱلْغَٰفِلَٰتِ","العفيفاتِ اللَّواتي لم تَخطُرِ الفاحشةُ بقُلوبِهنَّ."],[24,23,"لُعِنُوا۟","طُرِدوا وأُبعِدوا من رحمةِ الله."],[24,25,"دِينَهُمُ ٱلْحَقَّ","جزاءَهم بالعَدل."],[24,27,"تَسْتَأْنِسُوا۟","تَستأذِنوا أهلَ البيوت، وسُمِّيَ الاستئذانُ استئناسًا؛ لأنَّه يُزيلُ الوحشةَ من القادم."],[24,28,"أَزْكَىٰ","أطهَر."],[24,29,"فِيهَا مَتَٰعٌ لَّكُمْ","فيها مَنفعةٌ، ومَصلحةٌ لكم؛ كالبيوتِ المُعَدَّةِ صدقةً للمُسافرين."],[24,31,"إِلَّا مَا ظَهَرَ مِنْهَا","إلا الثِّيابَ الظاهرةَ التي جرَتِ العادةُ بلُبسِها إذا لم يكن فيها فتنة."],[24,31,"وَلْيَضْرِبْنَ","ولْيُلقِينَ."],[24,31,"بِخُمُرِهِنَّ","بأغطيةِ رُؤوسِهنَّ."],[24,31,"عَلَىٰ جُيُوبِهِنَّ","على فَتَحاتِ صُدورِهنَّ، فيُغطِّينَ وُجوهَهُنَّ."],[24,31,"لِبُعُولَتِهِنَّ","لأزواجِهنَّ."],[24,31,"نِسَآئِهِنَّ","المسلِماتِ، وقيل: المُختصَّاتِ بهنَّ بالصُّحبةِ والخِدمة."],[24,31,"أُو۟لِى ٱلْإِرْبَةِ","الرِّجالِ الذين لا غَرَضَ لهم في النِّساء؛ كالبُلْه."],[24,31,"لَمْ يَظْهَرُوا۟","لا عِلمَ لهم بأمورِ العَوراتِ، وليس فيهم شَهوةٌ."],[24,31,"مَا يُخْفِينَ مِن زِينَتِهِنَّ","كالخَلاخِلِ التي تُلبَسُ في الأرجُل."],[24,32,"وَأَنكِحُوا۟","زَوِّجوا."],[24,32,"ٱلْأَيَٰمَىٰ","مَن لا زوجَ له."],[24,32,"عِبَادِكُمْ","عَبيدِكم."],[24,32,"وَإِمَآئِكُمْ","جَواريكم."],[24,33,"يَبْتَغُونَ","يَطلبون."],[24,33,"ٱلْكِتَٰبَ","المُكاتَبةَ، بأنْ يَشتَروا أنفُسَهم من أسيادِهم بمالٍ مُقسَّطٍ يُؤدُّونَه إليهم."],[24,33,"خَيْرًا","رُشدًا وقُدرةً على الكَسب."],[24,33,"فَتَيَٰتِكُمْ","جَواريكم."],[24,33,"ٱلْبِغَآءِ","الزِّنى."],[24,33,"تَحَصُّنًا","تعفُّفًا."],[24,35,"نُورُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ","أي: هو نورٌ، وكتابُه نورٌ، وبه استنارَتِ السَّمواتُ والأرضُ، يُدبِّرُ الأمرَ فيهما، ويَهدِي أهلَهما."],[24,35,"كَمِشْكَوٰةٍ","هي: الكَوَّةُ في الحائطِ غيرُ النَّافِذة."],[24,35,"دُرِّىٌّ","مُضيءٌ."],[24,36,"فِى بُيُوتٍ","هذا النُّورُ في مَساجِد."],[24,36,"تُرْفَعَ","تُعظَّمَ بالتَّعمير، والتَّطهير."],[24,36,"بِٱلْغُدُوِّ وَٱلْـَٔاصَالِ","أولَ النَّهار، وآخرَه."],[24,37,"يَوْمًا تَتَقَلَّبُ فِيهِ ٱلْقُلُوبُ","أي: بينَ الرَّجاءِ، والخوف."],[24,38,"بِغَيْرِ حِسَابٍ","بلا عدٍّ، ويُعطى من الأجرِ ما لا يَبلُغُه عملُ العامل."],[24,39,"كَسَرَابٍۭ","هو ما يُشاهَدُ كالماءِ على الأرضِ المُستويةِ في الظَّهيرة."],[24,39,"بِقِيعَةٍ","الأرضُ المُنخفِضةُ المُستوِيَة."],[24,40,"لُّجِّىٍّ","عميق."],[24,40,"يَغْشَىٰهُ","يَعلُوه."],[24,41,"صَٰٓفَّٰتٍ","باسِطاتٍ أجنحتَهنَّ في الهواء."],[24,43,"يُزْجِى","يَسوق."],[24,43,"يُؤَلِّفُ","يَجمَع."],[24,43,"رُكَامًا","مُتراكِمًا."],[24,43,"ٱلْوَدْقَ","المَطَر."],[24,43,"مِنْ خِلَٰلِهِۦ","مِن بينِه."],[24,43,"سَنَا بَرْقِهِۦ","ضَوءُ البَرق."],[24,49,"مُذْعِنِينَ","طائعينَ مُنقادين."],[24,50,"مَّرَضٌ","نِفاق."],[24,50,"ٱرْتَابُوٓا۟","شَكُّوا في النُّبوَّة."],[24,50,"يَحِيفَ","يَجُور."],[24,53,"جَهْدَ أَيْمَٰنِهِمْ","مُجتهدينَ في الحَلِفِ بالأيمان."],[24,53,"طَاعَةٌ مَّعْرُوفَةٌ","طاعتُكم معروفةٌ بأنَّها باللِّسانِ فقط."],[24,54,"عَلَيْهِ مَا حُمِّلَ","على الرَّسولِ فِعلُ ما أُمِرَ به من تبليغِ الرِّسالة."],[24,54,"وَعَلَيْكُم مَّا حُمِّلْتُمْ","عليكم فِعلُ ما كُلِّفتُم به من الامتثال."],[24,57,"مُعْجِزِينَ","فائتينَ من العذابِ بالهَرَب."],[24,58,"لَمْ يَبْلُغُوا۟ ٱلْحُلُمَ","أي: دونَ سِنِّ الاحتلامِ، والبُلوغ."],[24,58,"جُنَاحٌ","حَرَج."],[24,60,"وَٱلْقَوَٰعِدُ","العَجائزُ من النِّساءِ اللَّاتي قعَدْنَ عن الحَيضِ، والوَلَد، والاستمتاع؛ لكِبَرِهنَّ."],[24,60,"مُتَبَرِّجَٰتٍۭ","مُظهِراتٍ للزِّينةِ الخَفيَّة."],[24,61,"مَّا مَلَكْتُم مَّفَاتِحَهُۥٓ","البيوتِ التي وُكِّلتُم بحِفظِها في غَيبةِ أصحابِها."],[24,61,"أَشْتَاتًا","مُتفرِّقين."],[24,62,"أَمْرٍ جَامِعٍ","أمرٍ مُهِمٍّ من مَصالحِ المسلمينَ جُمِعوا له."],[24,63,"دُعَآءَ ٱلرَّسُولِ","نِداءَكم له بأنْ تقولوا: يا مُحمَّد! ولكن قولوا: يا رسولَ الله!"],[24,63,"يَتَسَلَّلُونَ مِنكُمْ","يَخرُجونَ خُفيةً بغيرِ إذن."],[24,63,"لِوَاذًا","يَستتِرُ بعضُهم ببعضٍ في الخُروج."],[24,63,"فِتْنَةٌ","مِحنةٌ، وشَرٌّ، وعذاب."],[25,1,"تَبَارَكَ","كَثُرَ خَيرُه، وعَظُمَتْ بَرَكتُه، وكَمُلَتْ صِفاتُه."],[25,1,"ٱلْفُرْقَانَ","القرآنُ الفارِقُ بينَ الحقِّ، والباطل."],[25,2,"فَقَدَّرَهُۥ","سوَّاهُ على ما يُناسِبُ من الخَلق."],[25,3,"نُشُورًا","بَعثًا بعدَ الموت."],[25,4,"إِفْكٌ ٱفْتَرَىٰهُ","كَذِبٌ اخترَعَه من عندِ نفسِه."],[25,4,"وَزُورًا","كَذِبًا شَنيعًا."],[25,5,"أَسَٰطِيرُ ٱلْأَوَّلِينَ","أحاديثُ الأُمَمِ القديمةِ المُسطَّرةُ في كُتُبِهم."],[25,5,"بُكْرَةً وَأَصِيلًا","أولَ النَّهارِ، وآخرَه."],[25,8,"جَنَّةٌ","بُستانٌ مُثمِر."],[25,9,"ضَرَبُوا۟ لَكَ ٱلْأَمْثَٰلَ","قالوا في حقِّكَ الأقوالَ العجيبةَ التي تُشبِهُ لغَرابتِها الأمثال."],[25,11,"سَعِيرًا","نارًا حارَّةً تُسعَّرُ بهم."],[25,12,"وَزَفِيرًا","صوتًا شديدًا من شدَّةِ الغَيظ."],[25,13,"مُقَرَّنِينَ","قُرِنَتْ أيديهم بالسَّلاسلِ إلى أعناقِهم."],[25,13,"ثُبُورًا","هَلاكًا."],[25,18,"بُورًا","هالِكين."],[25,19,"صَرْفًا","دَفعًا للعذاب."],[25,20,"فِتْنَةً","ابتلاءً، واختبارًا."],[25,21,"لَا يَرْجُونَ لِقَآءَنَا","لا يُؤمنونَ باليومِ الآخر."],[25,21,"وَعَتَوْ","تجاوَزوا الحدَّ في الطُّغيان."],[25,22,"حِجْرًا مَّحْجُورًا","تقولُ الملائكةُ لهم: الجنَّةُ مكانٌ مُحرَّمٌ عليكم."],[25,23,"هَبَآءً","كالهَباءِ، وهو ما يُرى في ضَوءِ الشَّمسِ من خفيفِ الغُبار."],[25,24,"مَقِيلًا","مَنزِلًا مُريحًا."],[25,25,"بِٱلْغَمَٰمِ","بالسَّحابِ الأبيضِ الرَّقيق."],[25,27,"سَبِيلًا","طريقًا إلى الجنَّة."],[25,32,"وَرَتَّلْنَٰهُ","بيَّنَّاه في تثبُّتٍ ومُهلة."],[25,38,"وَأَصْحَٰبَ ٱلرَّسِّ","أصحابَ البِئر."],[25,38,"وَقُرُونًا","أُمَمًا."],[25,39,"ٱلْأَمْثَٰلَ","الحُجَج."],[25,39,"تَبَّرْنَا","أهلَكْنا ودمَّرْنا."],[25,40,"مَطَرَ ٱلسَّوْءِ","حِجارةً من السَّماءِ أهلَكَتْهم."],[25,42,"كَادَ لَيُضِلُّنَا","قارَبَ أنْ يَصرِفَنا عن عبادةِ أصنامِنا."],[25,43,"أَرَءَيْتَ","أخبِرْني."],[25,45,"مَدَّ ٱلظِّلَّ","بسَطَه من طُلوعِ الفجرِ إلى طُلوعِ الشَّمس."],[25,45,"سَاكِنًا","ثابتًا مُستقِرًّا."],[25,47,"لِبَاسًا","ساترًا لكم بظَلامِه."],[25,47,"سُبَاتًا","راحةً لأبدانِكم."],[25,47,"نُشُورًا","وقتًا للانتشارِ والسَّعيِ في الأرض."],[25,48,"بُشْرًۢا","مُبشِّراتٍ بالرَّحمة، وهيَ المَطَر."],[25,50,"صَرَّفْنَٰهُ","أنزَلْنا المَطرَ على أرضٍ دونَ أخرى."],[25,52,"وَجَٰهِدْهُم بِهِۦ","بلِّغْهُمُ القرآنَ باذِلًا وُسعَك."],[25,52,"جِهَادًا كَبِيرًا","لا يُخالِطُه فُتور."],[25,53,"مَرَجَ","خَلَط."],[25,53,"فُرَاتٌ","شديدُ العُذوبة."],[25,53,"أُجَاجٌ","شديدُ المُلوحة."],[25,53,"بَرْزَخًا","حاجزًا يَمنعُ إفسادَ أحدِهما للآخر."],[25,53,"وَحِجْرًا مَّحْجُورًا","سِترًا يَمنعُ وُصولَ أحدِهما إلى الآخر."],[25,54,"ٱلْ  طَرْفُكَ","قبلَ ارتِدادِ أجفانِك إذا نظَرتَ إلى شَيء."],[27,40,"مُسْتَقِرًّا عِندَهُۥ","حاضِرًا لَدَيهِ ثابتًا عندَه."],[27,41,"نَكِّرُوا۟","غَيِّروا."],[27,44,"ٱلصَّرْحَ","القَصر، وكانَ صَحنُه من زُجاجٍ تحتَه ماء."],[27,44,"حَسِبَتْهُ لُجَّةً","ظنَّتْه ماءً غَزيرًا."],[27,44,"مُّمَرَّدٌ","مُمَلَّسٌ مُسوًّى."],[27,44,"مِّن قَوَارِيرَ","من زُجاجٍ صاف."],[27,47,"ٱطَّيَّرْنَا","تَشاءَمْنا."],[27,47,"طَٰٓئِرُكُمْ","ما أصابَكم من خيرٍ، أو شرٍّ، فاللهُ مُقدِّرُه عليكم."],[27,47,"تُفْتَنُونَ","تُختَبَرونَ بالسَّرَّاءِ، والضَّرَّاء."],[27,48,"ٱلْمَدِينَةِ","مَدينةِ صالحٍ عليه السلام، وهي الحِجرُ شَمالَ غَربِ الجَزيرةِ العَربيَّة."],[27,49,"تَقَاسَمُوا۟","حلَفَ كلُّ واحدٍ منهم للآخر."],[27,49,"لَنُبَيِّتَنَّهُۥ","لَنَأتِيَنَّهُ باللَّيلِ بَغتةً فنَقتُلَه."],[27,49,"لِوَلِيِّهِۦ","قَريبِه الذي يُطالِبُ بدَمِه."],[27,52,"خَاوِيَةً","خاليةً."],[27,54,"ٱلْفَٰحِشَةَ","الفَعْلةَ المُتناهيةَ في القُبح."],[27,54,"تُبْصِرُونَ","تَعلَمونَ قُبحَها."],[27,56,"يَتَطَهَّرُونَ","يَتنزَّهونَ عن إتيانِ الذُّكران."],[27,57,"قَدَّرْنَٰهَا","جعَلْنا امرأةَ لوط."],[27,57,"ٱلْغَٰبِرِينَ","الباقينَ في العذاب."],[27,58,"مَّطَرًا","حِجارةً من السَّماء."],[27,58,"فَسَآءَ","قَبُحَ."],[27,60,"ذَاتَ بَهْجَةٍ","ذاتَ مَنظَرٍ حَسَن."],[27,60,"يَعْدِلُونَ","يَجعَلونَ للهِ عِدْلًا ونَظيرًا."],[27,61,"خِلَٰلَهَآ","وسَطَها."],[27,61,"رَوَٰسِىَ","جِبالًا ثَوابِت."],[27,61,"ٱلْبَحْرَيْنِ","العَذبِ، والمالِح."],[27,62,"وَيَكْشِفُ ٱلسُّوٓءَ","يُزيلُ المَكروه."],[27,62,"خُلَفَآءَ ٱلْأَرْضِ","تَخلُفونَ مَن سبَقَكم في الأرض."],[27,63,"يَهْدِيكُمْ","يُرشِدُكم."],[27,63,"بُشْرًۢا","مُبشِّراتٍ بالمَطَر."],[27,65,"وَمَا يَشْعُرُونَ","ما يَعلَمون."],[27,65,"أَيَّانَ","مَتى؟"],[27,66,"ٱدَّٰرَكَ","تَكامَلَ أوِ انتَهى عِلمُهم وعَجَزَ عن مَعرِفةِ وقتِها."],[27,66,"عَمُونَ","عَمِيَتْ بَصائرُهم عنها."],[27,68,"أَسَٰطِيرُ ٱلْأَوَّلِينَ","ما سُطِّرَ القُدَماءُ من الأكاذيب."],[27,72,"رَدِفَ لَكُم","اقتَرَبَ لكم."],[27,74,"تُكِنُّ","تُخفي."],[27,75,"غَآئِبَةٍ","شَيءٍ غائبٍ عن الأبصار."],[27,75,"كِتَٰبٍ مُّبِينٍ","هو: اللَّوحُ المَحفوظ."],[27,80,"وَلَّوْا۟ مُدْبِرِينَ","أعرِضوا عنك."],[27,82,"وَقَعَ ٱلْقَوْلُ","وجَبَ العَذاب."],[27,82,"دَآبَّةً","الدَّابَّةُ: علامةٌ من علاماتِ السَّاعةِ الكُبرى تَخرُجُ، وتُحدِّثُ الناس، وتَسِمُهم على وُجوهِهم."],[27,82,"تُكَلِّمُهُمْ","تُحدِّثُهم فتقولُ: إنَّ الناسَ..."],[27,83,"نَحْشُرُ","نَجمَع."],[27,83,"فَوْجًا","جَماعةً."],[27,83,"يُوزَعُونَ","يُدفَعونَ أو يُحبَسُ أوَّلُ المُكذِّبينَ من كلِّ أُمَّةٍ على آخِرِهم؛ ليَجتَمِعوا، ثمَّ يُساقونَ إلى الحِساب."],[27,85,"وَوَقَعَ ٱلْقَوْلُ عَلَيْهِم","حقَّتْ عليهم كَلِمةُ العَذاب."],[27,85,"لَا يَنطِقُونَ","لا يَتكلَّمونَ بحُجَّةٍ تَدفَعُ العَذابَ عنهم."],[27,86,"مُبْصِرًا","يُبصِرونَ فيه."],[27,87,"ٱلصُّورِ","القَرْنِ الذي يَنفُخُ فيه إسرافيلُ عليه السلام."],[27,87,"دَٰخِرِينَ","صاغِرينَ أذِلَّاء."],[27,88,"وَتَرَى ٱلْجِبَالَ","تُبصِرُ الجِبالَ يومَ القيامة."],[27,88,"جَامِدَةً","واقِفةً مُستقِرَّة."],[27,88,"تَمُرُّ","تَسير."],[27,89,"بِٱلْحَسَنَةِ","بالتَّوحيدِ، والإيمانِ، والعِبادة."],[27,90,"بِٱلسَّيِّئَةِ","بالشِّركِ والكُفر."],[27,91,"ٱلْبَلْدَةِ","مَكَّة."],[27,91,"حَرَّمَهَا","جَعَلَها حَرامًا؛ فلا يُسفَكُ فيها دَمٌ، أو يُصادُ صَيدٌ، أو يُقطَعُ شَجَر."],[28,4,"عَلَا","تكبَّرَ، وطَغى."],[28,4,"شِيَعًا","طَوائفَ مُتفرِّقة."],[28,5,"نَّمُنَّ","نَتَفضَّلَ."],[28,7,"ٱلْيَمِّ","النَّهرِ، وهو نَهرُ النِّيل."],[28,8,"خَٰطِـِٔينَ","آثِمين."],[28,9,"قُرَّتُ عَيْنٍ لِّى","مَصدَرُ سُرورٍ لي."],[28,10,"فَٰرِغًا","خاليًا من كلِّ شَيءٍ إلا هَمَّ موسى عليه السلام."],[28,10,"لَتُبْدِى بِهِۦ","تُصرِّحُ بأنَّهُ ابنُها."],[28,11,"قُصِّيهِ","تَتبَّعي أثَرَه."],[28,11,"عَن جُنُبٍ","عن بُعد."],[28,12,"يَكْفُلُونَهُۥ لَكُمْ","يَقومونَ بتَربيَتِه وإرضاعِه."],[28,14,"بَلَغَ أَشُدَّهُۥ","قَويَ بَدنُه."],[28,14,"وَٱسْتَوَىٰٓ","تَكامَلَ عَقلُه."],[28,15,"مِن شِيعَتِهِۦ","من قَومِ موسى عليه السلام، وهم بنو إسرائيل."],[28,15,"فَوَكَزَهُۥ","ضَرَبَه بجُمعِ كَفِّه."],[28,17,"ظَهِيرًا","نَصيرًا."],[28,18,"يَتَرَقَّبُ","يَتوقَّعُ المَكروه."],[28,18,"يَسْتَصْرِخُهُۥ","يَطلُبُ منهُ النَّصر."],[28,18,"لَغَوِىٌّ","كثيرُ الغَوايةِ، ضالٌّ عنِ الرُّشد."],[28,22,"تِلْقَآءَ مَدْيَنَ","جِهَتَها."],[28,22,"سَوَآءَ ٱلسَّبِيلِ","الطَّريقَ الأحسَنَ إلى مَدْيَن."],[28,23,"تَذُودَانِ","تَحبِسانِ غَنَمَهما عنِ الماء."],[28,23,"مَا خَطْبُكُمَا","ما شأنُكما؟"],[28,23,"يُصْدِرَ ٱلرِّعَآءُ","يَنصرِفَ الرُّعاةُ بأغنامِهم عنِ الماء."],[28,23,"شَيْخٌ كَبِيرٌ","رَجُلٌ مُسِنٌّ وليسَ هو شُعَيبًا، خِلافًا للمَشهور."],[28,27,"تَأْجُرَنِى","تَكونَ أجيرًا لي في رَعيِ ماشِيَتي."],[28,27,"حِجَجٍ","سِنين."],[28,28,"ٱلْأَجَلَيْنِ","المُدَّتَين، الثَّمانِ أوِ العَشر."],[28,28,"فَلَا عُدْوَٰنَ عَلَىَّ","فلا أُطالَبَ بزيادةٍ في المُدَّة."],[28,28,"وَكِيلٌ","حافِظٌ يُراقِبُنا."],[28,29,"ءَانَسَ","أبصَرَ."],[28,29,"جَذْوَةٍ","شُعلةٍ من النَّار."],[28,29,"تَصْطَلُونَ","تَستَدفِئون."],[28,30,"شَٰطِئِ","جانِب."],[28,31,"تَهْتَزُّ","تَتحرَّكُ، وتَضطرِب."],[28,31,"جَآنٌّ","حَيَّةٌ خَفيفةٌ في سُرعةِ حَرَكتِها."],[28,31,"مُدْبِرًا","هاربًا جاعِلًا النَّارَ خَلفَ ظَهرِه."],[28,31,"وَلَمْ يُعَقِّبْ","لم يَلتَفِت."],[28,32,"ٱسْلُكْ","أدخِل."],[28,32,"جَيْبِكَ","فتحةِ قَميصِك."],[28,32,"مِنْ غَيْرِ سُوٓءٍ","من غيرِ بَرَصٍ، ولا مَرَض."],[28,32,"وَٱضْمُمْ إِلَيْكَ جَنَاحَكَ","ضُمَّ يَدَكَ إلى صَدرِك."],[28,32,"مِنَ ٱلرَّهْبِ","لِتَأمَنَ مِنَ الخَوف."],[28,32,"فَذَٰنِكَ","هاتانِ."],[28,32,"بُرْهَٰنَانِ","آيَتانِ."],[28,34,"رِدْءًا","عَونًا."],[28,35,"سَنَشُدُّ عَضُدَكَ","سنُقَوِّيكَ، ونُعينُك."],[28,35,"سُلْطَٰنًا","حُجَّةً، أو تسلُّطًا، وغَلَبةً."],[28,35,"فَلَا يَصِلُونَ إِلَيْكُمَا","فلا يُصيبُكُما منهم سُوء."],[28,35,"بِـَٔايَٰتِنَآ","بسَبَبِ آياتِنا."],[28,36,"مُّفْتَرًى","مُختَلَقٌ، تَنسُبُه إلى اللهِ كَذِبًا."],[28,37,"عَٰقِبَةُ ٱلدَّارِ","النِّهايةُ المَحمودةُ في الآخرة."],[28,38,"صَرْحًا","بِناءً عاليًا."],[28,40,"فَنَبَذْنَٰهُمْ فِى ٱلْيَمِّ","فأَلقَيناهم وأغرَقناهم في البَحر."],[28,41,"أَئِمَّةً","قادةً إلى النَّار."],[28,42,"وَأَتْبَعْنَٰهُمْ","أَلحَقناهم."],[28,42,"لَعْنَةً","طَردًا وإبعادًا من الرَّحمة."],[28,42,"ٱلْمَقْبُوحِينَ","المُبعَدينَ المُستقذَرةِ أفعالُهم."],[28,43,"ٱلْقُرُونَ ٱلْأُولَىٰ","الأُمَمَ الماضيةَ المُكذِّبة."],[28,43,"بَصَآئِرَ لِلنَّاسِ","نورًا لقُلوبِهم يُبصِرونَ به الحَقائق."],[28,44,"ٱلْغَرْبِىِّ","الجَبَلَ الغَربيَّ من موسى عليه السلام."],[28,44,"قَضَيْنَآ","عَهِدْنا."],[28,45,"أَنشَأْنَا","خَلَقْنا."],[28,45,"قُرُونًا","أُمَمًا."],[28,45,"فَتَطَاوَلَ عَلَيْهِمُ ٱلْعُمُرُ","فمَكَثوا زمنًا طويلًا."],[28,45,"ثَاوِيًا","مُقيمًا."],[28,45,"أَهْلِ مَدْيَنَ","هم قَومُ شُعَيبٍ عليه السلام."],[28,46,"ٱلطُّورِ","جَبَلٍ بسيناءَ كلَّمَ اللهُ موسى عليه السلام بجانِبِه."],[28,47,"تُصِيبَهُم مُّصِيبَةٌۢ","يَنزِلَ بهم عَذاب."],[28,48,"سِحْرَانِ تَظَٰهَرَا","تَعاوَنا، يَقصِدونَ التَّوراةَ والقُرآن."],[28,51,"وَصَّلْنَا","فصَّلْنا وبيَّنَّا."],[28,54,"مَرَّتَيْنِ","لإيمانِهم بكِتابِهم وبالقُرآن."],[28,54,"وَيَدْرَءُونَ","يَدفَعون."],[28,55,"ٱللَّغْوَ","الباطِل."],[28,55,"أَعْرَضُوا۟ عَنْهُ","لم يُصغُوا إليه."],[28,55,"سَلَٰمٌ عَلَيْكُمْ","لا تَسمَعونَ مِنَّا إلا الخَير؛ قد سَلِمتُم مِنَّا."],[28,55,"لَا نَبْتَغِى ٱلْجَٰهِلِينَ","لا نُريدُ طَريقةَ الغافِلينَ عنِ الحِكمةِ والحِلم."],[28,57,"نُتَخَطَّفْ","نُنتَزَعْ بسُرعةٍ بالقَتلِ، والأَسر."],[28,57,"يُجْبَىٰٓ","يُجلَبُ إليه."],[28,58,"وَكَمْ","كثيرًا!"],[28,58,"بَطِرَتْ مَعِيشَتَهَا","طَغَتْ وتَمرَّدَتْ في حَياتِها."],[28,59,"أُمِّهَا","أعظَمِها، وهيَ مَكَّةُ."],[28,61,"ٱلْمُحْضَرِينَ","ممَّنْ أُحضِروا للنَّار."],[28,63,"أَغْوَيْنَا","دَعَوناهم للغَوايةِ فاتَّبَعونا."],[28,66,"فَعَمِيَتْ","فخَفِيَتْ."],[28,66,"ٱلْأَنۢبَآءُ","الحُجَج."],[28,68,"وَيَخْتَارُ","يَصطَفي."],[28,68,"ٱلْخِيَرَةُ","الاختيار."],[28,69,"تُكِنُّ","تُخفي."],[28,71,"أَرَءَيْتُمْ","أخبِروني."],[28,71,"سَرْمَدًا","دائمًا باقيًا."],[28,75,"شَهِيدًا","رسولًا شاهِدًا يَشهَدُ على قَومِه بشِركِهم."],[28,75,"وَضَلَّ","ذَهَب."],[28,75,"يَفْتَرُونَ","يَختَلِقونَه من الكَذِب."],[28,76,"فَبَغَىٰ عَلَيْهِمْ","تجاوَزَ حَدَّه في الكِبرِ والتَّجَبُّرِ عليهم."],[28,76,"ٱلْكُنُوزِ","خَزائنِ الأموال."],[28,76,"مَفَاتِحَهُۥ","مَفاتيحِ خَزائنِ مالِه وصَناديقِه المُقفَلة."],[28,76,"لَتَنُوٓأُ بِٱلْعُصْبَةِ","لَيَثقُلُ حَملُها على الجَماعةِ الكَثيرة."],[28,76,"لَا تَفْرَحْ","لا تَبطَر."],[28,77,"وَٱبْتَغِ","اِلتَمِس واطلُب."],[28,77,"وَلَا تَنسَ نَصِيبَكَ","لا تَترُكْ حَظَّك."],[28,78,"ٱلْقُرُونِ","الأُمَم."],[28,78,"وَلَا يُسْـَٔلُ","أي: لا يُسأَلونَ سُؤالَ استِعلام؛ بل سُؤالَ تَوبيخٍ وتَقرير."],[28,80,"يُلَقَّىٰهَآ","يَتقبَّلُ النَّصيحةَ، ويُوفَّقُ للعَمَلِ بها."],[28,81,"فِئَةٍ","جُندٍ، وجَماعة."],[28,82,"وَيْكَأَنَّ","كَلِمةُ تَوجُّعٍ، وتَأسُّفٍ، وتَعجُّب."],[28,82,"وَيَقْدِرُ","يُضيِّق."],[28,82,"وَيْكَأَنَّهُۥ","أَلَم تَعلَمْ أنَّه؟"],[28,83,"عُلُوًّا","تَكبُّرًا."],[28,85,"فَرَضَ","أَنزَل."],[28,85,"لَرَآدُّكَ إِلَىٰ مَعَادٍ","لَمُرجِعُك إلى المَوضِعِ الذي خَرَجتَ منه، وهو مَكَّة."],[28,86,"تَرْجُوٓا۟","تُؤمَّل."],[28,86,"يُلْقَىٰٓ","يُنزَّل."],[28,86,"ظَهِيرًا","عَونًا."],[29,2,"لَا يُفْتَنُونَ","لا يُختَبَرونَ بالشَّدائد؛ ليَتبيَّنَ المؤمنُ من المُنافق."],[29,4,"يَسْبِقُونَا","يُعجِزونا، ويَفوتونا بأنفُسِهم."],[29,5,"أَجَلَ ٱللَّهِ","الوقتَ الذي حدَّدَه اللهُ للبَعث."],[29,10,"فِتْنَةَ ٱلنَّاسِ","عَذابَ الناسِ له، وأَذاهُم."],[29,12,"سَبِيلَنَا","دِينَنا."],[29,13,"أَثْقَالَهُمْ","أَوزارَهم."],[29,13,"يَفْتَرُونَ","يَختَلِقونَ من الكَذِب."],[29,17,"وَتَخْلُقُونَ إِفْكًا","تَفتَرونَ كَذِبًا."],[29,17,"فَٱبْتَغُوا۟","التَمِسوا واطلُبوا."],[29,20,"بَدَأَ ٱلْخَلْقَ","أَنشَأَه."],[29,21,"تُقْلَبُونَ","تُرَدُّونَ، وتُرجَعون."],[29,22,"بِمُعْجِزِينَ","فائتينَ من عَذابِه بالهَرَبِ وغَيرِه."],[29,25,"مَّوَدَّةَ بَيْنِكُمْ","تَتحابُّونَ على عِبادتِها، وتَتَوادُّونَ على خِدمَتِها."],[29,25,"يَكْفُرُ","يَتبَرَّأ."],[29,25,"وَمَأْوَىٰكُمُ","مَصيرُكم."],[29,26,"مُهَاجِرٌ","تارِكٌ دارَ قَومي إلى أرضِ الشَّامِ المُبارَكة."],[29,27,"أَجْرَهُۥ فِى ٱلدُّنْيَا","بالذِّكرِ الحَسَن، والوَلَدِ الصَّالِح والنُّبوَّةِ في ذُرِّيَّتِه."],[29,29,"وَتَقْطَعُونَ ٱلسَّبِيلَ","تَقطَعونَ طُرُقَ المُسافِرينَ بفِعلِكمُ الفاحِشةَ بهم."],[29,29,"نَادِيكُمُ","مَجلِسِكمُ الذي تَجتَمِعونَ فيه."],[29,29,"ٱلْمُنكَرَ","الأعمالَ المُنكَرة؛ كالسُّخريةِ مِنَ الناس، وقَذفِ المارَّة."],[29,31,"بِٱلْبُشْرَىٰ","بالخَبَرِ السَّارِّ، وهو: البِشارةُ بإسحاقَ عليه السلام."],[29,32,"ٱلْغَٰبِرِينَ","الباقينَ في العَذاب."],[29,33,"سِىٓءَ بِهِمْ","ساءَهُ مَجيئُهم خَوفًا عَليهِم من قَومِه أنْ يَفعَلوا بهمُ الفاحِشة."],[29,33,"وَضَاقَ بِهِمْ ذَرْعًا","ضاقَ صَدرُه، وحَزِنَ خَوفًا عَليهِم."],[29,34,"رِجْزًا","عَذابًا شَديدًا."],[29,35,"تَرَكْنَا مِنْهَآ","أَبقَينا مِن دِيارِهم."],[29,35,"ءَايَةًۢ بَيِّنَةً","آثارًا واضِحة."],[29,36,"وَٱرْجُوا۟ ٱلْيَوْمَ ٱلْـَٔاخِرَ","اطلُبوا بعِبادَتِكم جَزاءَ الآخِرة."],[29,36,"وَلَا تَعْثَوْا۟","لا تُكثِروا الفَساد."],[29,37,"ٱلرَّجْفَةُ","الزَّلزَلةُ الشَّديدة."],[29,37,"جَٰثِمِينَ","صَرعى هالِكين."],[29,38,"مُسْتَبْصِرِينَ","عارِفينَ بكُفرِهم مُعجَبينَ به."],[29,39,"سَٰبِقِينَ","فائتينَ من عَذابِ الله."],[29,40,"أَخَذْنَا بِذَنۢبِهِۦ","أَخَذْنا المَذكورينَ بعَذابِنا بسَبَبِ ذُنوبِهم."],[29,40,"حَاصِبًا","حِجارةً من طِينٍ مَنضود."],[29,40,"ٱلصَّيْحَةُ","صَوتٌ من السَّماءِ مُهلِك."],[29,41,"أَوْهَنَ","أَضعَف."],[29,43,"وَمَا يَعْقِلُهَآ","يَتدبَّرُها، ويَفهَمُها."],[29,45,"أَكْبَرُ","أَعظَمُ وأَفضَلُ من كلِّ شَيء."],[29,46,"ظَلَمُوا۟ مِنْهُمْ","عانَدوا الحَقَّ، وأَعلَنوا الحَرب."],[29,46,"مُسْلِمُونَ","خاضِعونَ مُتذلِّلونَ بالطَّاعة."],[29,47,"هَٰٓؤُلَآءِ","العَرَبِ من قُرَيش."],[29,50,"لَوْلَآ","هلَّا."],[29,50,"ءَايَٰتٌ","حُجَجٌ وبَراهينُ نُشاهِدُها؛ كناقةِ صالحٍ عليه السلام."],[29,53,"أَجَلٌ مُّسَمًّى","وقتُ عَذابِهمُ المُقدَّرُ عندَ الله."],[29,53,"بَغْتَةً","فجأةً."],[29,55,"يَغْشَىٰهُمُ","يُحيطُ بهم ويَعلوهم."],[29,58,"لَنُبَوِّئَنَّهُم","لَنُنزِلَنَّهم."],[29,58,"غُرَفًا","مَنازِلَ عاليةً."],[29,60,"وَكَأَيِّن مِّن","وكَم مِن؟"],[29,60,"لَّا تَحْمِلُ رِزْقَهَا","لا تَدَّخِرُه لغَد."],[29,61,"فَأَنَّىٰ يُؤْفَكُونَ","فكيفَ يُصرَفونَ عنِ الإيمان؟"],[29,62,"يَبْسُطُ","يُوسِّع."],[29,62,"وَيَقْدِرُ","يُضيِّق."],[29,64,"ٱلْحَيَوَانُ","الحَياةُ الحَقيقيَّةُ الكامِلةُ الدَّائمة."],[29,65,"ٱلْفُلْكِ","السُّفُن."],[29,67,"حَرَمًا ءَامِنًا","هي: مَكَّة."],[29,67,"وَيُتَخَطَّفُ ٱلنَّاسُ","يُستَلَبونَ بسُرعةٍ قَتلًا وأَسرًا."],[29,68,"مَثْوًى","مَسكَنٌ ومُستَقَرّ."],[30,2,"غُلِبَتِ ٱلرُّومُ","هَزَمَتْ فارِسُ الرُّوم."],[30,3,"أَدْنَى ٱلْأَرْضِ","أَقرَبِ أرضِ الشَّامِ إلى فارِس."],[30,3,"غَلَبِهِمْ","كَونِهم مَغلوبين."],[30,4,"بِضْعِ سِنِينَ","البِضعُ: مُدَّةٌ لا تَزيدُ على عَشرِ سَنَواتٍ، ولا تَنقُصُ عن ثَلاث."],[30,8,"وَأَجَلٍ مُّسَمًّى","وَقتٍ مُقدَّرٍ تَنتَهي إليه."],[30,9,"وَأَثَارُوا۟","حَرَثوا وزَرَعوا."],[30,10,"ٱلسُّوأَىٰٓ","العُقوبةُ المُتناهيةُ في السُّوء."],[30,12,"يُبْلِسُ","يَيأَسُ من النَّجاةِ من العَذاب."],[30,15,"يُحْبَرُونَ","يُكرَمونَ، ويُنعَّمون."],[30,16,"مُحْضَرُونَ","مُقيمون."],[30,18,"تُظْهِرُونَ","تَدخُلونَ وقتَ الظَّهيرة."],[30,22,"لِّلْعَٰلِمِينَ","جَمعُ عالِم، وهم ذَوُو العِلمِ والبَصيرة."],[30,23,"وَٱبْتِغَآؤُكُم مِّن فَضْلِهِۦٓ","طَلَبُكم للرِّزقِ في النَّهار."],[30,24,"خَوْفًا وَطَمَعًا","تَخافونَ من الصَّواعِق، وتَطمَعونَ في الغَيث."],[30,26,"قَٰنِتُونَ","مُطيعونَ مُنقادونَ لأمرِه."],[30,27,"وَلَهُ ٱلْمَثَلُ ٱلْأَعْلَىٰ","الوَصفُ الأعلى في كلِّ ما يُوصَفُ به."],[30,28,"فَأَنتُمْ فِيهِ سَوَآءٌ","مُتساوون."],[30,30,"حَنِيفًا","مائِلًا إلى الدِّين، مُستَقيمًا عليه."],[30,30,"فِطْرَتَ ٱللَّهِ","الزَمُوا دِينَ اللهِ، وهو الإسلام."],[30,30,"فَطَرَ ٱلنَّاسَ عَلَيْهَا","جَبَلَهم وطَبَعَهم عليها."],[30,30,"ٱلْقَيِّمُ","المُستَقيمُ المُوصِلُ إلى رِضا الله."],[30,31,"مُنِيبِينَ إِلَيْهِ","راجِعينَ إليه بالتَّوبةِ وإخلاصِ العَمَلِ له."],[30,32,"فَرَّقُوا۟ دِينَهُمْ","بَدَّلوا دِينَهم وغَيَّروه فأَخَذوا بَعضًا وتَرَكوا بَعضًا."],[30,32,"شِيَعًا","فِرَقًا وأَحزابًا."],[30,35,"سُلْطَٰنًا","بُرهانًا ساطِعًا وكِتابًا قاطِعًا."],[30,36,"رَحْمَةً","نِعمةً؛ من صِحَّةٍ، ورَخاء."],[30,36,"فَرِحُوا۟ بِهَا","فَرَحَ بَطَرٍ، وأَشَر، لا فَرَحَ شُكر."],[30,36,"سَيِّئَةٌۢ","فَقرٌ، ومَرَض."],[30,36,"يَقْنَطُونَ","يَيأَسونَ من زَوالِ البَلاء."],[30,37,"يَبْسُطُ","يُوسِّع."],[30,37,"وَيَقْدِرُ","يُضيِّق."],[30,39,"ءَاتَيْتُم","أَعطَيتُم."],[30,39,"رِّبًا","قَرضًا من المالِ بقَصدِ الرِّبا المُحَرَّم."],[30,39,"لِّيَرْبُوَا۟","لِيَزيد."],[30,39,"ٱلْمُضْعِفُونَ","الذين يُضاعِفُ اللهُ لهمُ الحَسَنات."],[30,41,"ٱلْفَسَادُ","كالجَدْب، والأمراض، والأَوبِئة."],[30,43,"ٱلْقَيِّمِ","المُستقيم."],[30,43,"لَّا مَرَدَّ لَهُۥ","لا يَقدِرُ أحدٌ على رَدِّه."],[30,43,"يَصَّدَّعُونَ","يَتفرَّقُ الخَلائقُ أَشتاتًا، ثمَّ مآلُهم إلى الجَنَّةِ، أوِ النَّار."],[30,44,"يَمْهَدُونَ","يُهيِّئونَ مَنازِلَهم في الجَنَّة."],[30,46,"مُبَشِّرَٰتٍ","تُبشِّرُ بالمَطَر."],[30,46,"ٱلْفُلْكُ","السُّفُن."],[30,46,"بِأَمْرِهِۦ","بإرادةِ اللهِ، ومَشيئتِه."],[30,48,"فَتُثِيرُ","تُحرِّكُ، وتَنشُر."],[30,48,"كِسَفًا","قِطَعًا مُتفرِّقة."],[30,48,"ٱلْوَدْقَ","المَطَر."],[30,48,"مِنْ خِلَٰلِهِۦ","من بَينِ السَّحاب."],[30,49,"لَمُبْلِسِينَ","يائِسينَ من نُزولِه."],[30,50,"رَحْمَتِ ٱللَّهِ","المَطَر."],[30,51,"مُصْفَرًّا","صارَ أَصفَرَ بعدَ خُضرَتِه؛ مِنَ الفَساد."],[30,54,"مِّن ضَعْفٍ","مِنَ النُّطفةِ المَهينة."],[30,54,"مِنۢ بَعْدِ ضَعْفٍ قُوَّةً","بعدَ ضَعفِ الطُّفولةِ قُوَّةَ الرُّجولة."],[30,54,"وَشَيْبَةً","شَيخوخةً، وهَرَمًا."],[30,55,"غَيْرَ سَاعَةٍ","غيرَ فَترةٍ قَصيرةٍ من الزَّمَن."],[30,55,"يُؤْفَكُونَ","يُصرَفونَ عنِ الحَقّ."],[30,57,"مَعْذِرَتُهُمْ","ما يُقدِّمونَه من أَعذار."],[30,57,"وَلَا هُمْ يُسْتَعْتَبُونَ","لا يُطلَبُ منهم إرضاءُ اللهِ بالطَّاعةِ والتَّوبة."],[30,59,"يَطْبَعُ","يَختِم."],[30,60,"وَلَا يَسْتَخِفَّنَّكَ","لا يَستَفِزَّنَّك، ولا يَحمِلَنَّكَ على الخِفَّةِ، والطَّيش."],[31,6,"لَهْوَ ٱلْحَدِيثِ","ما يُلهي عن طاعةِ الله؛ كالغِناء."],[31,6,"هُزُوًا","سُخريَّةً."],[31,7,"وَقْرًا","صَمَمًا."],[31,10,"رَوَٰسِىَ","جِبالًا ثابِتةً."],[31,10,"أَن تَمِيدَ","لِئلَّا تَضطَرِبَ وتَتحرَّكَ."],[31,10,"وَبَثَّ","نَشَر."],[31,10,"زَوْجٍ كَرِيمٍ","صِنفٍ بَهيجٍ نافِعٍ حَسَنِ المَنظَر."],[31,12,"ٱلْحِكْمَةَ","الفِقهَ في الدِّين، والإصابةَ في القَول."],[31,14,"وَهْنًا","ضَعفًا."],[31,14,"وَفِصَٰلُهُۥ","فِطامُه عنِ الرَّضاعة."],[31,15,"سَبِيلَ","طَريق."],[31,15,"أَنَابَ","رَجَعَ، وتابَ."],[31,16,"مِثْقَالَ","وَزْنَ، ومِقدار."],[31,16,"حَبَّةٍ مِّنْ خَرْدَلٍ","حَبَّةٌ صَغيرةٌ مُتناهيةٌ في الصِّغَر."],[31,16,"يَأْتِ بِهَا ٱللَّهُ","يَأتِ بها يومَ القيامة، ويُحاسِبْ عليها."],[31,17,"مِنْ عَزْمِ ٱلْأُمُورِ","مِنَ الأُمورِ التي يَنبَغي الحِرصُ عليها."],[31,18,"وَلَا تُصَعِّرْ خَدَّكَ","لا تُمِلْ وَجهَكَ كِبرًا وتَعاظُمًا."],[31,18,"مَرَحًا","مُختالًا مُتبَخترًا."],[31,18,"مُخْتَالٍ","مُتكبِّرٍ بفِعلِه."],[31,18,"فَخُورٍ","مُتكبِّرٍ بقَولِه."],[31,19,"وَٱقْصِدْ","تَواضَعْ، وكُنْ بَينَ المُسرِعِ، والمُبطِئ."],[31,19,"وَٱغْضُضْ","اخفِض."],[31,19,"أَنكَرَ","أَقبَحَ، وأَبغَض."],[31,20,"سَخَّرَ لَكُم","ذَلَّلَ لكم."],[31,20,"وَأَسْبَغَ","عَمَّكم بنِعَمِه."],[31,22,"يُسْلِمْ وَجْهَهُۥٓ","يُخلِصْ عِبادَتَه وقَصدَه إلى الله."],[31,22,"ٱسْتَمْسَكَ","تَعلَّقَ، واعتَصَم."],[31,22,"بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ","أَوثَقِ سَبَبٍ مُوصِلٍ إلى رِضوانِ الله."],[31,22,"عَٰقِبَةُ","مآلُ، ومَرجِع."],[31,24,"غَلِيظٍ","فَظيعٍ ثَقيل."],[31,29,"وَيُولِجُ","يُدخِلُ؛ بأنْ يَأخُذَ من ساعاتِ اللَّيلِ فيَطولَ النَّهارُ، والعَكس."],[31,31,"ٱلْفُلْكَ","السُّفُن."],[31,31,"بِنِعْمَتِ ٱللَّهِ","بأمرِ اللهِ ورَحمتِه."],[31,32,"غَشِيَهُم","عَلاهُم."],[31,32,"كَٱلظُّلَلِ","كالسَّحاب، أوِ الجِبالِ المُظِلَّة."],[31,32,"مُّقْتَصِدٌ","مُتوسِّطٌ لم يَقُمْ بشُكرِ اللهِ على وَجهِ الكَمال."],[31,32,"خَتَّارٍ","غَدَّارٍ ناقِضٍ للعَهد."],[31,32,"كَفُورٍ","جَحودٍ لنِعَمِ الله."],[31,33,"لَّا يَجْزِى وَالِدٌ","لا يُغني فيه والِد."],[31,33,"فَلَا تَغُرَّنَّكُمُ","فلا تَخدَعَنَّكم، وتُلهِيَنَّكم."],[31,33,"ٱلْغَرُورُ","ما يَغُرُّ ويَخدَعُ من شَيطانٍ وغَيرِه."],[32,3,"ٱفْتَرَىٰهُ","اختَلَقَه من عِندِ نَفسِه."],[32,4,"ٱسْتَوَىٰ","عَلا وارتَفَع؛ استواءً يَليقُ بجَلالِه وعَظَمَتِه."],[32,5,"يَعْرُجُ إِلَيْهِ","يَصعَدُ إليه."],[32,8,"نَسْلَهُۥ","ذُرِّيَّتَه."],[32,8,"سُلَٰلَةٍ","وهيَ النُّطفة؛ لأنَّها مُستَلَّةٌ من جَميعِ البَدَن."],[32,8,"مَّهِينٍ","ضَعيفٍ، رَقيق."],[32,10,"ضَلَلْنَا فِى ٱلْأَرْضِ","تَحوَّلْنا تُرابًا بعدَ المَوت."],[32,12,"نَاكِسُوا۟ رُءُوسِهِمْ","قد خَفَضوها، وأَطرَقوا خِزيًا ونَدَمًا."],[32,13,"حَقَّ ٱلْقَوْلُ","ثَبَتَ وتَحقَّقَ ووَجَب."],[32,13,"ٱلْجِنَّةِ","الجِنّ."],[32,16,"تَتَجَافَىٰ","تَرتَفِعُ، وتَتنحَّى للعِبادة."],[32,16,"ٱلْمَضَاجِعِ","فُرُشِ النَّوم."],[32,17,"مَّآ أُخْفِىَ لَهُم","ما ادُّخِرَ لهم من الجَزاء."],[32,17,"مِّن قُرَّةِ أَعْيُنٍ","ما يُفرِحُ، ويَسُرُّ."],[32,19,"ٱلْمَأْوَىٰ","التي يَأوونَ إليها، ويُقيمونَ بها."],[32,19,"نُزُلًا","ضِيافةً لهم."],[32,21,"ٱلْعَذَابِ ٱلْأَدْنَىٰ","البَلايا والمَصائبِ في الدُّنيا."],[32,23,"مِرْيَةٍ","شَكٍّ."],[32,23,"مِّن لِّقَآئِهِۦ","لِقاءِ موسى عليه السلام ليلةَ الإسراء."],[32,26,"أَوَلَمْ يَهْدِ لَهُمْ","أَوَلَمْ يَتبيَّنْ لهؤلاءِ المُكذِّبين؟"],[32,26,"كَمْ أَهْلَكْنَا","ما أَكثَرَ إهلاكَنا."],[32,26,"مِنَ ٱلْقُرُونِ","مِنَ الأُمَمِ السَّابِقة."],[32,27,"ٱلْجُرُزِ","اليابِسةِ، الغَليظةِ التي لا نَباتَ فيها."],[32,28,"ٱلْفَتْحُ","يَومُ العَذابِ الذي تَعِدُوننا."],[32,29,"يُنظَرُونَ","يُمهَلون."],[33,3,"وَكِيلًا","حافِظًا."],[33,4,"تُظَٰهِرُونَ مِنْهُنَّ","الظِّهارُ: أنْ يَقولَ الرَّجُلُ لامرَأتِه: أَنتِ عَليَّ كَظَهرِ أُمِّي."],[33,4,"أَدْعِيَآءَكُمْ","مَن تَبَنَّيتُموه من أَولادِ غَيرِكم."],[33,4,"ٱلسَّبِيلَ","طَريقَ الحَقِّ والرَّشاد."],[33,5,"أَقْسَطُ","أَعدَلُ وأَقوَم."],[33,5,"وَمَوَٰلِيكُمْ","أَولياؤُكم في الدِّين."],[33,5,"جُنَاحٌ","إِثْم."],[33,6,"أَوْلَىٰ بِٱلْمُؤْمِنِينَ","أَنفَعُ، وأَرأَفُ، وأَقرَبُ لهم من أَنفُسِهم في الدِّينِ والدُّنيا."],[33,6,"وَأَزْوَٰجُهُۥٓ أُمَّهَٰتُهُمْ","مِثلُ أُمَّهاتِهم؛ في تَحريمِ نِكاحِهنَّ، وتَعظيمِ حَقِّهنَّ."],[33,6,"وَأُو۟لُوا۟ ٱلْأَرْحَامِ","ذَوُو القَرابة."],[33,6,"كِتَٰبِ ٱللَّهِ","حُكمِ اللهِ، وشَرعِه."],[33,6,"مَّعْرُوفًا","بِرًّا، وصِلةً، وإحسانًا؛ فليسَ لهم حَقٌّ في المِيراث."],[33,6,"ٱلْكِتَٰبِ","اللَّوحِ المَحفوظ."],[33,6,"مَسْطُورًا","مُقدَّرًا مَكتوبًا."],[33,7,"مِيثَٰقَهُمْ","العَهدَ المُؤكَّدَ بتَبليغِ الرِّسالة."],[33,9,"جُنُودٌ","هم: الأَحزابُ حينَ اجتَمَعوا في غَزوةِ الخَندَق."],[33,10,"زَاغَتِ ٱلْأَبْصَٰرُ","شَخَصَتِ الأَبصارُ؛ حَيرةً ودَهشة."],[33,10,"ٱلظُّنُونَا۠","تَظُنُّونَ أنَّ اللهَ لا يَنصُرُ دِينَهُ ونَبِيَّه."],[33,11,"ٱبْتُلِىَ","امتُحِنَ."],[33,11,"وَزُلْزِلُوا۟","اضطَرَبوا."],[33,12,"مَّرَضٌ","شَكٌّ، وضَعفُ إيمان."],[33,12,"غُرُورًا","باطِلًا خادِعًا."],[33,13,"يَثْرِبَ","هو: الاسمُ الجاهِليُّ للمَدينة."],[33,13,"لَا مُقَامَ لَكُمْ","لا إقامةَ لكم في مَعرَكةٍ خاسِرة."],[33,13,"عَوْرَةٌ","غيرُ مُحصَّنة."],[33,14,"أَقْطَارِهَا","جَوانِبِ المَدينة."],[33,14,"ٱلْفِتْنَةَ","الشِّركَ باللهِ، والرُّجوعَ عنِ الإسلام."],[33,14,"لَأٓتَوْهَا","لأَجابوا إلى ذلكَ مُبادِرين."],[33,14,"تَلَبَّثُوا۟","تَأخَّروا."],[33,15,"يُوَلُّونَ ٱلْأَدْبَٰرَ","لا يَفِرُّونَ من المَعرَكة."],[33,17,"يَعْصِمُكُم","يَمنَعُكم."],[33,18,"ٱلْمُعَوِّقِينَ","المُثَبِّطينَ عنِ الجِهاد."],[33,18,"هَلُمَّ إِلَيْنَا","تَعالَوْا إلينا."],[33,18,"ٱلْبَأْسَ","القِتال."],[33,19,"أَشِحَّةً","بُخَلاءَ بأَموالِهم وأَنفُسِهم وجُهودِهم."],[33,19,"جَآءَ ٱلْخَوْفُ","حَضَرَ القِتال."],[33,19,"تَدُورُ أَعْيُنُهُمْ","خَوفًا، وهَلَعًا."],[33,19,"سَلَقُوكُم","رَمَوكُم."],[33,19,"حِدَادٍ","ذَرِبَةٍ، سَليطةٍ، مُؤذِية."],[33,19,"أَشِحَّةً عَلَى ٱلْخَيْرِ","بُخَلاءَ، وحَسَدةً عندَ قِسمةِ الغَنائم."],[33,20,"بَادُونَ","في البادِية."],[33,20,"أَنۢبَآئِكُمْ","أَخبارِكم."],[33,21,"أُسْوَةٌ","قُدوةٌ."],[33,23,"قَضَىٰ نَحْبَهُۥ","وَفَى بنَذرِه في نُصرةِ دِينِه، أو ماتَ شَهيدًا."],[33,25,"بِغَيْظِهِمْ لَمْ يَنَالُوا۟ خَيْرًا","مُغتاظينَ لم يَنالوا ما أَرادوا."],[33,26,"ظَٰهَرُوهُم","عاوَنوا الأَحزاب."],[33,26,"مِّنْ أَهْلِ ٱلْكِتَٰبِ","هم: يَهودُ بَني قُرَيظة."],[33,26,"صَيَاصِيهِمْ","حُصونِهم."],[33,26,"ٱلرُّعْبَ","الخَوفَ الشَّديد."],[33,28,"أُمَتِّعْكُنَّ","أُعطِكُنَّ مُتعةَ الطَّلاق؛ وهيَ مالٌ يُعطيهِ الزَّوجُ لمُطلَّقَتِه."],[33,28,"وَأُسَرِّحْكُنَّ","أُطلِّقْكُنَّ."],[33,28,"جَمِيلًا","بلا أَذًى، أو ضَرَر."],[33,30,"بِفَٰحِشَةٍ مُّبَيِّنَةٍ","مَعصيةٍ ظاهِرة."],[33,30,"ضِعْفَيْنِ","مَرَّتَين."],[33,31,"يَقْنُتْ مِنكُنَّ","تُطِعْ منكنَّ اللهَ ورَسولَه."],[33,31,"وَأَعْتَدْنَا","أَعدَدْنا."],[33,32,"ٱتَّقَيْتُنَّ","خِفتُنَّ اللهَ."],[33,32,"فَلَا تَخْضَعْنَ بِٱلْقَوْلِ","فلا تَتحدَّثْنَ مع الأَجانِبِ بصَوتٍ لَيِّن."],[33,32,"مَّرَضٌ","شَهوةٌ، ومَيلٌ إلى النِّساء."],[33,32,"قَوْلًا مَّعْرُوفًا","قَولًا بَعيدًا عنِ الرِّيبة."],[33,33,"وَقَرْنَ","الزَمْنَ."],[33,33,"وَلَا تَبَرَّجْنَ","لا تُظهِرْنَ مَحاسِنَكنَّ."],[33,33,"ٱلْجَٰهِلِيَّةِ ٱلْأُولَىٰ","التي قَبلَ الإسلام."],[33,33,"ٱلرِّجْسَ","الأَذى، والسُّوءَ، والإِثم."],[33,34,"وَٱلْحِكْمَةِ","أَحاديثِ الرَّسولِ صلى الله عليه وسلم."],[33,35,"وَٱلْقَٰنِتِينَ","المُطيعينَ، الخاضِعينَ للهِ."],[33,35,"وَٱلْخَٰشِعِينَ","الخائِفينَ مِنَ اللهِ، المُتواضِعين."],[33,35,"وَٱلْحَٰفِظِينَ فُرُوجَهُمْ","أي: عنِ الزِّنى، ومُقدِّماتِه، وعن كَشفِ العَورةِ ومَسِّها لمَنْ لا يَحِلُّ لهم."],[33,36,"وَمَا كَانَ","لا يَنبَغي."],[33,36,"قَضَى","حَكَم."],[33,36,"ٱلْخِيَرَةُ","الاختيار."],[33,37,"أَنْعَمَ ٱللَّهُ عَلَيْهِ","بالإسلام."],[33,37,"وَأَنْعَمْتَ عَلَيْهِ","بالعِتق، وهو زَيدُ بنُ حارِثةَ رضي الله عنه."],[33,37,"وَتُخْفِى فِى نَفْسِكَ","هو: ما أَوحاهُ اللهُ إليكَ مِن طَلاقِ زَيدٍ لامرَأَتِه، وزَواجِكَ مِنها."],[33,37,"مُبْدِيهِ","مُظهِرُه."],[33,37,"وَتَخْشَى ٱلنَّاسَ","تَخافُ مِنَ المُنافِقينَ أنْ يَقولوا: تَزوَّجَ مُحمَّدٌ امرَأَةَ مُتَبنَّاه."],[33,37,"قَضَىٰ زَيْدٌ مِّنْهَا وَطَرًا","طَلَّقَها."],[33,37,"حَرَجٌ","إِثْم."],[33,37,"أَدْعِيَآئِهِمْ","مَن كانوا يَتَبنَّونَهم."],[33,37,"وَطَرًا","حاجةً."],[33,38,"حَرَجٍ","إِثْم."],[33,42,"بُكْرَةً وَأَصِيلًا","أَوَّلَ النَّهارِ، وآخِرَه."],[33,49,"تَمَسُّوهُنَّ","تَدخُلوا بهنَّ، وتُجامِعوهنَّ."],[33,49,"عِدَّةٍ","مُدَّةٍ تَنتَظِرُ فيها المَرأة."],[33,49,"تَعْتَدُّونَهَا","تُحصُونَها عليهنَّ."],[33,49,"فَمَتِّعُوهُنَّ","أَعطُوهنَّ مِن أَموالِكم ما يَتمتَّعنَ به بحَسَبِ وُسعِكم؛ جَبرًا لخَواطِرِهنَّ."],[33,49,"وَسَرِّحُوهُنَّ","طَلِّقوهنَّ."],[33,49,"جَمِيلًا","بلا أَذًى، أو ضَرَر."],[33,50,"وَمَا مَلَكَتْ يَمِينُكَ","الإِماءُ التي تَكونُ مِلكًا خالِصًا لك."],[33,50,"أَفَآءَ ٱللَّهُ عَلَيْكَ","أَنعَمَ به عَليكَ بالجِهاد."],[33,50,"خَالِصَةً لَّكَ","خاصَّةً بك."],[33,50,"حَرَجٌ","ضِيق."],[33,51,"تُرْجِى","تُؤَخِّرُ القَسْمَ في المَبيت، عَمَّنْ شِئتَ مِن زَوجاتِك."],[33,51,"وَتُـْٔوِىٓ","تَضُمُّ في المَبيت."],[33,51,"ٱبْتَغَيْتَ","طَلَبتَ المَبيتَ عِندَها."],[33,51,"عَزَلْتَ","أَخَّرتَ قَسْمَها."],[33,51,"أَدْنَىٰٓ","أَقرَب."],[33,51,"أَن تَقَرَّ أَعْيُنُهُنَّ","أَنْ يَفرَحْنَ."],[33,52,"وَلَآ أَن تَبَدَّلَ","ولا أَنْ تُطلِّقَ إِحداهنَّ لتَستَبدِلَها بغَيرِها."],[33,52,"رَّقِيبًا","مُطَّلِعًا لا يَغيبُ عن عِلمِه شَيء."],[33,53,"نَٰظِرِينَ إِنَىٰهُ","مُنتَظِرينَ نُضجَه."],[33,53,"مَتَٰعًا","حاجةً مِن أَوانِي البَيتِ، ونَحوِها."],[33,55,"لَّا جُنَاحَ عَلَيْهِنَّ","لا إِثمَ عَليهنَّ في عَدَمِ الاحتِجاب."],[33,55,"وَلَا نِسَآئِهِنَّ","أي: النِّساءِ المُؤمِنات."],[33,55,"مَا مَلَكَتْ أَيْمَٰنُهُنَّ","العَبيدِ المَملوكينَ لَهُنَّ."],[33,56,"يُصَلُّونَ","صَلاةُ اللهِ: ثَناؤُه على عَبدِه في المَلَأِ الأَعلى، وصَلاةُ المَلائِكة: ثَناؤُهم ودُعاؤُهم."],[33,57,"يُؤْذُونَ ٱللَّهَ","يُشرِكونَ به، ويَعصُونَه."],[33,57,"لَعَنَهُمُ ٱللَّهُ","أَبعَدَهم، وطَرَدَهم مِن كُلِّ خَير."],[33,58,"ٱحْتَمَلُوا۟","ارتَكَبوا."],[33,58,"بُهْتَٰنًا","أَفحَشَ الكَذِبِ والزُّور."],[33,59,"يُدْنِينَ عَلَيْهِنَّ","يُرخِينَ على رُؤوسِهنَّ ووُجوهِهنَّ وصُدورِهنَّ."],[33,59,"جَلَٰبِيبِهِنَّ","الجِلبابُ: الرِّداءُ، والمِلحَفةُ التي تَستُرُ بَدَنَ المَرأةِ وزينَتَها."],[33,59,"أَدْنَىٰٓ","أَقرَب."],[33,59,"أَن يُعْرَفْنَ","يُمَيَّزْنَ بالسِّتر والصِّيانة؛ فلا يُتعرَّضَ لهنَّ بمَكروه."],[33,60,"مَّرَضٌ","شَكٌّ، ورِيبة."],[33,60,"وَٱلْمُرْجِفُونَ","الذين يَنشُرونَ الأَخبارَ الكاذِبة."],[33,60,"لَنُغْرِيَنَّكَ بِهِمْ","لَنُسَلِّطَنَّكَ عَليهم."],[33,60,"لَا يُجَاوِرُونَكَ","لا يُساكِنونَك."],[33,61,"ثُقِفُوٓا۟","وُجِدوا."],[33,62,"سُنَّةَ ٱللَّهِ","طَريقَتُه في المُنافِقين: القَتلَ، والأَسر."],[33,62,"خَلَوْا۟","مَضَوْا."],[33,62,"تَبْدِيلًا","تَحويلًا، وتَغييرًا."],[33,64,"سَعِيرًا","نارًا مُوقَدةً، شَديدةَ الحَرارة."],[33,67,"ٱلسَّبِيلَا۠","طَريقَ الهُدى."],[33,68,"ضِعْفَيْنِ","مِثلَيْن."],[33,69,"وَجِيهًا","عَظيمَ القَدر."],[33,70,"سَدِيدًا","مُوافِقًا للحَقِّ، خالِيًا مِنَ الكَذِبِ والباطِل."],[33,72,"ٱلْأَمَانَةَ","ما أَمَرَ اللهُ به، ونَهى عنه."],[33,72,"فَأَبَيْنَ","امتَنَعْنَ."],[33,72,"وَأَشْفَقْنَ","خِفْنَ مِنَ الخِيانةِ فيها."],[34,2,"يَلِجُ","يَدخُل."],[34,2,"يَعْرُجُ","يَصعَد."],[34,3,"لَا يَعْزُبُ","لا يَغيب."],[34,3,"مِثْقَالُ ذَرَّةٍ","وَزنُ نَملةٍ صَغيرة."],[34,5,"مُعَٰجِزِينَ","مُشاقِّينَ اللهَ، مُغالِبينَ أَمرَه."],[34,5,"عَذَابٌ مِّن رِّجْزٍ أَلِيمٌ","أَسوَأُ العَذاب، وأَشَدُّه أَلَمًا."],[34,6,"صِرَٰطِ","طَريق."],[34,7,"مُزِّقْتُمْ","مُتُّم، وتَفرَّقَتْ أَجسادُكم في الأَرض."],[34,8,"أَفْتَرَىٰ","أَخْتَلَقَ؟"],[34,8,"جِنَّةٌ","جُنون."],[34,9,"نَخْسِفْ بِهِمُ","نُغيِّبْهم في الأَرض."],[34,9,"كِسَفًا","قِطَعًا مِنَ العَذاب."],[34,9,"مُّنِيبٍ","راجِعٍ إلى ربِّه بالتَّوبةِ والطَّاعة."],[34,10,"فَضْلًا","نُبوَّةً، وعِلمًا، وكِتابًا ومُلكًا."],[34,10,"أَوِّبِى مَعَهُۥ","سَبِّحي مَعَه."],[34,11,"سَٰبِغَٰتٍ","دُروعًا تامَّاتٍ واسِعات."],[34,11,"وَقَدِّرْ فِى ٱلسَّرْدِ","قَدِّرِ المَسامِيرَ في حِلَقِ الدُّروعِ بأَلَّا تَكونَ الحِلَقُ صَغيرةً ضَعيفة، ولا كَبيرةً ثَقيلة."],[34,12,"غُدُوُّهَا شَهْرٌ","جَرَيانُها مِن أَوَّلِ النَّهارِ إلى انتِصافِه مَسيرةُ شَهرٍ بالسَّيرِ المُعتاد."],[34,12,"وَرَوَاحُهَا شَهْرٌ","جَرَيانُها مِن مُنتَصَفِ النَّهارِ إلى اللَّيلِ مَسيرةُ شَهرٍ بالسَّيرِ المُعتاد."],[34,12,"وَأَسَلْنَا","أَذَبْنَا."],[34,12,"عَيْنَ ٱلْقِطْرِ","عَينَ النُّحاس، فيَسيلُ له النُّحاسُ كالماء."],[34,12,"يَزِغْ","يَعدِلْ، ويَمِلْ."],[34,13,"مَحَٰرِيبَ","مَساجِدَ للعِبادة."],[34,13,"وَتَمَٰثِيلَ","صُوَرٍ مِن نُحاسٍ وزُجاج."],[34,13,"وَجِفَانٍ كَٱلْجَوَابِ","قِصاعٍ كَبيرةٍ؛ كالأَحواضِ التي يَجتَمِعُ فيها الماء."],[34,13,"وَقُدُورٍ رَّاسِيَٰتٍ","قُدورٍ ثابِتاتٍ لا تَتحرَّكُ مِن أَماكِنِها لعِظَمِها."],[34,14,"دَآبَّةُ ٱلْأَرْضِ","الأَرَضةُ التي تَأكُلُ الخَشَب."],[34,14,"مِنسَأَتَهُۥ","عَصاهُ التي كانَ مُتَّكِئًا عليها."],[34,14,"خَرَّ","وَقَعَ على الأَرضِ مَيِّتًا."],[34,14,"ٱلْعَذَابِ ٱلْمُهِينِ","العَمَلِ الشَّاقِّ الذي كلَّفَهم به سُليمانُ عليه السلام."],[34,15,"لِسَبَإٍ","قَبيلةٍ باليَمَن سُمُّوا باسمِ جَدِّهم."],[34,15,"ءَايَةٌ","دَلالةٌ على قُدرَتِنا."],[34,15,"جَنَّتَانِ","بُستانان."],[34,15,"بَلْدَةٌ طَيِّبَةٌ","كَريمةُ التُّربة، طَيِّبةُ الهَواء."],[34,16,"سَيْلَ ٱلْعَرِمِ","السَّيلَ الجارِفَ الشَّديدَ الذي خَرَّبَ السَّدَّ، وأَغرَقَ البَساتين."],[34,16,"ذَوَاتَىْ","صاحِبَتَيْ."],[34,16,"أُكُلٍ خَمْطٍ","ثَمَرٍ مُرٍّ، كَريهِ الطَّعم."],[34,16,"وَأَثْلٍ","شَجَرٍ مَعروفٍ شَبيهٍ بالطَّرْفاء، لا ثَمَرَ له."],[34,16,"سِدْرٍ","شَجَرِ النَّبْق، كَثيرِ الشَّوك."],[34,18,"ٱلْقُرَى ٱلَّتِى بَٰرَكْنَا فِيهَا","قُرى الشَّام."],[34,18,"قُرًى ظَٰهِرَةً","مُدُنًا مُتَّصِلةً يُرى بَعضُها مِن بَعض."],[34,18,"وَقَدَّرْنَا فِيهَا ٱلسَّيْرَ","جَعَلْنا السَّيرَ بَينَها على مَراحِلَ مُتقارِبة."],[34,19,"فَجَعَلْنَٰهُمْ أَحَادِيثَ","جَعَلْناهم عِبَرًا وأَحاديثَ لِمَنْ يَأتي بَعدَهم."],[34,19,"وَمَزَّقْنَٰهُمْ","فَرَّقْناهم في البِلاد."],[34,20,"صَدَّقَ عَلَيْهِمْ","حَقَّقَ عَليهم."],[34,21,"سُلْطَٰنٍ","قَهرٍ على الكُفر."],[34,22,"مِثْقَالَ ذَرَّةٍ","وَزنَ نَملةٍ صَغيرة."],[34,22,"شِرْكٍ","شَراكةٍ في الخَلق."],[34,22,"ظَهِيرٍ","مُعين."],[34,23,"فُزِّعَ","زالَ الفَزَعُ عن قُلوبِهم."],[34,26,"يَفْتَحُ","يَقضي."],[34,26,"بِٱلْحَقِّ","بالعَدل."],[34,26,"ٱلْفَتَّاحُ","الحاكِمُ بَينَ خَلقِه."],[34,31,"وَلَا بِٱلَّذِى بَيْنَ يَدَيْهِ","ولا بالذي تَقدَّمَه مِنَ التَّوراةِ والإنجيلِ والزَّبور."],[34,31,"مَوْقُوفُونَ","مَحبوسونَ في مَوقِفِ الحِساب."],[34,31,"يَرْجِعُ","يَرُدُّ بَعضُهم على بَعض."],[34,33,"بَلْ مَكْرُ ٱلَّيْلِ وَٱلنَّهَارِ","بَلْ تَدبيرُ الشَّرِّ لَنا باللَّيلِ والنَّهارِ هو الذي أَهلَكَنا."],[34,33,"ٱلنَّدَامَةَ","التَّحسُّر."],[34,36,"يَبْسُطُ","يُوسِّع."],[34,36,"وَيَقْدِرُ","يُضيِّق."],[34,37,"زُلْفَىٰٓ","قُربى."],[34,37,"جَزَآءُ ٱلضِّعْفِ","الثَّوابُ المُضاعَف."],[34,37,"ٱلْغُرُفَٰتِ","المَنازِلِ الرَّفيعةِ في الجَنَّة."],[34,38,"يَسْعَوْنَ فِىٓ ءَايَٰتِنَا","يَجهَدونَ في إِبطالِ حُجَجِنا."],[34,38,"مُعَٰجِزِينَ","مُشاقِّينَ يَظُنُّونَ أَنَّهم يَفوتونَنا."],[34,38,"مُحْضَرُونَ","تُحضِرُهمُ الزَّبانِيةُ إلى جَهنَّم."],[34,39,"وَيَقْدِرُ لَهُۥ","يُضيِّقُه عليه."],[34,41,"سُبْحَٰنَكَ","نُنزِّهُك."],[34,41,"أَنتَ وَلِيُّنَا","أَنتَ الذي نُوالِيه ونَعبُدُه."],[34,43,"إِفْكٌ مُّفْتَرًى","كَذِبٌ مُختَلَق."],[34,44,"يَدْرُسُونَهَا","يَقرَؤونَها."],[34,45,"مِعْشَارَ مَآ ءَاتَيْنَٰهُمْ","عُشْرَ ما أَعطَيناكم مِنَ القُوَّةِ والنِّعَم."],[34,45,"نَكِيرِ","إِنكاري عَليهم."],[34,46,"بِوَٰحِدَةٍ","بخَصْلةٍ واحِدة."],[34,46,"مَثْنَىٰ","اثنَيْنِ اثنَيْن."],[34,46,"جِنَّةٍ","جُنون."],[34,48,"يَقْذِفُ بِٱلْحَقِّ","يَرمي بحُجَجِ الحَقِّ على الباطِل؛ فيَدمَغُه."],[34,51,"فَزِعُوا۟","خافوا عندَ مُعايَنةِ العَذاب."],[34,51,"فَلَا فَوْتَ","فلا نَجاةَ لهم، ولا مَهرَب."],[34,52,"ٱلتَّنَاوُشُ","كَيفَ لهم تَناوُلُ الإيمانِ، وهم في الآخِرة؟"],[34,53,"وَيَقْذِفُونَ بِٱلْغَيْبِ","يَرمونَ بالظُّنونِ الكاذِبة."],[34,54,"بِأَشْيَاعِهِم","أَمثالِهم مِن كُفَّارِ الأُمَمِ السَّابِقة."],[34,54,"مُرِيبٍ","مُحدِثٍ للرِّيبةِ والقَلَق."],[35,1,"فَاطِرِ","خالِق، ومُبدِع."],[35,1,"أُو۟لِىٓ","أَصحاب."],[35,3,"فَأَنَّىٰ تُؤْفَكُونَ","كَيفَ تُصرَفونَ عن تَوحيدِه؟!"],[35,5,"فَلَا تَغُرَّنَّكُمُ","لا تَخدَعَنَّكم، ولا تُلهِيَنَّكم."],[35,5,"ٱلْغَرُورُ","الشَّيطان."],[35,6,"حِزْبَهُۥ","أَتباعَه."],[35,8,"فَلَا تَذْهَبْ نَفْسُكَ","فلا تُهلِكْها."],[35,8,"حَسَرَٰتٍ","حُزنًا على كُفرِ هؤلاءِ الضَّالِّين."],[35,9,"فَتُثِيرُ","تُحرِّك."],[35,9,"مَّيِّتٍ","مُجدِب."],[35,10,"ٱلْعِزَّةَ","الشَّرَف، والمَنَعَة."],[35,10,"ٱلْكَلِمُ ٱلطَّيِّبُ","الكَلامُ الحَسَن؛ وهو ذِكرُ الله."],[35,10,"يَبُورُ","يَفسُد، ويَبطُل."],[35,11,"أَزْوَٰجًا","ذُكورًا وإِناثًا."],[35,11,"مُّعَمَّرٍ","طَويلِ العُمُر."],[35,11,"فِى كِتَٰبٍ","هو: اللَّوحُ المَحفوظ."],[35,12,"فُرَاتٌ","شَديدُ العُذوبة."],[35,12,"سَآئِغٌ","سَهلٌ مُرورُه في الحَلق."],[35,12,"أُجَاجٌ","شَديدُ المُلوحة."],[35,12,"لَحْمًا طَرِيًّا","هو: السَّمَك."],[35,12,"حِلْيَةً","هيَ: اللُّؤلُؤُ، والمَرجان."],[35,12,"ٱلْفُلْكَ","السُّفُن."],[35,12,"مَوَاخِرَ","تَشُقُّ المِياه."],[35,13,"يُولِجُ","يُدخِلُ مِن ساعاتِ اللَّيلِ في النَّهار، والعَكس، فتَحدُثُ الزِّيادةُ والنَّقصُ فيهما."],[35,13,"وَسَخَّرَ","ذَلَّل."],[35,13,"لِأَجَلٍ مُّسَمًّى","لِوَقتٍ مَعلومٍ مُقدَّر."],[35,13,"قِطْمِيرٍ","هي: القِشرةُ الرَّقيقةُ البَيضاءُ على النَّواة."],[35,14,"يَكْفُرُونَ بِشِرْكِكُمْ","يَتبرَّؤونَ مِنكم."],[35,18,"وَلَا تَزِرُ","لا تَحمِل."],[35,18,"وَازِرَةٌ","نَفسٌ مُذنِبة."],[35,18,"وِزْرَ أُخْرَىٰ","ذَنبَ نَفسٍ أُخرى."],[35,18,"تَدْعُ","تَسأَل."],[35,18,"مُثْقَلَةٌ","نَفسٌ مُثقَلةٌ بالخَطايا."],[35,18,"حِمْلِهَا","ذُنوبِها التي أَثقَلَتْها."],[35,18,"تَزَكَّىٰ","تَطهَّرَ مِنَ الشِّركِ والمَعاصي."],[35,18,"ٱلْمَصِيرُ","المآلُ والمَرجِع."],[35,21,"ٱلْحَرُورُ","الرِّيحُ الحارَّة."],[35,25,"وَبِٱلزُّبُرِ","الكُتُبِ المَجموعِ فيها كَثيرٌ مِنَ الأَحكام."],[35,26,"نَكِيرِ","إِنكاري عليهم، وعُقوبَتي لهم."],[35,27,"جُدَدٌۢ","ذاتُ طَرائقَ وخُطوطٍ مُختلِفةِ الأَلوان."],[35,27,"وَغَرَابِيبُ سُودٌ","شَديدةُ السَّواد؛ كالأَغرِبة."],[35,29,"لَّن تَبُورَ","لَنْ تَكسُدَ، وتَهلِك."],[35,31,"لِّمَا بَيْنَ يَدَيْهِ","مِنَ الكُتُبِ السَّابِقة."],[35,32,"أَوْرَثْنَا","أَعطَيْنا."],[35,32,"ظَالِمٌ لِّنَفْسِهِۦ","بفِعلِ بَعضِ المَعاصي."],[35,32,"مُّقْتَصِدٌ","يُؤدِّي الواجِبات، ويَجتَنِبُ المُحرَّمات."],[35,32,"سَابِقٌۢ بِٱلْخَيْرَٰتِ","مُجتَهِدٌ في عَمَلِ الصَّالِحات: فَرضِها ونَفلِها."],[35,33,"عَدْنٍ","إِقامة."],[35,35,"أَحَلَّنَا","أَنزَلَنا."],[35,35,"دَارَ ٱلْمُقَامَةِ","دارَ الإِقامةِ الدَّائِمة."],[35,35,"نَصَبٌ","تَعَبٌ، ومَشَقَّة."],[35,35,"لُغُوبٌ","إِعياءٌ وتَعَب."],[35,37,"يَصْطَرِخُونَ","يَصيحونَ بشِدَّةٍ، ويَستَغيثون."],[35,37,"ٱلنَّذِيرُ","نَبيُّنا مُحمَّدٌ صلى الله عليه وسلم."],[35,39,"خَلَٰٓئِفَ","يَخلُفُ بَعضُكم بَعضًا في الأَرض."],[35,39,"مَقْتًا","بُغضًا وغَضَبًا."],[35,40,"أَرَءَيْتُمْ","أَخبِروني."],[35,40,"بَيِّنَتٍ مِّنْهُ","حُجَّةٍ مِنه."],[35,40,"غُرُورًا","خِداعًا وباطِلًا."],[35,42,"جَهْدَ أَيْمَٰنِهِمْ","مُجتَهِدينَ في الحَلِفِ بأَغلَظِ الأَيمان."],[35,42,"نَذِيرٌ","رَسولٌ مِن عِندِ اللهِ تَعالى."],[35,43,"يَحِيقُ","يُحيطُ، ويَنزِل."],[35,43,"يَنظُرُونَ","يَنتَظِرون."],[35,43,"سُنَّتَ ٱلْأَوَّلِينَ","العَذابَ الذي نَزَلَ بأَمثالِهم."],[36,1,"يسٓ","مِنَ الحُروفِ المُقطَّعة، والمُرادُ مِنها: بَيانُ أَنَّ القُرآنَ مُكوَّنٌ مِن هذه الحُروف؛ ومَعَ هذا فهو مُعجِز، ولَيسَ «يس» اسمًا للنَّبيِّ صلى الله عليه وسلم."],[36,4,"صِرَٰطٍ مُّسْتَقِيمٍ","طَريقٌ مُعتَدِلٌ لا عِوَجَ فيه؛ وهو الإسلام."],[36,7,"حَقَّ ٱلْقَوْلُ","وَجَبَ العَذاب."],[36,8,"فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًا","جُمِعَتْ أَيديهم إلى أَعناقِهم؛ تَمثيلٌ لشِدَّةِ إِعراضِهم."],[36,8,"مُّقْمَحُونَ","رافِعونَ رُؤوسَهم، لا يَستَطيعونَ خَفضَها."],[36,9,"سَدًّا","حاجِزًا، ومانِعًا."],[36,9,"فَأَغْشَيْنَٰهُمْ","أَعمَينا أَبصارَهم."],[36,11,"بِٱلْغَيْبِ","عِندَما يَغيبُ عنِ الناس، لا يَراهُ إلا الله."],[36,12,"وَءَاثَٰرَهُمْ","ما سَنُّوه، وأَبقَوهُ مِن خَيرٍ وشَرّ."],[36,12,"إِمَامٍ مُّبِينٍ","كِتابٍ واضِح؛ وهو: اللَّوحُ المَحفوظ."],[36,14,"فَعَزَّزْنَا","أَيَّدْنا، وقَوَّيْنا."],[36,18,"تَطَيَّرْنَا بِكُمْ","تَشاءَمْنا بكم."],[36,19,"طَٰٓئِرُكُم مَّعَكُمْ","شُؤمُكم، وأَعمالُكم مِنَ الشِّركِ والشَّرِّ مَعَكم، ومَردودةٌ عليكم."],[36,19,"أَئِن ذُكِّرْتُم","أَإنْ وُعِظتُم تَشاءَمتُم؟!"],[36,20,"يَسْعَىٰ","يُسْرِعُ فِي مَشْيِهِ."],[36,22,"فَطَرَنِى","خَلَقَنِي."],[36,29,"خَٰمِدُونَ","مَيِّتُونَ، هَامِدُونَ."],[36,31,"ٱلْقُرُونِ","الأُمَمِ السَّابِقَةِ."],[36,32,"لَّمَّا","إِلَّا."],[36,32,"مُحْضَرُونَ","نُحْضِرُهُمْ لِلْجَزَاءِ وَالحِسَابِ."],[36,36,"ٱلْأَزْوَٰجَ","الأَصْنَافَ، وَالأَنْوَاعَ."],[36,37,"نَسْلَخُ","نَنْزِعُ."],[36,39,"قَدَّرْنَٰهُ مَنَازِلَ","قَدَّرْنَا سَيْرَهُ مِنْ أَوَّلِ الشَّهْرِ إِلَى آخِرِهِ فِي مَنَازِلَ."],[36,39,"ٱلْعُرْجُونِ ٱلْقَدِيمِ","مِثْلِ عِذْقِ النَّخْلَةِ الْمُتَقَوِّسِ فِي الرِّقَّةِ، وَالانْحِنَاءِ، وَالصُّفْرَةِ؛ لِقِدَمِهِ."],[36,40,"يَسْبَحُونَ","يَجْرُونَ."],[36,41,"حَمَلْنَا ذُرِّيَّتَهُمْ","حَمَلْنَا مَنْ نَجَا مِنْ وَلَدِ آدَمَ عليه السلام فِي سَفِينَةِ نُوحٍ عليه السلام."],[36,43,"فَلَا صَرِيخَ","فَلَا مُغِيثَ."],[36,49,"مَا يَنظُرُونَ","مَا يَنْتَظِرُونَ."],[36,49,"صَيْحَةً وَٰحِدَةً","هِيَ: نَفْخَةُ الفَزَعِ عِنْدَ قِيَامِ السَّاعَةِ."],[36,49,"يَخِصِّمُونَ","يَخْتَصِمُونَ فِي شُؤُونِ حَيَاتِهِمْ."],[36,51,"ٱلصُّورِ","الْقَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ عليه السلام."],[36,51,"ٱلْأَجْدَاثِ","الْقُبُورِ."],[36,51,"يَنسِلُونَ","يُسْرِعُونَ فِي الْخُرُوجِ."],[36,52,"مَّرْقَدِنَا","قُبُورِنَا."],[36,53,"صَيْحَةً وَٰحِدَةً","نَفْخَةً وَاحِدَةً فِي الْقَرْنِ."],[36,53,"مُحْضَرُونَ","مَاثِلُونَ لِلْحِسَابِ."],[36,55,"فِى شُغُلٍ","مَشْغُولُونَ بِالنَّعِيمِ عَمَّا سِوَاهُ."],[36,56,"ٱلْأَرَآئِكِ","الأَسِرَّةِ الْمُزَيَّنَةِ."],[36,59,"وَٱمْتَٰزُوا۟","تَمَيَّزُوا وَانْفَصِلُوا عَنِ الْمُؤْمِنِينَ."],[36,61,"هَٰذَا صِرَٰطٌ مُّسْتَقِيمٌ","عِبَادَتِي وَمَعْصِيَةُ الشَّيْطَانِ طَرِيقٌ قَوِيمٌ."],[36,62,"جِبِلًّا","خَلْقًا."],[36,65,"نَخْتِمُ","نَطْبَعُ."],[36,66,"فَٱسْتَبَقُوا۟ ٱلصِّرَٰطَ","بَادَرُوا إِلَى الطَّرِيقِ؛ لِيَجْتَازُوهُ."],[36,67,"لَمَسَخْنَٰهُمْ","لَغَيَّرْنَا خَلْقَهُمْ."],[36,67,"مَكَانَتِهِمْ","أَمَاكِنِهِمْ."],[36,67,"مُضِيًّا","أَنْ يَمْضُوا أَمَامَهُمْ."],[36,68,"نُعَمِّرْهُ","نُطِلْ عُمُرَهُ."],[36,68,"نُنَكِّسْهُ فِى ٱلْخَلْقِ","نُعِدْهُ إِلَى الْحَالَةِ الَّتِي ابْتَدَأَهَا؛ وَهِيَ الضَّعْفُ."],[36,72,"وَذَلَّلْنَٰهَا","سَخَّرْنَاهَا."],[36,72,"رَكُوبُهُمْ","مَا يَرْكَبُونَهُ فِي الأَسْفَارِ."],[36,77,"خَصِيمٌ","كَثِيرُ الْخِصَامِ."],[36,78,"رَمِيمٌ","بَالِيَةٌ، مُتَفَتِّتَةٌ."],[37,1,"وَٱلصَّٰٓفَّٰتِ","قَسَمٌ بِالمَلَائِكَةِ حِينَ تَصُفُّ فِي عِبَادَتِهَا."],[37,2,"فَٱلزَّٰجِرَٰتِ","قَسَمٌ بِالمَلَائِكَةِ حِينَ تَزْجُرُ السَّحَابَ، وَتَسُوقُهُ."],[37,3,"فَٱلتَّٰلِيَٰتِ","قَسَمٌ بِالمَلَائِكَةِ حِينَ تَتْلُو ذِكْرَ اللهِ، وَكَلَامَهُ."],[37,7,"مَّارِدٍ","جِنِّيٍّ مُتَمَرِّدٍ، خَارِجٍ عَنِ الطَّاعَةِ."],[37,8,"وَيُقْذَفُونَ","يُرْجَمُونَ."],[37,9,"دُحُورًا","طَرْدًا لِلشَّيَاطِينِ عَنِ الاسْتِمَاعِ."],[37,9,"وَاصِبٌ","دَائِمٌ مُوجِعٌ."],[37,10,"خَطِفَ ٱلْخَطْفَةَ","اخْتَلَسَ الكَلِمَةَ؛ مُسَارَقَةً بِسُرْعَةٍ."],[37,10,"شِهَابٌ","مَا يُرَى كَالكَوْكَبِ يَنْقَضُّ مِنَ السَّمَاءِ بِسُرْعَةٍ."],[37,10,"ثَاقِبٌ","مُضِيءٌ."],[37,11,"خَلَقْنَٰهُمْ","خَلَقْنَا أَبَاهُمْ آدَمَ عليه السلام."],[37,11,"لَّازِبٍ","لَزِجٍ يَلْتَصِقُ بَعْضُهُ بِبَعْضٍ."],[37,18,"دَٰخِرُونَ","صَاغِرُونَ، أَذِلَّاءُ."],[37,19,"زَجْرَةٌ","نَفْخَةٌ."],[37,22,"ٱحْشُرُوا۟","اجْمَعُوا."],[37,22,"وَأَزْوَٰجَهُمْ","نُظَرَاءَهُمْ، وَقُرَنَاءَهُمْ فِي الدُّنْيَا."],[37,23,"فَٱهْدُوهُمْ","سُوقُوهُمْ سَوْقًا عَنِيفًا."],[37,24,"وَقِفُوهُمْ","احْبِسُوهُمْ قَبْلَ أَنْ يَصِلُوا إِلَى جَهَنَّمَ."],[37,28,"عَنِ ٱلْيَمِينِ","مِنْ قِبَلِ الحَقِّ وَالدِّينِ."],[37,30,"سُلْطَٰنٍۭ","حُجَّةٍ، أَوْ قُوَّةٍ."],[37,30,"طَٰغِينَ","مُجَاوِزِينَ الحَدَّ فِي العِصْيَانِ."],[37,31,"فَحَقَّ عَلَيْنَا","وَجَبَ عَلَيْنَا."],[37,40,"ٱلْمُخْلَصِينَ","الَّذِينَ أَخْلَصُوا فِي عِبَادَةِ اللهِ؛ فَأَخْلَصَهُمْ، وَاخْتَصَّهُمْ بِرَحْمَتِهِ."],[37,45,"بِكَأْسٍ","بِخَمْرٍ."],[37,45,"مِّن مَّعِينٍ","مِنْ أَنْهَارٍ جَارِيَةٍ لَا يَخَافُونَ انْقِطَاعَهَا."],[37,47,"غَوْلٌ","لَيْسَ فِيهَا مَا يَغْتَالُ عُقُولَهُمْ."],[37,47,"يُنزَفُونَ","لَا يَسْكَرُونَ، وَلَا تَضُرُّ أَبْدَانَهُمْ."],[37,48,"قَٰصِرَٰتُ ٱلطَّرْفِ","عَفِيفَاتٌ لَا يَنْظُرْنَ إِلَى غَيْرِ أَزْوَاجِهِنَّ."],[37,48,"عِينٌ","حِسَانُ الأَعْيُنِ."],[37,49,"مَّكْنُونٌ","لَمْ تَمَسَّهُ الأَيْدِي."],[37,51,"قَرِينٌ","صَاحِبٌ مُلَازِمٌ لِي."],[37,53,"لَمَدِينُونَ","لَمَجْزِيُّونَ، وَمُحَاسَبُونَ."],[37,56,"إِن كِدتَّ","إِنَّكَ قَارَبْتَ."],[37,56,"لَتُرْدِينِ","لَتُهْلِكُنِي بِضَلَالِكَ، وَإِغْوَائِكَ."],[37,57,"ٱلْمُحْضَرِينَ","مَنْ أُحْضِرُوا فِي العَذَابِ مَعَكَ."],[37,62,"نُزُلًا","ضِيَافَةً."],[37,62,"شَجَرَةُ ٱلزَّقُّومِ","شَجَرَةٌ خَبِيثَةٌ، مَلْعُونَةٌ، مِنْ طَعَامِ أَهْلِ النَّارِ."],[37,63,"فِتْنَةً","ابْتِلَاءً لَهُمْ؛ حَيْثُ كَذَّبُوا بِوُجُودِ شَجَرَةٍ فِي النَّارِ."],[37,64,"أَصْلِ ٱلْجَحِيمِ","قَعْرِ جَهَنَّمَ."],[37,65,"طَلْعُهَا","ثَمَرُهَا."],[37,67,"لَشَوْبًا","لَخَلْطًا، وَمِزَاجًا."],[37,67,"حَمِيمٍ","مِنْ مَاءٍ حَارٍّ بَالِغِ الحَرَارَةِ."],[37,69,"أَلْفَوْا۟","وَجَدُوا."],[37,70,"يُهْرَعُونَ","يُسْرِعُونَ فِي مُتَابَعَتِهِمْ عَلَى الضَّلَالِ."],[37,78,"وَتَرَكْنَا عَلَيْهِ","أَبْقَيْنَا لَهُ ذِكْرًا جَمِيلًا."],[37,78,"فِى ٱلْـَٔاخِرِينَ","فِيمَنْ جَاءَ بَعْدَهُ مِنَ النَّاسِ."],[37,83,"شِيعَتِهِۦ","مَنْ تَابَعَهُ عَلَى دِينِهِ، وَمِنْهَاجِهِ."],[37,84,"سَلِيمٍ","بَرِيءٍ مِنْ كُلِّ اعْتِقَادٍ بَاطِلٍ، وَخُلُقٍ ذَمِيمٍ."],[37,86,"أَئِفْكًا ءَالِهَةً","أَتُرِيدُونَ آلِهَةً مُخْتَلَقَةً تَعْبُدُونَهَا؟!"],[37,88,"فَنَظَرَ","رَفَعَ بَصَرَهُ إِلَى النُّجُومِ مُتَفَكِّرًا فِيمَا يَعْتَذِرُ بِهِ مِنَ الخُرُوجِ مَعَهُمْ."],[37,89,"سَقِيمٌ","مَرِيضٌ؛ وَهَذَا تَعْرِيضٌ مِنْهُ؛ أَرَادَ: أَنِّي لَا أَخْلُو مِنْ سَقَمٍ كَعَادَةِ النَّاسِ أَوْ أَنِّي ضَعِيفٌ، أَوْ سَقِيمُ القَلْبِ مِنْ عِبَادَتِكُمْ غَيْرَ اللهِ."],[37,91,"فَرَاغَ إِلَىٰٓ ءَالِهَتِهِمْ","مَالَ بِخُفْيَةٍ مُسْرِعًا إِلَى الأَصْنَامِ."],[37,93,"بِٱلْيَمِينِ","بِيَدِهِ اليُمْنَى."],[37,94,"يَزِفُّونَ","يَعْدُونَ مُسْرِعِينَ غَاضِبِينَ."],[37,101,"بِغُلَٰمٍ حَلِيمٍ","هُوَ: إِسْمَاعِيلُ عليه السلام."],[37,102,"بَلَغَ مَعَهُ ٱلسَّعْىَ","وَصَلَ دَرَجَةَ العَمَلِ مَعَهُ، وَقَضَاءِ حَوَائِجِهِ."],[37,103,"أَسْلَمَا","اسْتَسْلَمَا لِأَمْرِ اللهِ."],[37,103,"وَتَلَّهُۥ لِلْجَبِينِ","أَلْقَاهُ عَلَى جَانِبِ جَبْهَتِهِ عَلَى الأَرْضِ."],[37,106,"ٱلْبَلَٰٓؤُا۟ ٱلْمُبِينُ","الاخْتِبَارُ الشَّاقُّ الَّذِي أَبَانَ عَنْ صِدْقِ إِيمَانِهِ."],[37,107,"وَفَدَيْنَٰهُ","جَعَلْنَا بَدِيلًا عَنْهُ."],[37,107,"بِذِبْحٍ","بِكَبْشٍ."],[37,108,"وَتَرَكْنَا عَلَيْهِ فِى ٱلْـَٔاخِرِينَ","أَبْقَيْنَا لَهُ ذِكْرًا حَسَنًا فِيمَنْ جَاءَ بَعْدَهُ."],[37,115,"ٱلْكَرْبِ ٱلْعَظِيمِ","الغَرَقِ فِي البَحْرِ، وَالعُبُودِيَّةِ لِفِرْعَوْنَ."],[37,125,"أَتَدْعُونَ بَعْلًا","أَتَعْبُدُونَ الصَّنَمَ المُسَمَّى: «بَعْلًا»."],[37,127,"لَمُحْضَرُونَ","لَمَجْمُوعُونَ لِلْحِسَابِ، وَالعِقَابِ."],[37,130,"إِلْ يَاسِينَ","هُوَ: إِلْيَاسُ نَفْسُهُ، أَوْ: هُوَ وَأَتْبَاعُهُ."],[37,135,"ٱلْغَٰبِرِينَ","البَاقِينَ فِي العَذَابِ."],[37,140,"أَبَقَ","هَرَبَ مِنْ بَلَدِهِ مِنْ غَيْرِ إِذْنِ رَبِّهِ."],[37,140,"ٱلْفُلْكِ","السَّفِينَةِ."],[37,140,"ٱلْمَشْحُونِ","المَمْلُوءِ أَمْتِعَةً، وَرُكَّابًا."],[37,141,"فَسَاهَمَ","اقْتَرَعَ رُكَّابُ السَّفِينَةِ؛ لِتَخْفِيفِ الحُمُولَةِ خَوْفَ الغَرَقِ."],[37,141,"ٱلْمُدْحَضِينَ","المَغْلُوبِينَ بِالقُرْعَةِ."],[37,142,"فَٱلْتَقَمَهُ","ابْتَلَعَهُ."],[37,142,"مُلِيمٌ","آتٍ بِمَا يُلَامُ عَلَيْهِ."],[37,143,"ٱلْمُسَبِّحِينَ","العَابِدِينَ الذَّاكِرِينَ، الَّذِينَ يَقُولُ أَحَدُهُمْ - إِذَا وَقَعَ فِي كُرْبَةٍ -: ﴿لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ﴾ [الأنبياء: 87]."],[37,145,"فَنَبَذْنَٰهُ","فَطَرَحْنَاهُ مِنْ بَطْنِ الحُوتِ."],[37,145,"بِٱلْعَرَآءِ","بِالأَرْضِ الخَالِيَةِ مِنَ الشَّجَرِ وَالبِنَاءِ."],[37,145,"سَقِيمٌ","ضَعِيفُ البَدَنِ."],[37,146,"يَقْطِينٍ","قَرْعٍ."],[37,147,"أَوْ يَزِيدُونَ","بَلْ يَزِيدُونَ."],[37,148,"فَمَتَّعْنَٰهُمْ إِلَىٰ حِينٍ","أَبْقَيْنَاهُمْ أَحْيَاءً مُتَمَتِّعِينَ إِلَى بُلُوغِ آجَالِهِمْ."],[37,151,"إِفْكِهِمْ","كَذِبِهِمْ."],[37,153,"أَصْطَفَى","أَيَخْتَارُ؟!"],[37,154,"مَا لَكُمْ كَيْفَ تَحْكُمُونَ","بِئْسَ الحُكْمُ مَا تَحْكُمُونَهُ."],[37,156,"سُلْطَٰنٌ","حُجَّةٌ."],[37,158,"ٱلْجِنَّةِ","المَلَائِكَةِ، سُمُّوا بِذَلِكَ؛ لِاجْتِنَانِهِمْ عَنِ الأَبْصَارِ."],[37,158,"نَسَبًا","قَرَابَةً."],[37,158,"لَمُحْضَرُونَ","إِنَّ الكُفَّارَ سَيُحْضَرُونَ لِلْعَذَابِ يَوْمَ القِيَامَةِ."],[37,159,"سُبْحَٰنَ ٱللَّهِ","تَنْزِيهًا للهِ."],[37,162,"بِفَٰتِنِينَ","بِمُضِلِّينَ أَحَدًا."],[37,163,"صَالِ ٱلْجَحِيمِ","مَنْ يَصْلَى الجَحِيمَ بِدُخُولِهَا وَمُقَاسَاةِ حَرِّهَا."],[37,165,"ٱلصَّآفُّونَ","الوَاقِفُونَ صُفُوفًا فِي عِبَادَةِ اللهِ."],[37,166,"ٱلْمُسَبِّحُونَ","المُنَزِّهُونَ اللهَ عَنْ كُلِّ مَا لَا يَلِيقُ بِهِ."],[37,168,"ذِكْرًا مِّنَ ٱلْأَوَّلِينَ","كِتَابًا مِنْ كُتُبِ الأَنْبِيَاءِ السَّابِقِينَ."],[37,174,"فَتَوَلَّ عَنْهُمْ","أَعْرِضْ عَمَّنْ عَانَدَ."],[37,177,"بِسَاحَتِهِمْ","بِفِنَائِهِمْ."],[37,177,"فَسَآءَ","بِئْسَ."],[38,1,"ذِى ٱلذِّكْرِ","المُشْتَمِلِ عَلَى تَذْكِيرِ النَّاسِ بِمَا هُمْ عَنْهُ غَافِلُونَ."],[38,2,"عِزَّةٍ","تَكَبُّرٍ، وَحَمِيَّةٍ."],[38,2,"وَشِقَاقٍ","مُخَالَفَةٍ، وَعِنَادٍ."],[38,3,"كَمْ أَهْلَكْنَا","كَثِيرًا مِنَ الأُمَمِ أَهْلَكْنَا."],[38,3,"قَرْنٍ","أُمَّةٍ سَابِقَةٍ."],[38,3,"وَلَاتَ حِينَ مَنَاصٍ","لَيْسَ الوَقْتُ وَقْتَ فِرَارٍ وَخَلَاصٍ."],[38,5,"عُجَابٌ","عَجِيبٌ."],[38,6,"ٱلْمَلَأُ","الأَشْرَافُ، وَكِبَارُ القَوْمِ."],[38,6,"ٱمْشُوا۟","اسْتَمِرُّوا عَلَى دِينِكُمْ، وَشِرْكِكُمْ."],[38,6,"لَشَىْءٌ يُرَادُ","مُدَبَّرٌ يُقْصَدُ مِنْهُ التَّرَؤُّسُ، وَالسِّيَادَةُ."],[38,7,"ٱلْمِلَّةِ ٱلْـَٔاخِرَةِ","دِينِ آبَائِنَا وَدِينِ النَّصَارَى."],[38,7,"ٱخْتِلَٰقٌ","كَذِبٌ، وَافْتِرَاءٌ."],[38,10,"فَلْيَرْتَقُوا۟ فِى ٱلْأَسْبَٰبِ","فَلْيَأْخُذُوا بِالأَسْبَابِ المُوصِلَةِ إِلَى السَّمَاءِ، وَلْيَمْنَعُوا الوَحْيَ."],[38,11,"جُندٌ مَّا","جُنُودٌ قَلِيلُونَ حَقِيرُونَ."],[38,12,"ذُو ٱلْأَوْتَادِ","صَاحِبُ الجُنُودِ، وَالقُوَّةِ العَظِيمَةِ."],[38,13,"لْـَٔيْكَةِ","أَصْحَابُ الأَشْجَارِ وَالبَسَاتِينِ؛ وَهُمْ قَوْمُ شُعَيْبٍ عليه السلام."],[38,14,"فَحَقَّ عِقَابِ","فَوَجَبَ العِقَابُ عَلَيْهِمْ."],[38,15,"يَنظُرُ","مَا يَنْتَظِرُ."],[38,15,"صَيْحَةً وَٰحِدَةً","نَفْخَةَ القِيَامَةِ."],[38,15,"فَوَاقٍ","رُجُوعٍ."],[38,16,"قِطَّنَا","نَصِيبَنَا مِنَ العَذَابِ."],[38,17,"ذَا ٱلْأَيْدِ","صَاحِبَ القُوَّةِ عَلَى الطَّاعَةِ، وَفِي الحَرْبِ."],[38,17,"أَوَّابٌ","كَثِيرُ الرُّجُوعِ إِلَى مَا يُرْضِي اللهَ."],[38,18,"بِٱلْعَشِىِّ","آخِرِ النَّهَارِ."],[38,18,"وَٱلْإِشْرَاقِ","أَوَّلِ النَّهَارِ."],[38,19,"مَحْشُورَةً","مَجْمُوعَةً."],[38,19,"أَوَّابٌ","مُطِيعٌ."],[38,20,"وَشَدَدْنَا مُلْكَهُۥ","قَوَّيْنَا مُلْكَهُ بِالهَيْبَةِ، وَالتَّمْكِينِ، وَالنَّصْرِ."],[38,20,"ٱلْحِكْمَةَ","النُّبُوَّةَ."],[38,20,"وَفَصْلَ ٱلْخِطَابِ","البَيَانَ الشَّافِيَ وَالفَصْلَ فِي الكَلَامِ وَالحُكْمِ."],[38,21,"نَبَؤُا۟","خَبَرُ."],[38,21,"ٱلْخَصْمِ","المُتَخَاصِمَيْنِ."],[38,21,"ٱلْمِحْرَابَ","مَكَانَ عِبَادَتِهِ."],[38,22,"فَفَزِعَ","ارْتَاعَ."],[38,22,"تُشْطِطْ","لَا تَجُرْ فِي حُكْمِكَ، وَلَا تَظْلِمْ."],[38,22,"سَوَآءِ ٱلصِّرَٰطِ","وَسَطِ الطَّرِيقِ الصَّوَابِ."],[38,23,"أَكْفِلْنِيهَا","أَعْطِنِيهَا، وَانْزِلْ لِي عَنْهَا."],[38,23,"وَعَزَّنِى فِى ٱلْخِطَابِ","غَلَبَنِي فِي الكَلَامِ، وَاشْتَدَّ عَلَيَّ فِيهِ."],[38,24,"ٱلْخُلَطَآءِ","الشُّرَكَاءِ."],[38,24,"لَيَبْغِى","لَيَعْتَدِي."],[38,24,"وَظَنَّ","أَيْقَنَ."],[38,24,"فَتَنَّٰهُ","ابْتَلَيْنَاهُ، وَامْتَحَنَّاهُ."],[38,24,"وَخَرَّ رَاكِعًا","سَجَدَ للهِ تَعَالَى."],[38,24,"وَأَنَابَ","رَجَعَ، وَتَابَ."],[38,25,"لَزُلْفَىٰ","لَقُرْبَى وَمَكَانَةً."],[38,25,"مَـَٔابٍ","مَرْجِعٍ."],[38,27,"بَٰطِلًا","عَبَثًا وَلَهْوًا."],[38,27,"فَوَيْلٌ","فَهَلَاكٌ."],[38,30,"أَوَّابٌ","كَثِيرُ الرُّجُوعِ إِلَى اللهِ بِالتَّوْبَةِ، وَالطَّاعَةِ."],[38,31,"بِٱلْعَشِىِّ","عَصْرًا."],[38,31,"ٱلصَّٰفِنَٰتُ","الخُيُولُ الوَاقِفَةُ عَلَى ثَلَاثِ قَوَائِمَ، وَتَرْفَعُ الرَّابِعَةَ؛ لِنَجَابَتِهَا وَخِفَّتِهَا."],[38,31,"ٱلْجِيَادُ","الخُيُولُ الأَصِيلَةُ السَّرِيعَةُ."],[38,32,"أَحْبَبْتُ حُبَّ ٱلْخَيْرِ","آثَرْتُ حُبَّ المَالِ."],[38,32,"تَوَارَتْ بِٱلْحِجَابِ","غَابَتِ الشَّمْسُ، أَوْ غَابَتِ الخَيْلُ عَنْ عَيْنِهِ."],[38,33,"فَطَفِقَ","شَرَعَ."],[38,33,"مَسْحًۢا بِٱلسُّوقِ وَٱلْأَعْنَاقِ","يَمْسَحُ سِيقَانَهَا وَأَعْنَاقَهَا، أَوْ يَقْطَعُهَا بِالسَّيْفِ تَقَرُّبًا إِلَى اللهِ."],[38,34,"فَتَنَّا","ابْتَلَيْنَا."],[38,34,"جَسَدًا","شِقَّ إِنْسَانٍ وُلِدَ لَهُ."],[38,34,"أَنَابَ","رَجَعَ إِلَى اللهِ بِالتَّوْبَةِ."],[38,36,"رُخَآءً","لَيِّنَةً طَيِّعَةً."],[38,36,"حَيْثُ أَصَابَ","حَيْثُ أَرَادَ."],[38,38,"مُقَرَّنِينَ","مُوثَقِينَ."],[38,38,"ٱلْأَصْفَادِ","الأَغْلَالِ."],[38,39,"فَٱمْنُنْ","أَعْطِ مَنْ شِئْتَ."],[38,40,"لَزُلْفَىٰ","لَقُرْبَى وَكَرَامَةً."],[38,40,"وَحُسْنَ مَـَٔابٍ","حُسْنَ مَرْجِعٍ فِي الآخِرَةِ."],[38,41,"بِنُصْبٍ","مَشَقَّةٍ، وَتَعَبٍ."],[38,41,"وَعَذَابٍ","أَلَمٍ فِي جَسَدِي، وَمَالِي، وَأَهْلِي."],[38,42,"ٱرْكُضْ بِرِجْلِكَ","اضْرِبْ بِرِجْلِكَ الأَرْضَ لِيَنْبُعَ لَكَ المَاءُ."],[38,42,"مُغْتَسَلٌۢ بَارِدٌ","مَاءٌ تَغْتَسِلُ بِهِ، فِيهِ شِفَاؤُكَ."],[38,43,"وَمِثْلَهُم مَّعَهُمْ","زِدْنَاهُ مِثْلَهُمْ مَعَهُمْ."],[38,43,"لِأُو۟لِى ٱلْأَلْبَٰبِ","لِأَصْحَابِ العُقُولِ السَّلِيمَةِ."],[38,44,"ضِغْثًا","حُزْمَةَ شَمَارِيخَ أَوْ قَبْضَةَ حَشِيشٍ."],[38,44,"تَحْنَثْ","لَا تَنْقُضْ يَمِينَكَ الَّتِي حَلَفْتَهَا بِضَرْبِ زَوْجَتِكَ."],[38,44,"أَوَّابٌ","رَجَّاعٌ إِلَى طَاعَةِ اللهِ."],[38,45,"أُو۟لِى ٱلْأَيْدِى","أَصْحَابِ القُوَّةِ فِي الطَّاعَةِ."],[38,45,"وَٱلْأَبْصَٰرِ","البَصِيرَةِ فِي الدِّينِ."],[38,46,"أَخْلَصْنَٰهُم بِخَالِصَةٍ","خَصَصْنَاهُمْ بِخَصْلَةٍ عَظِيمَةٍ."],[38,46,"ذِكْرَى ٱلدَّارِ","تَذَكُّرِ الآخِرَةِ فِي قُلُوبِهِمْ."],[38,47,"ٱلْمُصْطَفَيْنَ","المُخْتَارِينَ."],[38,49,"لَحُسْنَ مَـَٔابٍ","حُسْنَ مَرْجِعٍ فِي الآخِرَةِ."],[38,52,"قَٰصِرَٰتُ ٱلطَّرْفِ","لَا يَنْظُرْنَ إِلَى غَيْرِ أَزْوَاجِهِنَّ."],[38,52,"أَتْرَابٌ","مُتَسَاوِيَاتُ السِّنِّ."],[38,54,"نَفَادٍ","انْقِطَاعٍ."],[38,55,"لَشَرَّ مَـَٔابٍ","أَسْوَأَ مَرْجِعٍ فِي الآخِرَةِ."],[38,56,"يَصْلَوْنَهَا","يَدْخُلُونَهَا وَيُقَاسُونَ حَرَّهَا."],[38,56,"ٱلْمِهَادُ","الفِرَاشُ."],[38,57,"حَمِيمٌ","مَاءٌ شَدِيدُ الحَرَارَةِ."],[38,57,"وَغَسَّاقٌ","صَدِيدٌ سَائِلٌ مِنْ أَجْسَادِ أَهْلِ النَّارِ."],[38,58,"وَءَاخَرُ","عَذَابٌ آخَرُ."],[38,58,"مِن شَكْلِهِۦٓ","مِنْ مِثْلِهِ."],[38,58,"أَزْوَٰجٌ","أَصْنَافٌ، وَأَلْوَانٌ."],[38,59,"فَوْجٌ","جَمَاعَةٌ مِنْ أَهْلِ النَّارِ."],[38,59,"مُّقْتَحِمٌ مَّعَكُمْ","دَاخِلَةُ النَّارَ مَعَكُمْ."],[38,59,"لَا مَرْحَبًۢا بِهِمْ","لَا رَحُبَتْ بِهِمُ النَّارُ، وَلَا اتَّسَعَتْ مَنَازِلُهُمْ فِيهَا."],[38,59,"صَالُوا۟ ٱلنَّارِ","مُقَاسُو حَرِّهَا."],[38,60,"ٱلْقَرَارُ","المَقَرُّ."],[38,61,"ضِعْفًا","مُضَاعَفًا."],[38,63,"أَتَّخَذْنَٰهُمْ سِخْرِيًّا","هَلْ تَحْقِيرُنَا لَهُمْ خَطَأٌ؟"],[38,63,"زَاغَتْ","مَالَتْ، فَلَمْ تَقَعْ عَلَيْهِمْ."],[38,64,"تَخَاصُمُ","جِدَالُ."],[38,67,"نَبَؤٌا۟ عَظِيمٌ","القُرْآنُ خَبَرٌ عَظِيمُ النَّفْعِ."],[38,69,"بِٱلْمَلَإِ ٱلْأَعْلَىٰٓ","المَلَائِكَةِ."],[38,69,"يَخْتَصِمُونَ","يَتَجَادَلُونَ فِي شَأْنِ خَلْقِ آدَمَ عليه السلام."],[38,72,"سَوَّيْتُهُۥ","خَلَقْتُ جَسَدَهُ كَامِلًا مُتَنَاسِقَ الأَعْضَاءِ."],[38,72,"سَٰجِدِينَ","سُجُودَ تَحِيَّةٍ وَإِكْرَامٍ، لَا سُجُودَ عِبَادَةٍ وَتَعْظِيمٍ."],[38,77,"رَجِيمٌ","مَرْجُومٌ مَطْرُودٌ مِنْ رَحْمَةِ اللهِ."],[38,78,"لَعْنَتِىٓ","طَرْدِي، وَإِبْعَادِي."],[38,79,"فَأَنظِرْنِىٓ","أَخِّرْنِي."],[38,82,"فَبِعِزَّتِكَ","بِسُلْطَانِكَ، وَعَظَمَتِكَ."],[38,82,"لَأُغْوِيَنَّهُمْ","لَأُضِلَّنَّهُمْ."],[38,83,"ٱلْمُخْلَصِينَ","الَّذِينَ أَخْلَصْتَهُمْ، وَاصْطَفَيْتَهُمْ لِعِبَادَتِكَ."],[38,86,"أَجْرٍ","جَزَاءٍ وَأُجْرَةٍ عَلَى الهِدَايَةِ وَالدَّعْوَةِ."],[38,86,"ٱلْمُتَكَلِّفِينَ","المُتَصَنِّعِينَ المُتَقَوِّلِينَ عَلَى اللهِ."],[38,88,"نَبَأَهُۥ","خَبَرَ القُرْآنِ وَصِدْقَهُ."],[39,2,"مُخْلِصًا لَّهُ ٱلدِّينَ","مُوَحِّدًا لَهُ العِبَادَةَ وَالطَّاعَةَ."],[39,3,"ٱلدِّينُ ٱلْخَالِصُ","الطَّاعَةُ التَّامَّةُ السَّالِمَةُ مِنَ الشِّرْكِ."],[39,3,"زُلْفَىٰٓ","تَقَرُّبًا."],[39,4,"لَٱصْطَفَىٰ","لَاخْتَارَ."],[39,5,"يُكَوِّرُ","يُدْخِلُ."],[39,5,"وَسَخَّرَ","ذَلَّلَ."],[39,5,"ٱلْعَزِيزُ","الغَالِبُ عَلَى أَمْرِهِ، المُنْتَقِمُ مِنْ أَعْدَائِهِ."],[39,6,"ثَمَٰنِيَةَ أَزْوَٰجٍ","ثَمَانِيَةَ أَنْوَاعٍ ذُكُورًا وَإِنَاثًا؛ مِنَ الإِبِلِ وَالبَقَرِ وَالضَّأْنِ وَالمَعْزِ."],[39,6,"خَلْقًا مِّنۢ بَعْدِ خَلْقٍ","طَوْرًا مِنْ بَعْدِ طَوْرٍ."],[39,6,"فِى ظُلُمَٰتٍ ثَلَٰثٍ","ظُلْمَةِ البَطْنِ، وَالرَّحِمِ، وَالمَشِيمَةِ."],[39,6,"فَأَنَّىٰ تُصْرَفُونَ","كَيْفَ تَعْدِلُونَ عَنْ عِبَادَتِهِ؟!"],[39,7,"وَلَا تَزِرُ وَازِرَةٌ","لَا تَحْمِلُ نَفْسٌ آثِمَةٌ."],[39,7,"وِزْرَ أُخْرَىٰ","إِثْمَ نَفْسٍ أُخْرَى."],[39,8,"مُنِيبًا إِلَيْهِ","رَاجِعًا إِلَيْهِ، مُسْتَغِيثًا بِهِ."],[39,8,"خَوَّلَهُۥ","أَعْطَاهُ وَمَنَحَهُ."],[39,8,"أَندَادًا","شُرَكَاءَ، وَأَمْثَالًا."],[39,9,"قَٰنِتٌ","مُطِيعٌ خَاضِعٌ للهِ."],[39,9,"ءَانَآءَ ٱلَّيْلِ","سَاعَاتِ اللَّيْلِ."],[39,9,"أُو۟لُوا۟ ٱلْأَلْبَٰبِ","أَصْحَابُ العُقُولِ السَّدِيدَةِ."],[39,10,"يُوَفَّى","يُعْطَى وَافِيًا."],[39,10,"بِغَيْرِ حِسَابٍ","لَا يُحَاسَبُونَ، أَوْ لَا نِهَايَةَ لِمَا يُعْطَوْنَ."],[39,16,"ظُلَلٌ مِّنَ ٱلنَّارِ","أَطْبَاقٌ مِنْ عَذَابِ النَّارِ كَهَيْئَةِ الظُّلَلِ المُبْنِيَّةِ."],[39,17,"ٱلطَّٰغُوتَ","المَعْبُودَاتِ مِنْ دُونِ اللهِ؛ مِنَ الأَوْثَانِ وَالشَّيَاطِينِ."],[39,17,"وَأَنَابُوٓا۟","رَجَعُوا إِلَى اللهِ بِالتَّوْبَةِ، وَالطَّاعَةِ."],[39,17,"ٱلْبُشْرَىٰ","الذِّكْرُ الحَسَنُ، وَالتَّوْفِيقُ فِي الدُّنْيَا، وَالجَنَّةُ فِي الآخِرَةِ."],[39,18,"أُو۟لُوا۟ ٱلْأَلْبَٰبِ","أَصْحَابُ العُقُولِ السَّدِيدَةِ."],[39,19,"حَقَّ عَلَيْهِ","وَجَبَ عَلَيْهِ."],[39,20,"غُرَفٌ","مَنَازِلُ رَفِيعَةٌ عَالِيَةٌ فِي الجَنَّةِ."],[39,21,"فَسَلَكَهُۥ يَنَٰبِيعَ","أَدْخَلَهُ فِي عُيُونٍ وَمَجَارٍ."],[39,21,"يَهِيجُ","يَيْبَسُ."],[39,21,"حُطَٰمًا","مُتَكَسِّرًا مُتَفَتِّتًا."],[39,21,"لِأُو۟لِى ٱلْأَلْبَٰبِ","لِأَصْحَابِ العُقُولِ السَّلِيمَةِ."],[39,22,"فَوَيْلٌ","هَلَاكٌ، وَحَسْرَةٌ."],[39,23,"مُّتَشَٰبِهًا","يُشْبِهُ بَعْضُهُ بَعْضًا فِي الحُسْنِ وَالإِحْكَامِ."],[39,23,"مَّثَانِىَ","تُثَنَّى وَتُكَرَّرُ فِيهِ الأَحْكَامُ وَالقَصَصُ وَالحُجَجُ."],[39,23,"تَقْشَعِرُّ","تَضْطَرِبُ، وَتَرْتَعِدُ."],[39,23,"تَلِينُ","تَسْكُنُ، وَتَطْمَئِنُّ."],[39,24,"يَتَّقِى بِوَجْهِهِۦ","يُلْقَى فِي النَّارِ مَغْلُولًا، فَيَتَلَقَّاهَا بِوَجْهِهِ."],[39,26,"ٱلْخِزْىَ","الذُّلَّ، وَالهَوَانَ."],[39,27,"مِن كُلِّ مَثَلٍ","مِنْ أَمْثَالِ القُرُونِ الخَالِيَةِ، وَأَمْثَالِ التَّوْحِيدِ وَالشِّرْكِ وَغَيْرِهَا."],[39,28,"عِوَجٍ","اضْطِرَابٍ، وَلَبْسٍ."],[39,29,"رَّجُلًا","عَبْدًا مَمْلُوكًا."],[39,29,"مُتَشَٰكِسُونَ","مُتَنَازِعُونَ."],[39,29,"سَلَمًا","خَالِصًا."],[39,29,"لِّرَجُلٍ","لِمَالِكٍ وَاحِدٍ."],[39,32,"بِٱلصِّدْقِ","بِالحَقِّ."],[39,32,"مَثْوًى","مَأْوًى وَمَسْكَنٌ."],[39,38,"حَسْبِىَ","كَافِينِي."],[39,39,"مَكَانَتِكُمْ","حَالَتِكُمُ الَّتِي رَضِيتُمُوهَا لِأَنْفُسِكُمْ."],[39,40,"يُخْزِيهِ","يُذِلُّهُ، وَيُهِينُهُ."],[39,42,"يَتَوَفَّى","يَقْبِضُ."],[39,45,"ٱشْمَأَزَّتْ","نَفَرَتْ."],[39,46,"فَاطِرَ","خَالِقَ وَمُبْدِعَ."],[39,46,"ٱلْغَيْبِ وَٱلشَّهَٰدَةِ","السِّرِّ، وَالعَلَانِيَةِ."],[39,47,"يَحْتَسِبُونَ","يَظُنُّونَ، وَيَتَوَقَّعُونَ."],[39,48,"وَحَاقَ","أَحَاطَ بِهِمْ مِنْ كُلِّ جَانِبٍ."],[39,49,"خَوَّلْنَٰهُ","أَعْطَيْنَاهُ، وَمَنَحْنَاهُ."],[39,49,"فِتْنَةٌ","ابْتِلَاءٌ وَاخْتِبَارٌ."],[39,51,"بِمُعْجِزِينَ","بِفَائِتِينَ اللهَ، وَلَا سَابِقِيهِ."],[39,52,"يَبْسُطُ","يُوَسِّعُ."],[39,52,"وَيَقْدِرُ","يُضَيِّقُ."],[39,53,"أَسْرَفُوا۟","تَجَاوَزُوا الحَدَّ فِي المَعَاصِي."],[39,53,"لَا تَقْنَطُوا۟","لَا تَيْأَسُوا."],[39,54,"وَأَنِيبُوٓا۟","ارْجِعُوا إِلَى اللهِ بِالتَّوْبَةِ، وَالطَّاعَةِ."],[39,54,"وَأَسْلِمُوا۟","اخْضَعُوا، وَانْقَادُوا."],[39,55,"بَغْتَةً","فَجْأَةً."],[39,56,"يَٰحَسْرَتَىٰ","يَا نَدَامَتِي."],[39,56,"فَرَّطتُ","ضَيَّعْتُ."],[39,56,"جَنۢبِ ٱللَّهِ","طَاعَتِهِ، وَحَقِّهِ."],[39,56,"ٱلسَّٰخِرِينَ","المُسْتَهْزِئِينَ."],[39,57,"هَدَىٰنِى","أَرْشَدَنِي إِلَى دِينِهِ."],[39,58,"كَرَّةً","رَجْعَةً."],[39,60,"مَثْوًى","مَأْوًى، وَمَسْكَنٌ."],[39,61,"بِمَفَازَتِهِمْ","بِفَوْزِهِمْ وَظَفَرِهِمْ بِالمَطْلُوبِ."],[39,63,"مَقَالِيدُ","مَفَاتِيحُ الخَزَائِنِ."],[39,65,"لَيَحْبَطَنَّ","لَيَبْطُلَنَّ."],[39,67,"وَمَا قَدَرُوا۟","مَا عَظَّمُوا."],[39,67,"قَبْضَتُهُۥ","فِي قَبْضَةِ يَدِهِ."],[39,67,"مَطْوِيَّٰتٌۢ","يَطْوِيهَا وَيَلُفُّهَا بِيَدِهِ."],[39,67,"بِيَمِينِهِۦ","بِيَدِهِ اليُمْنَى، وَكِلْتَا يَدَيْهِ يَمِينٌ، وللهِ يَدَانِ لَائِقَتَانِ بِجَلَالِهِ نُثْبِتُهُمَا بِلَا تَكْيِيفٍ، وَلَا تَحْرِيفٍ، وَلَا تَمْثِيلٍ، وَلَا تَعْطِيلٍ."],[39,67,"سُبْحَٰنَهُۥ","تَنَزَّهَ."],[39,67,"وَتَعَٰلَىٰ","تَعَاظَمَ."],[39,68,"وَنُفِخَ","أَيْ: النَّفْخَةُ الأُولَى الَّتِي يَمُوتُ بِهَا الخَلْقُ؛ وَهِيَ نَفْخَةُ الصَّعْقِ."],[39,68,"ٱلصُّورِ","الْقَرْنِ الَّذِي يَنْفُخُ فِيهِ إِسْرَافِيلُ عليه السلام لِلصَّعْقِ وَالبَعْثِ."],[39,68,"فَصَعِقَ","مَاتَ."],[39,68,"ثُمَّ نُفِخَ فِيهِ","أَيْ: النَّفْخَةُ الثَّانِيَةُ؛ نَفْخَةُ البَعْثِ الَّتِي يَحْيَا بِهَا الخَلْقُ."],[39,69,"وَأَشْرَقَتِ","أَضَاءَتْ."],[39,69,"بِنُورِ رَبِّهَا","عِنْدَ تَجَلِّيهِ لِلْخَلَائِقِ؛ لِفَصْلِ القَضَاءِ."],[39,69,"وَوُضِعَ ٱلْكِتَٰبُ","نَشَرَتِ المَلَائِكَةُ صَحِيفَةَ كُلِّ فَرْدٍ."],[39,69,"وَٱلشُّهَدَآءِ","مَنْ يَشْهَدُونَ عَلَى الأُمَمِ."],[39,69,"وَقُضِىَ","حُكِمَ."],[39,69,"بِٱلْحَقِّ","بِالعَدْلِ التَّامِّ."],[39,71,"زُمَرًا","جَمَاعَاتٍ."],[39,71,"خَزَنَتُهَآ","المَلَائِكَةُ المُوَكَّلُونَ بِالنَّارِ."],[39,71,"حَقَّتْ","وَجَبَتْ."],[39,72,"فَبِئْسَ","قَبُحَ."],[39,72,"مَثْوَى","مَصِيرُ، وَمَأْوَى."],[39,73,"طِبْتُمْ","طَهُرْتُمْ مِنْ دَنَسِ المَعَاصِي."],[39,74,"ٱلْأَرْضَ","أَرْضَ الجَنَّةِ."],[39,74,"نَتَبَوَّأُ","نَنْزِلُ."],[39,75,"حَآفِّينَ","مُحْدِقِينَ، وَمُحِيطِينَ."],[39,75,"وَقُضِىَ بَيْنَهُم بِٱلْحَقِّ","حُكِمَ بَيْنَ الخَلَائِقِ بِالعَدْلِ."],[40,3,"ذِى ٱلطَّوْلِ","صَاحِبِ الإِنْعَامِ وَالتَّفَضُّلِ."],[40,3,"ٱلْمَصِيرُ","المَرْجِعُ."],[40,4,"فَلَا يَغْرُرْكَ","فَلَا يَخْدَعْكَ."],[40,4,"تَقَلُّبُهُمْ","تَنَقُّلُهُمْ وَتَرَدُّدُهُمْ بِأَنْوَاعِ التِّجَارَاتِ وَالنَّعِيمِ."],[40,5,"وَٱلْأَحْزَابُ","الأُمَمُ المُتَحَزِّبَةُ عَلَى رُسُلِهِمْ، مُعْلِنِينَ الحَرْبَ عَلَيْهِمْ."],[40,5,"لِيَأْخُذُوهُ","لِيَقْتُلُوهُ."],[40,5,"لِيُدْحِضُوا۟","لِيُبْطِلُوا."],[40,6,"حَقَّتْ","وَجَبَتْ."],[40,7,"سَبِيلَكَ","طَرِيقَكَ؛ وَهُوَ الإِسْلَامُ."],[40,7,"وَقِهِمْ","جَنِّبْهُمْ."],[40,9,"وَقِهِمُ ٱلسَّيِّـَٔاتِ","اصْرِفْ عَنْهُمْ سُوءَ عَاقِبَةِ سَيِّئَاتِهِمْ."],[40,10,"يُنَادَوْنَ","يَدْعُوهُمْ خَزَنَةُ جَهَنَّمَ."],[40,10,"لَمَقْتُ ٱللَّهِ","المَقْتُ: البُغْضُ الشَّدِيدُ."],[40,11,"أَمَتَّنَا ٱثْنَتَيْنِ","مَرَّةً قَبْلَ نَفْخِ الأَرْوَاحِ فِي الأَجِنَّةِ، وَمَرَّةً حِينَ انْقَضَى أَجَلُنَا."],[40,11,"وَأَحْيَيْتَنَا ٱثْنَتَيْنِ","مَرَّةً فِي الدُّنْيَا، وَمَرَّةً فِي الآخِرَةِ."],[40,11,"سَبِيلٍ","طَرِيقٍ نَخْرُجُ بِهِ مِنَ النَّارِ."],[40,13,"رِزْقًا","مَطَرًا تُرْزَقُونَ بِهِ."],[40,13,"يُنِيبُ","يَرْجِعُ إِلَى طَاعَةِ اللهِ."],[40,15,"رَفِيعُ ٱلدَّرَجَٰتِ","ارْتَفَعَتْ دَرَجَاتُهُ ارْتِفَاعًا بَايَنَ بِهِ مَخْلُوقَاتِهِ، وَارْتَفَعَ بِهِ قَدْرُهُ."],[40,15,"يُلْقِى ٱلرُّوحَ","يُنْزِلُ الوَحْيَ."],[40,15,"يَوْمَ ٱلتَّلَاقِ","اليَوْمِ الَّذِي يَلْتَقِي فِيهِ الأَوَّلُونَ وَالآخِرُونَ."],[40,16,"بَٰرِزُونَ","ظَاهِرُونَ أَمَامَ رَبِّهِمْ."],[40,18,"يَوْمَ ٱلْـَٔازِفَةِ","يَوْمَ القِيَامَةِ القَرِيبِ."],[40,18,"لَدَى ٱلْحَنَاجِرِ","قُلُوبُهُمْ عِنْدَ حُلُوقِهِمْ مِنْ شِدَّةِ الكَرْبِ."],[40,18,"كَٰظِمِينَ","مُمْتَلِئِينَ غَمًّا، وَحُزْنًا."],[40,18,"حَمِيمٍ","قَرِيبٍ، وَصَاحِبٍ."],[40,19,"خَآئِنَةَ ٱلْأَعْيُنِ","مَا تَخْتَلِسُهُ العُيُونُ مِنَ النَّظَرِ إِلَى مَا لَا يَحِلُّ."],[40,20,"يَقْضِى بِٱلْحَقِّ","يَحْكُمُ بِالعَدْلِ."],[40,21,"وَاقٍ","دَافِعٍ."],[40,23,"وَسُلْطَٰنٍ مُّبِينٍ","حُجَّةٍ بَيِّنَةٍ عَلَى صِدْقِهِ."],[40,25,"ضَلَٰلٍ","هَلَاكٍ، وَذَهَابٍ."],[40,27,"عُذتُ","اسْتَجَرْتُ."],[40,28,"مُسْرِفٌ","مُتَجَاوِزٌ لِلْحَدِّ بِتَرْكِ الحَقِّ، وَاتِّبَاعِ البَاطِلِ."],[40,29,"ظَٰهِرِينَ","غَالِبِينَ عَالِينَ."],[40,29,"بَأْسِ ٱللَّهِ","عَذَابِ اللهِ."],[40,29,"مَآ أُرِيكُمْ","مَا أُشِيرُ عَلَيْكُمْ."],[40,29,"أَهْدِيكُمْ","أَدْعُوكُمْ."],[40,29,"سَبِيلَ ٱلرَّشَادِ","طَرِيقَ الحَقِّ وَالصَّوَابِ."],[40,30,"ٱلْأَحْزَابِ","الأُمَمِ المُتَحَزِّبَةِ عَلَى أَنْبِيَائِهَا، المُعَادِيَةِ لَهُمْ."],[40,31,"دَأْبِ قَوْمِ نُوحٍ","عَادَتِهِمْ فِي الكُفْرِ وَالتَّكْذِيبِ."],[40,32,"يَوْمَ ٱلتَّنَادِ","يَوْمِ القِيَامَةِ الَّذِي يُنَادِي النَّاسُ فِيهِ بَعْضُهُمْ بَعْضًا."],[40,33,"مُدْبِرِينَ","هَارِبِينَ."],[40,33,"عَاصِمٍ","مَانِعٍ يَمْنَعُكُمْ."],[40,34,"شَكٍّ","رِيبَةٍ."],[40,34,"هَلَكَ","مَاتَ."],[40,34,"مُسْرِفٌ","مُتَجَاوِزٌ لِلْحَدِّ فِي الضَّلَالِ."],[40,34,"مُّرْتَابٌ","شَاكٌّ فِي اللهِ."],[40,35,"سُلْطَٰنٍ","حُجَّةٍ."],[40,35,"يَطْبَعُ","يَخْتِمُ."],[40,36,"صَرْحًا","بِنَاءً عَظِيمًا."],[40,37,"أَسْبَٰبَ ٱلسَّمَٰوَٰتِ","أَبْوَابَ السَّمَوَاتِ، وَمَا يُوصِلُنِي إِلَيْهَا."],[40,37,"ٱلسَّبِيلِ","طَرِيقِ الحَقِّ."],[40,37,"كَيْدُ فِرْعَوْنَ","تَدْبِيرُهُ، وَاحْتِيَالُهُ."],[40,37,"تَبَابٍ","خَسَارٍ، وَبَوَارٍ."],[40,40,"بِغَيْرِ حِسَابٍ","بِلَا نِهَايَةٍ، وَلَا تَبِعَةٍ."],[40,43,"لَا جَرَمَ","حَقًّا."],[40,43,"لَيْسَ لَهُۥ دَعْوَةٌ","لَا يَسْتَحِقُّ الدَّعْوَةَ إِلَى عِبَادَتِهِ، وَلَا يُلْجَأُ إِلَيْهِ؛ لِعَجْزِهِ."],[40,43,"مَرَدَّنَآ","مَرْجِعَنَا، وَمَصِيرَنَا."],[40,44,"وَأُفَوِّضُ","أَعْتَصِمُ، وَأَلْجَأُ، وَأَتَوَكَّلُ."],[40,45,"سَيِّـَٔاتِ مَا مَكَرُوا۟","عُقُوبَاتِ مَكْرِهِمْ مِنْ إِرَادَةِ إِهْلَاكِهِ."],[40,45,"وَحَاقَ","نَزَلَ، وَأَحَاطَ."],[40,46,"غُدُوًّا وَعَشِيًّا","أَوَّلَ النَّهَارِ، وَآخِرَهُ."],[40,47,"يَتَحَآجُّونَ","يَتَخَاصَمُونَ."],[40,47,"مُّغْنُونَ","دَافِعُونَ."],[40,50,"ضَلَٰلٍ","ضَيَاعٍ؛ فَلَا يُقْبَلُ، وَلَا يُسْتَجَابُ."],[40,51,"ٱلْأَشْهَٰدُ","مَنْ يَشْهَدُونَ عَلَى المُكَذِّبِينَ؛ مِنَ المَلَائِكَةِ وَالأَنْبِيَاءِ وَالمُؤْمِنِينَ."],[40,52,"مَعْذِرَتُهُمْ","عُذْرُهُمْ."],[40,52,"ٱللَّعْنَةُ","الطَّرْدُ وَالإِبْعَادُ مِنْ رَحْمَةِ اللهِ."],[40,53,"ٱلْكِتَٰبَ","التَّوْرَاةَ."],[40,54,"لِأُو۟لِى ٱلْأَلْبَٰبِ","لِأَصْحَابِ العُقُولِ السَّلِيمَةِ."],[40,55,"وَسَبِّحْ بِحَمْدِ رَبِّكَ","نَزِّهْ رَبَّكَ وَاحْمَدْهُ."],[40,55,"بِٱلْعَشِىِّ وَٱلْإِبْكَٰرِ","فِي آخِرِ النَّهَارِ، وَأَوَّلِهِ."],[40,56,"سُلْطَٰنٍ","حُجَّةٍ بَيِّنَةٍ."],[40,56,"إِن فِى","مَا فِي."],[40,56,"بِبَٰلِغِيهِ","لَيْسُوا بِوَاصِلِينَ لِلْعُلُوِّ عَلَيْكَ، وَلَا لِلْفَضْلِ الَّذِي خَصَّكَ اللهُ بِهِ."],[40,56,"فَٱسْتَعِذْ","اعْتَصِمْ."],[40,59,"لَّا رَيْبَ فِيهَا","لَا شَكَّ فِيهَا."],[40,60,"دَاخِرِينَ","صَاغِرِينَ، حَقِيرِينَ."],[40,61,"لِتَسْكُنُوا۟","لِتَرْتَاحُوا."],[40,61,"مُبْصِرًا","م
