ْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":1},{"t":"لا إله إلا الله العليم الحكيم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم","s":"متفق عليه من حديث ابن عباس","v":3,"p":12,"d":1},{"t":"ما قلّ وكفى خير مما كثر وألهى","s":"رواه أحمد في مسنده من حديث أبي الدرداء","v":1,"p":132,"d":0,"c":"يعني ما يكفيه، لا ما يطغيه ولا ما يلهيه، إذ غاية كل حاجتك أن تكون صحيح البدن مكتفياً تقطن في بيت الحاجات الأساسية فيه موفورة، هذا هو الغنى. والحقيقة أن هذه الحكم مبذولة بين أيدينا، والبطولة أن تعيش هذه الحكم وتطبقها."}],"37":[{"t":"إن الله جميل يحب الجمال","s":"أخرجه مسلم وأبو داود والترمذي عن عبد الله بن مسعود","v":2,"p":112,"d":0,"c":"المجيد سبحانه وتعالى هو الذي علا وارتفع بذاته، له المجد في أسمائه وصفاته وأفعاله، ومجده بيّن في جماله جل جلاله وسعته وعلوه واستوائه على عرشه."},{"t":"حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه","s":"","v":2,"p":112,"d":0,"c":"ومجده بين في جماله جل جلاله. هذا جمال الذات، أما كيفيته فأمر لا يدركه أحد، إذ عين العلم به عين الجهل به، وكل شيء خطر ببالك فالله بخلاف ذلك."},{"t":"الكرسي موضع القدمين، والعرش لا يقدر قدره","s":"رواه الحاكم والدارمي عن ابن عباس","v":2,"p":113,"d":0,"c":"ما أمجد أوصافه، فله علو لا ند له ولا نظير ولا شبيه له ولا مثيل، فالمجد وصف جامع لكل أنواع العلو التي يتصف بها المعبود، فهو العلي العظيم."},{"t":"ما السماوات السبع مع الكرسي إلا كحلقة ملقاة بأرض فلاة","s":"","v":2,"p":113,"d":0,"c":"ما أمجد أوصافه، فله علو لا ند له ولا نظير ولا شبيه له ولا مثيل، فالمجد وصف جامع لكل أنواع العلو التي يتصف بها المعبود، فهو العلي العظيم."},{"t":"... ومن فرّج عن مسلم كربة فرّج الله عنه كربة من كربات يوم القيامة...","s":"صحيح البخاري من حديث عبد الله بن عمر","v":2,"p":121,"d":0,"c":"فإذا طلب أحد المال من الله تعالى ليحل به مشكلات المسلمين نقول له: نعم الطلب طلبك، وهذا عمل من أرقى الأعمال وأرجاها عند الله تعالى."},{"t":"والله ما الدنيا في الآخرة إلا مثل ما يجعل أحدكم إصبعه هذه في اليم، فلينظر بم ترجع","s":"رواه أحمد والطبراني من حديث المستورد بن شداد","v":2,"p":123,"d":0,"c":"عطاؤه لا حدود له. فالله عز وجل أحياناً يعطي الإنسان قليلاً من الدنيا قد يختل توازنه بسببه، فكيف إذا أعطاك الله الجنة؟"},{"t":"... أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر...","s":"صحيح البخاري من حديث أبي هريرة","v":2,"p":124,"d":0,"c":"فالله يهيئ لنا ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر؛ إذا أكرمنا بالجنة فهناك كل ما لا يتصوره العقل، والثمن طاعته فقط."},{"t":"... يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرمًا فلا تظالموا، يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم، يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم، يا عبادي كلكم عار إلا من كسوته فاستكسوني أكسكم...","s":"صحيح مسلم من حديث أبي ذر","v":2,"p":130,"d":0,"c":"فمن عرف أن الله هو الماجد المجيد سمت همته إليه واعتمد عليه في كل الأمور. وأخلاق المؤمن نحو هذا الاسم: أن يقصد وجه الله الكريم لأنه الغني وحده، وأن يحسن للمخلوقات تأسياً بكمالات الله."}],"112":[{"t":"اللهم قني عذابك يوم تبعث عبادك","s":"رواه أحمد والترمذي والنسائي من حديث البراء بن عازب","v":4,"p":225,"d":0,"c":"إذا تحقق وأيقن أن الله سبحانه وتعالى يبعث الناس بعد الموت ثم يجزيهم بالثواب والعقاب، فعندئذ يشغل وقته كله بطاعته، والتزود للدار الآخرة وتصفح أعماله ومحاسبة نفسه حساباً دقيقاً."}],"26":[{"t":"ألا وإنه سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال، فأقول: يا رب أصحابي، فيقول: إنك لا تدري ما أحدثوا بعدك، فأقول كما قال العبد الصالح: ﴿وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ * إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ﴾ فيقال لي: إنهم لم يزالوا مرتدين على أعقابهم منذ فارقتهم","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن عبد الله بن عباس","v":1,"p":435,"d":0},{"t":"ألا أنبئكم بأكبر الكبائر؟ - ثلاثًا - قلنا: بلى يا رسول الله، قال: الإشراك بالله، وعقوق الوالدين","s":"","v":1,"p":436,"d":0,"c":"الشهادة هي الإخبار بما شاهده المرء، شهد فلان على فلان بحق فهو شاهد وشهيد، والشاهد يلزمه أن يبين ما علمه على الحقيقة، وهو واجب يرقى إلى مستوى الفرض."},{"t":"صبرًا آل ياسر، فإن موعدكم الجنة","s":"أخرجه الأصبهاني في حلية الأولياء عن عثمان بن عفان","v":1,"p":443,"d":0,"c":"الله مع المحسن ومع الطائع ومع المستقيم ينصره ويؤيده لأنه شهيد ويشهد لنا. فما معنى أن الله شهيد؟ أي أن قريشاً بخيلها وقوتها وفرسانها ومؤامراتها دمرها الله عز وجل ونصر النبي. أي أنك إذا أردت أن تكون أقوى الناس فتوكل على الله."}],"23":[{"t":"كيف أنعم وقد التقم صاحب القرن القرن واستمع الإذن متى يؤمر بالنفخ فينفخ؟ فكأن ذلك ثقل على أصحاب رسول الله ﷺ، فقال لهم: قولوا: حسبنا الله ونعم الوكيل، على الله توكلنا","s":"الترمذي عن أبي سعيد الخدري","v":1,"p":388,"d":1},{"t":"إن الله يلوم على العجز، ولكن عليك بالكيس، فإذا غلبك أمر فقل: حسبي الله ونعم الوكيل","s":"أخرجه أبو داود عن عوف بن مالك","v":3,"p":360,"d":1},{"t":"لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير، تغدو خماصًا وتروح بطانًا","s":"","v":1,"p":393,"d":0,"c":"المهم أن تكل إليه أمرك، لا يوجد مؤمن على الإطلاق بإخلاص شديد وبصدق بالغ وكل إلى الله شأنا من شؤون حياته إلا ويتولى الله أمره."},{"t":"اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت","s":"أخرجه الحاكم عن أنس بن مالك","v":1,"p":400,"d":0,"c":"نصيب المؤمن من اسم الله الوكيل: أن توقن بعلمه وبقدرته وبرحمته وبحكمته، وشرط التوكل أن تعرفه، فاجتهد أن تعرفه من أجل أن تتوكل عليه."},{"t":"إن الله يلوم على العجز","s":"أخرجه أبو داود عن عوف بن مالك","v":1,"p":401,"d":0,"c":"التوكل الحقيقي أن تأخذ بالأسباب وكأنها كل شيء، ثم تتوكل على الله وكأنها ليست بشيء."},{"t":"يا أبا بكر، ما ظنك باثنين الله ثالثهما","s":"أخرجه البخاري ومسلم والترمذي عن أنس بن مالك","v":1,"p":401,"d":0,"c":"الأمر كله بيد الله. الله مهيمن، يحفظ أعظم شيء بأتفه سبب، وأحياناً يهلك إنساناً بأتفه سبب، ليظهر لك كمال قدرته عز وجل."}],"36":[{"t":"وبعث الله عز وجل الريح على المشركين فكفى الله المؤمنين القتال وكان الله قويًا عزيزًا","s":"رواه أحمد عن عائشة","v":2,"p":95,"d":0},{"t":"اعلم أبا مسعود! لله أقدر عليك منك عليه","s":"رواه الترمذي","v":2,"p":109,"d":0,"c":"وقال بعضهم: إذا دعتك قدرتك إلى ظلم الناس فتذكّر قدرة الله عليك. فإذا ظن الإنسان أنه قوي وأنه يفعل ما يريد فاستخدم هذه القوة في غير العدل فقد استوجب سخط الله عز وجل."}],"53":[{"t":"اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك","s":"رواه مسلم من حديث ابن عمر","v":2,"p":384,"d":0,"c":"مهما تألقت صحته فإنه مربوط بحبل متين، ففي أية لحظة يشد الله الحبل؛ فالإنسان إذاً في قبضة الله عز وجل. فإذا لم يكن مصطلحاً معه ومطيعاً له ومنيباً ومخلصاً فمشكلته مع الله خطيرة."},{"t":"إذا اشتكيت فضع يدك حيث تشتكي ثم قل: بسم الله، أعوذ بعزة الله وقدرته من شر ما أجد من وجعي هذا، ثم ارفع يدك، ثم أعد ذلك وترًا","s":"رواه الترمذي والحاكم من حديث أنس بن مالك","v":2,"p":390,"d":0}],"33":[{"t":"وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضت عليه...","s":"متفق عليه","v":2,"p":57,"d":0,"c":"وإذا أحبّك الله ألقى محبتك في قلوب الخلق. والإنسان يستمع إلى ملايين الموضوعات في حياته، أما المؤمن فسمعه منضبط بالمنهج الإلهي."},{"t":"أحب الأعمال إلى الله أدومها وإن قل","s":"أخرجه البخاري ومسلم وأبو داود والترمذي والنسائي ومالك عن عائشة","v":2,"p":93,"d":0,"c":"هذا الوضع الذي يتكرر أحياناً، يُقبل ثم يُدبر، يتألق ثم يخبو، يتحرك ثم يسكن، هذا الوضع لا يرضي الله عز وجل."},{"t":"صنائع المعروف تقي مصارع السوء","s":"رواه الطبراني وصححه الألباني","v":2,"p":178,"d":0,"c":"أما أهل الدنيا فهان أمر الله عليهم فهانوا على الله، ترى حياته تافهة عند الله لم يبال في أي أوديتها هلك، تراه يموت ميتة سيئة بشعة حقيرة؛ لكنّ المؤمن له عند الله شأن كبير."}],"51":[{"t":"إن آل أبي ليسوا بأوليائي، إنما وليي الله وصالح المؤمنين، ولكن لهم رحم أبلها ببلالها","s":"أخرجه أبو داود والترمذي عن أبي سعيد الخدري","v":2,"p":344,"d":0,"c":"أي أصلها بصلتها التي أمرت بها، فالولاء شيء والواجب شيء آخر. المؤمن يوالي المؤمنين ويتعاون معهم، أما أقرباؤه فلهم حق عليه يؤديه بالتمام والكمال، لكنّ قلبه مع المؤمنين."},{"t":"إذا صنع لأحدكم خادمه طعامًا ثم جاءه به وقد ولي حره ودخانه، فليقعده معه فليأكل","s":"","v":2,"p":345,"d":0,"c":"لك خادم صنع لك طعاماً، فليأكل معك، فمن تواضع النبي صلى الله عليه وسلم أنه كان يأكل مع الخادم."}],"21":[{"t":"عجبت لأمر المؤمن، إن أمره كله خير، إن أصابه ما يحب حمد الله وكان له خير، وإن أصابه ما يكره فصبر كان له خير","s":"أخرجه أحمد في مسنده","v":1,"p":350,"d":0,"c":"فالحمد من ألزم لوازم المؤمن. كان تعظم عنده النعمة مهما دقت، ولا بد من قول: الحمد لله."},{"t":"يا ابن آدم! مرضت فلم تعدني، قال: يا رب! كيف أعودك وأنت رب العالمين؟! قال: أما علمت أن عبدي فلانًا مرض فلم تعده، أما علمت أنك لو عدته لوجدتني عنده","s":"حديث قدسي رواه مسلم من حديث أبي هريرة","v":1,"p":358,"d":0,"c":"أنت عندما تعطي شيئًا نفيسًا لإنسان مؤمن فقير جائع، فالله عز وجل يغنيك ويحمدك على هذا العمل. الله حميد ويحمدكم على عملكم، وهو حامد أي يحمد ذاته ويحمد خلقه إذا أعطوا وبذلوا ونصحوا وصبروا."},{"t":"يا عبادي، كلكم ضال إلا من هديته فاستهدوني أهدكم","s":"أخرجه مسلم والترمذي عن أبي ذر الغفاري","v":1,"p":361,"d":0,"c":"فما لم تتوجه إلى الله لمعرفة الحقيقة فلن تصل إليها، لأن هذه العين مهما تكن دقيقة لا قيمة لها من دون ضوء يتوسط بينك وبين المرئي، وكذلك العقل كالعين تمامًا لا قيمة له إطلاقًا دون وحي يعينك على فهم الحقيقة."},{"t":"ابن آدم! إنك إذا ذكرتني شكرتني","s":"","v":1,"p":365,"d":0,"c":"إذا علمت أن هذه النعم من الله وشكرته عليها اكتسبت نعمة جديدة، فقد شكرت الله عز وجل."}],"116":[{"t":"إن لله تسعة وتسعين اسمًا","s":"","v":4,"p":269,"d":0,"c":"يتوهم البعض أن الإحصاء هو العد، فمن عدها دخل الجنة، وهذا خطأ في فهم كلمة أحصاها... فالعد شيء والإحصاء شيء آخر... فالإحصاء يعني العلم الدقيق."},{"t":"إن لله تسعة وتسعين اسمًا، مائة إلا واحدًا، من أحصاها دخل الجنة","s":"رواه البخاري ومسلم عن أبي هريرة","v":4,"p":272,"d":0,"c":"فمعنى الإحصاء في حديث رسول الله هو العلم. وقيل: أحصاها الله أي هو المحيط بكل شيء جملة وتفصيلا لا تخفى عليه خافية لا في الأرض ولا في السماء."}],"120":[{"t":"إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره، فإنه لا يدري ما خلفه عليه، ثم ليضطجع على شقه الأيمن، ثم ليقل: باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","s":"صحيح البخاري","v":4,"p":340,"d":0,"c":"المعنى الخامس: النوم، فالنوم موت خفيف، والموت نوم ثقيل. فأحدنا إن نام إما أن يصحو من النوم أو لا يصحو، فإذا لم يصح من نومه نسأل الله أن يرحمه، وإذا صحا من نومه نسأل الله أن يحفظه من المعاصي."}],"17":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"عش ما شئت فإنك ميت، وأحبب من شئت فإنك مفارقه، واعمل ما شئت فإنك مجزي به","s":"رواه الحاكم عن سهل بن سعد وهو حديث حسن","v":1,"p":288,"d":0,"c":"كل مخلوق يموت ولا يبقى إلا ذو العزة والجبروت. الليل مهما طال فلا بد من طلوع الفجر، والعمر مهما طال فلا بد من نزول القبر. حياتنا في الدنيا غير حقيقية، حياة مؤقتة، لأنه يعقبها موت."},{"t":"اثبت أحد، فإن عليك نبيًا وصديقًا وشهيدين","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"إن من أمنّ الناس عليّ في صحبته وماله أبا بكر، ولو كنت متخذًا خليلًا غير ربي عز وجل لاتخذت أبا بكر، ولكن أخوة الإسلام ومودته، لا يبقين في المسجد باب إلا سد إلا باب أبي بكر","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0},{"t":"لو كنت متخذًا من أمتي خليلًا لاتخذت أبا بكر خليلًا، ولكن أخي وصاحبي","s":"أخرجه البخاري في صحيحه","v":1,"p":296,"d":0,"c":"المستحق لخالص الطاعة والعبادة والإخلاص والحب هو الله، فلا أعتقد أن في الأرض رجلين تحابّا كالصديق ورسول الله، ومع ذلك لم يتخذه خليلاً. فسر السعادة أنك تعمل لوجه واحد، فترضي جهة واحدة، وتبحث عن خالق عظيم فتمحضه كل نفسك."}],"18":[{"t":"اسم الله الأعظم في هاتين الآيتين: ﴿وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾ وفاتحة سورة آل عمران: ﴿الم * اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾","s":"","v":1,"p":284,"d":1},{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":0,"c":"وهذا الاسم أيضاً ورد في السنة من حديث أنس بن مالك رضي الله عنه."},{"t":"إن الأمر بالمعروف والنهي عن المنكر لا يقطع رزقًا ولا يقرب أجلًا","s":"أخرجه ابن أبي حاتم في تفسيره","v":1,"p":307,"d":0,"c":"وقال بعض العلماء: القيوم هو القائم على خلقه بآجالهم وأعمالهم وأرزاقهم."},{"t":"البر لا يبلى، والذنب لا يُنسى، والديان لا يموت","s":"أخرجه عبد الرزاق في مصنفه عن أبي قلابة مرسلًا","v":1,"p":308,"d":0},{"t":"الأمانة غنى","s":"رواه القضاعي في مسند الشهاب من حديث أنس بن مالك","v":1,"p":308,"d":0,"c":"طبعاً من معانيها الضيقة ألا يأكل الإنسان مالاً حراماً، ومن معانيها الواسعة أن تكون أميناً في عملك، أميناً في اختصاصك وأميناً في كل شيء."},{"t":"اللهم لك الحمد أنت قيّم السماوات والأرض ومن فيهن، ولك الحمد لك ملك السماوات والأرض ومن فيهن، ولك الحمد أنت نور السماوات والأرض ومن فيهن...","s":"أخرجه البخاري","v":1,"p":313,"d":0,"c":"واسم القيوم من أسماء الله الحسنى، وإذا تعمقت في اسم القيوم تركت الخلق واتجهت إلى الحق، وارتاحت نفسك من القلق ونجوت من الاضطراب."}],"38":[{"t":"لا إله إلا الله الواحد القهار، رب السماوات والأرض وما بينهما العزيز الغفار","s":"أخرجه النسائي في الكبرى والطبراني عن عائشة","v":1,"p":172,"d":1},{"t":"يوم تبدل الأرض غير الأرض والسماوات وبرزوا لله الواحد القهار، قلت: أين الناس يومئذ؟ قال: على الصراط","s":"","v":2,"p":132,"d":1},{"t":"أوتروا يا أهل القرآن، فإن الله وتر يحب الوتر","s":"رواه مسلم والترمذي","v":2,"p":144,"d":0,"c":"أي يحب القلب المنفرد بمحبته تعالى، فالله لا يقبل العمل المشترك ولا القلب المشترك."},{"t":"والذي نفسي بيده لقد سأل الله باسمه الأعظم الذي إذا دعي به أجاب، وإذا سئل به أعطى","s":"رواه الترمذي وغيره","v":2,"p":144,"d":0,"c":"والحقيقة أن هذا البحث في التوحيد بحث ثمين، والتوحيد علم جليل مقتبس من اسم الله الواحد."}],"76":[{"t":"إن الله يحب معالي الأمور وأشرافها، ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":231,"d":0,"c":"والمؤمن يتعالى عن كل السفاسف. المؤمن في أفق معرفة الله، في أفق الدعوة إليه، في أفق خدمة عباده، في أفق الأعمال الصالحة، في أفق تطهير قلبه من كل دنس."}],"77":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي","s":"رواه مسلم عن أبي هريرة","v":3,"p":243,"d":0,"c":"وهنا يقول بعض العلماء: الله جل جلاله اختار هذا الاسم لذاته ليقصده عباده في المهمات في دنياهم وفي دينهم. نعم، هناك دنيا ضرورية للآخرة، وما ورد في الدعاء اشتمل على صلاح الدنيا والآخرة."},{"t":"أعظم النساء بركة أيسرهن مؤونة","s":"","v":3,"p":244,"d":0,"c":"تجد المؤمن مؤونته خفيفة، وحاجاته خفيفة، بل إن النبي صلى الله عليه وسلم وصف الزوجة الصالحة بأنها قليلة المؤونة؛ أي طلباتها قليلة تقنع بالقليل."}],"4":[{"t":"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد","s":"رواه البخاري ومسلم عن المغيرة بن شعبة","v":1,"p":97,"d":0},{"t":"الكبرياء ردائي، والعظمة إزاري، فمن نازعني منهما شيئًا أذقته عذابي","s":"أخرجه أحمد وأبو داود وابن ماجه عن أبي هريرة؛ وابن ماجه عن ابن عباس","v":1,"p":101,"d":0,"c":"إن أمة قوية خططت لبناء مجدها على أنقاض الشعوب وإذلالها، إن هذه القوة الغاشمة نجاح خططها على المدى البعيد يتناقض مع وجود الله."},{"t":"ولكل شيء حقيقة، وما بلغ العبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه أحمد والطبراني عن أبي الدرداء","v":1,"p":102,"d":0,"c":"القدر هو الفعل والمقدور هو العلم، والله عز وجل عليم قدير. يعلم أن فلانًا من الناس مستقيم فيقدر له توفيقًا، ويطلع على إنسان كاذب فيقدر له علاجًا؛ فمجمل القضاء والقدر أن الله يعلم ويقدّر لهذا الإنسان ما يناسبه."},{"t":"ولكل شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه الطبراني عن أبي الدرداء","v":3,"p":478,"d":0,"c":"فالحكم الكوني واقع لا محالة، فكل شيء وقع أراده الله، وكل شيء أراده الله وقع، وإرادة الله متعلقة بالحكمة المطلقة، والحكمة المطلقة متعلقة بالخير المطلق."}],"71":[{"t":"يا رسول الله! كيف يحشر أهل النار على وجوههم؟ قال: إن الذي أمشاهم على أقدامهم قادر أن يمشيهم على وجوههم","s":"أحمد عن أنس بن مالك","v":3,"p":151,"d":0},{"t":"إن الله لا يقدس أمة لا يأخذ الضعيف حقه من القوي","s":"أخرجه الحاكم عن أبي سفيان بن الحارث بن عبد المطلب","v":3,"p":160,"d":0,"c":"ومن عرف القادر جل جلاله فإنه لا يخنع ولا يستسلم، هو متواضع لله لكن لا يضعف أمام خصمه. يمكن أن نمر بأزمات طاحنة ونبقى أمة قوية، أما إذا ذهب الحق والعدل فقد انتهينا عند الله."}],"55":[{"t":"أما إنك لو لم تفعل للفحتك النار أو لمستك النار","s":"صحيح مسلم","v":2,"p":421,"d":0,"c":"من أدب المؤمن مع ربه المقتدر أن يستحضر قدرة الله دائمًا أمامه. فعندما يتحرك الإنسان ويعلم دائمًا أن الله على كل شيء قدير يكون في حركته رحمة."},{"t":"اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب","s":"","v":2,"p":422,"d":0,"c":"أي: أستعين بقدرتك على تحقيق هذا الأمر، وأطلب منك أن تجعل لي يا رب قدرة على المطلوب لأني ضعيف؛ فالإنسان ضعيف والله هو القدير."},{"t":"فلا تقل: لو أني فعلت لكان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن لو تفتح عمل الشيطان","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":423,"d":0,"c":"وقد علمنا النبي موقف الموحد فيما وقع ومضى من الأحداث. آخر كلمة في اسم المقتدر: إن عرفت قدرته وقدره خضعت له واستعنت به واعتمدت عليه وتوكلت عليه فأصبحت أقوى الأقوياء."}],"82":[{"t":"من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه","s":"أخرجه البخاري ومسلم والترمذي والنسائي عن أبي هريرة","v":3,"p":292,"d":0,"c":"المقدَّم: كل ما قدمت أيها الإنسان من خير أو شر وتقدمت لفلان فيه. والعمل الصالح الذي قدمته ابتغاء وجه الله هو قدم."},{"t":"إن الله يحب معالي الأمور وأشرافها ويكره سفسافها","s":"أخرجه الطبراني عن الحسين بن علي","v":3,"p":293,"d":0,"c":"أما التقديم الشرعي فهذا متعلق بمحبة الله لفعل دون فعل. فالله قدّم في محبته معالي الأمور، فالله تعالى أحب أعمالًا فقدمها في الثواب، وأبغض أعمالًا فأخرها في الثواب."},{"t":"إن الله وملائكته يصلون على الصف المقدم، والمؤذن يغفر له مدى صوته ويصدقه من سمعه من رطب ويابس، وله مثل أجر من صلى معه","s":"أخرجه النسائي عن البراء بن عازب","v":3,"p":294,"d":0,"c":"فالله تعالى أحب أعمالًا فقدّمها في الثواب، وأبغض أعمالًا فأخّرها في الثواب. فالمقدِّم هو الله جل جلاله الذي يقدّم الأشياء ويضعها في مواضعها على مقتضى حكمته وعلى مقتضى الاستحقاق."},{"t":"لو كنت متخذًا خليلًا لاتخذت أبا بكر خليلًا... ولكن أخوة الإسلام، لا تبقين في المسجد خوخة إلا خوخة أبي بكر","s":"متفق عليه من حديث أبي سعيد الخدري","v":3,"p":300,"d":0,"c":"فالله قدّمه؛ ما أخذ رسول الله من أحد ماله كله إلا أبا بكر. الله قدّمهما، وفي كل مجتمع مقدَّم ومؤخَّر."}],"83":[{"t":"اللهم ربنا لك الحمد، أنت قيّم السماوات والأرض ومن فيهن","s":"","v":3,"p":307,"d":0,"c":"المؤخر عكس المقدم، فالله جل جلاله هو المؤخر أي هو الذي يؤخر الأشياء فيضعها في مواضعها، إما تأخيراً كونياً أو تأخيراً شرعياً."},{"t":"فمن لم يأت الدعوة فقد عصى الله ورسوله","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":312,"d":0,"c":"إذاً المؤمن يقدم أهل الإيمان ودعوة أهل الإيمان. وأنت عندما تتخلق بكمالات الله تقدم المؤمن وتجله، وإذا وجدت فاسقاً أو فاجراً تؤخره، وتأخيرك إياه له معنى ردع له وتحجيم لحاله."},{"t":"إذا دعي أحدكم فليجب، فإن كان صائمًا فليصل، وإن كان مفطرًا فليطعم","s":"رواه مسلم من حديث أبي هريرة","v":3,"p":313,"d":0,"c":"إذاً المؤمن يقدم أهل الإيمان ودعوة أهل الإيمان. فأنت عندما تتخلق بكمالات الله تقدم المؤمن وتجله، وإذا وجدت فاسقاً أو فاجراً تؤخره."},{"t":"إن الملائكة تضع أجنحتها لطالب العلم","s":"","v":3,"p":313,"d":0,"c":"فأنت عندما تقدّم أهل الإيمان تنعشهم. وأنت عندما تتخلق بكمالات الله تقدّم المؤمن وتجلّه، وإذا وجدت فاسقاً أو فاجراً تؤخره، وتأخيرك إياه له معنى ردع له وتحجيم لحاله."},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":3,"p":315,"d":0,"c":"لا تخضع لكافر، لا تقبل منه عطاء أو نحوه كأن يقوم بإيصالك بمركبته ويستعلي عليك، فأنت عزيز. وإذا كان إنساناً منحرفاً متفلتاً يمنّ عليك ويتفضل عليك فلا تقبل منه شيئاً."},{"t":"رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله وما أنت أعلم به مني، اللهم اغفر لي خطاياي وعمدي وجهلي وهزلي وكل ذلك عندي، اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت","s":"صحيح البخاري من حديث أبي موسى الأشعري","v":3,"p":318,"d":0,"c":"فالبطولة أن تقدم ما قدمه الله، وأن تؤخر ما أخره الله، وأن ترعى حق الله وحق الناس، وأن تأتي مقاييسك متوافقة مع مقاييس القرآن الكريم، عندئذ تكون قد استفدت من اسمي المقدّم والمؤخّر."}],"57":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"كان الله ولم يكن شيء غيره","s":"","v":2,"p":435,"d":0,"c":"من معاني هذا الاسم أنك مهما أوغلت في النهاية فإنك ستصل إلى الله، فالله وراء كل شيء وسبب كل مسبَّب. إذا تحركت نحو الوراء بسلسلة الأسباب وجب قطعاً أن تنتهي إلى الله، هو الأول."},{"t":"كان الله ولم يكن شيء غيره، وكان عرشه على الماء، وكتب في الذكر كل شيء، وخلق السماوات والأرض","s":"رواه البخاري","v":2,"p":436,"d":0,"c":"كان الله ولم يكن معه شيء، وسيدنا علي سُئل: متى كان الله؟ فأجاب: ومتى لم يكن. هو الأول بكل ما سواه، المتقدم على كل ما عداه، فكل ما سوى الله يأتي بعد الله."},{"t":"بعثت أنا والساعة هكذا - وقرن بين السبابة والوسطى","s":"صحيح البخاري","v":2,"p":441,"d":0,"c":"لو انتهت الحياة الدنيا فماذا بعد الحياة الدنيا؟ الله، هو الأول والآخر، لو تحركت نحو الماضي فالله هو الأول، ونحو المستقبل فالله هو الآخر."}],"58":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1}],"59":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1},{"t":"خير الصدقة ما كان عن ظهر غنى","s":"أخرجه البخاري وأبو داود والنسائي عن أبي هريرة","v":2,"p":454,"d":0,"c":"والظاهر من السَّند والدعم."}],"60":[{"t":"اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"أخرجه مسلم وأبو داود والترمذي عن أبي هريرة","v":2,"p":433,"d":1},{"t":"وأنت الباطن فليس دونك شيء","s":"","v":2,"p":465,"d":1},{"t":"اللهم رب السماوات ورب الأرض ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر","s":"صحيح مسلم","v":2,"p":474,"d":1}],"41":[{"t":"فإنما ترزقون وتنصرون بضعفائكم","s":"","v":2,"p":181,"d":0},{"t":"أتدرون ما المفلس؟ قالوا: المفلس فينا من لا درهم له ولا متاع. قال: إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه ثم طرح في النار","s":"أخرجه مسلم والترمذي عن أبي هريرة","v":2,"p":185,"d":0,"c":"ويجب أن يتعالى المؤمن عن كل نقص في عباداته. فلا يمكن أن تقطف ثمار الصلاة إلا إذا سبقتها استقامة والتزام، فالمؤمن يتعالى عن كل نقص في فهمه للعبادات."},{"t":"إن الله يحب معالي الأمور وأشرافها، ويكره سفسافها ودنيها","s":"أخرجه الطبراني عن الحسين بن علي","v":2,"p":187,"d":0,"c":"والمؤمن يتعالى عن كل السفاسف. المؤمن في أفق معرفة الله، في أفق الدعوة إليه، في أفق خدمة عباده، في أفق الأعمال الصالحة، في أفق تطهير قلبه من كل دنس."}],"54":[{"t":"رب أشعث مدفوع بالأبواب لو أقسم على الله لأبره","s":"أخرجه مسلم عن أبي هريرة","v":2,"p":396,"d":0,"c":"قال أبو السعود: البر كثير الرحمة، الذي إذا عبد أثاب، وإذا سئل أجاب."},{"t":"عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقًا، وإياكم والكذب، فإن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار، وما يزال العبد يكذب ويتحرى الكذب حتى يكتب عند الله كذابًا","s":"متفق عليه من حديث عبد الله بن مسعود","v":2,"p":398,"d":0,"c":"فالبر اسم جامع لخيري الدنيا والآخرة. إن الصدق يهدي إلى البر... أي إلى الصلاح، إلى خيري الدنيا والآخرة، إلى الخير المطلق."},{"t":"يا أيها الناس! إن الله قد أذهب عنكم عبية الجاهلية وتعاظمها بآبائها، فالناس رجلان: برّ تقي كريم على الله، وفاجر شقي هين على الله، والناس بنو آدم، وآدم من تراب","s":"","v":2,"p":402,"d":0,"c":"فالبر أي المحسن مطلق الإحسان، يجوز أن تقول: فلان بر. فالعبد يكون برا بقدر ما يفعل من البر."},{"t":"لقد رفعوا إليّ في الجنة فيما يرى النائم على سرر من ذهب، فرأيت في سرير عبد الله بن رواحة ازورارًا عن سريري صاحبيه، فقلت: بم هذا؟ فقيل لي: مضيا وتردد عبد الله بن رواحة بعض التردد ثم مضى","s":"رواه الطبراني ورجاله ثقات من حديث عبد الله بن الزبير","v":2,"p":404,"d":0,"c":"درجته نزلت لتردده لعشر ثوان ثم مات شهيداً، فإحسان الله كبير جداً. فإذا ترددت في خدمة إنسان بإنفاق أو بصدقة، أو ترددت في أداء صلاة أو حضور مجلس علم فهذه مشكلة كبيرة."},{"t":"البر لا يبلى، والذنب لا ينسى، والديان لا يموت، اعمل ما شئت كما تدين تدان","s":"أخرجه عبد الرزاق في مصنفه عن أبي قلابة مرسلًا","v":2,"p":409,"d":0,"c":"أي أن المؤمن معطاء؛ فالمؤمن بالتعبير الحديث اتخذ قراراً استراتيجياً أن يعطي من وقته ومن ماله ومن خبرته، والكافر رغبته مبنية على الأخذ."},{"t":"رضا الرب في رضا الوالدين","s":"","v":2,"p":410,"d":0,"c":"قالوا: المؤمن متى عرف أن الله هو البر الرحيم ينبغي أن يكون براً بكل أحد، لا سيما بوالديه."},{"t":"وإن أحسن الناس إسلامًا أحسنهم خلقًا","s":"أخرجه أبو يعلى والطبراني عن جابر بن سمرة","v":2,"p":410,"d":0,"c":"والسنة المطهرة أكدت أن البر حسن الخلق، وكأن الدين مجموعة أخلاقية."},{"t":"ما من شيء أثقل في ميزان المؤمن يوم القيامة من خلق حسن","s":"أخرجه أبو داود والترمذي عن أبي الدرداء","v":2,"p":411,"d":0},{"t":"إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم","s":"أخرجه أبو داود عن عائشة أم المؤمنين","v":2,"p":411,"d":0},{"t":"إن العبد ليبلغ بحسن خلقه عظيم درجات الآخرة","s":"أخرجه الطبراني عن أنس بن مالك","v":2,"p":411,"d":0},{"t":"الخلق الحسن يذيب الخطايا كما يذيب الماء الجليد، والخلق السوء يفسد العمل كما يفسد الخل العسل","s":"أخرجه الطبراني عن عبد الله بن عباس","v":2,"p":411,"d":0}],"7":[{"t":"رب اغفر لي وتب عليّ إنك أنت التواب الرحيم","s":"","v":1,"p":137,"d":1},{"t":"قال الله عز وجل: أنا عند ظن عبدي بي، وأنا معه حيث يذكرني، والله لله أفرح بتوبة عبده من أحدكم يجد ضالته بالفلاة، ومن تقرب إليّ شبرًا تقربت إليه ذراعًا، ومن تقرب إليّ ذراعًا تقربت إليه باعًا، وإذا أقبل إليّ يمشي أقبلت إليه أهرول","s":"","v":1,"p":138,"d":0,"c":"التواب يعامل عباده بأعلى درجات الرحمة... كيف عامله الله عز وجل؟ بالرحمة والمتابعة، الله معك في كل خطراتك، معك في كل حركاتك، معك في سرك ومعك في جهرك."}],"114":[{"t":"يا أبا جهل بن هشام، يا أمية بن خلف، يا عتبة بن ربيعة، يا شيبة بن ربيعة، أليس قد وجدتم ما وعد ربكم حقًا؟ فإني قد وجدت ما وعدني ربي حقًا... والذي نفسي بيده ما أنتم بأسمع لما أقول منهم","s":"أخرجه مسلم عن أنس بن مالك","v":4,"p":250,"d":0}],"27":[{"t":"سلوا الله العفو والعافية واليقين في الآخرة والأولى","s":"أخرجه أحمد في مسنده","v":1,"p":463,"d":1},{"t":"اللهم إنك عفو تحب العفو فاعف عني","s":"رواه أحمد وابن ماجه والترمذي وصححه","v":2,"p":341,"d":1},{"t":"اللهم إنك عفو كريم تحب العفو فاعف عني","s":"أخرجه الترمذي عن عائشة أم المؤمنين","v":3,"p":164,"d":1},{"t":"مرحبًا بالراكب المهاجر","s":"أخرجه الحاكم في المستدرك والترمذي عن عكرمة بن أبي جهل","v":1,"p":465,"d":0,"c":"فالإنسان حينما تعفو عنه تربحه. فجاء عكرمة مسلماً تائباً مستغفراً، فالنبي صلى الله عليه وسلم بالغ في إكرامه."}],"11":[{"t":"من اشترى سرقة وهو يعلم أنها سرقة فقد اشترك في عارها وإثمها","s":"أخرجه الحاكم في المستدرك والبيهقي في شعب الإيمان","v":1,"p":220,"d":0,"c":"هذا الذي يعين الناس على أن يسرقوا لغفلته وعدم انضباطه ليس أقل إثماً منهم، إثمه كإثمهم، لأن أموره غير مضبوطة. فأنت حينما تحول بين الناس وبين أن يقعوا في المعاصي تكون قد تخلقت باسم الرؤوف."},{"t":"هل تنصرون وترزقون إلا بضعفائكم","s":"البخاري عن سهل بن سعد","v":1,"p":222,"d":0,"c":"تقرّب إلى الله بأن ترحم خلقه، أن ترحم الضعيف. فإن أطعمت الضعيف وسقيته وكسوته ونصرته وآويته وعلمته وزوجته يكافئك الله مكافأة من جنس عملك، فينصرك على من هو أقوى منك."}],"111":[{"t":"اعلم أبا مسعود! لله أقدر عليك منك عليه","s":"رواه مسلم من حديث أبي مسعود الأنصاري","v":4,"p":193,"d":0,"c":"وقال بعضهم: إذا دعتك قدرتك إلى ظلم الناس فتذكّر قدرة الله عليك. فإذا ظن الإنسان أنه قوي وأنه يفعل ما يريد فاستخدم هذه القوة في غير العدل فقد استوجب سخط الله عز وجل."},{"t":"دخلت امرأة النار من جراء هرة لها أو هي ربطتها، فلا هي أطعمتها ولا هي أرسلتها ترمرم من خشاش الأرض","s":"صحيح مسلم","v":4,"p":195,"d":0,"c":"قد يكون المظلوم هرّة... فالظلم ظلمات يوم القيامة. وقال أحد العلماء: المقسط هو الذي ينتصف للمظلوم من الظالم."},{"t":"اتقوا الله وأصلحوا ذات بينكم، فإن الله تعالى يصلح بين المسلمين","s":"أخرجه الحاكم في المستدرك","v":4,"p":198,"d":0,"c":"فالله عز وجل مختص بهذا وحده؛ وهو الذي يستطيع أن ينتصر للمظلوم من الظالم، فإذا رجع الظالم عن ظلمه أرضى الظالم أيضاً وشملته رحمته. وبعض العلماء يقول: إن أكمل درجات الإقساط والعدل أن تعامل كلا الطرفين معاملة يرضيان عنها."},{"t":"فاتقوا الله واعدلوا بين أولادكم","s":"","v":4,"p":199,"d":0,"c":"لو ظلمت ابنتك زوجها وجارت عليه فكن عادلاً وأنصف المظلوم، وإذا بغى ابنك على صديقه فردّ الباغي: كن عادلاً وخذ بيد المظلوم. لكن أكثر الناس مع ابنه على حق أو على باطل؛ ما الذي يميز المؤمن من الكافر؟ العدل."},{"t":"واتق دعوة المظلوم، فإنها ليس بينها وبين الله حجاب","s":"صحيح البخاري من حديث ابن عباس","v":4,"p":206,"d":0,"c":"فدائماً وأبداً العدل العدل. والأبلغ من ذلك أنك إذا ظلمت مسلماً أبغضك المسلم، أما إذا ظلمت غير مسلم فإن المظلوم يبغض دينك ويقول: الإسلام ظلمني."}],"32":[{"t":"اللهم أنت الله لا إله إلا أنت، أنت الغني ونحن الفقراء","s":"","v":2,"p":24,"d":1},{"t":"قال الله عز وجل: أنفق أنفق عليك، وقال: يد الله ملأى لا تغيضها نفقة، سحاء الليل والنهار، أرأيتم ما أنفق منذ خلق السماء والأرض؟ فإنه لم يغض ما في يده، وكان عرشه على الماء، وبيده الميزان يخفض ويرفع","s":"متفق عليه عن أبي هريرة","v":2,"p":27,"d":0,"c":"والحقيقة أنه من المستحيل أن يكون تقليل الله عز وجل تقليل عجز، أما نحن البشر فنقلّل تقليل عجز؛ أما الله جل جلاله إذا قلّل فتقليله تقليل تأديب."},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئًا","s":"صحيح مسلم عن أبي ذر","v":2,"p":29,"d":0,"c":"الغني الحقيقي هو الذي لا يتعلق بشيء، ذلك هو الله. وقيل: الغني هو الذي لا يحتاج إلى شيء وهو المستغني عن كل شيء، وفقير إليه كل شيء."}],"108":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر","s":"رواه مسلم من حديث أبي هريرة","v":4,"p":153,"d":0,"c":"هو الذي يمنع أهل دينه، أي: يحوطهم وينصرهم. وقيل: هو الذي يرد أسباب الهلاك والنقصان في الأديان والأبدان، كما كان يدعو النبي صلى الله عليه وسلم."},{"t":"اللهم لا تجعل لفاجر عندي نعمة أكافئه بها في الدنيا والآخرة","s":"أخرجه الديلمي في الفردوس من حديث معاذ","v":4,"p":160,"d":0,"c":"لا تخضع لكافر، لا تقبل منه عطاء أو نحوه كأن يقوم بإيصالك بمركبته ويستعلي عليك، فأنت عزيز. وإذا كان إنساناً منحرفاً متفلتاً يمنّ عليك ويتفضل عليك فلا تقبل منه شيئاً."}],"109":[{"t":"اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي","s":"","v":4,"p":169,"d":0,"c":"ونفع الله لعبده لا يقتصر على الدنيا وإنما يشمل الدنيا والآخرة. معنى ذلك أن الدنيا تكمل الآخرة والآخرة تكمل الدنيا."},{"t":"إن ربكم حيي كريم يستحيي إذا رفع الرجل إليه يديه أن يردهما صفرًا خائبتين","s":"رواه أبو داود والترمذي من حديث سلمان الفارسي","v":4,"p":170,"d":0,"c":"فالله عز وجل لا يرضيه أن يهلكك ولا أن يفقرك ولا أن يحبس حريتك ولا أن يمرضك؛ فالإذلال والإفقار وحبس الحرية والخوف والهم والحزن لا ترضي الله عز وجل، لأن الله حيي كريم. لكن لحكمته البالغة لا بد أن يسوق لعبده العاصي بعض الشدائد."}],"104":[{"t":"حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه","s":"","v":2,"p":112,"d":1},{"t":"لو كنتم في بيوتكم كما تكونون عندي لصافحتكم الملائكة وأنتم على فرشكم وبالطرق... يا حنظلة، ساعة وساعة","s":"رواه أحمد في مسنده وأصله في صحيح مسلم، عن حنظلة الأسيدي","v":4,"p":84,"d":0,"c":"الذي شعر به أصحاب رسول الله ﷺ شيء لا يوصف. كانوا إذا جلسوا معه ارتاحت قلوبهم واطمأنت نفوسهم وكأنهم في جنة."},{"t":"لو أن امرأة من أهل الجنة اطلعت إلى أهل الأرض لأضاءت ما بينهما - أي: ما بين السماء والأرض - ولملأته ريحا - أي: عطرا - ولنصيفها - أي: خمارها - على رأسها خير من الدنيا وما فيها","s":"رواه البخاري عن أنس بن مالك","v":4,"p":86,"d":0,"c":"إذا اتصل الإنسان بالله عز وجل وجدت على وجهه نورا. كان النبي ﷺ له وجه كالشمس، وتصف بعض الأحاديث الشريفة نور أهل الجنة."},{"t":"لو أن واحدة من الحور العين أشرفت لأضاءت ما بين المشرق والمغرب، ولملأت ما بين السماء والأرض من طيبها","s":"مسند أبي حنيفة عن أم هانئ","v":4,"p":86,"d":0},{"t":"لو أن امرأة من نساء أهل الجنة أشرفت إلى الأرض لملأت الأرض من ريح المسك، ولأذهبت ضوء الشمس والقمر","s":"رواه الطبراني والضياء عن سعيد بن عامر مرفوعا","v":4,"p":87,"d":0},{"t":"الله هادي السماوات والأرض","s":"عن ابن عباس","v":4,"p":87,"d":0,"c":"مثل هداه في قلب المؤمن كما يكاد الزيت الصافي يضيء قبل أن تمسه النار، فإذا مسته النار ازداد ضوءا على ضوء، فيزداد نورا على نور."},{"t":"اللهم اجعل لي في قلبي نورا، ونورا في لساني، ونورا من بين يدي ونورا من خلفي، ونورا عن يميني ونورا عن شمالي ونورا من فوقي ونورا من تحتي، ونورا في سمعي ونورا في بصري، ونورا في شعري ونورا في بشري ونورا في لحمي ونورا في دمي ونورا في عظامي، اللهم أعظم لي نورا وأعطني نورا واجعل لي نورا","s":"رواه الترمذي عن ابن عباس","v":4,"p":88,"d":1}],"118":[{"t":"قال الله: أنفق يا ابن آدم أنفق عليك","s":"أخرجه البخاري","v":4,"p":299,"d":0,"c":"أجل، علمك الله عز وجل بأفعاله، هو يعلمك باستمرار. يعلمك بأفعاله، لكن الإنسان حينما يفهم عن ربه ما يأمر وما ينهى، وحينما تنعقد صلة مباشرة، إدراك مباشر، تجد أن هذه بتلك وهذا الصنيع لذاك الفعل."},{"t":"الرؤيا الصالحة جزء من ست وأربعين جزءًا من النبوة","s":"أخرجه البخاري ومسلم من حديث أبي سعيد الخدري","v":4,"p":302,"d":0,"c":"الرؤيا الصالحة هذه الرؤيا تحول بعض الناس إلى طاعة الله عز وجل، أي إن الله عز وجل إذا أراد أن يعلمك شيئا بطريق مباشر بلا استنباط ولا تأمل ولا إدراك، ولا من طريق الأفعال ولا من طريق الخلق ولا من طريق القرآن."}],"102":[{"t":"أوصيكم بالأنصار، فإنهم كرشي وعيبتي، وقد قضوا الذي عليهم وبقي الذي لهم، فاقبلوا من محسنهم وتجاوزوا عن مسيئهم","s":"رواه البخاري من حديث أنس بن مالك","v":4,"p":41,"d":0,"c":"الأنصار أدوا الذي عليهم وبقي الذي لهم... والشاب التائب قد أدى ما عليه من صلاة وصيام وزكاة وطاعة لله... أدى الذي عليه، والذي بقي له؟ كل خير. بقي لك ثواب الطاعة، بقي لك الإقبال على الله، بقي لك التوفيق."}],"42":[{"t":"اللهم اقسم لنا من خشيتك ما يحول بيننا وبين معاصيك، ومن طاعتك ما تبلغنا به جنتك، ومن اليقين ما تهون به علينا مصيبات الدنيا، ومتعنا بأسماعنا وأبصارنا وقوتنا ما أحييتنا، واجعله الوارث منا، واجعل ثأرنا على من ظلمنا، وانصرنا على من عادانا، ولا تجعل مصيبتنا في ديننا، ولا تجعل الدنيا أكبر همنا ولا مبلغ علمنا","s":"","v":2,"p":203,"d":0,"c":"إذا فقد الإنسان بصره قبل أن يموت فمن ورث الآخر؟ هو ورث بصره. إذا فقد سمعه قبل أن يموت فهو ورث سمعه، أما إذا استمتع ببصره وبسمعه وعقله وقوته إلى أن مات فهذه هي التي ورثته."},{"t":"إن الرجل ليعمل - وإن المرأة لتعمل - بطاعة الله ستين عامًا، ثم يحضرهما الموت فيضاران في الوصية، فتجب لهما النار","s":"أخرجه أبو داود والترمذي عن أبي هريرة","v":2,"p":204,"d":0,"c":"من علاقة المؤمن بهذا الاسم أولا أن يتقي الله في حقوق الإرث، هناك حديث يقصم الظهر. لقد تولى الله بذاته توزيع الإرث، كثير من الأسر المسلمة يحرمون البنات. علاقتك بهذا الاسم الوارث أن تتقي الله في الإرث، أن تعطي كلا حقه."}],"3":[{"t":"ألا أعلمك دعاءً تدعو به لو كان عليك مثل جبل أحد دينًا لأداه الله عنك؟ قل يا معاذ: اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة ورحيمهما، تعطيهما من تشاء وتمنع منهما من تشاء، ارحمني رحمةً تغنيني بها عن رحمة من سواك","s":"رواه الطبراني في الصغير عن أنس بن مالك بإسناد جيد","v":1,"p":47,"d":1},{"t":"من أحيا أرضًا ميتة فهي له","s":"البخاري عن عمر بن الخطاب","v":1,"p":82,"d":0,"c":"علة استحقاق الملك أمران: الأول صناعة الشيء وإنشاؤه واختراعه، فالعاقل يعلم عقلا أن المخترع له براءة الاختراع، والمؤلف له حق الطبع والنشر. ما من تشريع حضاري يقلب الأرض القاحلة جنة كهذا التشريع."},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء","s":"","v":1,"p":83,"d":0,"c":"ولأن الله مَلَك كل شيء في عالم الشهادة والغيب، فدوام الحياة علة أخرى لاستحقاق الملك، لأن الموت يوجب انتقال الملكية من جهة إلى جهة، أما الله عز وجل فحي باق على الدوام وهو الوارث الباقي بعد فناء خلقه؛ فعلة الخلق وعلة دوام الحياة توجبان أن الله مالك كل شيء أزلًا وأبدًا."},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله، قد مضى القلم بما هو كائن، فلو جهد الناس أن ينفعوك بما لم يقضه الله لك لم يقدروا عليه، ولو جهد الناس أن يضروك بما لم يكتبه الله عليك لم يقدروا عليه، فإن استطعت أن تعمل بالصبر مع اليقين فافعل، فإن لم تستطع فاصبر، فإن في الصبر على ما تكره خيرًا كثيرًا، واعلم أن النصر مع الصبر، وأن الفرج مع الكرب، وأن مع العسر يسرًا","s":"أخرجه الحاكم في المستدرك من حديث ابن عباس","v":1,"p":86,"d":0,"c":"فملخص الملخص: ما شاء الله كان وما لم يشأ لم يكن. ومعنى مالك الملك أن هذا الكون العظيم تحكمه إرادة واحدة نافذة فيه هي إرادة الله."},{"t":"عجبًا لأمر المؤمن! إن أمره كله له خير، إن أصابته سراء شكر فكان خيرًا له، وإن أصابته ضراء صبر فكان خيرًا له، وليس ذلك لغير المؤمن","s":"أخرجه مسلم عن صهيب الرومي","v":1,"p":89,"d":0,"c":"إذاً الإعزاز خير والإذلال خير، والإعطاء خير والمنع خير، والإيتاء خير والسلب خير، فكل هذا خير."}],"90":[{"t":"إن أخنع اسم عند الله رجل تسمى ملك الأملاك، لا مالك إلا الله","s":"متفق عليه عن أبي هريرة","v":3,"p":388,"d":0,"c":"إذا كان الحق سبحانه وتعالى مالكاً لعالم الغيب والشهادة وما فيهما، فهو مالك على سبيل الإطلاق أزلاً وأبداً. وقد ثبت ذلك عند مسلم حين ورد اسم المالك في الحديث الصحيح مطلقاً."},{"t":"كان الله ولم يكن شيء قبله، وكان عرشه على الماء، ثم خلق السماوات والأرض، وكتب في الذكر كل شيء","s":"أخرجه البخاري والترمذي عن عمران بن حصين","v":3,"p":389,"d":0,"c":"الأمر الثاني: حق التصرف في الملك. ولأن الله ملك كل شيء في عالم الشهادة والغيب، فعلة الخلق وعلة دوام الحياة توجبان أن الله مالك كل شيء أزلاً وأبداً، دنيا وآخرة، شهادة وغيباً."},{"t":"احفظ الله يحفظك، احفظ الله تجده أمامك، تعرّف إلى الله في الرخاء يعرفك في الشدة، وإذا سألت فاسأل الله، وإذا استعنت فاستعن بالله","s":"أخرجه الحاكم في المستدرك","v":3,"p":392,"d":0,"c":"فملخص الملخص: ما شاء الله كان وما لم يشأ لم يكن. ومعنى مالك الملك أن هذا الكون العظيم تحكمه إرادة واحدة نافذة فيه هي إرادة الله."}],"105":[{"t":"كان مع رسول الله ﷺ جالسًا ورجل يصلي، ثم دعا: اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حي يا قيوم، فقال النبي ﷺ: لقد دعا الله باسمه العظيم الذي إذا دعي به أجاب وإذا سئل به أعطى","s":"أبو داود","v":1,"p":301,"d":1},{"t":"اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام","s":"رواه مسلم","v":4,"p":89,"d":1},{"t":"ألظوا بيا ذا الجلال والإكرام","s":"","v":4,"p":110,"d":1},{"t":"استحيوا من الله حق الحياء","s":"","v":4,"p":98,"d":0,"c":"والإنسان إذا حدثته نفسه بما لا يليق بالله عز وجل ووسوس له الشيطان شيئاً فليذكر ذا الجلال، ويجب أن تستحيي من الله حق الحياء. ومن أدب المؤمن مع ذي الجلال أن يوقر الجليل في خلوته."},{"t":"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك","s":"متفق عليه من حديث أبي هريرة","v":4,"p":99,"d":0,"c":"إذا كان الإنسان بخلوة فلا يتكلم بكلام غير لائق، ولا يعمل أعمالاً لا ترضي الله؛ فمن أدب المؤمن مع ذي الجلال أن يوقر الجليل في خلوته، والمؤمن الصادق يشعر دائماً أن الله معه."},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئًا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد منكم ما نقص ذلك من ملكي شيئًا","s":"أخرجه مسلم من حديث أبي ذر","v":4,"p":104,"d":0,"c":"ويذكر بعض العلماء أن جلال الله منزه عن الأنصار والأعوان، فجلال الله عز وجل منزه عن الأسباب، لأنه ذو جلال بذاته دون سبب منفصل عنه."},{"t":"يا حي يا قيوم برحمتك أستغيث","s":"","v":4,"p":110,"d":0,"c":"ألظوا بيا ذا الجلال والإكرام، أي: التجئوا؛ فإذا حلت بالمؤمن مشكلة، أو ألمت به ملمة، أو دهمه خطب، أو حلت به محنة، دعا وقال: يا حي يا قيوم برحمتك أستغيث."},{"t":"إياك وما يعتذر منه","s":"أخرجه الطبراني في الأوسط من حديث ابن عمر","v":4,"p":111,"d":0,"c":"فكل عمل يجعلك أمام الناس صغيراً عليك أن تترفع عنه. أي تصرف يدفعك إلى الاعتذار وتقول: لا تؤاخذوني، فلا تفعله؛ إذا فعلت هذا صارت لك هيبة."}],"103":[{"t":"كان رسول الله ﷺ يعلمنا الاستخارة في الأمور كلها كما يعلمنا السورة من القرآن، يقول: إذا هم أحدكم بالأمر فليركع ركعتين من غير الفريضة ثم ليقل: اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك وأسألك من فضلك العظيم فإنك تقدر ولا أقدر وتعلم ولا أعلم وأنت علام الغيوب، اللهم إن كنت تعلم أن هذا الأمر خير لي في ديني ومعاشي وعاقبة أمري - أو قال: عاجل أمري وآجله - فاقدره لي ويسره لي ثم بارك لي فيه، وإن كنت تعلم أن هذا الأمر شر لي في ديني ومعاشي وعاقبة أمري - أو قال: في عاجل أمري وآجله - فاصرفه عني واصرفني عنه واقدر لي الخير حيث كان ثم رضني به. قال: ويسمي حاجته","s":"رواه البخاري عن جابر بن عبد الله","v":4,"p":68,"d":0,"c":"هو يعلم أن هذه المرأة لا تسعدك فيصرفها عنك ويصرفك عنها، وهو يعلم أن هذه التجارة لا تغنيك بل تفقرك، هو يعلم الغيب وأنت لا تعلم، فإذا فوضت فقد فوض الذي لا يعلم لمن يعلم، وهذا ذكاء وتوفيق."},{"t":"اللهم ارزقني حبك وحب من ينفعني حبه عندك، اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب، اللهم وما زويت عني مما أحب فاجعله فراغا لي فيما تحب","s":"رواه الترمذي عن عبد الله بن يزيد الخطمي الأنصاري عن رسول الله ﷺ","v":4,"p":75,"d":0}],"124":[{"t":"بسم الله، رب أعوذ بك من أن أزل أو أزل، أو أضل أو أضل، أو أظلم أو أظلم، أو أجهل أو يجهل علي","s":"رواه الأربعة عن أم سلمة","v":4,"p":396,"d":0,"c":"فقوله حكمة وصواب."},{"t":"بأبي أنت وأمي ما أوصلك وأحلمك وأكرمك","s":"رواه البيهقي في دلائل النبوة عن ابن عباس","v":4,"p":388,"d":0,"c":"إنها كلمة لخصت صفات النبي الإنسانية، من فم رجل كان بالأمس العدو الألد. (قالها أبو سفيان للنبي ﷺ حين فتح مكة)"},{"t":"اللهم إن كان غنيا فاغفر له، وإن كان فقيرا فأغنه","s":"","v":4,"p":394,"d":0,"c":"وهذا قول حكيم، يرجو من دعائه هذا العوض من الله، كما ينم عن صفاء القلب والطوية. (قاله الربيع بن خثيم حين سرق بعض ماله)"}],"81":[{"t":"إن الله عز وجل حليم حيي ستير يحب الحياء والستر، فإذا اغتسل أحدكم فليستتر","s":"رواه أبو داود عن يعلى بن أمية","v":3,"p":277,"d":1},{"t":"إن الله ستير يحب الستر","s":"سنن البيهقي عن ابن عباس","v":3,"p":277,"d":1},{"t":"جاءتني امرأة معها ابنتان لها تسأل، فلم تجد عندي غير تمرة واحدة فأعطيتها فقسمتها بين ابنتيها ثم قامت فخرجت، فدخل النبي ﷺ علينا فقال: من ابتلي من هذه البنات بشيء فأحسن إليهن كن له سترا من النار","s":"متفق عليه عن عائشة","v":3,"p":278,"d":0,"c":"الستر هنا بمعنى البعد، فتربية هذه البنت تربية صالحة تبعدك عن النار."},{"t":"من أغلق بابا أو أرخى سترا فقد وجب المهر ووجبت العدة","s":"البيهقي في السنن الكبرى عن زرارة بن أوفى مرسلا","v":3,"p":278,"d":0,"c":"السّتارة ما يُستتر به من شيء كائنا ما كان. وقال أبو حنيفة وأصحابه: إذا خلا بها خلوة صحيحة يجب كامل المهر والعدة، دخل بها أو لم يدخل بها."},{"t":"من كشف خمار امرأة ونظر إليها فقد وجب الصداق، دخل بها أو لم يدخل بها","s":"رواه الدارقطني عن محمد بن عبد الرحمن بن ثوبان","v":3,"p":278,"d":0},{"t":"إذا أغلق بابا وأرخى سترا ورأى عورة فقد وجب الصداق وعليها العدة ولها الميراث","s":"أثر عن عمر، رواه الدارقطني في سننه","v":3,"p":278,"d":0},{"t":"إذا أغلق بابا وأرخى سترا أو رأى عورة فقد وجب الصداق","s":"أثر عن علي، رواه الدارقطني في سننه","v":3,"p":278,"d":0},{"t":"تعوذوا بالله من ثلاث فواقر: جار سوء إن رأى خيرا كتمه وإن رأى شرا أذاعه، وزوجة سوء إن دخلت عليها لسنتك وإن غبت عنها خانتك، وإمام سوء إن أحسنت لم يقبل وإن أسأت لم يغفر","s":"أخرجه البيهقي في شعب الإيمان من حديث أبي هريرة","v":3,"p":279,"d":0,"c":"الستير في حق الله تعالى كثير الستر لعيوب عباده، أما الإنسان العادي فمن شأنه أن يظهر القبيح."},{"t":"إني أكره المرأة تخرج من بيتها تجر ذيلها تشكو على زوجها","s":"رواه الطبراني في الأوسط والكبير من حديث أم سلمة","v":3,"p":280,"d":0,"c":"المرأة المؤمنة لا تفضح زوجها، لا تنشر أحواله ولا تتحدث عن أفعاله بين الناس، لا تعطي الناس أسوأ صورة عن زوجها، المرأة المؤمنة ستيرة."},{"t":"لا ينظر الله تبارك وتعالى إلى امرأة لا تشكر لزوجها وهي لا تستغني عنه","s":"رواه الطبراني والحاكم والبيهقي عن عبد الله بن عمرو","v":3,"p":280,"d":0},{"t":"لا تؤذي امرأة زوجها في الدنيا إلا قالت زوجته من الحور العين: لا تؤذيه قاتلك الله، فإنما هو عندك دخيل يوشك أن يفارقك إلينا","s":"رواه الترمذي عن معاذ بن جبل","v":3,"p":281,"d":0},{"t":"أراك لا تستحيي من ربك، خذ أجرتك لا حاجة لنا بك","s":"رواه عبد الرزاق في مصنفه عن ابن جريج","v":3,"p":282,"d":0,"c":"الإسلام أمر بالتستر في مواضع، منها التستر عند الغسل، وعند اللقاء الزوجي، وعند قضاء الحاجة. (قاله النبي ﷺ لأجير رآه يغتسل عريانا بالبراز لا يستتر بستر)"},{"t":"كل أمتي معافى إلا المجاهرين، وإن من المجاهرة أن يعمل الرجل بالليل عملا ثم يصبح وقد ستره الله عليه فيقول: يا فلان عملت البارحة كذا وكذا، وقد بات يستره ربه ويصبح يكشف ستر الله عنه","s":"متفق عليه عن أبي هريرة","v":3,"p":282,"d":0,"c":"كلما ازداد إيمانك ازداد التستر، وكلما بعد المرء عن الإيمان تفلت من الستر."},{"t":"تعالوا بايعوني على ألا تشركوا بالله شيئا ولا تسرقوا ولا تزنوا ولا تقتلوا أولادكم ولا تأتوا ببهتان تفترونه بين أيديكم وأرجلكم ولا تعصوا في معروف، فمن وفى منكم فأجره على الله، ومن أصاب من ذلك شيئا فعوقب في الدنيا فهو كفارة له، ومن أصاب من ذلك شيئا فستره الله فأمره إلى الله إن شاء عاقبه وإن شاء عفا عنه","s":"رواه البخاري عن عبادة بن الصامت","v":3,"p":284,"d":0,"c":"لو أن إنسانا اقترف معصية فليس مكلفا أن يبلغ عن هذه المعصية أحدا، فإذا لم يكتشف أحد هذا الذنب فمعنى ذلك أن الله أسبل عليه ستره. أنت لست مكلفا أن تفضح نفسك ما دام الله قد سترك."},{"t":"المسلم أخو المسلم لا يظلمه ولا يسلمه، ومن كان في حاجة أخيه كان الله في حاجته، ومن فرج عن مسلم كربة فرج الله عنه كربة من كربات يوم القيامة، ومن ستر مسلما ستره الله يوم القيامة","s":"رواه البخاري عن ابن عمر","v":3,"p":285,"d":0,"c":"إذا تفضل الله عز وجل بستره على عبد في الدنيا فإن هذا الستر يستمر إلى يوم القيامة."},{"t":"يا هزال، لو سترته بثوبك كان خيرا لك","s":"رواه أحمد عن نعيم بن هزال","v":3,"p":285,"d":0,"c":"هذا الذي قاله النبي ﷺ لهزال عن إنسان زنى. فهذا حكم شرعي، ليس القصد أن تقطع الأيدي ولا أن يجلد الناس، فالقصد أن تكون الحدود الشرعية رادعة للمسلمين."},{"t":"لا تؤذوا عباد الله ولا تعيروهم ولا تطلبوا عوراتهم، فإنه من طلب عورة أخيه المسلم طلب الله عورته حتى يفضحه في بيته","s":"رواه الإمام أحمد عن ثوبان","v":3,"p":287,"d":0,"c":"هؤلاء يتتبعون عورات الناس... من تتبع عورة أخيه المسلم تتبع الله عورته حتى يفضحه في عقر داره."},{"t":"أتتني امرأة تبتاع تمرا فقلت: إن في البيت تمرا أطيب منه، فدخلت معي في البيت فأهويت إليها فقبلتها، فأتيت أبا بكر فذكرت ذلك له فقال: استر على نفسك وتب ولا تخبر أحدا، فلم أصبر فأتيت عمر فذكرت ذلك له فقال: استر على نفسك وتب ولا تخبر أحدا، فلم أصبر فأتيت رسول الله ﷺ فذكرت ذلك له فقال: أخلفت غازيا في سبيل الله في أهله بمثل هذا؟ حتى تمنى أنه لم يكن أسلم إلا تلك الساعة حتى ظن أنه من أهل النار. قال: وأطرق رسول الله ﷺ طويلا حتى أوحى الله إليه: وأقم الصلاة طرفي النهار إلى قوله: ذلك ذكرى للذاكرين","s":"سنن الترمذي، عن أبي اليسر","v":3,"p":287,"d":0,"c":"أمر النبي ﷺ أن يستر الإنسان ذنبه، كما في حديث أبي اليسر."},{"t":"اللهم إني أسألك العافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عورتي وآمن روعتي، اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي","s":"رواه أبو داود عن ابن عمر","v":3,"p":287,"d":0},{"t":"كفى بالمرء كذبا أن يحدث بكل ما سمع","s":"رواه مسلم عن حفص بن عاصم","v":3,"p":288,"d":0,"c":"المؤمن الصافي حينما يسمع قصة ويكتمها يشعر بسعادة لا يعلمها إلا الله."},{"t":"إذا حدث الرجل بالحديث ثم التفت فهي أمانة","s":"أبو داود والترمذي عن جابر بن عبد الله","v":3,"p":288,"d":0,"c":"النبي ﷺ يعلمنا أن إنسانا يحدثك بحديث ولم يقل لك: هذا الحديث أمانة، لكن سمع خطوة نعال وراءه مثلا فالتفت، فالتفاتته تعني أن هذا الحديث أمانة لا ينبغي نشره."},{"t":"المجالس بالأمانة","s":"أبو داود وأحمد عن جابر بن عبد الله","v":3,"p":288,"d":0},{"t":"من حسن إسلام المرء تركه ما لا يعنيه","s":"سنن الترمذي","v":3,"p":289,"d":0}],"84":[{"t":"غلا السعر على عهد رسول الله ﷺ، فقالوا: يا رسول الله سعر لنا، فقال: إن الله هو المسعر القابض الباسط الرازق، وإني لأرجو أن ألقى الله وليس أحد منكم يطلبني بمظلمة في دم ولا مال","s":"رواه الترمذي عن أنس","v":3,"p":319,"d":1},{"t":"إن الله تبارك وتعالى إذا كان يوم القيامة ينزل إلى العباد ليقضي بينهم وكل أمة جاثية، فأول من يدعو به رجل جمع القرآن ورجل يقتتل في سبيل الله ورجل كثير المال، فيقول الله للقارئ: ألم أعلمك ما أنزلت على رسولي؟ قال: بلى يا رب. قال: فماذا عملت فيما علمت؟ قال: كنت أقوم به آناء الليل وآناء النهار. فيقول الله له: كذبت، وتقول له الملائكة: كذبت، ويقول الله: بل أردت أن يقال إن فلانا قارئ، فقد قيل ذاك. ويؤتى بصاحب المال فيقول الله له: ألم أوسع عليك حتى لم أدعك تحتاج إلى أحد؟ قال: بلى يا رب. قال: فماذا عملت فيما آتيتك؟ قال: كنت أصل الرحم وأتصدق. فيقول الله له: كذبت، وتقول له الملائكة: كذبت، ويقول الله تعالى: بل أردت أن يقال فلان جواد، فقد قيل ذاك. ويؤتى بالذي قتل في سبيل الله فيقول الله له: في ماذا قتلت؟ فيقول: أمرت بالجهاد في سبيلك فقاتلت حتى قتلت. فيقول الله تعالى له: كذبت، وتقول له الملائكة: كذبت، ويقول الله: بل أردت أن يقال فلان جريء، فقد قيل ذاك. ثم ضرب رسول الله ﷺ على ركبتي فقال: يا أبا هريرة، أولئك الثلاثة أول خلق الله تسعر بهم النار يوم القيامة","s":"أخرجه مسلم والترمذي والنسائي عن أبي هريرة","v":3,"p":320,"d":0},{"t":"لا يزيد في العمر إلا البر، ولا يرد القدر إلا الدعاء، وإن الرجل ليحرم الرزق بالذنب يصيبه","s":"رواه ابن ماجه عن ثوبان","v":3,"p":325,"d":0,"c":"أما المعاصي فتؤدي إلى الجفاف، وكلما قل ماء الحياء قل ماء السماء. والرزق كما قال عنه النبي ﷺ في حديث ثوبان."},{"t":"جاء رجل إلى رسول الله ﷺ فقال: يا رسول الله سعر، فقال: بل أدعو","s":"أخرجه أبو داود عن أبي هريرة","v":3,"p":327,"d":0},{"t":"اللهم اغفر لي وارحمني واهدني وعافني وارزقني","s":"رواه مسلم عن أبي مالك الأشجعي عن أبيه","v":3,"p":327,"d":0,"c":"فكل دعاء بالرزق إنما هو دعاء باسم المسعر كأن تقول: اللهم ارزقني."},{"t":"اللهم ارزقني حبك وحب من ينفعني حبه عندك، اللهم ما رزقتني مما أحب فاجعله قوة لي فيما تحب، اللهم وما زويت عني مما أحب فاجعله فراغا لي فيما تحب","s":"","v":3,"p":327,"d":0,"c":"فكل دعاء بالرزق إنما هو دعاء باسم المسعر كأن تقول: اللهم ارزقني."},{"t":"رحم الله رجلا سمحا إذا باع وإذا اشترى وإذا اقتضى","s":"أخرجه البخاري عن جابر بن عبد الله","v":3,"p":328,"d":0},{"t":"التاجر الأمين الصدوق مع النبيين والصديقين والشهداء","s":"أخرجه الترمذي عن أبي سعيد الخدري","v":3,"p":328,"d":0,"c":"التاجر يحقق لك أكبر حاجة في حياتك؛ موادك الأولية، طعامك، شرابك، ثيابك، فهذا الذي يقدمها لك بنوعية جيدة وبسعر معتدل هو داعية إلى الله دون أن يشعر."}],"91":[{"t":"إذا حكمتم فاعدلوا، وإذا قتلتم فأحسنوا، فإن الله عز وجل محسن يحب الإحسان","s":"رواه الطبراني من حديث أنس","v":3,"p":403,"d":1},{"t":"الإحسان أن تعبد الله كأنك تراه","s":"رواه مسلم عن عمر","v":3,"p":407,"d":0,"c":"أفضل حالة من حالات المؤمن أن تشعر أن الله معك."},{"t":"استحيوا من الله حق الحياء. قال: قلنا: يا رسول الله إنا نستحيي والحمد لله. قال: ليس ذاك، ولكن الاستحياء من الله حق الحياء أن تحفظ الرأس وما وعى، والبطن وما حوى، ولتذكر الموت والبلى، ومن أراد الآخرة ترك زينة الدنيا، فمن فعل ذلك فقد استحيا من الله حق الحياء","s":"رواه الترمذي عن عبد الله بن مسعود","v":3,"p":407,"d":0,"c":"حينما تشعر أن الله معك وأن الله يراقبك فهذه درجة من الإيمان عالية جدا، وحينما تشعر أن علم الله يطولك وأن قدرته تطولك فلا يمكن أن تعصيه، بل تكون عندئذ محسنا."},{"t":"إن الله يحب من العبد إذا عمل عملا أن يتقنه","s":"الجامع الصغير بسند حسن عن عائشة","v":3,"p":409,"d":0,"c":"ومن معاني الإحسان الإتقان."},{"t":"إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبح، وليحد أحدكم شفرته، وليرح ذبيحته","s":"رواه مسلم في صحيحه عن شداد بن أوس","v":3,"p":409,"d":0,"c":"الإحسان مطلوب حتى مع الحيوانات وحتى لو اضطررت لقتلها فيجب أن تكون محسنا، فالتعذيب ممنوع."},{"t":"اللهم أحسنت خلقي فأحسن خلقي","s":"رواه أحمد عن ابن مسعود","v":3,"p":411,"d":0}],"78":[{"t":"إن لله تسعة وتسعين اسما، مائة إلا واحدا، لا يحفظها أحد إلا دخل الجنة، وهو وتر يحب الوتر","s":"أخرجه البخاري ومسلم والترمذي عن أبي هريرة","v":3,"p":251,"d":1},{"t":"وإن الله وتر يحب الوتر","s":"رواه مسلم عن أبي هريرة","v":3,"p":251,"d":1},{"t":"إن الله وتر يحب الوتر، فأوتروا يا أهل القرآن","s":"رواه الترمذي من حديث علي","v":3,"p":251,"d":1},{"t":"لكل شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه وما أخطأه لم يكن ليصيبه","s":"أخرجه الإمام أحمد عن أبي الدرداء","v":3,"p":254,"d":0,"c":"لا يمكن أن يلتقي فرد من بني البشر مع فرد آخر إلا بإذن الله، لا يسمح الله لدواء أن يؤثر في الإنسان إلا بإذن الله، لا يسمح لهذا العقرب أن يلدغ إنسانا إلا بإذن الله."},{"t":"اللهم أعز الإسلام بأحب هذين الرجلين إليك: بأبي جهل أو بعمر بن الخطاب","s":"رواه الترمذي عن ابن عمر","v":3,"p":255,"d":0,"c":"الله يحب الوتر، فيحب أن تكون متفوقا، والنبي ﷺ طلب النخبة، طلب التفوق."},{"t":"يا بني، الناس ثلاثة: عالم رباني، ومستمع على سبيل نجاة، وهمج رعاع أتباع كل ناعق، لم يستضيئوا بنور العلم، ولم يلجؤوا إلى ركن وثيق، فاحذر أن تكون منهم","s":"أثر عن سيدنا علي","v":3,"p":256,"d":0,"c":"لا تكن إنسانا عاديا من الملايين، لا تكن إنسانا من الهمج الرعاع."},{"t":"تعس عبد الدينار والدرهم والقطيفة والخميصة، إن أعطي رضي وإن لم يعط لم يرض","s":"رواه البخاري عن أبي هريرة","v":3,"p":256,"d":0,"c":"لا تكن مع الملايين التي غفلت عن الله، لا تكن مع الملايين التي عبدت المال من دون الله."},{"t":"إذا جاءكم من ترضون دينه وخلقه فأنكحوه، إلا تفعلوا تكن فتنة في الأرض وفساد كبير","s":"أخرجه الترمذي عن أبي حاتم المزني","v":3,"p":257,"d":0,"c":"إن وضعت العراقيل أمام الشباب في زواجهم فإياك أن تظن أنك توقف هذه الحاجة، بل تستمر ولكن في الحرام."}],"2":[{"t":"عجب ربنا عز وجل من قوم يقادون إلى الجنة في السلاسل","s":"رواه البخاري وأبو داود، واللفظ لأبي داود، عن أبي هريرة","v":1,"p":68,"d":1},{"t":"إن شئت أن أطبق عليهم الأخشبين؟ فقال النبي ﷺ: بل أرجو أن يخرج الله من أصلابهم من يعبد الله وحده لا يشرك به شيئا","s":"متفق عليه عن عائشة","v":1,"p":69,"d":0,"c":"أما الأنبياء فمصائبهم مصائب كشف، إذ هناك كمالات عندهم لا يمكن أن تظهر إلا عن طريق الشدائد، كما أن النبي ﷺ مشى على قدميه إلى الطائف ليدعو أهلها إلى الله فبالغوا بتكذيبه وبالسخرية منه، ثم مكنه الله من أن ينتقم منهم."},{"t":"كان يكثر أن يقول: يا مقلب القلوب ثبت قلبي على دينك وطاعتك. فقالت له عائشة: إنك تكثر أن تقول: يا مقلب القلوب ثبت قلبي على دينك وطاعتك. قال: وما يؤمنني وإنما قلوب العباد بين أصبعي الرحمن، إنه إذا أراد أن يقلب قلب عبد قلبه بين أصبعين من أصابع الله عز وجل","s":"مسند الإمام أحمد عن عائشة","v":1,"p":77,"d":0,"c":"فأنت حينما تتخذ قرارا حكيما في صالح إيمانك يشرح الله لك صدرك، وحينما تنحرف قليلا عن طريق الحق يملأ قلبك ضيقا وقلقا وحيرة؛ فالله يربينا عن طريق قلوبنا."},{"t":"أتيت النبي ﷺ في مرضه وهو يوعك وعكا شديدا، فقلت: إنك لتوعك وعكا شديدا، قلت: إن ذاك بأن لك أجرين؟ قال: أجل، ما من مسلم يصيبه أذى إلا حات الله عنه خطاياه كما تحات ورق الشجر","s":"أخرجه أحمد والبخاري عن عبد الله","v":1,"p":78,"d":0,"c":"هذه تربية الله لنا، وليعلم كل مؤمن أن المصائب كلها لو كُشفت حكمتها لكنتم في درجة من قبولها لا توصف."},{"t":"الناس ثلاثة: عالم رباني، ومتعلم على سبيل نجاة، وهمج رعاع أتباع كل ناعق، لم يستضيئوا بنور العلم ولم يلجؤوا إلى ركن وثيق","s":"قول سيدنا علي رضي الله عنه","v":1,"p":60,"d":0,"c":"إنسان رباني، أي: كل حياته محصورة في معرفة الله وذكره وخدمة عباده؛ فالرباني هو الذي لا يتحرك إلا وفق منهج الله."},{"t":"والله لو كشف الغطاء ما ازددت يقينا","s":"قول عامر بن عبد الله","v":1,"p":70,"d":0,"c":"والحقيقة أنك لن تكون على نحو يرضى الله عنك إلا إذا أيقنت بربوبيته لك."},{"t":"إذا أحب الله عبده عجل له بالعقوبة","s":"","v":1,"p":79,"d":0,"c":"فإذا كان الله يتابع الإنسان فمعنى ذلك أن الله يحبه وهو في العناية المشددة."},{"t":"إذا أحب الله عبده ابتلاه، فإن صبر اجتباه، فإن شكر اقتناه","s":"","v":1,"p":79,"d":0,"c":"فإذا كان الله يتابع الإنسان فمعنى ذلك أن الله يحبه وهو في العناية المشددة."}],"92":[{"t":"أذهب الباس رب الناس، اشف وأنت الشافي، لا شفاء إلا شفاؤك، شفاء لا يغادر سقما","s":"رواه مسلم عن عائشة","v":3,"p":413,"d":1},{"t":"ما خلق الله داء إلا وخلق له دواء","s":"","v":3,"p":415,"d":0,"c":"كذلك هذا الجسم حين تخالف منهج الله عز وجل المتمثل بتوجيهات النبي ﷺ في التعامل مع الجسم يمرض، وما خلق الله داء إلا وخلق له دواء."},{"t":"أولياء الله تعالى الذين إذا رؤوا ذكر الله تعالى","s":"الحكيم الترمذي بسند صحيح من حديث ابن عباس","v":3,"p":416,"d":0,"c":"ومعنى موصول أن القلب اصطبغ بصبغة الله، تجد أن من علامات المؤمن إذا رأيته تذكرت الله."},{"t":"تعاهد قلبك، انظر إلى قلبك على ماذا ينطوي","s":"من الأقوال الشهيرة لسيدنا عمر رضي الله عنه","v":3,"p":416,"d":0,"c":"إن أعلى درجات الإيمان أن تتعامل مع الله مباشرة وأن تنظر إلى الله عز وجل وهو ناظر إلى قلبك: هل فيه غل لأحد؟ وهل فيه حقد لأحد؟"},{"t":"لقد عشت برهة من دهري وإن أحدنا يؤتى الإيمان قبل القرآن وتنزل السورة على محمد ﷺ فيتعلم حلالها وحرامها وما ينبغي أن يقف عنده منها كما تعلمتم أنتم القرآن","s":"قول ابن عمر رضي الله عنهما","v":3,"p":422,"d":0,"c":"فإذا اتصلت بالله عز وجل وأقبلت عليه وقرأت القرآن كنت قريبا من المعاني التي أرادها الله عز وجل."},{"t":"كنا مع النبي ﷺ ونحن فتيان حزاورة فتعلمنا الإيمان قبل أن نتعلم القرآن فازددنا به إيمانا","s":"عن جندب بن عبد الله","v":3,"p":422,"d":0,"c":"فإذا اتصلت بالله عز وجل وأقبلت عليه وقرأت القرآن كنت قريبا من المعاني التي أرادها الله عز وجل، والقرآن مع ذلك لا تنقضي عجائبه."},{"t":"جاء رجل إلى النبي ﷺ فقال: إن أخي استطلق بطنه، فقال رسول الله ﷺ: اسقه عسلا. فسقاه، ثم جاءه فقال: إني سقيته عسلا فلم يزده إلا استطلاقا، فقال له ثلاث مرات، ثم جاءه الرابعة فقال: اسقه عسلا. فقال: لقد سقيته فلم يزده إلا استطلاقا. فقال رسول الله ﷺ: صدق الله وكذب بطن أخيك. فسقاه فبرأ","s":"عن أبي سعيد الخدري","v":3,"p":422,"d":0,"c":"قرأت مقالة علمية لطبيب متفوق في تحليل هذا الحديث أن الإسهالات الإنتانية يكون الدواء المناسب لها المواد السكرية، ففي بداية الأمر يزداد البطن إسهالا إلى أن تذهب هذه المواد التي سببت الإنتان."},{"t":"لما كان يوم بدر نظر رسول الله ﷺ إلى المشركين وهم ألف، وأصحابه ثلاثمئة وتسعة عشر رجلا، فاستقبل نبي الله ﷺ القبلة ثم مد يديه فجعل يهتف بربه: اللهم أنجز لي ما وعدتني، اللهم آت ما وعدتني، اللهم إن تهلك هذه العصابة من أهل الإسلام لا تعبد في الأرض. فما زال يهتف بربه مادا يديه مستقبل القبلة حتى سقط رداؤه عن منكبيه، فأتاه أبو بكر فأخذ رداءه فألقاه على منكبيه ثم التزمه من ورائه وقال: يا نبي الله كفاك مناشدتك ربك فإنه سينجز لك ما وعدك. فأنزل الله عز وجل: إذ تستغيثون ربكم فاستجاب لكم أني ممدكم بألف من الملائكة مردفين. فأمده الله بالملائكة","s":"رواه مسلم عن عمر بن الخطاب","v":3,"p":423,"d":0,"c":"كان النبي ﷺ متأدبا مع الله أشد التأدب، وكان يخشى أن يكون هناك تقصير في الإعداد، وهو يعلم أن الأمر بيد الله."},{"t":"من طلب العلم ليجاري به العلماء أو ليماري به السفهاء أو ليصرف وجوه الناس إليه أدخله الله النار","s":"","v":3,"p":424,"d":0,"c":"دعوت إلى الله فلم تنجح معك الدعوة، أمعن النظر في نياتك."},{"t":"من أوتي القرآن فظن أن أحدا أوتي خيرا منه فقد حقر ما عظمه الله","s":"","v":3,"p":425,"d":0,"c":"فالذي يؤتى القرآن تلاوة وفهما وتفسيرا وتطبيقا فقد بلغ قمة المجد."},{"t":"كان خلقه القرآن","s":"رواه مسلم عن عائشة","v":3,"p":425,"d":0,"c":"السيدة عائشة سئلت عن أخلاق النبي ﷺ فقالت: كان خلقه القرآن. تابع هذه الآيات تجد أنها أخلاق عباد الرحمن فتخلق بأخلاقهم."},{"t":"لكل داء دواء، فإذا أصيب دواء الداء برأ بإذن الله عز وجل","s":"رواه مسلم من حديث جابر بن عبد الله","v":3,"p":426,"d":0,"c":"المؤمن لا يترك الأخذ بأسباب الشفاء لأن الشافي جل جلاله قد أمره باتخاذ الأسباب، إلا أنه يأخذ بها دون أن يعتمد عليها. وهذا الحديث وحده يعد من أعظم الأحاديث الشريفة لأنه ذو صلة بكل الأمراض قاطبة."},{"t":"اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولني فيمن توليت","s":"رواه الأربعة عن الحسن بن علي","v":3,"p":427,"d":0,"c":"شفاء الجسد مريح في الحياة الدنيا، لكن شفاء القلب سبب سعادة المرء إلى أبد الآبدين. ومن هنا تتجلى أهمية هذا الدعاء الشريف."},{"t":"واجعله الوارث منا","s":"رواه الترمذي من حديث ابن عمر","v":3,"p":427,"d":0,"c":"أنا لا أقلل من قيمة شفاء الجسم لأن الإنسان يحيا بهذا الجسد، ولكن شفاء القلب قمة أنواع الشفاء."}],"110":[{"t":"سددوا وقاربوا، واعلموا أن لن يدخل أحدكم عمله الجنة، وأن أحب الأعمال إلى الله أدومها وإن قل","s":"صحيح البخاري عن عائشة","v":4,"p":179,"d":0,"c":"فلو ثبتَّ على المجيء لحضور درس ما من دروس العلم لتراكمت لديك الحقائق، وإذا ثبتَّ على صلاة أو على صدقة أو ذكر أو تلاوة... فأحب الأعمال إلى الله أدومها وإن قل."},{"t":"اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم اصحبنا في سفرنا واخلفنا في أهلنا","s":"","v":4,"p":181,"d":0,"c":"قد يسافر الإنسان؛ فهل في الأرض جهة يمكن أن ترافقه وأن تخلفه في بيته وسفره معا وفي وقت واحد؟ مستحيل ذلك إلا على الله."},{"t":"إن هذا القرآن المجيد عند الله في لوح محفوظ، ينزل منه ما يشاء على من يشاء من خلقه","s":"قول الإمام الحسن البصري","v":4,"p":184,"d":0,"c":"فاللوح المحفوظ يضم المبادئ العظمى والسنن الكبرى التي يتعامل الله بها مع خلقه."},{"t":"إني لأبغض المرأة تخرج من بيتها تجر ذيلها تشكو زوجها","s":"الطبراني عن أم سلمة","v":4,"p":185,"d":0,"c":"فالمرأة المؤمنة تحفظ نفسها، وتحفظ مال زوجها، وتحفظ سر زوجها."},{"t":"المختلعات هن المنافقات","s":"عن ثوبان عن النبي ﷺ","v":4,"p":186,"d":0,"c":"المؤمنة تحفظ نفسها، وتحفظ زوجها، وتحفظ مال زوجها، وتحافظ على سمعته وكرامته من خلال حشمتها وصونها لذاتها."},{"t":"أيما امرأة اختلعت من زوجها من غير بأس لم ترح رائحة الجنة","s":"سنن الترمذي","v":4,"p":186,"d":0,"c":"المؤمنة تحفظ نفسها، وتحفظ زوجها، وتحفظ مال زوجها، وتحافظ على سمعته وكرامته من خلال حشمتها وصونها لذاتها."},{"t":"لا ينظر الله تبارك وتعالى إلى امرأة لا تشكر لزوجها وهي لا تستغني عنه","s":"رواه النسائي في الكبرى عن ابن عمرو","v":4,"p":186,"d":0,"c":"المؤمنة تحفظ نفسها، وتحفظ زوجها، وتحفظ مال زوجها، وتحافظ على سمعته وكرامته."},{"t":"خير النساء التي إذا نظرت إليها سرتك، وإذا أمرتها أطاعتك، وإذا غبت عنها حفظتك في نفسها ومالك. قال: وتلا هذه الآية: الرجال قوامون على النساء","s":"أخرجه أبو داود الطيالسي في مسنده عن أبي هريرة","v":4,"p":186,"d":0,"c":"فأرقى صفة في المرأة أنها تحفظ زوجها، تحفظ عرضها في غيبة زوجها، وتحفظ مال زوجها في غيبته، وتحفظ سر زوجها، وتحفظ نفسها."},{"t":"من كانت له حاجة إلى الله أو إلى أحد من خلقه فليتوضأ وليصل ركعتين، ثم ليقل: لا إله إلا الله الحليم الكريم، سبحان الله رب العرش العظيم، الحمد لله رب العالمين، اللهم إني أسألك موجبات رحمتك وعزائم مغفرتك، والغنيمة من كل بر والسلامة من كل إثم، أسألك ألا تدع لي ذنبا إلا غفرته ولا هما إلا فرجته ولا حاجة هي لك رضا إلا قضيتها لي، ثم يسأل الله من أمر الدنيا والآخرة ما شاء فإنه يقدر","s":"سنن ابن ماجه من حديث عبد الله بن أبي أوفى","v":4,"p":186,"d":0,"c":"ما منا واحد إلا ويتمنى أن يحفظه الله، إلا أن النبي ﷺ كان أديبا مع الله، كان يدعو ويقول."},{"t":"احفظ الله يحفظك، إذا سألت فاسأل الله، وإن استعنت فاستعن بالله","s":"","v":4,"p":187,"d":0,"c":"والحفظ له موجبات؛ احفظ الله يحفظك، هذا هو أهم ما في البحث الذي نحن بصدده. أما الأساس فهو أنك لن تستطيع أن تصل إلى حفظ الله عز وجل إلا إذا حفظت أمره."}],"113":[{"t":"إن رحمتي سبقت غضبي","s":"","v":4,"p":228,"d":0,"c":"ما الذي يؤخر إنزال العقوبات الحاسمة؟ هو رحمة الله عز وجل؛ يعني كأن الله عز وجل يعطي الناس فرصة ليتوبوا وليرجعوا وليصححوا وليستغفروا."},{"t":"إن عبدا خيره الله بين أن يؤتيه من زهرة الدنيا ما شاء وبين ما عنده، فاختار ما عنده. فبكى أبو بكر وقال: فديناك بآبائنا وأمهاتنا","s":"رواه البخاري عن أبي سعيد الخدري","v":4,"p":234,"d":0,"c":"كأن لسان حال الصابر يقول: يا رب أصبر في الدنيا ولا أصبر في الآخرة؛ القضية في الدنيا مقبولة، أما في الآخرة فالخزي لا يحتمل. والنبي ﷺ قبيل وفاته وقف بين أصحابه وخطب خطبة مؤثرة."},{"t":"قلت: يا رسول الله ألا تستعملني؟ قال: فضرب بيده على منكبي ثم قال: يا أبا ذر إنك ضعيف، وإنها أمانة، وإنها يوم القيامة خزي وندامة، إلا من أخذها بحقها وأدى الذي عليه فيها","s":"رواه مسلم وأحمد عن أبي ذر","v":4,"p":234,"d":0,"c":"الفضيحة في الدنيا أهون؛ أنت ساكن في مدينة، في حي من الأحياء هناك من يعرفك وهم قلة، أما على رؤوس الأشهاد إذ يقف هؤلاء الفساق والفجار مواقف الخزي والعار."},{"t":"ثكلتك أمك يا ابن الخطاب، أجبار في الجاهلية خوار في الإسلام؟","s":"قول أبي بكر الصديق رضي الله عنه لعمر في شأن بعث أسامة (كتب السيرة)","v":4,"p":233,"d":0,"c":"لماذا صبر سيدنا عمر على أخذ الصديق بلحيته وهزه هزا شديدا؟ لأنه فهم عن سيدنا الصديق مراده البعيد."},{"t":"أتفر من قضاء الله؟ قال: نعم، أفر من قضاء الله إلى قضاء الله","s":"عن عمر بن الخطاب رضي الله عنه في شأن طاعون الشام","v":4,"p":236,"d":0,"c":"إن كان من قضاء الله وقدره فالحل يتم بقضاء الله وقدره كذلك. فإذا أمكن علاج الابن عند طبيب فلا يجوز الاستسلام بحجة أنه صابر، فحين لا تملك حيلة فعندئذ أنت معذور."},{"t":"اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس","s":"الطبراني في الدعاء من حديث عبد الله بن جعفر","v":4,"p":236,"d":0,"c":"لقد اجتهد حينما خرج من مكة إلى الطائف لعلهم يؤمنون؛ لكنه شكا قلة حيلته. إذا أمكنك الحركة فيجب أن تتحرك، إلا أنك حينما تفقد الحيلة يأتي دور الصبر؛ إذا الصبر يأتي حين تنعدم الحيلة."},{"t":"الحمد لله ثلاثا: الحمد لله إذ لم تكن في ديني، والحمد لله إذ لم تكن أكبر منها، والحمد لله إذ ألهمت الصبر عليها","s":"قول سيدنا عمر رضي الله عنه إذا أصابته مصيبة","v":4,"p":237,"d":0,"c":"سيدنا عمر أشار إلى أن الصبر نعمة من نعم الله الكبرى."},{"t":"الإيمان نصفان؛ نصف في الصبر ونصف في الشكر","s":"","v":4,"p":237,"d":0,"c":"الإيمان كله صبر."},{"t":"سئل: ما الإيمان؟ قال: السماحة والصبر","s":"أخرجه أحمد في مسنده من حديث عبادة بن الصامت","v":4,"p":237,"d":0,"c":"الإيمان هو الصبر والسماحة؛ الصبر سلبي والسماحة إيجابية: أن تصبر عن المعصية، وأن تصبر على الطاعة، وأن تصبر على الأمر التكويني."},{"t":"جاء رجل إلى النبي ﷺ فقال: يا رسول الله أي الدعاء أفضل؟ قال: سل ربك العفو والعافية في الدنيا والآخرة. ثم أتاه في اليوم الثاني فقال: يا رسول الله أي الدعاء أفضل؟ قال: سل ربك العفو والعافية في الدنيا والآخرة. ثم أتاه في اليوم الثالث فقال: يا نبي الله أي الدعاء أفضل؟ قال: سل ربك العفو والعافية في الدنيا والآخرة، فإذا أعطيت العفو والعافية في الدنيا والآخرة فقد أفلحت","s":"رواه الترمذي عن أنس بن مالك","v":4,"p":239,"d":0,"c":"لا بد من التنويه إلى أن المؤمن يجب أن يطلب من الله العافية، وهذا مأخوذ من رسول الله ﷺ."},{"t":"إن لم يكن بك غضب علي فلا أبالي، غير أن عافيتك أوسع لي","s":"الطبراني في الدعاء من حديث عبد الله بن جعفر","v":4,"p":239,"d":0,"c":"وفي الطائف قال ﷺ هذا الدعاء؛ فسل ربك العفو والعافية في الدنيا والآخرة."}],"15":[{"t":"يا أيها الناس اربعوا على أنفسكم، فإنكم لا تدعون أصم ولا غائبا، إنه معكم، إنه سميع قريب، تبارك اسمه وتعالى جده","s":"عن أبي موسى الأشعري (كنا مع رسول الله ﷺ، كنا إذا أشرفنا على واد هللنا وكبرنا وارتفعت أصواتنا)","v":1,"p":257,"d":1},{"t":"أفضل إيمان المرء أن يعلم أن الله معه حيث كان","s":"","v":1,"p":259,"d":0,"c":"حينما تشعر أن قرب الله قرب علم وأن قرب الله قرب قدرة، عندئذ لا يمكن أن تتجاوز أمره."},{"t":"الإحسان أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك","s":"مسلم عن عمر بن الخطاب","v":1,"p":259,"d":0,"c":"إن أعلى درجة من الإيمان أن تشعر أن الله معك، وأكبر ضمانة للاستقامة أن تشعر أن الله معك، وأكبر باعث على الخشية أن تشعر أن الله معك."},{"t":"الدعاء هو العبادة. وقرأ: وقال ربكم ادعوني أستجب لكم إن الذين يستكبرون عن عبادتي سيدخلون جهنم داخرين","s":"رواه الترمذي وقال حسن صحيح، عن النعمان بن بشير","v":1,"p":262,"d":0,"c":"الدعاء سلاح المؤمن، وأنت بالدعاء أقوى إنسان. والدعاء يحتاج إلى عناصر: أن توقن أنه تعالى موجود أولا، ويسمعك ثانيا، وهو قادر على تحقيق دعائك ثالثا، وهو يحبك رابعا."},{"t":"استحيوا من الله حق الحياء. قال: قلنا: يا رسول الله إنا نستحيي والحمد لله. قال: ليس ذاك، ولكن الاستحياء من الله حق الحياء أن تحفظ الرأس وما وعى، والبطن وما حوى، ولتذكر الموت والبلى، ومن أراد الآخرة ترك زينة الدنيا، فمن فعل ذلك فقد استحيا من الله حق الحياء","s":"أخرجه أحمد والترمذي والحاكم والبيهقي عن عبد الله بن مسعود","v":1,"p":264,"d":0,"c":"فإذا أيقنت أن الله قريب منك وأنه معك وأنه مطلع على سريرتك، لأنه يسمع دعاءك ويرى حركتك ويعلم ما في قلبك، لا بد من أن تستقيم على أمره."},{"t":"يا ملاذي عند كربتي، يا مؤنسي في وحشتي، اجعل نقمته علي بردا وسلاما كما جعلت النار بردا وسلاما على إبراهيم","s":"قول الحسن البصري حين دخل على الحجاج","v":1,"p":265,"d":0,"c":"دخل الحسن البصري إلى المجلس فإذا بالسياف وإذا بالنطع قد مد، فحرك شفتيه لأنه يشعر أن الله قريب منه، وإذا بالحجاج يختلف أمره."},{"t":"إن الله تعالى كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبحة، وليحد أحدكم شفرته وليرح ذبيحته","s":"رواه مسلم عن شداد بن أوس","v":1,"p":266,"d":0,"c":"إن كنت محسنا فأنت قريب من الله؛ الإحسان المطلق: أن تحسن في بيتك، أن تحسن إلى أولادك، أن تحسن إلى جيرانك، أن تحسن في عملك. الإحسان واسع جدا."}],"93":[{"t":"يا عائشة إن الله رفيق يحب الرفق، ويعطي على الرفق ما لا يعطي على العنف، وما لا يعطي على ما سواه","s":"رواه مسلم عن عائشة، وهو في صحيح البخاري ومسلم","v":3,"p":429,"d":1},{"t":"اللهم أنت الصاحب في السفر والخليفة في الأهل، اللهم اصحبنا بنصحك واقلبنا بذمة، اللهم ازو لنا الأرض وهون علينا السفر، اللهم إني أعوذ بك من وعثاء السفر وكآبة المنقلب","s":"رواه الترمذي وأبو داود عن أبي هريرة","v":3,"p":430,"d":0,"c":"ما من جهة يمكن أن تكون معك في سفرك وتستخلفها في بيتك إلا الله."},{"t":"اللهم الرفيق الأعلى","s":"متفق عليه عن عائشة (فكانت آخر كلمة تكلم بها)","v":3,"p":430,"d":1},{"t":"رحم الله عبدا سمحا إذا باع، سمحا إذا اشترى، سمحا إذا اقتضى","s":"صحيح البخاري عن جابر بن عبد الله","v":3,"p":432,"d":0,"c":"يحب الرفق في التعامل التجاري. ومن صفات المؤمن أنه رفيق لطيف، لين العريكة، يألف ويؤلف."},{"t":"إن الرفق لا يكون في شيء إلا زانه، ولا ينزع من شيء إلا شانه","s":"رواه مسلم عن عائشة","v":3,"p":432,"d":0,"c":"توصل إلى أهدافك بالرفق، انصح، عظ موعظة حسنة، جادل بالتي هي أحسن، لا تكن فظا غليظ القلب."},{"t":"من هذه؟ قالت: فلانة، تذكر من صلاتها. قال: مه، عليكم بما تطيقون، فوالله لا يمل الله حتى تملوا، وكان أحب الدين إليه ما داوم عليه صاحبه","s":"متفق عليه عن عائشة","v":3,"p":433,"d":0,"c":"قد يحمل الإنسان نفسه من العبادات ما لا يطيق. افعل من العبادات ما تستطيع أن تستمر عليه؛ أما هذا الذي يفور ثم يضعف فليس هذا من الحكمة."},{"t":"سددوا وقاربوا، واعلموا أن لن يدخل أحدكم عمله الجنة، وأن أحب الأعمال إلى الله أدومها وإن قل","s":"متفق عليه عن عائشة","v":3,"p":433,"d":0,"c":"افعل من العبادات ما تستطيع أن تستمر عليه؛ والاستمرار ينشأ عنه حالة اسمها التراكم، تراكم العبادات والأذكار والتلاوات، وهذه تقرب المرء من الله عز وجل."},{"t":"استوصوا بالنساء، فإن المرأة خلقت من ضلع، وإن أعوج شيء في الضلع أعلاه، فإن ذهبت تقيمه كسرته، وإن تركته لم يزل أعوج، فاستوصوا بالنساء","s":"متفق عليه عن أبي هريرة","v":3,"p":434,"d":0,"c":"إن أقرب الناس إليك زوجتك؛ هذه رفيقة العمر وشريكة العمر، ينبغي أن ترفق بها، إنها أولى الناس بحسن معاملتك."},{"t":"كان في مهنة أهله، فإذا حضرت الصلاة قام إلى الصلاة","s":"رواه البخاري عن عائشة، جوابا لسؤال الأسود: ما كان النبي ﷺ يصنع في أهله؟","v":3,"p":435,"d":0,"c":"كان يكنس داره ويرفو ثوبه ويحلب شاته، وكان في مهنة أهله، فمعاونة الزوجة برفق شيء رائع جدا."},{"t":"خيركم خيركم لأهله، وأنا خيركم لأهلي","s":"رواه الترمذي عن عائشة","v":3,"p":435,"d":0,"c":"بل إن النبي ﷺ جعل الخيرية في البيت."},{"t":"اللهم من ولي من أمر أمتي شيئا فشق عليهم فاشقق عليه، ومن ولي من أمر أمتي شيئا فرفق بهم فارفق به","s":"رواه مسلم عن عائشة","v":3,"p":436,"d":0,"c":"ومن الرفق أن ترفق بمن جعلهم الله تحت إمرتك؛ فلو كنت مديرا وتحت يدك عشرة موظفين، هؤلاء أتباعك وأنت موكل بهم."},{"t":"إن الله قد استخلفنا عن خلقه لنسد جوعتهم ونستر عورتهم، فإن وفيناهم ذلك تقاضيناهم شكرها، إن هذه الأيدي خلقت لتعمل، فإذا لم تجد في الطاعة عملا التمست في المعصية أعمالا، فاشغلها بالطاعة قبل أن تشغلك بالمعصية","s":"قول سيدنا عمر رضي الله عنه لوال أراد أن يمتحنه","v":3,"p":437,"d":0,"c":"ومن الرفق أن ترفق بمن جعلهم الله تحت إمرتك."}],"89":[{"t":"اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت المنان، بديع السماوات والأرض، ذو الجلال والإكرام، يا حي يا قيوم. فقال رسول الله ﷺ لأصحابه: أتدرون بم دعا؟ قالوا: الله ورسوله أعلم. قال: والذي نفسي بيده لقد دعا الله باسمه الأعظم، الذي إذا دعي به أجاب، وإذا سئل به أعطى","s":"سنن أبي داود من حديث أنس","v":3,"p":379,"d":1},{"t":"ألم تكونوا ضلالا فهداكم الله بي","s":"أخرجه الطبراني عن عبد الله بن عباس","v":3,"p":381,"d":0,"c":"ومن أخلاق المحسنين أنه لو ذكر إنسان فضله فإنه يقول: لله المنة والفضل. ولما قال النبي ﷺ للأنصار: ألم تكونوا ضلالا، لم يقل: فهديتكم، بل قال: فهداكم الله بي؛ والتواضع موقف موضوعي وليس موقف مجاملة."},{"t":"كنت ردف النبي ﷺ، قال: يا معاذ، هل تدري ما حق الله على العباد؟ قلت: الله ورسوله أعلم. فسألني ثانية وثالثة. قال: فإن حق الله على العباد أن يعبدوه. ثم قال: يا معاذ بن جبل. قلت: لبيك يا رسول الله وسعديك. قال: هل تدري ما حق العباد على الله إذا فعلوا ذلك؟ ... يا معاذ، حق العباد على الله إذا هم عبدوه ألا يعذبهم","s":"أخرجه البخاري ومسلم والترمذي عن معاذ بن جبل","v":3,"p":381,"d":0,"c":"أنت حينما تعبد الله تؤدي واجب العبودية، وهذا من حق الله عليك. كيف بإله عظيم يعطي إنسانا ضعيفا حقا عليه؟!"},{"t":"لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافرا منها شربة ماء","s":"أخرجه مسلم وأبو داود عن جابر بن عبد الله","v":3,"p":382,"d":0,"c":"أهم شيء أن عطاء الله الذي يليق بكرمه لا ينتهي عند الموت، بل يبدأ بعد الموت."},{"t":"أيها الملك، كنا قوما أهل جاهلية نعبد الأصنام، ونأكل الميتة، ونأتي الفواحش، ونقطع الأرحام، ونسيء الجوار، ويأكل القوي منا الضعيف، فكنا على ذلك حتى بعث الله إلينا رسولا منا نعرف نسبه وصدقه وأمانته وعفافه","s":"أخرجه الإمام أحمد في مسنده عن أم سلمة أم المؤمنين (قول سيدنا جعفر للنجاشي)","v":3,"p":383,"d":0,"c":"إن حدثك فهو صادق، إن عاملك فهو أمين، إن استثيرت شهوته فهو عفيف."},{"t":"تركت فيكم أمرين لن تضلوا ما تمسكتم بهما: كتاب الله وسنة رسوله","s":"أخرجه مالك عن مالك بن أنس","v":3,"p":383,"d":0,"c":"والحكمة هي السنة، ففي الكتاب تجد أحكاما كلية، وفي السنة تجد أحكاما تفصيلية."}],"46":[{"t":"وإن من البيان لسحرا","s":"رواه مالك وأحمد والبخاري وأبو داود والترمذي عن ابن عمر","v":2,"p":254,"d":0,"c":"البيان أرقى أداة اتصال بشري؛ فلو فرضنا دولة فيها نظام لكن ما فيها لغة، وأراد حاكمها أن يمنع التجول احتاج إلى شرطي لكل مواطن، لكنه يصدر بلاغا في أربع كلمات فلا تجد بعد ذلك إنسانا في الطريق."},{"t":"من سئل عن علم علمه ثم كتمه ألجم يوم القيامة بلجام من نار","s":"رواه الترمذي عن أبي هريرة","v":2,"p":261,"d":0,"c":"أن تكتم علما ولا تبين يعني أنك وقعت في كبيرة من الكبائر، فكتمان العلم أمر خطير. وقال العلماء: أمانة الأنبياء أمانة التبليغ، أما أمانة العلماء فأمانة التبيين."},{"t":"قد تركتكم على البيضاء ليلها كنهارها لا يزيغ عنها بعدي إلا هالك، ومن يعش منكم فسيرى اختلافا كثيرا، فعليكم بما عرفتم من سنتي وسنة الخلفاء الراشدين المهديين، وعليكم بالطاعة وإن عبدا حبشيا، عضوا عليها بالنواجذ، فإنما المؤمن كالجمل الأنف حيثما قيد انقاد","s":"رواه أحمد","v":2,"p":261,"d":0,"c":"للمؤمن ميزة قد يغفل عنها: أنت على الحق ومعك الدليل والحجة القاطعة، وأنت تستنير بنور من الله، وتقرأ الوحي الذي أنزل على النبي ﷺ."},{"t":"ما ملأ آدمي وعاء شرا من بطن، حسب الآدمي لقيمات يقمن صلبه، فإن غلبت الآدمي نفسه فثلث للطعام وثلث للشراب وثلث للنفس","s":"رواه ابن ماجه من حديث المقدام بن معدي كرب","v":2,"p":262,"d":0,"c":"استنبط أحد الأطباء من هذا الحديث أن للإنسان أن يشرب ما شاء مع الطعام، ثم ثبت علميا بعد سنوات أن شرب الماء مع الطعام يعين على الهضم؛ فالأصل هو الوحي، وكل شيء يخالف الوحي ففيه خطأ."},{"t":"يا عدي هل رأيت الحيرة؟ فإن طالت بك حياة لترين الظعينة ترتحل من الحيرة حتى تطوف بالكعبة لا تخاف أحدا إلا الله، ولئن طالت بك حياة لتفتحن كنوز كسرى، ولئن طالت بك حياة لترين الرجل يخرج ملء كفه من ذهب أو فضة يطلب من يقبله منه فلا يجد أحدا يقبله منه، وليلقين الله أحدكم يوم يلقاه وليس بينه وبينه ترجمان يترجم له فليقولن: ألم أبعث إليك رسولا فيبلغك؟ فيقول: بلى. فيقول: ألم أعطك مالا وأفضل عليك؟ فيقول: بلى، فينظر عن يمينه فلا يرى إلا جهنم، وينظر عن يساره فلا يرى إلا جهنم، اتقوا النار ولو بشق تمرة، فمن لم يجد فبكلمة طيبة","s":"رواه البخاري من حديث عدي بن حاتم","v":2,"p":270,"d":0,"c":"فتوكل على الله إنك على الحق المبين، وعلامة المؤمن الصادق لو أن الناس جميعا تنكروا للدين ولم يعبؤوا به ولم يلتزموا بتعاليمه، يكفيه أنه على الحق المبين."},{"t":"على رسلكما إنها صفية، إن الشيطان يجري من الإنسان مجرى الدم، وإني خشيت أن يقذف في قلوبكما سوءا","s":"رواه البخاري من حديث صفية","v":2,"p":272,"d":0,"c":"المؤمن يدعو الله تعالى باسمه المبين ويتخلق بهذا الاسم الجليل، فيبين العلم ولا يكتمه، ويبين للناس فلا يوقعهم في الشك والريبة."}],"119":[{"t":"إن قلوب بني آدم كلها بين إصبعين من أصابع الرحمن كقلب واحد يصرفه حيث يشاء، اللهم مصرف القلوب صرف قلوبنا على طاعتك","s":"رواه مسلم","v":4,"p":314,"d":0,"c":"الله جل جلاله هو الكامل، فمن فهم كلام الله عز وجل على غير الكمال الذي يليق بالله فهذا فهم خاطئ."},{"t":"طلب العلم فريضة على كل مسلم، وواضع العلم عند غير أهله كمقلد الخنازير الجوهر واللؤلؤ والذهب","s":"رواه ابن ماجه عن أنس بن مالك","v":4,"p":323,"d":0,"c":"فكلما ازددت معرفة بالله ارتاحت نفسك وانعقدت صلتك به، وكلما ابتعدت عن حسن الظن به صار حجاب بينك وبينه؛ فليس للإنسان عذر إن أساء الظن بالله أن يظل ساكتا، فقد حضنا الله على أن نسأل."}],"106":[{"t":"إن الله اختارني واختار لي أصحابا، واختار لي منهم أصهارا وأنصارا، فمن حفظني فيهم حفظه الله ومن آذاني فيهم آذاه الله","s":"رواه الخطيب البغدادي في تاريخه عن أنس","v":4,"p":115,"d":0,"c":"الاصطفاء فيه جانب كسبي وآخر وهبي؛ فالجانب الكسبي أن الله علم من بين خلقه أكثرهم معرفة وأكثرهم استقامة وتضحية وإيثارا وأكثرهم قربا وإقبالا، فاصطفاه وجعله نبيا."},{"t":"إذا سمعتم المؤذن فقولوا مثل ما يقول، ثم صلوا علي، فإنه من صلى علي صلاة صلى الله عليه بها عشرا، ثم سلوا الله لي الوسيلة، فإنها منزلة في الجنة لا تنبغي إلا لعبد من عباد الله وأرجو أن أكون أنا هو، فمن سأل لي الوسيلة حلت له الشفاعة","s":"رواه مسلم عن عبد الله بن عمرو بن العاص","v":4,"p":119,"d":0,"c":"أليس بعد النبي ﷺ علماء أجلاء، أليس هناك دعاة مخلصون وفقهاء ومحدثون؟ كل هؤلاء بالمعنى الواسع اصطفاهم الله وأجرى على أيديهم الخير وأنطق لسانهم بالحق، وجعل قلوب الناس تهفو إليهم؛ هذا نوع من الاصطفاء."},{"t":"اللهم ارزقني طيبا واستعملني صالحا","s":"ذكره الحكيم الترمذي في نوادر الأصول من حديث حنظلة","v":4,"p":125,"d":0,"c":"ما معنى واستعملني صالحا؟ أي: الله يصطفيك لعمل صالح. وما معنى الحكمة القائلة: إذا أردت أن تعرف مقامك فانظر فيم استعملك؟ يعني أن الله اصطفاك."}],"94":[{"t":"من يرد الله به خيرا يفقهه في الدين، والله المعطي وأنا القاسم، ولا تزال هذه الأمة ظاهرين على من خالفهم حتى يأتي أمر الله وهم ظاهرون","s":"عن معاوية رضي الله عنه","v":3,"p":439,"d":1},{"t":"ركب الملك من عقل بلا شهوة، وركب الحيوان من شهوة بلا عقل، وركب الإنسان من كليهما، فإن سما عقله على شهوته أصبح فوق الملائكة، وإن سمت شهوته على عقله أصبح دون الحيوان","s":"قال سيدنا علي رضي الله عنه","v":3,"p":440,"d":0,"c":"قبل حمل الأمانة كان المخلوق الأول تكريما وتكليفا؛ وبين أن تكون أرقى من الملائكة وأن يكون الإنسان الذي كفر بربه دون أحقر حيوان فرق كبير جدا."},{"t":"يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص ذلك من ملكي شيئا، يا عبادي لو أن أولكم وآخركم وإنسكم وجنكم قاموا في صعيد واحد فسألوني فأعطيت كل إنسان مسألته ما نقص ذلك مما عندي إلا كما ينقص المخيط إذا أدخل البحر، فمن وجد خيرا فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه","s":"رواه مسلم عن أبي ذر","v":3,"p":441,"d":0,"c":"فلا تعتب على أحد، بل لم نفسك على شدة تقصيرك."},{"t":"لكل شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه، وما أخطأه لم يكن ليصيبه","s":"أخرجه أحمد في مسنده عن أبي الدرداء","v":3,"p":442,"d":0,"c":"حين نؤمن أن كل شيء بقضاء من الله وقدر، وأن الإيمان بالقدر يذهب الهم والحزن، نكون قد عرفنا حقيقة العطاء."},{"t":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير، احرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا وكذا، ولكن قل: قدر الله وما شاء فعل، فإن لو تفتح عمل الشيطان","s":"رواه مسلم عن أبي هريرة","v":3,"p":442,"d":0,"c":"حين نؤمن أن كل شيء بقضاء من الله وقدر، وأن الإيمان بالقدر يذهب الهم والحزن، نكون قد عرفنا حقيقة العطاء."},{"t":"يا بني العلم خير من المال، لأن العلم يحرسك وأنت تحرس المال، والمال تنقصه النفقة والعلم يزكو على الإنفاق، يا بني مات خزان المال وهم أحياء، والعلماء باقون ما بقي الدهر، أعيانهم مفقودة وأمثالهم في القلوب موجودة","s":"قال سيدنا علي رضي الله عنه","v":3,"p":444,"d":0,"c":"في الإنسان حاجات سفلى وحاجات عليا، فالحاجة العليا الكبيرة هي طلب العلم؛ ومالم يطلب الإنسان العلم فإنه لا يرقى إلى مستوى إنسانيته."},{"t":"إن الله عز وجل يقول يوم القيامة: يا ابن آدم مرضت فلم تعدني، قال: يا رب كيف أعودك وأنت رب العالمين؟ قال: أما علمت أن عبدي فلانا مرض فلم تعده، أما علمت أنك لو عدته لوجدتني عنده؟ يا ابن آدم استطعمتك فلم تطعمني، قال: يا رب وكيف أطعمك وأنت رب العالمين؟ قال: أما علمت أنه استطعمك عبدي فلان فلم تطعمه، أما علمت أنك لو أطعمته لوجدت ذلك عندي؟ يا ابن آدم استسقيتك فلم تسقني، قال: يا رب كيف أسقيك وأنت رب العالمين؟ قال: استسقاك عبدي فلان فلم تسقه، أما إنك لو سقيته وجدت ذلك عندي","s":"أخرجه مسلم عن أبي هريرة","v":3,"p":445,"d":0,"c":"وهذا يؤكد أن الله عز وجل حين يأخذ من الإنسان بعض صحته فإنه يعوضه أضعافا مضاعفة من القرب والسكينة."},{"t":"لا مانع لما أعطيت، ولا معطي لما منعت","s":"","v":3,"p":445,"d":1},{"t":"هذا خالي، فليرني امرؤ خاله","s":"رواه الترمذي عن جابر بن عبد الله","v":3,"p":445,"d":0,"c":"سيدنا سعد بن أبي وقاص إذا دخل على النبي ﷺ كان يداعبه."},{"t":"ارم سعد فداك أبي وأمي","s":"أخرجه الشيخان عن علي بن أبي طالب","v":3,"p":446,"d":0,"c":"وبعد وفاة رسول الله ﷺ قال له عمر كلمة توحيد: يا سعد لا يغرنك أنه قد قيل خال رسول الله، فالخلق كلهم عند الله سواسية، ليس بينه وبينهم قرابة إلا طاعته."},{"t":"عجبا لأمر المؤمن إن أمره كله خير، وليس ذاك لأحد إلا للمؤمن، إن أصابته سراء شكر فكان خيرا له، وإن أصابته ضراء صبر فكان خيرا له","s":"رواه مسلم عن صهيب","v":3,"p":447,"d":0,"c":"يجب أن تؤمن إيمانا قطعيا أن المصائب نعم وعطاء، وأن الرضا بمكروه القضاء أرفع درجات اليقين، وأن المصائب تعني أنك ضمن رحمة الله."},{"t":"أعطوا الأجير أجره قبل أن يجف عرقه","s":"رواه ابن ماجه عن ابن عمر","v":3,"p":447,"d":0,"c":"لم يقل: أعطوه أجرا، بل أجره الذي يعادل جهده؛ أجره الذي يحقق له كرامته."},{"t":"إن لربك عليك حقا، ولنفسك عليك حقا، ولأهلك عليك حقا، فأعط كل ذي حق حقه. فأتى النبي ﷺ فذكر ذلك له فقال النبي ﷺ: صدق سلمان","s":"عن أبي جح
